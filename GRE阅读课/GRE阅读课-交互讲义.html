东西”，属于宏观。", "**逻辑类**：问“作者谈到某个信息（如某部作品）的目的是什么”——体现的是这个信息和最终答案之间的**逻辑关系**。", "**微观类**：问“从文章中可以推出，男人和女人的游行在哪个方面是相似的”——文章里谈到了一个 detail，把两者的共性体现出来。", "**逻辑推理类**：问“哪个选项如果正确，最能削弱这个 argument”。注意它的**假设是反转的**：其他所有阅读题都假设“文章信息正确，你用文章信息去得出选项”；而逻辑推理题恰好相反——看**选项如果正确，对原文有什么样的作用**。这只是逻辑推理的一种问法，后面还会呈现别的。"]}, {"type": "teach", "title": "③ 终极目标：忘掉分类", "ppt": ["真正上考场，第一件事不是分类，而是忘掉分类", "看山还是山，看水还是水：直接看懂问题→知道对应文章什么信息→直接做掉", "分类只是为了建立授课体系"], "text": ["通过题型课程，你要熟悉所有这些问法。但上了考场，**第一件事不是分类，而是忘掉分类**——看山还是山，看水还是水，回归本真。", "绝不是拿到一个问题先花五分钟想“这是什么题型”——而是直接看懂问题，就知道它对应文章的什么信息，直接做掉，忽略外在形式上的东西。", "接下来几讲逐个展开：宏观类（主题/结构/态度/观点/段意）→逻辑类→微观类→逻辑推理类。每种类型要熟悉三样：**问题的形式、问到的能力和原理、相应的做题方式**。"]}], "transcript": "这里是GRE阅读理解的第12节课，在这节课当中，我们将会继续题目理解这节课里，我们将会去探讨一下关于题型，也就是题目类型这个角度。而题型本身更多的时候是从问题的角度进行分类的。在之前的课程里，我们讲过问题以及选项。那么，这节课当中，我们将针对于问题本身进行一个分类，看一下这个问题可以分成什么样的角度。根据问题的角度以及它和文章的逻辑框架的对应，我们在课堂上把它分成如下几个类别，分别是宏观类。一个英文单词叫dressed，代表的是主旨，这个主旨呢，更多的时候偏向于文章的整体框架，所以这个主旨里可以包含文章的总论点。分论点结论以及这些论点的整体结合的结构，都可以叫做宏观类。接下来的话呢，有这些论点之间的关系，当然也有论点和论据之间的关系，等我们把这种题目叫做逻辑类的题。也就是说，通过常见的逻辑关系来帮忙解题的题型，我们把它归成逻辑类。第三种情况呢，叫做微观类。微观和宏观产生了一种对应性，那么宏观更多偏向于文章的论点和文章的框架。而微观也就是detail更多偏向于文章中的细节的理解，所以呢，我们就把文章分成了宏观，微观以及中间连接的逻辑，这么几个问法角度。当然，这是一种分类方式。其实，官方也会有其他的一些分类方法，那我们是根据文章的逻辑关系来产生了这么一些逻辑分类的或题型分类的方式。接下来还有一种类型的题目呢，叫做逻辑推理logical reasoning，这个题将会在最后给大家呈现出来，这种题目的话呢，在有一些分类的角度上也叫它逻辑单体。但是我们会根据这个题，在若干年前老句儿一理对它的命名方式，给它放在这里，而且不叫它逻辑单题，也是因为有的时候这个题可能不只是一篇文章考一道题。可能是一篇文章考两道，三道或四道题当中出现一个这样的问法，所以我们根据其能力把它叫做逻辑推理题。这样的话，在题型的部分，我们将会讲四大类型，每种类型我们要去熟悉一下这些问题的形式。知道这个问题，问到的能力和原理，以及找到相应的做题方式，当然通过这一个题型课程。你将会熟悉所有的这些问法，真正上了考场之后呢？第一件事并不是把它分类，而是从此你要忘掉分类，也就是到了那个时候，你看山还是山？看水还是水，回归到本真不是拿到一个问题之后，先花五分钟想一想哇，这是什么题型？不是这样，而是直接看懂问题，就知道它对应文章什么信息就。就直接做掉它，忽略掉了那些外在形式上的东西，这是我们最终想达到的结果。只是在这里分类是为了给大家建立一个我们授课的体系而已，我们可以简单看一下这些问题形式举出来的例子。好宏观类，比如说会问到文章的primary purpose，既然问到文章的主要目的，那就是问最大的东西了，所以这可以看作是宏观的类别。比如说逻辑的类别可以出现这样的问法，作者谈到这个信息主要的目的是什么？那就是说怎么样no feeling这个作品在文章中有它的作用，那体现的就是这个信息和我最终要填的那个答案。之间的这种关系。如果要是微观或细节的题目的话，会问到这样的情况，比如说能够推出来，在文章中，男人和女人的游行在哪方面是相似的，那文章中就可能谈到一个detail，把男人和女人游行的共性。体现出来。再比如说逻辑推理会有什么样的问法？下面哪个选项如果正确最能削弱这个argument？argument可以是论证论断。所以大家可以看到这个问题，本身就很特别。它的问题强调的是选项，如果正确，对于原文有什么样的作用，我们之前做到的所有其他类型的阅读题基本有一个假设。是文章信息正确，你用文章信息来得选项，但这个问题恰好是选项对于原文有什么样的影响？不过呢，这种类型的问法只是逻辑推理当中的一种问法，我们后面还有别的问法，所以到了讲逻辑推理这个部分的时候，我们再把所有的问题形式跟各位呈现一下。好，这就是所有的问题的形式，我们大概理解到接下来的课程，我们是从题型的角度来展开就可以了。"}, {"id": 14, "title": "第14讲 · 题型2：宏观类1（主题与结构）", "intro": "宏观类=问文章**总论点、分论点、结论或整体结构**的题，细分五种问法：**主题、结构、态度、观点、段落大意**。本讲攻下前两种：主题题（primary purpose）和结构题（organization）。核心方法：通读后对全文形成整体概括，再用**选项匹配**——正确答案的全部信息都要对，错一个细节就全错。7 篇文章、9 道真题实战。", "cards": [{"type": "teach", "title": "① 宏观类的五种问法", "ppt": ["主题：文章的主要目的是什么（本讲重点）", "结构：organization 文章/段落的组织结构（本讲重点）", "态度：主题中体现了作者态度 → attitude 问法", "观点：作者的观点或文中某人的观点", "段落大意：某段的分论点（下一讲）"], "text": ["回顾一下界定：问文章**总论点、分论点、结论、整体结构**的题都算宏观类。", "五种具体角度：①主题（主要目的）；②组织结构（organization）；③态度（主题中体现作者态度时的问法转换）；④观点（作者的或别人的——注意**视角**，某人观点也可以看作总论点或分论点）；⑤段落大意（=分论点）。", "本讲先讲**主题+结构**，下一讲讲态度、观点、段意。"]}, {"type": "teach", "title": "② 主题题：问法与做法", "ppt": ["常见问法：The primary purpose of the passage is to…（选项一定 to do 开头）/ The passage is primarily concerned with…", "做法：通读全文→逻辑梳理出整体概括→拿选项当辅助手段逐一匹配", "正确选项=全部信息都对；错一个信息=全错"], "text": ["问法识别：看到 **primary purpose** 或 **primarily concerned with**，就是问“这篇文章整体要干什么”。选项开头一定是**动词原形（to do）**——to do 就代表主要目的。", "做法：通读之后对文章形成**整体理解**（用之前讲的逻辑性把全文梳理出来），然后**以选项为辅助手段**，看哪个选项和文章大意对应得上。", "注意：你自己很难凭空概括出标准表述，所以是**拿文章信息去分析选项的对错**——把选项的每个部分都和文章对应，全对才行。"]}, {"type": "passage", "title": "实战一 · “民族国家”是个误称", "source": "课程实录 · 主题题", "text": "According to Hobsbawm and Ranger, the term “nation-state” is a misnomer: the ideal of a monolingual, monocultural state has never existed, not even in Europe, which invented the concept and introduced it to the rest of the world. Contemporary European states, they argue, emerged after the Renaissance through the rise of one ethnic group to political and economic dominance over other ethnic groups within a single political territory. The term “nation-state” thus blurs the internal cultural and linguistic diversity of these states, which could more accurately be called “conquest states.” The recent resurgence of multiple ethnic groups within a single state has not, Hobsbawm says, threatened the sovereignty of the state; rather, it is cultural diversity that threatens the belief in the very possibility of the nation-state."}, {"type": "q", "tag": "真题 · 主题题", "title": "第1题 · 文章的主要目的", "source": "实战一", "pause": "先通读全文，自己概括主题，再逐一看选项。", "stem": [{"t": "The primary purpose of the passage is to"}], "options": {"A": "discuss issues concerning a form of political organization by questioning the terminology used to refer to it", "B": "trace changes in a form of political organization by analyzing the evolution of the terminology used to refer to it", "C": "justify the continued use of an established term for a form of political organization", "D": "question the accuracy of a new term for a form of political organization", "E": "compare two terms used to refer to a form of political organization"}, "answer": "A", "explain": {"思路": "①文章第一句就是论点：nation-state 这个术语是误称；接下来整篇都在说**它为什么错**（欧洲都不存在单一语言文化的国家、术语模糊了内部多样性、准确叫法应是 conquest states）。②结构=质疑术语→探讨国家这种政治组织形式。A 完全对应。", "annot": "⚠️ 两个术语地位不对等：nation-state 从头谈到尾=核心；conquest states 只出现一次=类比对象（用正确叫法反衬旧术语之错），不是并列主角。", "辨析": "B 错在 trace changes/evolution——“追溯变化”要求文章按时间过程展开（先怎样、过几年又怎样），本文不是；evolution 顺带一记：达尔文 evolution 严谨译法是**演化**（变化无方向），“进化”的“进”字暗示变好，并不准确。C 错：文章是质疑传统术语，不可能 justify（支持）继续使用它。D 最大陷阱——“质疑术语”对、但 new term 错：nation-state 是欧洲人早就发明的旧术语，不是新术语；A 只给 terminology 不说是新是旧，恰好不犯这个错。E 错：compare two terms 要求两个术语同等重要，但 conquest states 只是类比对象。", "点拨": "选项的**每个信息片段**都要对。D 那种“大方向对、小信息错”的选项最害人——错一个 new，整个选项就废了。"}}, {"type": "passage", "title": "实战二 · 太阳能的两种储热方式", "source": "课程实录 · 主题题", "text": "Constant changes in the amount of sunlight available on Earth at any given location make energy storage a necessary design feature for terrestrial solar-energy systems — systems that transform solar energy into thermal energy. For such systems, heat can be stored in the form of either latent heat or sensible heat. Latent heat is absorbed or released whenever matter undergoes a change of phase; moreover, the temperatures at which such phase changes occur are usually destructive to storage materials. Sensible-heat storage, on the other hand, allows flexibility in operating temperature and is also safe."}, {"type": "q", "tag": "真题 · 主题题", "title": "第2题 · 文章的主要目的", "source": "实战二", "pause": "注意 moreover 和 on the other hand 两个路标。", "stem": [{"t": "The primary purpose of the passage is to discuss"}], "options": {"A": "the reasons for the necessity of developing solar-energy systems", "B": "different ways of storing solar energy as heat", "C": "new designs for devices that collect solar energy", "D": "the procedures for the transfer of thermal energy between materials", "E": "the different capacities of solids and liquids to store sensible heat"}, "answer": "B", "explain": {"思路": "①第一句给背景（阳光量不断变化→储能是必要的），第二句引出正题：热可存成 latent heat（潜热）或 sensible heat（显热）。②全文就是分述这两种方式各自的特点。B=两种方式，正确。", "annot": "结构路标：either…or 亮出两种方式 → moreover 并列补充潜热的缺点 → **on the other hand** 对比转到显热（灵活+安全）。潜热=latent（藏起来的，相变时吸放热）；显热=sensible（可感知的）。", "辨析": "A 的“必要性”只在第一句出现，且只讲了一个原因（阳光不稳定），不是全文重点，也不是 reasons 复数。C“新设计”文章没有。D“物质间热能转换的流程”只在讲潜热时涉及，是细节。E“固体液体存显热的能力差异”也是细节。", "点拨": "主题题的经典干扰项=**文章中正确但只是细节的选项**。判断标准：它能不能概括全文？细节对≠能当主题。"}}, {"type": "passage", "title": "实战三 · 岛屿生物多样性的用途之争", "source": "课程实录 · 主题题", "text": "MacArthur and Wilson have suggested that the biodiversity of an island is directly proportional to a function of the island's size and inversely proportional to a function of its distance from the mainland. Reduced biodiversity in an island context may require significant adaptation on the part of colonizing human populations. Evans argues that this limitation, and the adaptation it demands, makes islands ideal laboratories for the study of human adaptability to the natural environment. However, this limitation may potentially be offset by other factors: reduced biodiversity applies only to terrestrial resources, and a small island may possess specific nonbiological resources that can be exchanged with groups on other islands."}, {"type": "q", "tag": "真题 · 主题题", "title": "第3题 · 文章的主要目的", "source": "实战三", "pause": "找到 however——前后各是谁的看法？", "stem": [{"t": "The primary purpose of the passage is to"}], "options": {"A": "evaluate two contrasting approaches to island biodiversity", "B": "discuss the relevance of certain data pertaining to island biodiversity", "C": "question a particular understanding of island biodiversity", "D": "consider different reasons for the reduced biodiversity of islands", "E": "contrast large and small islands in terms of their biodiversity"}, "answer": "C", "explain": {"思路": "①前半篇=这帮人的观点：生物多样性低（正比于岛面积、反比于距大陆距离）→这种“限制”让岛成为研究人类适应性的理想实验室。②**However** 话锋一转：这个 limitation 可能被其他因素抵消——这才是作者站的地方。结构=亮出一种特定理解→质疑它。C 正确。", "annot": "作者观点不靠“我认为”出现，however 就是作者的立场标记。前面那些人的视角都不是作者要站的地方。", "辨析": "A 错：文章并没有“两种对比的方法”——一方观点+作者反驳 ≠ 两种平行方法。B“讨论数据的相关性”不是行文逻辑。D 错：若选它，文章应按“为什么、为什么”的原因角度展开，实际不是。E“对比大小岛”只是细节，非重点。", "点拨": "主旨永远跟着**作者的立场**走。前人的观点铺得再多，也只是被质疑的靶子。"}}, {"type": "passage", "title": "实战四 · 美洲何时有人类？澳大利亚的类比", "source": "课程实录 · 主题题 · 难点：类比论证", "text": "Some archaeologists speculate that the Americas might have been initially colonized before 25,000 years ago. To support this theory, however, it would be necessary to explain the absence of generally accepted habitation sites for that time interval in what is now the United States. Australia — which has a smaller land area than the United States — has many such sites, supporting the generally accepted claim that the continent was colonized by humans at least 40,000 years ago. Australia is less densely populated, and with its overall greater aridity it would have presented conditions less favorable for hunter-gatherer occupation; proportionally, at least as much land area has been lost from the coastal regions of Australia because of postglacial sea-level rise as in the United States, so any coastal archaeological record in Australia should have been depleted about as much as in the United States. Because there are so many resource-rich rivers leading inland from the United States coastlines, it seems improbable that a growing population would have confined itself to the coasts for thousands of years. If inhabitants had been present 25,000 years ago, the probability of their appearing in the archaeological record would seem greater than in Australia."}, {"type": "q", "tag": "真题 · 主题题", "title": "第4题 · 文章主要关注的是", "source": "实战四", "pause": "文章为什么突然讲澳大利亚？想清这个问题再做题。", "stem": [{"t": "The passage is primarily concerned with"}], "options": {"A": "presenting an objection to a claim", "B": "explaining an anomalous phenomenon", "C": "outlining an alternative explanation", "D": "correcting a misconception", "E": "questioning the validity of a comparison"}, "answer": "A", "explain": {"思路": "①首句：一些考古学家**猜测**美洲在 2.5 万年前就有人类。②作者：要支持这个理论，你得先解释为什么那个时段在美国**缺少公认的居住遗址**。③接下来全用澳大利亚做**类比（analogy）**：澳大利亚更小、更干旱、更不适宜狩猎采集，海平面上升对两国沿岸的侵蚀程度相当——可澳大利亚照样有大量遗址；美国沿岸还有这么多通向内陆的资源丰富的河流，人口不可能几千年都圈在沿岸。④结论：若当时真有人，留下考古证据的概率应比澳大利亚还大——可就是没有。所以“当时有人”的说法不成立。A=反驳一个观点，正确。", "annot": "类比论证的识别：文章讲的是美洲，却大段写澳大利亚——澳大利亚是**喻体**，目的是用“条件更差反而证据更多”反衬美洲的“没证据=没人”。claim/theory=人的看法，speculate（猜测）+缺证据=等着被怼。", "辨析": "B“解释异常现象”——解释型文章要从原因角度展开，本文是反驳型。C“列出替代解释”：alternative 体现对比性，但首句是观点不是解释，“替代解释”无从谈起。D“纠正错误概念”：文章反驳的是一个 claim（看法），不是纠正某个 concept。E“质疑比较的有效性”：若把 comparison 换成 claim 就对了——比较（美澳对比）是作者的**论证工具**，不是被质疑的对象。", "点拨": "引入一个看似无关的地区/对象时，第一反应想**类比**：它的每个特征（更小、更旱、同样被淹没）都是为了强化反差，服务于反驳。"}}, {"type": "teach", "title": "③ 主题题选项词汇库：客观呈现 vs 主观表态", "ppt": ["客观呈现：present/show/describe + 原因(reasons)/结果(effects)；explain、account for；present contrasting views（双方必须都重要）；trace + changes/development", "主观表态——支持：justify/defend/support；反对：challenge/question/refute；可好可坏：evaluate/assess", "选项开头的动词最关键：它必须满足文章的结构特征"], "text": ["**客观呈现**=作者把客观事实或别人的观点摆出来，自己不下判断。可呈现的角度：①原因（show reasons / explain / account for）；②影响与结果（demonstrate effects）；③不同或对比的观点（present a contradiction / contrast）——⚠️ 注意：若选项说“呈现对比观点”，则对比双方**都必须是文章的重点**，不能一个很重要、一个只露一次脸（想想 nation-state 那篇的 E 为什么错）；④发展变化、起源（trace changes / trace the development）。", "**主观表态**=作者对写作对象发表看法：支持类（justify/defend）、反对类（challenge/question/refute）、好坏皆可的评价类（evaluate/assess）。", "用法：主题题选项开头那个动词，先和文章结构对一遍——文章在质疑，justify 就出局；文章没有时间线，trace 就出局。动词对不上，后面写得再漂亮也白搭。"]}, {"type": "teach", "title": "④ 结构题（organization）的做法", "ppt": ["问法：Which best describes the organization of the passage / of the second paragraph", "一段的结构题≈一篇短文的结构题", "做法：通读抓框架→把选项的“先怎样、再怎样、然后怎样”逐段对应文章", "任何一小段对不上=整个选项错"], "text": ["结构题问整篇文章的 organization，也可能问**某一个段落**的结构（四题的长文章里常见）——一个段落的信息量和一篇短文章差不多，做法相同。", "做法和主题题同理：通读抓整体框架，做题时**用选项反向匹配**——你自己很难概括出结构表述，但选项给出的“先…再…然后…”可以逐段拿回文章验证。", "**铁律：选项的每一小段都要和文章对应上，错一小段，整个选项就错。**"]}, {"type": "passage", "title": "实战五 · Farmer：不是体温，是育幼", "source": "老朋友 · 一文两题（主题+结构）", "text": "Many researchers have attributed the numerous physiological and behavioral similarities between birds and mammals to endothermy — a thermoregulatory strategy by which body temperature is maintained through internal heat sources. Farmer, however, argues that parental care, rather than endothermy, is key to understanding these similarities. While endothermy provides an explanation for a few of the similarities, it is only one of many features associated with parental care. The purported advantages of endothermy cited by researchers include the ability to remain active in cold conditions; but sustained activity requires metabolic rates to rise quickly, and there is no biological linkage to explain why endothermy would be important in sustaining the vigorous exercise involved in foraging and provisioning young. Farmer argues instead that endothermy developed as a way to control body temperature — a capacity that serves parental care by allowing adults to forage and provision their young."}, {"type": "q", "tag": "真题 · 主题题", "title": "第5题 · 文章的主要目的", "source": "实战五", "pause": "这篇做过——快速回忆结构再选。", "stem": [{"t": "The primary purpose of the passage is to"}], "options": {"A": "present a scientific theory that challenges a widely held theory", "B": "explain how endothermy evolved in birds and mammals", "C": "compare the physiological features of birds and mammals", "E": "defend the traditional view of endothermy against recent criticism", "D": "express skepticism about the results of a particular researcher"}, "answer": "A", "explain": {"思路": "文章=用 Farmer 的观点（parental care 才是关键）反驳众多研究人员的通行观点（endothermy 解释一切）。A：一个科学理论挑战了一个被广泛接受的理论——Farmer 的看法对那帮人的看法，challenge=反驳，正确。", "annot": "widely held theory=many researchers 的归因；a scientific theory=Farmer 的 parental care 说。", "辨析": "B 只在 Farmer 的让步和收尾处沾边，且“解释进化过程”不是全文目的。C 鸟兽相似性只是讨论对象，文章不比生理特征。E 方向反了——被捍卫的传统观点恰是被反驳的。D 最阴：skepticism 方向对，但怀疑对象不是“**某一个**特定研究人员的结果”，而是**那一帮**研究人员——反驳对象错了。", "点拨": "态度词对、对象错=错。审题时把选项里的**对象名词**也圈出来核对。"}}, {"type": "q", "tag": "真题 · 结构题", "title": "第6题 · 文章的组织结构", "source": "实战五", "pause": "把每个选项拆成三小段，逐段对文章。", "stem": [{"t": "Which of the following best describes the organization of the passage?"}], "options": {"A": "A position is stated, an alternative to that position is introduced, and several points supporting the alternative are discussed.", "B": "A theory is discussed and an inconsistency within that theory is described.", "C": "Certain research results are described and the importance of those results is explained.", "D": "A question is posed and several possible answers are considered.", "E": "A debate is outlined and contrasting viewpoints on the debate are discussed separately."}, "answer": "A", "explain": {"思路": "文章三步走：①亮出立场（researchers 归于 endothermy）→②引入对立立场（Farmer: parental care）→③用若干要点支撑新立场（让步+反驳 purported advantages+正面论述）。A 三段全部命中。", "annot": "和上题答案特点一样、只是表达形式不同——主题题答对了，结构题答案也呼之欲出。", "辨析": "B 错在 within：文章没说该理论**内部**有不一致，而是直接拿另一个观点怼它。C“解释了结果的重要性”——没有，文章接着就反驳了。D 文章开头并没有提出问题。E 最能唬人：debate 勉强算（researchers vs Farmer），但“对比的观点**分别被讨论**”错了——文章压根没展开讨论 researchers 一方的论证，其中一方直接被认为不正确。", "点拨": "结构题答案按行文顺序写。逐段核对：A 的三小段各对应文章哪几句？对不上的那一句，就是错误选项的坟墓。"}}, {"type": "passage", "title": "实战六 · 捕食者不挑食？", "source": "课程实录 · 结构题", "text": "Unlike herbivores and omnivores, predators have traditionally been thought not to balance their nutrient intake, on the assumption that animal tissue as a food source varies little and is nutritionally balanced. However, chemical analysis of invertebrate prey reveals remarkable variation in nutrient composition among species — and even within a single species. Greenstone has shown that predators may in fact select their food on the basis of its nutrient composition. Experiments have also shown that even sit-and-wait predators with very low mobility will take action to remedy a nutrient deficiency."}, {"type": "q", "tag": "真题 · 结构题", "title": "第7题 · 文章的组织结构", "source": "实战六", "pause": "“传统上认为”——看到它就期待反转。", "stem": [{"t": "Which of the following best describes the organization of the passage?"}], "options": {"A": "A phenomenon is described and an explanation for it is provided.", "B": "An opinion is expressed and supporting evidence is evaluated.", "C": "A hypothesis is presented and undermined by recent research.", "D": "A contrast is noted and shown to be specious on the basis of recent findings.", "E": "A series of assumptions is presented and shown to be based on sound reasoning."}, "answer": "C", "explain": {"思路": "①传统观点（=假设）：捕食者不平衡营养摄入，因为动物组织作为食物“都差不多、营养均衡”。②However 反转：化学分析显示猎物营养构成差异巨大（跨物种、甚至同物种内部）。③Greenstone 证明捕食者会按营养挑食物；实验证明连“守株待兔”型的低机动捕食者都会主动补救营养缺乏。结构=假设被新研究推翻。C 正确。", "annot": "traditionally been thought=过去观点标记，考场上的期待就是“它要被废了”。assumption（假设）→chemical analysis / experiments（新证据）→undermine。顺带记词：herbivore(herb 草+vor 吃)、omnivore(omni 全+vor 吃)。", "辨析": "A 文章开头是**观点**不是现象，且后面不是解释而是反驳。B“支持的论据被评价”——文章根本没给传统观点的支持论据。D 错在两处：作者不是中立地“指出一个对比”，而是明确站队反驳（challenge 而非 contrast）；spacious 应为 specious（貌似有理实则错误）。E“一系列假设”——开头只有一个 assumption；“合理的推理（sound reasoning）”方向反了。", "点拨": "contrast（并列对比）与 challenge（一方推翻另一方）要分清：作者偏向哪边，哪边就是结构答案的落点。"}}, {"type": "passage", "title": "实战七 · 脉冲星旁的行星：两段两篇发现", "source": "课程实录 · 一文两题 · 难点：虚拟语气与真假混杂", "text": "(第一段) The recently claimed discovery of the first known planet orbiting a pulsar — the ultradense, pulsating remnant of a supernova explosion of a star — proved to be based on faulty data. Had this discovery been confirmed, theorists would have had difficulty explaining the existence of such a planet. The supernova would certainly have destroyed any preexisting planets. This particular pulsar is relatively young, allowing little time for a new planet to have coalesced, and it rotates relatively slowly, implying that it has not interacted with any nearby star since the supernova.\n(第二段) But more recent evidence concerning a different pulsar with planets is more promising. This is a rapidly spinning, much older pulsar: it has pulled gaseous material from a stellar neighbor, causing its rotational speed to increase. Leftover unconsumed gas around such a pulsar could coalesce into planets. Or the pulsar's radiation might have vaporized a companion star, providing raw material for planetary formation."}, {"type": "q", "tag": "真题 · 主题题", "title": "第8题 · 文章的主要目的", "source": "实战七", "pause": "注意两段各有多少“真”与“假”（虚拟）的动词。", "stem": [{"t": "The primary purpose of the passage is to"}], "options": {"A": "provide an example of the dangers of a recent discovery based on faulty data", "B": "illustrate the difficulty of explanation concerning a recent discovery", "C": "assess the credibility of recent findings concerning the as yet unverified existence of a class of objects", "D": "argue that a hypothesis fails to explain similar and contradictory phenomena", "E": "demonstrate how difficult it may be to find out the reality of a phenomenon"}, "answer": "C", "explain": {"思路": "①第一段：第一个“脉冲星行星”的发现被证明基于错误数据；且**就算是真的**，理论家也很难解释它存在（超新星早把原有行星摧毁了；这颗脉冲星太年轻、转得慢，没时间和邻近恒星互动形成新行星）。②第二段 but 转折：**另一颗**脉冲星带行星的证据更可信（转得快、更老、从伴星吸了气体，剩余气体可聚成行星；或其辐射蒸发了伴星提供原料）。③全文=评价关于“脉冲星行星”这类**尚未证实存在的天体**的近期发现的可信度。assess=可好可坏，正好 cover 两段的“一个错、一个更有希望”。C 正确。", "annot": "语法点：Had this discovery been confirmed = If this discovery had been confirmed（if 省略、had 提前的虚拟）——它是“假”的；would have destroyed 也是虚拟。而 is relatively young / rotates slowly / has not interacted 是客观事实。一段里真假动词混杂，靠动词形式做判断。pulsar=脉冲星；supernova=超新星；coalesce=聚合。", "辨析": "A“基于错误数据的发现的危险”——顶多算第一段内容，且文章讲的不是 dangers。B“解释的困难”只对应第一段虚拟部分，cover 不住第二段的 promising。D“假设无法解释相似又矛盾的现象”——感情色彩只像第一段，具体内容也不符。E“搞清现象的真实有多难”——文章没这个感慨。", "点拨": "assess/evaluate 这类“可好可坏”的词，天然适合“一段说错、一段说对”的文章——它是正确答案的高频身份。"}}, {"type": "q", "tag": "真题 · 结构题", "title": "第9题 · 文章的组织结构（难题）", "source": "实战七", "pause": "ABC 三个选项很像，差别在“两组发现”还是“一组数据的两个解释”。", "stem": [{"t": "Which of the following best describes the organization of the passage?"}], "options": {"A": "Two sets of research findings relating to similar phenomena are mentioned, and the theoretical implications of each are discussed.", "B": "A theoretical explanation of a phenomenon is presented and rejected, and a more attractive alternative is offered.", "C": "Two independent and divergent interpretations of a set of observational data are compared.", "D": "An example of careless scientific research is introduced and contrasted with a more rigorous approach.", "E": "The state of knowledge of an unexplainable phenomenon is outlined, and a method for further investigation is recommended."}, "answer": "A", "explain": {"思路": "两段=**两组研究发现**（两颗不同的脉冲星），围绕相似现象（脉冲星旁有无行星），且每组发现的理论含义都被讨论了（第一组→难以解释、证伪；第二组→可行的形成机制）。A 三段全对。", "annot": "关键判断：第二段和第一段是什么关系？是**另一个对象的新证据**（a different pulsar），不是对同一现象的另一个解释。", "辨析": "B 最像的陷阱：若第二段是“更有吸引力的替代解释”，那它解释的应该是**同一个现象**——但两段讲的是两个不同的脉冲星，所以 B 错。C 同理：文章是**两组观察**各有各的解释，不是**一组数据**的两个解释——“a set of observational data”错了。D“粗心科研（careless）”——第一段只是数据有误，与“漫不经心”无关。E“不可解释现象的知识现状+推荐研究方法”——文章既没有 outline 知识现状，也没有 recommend 方法。", "点拨": "ABC 的差异全在**名词的单复数与对应关系**：two sets of findings（A）vs one phenomenon 两个解释（B）vs one set of data 两种解读（C）。结构题做到顶级，比的就是这种精准。"}}, {"type": "teach", "title": "⑤ 本讲收束", "ppt": ["主题题：整体概括+选项匹配，细节对≠主题对", "结构题：按行文顺序逐段对选项，错一小段全错", "主题和结构可能同文出现——本质相同 age", "title": "态度实战一 · Mary Barton 的记录方法", "source": "课程实录 · 态度题", "text": "Mary Barton is a moving response to the suffering of the industrial worker in the England of the 1840s. What is most impressive about the book is the intense and painstaking effort made by its author, Elizabeth Gaskell, to convey the experience of everyday life in working-class homes. The interest of this record is considerable, although the method has a slightly distancing effect."}, {"type": "q", "tag": "真题 · 态度题", "title": "第1题 · 作者对“记录方法”的态度", "source": "态度实战一", "pause": "先找对象，再找作者的评价词。", "stem": [{"t": "The author's attitude toward the method of record used in Mary Barton is one of"}], "options": {"A": "uncritical enthusiasm", "B": "unresolved ambivalence", "C": "qualified approval", "D": "resigned acceptance", "E": "mild irritation"}, "answer": "C", "explain": {"思路": "对象=Gaskell 的记录方法。作者评价：interest is **considerable**（大有好处的），although 方法有一点点 distancing effect（疏远感）——整体**正向但带一点保留**。qualified approval=有限度的赞同，正好对上。", "annot": "qualified 在这里不是“有资格的”，而是“**受限制的、适度的**”——它把 approval 调成了“不极端的支持”，与文章“好处大+小瑕疵”的结构严丝合缝。", "辨析": "A enthusiasm 方向对，但 **uncritical（不加批判的）**错——批判性是学术作者的基本要义，他不会“疯狂支持到没想法”。B ambivalence（矛盾）=态度不清，文章态度很清楚。D resigned 来自 resign（放弃）：放弃自己的看法转而接受别人→**勉强的、妥协的**接受——作者写自己文章怎么会“勉强”？E irritation（恼火）方向直接反了。", "点拨": "态度选项=态度词+程度词，**两个都要对**。enthusiasm 对、uncritical 错，整个选项就错——和主题题“小信息错全错”是同一原理。"}}, {"type": "passage", "title": "态度实战二 · “超越界限”的想法", "source": "课程实录 · 态度题", "text": "The idea that all highly creative artistic activity transcends established limits is misleading. Extraordinary creative activity may be regarded as revolutionary, yet …"}, {"type": "q", "tag": "真题 · 态度题", "title": "第2题 · 作者对这个 idea 的态度", "source": "态度实战二", "pause": "对象是这个 idea，不是 creative activity。", "stem": [{"t": "The author regards the idea that all highly creative artistic activity transcends established limits with"}], "options": {"A": "deep skepticism", "B": "strong indignation", "C": "marked indifference", "D": "moderate amusement", "E": "sharp derision"}, "answer": "A", "explain": {"思路": "作者直接用 **misleading（误导性的）**描述这个 idea——负向。五个选项里负向的有 A（深深怀疑）、B（强烈愤怒）、E（尖刻嘲讽），但只有 A 是**学术性的反对**;B、E 都是情绪。", "annot": "陷阱提示：文中 revolutionary 是别人对 creative activity 的正面描述，**不是作者对这个 idea 的看法**——审清对象才不会被带跑。", "辨析": "B indignation（愤怒）是情绪不是学术态度——学术文章要的是“看法”，不是“感情”。C indifference（漠不关心）:作者洋洋洒洒写一篇文章说“我一点都不关心”？不可能，态度必须清楚。D amusement（娱乐）:作者是用搞笑轻松的心态写作的吗？方向也不对。E derision（嘲讽）同样是情绪化。", "点拨": "态度题出题有“bug”：合理态度只有支持/反对/中立三种，五个选项里往往有两三个是**看完选项就能干掉**的情绪词或冷漠词——这题就是四个全干掉、只剩 A。"}}, {"type": "passage", "title": "态度实战三 · B 的专著", "source": "课程实录 · 态度题 · 先不看文，纯选项预判", "text": "B's treatise is based on a comprehensive survey of the available materials. Nonetheless, the assumption that the first recorders of the events have preserved the facts is problematic."}, {"type": "q", "tag": "真题 · 态度题", "title": "第3题 · 作者对 B 的专著的态度", "source": "态度实战三", "pause": "先纯看选项预判谁能当正确答案，再回文验证。", "stem": [{"t": "The author's attitude toward B's treatise is best described as one of"}], "options": {"A": "measured support", "B": "profound ambivalence", "C": "studied neutrality", "D": "pointed criticism", "E": "unmitigated hostility"}, "answer": "D", "explain": {"思路": "①纯选项预判：B ambivalence（矛盾=态度不清）先杀；E unmitigated hostility（毫不缓和的敌对）像民族仇杀不像学术态度，杀。剩下 A（适度支持）、C（刻意的中立）、D（尖锐的批评）从态度方向上都“可以”。②回文：comprehensive survey（材料全面=好）,nonetheless 转折→assumption is **problematic**（有问题=坏）。nonetheless 的让步逻辑：承认前面那点好，但**后面的程度更强**——大方向偏负向。D 正确。", "annot": "让步结构的比重判断：好（comprehensive）在前，nonetheless 之后的 problematic 才是作者真正的落点。负面信息地位重于正面→态度偏负。", "辨析": "A 方向反了。C 中立为什么不选？中立要求正负信息**地位相当、笔墨差不多**——本文负面压过正面，不是中立。E 的 unmitigated（un+mitigate 缓和=毫不缓和）程度太极端。", "点拨": "态度题的做题顺序可以反过来：**先杀选项再回文**。方向合理的选项往往只剩一两个，回文只需确认正负。"}}, {"type": "passage", "title": "态度实战四 · 一部先锋研究", "source": "课程实录 · 态度题 · 选项之间的逻辑关系", "text": "She does not discuss whether women's improved status counteracted the destabilizing effects of change on women. This is not so much a weakness; indeed, such gaps are precisely what make her study a pioneering one."}, {"type": "q", "tag": "真题 · 态度题", "title": "第4题 · 作者对这项研究的态度", "source": "态度实战四", "pause": "注意 B 和 C 两个选项之间暗藏的逻辑关系。", "stem": [{"t": "The author's attitude toward the study is best described as"}], "options": {"A": "uncritical support", "B": "enthusiasm tempered by minor reservations", "C": "praise for her thesis, despite skepticism regarding the sources of her evidence", "D": "reluctant acceptance", "E": "opposition, despite admiration for some aspects of it"}, "answer": "B", "explain": {"思路": "①作者指出一个缺口（她没讨论……），但马上说 this is **not so much a weakness**,indeed 强调这些 gaps 恰恰让研究成为 **pioneering**（先锋的）——整体**偏正向、带一点点保留**。②B=有保留的热情（支持+不极端）,C=赞扬她的论点但怀疑其证据来源——两者方向都偏正。③回文验证：作者**并没有质疑证据来源（sources）**，只说有个缺口——C 的具体内容错了。B 正确。", "annot": "选项间的包含关系：C 说得很具体（怀疑证据来源）,B 是对 C 的**概括**（有保留=质疑了某些东西，但不说是什么）。若 C 对则 B 必对——单选题不可能有两个答案，所以 C 必错、选 B。", "辨析": "A uncritical（不加批判）程度错。D reluctant（勉强）——作者不会勉强接受，杀。E 大方向是 opposition（反对），方向反了。", "点拨": "老师指路比喻：问洗手间在哪，说“出门左转90度走38米再右转”太精确易错，说“就在那边”模糊但不易错。**模糊而正确的选项 > 具体但有错的选项**。C 对 B 必对、B 对 C 不一定对——这种选项关联不常见，但出现了就是送分信号。"}}, {"type": "teach", "title": "② 态度词库：正确答案 vs 干扰项", "ppt": ["正确答案铁律：清晰（支持/反对/中立说清）+程度合理", "客观中立：objective、impartial、detached、dispassionate", "支持：supportive/approving/optimistic/sympathetic；反对：critical/disapproving/skeptical", "程度修饰——委婉常对：qualified/measured/cautious；极端或不适合常错：uncritical/resigned/tolerant/unqualified(无限)", "干扰项两大类：模糊（ambivalent/ambiguous/indifferent/puzzled/biased）+情绪（indignation/derision/amusement/悲伤恐惧）"], "text": ["**客观中立**何时对：①说明文（纯客观、不掺情感）;②议论文中作者把双方平行摆出、好坏笔墨一样多、转折不偏重——但这种文章不多见。中立词：objective（客观的）、impartial（不偏不倚）、detached（没被触动=客观；⚠️ 它也有“漠不关心”的意思，看语境）、**dispassionate**:dis- 此处=分散，passion=激情——像体育解说员把激情**分散到两方**=中立；全押一方（比如解说国足）就不 dispassionate 了。", "**支持/反对**常用词：支持——supportive、approving、optimistic、**sympathetic**(sym=共同，共情→支持）；反对——critical、disapproving、skeptical。", "**程度修饰**：委婉的对的多——qualified（有限度的）、measured（适度的）、cautious（谨慎的）、tempered（被缓和的）；不合适的多半错——uncritical（不加批判）、resigned（勉强的）、compromising（妥协的）、tolerant（容忍的：作者可以在文中“怂一下”再转折，但通篇都怂不可能）。unqualified（无限制的）虽然极端，但若文章真是猛支持，也可能对——看语境。", "**干扰项一：模糊不清**。ambivalent/ambiguous(ambi-=二：两个态度不知表哪个）、dilemma（进退两难，di-=二）、indifferent（漠不关心）、puzzled（作者把自己写懵了？)/puzzling（故意让你看不懂？作者又不是间谍接头）、biased（偏见=态度不清，支持和反对都可被说“有偏见”)。", "**干扰项二：七情六欲**。indignation（愤怒）、derision（嘲讽）、amusement（娱乐）、悲伤、恐惧——喜怒哀思悲恐惊都是**情绪**，不是学术态度。记住这两类，态度题常常不看文章就能杀到只剩一两个。"]}, {"type": "teach", "title": "③ 观点题：分清视角归属", "ppt": ["attitude 换成 holds，道理一样——看法归属于谁", "分清作者视角 vs 文中某人的视角", "题目问某人，答案必须和这个人的观点一致，哪怕和作者相反", "干扰选项常拿别人的视角冒充"], "text": ["观点题（holds/argues/maintains）和态度题同源：都是“看法”。多出来的功课只有一个——**看清这是谁的看法**。", "干扰选项的经典配方：内容是文章里的，但归属错了——把作者的观点塞给某人，或把某人的观点塞给作者。审题时把**人名**圈出来。"]}, {"type": "passage", "title": "观点实战一 · 墨西哥湾死亡区域", "source": "课程实录 · 观点题", "text": "There have long been dead zones — water in which oxygen is too low to sustain most forms of life — in the Gulf of Mexico, which receives the waters of the Mississippi River. Scientists who studied sediments from areas where the gulf's most recent dead zone occurred dated the sediment and counted species of foraminifera — marine protozoans — in it: these species thrive in low-oxygen water. The sediment record indicates that nutrients in the water can trigger low-oxygen conditions. Foraminifera became abundant in the gulf's sediments after 1950, when farmers began using fertilizer, which is rich in nutrients. Researchers believe that increased use of fertilizer will lead to more extreme dead zones."}, {"type": "q", "tag": "真题 · 推断观点题", "title": "第5题 · 研究人员会同意哪个说法", "source": "观点实战一", "pause": "注意 more extreme 之间那一个小小的连字符。", "stem": [{"t": "It can be inferred that the researchers would agree with which of the following statements about the use of fertilizer?"}], "options": {"A": "If farmers near the gulf reduced their use of fertilizer, the severity of the dead zones would be reduced.", "B": "If farmers continued to rely on fertilizer, the number of foraminifera would eventually decline.", "C": "If farmers in the region stopped using fertilizer altogether, there would no longer be dead zones.", "D": "Fertilizer use is the only factor contributing to the formation of dead zones.", "E": "The nutrients contained in fertilizer are less harmful in low-oxygen water than in oxygen-rich water."}, "answer": "A", "explain": {"思路": "研究人员的观点：化肥用得越多→死亡区域**越极端（more extreme）**。逆着推：用得少→严重性下降。A=severity（严重性）对应 extreme，正确。", "annot": "连字符决定语义：more-extreme dead zones 里 more 修饰 **extreme**（程度更深）,不是“更多数量的 zones”。若没有连字符，more extreme dead zones 真可能歧义成“更多极端的区域”。sediment=沉淀物；foraminifera=有孔虫（文中说 marine protozoans，不认识就当 F);thrive=旺盛生长；nutrient=营养物。", "辨析": "B 把 foraminifera 的数量变化方向说反了——化肥多了它们更多（thrive in low-oxygen water)。C 最阴：①把“程度”偷换成“数量”;②**绝对化**——首句就说死亡区域 there have **long been**（早就存在）,化肥不是它的起因，停用了也不会消失。D only 绝对化。E 低氧水更有害还是更有利，文章没比较。", "点拨": "推断题=从已知观点**严丝合缝地小步推**。A 只是“多→少”的对称反推，一步不多走；C 走了两步（停用→彻底没有），就掉坑里了。"}}, {"type": "passage", "title": "观点实战二 · 1919 年英国工时大缩减", "source": "课程实录 · 观点题 · 三派视角", "text": "In 1919 Britain experienced its largest reduction in industrial working hours, to 48 hours per week. In Dowie's view, the 48-hour week played a central role in Britain's poor economic performance during the 1920s: the reduction, together with rapid wage growth, drove up prices. But Greasley and Oxley found that the First World War constituted a more powerful negative macroeconomic shock to Britain's competitiveness. And Scott argues that Dowie's thesis ignores evidence that hourly productivity improved when hours were reduced to such a level."}, {"type": "q", "tag": "真题 · 推断观点题", "title": "第6题 · 从 G 和 O 的视角能推出什么", "source": "观点实战二", "pause": "题目问的是 G 和 O——别拿 Dowie 的观点答。", "stem": [{"t": "It can be inferred from the passage that Greasley and Oxley would agree with which of the following?"}], "options": {"A": "A reduced work week was ultimately beneficial to employees.", "B": "The economic effects of the reduction in working hours in 1919 were brief.", "C": "Britain became less economically competitive during this period.", "D": "The reduction in working hours was the main cause of Britain's poor economic performance.", "E": "Changes in Britain's economic performance during this period were unforeseen."}, "answer": "C", "explain": {"思路": "G&O 的观点：一战对英国**竞争力（competitiveness）**构成了**更强的负面宏观经济冲击**。能直接推出：这段时期英国经济竞争力受损变差。C 正确。", "annot": "视角分工：Dowie——工时缩减是经济差的主因；G&O——一战的冲击**更**有力；Scott——Dowie 忽略了小时生产力提高的证据。三派观点别张冠李戴。", "辨析": "A“对员工有益”——文章没说员工角度。B 最干扰：more powerful 说明一战更强，但**不代表**工时缩减的影响就 brief（短暂/微弱）——它可以也是 powerful 的，只是没那么强；而且 brief 是时间维度，文章比较的是力度。D“工时是主因”恰恰是 **Dowie** 的观点，视角错了——问 G&O 却答 Dowie，经典陷阱。E unforeseen（不可预见）文章没依据。", "点拨": "more powerful 的比较逻辑：A 比 B 更强，B 不一定弱。**比较级只告诉你相对关系，不告诉你绝对水平**。"}}, {"type": "teach", "title": "④ 段落大意题：放回全文语境里看", "ppt": ["问法：The second paragraph is primarily concerned with… / the primary purpose of the second paragraph", "段意=分论点，不能只看本段——结合全文主题+段间关系判断", "例子永远当不了段意"], "text": ["段意题问某个段落的 primary purpose。判断时不能孤立看这一段——要放回文章大环境，结合**全文主题**和**段间关系**。", "排除捷径：**例子的内容不能充当段意**——段意一定是本段最核心的论点。"]}, {"type": "passage", "title": "段意实战 · 《紫色》违背现实主义了吗", "source": "课程实录 · 段意题 · 四题长文的前两段", "text": "(第一段) Although it won many awards when it first appeared, Alice Walker's The Color Purple generated critical unease over puzzling aspects of its composition. One reviewer called the book unmistakably a realist novel, but many reviewers considered that it violated the conventions of the realist novel, pointing out, for example, that toward the end of the book the protagonist Celie and her friends are propelled toward a happy ending with more velocity than credibility — a haste that defies the realist habit of patient, plausible development.\n(第二段) Indeed, the violations of realist convention are so flagrant that they call into question whether The Color Purple was intended as a realist novel at all — especially given its use of letters and its fairy-tale coincidences. One critic, for example, has suggested that the book be read through the conventions of the epistolary and folk traditions instead."}, {"type": "q", "tag": "真题 · 段意题", "title": "第7题 · 第二段主要关注什么", "source": "段意实战", "pause": "第二段开头的 Indeed 告诉你它和第一段什么关系？", "stem": [{"t": "In the second paragraph, the author is primarily concerned with"}], "options": {"A": "analyzing the way in which The Color Purple echoes its acknowledged predecessor", "B": "providing an example of a critic who has reviewed The Color Purple", "C": "demonstrating that literary models other than the nineteenth-century realist novel could allow us to understand The Color Purple", "D": "demonstrating the ineffectiveness of a particular scholarly attempt to suggest an alternative way of evaluating The Color Purple", "E": "refuting the perceived notion that The Color Purple departs from the tradition of the realist novel"}, "answer": "C", "explain": {"思路": "①Indeed（实际上）开头=**强调并承接第一段**：大家认为此书违背现实主义传统——两段方向一致。②第二段说违背得太明显（flagrant)，以至于让人质疑它是否按现实主义小说写的；随后举例：有评论家建议**换一套传统（书信体/民间传统）来读它**。③段意=用现实主义**之外**的文学模型来理解《紫色》。C 正确。", "annot": "other than=除了（except):把十九世纪现实主义小说扔掉，其他文学模型可以帮我们理解这本书。velocity than credibility=被过快地推向大团圆结局，快到不可信——带着这个论点去读后面的细节，就读得快。", "辨析": "A“模仿其公认的前辈（echoes its predecessor）”是例子层面的信息，不是段意。B“提供一个评论家的例子”——**例子不能充当段意**，段意要最核心的论点。D“证明某学术尝试的无效性”——方向不对，作者没说那个替代方案无效。E“反驳‘此书背离现实主义传统’这一普遍看法”——方向恰好反了：第二段正是**同意并强调**它背离了传统；refute（反驳）后面跟的内容若被否掉，就等于说它是现实主义小说，与段落相反。", "点拨": "段间逻辑词（Indeed）先判断两段是顺承还是反转，再看本段论点句，例子一扫而过。段意题=小号的主题题，做法完全相通。"}}, {"type": "teach", "title": "⑤ critical 一词多义 + 长文章读法", "ppt": ["critical 四义：评论的→批评的（差评）→批判的（全面分析，非负评）→重要的（美食评论家的差评能让餐厅没人去）", "一词多义放语境里判断", "长文章（四题文章）读法：带着论点读细节，细节记住长相即可，考细节再回头"], "text": ["**critical** 源自 critique（评论）:①最基础=评论的、评论家的；②评论家爱给差评（好评显不出水平）→**批评的**（负向）;③真正严谨的评论家好坏、原因、结果都评→**批判的**（=批判性思维的“批判”，不是负评，是全面分析）;④评论有分量（差评让人不去这家餐厅）→**重要的**。考场遇到放语境里选。", "**长文章读法**:第一段“评论家认为此书违背现实主义传统”是论点，后面 from 此处到句末的一长串细节（写信、大团圆结局……）都是支撑——考场上**带着论点读细节**，知道细节在说什么性质的事即可，大概记住信息长相；问到细节再回头定位，不问就跳过。这样抓核心、做题快、还省时间——考场时间是最重要的参数。"]}, {"type": "teach", "title": "⑥ 本讲收束", "ppt": ["态度题：方向清晰 悉一下这些问题的形式知道。他们会经常出现，并且知道这样的提问的角度是什么，你就该怎么去做它，这样就完成了我们这几节课的内容。"}, {"id": 16, "title": "第16讲 · 题型4：逻辑类1（信息的作用）", "intro": "逻辑类题目考的是**信息之间的关系**，分两个角度：本讲的**信息作用题**和下一讲的**词义猜测题**。信息作用题问“某个词/句/段在文章中起什么作用”——背后全靠逻辑关系解题。问法家族：why does the author mention X / the purpose of X / the function of the highlighted sentence / 以及反向的 select the sentence（给你作用，让你点句子）。10 篇文章、12 道题，把每种问法都打一遍。", "cards": [{"type": "teach", "title": "① 信息作用题：问法与解法", "ppt": ["问法1：作者为什么谈到 X / 谈到 X 的目的（mention…in order to / primarily to）", "问法2：某个段落/句子的 purpose", "问法3：function of the highlighted sentence（句子功能）", "问法4：select the sentence（反向问法：给你作用，点出那句话）", "解法：判断这个信息与局部或全文其他信息的关系"], "text": ["信息作用题考察的是**词、句、段在上下文中起到什么作用**，换句话说就是它与其他信息的关系——背后仍然是逻辑在帮忙解题。", "做题思路一句话：判断问题问到的**对象**，和文章（局部或全文）其他信息的**关系**是什么。支持？反驳？让步？解释？例子？", "⚠️ 正常流程一定是**先读完全文再做题**——你事先不知道这个信息是跟全文有关还是只在局部起作用。老师带你先看题再读文是教学演示，考场别这么干。"]}, {"type": "passage", "title": "实战一 · “民族国家”篇（三刷）", "source": "课程实录 · 信息作用题", "text": "（全文见第14讲实战一）According to Hobsbawm and Ranger, the term “nation-state” is a misnomer… The recent resurgence of multiple ethnic groups within a single state has not, they say, threatened the sovereign jurisdiction of the state; rather, it is cultural diversity that threatens the belief in the very possibility of the nation-state.\n本题考察：作者引用 H 和 S 关于“多民族复兴与主权”的这番话，目的是什么。"}, {"type": "q", "tag": "真题 · 信息作用题", "title": "第1题 · 引用 H 和 S 的目的", "source": "实战一", "pause": "先回忆这对人说了什么、作者拿它干嘛，再看选项。", "stem": [{"t": "The author mentions Hobsbawm and Ranger's statement primarily in order to"}], "options": {"A": "introduce a discussion of the legal ramifications of expanding the nation-state concept", "B": "summarize a claim about one possible effect of asserting cultural differences within a state", "C": "shift the focus of discussion from internal threats that states face to external threats", "D": "point out similarities between the threats perceived by Hobsbawm and those perceived by Ranger", "E": "describe a way in which ethnocentric practice has affected attempts to assert cultural differences within a state"}, "answer": "B", "explain": {"思路": "引号信息=这两人认为“多民族复兴（不）会威胁到主权”——也就是“坚持文化多样性可能带来的一种影响”。这个信息放在文中，最终是被作者拿来反驳、提出自己看法的。B=概括了一个关于“主张文化差异的可能影响”的观点，完全对应。", "annot": "ramification 本义“分支”，演化出“（连锁）影响”。sovereign jurisdiction=主权管辖——文中确有“法律味”的词，这正是 A 的诱饵。", "辨析": "A 最唬人：jurisdiction 确实跟法律沾边，但引这段话的**逻辑目的**不是讨论“扩大 nation-state 概念的法律影响”——选项不能只看词有没有出现，要看逻辑对不对。C“从内部威胁转向外部威胁”——文章没有内外之分。D“指出两人威胁观的相似性”——两人方向根本不相似。E 因果颠倒：文章逻辑是“文化差异主张→影响”，E 是“行为→影响了主张”，方向反了，甭管内容多像都错。", "点拨": "作用题的选项**逻辑方向优先于内容相似**。因果颠倒、对象颠倒的选项，词再熟也是错的。"}}, {"type": "passage", "title": "实战二 · 奥斯汀与“男性大放弃”", "source": "课程实录 · 信息作用题", "text": "Most recent scholarly studies of Jane Austen have analyzed her in the context of her tumultuous times — an era that witnessed the French and American revolutions and the Napoleonic Wars. But Frantz notes another revolution, hardly ever discussed in Austen scholarship: the great masculine renunciation, which changed conventions of male dress and behavior. In the later eighteenth century, wealthy men exchanged the velvets and satins long in fashion for sober woolen suits. Frantz argues that this change reflected a deeper social and cultural transformation: the value once placed on male expressiveness — reflected in the novel The Man of Feeling — gave way to emotional restraint. Austen's heroines frequently struggle to glimpse the true nature of the hero beneath his reserved exterior."}, {"type": "q", "tag": "真题 · 信息作用题", "title": "第2题 · 作者谈到 The Man of Feeling 为了干嘛", "source": "实战二", "pause": "这部作品出现在“价值观转变”那句话里——它的功能跟着那句话走。", "stem": [{"t": "The author mentions the novel The Man of Feeling primarily in order to"}], "options": {"A": "contrast the reasons why its author wrote the novel with the reasons Austen wrote her novels", "B": "introduce evidence regarding the influence of particular writers on Austen", "C": "support the claim that a convention of male behavior changed during Austen's lifetime", "D": "demonstrate that Austen's novels were more reflective of their historical context than this novel", "E": "challenge a particular misconception about modes of behavior common among gentlemen in the later eighteenth century"}, "answer": "C", "explain": {"思路": "《感伤的男人》出现在这句：曾经推崇男性表达（emotional restraint 之前）的价值观——反映在这部作品里——让位于情感克制。它的功能=**体现/支撑“男性行为习俗发生了变化”这一观点**。C 正确。", "annot": "tumultuous=混乱动荡的（革命+战争年代，文中自带解释）。great masculine renunciation 不认识没关系，文中马上解释=男人穿衣和行为的改变：天鹅绒、绫罗绸缎（velvets and satins）换成朴素的羊毛套装（sober woolen suits）——从“明骚”变“闷骚”：外表 reserved，内心澎湃。女主费劲（struggle to）才能瞥见男主 reserved exterior 之下的真性情，正是这个变化的文学投影。", "辨析": "A“对比两位作者写小说的原因”——不是这部作品的功能。B“给出某些作家对奥斯汀的影响”——无。D“奥斯汀的小说比这部作品更反映历史语境”——两部作品没有比较谁更反映。E“挑战一个关于绅士行为模式的错误观点”——文章是支持一个观点，不是挑战错误观点。", "点拨": "专有名词（作品名）在文中几乎都是**例证身份**——它的作用永远跟着它服务的那个论点走，先找到它上层的论点句。"}}, {"type": "passage", "title": "实战三 · 南方四州的二战投资", "source": "课程实录 · 信息作用题（serve to 问法）", "text": "Most scholars argue that government investment in manufacturing in the southern United States during the Second World War spurred a lasting economic boom. But in fact, most of this investment went to specialized plants, many of them unsuitable for postwar production. Indeed, in Alabama, Arkansas, Mississippi, and Tennessee, enormous federal funds flowed into munitions factories — plants whose products had no peacetime market — while the kinds of manufacturing that could have sustained postwar growth were neglected."}, {"type": "q", "tag": "真题 · 信息作用题", "title": "第3题 · 提到这四个州起什么作用", "source": "实战三", "pause": "例子永远服务论点——先找它头顶的论点句。", "stem": [{"t": "The author mentions Alabama, Arkansas, Mississippi, and Tennessee primarily in order to"}], "options": {"A": "suggest that some states are better than others at anticipating postwar economic needs", "B": "provide evidence used to support the view of most scholars", "C": "indicate that federal investment in some kinds of manufacturing was excessive", "D": "identify the states that received the largest allocations of federal funds", "E": "provide information that supports a view about the nature of government investment presented earlier in the paragraph"}, "answer": "E", "explain": {"思路": "Indeed 开头=强调承接，四个州是**例子**，支持的是作者（不是学者）的论点：投资投去了不适合战后生产的特殊工厂——投错了地方。E=提供信息支持段前提出的、关于政府投资**性质（nature）**的观点，正确。", "annot": "这四个州确实都在南方（阿拉巴马还是阿甘的故乡）——但你不需要知道，文章自己会告诉你。例子题的核心从来不是例子本身，而是它支持谁。", "辨析": "A“一些州更会预测战后经济需求”——例子本身的内容，不是例子的功能；例子题选“例子本身说了什么”必错。B“支持学者们的观点”——方向反了，例子支持的是**作者**，作者和学者是相反的。C 和 E 最纠结：C 说投资**过量（excessive）**,E 说投资的**性质**。文章强调的是投错**地方**，不是钱太**多**——过量≠性质，C 内容错。D“收到最多拨款的州”——州名只是例子载体，不是重点。", "点拨": "C vs E 是选项设计的经典：如果“过量”算对，“性质”就也对，单选题不允许——所以命题人必须让 C 在内容上出错。两个选项看起来都能对时，**更抽象、更概括的那个**往往才是答案（想想态度题那讲的“洗手间指路”）。"}}, {"type": "passage", "title": "实战四 · 旅鸽的骨头", "source": "课程实录 · 信息作用题 · 两拨考古学家别搞混", "text": "Although the passenger pigeon is now extinct, in the eighteenth and nineteenth centuries it was abundant. Archaeologists who analyzed twelfth-century household food waste at a site in the present-day United States, however, found almost no trace of the bird. Since the site was near a large pigeon roost recorded in the nineteenth century, and since the inhabitants ate almost every available source of animal protein, the archaeologists concluded that passenger pigeon populations had once been limited and then increased dramatically in post-Columbian America. Other archaeologists criticized these conclusions on the grounds that passenger pigeon bones would be unlikely to be preserved. But all the archaeological projects at the site uncovered abundant bird bones, and even tiny bones from fish."}, {"type": "q", "tag": "真题 · 信息作用题", "title": "第4题 · 提到“鱼的小骨头”为了干嘛", "source": "实战四", "pause": "先分清两拨人：做研究的考古学家 vs 批评他们的考古学家。", "stem": [{"t": "The author mentions tiny bones from fish primarily in order to"}], "options": {"A": "explain why traces of the passenger pigeon are rare", "B": "support a claim about the wide variety of animal proteins in the inhabitants' diet", "C": "provide evidence confirming a theory about the extinction of the passenger pigeon", "D": "question the conclusion reached by the archaeologists who conducted the study", "E": "counter an objection to an explanation of the data obtained from the site"}, "answer": "E", "explain": {"思路": "逻辑链：①研究派发现 12 世纪食物垃圾里旅鸽踪迹极少→推断“旅鸽曾经数量很少”。②批评派反对：鸽子骨保存不下来，不能这么推。③作者反将一军：**连鸟骨、连鱼的小骨头都保存下来了，鸽子骨凭什么留不下来？**——所以鱼骨信息=反驳批评派，间接支持研究派。E=反驳了针对“该遗址数据之解释”的一个反对意见，正确。", "annot": "两拨人别搞混：conducted the study（做研究的）=前面那拨；批评者文章没说他们做过研究。roost=栖息处/鸽巢；post-Columbian=哥伦布之后的（美洲）。", "辨析": "A“解释旅鸽踪迹为何稀少”——鱼骨解释不了鸽子少。B“支持饮食蛋白种类多”——鱼骨鸟骨确实多，但这不是它在文中的**作用**（作用≠内容）。C“证实旅鸽灭绝的理论”——与灭绝无关。D 方向反了：鱼骨是**支持**研究派的，不是质疑他们的结论。", "点拨": "这题正确答案可以有好几种写法：说“反驳批评”对，说“支持前面研究”也对——只要符合信息间的真实关系。别拿你脑补的唯一表述去卡选项。"}}, {"type": "passage", "title": "实战五 · 海藻造云与 Lovelock", "source": "课程实录 · 信息作用题 · 并列支持上层", "text": "Biologists know that some marine algae can create clouds by producing the gas dimethyl sulphide (DMS). DMS reacts with oxygen in the air above the sea to form solid particles, which provide a surface on which water vapor can condense to form clouds. Lovelock argues that this process is part of a global climate-control system: the Earth, he contends, is like a superorganism whose biological and physical systems cooperate to keep it healthy. He hypothesized that warmer conditions increase algal activity and DMS output, producing more clouds and lowering the Earth's temperature by blocking the sun; when the climate cools, algal activity and DMS levels decline, and the cycle continues. In response to biologists who question how organisms devoted to their own selfish ends could have evolved behavior that benefits not only the planet but the organism as well, Lovelock points out that the cooling benefits the algae; algae may also benefit from the nitrogen falling down in the rain."}, {"type": "q", "tag": "真题 · 信息作用题", "title": "第5题 · 提到“雨水中的氮可能给海藻带来好处”的目的", "source": "实战五", "pause": "注意 also——它和前一句构成并列，共同服务上层。", "stem": [{"t": "The author mentions the possible benefit to algae from nitrogen falling down in the rain primarily in order to"}], "options": {"A": "provide support for Lovelock's response to an objection raised in the passage", "B": "indicate that the climatic effects of DMS have been underestimated", "C": "acknowledge that Lovelock's hypothesis is based on speculation", "D": "illustrate the global reach of algal activity", "E": "refute the claim that organisms act only for selfish ends"}, "answer": "A", "explain": {"思路": "生物学家的质疑：生物本来是自私自利的，怎么可能进化出**既利地球又利他者**的行为？Lovelock 的回应=两个并列信息：①降温对海藻自己有好处；②（also）海藻还能从雨水里的氮获益——“利他也利己”，回应质疑成立。所以氮信息的作用=支撑 Lovelock 对质疑的回应。A 正确。", "annot": "结构模型：一个总句（回应质疑）+两个 also 并列的分句——下一层支持上一层。这种结构写法随便换：一句号二句号三句号、一逗号二分号三句号……**形式随便变，抓住逻辑关系才是真的**。DMS=二甲基硫醚，superorganism=超级有机体。", "辨析": "B“DMS 的气候影响被低估”——方向不对，凡拿 DMS 说事的基本都错（DMS 是过程细节，不是这个信息服务的论点）。C“承认假说基于猜测”—— acknowledge 触发让步逻辑联想，但这里没有让步。D“说明海藻活动的全球影响”——无。E 过头：信息只说“也利己”,没否定“生物自私”这个前提本身。", "点拨": "看到 also 并列，马上往上看一层：**并列的两个信息共同支持谁**——答案就在上一层。"}}, {"type": "passage", "title": "实战六 · 黑人教育到底带来权利了吗（一文两题）", "source": "课程实录 · 信息作用题 + 句子功能题", "text": "Some historians have questioned the widely held belief that continuing improvement in education led to the gradual expansion of African Americans' rights in the southern United States from the late nineteenth century through the mid-twentieth century. They note that the development of Black educational institutions was never rapid or steady: disparities between Black and White schools sometimes grew, and educational gains for Blacks did not bring commensurate economic gains. Beginning in 1940, even as Black and White schools tended toward equality, Black southerners remained politically marginalized and experienced systematic job discrimination. Although Black schools achieved near parity in per-pupil expenditures and teachers' salaries, Black income still lagged behind White income. Nonetheless, educational progress did contribute to economic and political empowerment. Black campaigns to support Black schools fostered a sense of community, nurtured political determination, and increased literacy. More importantly, politically outspoken Black newspapers achieved record circulation during this period as the literacy rate approached 90 percent. Finally, the leadership of the civil rights movement of the 1960s was composed largely of graduates of Black colleges."}, {"type": "q", "tag": "真题 · 信息作用题", "title": "第6题 · 提到“差距有时反而扩大”这个事实的目的", "source": "实战六", "pause": "冒号后面是解释——它解释谁？", "stem": [{"t": "The author mentions the fact that disparities between Black and White schools sometimes grew primarily in order to"}], "options": {"A": "support the view that the economic struggles of southern Blacks were largely due to educational inequality", "B": "give an example of the differences between Black schools in two historical periods", "C": "illustrate the unevenness of the progress made by Black schools in the southern United States", "D": "help explain why Blacks remained politically marginalized", "E": "provide evidence that educational progress was a precondition for economic progress in the segregated South"}, "answer": "C", "explain": {"思路": "冒号结构：黑人教育的发展**从不快也不稳（never rapid or steady）**——冒号后就是解释：黑白学校差距有时扩大、教育收益没带来相应经济收益。所以这个事实的作用=说明黑人学校进步的**不均衡（unevenness）**。C 正确。", "annot": "冒号=解释关系的信号弹。parity=公平，disparity=不公平；commensurate=相应的。", "辨析": "A“支持‘经济困境主要源于教育不平等’”——谈到不平等没错，但这句话的位置还没谈到经济，且它直接服务的是“不稳”这个点，C 更直接。B“两个时期黑人学校的差异”——不是一个时期两个学校的比较。D“解释黑人为何政治边缘化”——那是后面的信息。E“教育进步是经济进步的前提”——恰恰是要被质疑的方向。", "点拨": "标点也是逻辑：冒号/破折号后考“信息作用”，答案八九不离十是**冒号前那个论点**。"}}, {"type": "q", "tag": "真题 · 句子功能题", "title": "第7题 · 高亮句（Nonetheless, educational progress did contribute…）的功能", "source": "实战六", "pause": "nonetheless=让步转折：承认前面对，但后面更对。", "stem": [{"t": "Which of the following best describes the function of the highlighted sentence in the context of the passage as a whole?"}], "options": {"A": "It clarifies a point introduced in the preceding sentence.", "B": "It reiterates a point made in the passage's first sentence.", "C": "It questions the accuracy of some of the evidence used to support the historians' argument.", "D": "It introduces a perspective contrary to the view of those who endorse the belief.", "E": "It qualifies the interpretation made by the historians."}, "answer": "E", "explain": {"思路": "高亮句=作者真正的观点：教育进步**确实**带来了经济和政治权利。前文=历史学家质疑“教育→权利”（通篇说教育的不是）。nonetheless 的结构：承认你有点道理，但我的重点在后——这就是 **qualify（限制、削弱对方的解释，说它只对了一部分）**。E 正确。", "annot": "方向梳理：belief=教育能带来权利；historians 质疑 belief=教育带不来权利；作者 nonetheless=教育确实能带来一些权利。所以作者大方向**和 belief 一致**、和 historians 部分对立。", "辨析": "A“澄清前一句的观点”——它是**反转**前一句，不是澄清。B“重述首句观点”——方向反了。C“质疑历史学家论据的准确性”——它给的是**另外的论据**（报纸发行量、识字率、民权领袖出身），没说对方的证据不准。D 最阴：contrary to the view of those who endorse the belief=反对 belief 拥护者——但作者和 belief 是**同方向**的，对象方向错了。", "点拨": "**nonetheless/qualify 是绝配**：让步转折一出现，描述功能的词十有八九是 qualify（限定、部分削弱）。C vs E 的决赛圈：质疑证据准确性 vs 限定解释——文章没动对方证据，只是补了自己的证据并压过后文，所以是 qualify。"}}, {"type": "passage", "title": "实战七 · 纽芬兰岛的两拨人", "source": "课程实录 · 句子功能题", "text": "Was resource intensification — the contribution of more labor and time to subsistence activities in order to increase food production — by the Dorset Paleo-Eskimos and the Recent Indians on the island of Newfoundland simply a response to population pressure? Not exactly: in Newfoundland, population pressure arose not from steadily growing resident populations but from the arrival and lingering presence of new and significantly different populations. Newfoundland's hunter-gatherers, residents and newcomers alike, adjusted to the presence of other populations through niche differentiation. Building on a tradition emphasizing marine resources, the Dorset Paleo-Eskimos intensified their seal hunting in response to the arrival of the Recent Indians. And the Recent Indians, more familiar with broad-based interior environmental adaptation, intensified this adaptive strategy in response to the Dorset."}, {"type": "q", "tag": "真题 · 句子功能题", "title": "第8题 · 最后一句（高亮句）的功能", "source": "实战七", "pause": "最后两句是并列关系——并列的两个例子共同支持谁？", "stem": [{"t": "Which of the following best describes the function of the highlighted (final) sentence in the context of the passage as a whole?"}], "options": {"A": "It points out a flaw in a theory discussed earlier in the passage.", "B": "It demonstrates the need for additional research on a phenomenon mentioned earlier in the passage.", "C": "It underscores the importance of a characteristic mentioned earlier in the passage.", "D": "It supports an assertion made earlier in the passage.", "E": "It questions the evidence for a tradition mentioned earlier in the passage."}, "answer": "D", "explain": {"思路": "末两句结构并列：爱斯基摩人强化捕猎海豹（应对印第安人到来）/印第安人强化自己的适应策略（应对爱斯基摩人）——两个例子共同支持上层的论点：**纽芬兰的猎采者通过 niche differentiation（生态位分化）来适应其他人群的出现**。末句功能=支持前文的一个论断。D 正确。", "annot": "niche=生态位（各干各的，互不抢饭）。两个并列句地位平等，谁也不能说支持另一个——它们共同支持更上层的论点。", "辨析": "A“指出理论缺陷”——没有 flaw。B“表明需要更多研究”——没有。C 和 D 最接近：C 说“强调某特征的**重要性**”，但前面那个论点本身没谈“重要性”，只是陈述事实——概括选项时，assertion（论断）比 importance 更准确。E“质疑某传统的证据”——全文方向是正面支持，没有质疑。", "点拨": "并列双例句的功能题：答案永远是**它们头顶那句论点**，且用 assertion/point 这类中性词，比 importance 这种加料的词更稳。"}}, {"type": "passage", "title": "实战八 · 选择越多越满意？", "source": "课程实录 · 句子功能题 · 第一句的功能（易错）", "text": "Having a larger assortment to choose from increases consumers' expectations about matching their preferences. The heightened expectations seem logical, since assortments containing more varied items should increase the degree to which preferences can be matched. In reality, however, as assortment size increases, the expectation of realizing one's chosen preference usually does not rise much. Larger assortments may not actually offer more variety; the market may simply not supply the envisioned item, or, in the absence of search tools, consumers may miss a better choice. Thus, larger assortments can increase the likelihood that expectations will go unmet, leaving consumers less satisfied with choices made from larger rather than smaller assortments."}, {"type": "q", "tag": "真题 · 句子功能题", "title": "第9题 · 文章第一句的功能", "source": "实战八", "pause": "被反驳的到底是第一句还是第二句？想清楚再选。", "stem": [{"t": "Which of the following best describes the function of the first sentence in the context of the passage as a whole?"}], "options": {"A": "It offers a premise on the basis of which the author's conclusion is drawn.", "B": "It provides information that supports the inference made in the following sentence.", "C": "It introduces a concept that the author goes on to show is illogical.", "D": "It summarizes a position that the author then refutes.", "E": "It presents a phenomenon that the argument is intended to explain."}, "answer": "A", "explain": {"思路": "全文的论证链条：第一句（选择越多，期待越高）是**作者陈述的事实前提**→第二句（这种期待 seem logical 看似合理）才是被反驳的部分→随后解释为什么期待常常落空→结论：选择多反而更不满意。所以第一句=作者结论赖以得出的**前提（premise）**。A 正确。", "annot": "定位反驳对象看 seem/In reality：seem logical 的“看似”就是靶子，In reality 的转折打的是第二句。第一句在整个论证里始终是“BGM”——作者没否定它，后面的结论都踩着它展开。", "辨析": "B“支持下一句的推断”——下一句恰恰是被反驳的，第一句不为它背书。C“引出一个作者要证明不合逻辑的概念”——不合逻辑的是第二句的推断，不是第一句的事实。D“概括一个作者随后反驳的立场”——作者反驳的不是第一句。E“给出一个论证要解释的现象”——若是解释型，第一句后应跟原因分析；但文章是引申后反转，不是解释。", "点拨": "功能题最大的陷阱是**打错靶子**：先锁定“被反驳的到底是哪一句”，再判断目标句和它什么关系。靶子认错，四个选项都长得眉清目秀。"}}, {"type": "passage", "title": "实战九 · 死亡区域篇（返场）", "source": "课程实录 · 句子功能题", "text": "（全文见第15讲观点实战一）……Scientists dated the sediment and counted species of foraminifera in it: these species thrive in low-oxygen water, and the record indicates that nutrients can trigger low-oxygen conditions. 【高亮句：Foraminifera became abundant in the gulf's sediments after 1950, when farmers began using fertilizer, which is rich in nutrients.】 Researchers believe that increased use of fertilizer will lead to more extreme dead zones."}, {"type": "q", "tag": "真题 · 句子功能题", "title": "第10题 · 高亮句的功能", "source": "实战九", "pause": "高亮句是事实还是观点？它和最后一句什么关系？", "stem": [{"t": "Which of the following best describes the function of the highlighted sentence in the passage?"}], "options": {"A": "It reconciles two opposing theories about the dead zones.", "B": "It indicates what the initial impetus for the studies was.", "C": "It disputes a hypothesis that was presented in the preceding sentence.", "D": "It describes a problem with the methodology of the studies.", "E": "It provides evidence in support of a belief mentioned in the final sentence."}, "answer": "E", "explain": {"思路": "高亮句（1950 年后化肥启用→有孔虫变多）是**事实**，最后一句（化肥增加→死亡区域更极端）是研究人员的**观点**。前面一串事实顺延而下，共同支撑最后的观点——客观事实支持主观看法，中间没有反转。E 正确。", "annot": "事实→观点的经典结构：日期、数据、观察到的事实都是弹药，最后一句观点句才是枪口。", "辨析": "A“调和两个对立理论”——文章没有两个对立理论。B“表明研究的最初动因”——高亮句是研究**结果**，不是动因。C“反对前一句的假说”——它是顺着前一句说的，方向相同。D“描述方法论问题”——无。", "点拨": "句子功能题先判**身份**（事实/观点/例子），再看**方向**（支持/反驳/无关）。身份+方向一锁定，五个选项只剩一个。"}}, {"type": "teach", "title": "② Select the sentence：功能题的反向玩法", "ppt": ["题目给你作用/信息，你点出文章中的那句话", "和功能题互为逆运算：本质都是考“信息在文章中的作用”", "点句子时任点句中一个词即选中", "做题要点：按题目要求的功能去文中定位，小心‘对象错位’的干扰句"], "text": ["Select in Passage 没有选项可排除，但它和功能题是**同一枚硬币的两面**：功能题给句子问作用，点句题给作用找句子。", "步骤：①读懂题目要什么功能/什么信息（这是核心，后面大串修饰是辅助定位）;②带着这个期待回文扫描；③注意**相似但对象错位**的干扰句（马上就有两道实战演示）。"]}, {"type": "passage", "title": "实战十 · 政党范式之争", "source": "课程实录 · 点句子题 + 主题题", "text": "Some historians have recently challenged the “party period paradigm” advanced by Martin and others — the view that political parties, especially the two major parties, evoked extraordinary loyalty from voters and dominated political life in the United States during this period. (S1) Van Buren cites the frequency of third-party eruptions during the period as evidence of popular antipathy toward the two major parties. (S2) Others emphasize the prevalence of nonpartisan and anti-party sentiment in the governance of the era. (S3) Yet Martin would deny that such anti-party sentiment existed at all, pointing out that the major parties retained broad organizational support throughout the period."}, {"type": "q", "tag": "真题 · 点句子题", "title": "第11题 · 选出“某历史学家回应质疑”的那句话", "source": "实战十", "pause": "正式考试直接点文章句子；这里把候选句做成选项。", "stem": [{"t": "Select the sentence that describes how a historian might respond to attempts to question his theory.（本题把候选句做成选项，选出对应的那句）"}], "options": {"A": "S1: Van Buren cites the frequency of third-party eruptions as evidence of popular antipathy toward the two major parties.", "B": "S2: Others emphasize the prevalence of nonpartisan and anti-party sentiment in the governance of the era.", "C": "S3: Yet Martin would deny that such anti-party sentiment existed at all."}, "answer": "C", "explain": {"思路": "题目拆解：①得有一个历史学家**的理论被质疑**——Martin 的政党范式被近来一些历史学家 challenge;②他得**做出回应**。S3 的 “Yet Martin would deny that such anti-party sentiment existed”=他（可能）否认反党情绪的存在——这就是他对质疑的回应。C 正确。", "annot": "would/might 是作者的**推测**（他多半会否认），不是马丁真的回应过——题目问“might respond”，与 would deny 的情态正好对上。", "辨析": "S1、S2 都是**质疑方**的弹药（第三党频发、反党情绪流行），是 challenge 的内容，不是被质疑者的回应。看到“回应质疑”就找范式**提出者本人**的动作，别选到挑战者阵营里去。", "点拨": "点句子题先分清**阵营**：谁提出、谁质疑、谁回应。题目要哪个阵营的动作，就去哪个阵营的句子里找。"}}, {"type": "q", "tag": "真题 · 主题题", "title": "第12题 · 本文的主要目的", "source": "实战十", "pause": "挑战 + 对挑战的回应，哪个选项能把两头都装下？", "stem": [{"t": "The primary purpose of the passage is to"}], "options": {"A": "correct a misconception about a historical period", "B": "identify a feature of a historical period that has often been overlooked", "C": "challenge the validity of evidence used to support a claim", "D": "discuss certain challenges to a particular view", "E": "explain a characteristic feature of the party period"}, "answer": "D", "explain": {"思路": "文章主线：Martin 的政党范式被提出→一批历史学家从各个角度挑战它→Martin（可能的）回应。D=讨论了针对**某个特定观点（a particular view）**的若干挑战——既装下挑战，也装下对挑战的讨论，覆盖最全。", "annot": "a particular view 的概括对象是首句的 the view（Martin 的范式）——主题题选项里 a particular/a certain 这种“模糊指代”经常就是正确答案的外套。", "辨析": "A“纠正关于某历史时期的错误观点”——文章重点是观点之争，不是纠正史实错误。B“指出常被忽视的特征”——没有。C“挑战支持某论断的证据的有效性”——只说了挑战的一面，装不下 Martin 的回应，且文章没说法据本身无效。E“解释政党时期的特征”——行文逻辑不是解释。", "点拨": "主题题选**覆盖面最大且方向正确**的那个。只说一半的选项（C）打不过两头都装的选项（D）。"}}, {"type": "passage", "title": "实战十一 · 村庄速写：男人写“同”，女人写“异”", "source": "课程实录 · 点句子题 · 对象错位陷阱", "text": "(S1) Buck's study of village sketches provides a valuable summary of sketches that depict the community as homogeneous and fixed, but it ignores those female authors who usually depicted the diversity of rural community life. (S2) Many of these women's sketches portray differences among community members. (S3) Still others stress differences among men and among women within the same community."}, {"type": "q", "tag": "真题 · 点句子题", "title": "第13题 · 选出“对比男人和女人描绘村庄生活方式之不同”的句子", "source": "实战十一", "pause": "小心：有“男女不同”字样的句子不一定是答案。", "stem": [{"t": "Select the sentence that contrasts the way men and women depicted village life.（把候选句做成选项）"}], "options": {"A": "S1: Buck's study summarizes sketches that depict the community as homogeneous and fixed, but ignores female authors who usually depicted the diversity of rural community life.", "B": "S2: Many of these women's sketches portray differences among community members.", "C": "S3: Still others stress differences among men and among women within the same community."}, "answer": "A", "explain": {"思路": "题目要的对比是：**描绘方式**的不同——男人（Buck 研究的速写）把村庄写成同质、固定；女人写多样性。S1 里 “homogeneous and fixed” vs “diversity” 正是两种描绘方式的对立。A 正确。", "annot": "最大干扰 S3：句子里明明有 among men and among women——但它的意思是**作品强调了男人与女人之间的差异**（内容上的男女不同），不是**男人和女人的描绘方式**不同。对象错了。", "辨析": "S2 只说了女人作品内部的一个特点，没有男女对比。S3 的“男女不同”是**作品内容的主题**，不是**作者性别的对比**——一字之差，答案就飞了。", "点拨": "点句子题看清**是什么和什么在比**。选项里有题目关键词原词复现（men and women）的句子，往往就是埋的雷。"}}, {"type": "passage", "title": "实战十二 · 赫斯顿的两个版本", "source": "课程实录 · 点句子题", "text": "(S1) When published in 1935, Mules and Men was Hurston's landmark collection of folktales — though it may not have been the book she originally had in mind. (S2) In this anthropological study, Hurston describes in detail how storytellers often insert themselves into the scene of their storytelling. (S3) But apparently Hurston had prepared another version, a manuscript only recently discovered after being forgotten since that time. (S4) This version differs from Mules and Men in that it simply records the stories, without descriptive or interpretive information. (S5) While we do not know for certain why Hurston's original version went unpublished during her lifetime, it may be that publishers wanted something more than a mere transcription of tales. (S6) The contemporary novelist and critic Jewell describes Black literary history as writing that seeks to escape its frame — an effort by Black authors to present stories without a mediating voice; in this respect, Hurston was ahead of her time."}, {"type": "q", "tag": "真题 · 点句子题", "title": "第14题 · 选出“1935 年版本为何是那样的”一个可能原因", "source": "实战十二", "pause": "题目核心是 a possible reason，其余修饰都是辅助定位。", "stem": [{"t": "Select the sentence that suggests a possible reason why Hurston wrote the version of Mules and Men published in 1935.（把候选句做成选项）"}], "options": {"A": "S2: Hurston describes how storytellers often insert themselves into the scene of their storytelling.", "B": "S4: The other version simply records the stories, without descriptive or interpretive information.", "C": "S5: It may be that publishers wanted something more than a mere transcription of tales."}, "answer": "C", "explain": {"思路": "题目要**可能的原因**：为什么出版版加了作者的主观描述？S5 给出推断——**可能是出版商想要的不仅仅是故事誊写**（所以要加料）。may be 与题目的 possible 情态吻合。C 正确。", "annot": "两个版本的区别是理解全文的钥匙：手稿版=只记录故事，无描述无解释；1935 出版版=把讲故事的人（包括自己）写进去了。mediating voice=作者插在故事与读者之间的主观声音。", "辨析": "S2 描述的是出版版的**特点**（怎么做），不是**原因**。S4 是手稿版的特点，同样不是原因。题目问 reason，只有 S5 带因果。", "点拨": "审题先抓核心要求（a possible reason），情态词（may/might）和因果词是定位信号。原因题别选“现象描述”句。"}}, {"type": "teach", "title": "③ 本讲收束", "ppt": ["信息作用题=判关系：对象与局部/全文的关系", "选项逻辑方向>内容相似：因果颠倒、对象颠倒、阵营站错，必错", "并列双信息向上找总句；冒号后向上找论点", "nonetheless 配 qualify", "点句子题是功能题的逆运算：看清“是什么和什么比”"], "text": ["本讲四种问法（mention/purpose/function/select sentence）本质相同：都是考**信息之间的关系**。", "下一讲进入逻辑类的另一半：词义猜测——GRE 的猜词题坑在“你认识的词义选项里全有，但都不是语境义”。"]}], "transcript": "好，这里是GRE阅读理解的第15节课，在这一节课当中，我们将继续讲解题型。这节课当中，我们会进行到逻辑类题目的第一讲。首先我们来说一下逻辑类的题目，主要可能会考察到什么样的角度，其实逻辑类的题目呢，主要测试的是在文章当中信息之间的关系。透过逻辑性来解决这道题，那么我们可以分成两个角度，分别是信息的作用和词义猜测。信息的作用偏向于这个信息，在文章中有什么作用以及和其他信息的关系，而猜词义由于在GRE当中涉及 但是明显的是her son，还有另外一个版本，这个another version就是这个版本。这是一个手稿，这个手稿呢？was recently discovered，被发现才被出版。被从这个时间开始忘了啊，最近才发现原来那个版这个版本不同于muse and慢，因为它简单的记录了故事，没有描述和解释性的信息。注意这两个版本的区别，缪斯在那漫当中，作者怎么了呢？他是描述了这些讲故事的人，同时还把自己插进去了。但是他一开始脑海当中那个another version怎么办？只是记录故事，没有描述性信息，这是两个版本的差别，到此为止。一开始在脑海当中那个版本，其实只是想记录故事，没有去。给自己的评价，但是后来那个版本把自己的评价加上了。虽然我们并不知道确定的知道为什么这个人原来的这个时候搞want unpublished，在生前没有出版，但是。可能是因为出版商想要一些东西多于transcription of s。腾写故事要多于腾写故事，那就是把自己加进去。出版商啊，活着时期的出版商想要的东西是不仅仅是一个藤烧故事，好注意，可能是因为这个，所以如果对于这道题的判断，这道题说的是可能的原因。出版没有再慢，可能的原因是什么？那就是这句话，可能是因为出版商想到的东西不仅是唐朝故事吧好，这是一个推断出来的原因。本题答案选的就是这句话。继续往下看。当代的小说家和评论家jew这个人描述黑人的文学，历史，写作的寻求，逃离这个框架。换句话说，一种努力黑人的作者去呈现故事，而不去加入调节的声音mediating，就是中间的声音。相当于什么呢？我写这个作品，我不想把自己的想法加进去，在这个方面啊her son还是领先于时代的，也就是her son确实写了一个版本，不加主观看法。非得加主观看法的才是那个时期的框框，但是黑人想逃离这个框架好，这是整篇文章的内容，所以选择刚才这句话代表的是possible reason。综合刚才这些选择句子的题目，也可以看到它跟问到功能的信息的题目，其实方向可以作为一种互逆的方向，它仍然可以体现出一个信息在文章中有什么样的作用。好，到此为止的话呢，关于逻辑类题目的第一个小节，我们就谈到这，这里的题体现的都是信息在文章中之间的关系。不同的问法形式，其背后的原理其实有一些共性，那么你就要看到这个信息，在文章中到底起到什么作用，以及跟其他信息是什么关系？"}, {"id": 17, "title": "第17讲 · 题型5：逻辑类2（词义猜测）", "intro": "逻辑类第二块：**词义猜测题**。GRE 猜词和托福完全不同——托福考你认不认识这个词，GRE 偏给你“你认识的那个意思”当陷阱：选项里可能躺着这个词的好几个常见义，只有**语境义**才对。做法=把它当填空做：把这个词从文中抠掉，根据上下文的逻辑线索推断空格里该是什么意思。4 篇文章、6 道题（含一词双题），全是“认识反而容易错”的典型。", "cards": [{"type": "teach", "title": "① GRE 猜词题：和托福的本质区别", "ppt": ["托福：认识这个词→基本就能选对", "GRE：你可能认识，但选项里有你认识的好几个意思——只有最符合语境的才对", "问法：某词/短语 closest in meaning to… / 替换后语义变化最小 / 某 term 指代什么", "“指代题”也归这里：问指代=考这个信息和其他信息的关联"], "text": ["被问到的对象可以是一个**单词**、一个**短语**，也可以是一个术语的**指代**——问指代本质也是考信息间的逻辑关联，所以都归在词义猜测。", "**基本做法：根据语境猜**。单词本身的意思只能辅佐理解，真正拍板的是上下文。", "语境范围可大可小：词若和全文主题/核心概念有关，要看全篇；只和局部细节有关，看局部就够——先把它的“管辖范围”摸准。"]}, {"type": "teach", "title": "② 核心心法：当填空题做", "ppt": ["把这个词当成空格抠掉，用前后文推它该是什么意思", "思路和 verbal 填空完全相通：空格左右的信息决定答案", "线索不直接时：把 5 个选项分别带回原文，谁的逻辑最贴谁当选"], "text": ["填空是根据空格前后的信息推断该填什么——阅读猜词一模一样：把目标词**假想成一个未知量**，用上下文推它。", "辅助招数：线索不直接时，**把选项挨个带回原文**,看哪个意思和上下文的对应性最好、逻辑最合适。", "⚠️ 铁律：没有上下文背书，不能凭词的表面意思直接选——尤其当选项里躺着它的“词典第一义”时，那往往就是埋的雷。"]}, {"type": "passage", "title": "实战一 · 赫斯顿篇（返场）：present", "source": "课程实录 · 猜词题", "text": "（全文见第16讲实战十二）……The contemporary novelist and critic Jewell describes Black literary history as a history of writing that seeks to escape its frame — in other words, an effort by Black authors to present stories without a mediating voice. In this respect, Hurston was ahead of her time."}, {"type": "q", "tag": "真题 · 猜词题", "title": "第1题 · present 在此最接近哪个意思", "source": "实战一", "pause": "present=“呈现”是词典义，但这里要你结合全文猜语境义。", "stem": [{"t": "Which of the following, if substituted for “present”, would LEAST change the meaning of the sentence?"}], "options": {"A": "hand over", "B": "donate", "C": "offer", "D": "propose", "E": "submit"}, "answer": "C", "explain": {"思路": "全文线索：赫斯顿的手稿版**只记录故事**（record/transcribe)，不加入自己的主观分析——黑人作家想逃离的框架就是“调节声音（mediating voice）”。所以 present 在这里=**客观地摆出来，不夹带主观**。offer=客观提供，放在这，你看不看随你——最贴。", "annot": "这道题的语境是**全篇级**的：present 的含义要靠两个版本的对比（记录 vs 加入主观）才能推出来——全文语境猜词的典型。", "辨析": "A hand over（递交）：有 hand（手）+over（从一端到另一端），是“塞给你”——但 present 的特点是“我放这儿，不递”。B donate（捐献）：带感情色彩（看你可怜/想让你变好）。D propose（提出/提议）：是人的主观主张，而这些故事不是作者“提出”的，只是摆着。E submit 词根拆解：sub（下）+mit（送）=**自下而上递交**，带上下级关系——作者没有把故事“上交给”读者的意思。", "点拨": "五个词全是“给”家族—— GRE 就爱这么玩。区别在于**给的方式有没有主观、有没有方向、有没有等级**。把词根拆开（sub+mit、pro+pose），差别自然显形。"}}, {"type": "passage", "title": "实战二 · 她被记住，是散文家还是小说家", "source": "课程实录 · 猜词题 · 词汇量大反而危险", "text": "A critical consensus has emerged that Mary McCarthy will be remembered primarily as an essayist rather than as a novelist. But although she had formidable gifts as a polemical and discursive writer, and for all her reputation as an intellectual who sacrificed feeling to intelligence, it was her fictional powers that made her best essays."}, {"type": "q", "tag": "真题 · 猜词题", "title": "第2题 · discursive 在此最接近哪个意思", "source": "实战二", "pause": "背过 discursive=“东拉西扯”？先放下，看上下文。", "stem": [{"t": "In the context in which it appears, “discursive” most nearly means"}], "options": {"A": "analytical", "B": "prolific", "C": "rambling", "D": "sophistical", "E": "circuitous"}, "answer": "A", "explain": {"思路": "①评论界共识：她主要被记住为**散文家（essayist）**而非小说家。②大转折 But 之后：“让她写出最好散文的，其实是她的**小说（fictional）**能力”——转折后强调小说能力，那么 although 让步里就该强调**散文/学术写作能力**:polemical and discursive writer 必是“散文型作者”的天赋。③五个选项里符合“散文/学术文章特点”的只有 analytical（分析性的）。", "annot": "句式拆解：But although…（虽然）…and for all…（尽管）…, it was her fictional powers that…——双重让步+主句转折。让步里出现 intellectual（学者）、sacrificed feeling to intelligence（为智性牺牲情感），全是“学术”信号。", "辨析": "C rambling（蔓延离题的）——**这就是词典上 discursive 的常见义，也是本题埋的雷**：词汇量大反而容易跳进去。但上下文要的是“散文特质”，不是“跑题”。B prolific（多产）、D sophistical（诡辩的）、E circuitous（迂回的）都不是散文的特点。⚠️ 顺带：别把 analytical 看成什么“智慧的/精确的”——你可能想的是 astute；也注意 sophisticated ≠ sophistical，词尾差一点意思就差很远。", "点拨": "**越是你背过的词，越要忍住手**。GRE 猜词题的正确答案经常是你“不认识的那层意思”（discursive 确有 analytical 这层学术义，查英英词典能看到）。"}}, {"type": "passage", "title": "实战三 · 把菲律宾裔美国人“带回生活”", "source": "课程实录 · 猜词题", "text": "Although Bulosan aimed through fiction and personal testimony to advance both Filipino civil rights in the United States and social transformation in the Philippines, Espiritu set herself the task of recovering the life histories of Filipino Americans. Her work brings Filipino Americans of the generation following the 1934 immigration to the United States graphically to life."}, {"type": "q", "tag": "真题 · 猜词题", "title": "第3题 · graphically 在此最接近哪个意思", "source": "实战三", "pause": "graphically=“用图表地”？这是阅读不是制图课。", "stem": [{"t": "In the context in which it appears, “graphically” most nearly means"}], "options": {"A": "in writing", "B": "by means of drawing", "C": "impressionistically", "D": "diagrammatically", "E": "vividly"}, "answer": "E", "explain": {"思路": "对比结构：Bulosan 靠**虚构和个人陈述**（fiction+testimony，主观加工）;Espiritu 的任务是 **recovering life histories（复原生活史）**——原来什么样就还原什么样。所以 graphically to life = 把这代人**鲜活地、如实地**带回生活=vividly。", "annot": "vivid 词根 viv=生命（vivid/survive/revive 一家）——“让它活过来”，正好对应 recover…to life。画面感：像走进清明上河园，满街宋朝人、实景演出——把当年原样还原出来。", "辨析": "A 靠写、B 靠画、D 靠图表——文章没谈手法，全是 graph- 字面的诱饵（托福风格选项）。C impressionistically（印象派式地）：印象=**主观**感受（同一件白衬衫，有人觉得干净、有人觉得道貌岸然、有人觉得像搞房地产的）——而 recover 是**客观还原**，方向相反；C 对应的是 Bulosan 的风格，不是 Espiritu 的。", "点拨": " graph- 家族的字面义（写/画/图表）排排坐当干扰项——**对比结构里，一个词的意思跟着它所属的那一派走**，先分清这是谁的风格。"}}, {"type": "passage", "title": "实战四 · “文学个性”值不值钱", "source": "课程实录 · 猜词题 · 感情色彩被语境同化", "text": "The significance of literary personality for the analysis of literary works has been examined in detail by many schools of contemporary criticism. The deconstructionists view literary personality as irrelevant — even unimportant. The historicists also devalue literary personality, since, in their emphasis on a work's historical context, they credit a writer with only those insights and ideas that were generally available when the writer lived."}, {"type": "q", "tag": "真题 · 猜词题", "title": "第4题 · credit a writer with 在此最接近哪个意思", "source": "实战四", "pause": "credit=赞扬？学分？先看它所在句子的态度方向。", "stem": [{"t": "In the context in which it appears, “credit (a writer) with” most nearly means"}], "options": {"A": "trust (a writer) with", "B": "applaud (a writer) for", "C": "believe (a writer) to have", "D": "presume (a writer) to have", "E": "accept (a writer) as having"}, "answer": "D", "explain": {"思路": "①历史主义者 also **devalue**（贬低）文学个性——also 表明和上一句（解构主义者认为它 irrelevant）同向，都是负态度。②since 因果顺承：他们 credit 作家**只有（only）**其生前能获得的洞见——大方向必须偏负。③credit 本身是个好词（信誉/赞誉/学分），但在这个负向语境里被**同化成中性偏负**——只剩“假定”这个不带褒义的动作。D presume 正确。", "annot": "only 是态度放大器：只承认作家有“生前能得到的”想法=这作家没什么了不起——和 devalue 严丝合缝。", "辨析": "A trust（信任）、B applaud（赞扬）、C believe（相信）、E accept（接受）全是好词——**感情色彩全军覆没**：一个负向语境里塞不进正向动词。只有 presume（假定）中性，能被语境染成负向。", "点拨": "词义猜不出就猜**方向**：所在句子态度为正，目标词就得能装进正向；态度为负，褒义词自动出局。credit 在这里的意思不是它自己决定的，是语境决定的。"}}, {"type": "passage", "title": "实战五 ·  porous frontiers 与孤岛实验室（一词双题）", "source": "课程实录 · 猜词题×2", "text": "Ecologists who study how millions of species share this world, rather than taking on the whole planet at once, generally focus on a single ecosystem — be it a prairie, a tidal flat, or a sand dune. Even within these limits, however, they are frustrated by porous frontiers. As a result, ecologists have done some of their most important work on islands, nature's own isolated laboratories, which may be colonized only a few times over the course of millions of years."}, {"type": "q", "tag": "真题 · 指代题", "title": "第5题 · porous frontiers 指代什么", "source": "实战五", "pause": "porous=多孔的，frontier=边界，“多孔的边界”不是人话——看逻辑反推。", "stem": [{"t": "The term “porous frontiers” refers to"}], "options": {"A": "a tendency for ecosystems in the region to shrink", "B": "human-induced processes that alter the features of ecosystems", "C": "the movement of species into an ecosystem from outside", "D": "variation in what the term “ecosystem” signifies", "E": "a lack of protection for endangered habitats"}, "answer": "C", "explain": {"思路": "逻辑反推链：被 porous frontiers **挫败（frustrated）**→ as a result，生态学家跑去找**孤岛**——孤岛的特点是“几百万年才被动植物**定居（colonize）几次**”，即**进来的物种极少**。所以让他们挫败的必是反面：**外面物种随便进来**。C=物种从外部迁入生态系统，正确。", "annot": "两题互为钥匙：porous frontiers 和 isolated laboratories 是**反义关系**——被“漏风的边界”打击，才去找“不漏风的孤岛”。解出任一题，另一题自动开。", "辨析": "A“生态系统缩小的趋势”——无。B“人类导致的过程改变生态系统”——进来的不一定是人，也可能是动物，human-induced 把范围缩窄了。D“ecosystem 一词含义的变化”——无。E“濒危栖息地缺少保护”——无。", "点拨": "as a result / therefore 前后的信息必同向衔接：**结果被建成什么样，原因就在阻碍什么**。用结果反推原因，是指代题的万能钥匙。"}}, {"type": "q", "tag": "真题 · 猜词题", "title": "第6题 · isolated 在此最接近哪个意思", "source": "实战五", "pause": "别急着选“隔绝的”——后面定语从句给了精确线索。", "stem": [{"t": "In the context in which it appears, “isolated” most nearly means"}], "options": {"A": "completely unpolluted", "B": "somewhat unusual", "C": "extremely rare", "D": "relatively inaccessible", "E": "strictly confined"}, "answer": "D", "explain": {"思路": "isolated 修饰 laboratories，后面 which 定语从句继续修饰它：几百万年里只被 colonize **几次**——即人和动物**很难到达、去得很少**。D relatively inaccessible（相对难以到达）正确。", "annot": "填空思维：核心名词 laboratories 有两个修饰——isolated 和后面的定语从句，两个修饰意思必相关，从句就是 isolated 的现成解释。", "辨析": "A“完全没被污染”——去得少和没污染没有必然关系。B“有些不同寻常”——unusual 在哪？没说。C“极其稀有”——文章讲“去得少”，不是“数量稀有”。E“
