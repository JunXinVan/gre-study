种问法形式。只不过呢，可能会相应的更简单一点，因为如果放在单体的文章中，它是需要你分析那一小篇文章的逻辑才能做的。但是对于234题的文章，往往只考一个局部信息来做，这种类型的题。所以做到此，我们就会把这种逻辑推理类的题目呢，给大家告一个段落了。对于逻辑推理类的题目来讲的话，它的做题思路和常规的阅读不太一样，所以想了解到这种题目，首先你还是要熟悉一下它的形式。其中第一种情况叫信息作用给两个或一个黑体信息问你作用的，其实跟我们讲到的逻辑类题目差不多，有一些共性。逻辑类题目当中也会问到你句子功能的，所以这种差别不大，第二种那种通过文章信息推断选项的，其实跟普通的阅读差别也不大，因为普通的阅读就是基于原文得出来一些结论和对论。然后第三，第四种情况就是选项正确，对于原文有什么作用，以及文章填空格的那种题，那这些题可能是我们不太熟的这种问法，所以。需要你明白的是，对于文章的逻辑链要熟问题的方向要熟，到底是加强削弱以及选项是怎么在符合问题的这个方向，并且跟文章逻辑链产生关系的。然后把这个东西熟悉了，这种类型的题就可以迎刃而解了，需要你通过这种正确的思路，加上一定的练习，熟悉它好，这就是关于逻辑推理这个部分的题型，我们就会说到这里。那么到此为止的话呢，我们就基本把所有的题型就给大家告一个段落，其实提醒并不是一个目的，它只是一种手段。就是告诉你，考试当中可能会出现这些类型的问题，根据问题的性质，把它归在哪个类别里？它的解题思路又是什么？大家通过平常的练习去熟悉这些问题的形式即可，最终的目的是考场看懂问什么把题做出来，这才是我们最终想要达到的目标。"}, {"id": 21, "title": "第21讲 · 综合应用1", "intro": "综合应用=把前面学过的两大功夫——文章分析（抓逻辑主线）和题目分析（看懂问题+判断选项）——放进完整文章里实战。本讲 5 篇文章、12 道题：①睡眠的不动假说（不定选+黑体句作用）;②彗星是不是太阳系原始遗迹（四连反转）;③新仙女木事件的冰川湖理论被反驳；④普韦布洛大房子的炉子与人口之争（三题）;⑤蓝离散星到底由几颗恒星撞成（三题）。每篇的标准流程：先暂停自己做，再对照解析，最后回炉难词难句、捋逻辑框架。", "cards": [{"type": "teach", "title": "① 综合应用是什么：把方法装进完整文章", "ppt": ["前面学的两大块：文章分析（逻辑主线）+题目分析（审题、选项判断）", "综合应用=把这两块整合，放在一篇完整文章里跑通", "每篇文章先点暂停，自己把后面的题做完", "做完再听解析，对照自己和讲解的分歧在哪"], "text": ["在此之前我们讲了 GRE 阅读的特征、做题的方法，以及怎么分析文章、怎么分析题目。综合应用部分不再教新招，而是把所有这些内容**整合在一篇完整的文章里**：怎么用文章分析帮我们读懂，怎么用题目分析帮我们选对。", "打开方式：看到文章先暂停，把跟它有关的题自己做完，再回来听解析。综合应用要练的就是**完整流程**——读文章用逻辑方式理解，做题时看懂问题、跟文章对应之后参照选项，每一步都是以前练过的功夫。"]}, {"type": "teach", "title": "② 练后回炉三步：错题要归因", "ppt": ["第一步：回头把没读懂的地方（词汇、句子）再理解一遍", "第二步：捋一遍文章的逻辑性，建立整体框架", "第三步：错题归因——是审题出了问题，还是选项判断出了问题？"], "text": ["做完题不是结束。第一，把文章里你**没有读懂的地方**——某个词汇、某个句子——再理解一下；第二，把文章的**逻辑性捋一遍**，建立一个整体框架，做到不看原文也能复述主线。", "做错了题，别只对个答案就翻篇：问自己这一题错在**审题**（问题问的是谁、问什么没看清），还是错在**选项判断**（对应文章信息时判断失误）。两种错因的补强方法完全不同，归因对了才能提分。"]}, {"type": "teach", "title": "③ 本讲五篇文章的共性打法：逻辑词串主线", "ppt": ["方向一致=顺承支持：后句还是讲同一件事，大意可预判", "转折（however/but)=否定前文，是出题密集区", "并列（additionally)=跟前句同向，一起攻击或一起支持", "不定选题：没有捷径，逐点回文核对，每个选项都要给出处", "视角题：先分清问的是谁（作者/某学者），再做题"], "text": ["这五篇文章套路一致：先抓**逻辑词**串主线。后面句子跟前文方向一致，就是顺承支持，大意可以提前预判；出现 however/but，就是对前文的否定，转折处几乎必出题；additionally 是并列，跟前句同向作战。", "遇到不定选题（选所有正确项），没有技巧可言：逐点回文核对，每个备选项都要在原文找到出处或确认无出处。遇到问某人观点的题，先把**视角**分清——文章里常常学者说一套、作者说一套，干扰项全是拿另一方的内容来糊你。"]}, {"type": "passage", "title": "实战一 · 睡眠的不动假说（两题）", "source": "课程实录", "text": "Prominent among the theories of the function of sleep is Meddis' immobilization hypothesis, which holds that sleep does not serve a restorative function but rather plays a protective role during the time when animals cannot be usefully engaged in other activities. Meddis reasoned that animals not immediately threatened by predators would be safer if they passed the time sleeping. 【黑体句】Sleep would prevent an animal from moving about or responding to a harmless stimulus in ways that might attract the attention of predators.【黑体句完】 However, this hypothesis cannot readily explain why one often observes a rebound in sleep time or intensity following a period of sleep deprivation. Nor can it explain the existence of various states of sleep, which themselves may be associated with different functions."}, {"type": "q", "tag": "真题 · 不定选题", "title": "第1题 · 不动假说没能解释哪些事实", "source": "实战一", "pause": "问“没有解释”→定位到说缺陷的那一段，别去第一段找。", "stem": [{"t": "According to the passage, the immobilization hypothesis fails to account for which of the following facts?（不定选，选出所有正确项）"}], "options": {"A": "Sleep does not appear to be a uniform and unchanging state.", "B": "Under certain conditions animals appear to need more sleep than usual.", "C": "Animals rarely sleep when a predator has been detected nearby."}, "answer": "AB", "explain": {"思路": "文章结构很清楚：第一段讲假说**能**解释的（保护作用），第二段（However 之后）讲它**不能**解释的两点——①睡眠剥夺后时间和强度的 rebound（回弹）;②存在 various states of sleep（多种睡眠状态）。题目问“没有解释的事实”，答案就该出在这片。A=睡眠不是统一不变的状态→对应 various states，选。B=某些条件下动物需要比平时更多的睡眠→对应 rebound，选。C=发现捕食者在附近时几乎不睡觉→第二段没提，文章只说不被威胁时睡觉更安全，排。", "annot": "不定选题=回文逐点核对。词汇：uniform and unchanging=统一且不变的，正好反向对应 various（多样的）;rebound=回弹；deprivation=剥夺。注意 A 选项是**概括改写**：原文 various states 到了选项变成 not uniform and unchanging，意思一样字不一样。", "辨析": "C 错在无出处：第二段讲缺陷时只说了 rebound 和多种状态两件事，捕食者是第一段假说**内部**的信息（睡眠防捕食者），不属于“解释不了的现象”。", "点拨": "问“假说/理论**不能**解释什么”，直接锁定文章的转折段——第一段讲它能干什么，转折之后才是它干不了什么。结构感就是定位器。"}, "multi": true}, {"type": "q", "tag": "真题 · 句子作用题", "title": "第2题 · 黑体句在全文中起什么作用", "source": "实战一", "pause": "黑体句=第一段末句，先判断它和前文（假说）是支持还是反驳关系。", "stem": [{"t": "In the context of the passage as a whole, the highlighted portion serves primarily to"}], "options": {"A": "present a line of thinking that led scientists to qualify a widely accepted view", "B": "describe a basis on which a hypothesis has been advanced and supported", "C": "give the kind of reasoning that is applied in a branch of science", "D": "explain how a hypothesis can be tested empirically", "E": "relate the analysis that underlies a tentative explanation"}, "answer": "B", "explain": {"思路": "黑体句（睡觉防止动物乱动或对无害刺激做出吸引捕食者的反应）紧跟在 Meddis 的推理之后，是给假说**提供论据、提供支撑**的——方向一致，顺承。B“描述了一个假说得以提出并获得支持的基础（basis)”：文章开头确实是假说，这句话确实是它的支撑，中。", "annot": "句子作用题的核对清单：把选项的每个名词回文对——有没有“科学家”？有没有“被广泛接受的观点”？有没有“实验数据”?qualify 这个词我们谈过，它常出现在**让步转折**的反向逻辑里（限制一个观点的适用范围），但这里第一段根本没有反向逻辑，所以选项里出现 qualify 也不好使。empirically=实证，即用实验和数据来验证；tentative=临时的、不确定的。", "辨析": "A 要有三样东西：科学家、被广泛接受的观点、把观点范围缩小——第一段一样都没有，错。C“呈现了某科学分支中运用的推理种类”——要具体呈现推理方式本身，这句话是论据不是推理类型，错。D“解释假说如何能实证检验”——句子里没有任何实验、数据，错。E“一种临时/不确定解释背后的分析”——全文没说这个解释不确定，tentative 无出处，错。", "点拨": "作用题先看**方向**：跟前文同向，就往“支持/提供基础/展开”这类词上靠；出现转折词，才考虑“质疑/限制/反驳”。方向定了，一半选项自动出局。"}}, {"type": "passage", "title": "实战二 · 彗星：还是不是太阳系的原始遗迹（两题）", "source": "课程实录", "text": "Astronomers who study the formation of planets once believed that comets — because they reside mostly in the remote Oort cloud, where temperatures are close to absolute zero — must be pristine relics of the material that formed the outer planets. The conceptual shift away from seeing comets as pristine relics began in the 1970s, when laboratory simulations revealed that sufficient ultraviolet light reached comets to darken their surfaces, and that there were sufficient cosmic rays to alter chemical bonds or even molecular structures at the surface. Astronomers nonetheless believed that when a comet approached the Sun — where they could study it — the Sun's intense heat might remove the corrupted surface layer, exposing the interior. However, scientists then realized that comets might contain decaying radioactive isotopes that could have warmed the comet's interior enough to cause the interior itself to change."}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第3题 · 末句的“意识到”有什么作用", "source": "实战二", "pause": "realize 在这里=“意识到”（科学家的动作），不是“使成真”。", "stem": [{"t": "The author of the passage implies that the realization described in the final sentence had which of the following effects?"}], "options": {"A": "It introduced a new topic for study by astronomers interested in planetary formation.", "B": "It led astronomers to adopt a number of different strategies to determine the composition of comets.", "C": "It called into question an assumption that astronomers had made about comets.", "D": "It called into question the astronomers' ability to study the interior of comets.", "E": "It caused astronomers to revise their views of the composition of the outer planets."}, "answer": "C", "explain": {"思路": "末句有 However 转折，方向是**否定前一句**。前一句是天文学家自己的想法（太阳热量能剥掉被腐蚀的表面、露出内部）——末句的“意识到”（内部可能被放射性同位素自己加热改变了）正好质疑了前一句那个假设：暴露出来的内部也不是原始的。C“质疑了天文学家关于彗星的一个假设”，逻辑关系完全吻合。", "annot": "这篇文章四句话、四次反转：①彗星是原始遗迹→②实验室模拟说表面被改了→③但太阳能把改过的表面剥掉露出原始内部→④但内部可能也被放射性衰变加热改了。抓住转折词，内容再难（奥特云、宇宙射线、放射性同位素）逻辑也是清楚的。call into question=质疑。", "辨析": "A“引入了新话题”——全文都在研究行星/彗星的形成，不是新话题。B“导致采用多种不同策略”——文章没提任何策略。D“质疑天文学家研究内部的能力”——质疑的是他们关于彗星的**假设**，不是说他们水平不行，对象错了。E 错得最阴：文章讲的是**彗星**，不是 outer planets（外部行星），把 comets 偷换成 outer planets——要是改回来倒可能对。", "点拨": "内容难、逻辑清的文章（天文类常这样），问题问到信息关系时反而简单：**靠逻辑词判断方向，用对象名词核对选项**。E 这类选项就是考你有没有盯死讨论对象。"}}, {"type": "q", "tag": "真题 · 不定选题", "title": "第4题 · 关于实验室模拟，作者同意哪些说法", "source": "实战二", "pause": "模拟有两个面向：它揭示了什么（表面被改），以及它没能干掉什么（原始遗迹的可能性）。", "stem": [{"t": "It can be inferred that the author of the passage would agree with which of the following statements about the laboratory simulations?（不定选，选出所有正确项）"}], "options": {"A": "The simulations showed that despite the low temperatures in the Oort cloud, there was sufficient energy there to alter comets.", "B": "Astronomers were initially reluctant to accept what the simulations showed about the composition of comets.", "C": "The simulations themselves did not eliminate the possibility that comets contain pristine relics of material from the early solar system."}, "answer": "AC", "explain": {"思路": "A：奥特云温度接近绝对零度（第一段）没错，但模拟揭示有**足够的**紫外线和宇宙射线改变彗星的化学键和分子结构——“温度虽低，但有足够能量改变彗星”，sufficient 对 sufficient，选。C：模拟的本意是反驳第一句（彗星是原始遗迹），但它只证明了**表面**被改；而后面两句反转说明内部的事另有说法——从全文看，模拟并没有把“彗星含有早期太阳系原始物质”这个可能性**彻底怼死**，它是一种让步式的反驳。选。", "annot": "C 的难点在“themselves did not eliminate the possibility”——要结合**全文**判断：模拟只动了表面（darken surfaces、alter chemical bonds at the surface)，而“原始遗迹”说的是整体构成，表面被改≠处处不原始。reluctant=不情愿的。", "辨析": "B“天文学家起初不愿接受模拟结果”——文章从头到尾**没有写天文学家的态度**，reluctant 无中生有，排。", "点拨": "不定选题里常有 C 这种**让步型**选项（“并没有完全消除……的可能性”)：判断它要跳出单句、看全文逻辑链——反驳只打到表层，深层的可能是留着的。"}, "multi": true}, {"type": "passage", "title": "实战三 · 新仙女木事件：冰川湖放水理论被反驳（两题）", "source": "课程实录", "text": "For many years the leading theory of what caused the Younger Dryas — a dramatic reversal in a global warming trend — was a release of water from glacial Lake Agassiz. The theory posited that this meltwater flooded into the North Atlantic, lowering the salinity and density of surface waters enough to prevent them from sinking. Ocean currents were altered in such a way that the northward transport of heat in the ocean diminished, and the North Atlantic region was plunged back into near-glacial conditions. However, evidence has emerged that the Younger Dryas began long before freshwater flooded the North Atlantic. Additionally, the temperature changes induced by a shutdown of the North Atlantic heat conveyor system are too small to explain the Younger Dryas."}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第5题 · 作者暗示了冰川湖放水的什么", "source": "实战三", "pause": "问的是**作者**的看法——作者站在 However 后面，前面的 leading theory 全是别人。", "stem": [{"t": "The author of the passage implies which of the following about the release of water from glacial Lake Agassiz?"}], "options": {"A": "The notion that the release occurred has been challenged by more recent findings.", "B": "The release probably occurred much earlier than scientists have generally assumed.", "C": "The volume of the release would not have been sufficient to cause the Younger Dryas.", "D": "The timing of the release is such that it probably did not trigger the onset of the Younger Dryas.", "E": "The release was probably unrelated to the global warming trend that was taking place."}, "answer": "D", "explain": {"思路": "作者视角=However 之后：新仙女木（YD）在淡水涌入北大西洋**之前**就开始了→放水的时间决定了它不可能**触发** YD 的开始。D“放水的时间决定了它可能没有触发 YD 的开始”，直接命中。", "annot": "leading theory=处于领导地位的理论（感觉要被废，果然被废）。Younger Dryas=新仙女木事件，一次全球变暖趋势的剧烈反转（刷地变冷）。posit=假定；salinity=盐度；plunge back into=猛然回到。trigger the onset of=触发……的开始。", "辨析": "A 很有迷惑性：“放水**发生过**这个观点被新证据挑战”——错！作者否的不是水放没放（作者自己也说 freshwater flooded the North Atlantic)，否的是**因果先后**；challenged 的 notion 被偷换了。B“放水比科学家想的更早”——方向反了：按作者证据，放水比 YD **晚**，而 B 是相对科学家的假设说更早，错。C“水量不足以导致 YD”——文章谈的是时间和温度变化幅度，没谈**水量**够不够。E“放水跟当时的全球变暖趋势无关”——文章只讨论放水与 YD 的关联，跟全球变暖趋势的关系不知道，无出处。", "点拨": "观点题先**站队**：作者站在转折后，选项凡带着转折前视角的信息都可疑。A 式干扰的套路是：大词对（challenged)、小词偷换（challenge 的对象从“因果”换成“发生”）——逐词核对就露馅。"}}, {"type": "q", "tag": "真题 · 主旨题", "title": "第6题 · 文章主要关注什么", "source": "实战三", "pause": "主旨题先判全文走向：前半铺理论，However 后用至少两条证据反驳。", "stem": [{"t": "Which of the following best describes the primary concern of the passage?"}], "options": {"A": "presenting evidence that undermines an explanation", "B": "explaining the nature of a climatic phenomenon", "C": "questioning the timing of a particular event", "D": "discussing a new explanation for a phenomenon", "E": "suggesting revisions to a popular theory"}, "answer": "A", "explain": {"思路": "全文走向：开头 leading theory（融水导致 YD 的解释）→However 后证据一（YD 在放水前已开始）、证据二（热传送带关闭引起的温度变化太小，解释不了 YD)。作者用**证据反驳了一个解释**——A 三个词全中：presenting evidence（两条证据）✓,undermines（反驳）✓,an explanation（leading theory 的内容就是解释“what caused the Younger Dryas”)✓。", "annot": "主旨题把选项的每个成分往文章框架上套：被反驳的信息是不是“解释”？是——理论的作用就是解释成因。把 explanation 换成 theory 也对，解释就是这个理论的内容特点。undermine=暗中削弱/反驳。", "辨析": "B“解释一个气候现象的性质”——若如此，文章应通篇解释现象成因，而不是反驳别人的解释。C“质疑某事件的时间”——文章确实提到时间，但那只是证据之一，主旨是反驳理论，以偏概全。D“讨论现象的新解释”——作者**没有给出新解释**，只是指出旧解释的证据有问题。E“对一个流行理论提出修改”——revision 的前提是**承认它大体对、小修小补**；作者是拿证据往死里怼，不是修改。", "点拨": "主旨题区分“反驳”和“修改”：反驳（undermine/challenge)=推翻；修改（revise/qualify)=承认+调整。看作者给没给替代方案、语气是保留还是否定，一对一个准。"}}, {"type": "passage", "title": "实战四 · 普韦布洛大房子的炉子与人口（三题）", "source": "课程实录", "text": "Pueblo Bonito, the most impressive of the great houses at the prehistoric Chaco Canyon site in New Mexico, comprised over six hundred rooms and four to five stories. The traditional interpretation of the great houses as almost entirely residential led archaeologists to estimate the population of Pueblo Bonito at roughly 1,200. But Windes has recently challenged this view by pointing out the paucity of hearths recorded during the excavation of Pueblo Bonito: the excavation revealed only three upper-story hearths, as against 59 ground-floor hearths; habitation rooms would have required hearths for cooking and heat. However, it is likely that the collapse of upper-story floors disturbed evidence of upper-story hearths to such an extent that it was not revealed by early excavations such as those conducted by Judd's field crews. Additionally, reliance on room features for early population estimates is complicated by the site's later remodeling — especially given Judd's unwillingness to destroy later structures and features to expose earlier ones. The failure of early excavations to strip off intact floors may have concealed evidence of hearths in upper-story rooms."}, {"type": "q", "tag": "真题 · 观点题", "title": "第7题 · 作者怎么看 Windes 的论证", "source": "实战四", "pause": "问作者对 Windes 的看法——作者站在 However 后：上层其实也住人，Windes 的证据有坑。", "stem": [{"t": "The author of the passage would most likely agree with which of the following statements about Windes' argument?"}], "options": {"A": "It relies on evidence that is irrelevant to the examination of structures as large as Pueblo Bonito.", "B": "It fails to acknowledge important evidence from great houses other than Pueblo Bonito.", "C": "It fails to incorporate evidence from excavations conducted before the 1920s.", "D": "It is based on a false notion about the significance of hearths.", "E": "It is based on evidence that may be incomplete."}, "answer": "E", "explain": {"思路": "文章链条：传统观点认为大房子几乎都住人（人口约 1200)→Windes 反对：上层只挖出 3 个炉子（下层 59 个），住人必须有炉子做饭取暖，所以上层不住人→However 反转：上层地板塌了，塌毁干扰了上层炉子的证据，所以早期发掘没发现；此外遗址后来翻修、Judd 又不愿破坏后期结构去揭早期结构，完整地板没被剥开，上层炉子的证据可能被**藏住了**。所以作者认为 Windes 的论证**基于可能不完整的证据**——他只看到 3 个炉子，但可能还有别的炉子没被发现。E 正确。", "annot": "hearth=炉子：火既能取暖又能做饭，古人必备；北方同学可以联想炕+灶。paucity=缺乏；as against=与……相对比；strip off=剥离；conceal=隐藏。观点题先定作者立场：However 之后才是作者的真话。", "辨析": "A“证据与这么大的结构无关”——证据是**有关**的，只是可能不完整，方向错。B“没承认其他大房子的证据”——文章没提其他大房子，而且他证据都考虑进去了。C“没纳入 1920 年代以前的发掘证据”——同理，能考量的他都考量了，问题不在漏掉哪次发掘。D“对炉子重要性的认知是错的”——炉子的意义（住人必须有）**他用对了**，错的是对**数量**的判断（3 个≠只有 3 个）。", "点拨": "“证据有错”分两种：证据本身不对（false)vs 证据不全（incomplete)。文章若说“还有证据没挖出来/被藏住了”，选 incomplete 不选 false——这是 GRE 的高频精细区分。"}}, {"type": "q", "tag": "真题 · 视角题", "title": "第8题 · Windes 会同意房间用途的哪个说法", "source": "实战四", "pause": "换成 Windes 的视角做题——他的核心观点：上层不住人，住人的在下层。", "stem": [{"t": "It can be inferred from the passage that Windes would be most likely to agree with which of the following statements about the use of rooms in Pueblo Bonito?"}], "options": {"A": "Upper-story rooms were rarely used as storage areas.", "B": "Rooms that were remodeled were most likely to have been residential rooms.", "C": "The majority of residential rooms were located on the ground floor.", "D": "Early excavations of Pueblo Bonito disturbed much of the evidence.", "E": "Upper-story rooms with hearths were probably used for different purposes than lower-story rooms with hearths."}, "answer": "C", "explain": {"思路": "Windes 的推理链：住人的房间必须有炉子（做饭+取暖）→上层只有 3 个炉子、底层 59 个→所以上层基本不住人，住人的房间集中在底层。C“大多数住人房间位于底层”——他的观点的直接改写，选。", "annot": "different purposes than=不同的用途（different from/than 都成立）。比较 C 和 E 时问自己：哪个跟**他的**推理链更直接？他从头到尾只谈“住人还是不住人”，没谈用途差异。residential=居住的。", "辨析": "A“上层房间很少用作储藏”——按他的观点上层不住人，那拿来储藏完全可能，“很少储藏”反而没依据，错。B“被翻修过的房间最可能是住人房间”——翻修（remodeling）是 However 之后作者一侧的信息，到他的观点里根本没出现，错。D“早期发掘扰乱了大量证据”——这是**作者**说的，不是 Windes 会认同的，视角错位，错。E“上层带炉子的房间与下层带炉子的房间用途不同”——他只比较住人与否，从没讨论上下层炉子房间**用途**的不同，属于堆词的加戏选项，错。", "点拨": "视角题的铁律：**用谁的脑子想问题**？D 这种选项内容是文章原话，但站错了队——它是作者的观点。先定视角再对内容，原话也可能是干扰项。"}}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第9题 · Judd 发掘队的工作有什么特点", "source": "实战四", "pause": "把 Judd 发掘队在文中干的两件事列出来，再逐个对选项。", "stem": [{"t": "Which of the following can be inferred about the excavation work performed by Judd's field crews at Pueblo Bonito?"}], "options": {"A": "It failed to uncover many room features that existed prior to the site's later remodeling.", "B": "It failed to uncover any evidence of upper-story hearths.", "C": "It uncovered only habitation rooms.", "D": "It caused the collapse of upper-story floors.", "E": "It confirmed traditional population estimates for Pueblo Bonito."}, "answer": "A", "explain": {"思路": "Judd 发掘队在文中就干了两件事：①上层地板塌了，塌毁干扰了证据，他们**没挖出**上层炉子的证据；②遗址后来翻修过，Judd 不愿破坏后期结构去揭露早期结构，完整地板没被剥开→翻修**之前**的很多房间特征他们没发掘出来。A“未能发掘出遗址后期翻修之前就存在的许多房间特征”——正是第二件事，选。", "annot": "field crew=发掘队；strip off intact floors=剥开完好的地板。做这种题先把人物在原文的**全部出场点**找齐（这里有两次），选项逐个往出场点上挂。", "辨析": "B“没发掘出上层炉子的**任何**证据”——过强：他们挖出了 3 个上层炉子，只是没揭示出**该有的**那些，any 一棒子打死，错。C“只发掘了住人房间”——文章没说，错。D“导致了上层地板坍塌”——坍塌不是他们干的，错。E“证实了传统人口估计”——文章没提他们与人口估计的关系，错。", "点拨": "带 **any/only/all** 的绝对化选项先警惕：B 跟原文只差一个 any，就这一条从对变错。绝对词必须有原文的绝对表述撑腰，否则排。"}}, {"type": "passage", "title": "实战五 · 蓝离散星：几颗恒星撞出来的（三题）", "source": "课程实录", "text": "Hotter and more massive than the Sun, stars called blue stragglers are puzzling to astronomers, because such rapidly burning stars would not be expected to survive in ancient star clusters. Some researchers believe that a typical blue straggler is formed when two ancient lower-mass stars collide and merge into a single more massive, hotter star. Peter Leonard's theory, by contrast, holds that in low-density globular clusters — where mergers between single stars occur too infrequently to account for the observed quantity of blue stragglers — the stragglers are created instead by a group of stars: a pair of stars already orbiting each other presents a larger target for a third star or another pair, and once this new grouping forms, close encounters between the stars could prompt any two to merge as a blue straggler. His model predicts that each blue straggler has a distant orbiting companion — as appears true of many blue stragglers in the M67 cluster of the Milky Way galaxy."}, {"type": "q", "tag": "真题 · 细节作用题", "title": "第10题 · “larger target”暗示了什么", "source": "实战五", "pause": "定位「larger target」：它出现在 blue straggler 形成**之前**——选项里带 straggler 的先怀疑。", "stem": [{"t": "The reference to a 「larger target」 serves primarily to suggest why a"}], "options": {"A": "blue straggler would be more likely to collide and merge with another star", "B": "group of stars would be more likely to encounter other stars than would a blue straggler", "C": "group of stars would be more likely to interact with other stars than would a single star", "D": "blue straggler would be more likely to interact with a pair of stars than would a third star", "E": "third star would be more likely to encounter a pair than it would to encounter a blue straggler"}, "answer": "C", "explain": {"思路": "「larger target」说的是 Leonard 理论的机制：一对已经互相环绕的恒星形成**更大的目标**，方便第三颗星或另一对星撞上来。“更大”是跟谁比？跟**单个恒星**比——前面研究人员的理论就是两颗单星相撞。所以这句话暗示的是：为什么**一组恒星比单个恒星更容易与其他恒星相遇/互动**。C 正确。", "annot": "画出机制图：两颗星互相绕转=大目标→第三颗（或另一对）撞来→近距离遭遇促使其中两颗合并成 blue straggler→剩下那颗成为 distant orbiting companion（远距离半星）。orbit=环绕运行；prompt=促使。", "辨析": "关键洞察：此时 blue straggler **还没形成**，所以凡把 straggler 放进比较里的选项都错位——A“straggler 更可能与别的恒星相撞”、B“一组星比 straggler 更易遇到别的星”、D“straggler 更可能与一对恒星互动”，全错。E“第三颗星更可能遇到一对星而非 straggler”——又把 straggler 拉进来比，同样错。", "点拨": "作用题里，**时间线**是隐形判据：这个细节发生在哪个阶段？发生在结果形成之前的细节，就不可能解释结果本身的行为——带结果名词的选项集体出局。"}}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第11题 · 关于蓝离散星，文章暗示了什么", "source": "实战五", "pause": "全文都可能是答案来源，逐选项回文核对，警惕长得像原文的改写。", "stem": [{"t": "The information presented in the passage suggests which of the following about blue stragglers?"}], "options": {"A": "They originate from stars that are hotter and more massive than the Sun.", "B": "They are burning more rapidly than any of the other types of stars that are preserved in ancient star clusters.", "C": "They are older than most other types of stars within the same star cluster.", "D": "They are less numerous in low-density globular clusters than are pairs of stars.", "E": "They generally originate from the oldest stars among those found in ancient star clusters."}, "answer": "B", "explain": {"思路": "逐条核对。B：文章开头说这种 rapidly burning（快速燃烧）的恒星**不该**被指望在远古星团里留存下来——即：它们比星团里其他**被保留下来**的恒星类型烧得更快。B 是对第一句的直接改写，选。", "annot": "长得像原文≠对。A 把第一句的 hotter and more massive than the Sun 原样搬来，但那是 **straggler 自己**的特征，A 却说它由这样的恒星**构成**——构成它的是 ancient lower-mass stars，逻辑反了。ancient 修饰的是撞成它的两颗老恒星，不是它自己的年龄排名。", "辨析": "A 见 annot，偷换“自身属性”与“来源属性”。C“比同星团大多数恒星更老”——ancient 说的是来源恒星老，没说 straggler 自己比别的恒星老，错。D“在低密度球状星团中比成对恒星数量少”——文章谈的数量是“**几颗恒星形成一个 straggler**”，从没比较 straggler 与成对恒星的数目，错。E“来自星团中最老的恒星”——文章只说来自 ancient（老的）恒星，“最老”(oldest）无出处，错。", "点拨": "细节推断题两大杀手：**绝对词**(oldest、any 要小心核对）和**主语偷换**(A 把 straggler 的属性安到它的来源上）。选项越像原文，越要逐词对主语和逻辑。"}}, {"type": "q", "tag": "真题 · 细节定位题", "title": "第12题 · 文章引用什么证据反驳第二句的理论", "source": "实战五", "pause": "题目限定：证据必须**出自原文**。先确定第二句的理论是什么，再看 Leonard 拿什么反它。", "stem": [{"t": "The passage cites which of the following as evidence undermining the theory presented in the second sentence?"}], "options": {"A": "A discrepancy between the number of mergers between single stars in certain low-density globular cl 略了”，第二段给两个原因，第三段讲成功起义的记录为什么天然不可靠——捋完就是一句话：**成功的革命反而留不下参与者的信息**。抓住这句，四道题全是它的变体。", "**生词处置演示**:“1848年2月巴黎人民 revolt against the constitutional monarchy of Louis Philippe”——就算你连“起义”都不认识，就读成“巴黎人民站起来了，反对这个人的 monarchy”;monarchy 认识“君主”就够，constitutional monarchy=君主立宪。LP 是谁、几月几号，不影响理解主线。", "**同义替换意识**:文章里 insurrection、uprising、revolt 是同一批事；题目里的 testing 和文章里的 study/analyzed 是同一批动作。出题人靠换词藏答案，你靠换词找答案。"]}, {"type": "passage", "title": "实战一 · 二月革命：被忽略的胜利者（一文四题）", "source": "课程实录", "text": "In February 1848 the people of Paris rose in revolt against the constitutional monarchy of Louis Philippe. Despite the existence of excellent narrative accounts, the February Days, as this revolt is called, have been largely ignored by social historians of the past two decades. For each of the three other major insurrections in nineteenth-century Paris — July 1830, June 1848, and May 1871 — there exists at least a sketch of participants' backgrounds and an analysis, more or less rigorous, of the reasons for the occurrence of the uprisings. Only in the case of the February Revolution do we lack a useful description of participants that might characterize it in the light of what social history has taught us about the process of revolutionary mobilization.\nTwo reasons for this relative neglect seem obvious. First, the insurrection of February has been overshadowed by that of June. The February Revolution overthrew a regime, to be sure, but met with so little resistance that it failed to generate any real sense of historical drama. Its successor, on the other hand, appeared to pit key socioeconomic groups in a life-or-death struggle and was widely seen by contemporary observers as marking a historical departure. Through their interpretations, which exert a continuing influence on our understanding of the revolutionary process, the impact of the events of June has been magnified, while, as an unintended consequence, the significance of the February insurrection has been diminished. Second, like other “successful” insurrections, the events of February failed to generate the most desirable kinds of historical records. Although the June insurrection of 1848 and the Paris Commune of 1871 would be considered watersheds of nineteenth-century French history by any standard, they also present the social historian with a signal advantage: these failed insurrections created a mass of invaluable documentation as a by-product of authorities' efforts to search out and punish the rebels.\nQuite different is the outcome of successful insurrections like those of July 1830 and February 1848. Experiences are retold, but participants typically resume their daily routines without ever recording their activities. Those who played salient roles may become the objects of highly embellished verbal accounts or, in rare cases, of celebratory articles in contemporary periodicals. And it is true that the publicly acknowledged leaders of an uprising frequently write memoirs. However, such documents are likely to be highly unreliable, unrepresentative, and unsystematically preserved, especially when compared with the detailed records produced following a failed insurrection. As a consequence, it may prove difficult or impossible to establish for a successful revolution a comprehensive and trustworthy picture of those who participated, or to answer even the most basic questions one might pose concerning the social origins of the insurgents."}, {"type": "q", "tag": "真题 · 主旨（作者最同意）", "title": "第1题 · 关于革命，作者最同意哪个说法", "source": "实战一", "pause": "“作者最同意”=问文章的核心概念，别被局部细节拽走。", "stem": [{"t": "The author of the passage would most likely agree with which of the following statements regarding revolution?"}], "options": {"A": "Revolutionary mobilization requires a great deal of planning by people representing disaffected groups.", "B": "The objectives of the February Revolution were more radical than those of the June insurrection.", "C": "The process of revolutionary mobilization varies greatly from one revolution to the next.", "D": "Revolutions vary greatly in the usefulness of the historical records that they produce.", "E": "As knowledge of the February Revolution increases, chances are good that its importance will eventually eclipse that of the June insurrection."}, "answer": "D", "explain": {"思路": "文章总结完发现信息并不多，核心就一个：**成功的二月革命，参与者信息居然缺失；失败的起义反而留下宝贵记录**。革命与革命之间，产生的历史记录的有用性天差地别——D 正是这个核心的概括，选 D。", "annot": "chances are good (that)=很可能；eclipse 本义日食/月食，引申“盖过、使黯然失色”——第二段 overshadowed 的同义呼应；disaffected=不满的；radical=激进的。", "辨析": "A“需要大量计划”——全文与 planning 无关。B“二月的目标比六月激进”——激进程度文章没比较。C“革命动员的进程因革命而异”——文章比较的是**记录**的有用性，不是革命进程本身，偷换对象。E“二月的重要性终将反超六月”——文章说的是二月的重要性被 diminished，方向相反，纯属加戏。", "点拨": "主旨型“作者同意”题，答案必落在全文反复讲的那个点上。拿不准时问自己：这篇文章去掉哪句话就塌了？那句话的同义改写就是答案。"}}, {"type": "q", "tag": "真题 · 逻辑（反驳文中 claim）", "title": "第2题 · 最能反驳末段 claim 的是", "source": "实战一", "pause": "先锁死被反驳的那句话，再找跟它正面顶牛的选项。", "stem": [{"t": "Which of the following is the most logical objection to the claim made in the last paragraph of the passage?"}], "options": {"A": "The February Revolution of 1848 is much less significant than the July insurrection of 1830.", "B": "The backgrounds and motivations of participants in the July insurrection of 1830 have been identified, however cursorily.", "C": "Even less is known about the July insurrection of 1830 than about the February Revolution of 1848.", "D": "Historical records made during the July insurrection of 1830 are less reliable than those made during the May insurrection of 1871.", "E": "The importance of the July insurrection of 1830 has been magnified at the expense of the significance of the February Revolution of 1848."}, "answer": "B", "explain": {"思路": "末段 claim=对一次**成功的**革命，很难甚至不可能建立起参与者全面可信的图景、连最基本的问题都回答不了。要反驳它，就举一个成功革命**却建立了**参与者信息的例子。B:1830年七月起义（成功的那次）参与者的背景和动机**已经被确定**——直接撞在 claim 上，B 正确。", "annot": "objection=反驳；however cursorily=不管多么粗略（cursorily=粗略地）。注意末段 establish 的宾语是 picture,for a successful revolution 只是状语，别断错句。", "辨析": "A“二月不如七月重要”——重要性比较与“能否重建参与者图景”无关，也碰不到 claim。C“七月比二月知道得更少”——顺着原文方向，是支援不是反驳。D“七月的记录没五月的可靠”——可靠性比较，与“能不能建立”无关。E“七月的重要性被放大、盖过二月”——把第二段属于六月的事挪给七月，且同样不构成反驳。", "点拨": "反驳题三步：①划出被反驳的 claim 原句；②正确答案必须与它**正面冲突**（你说建不了，我说建好了）;③“重要性/可靠性/多少”这类旁逸比较，只要顶不到 claim 本身，全部排掉。"}}, {"type": "q", "tag": "真题 · 段落目的题", "title": "第3题 · 第二段是为了解释为什么", "source": "实战一", "pause": "why 后面要填的是“解释的对象”——回段首找指代词。", "stem": [{"t": "The purpose of the second paragraph is to explain why"}], "options": {"A": "the people of Paris revolted in February 1848 against the rule of Louis Philippe", "B": "excellent narrative accounts of the February Days exist", "C": "the February Revolution met with little resistance", "D": "a useful description of the participants in the February Revolution is lacking", "E": "the February Revolution failed to generate any real sense of historical drama"}, "answer": "D", "explain": {"思路": "第二段开头 Two reasons for this relative neglect seem obvious——this neglect 指代第一段的事实：**唯独二月革命缺少对参与者的有用描述**。所以第二段两个原因（被六月盖过+没留下想要的记录）解释的都是“为什么缺这份描述”,D 正确。", "annot": "指代链：this relative neglect → 第一段 largely ignored / we lack a useful description of participants。段落结构信号：First… Second…，看到 First 必等 Second。", "辨析": "A“巴黎人为何反路易·菲利普”——起义的**起因**，不是记录缺失的原因。B“为何存在优秀的叙事”——第一段让步信息，与忽视无关。C“为何没遇到抵抗”——这是原因一里面的小理由，不是第二段整体解释的对象。E“为何没有历史戏剧性”——同理，是原因一的下位细节。注意：**A/B/C/E 在原文全都找得到对应**，但都不是这道题问的对象。", "点拨": "段落目的题的狠招：五个选项可能全是文章真信息，比的是“谁才是问题问的那个”。回段落首句抓指代词（this neglect），它指什么，答案就是什么。"}}, {"type": "q", "tag": "真题 · 推断（作者认为什么重要）", "title": "第4题 · 理解革命动员，作者认为什么必不可少", "source": "实战一", "pause": "找作者从头到尾在惋惜“缺了什么”——缺的那个就是他眼里最重要的。", "stem": [{"t": "It can be inferred from the passage that the author considers which of the following essential for understanding a revolutionary mobilization?"}], "options": {"A": "A comprehensive theory of revolution that can be applied to the major insurrections of the nineteenth century", "B": "Awareness of the events necessary for a revolution to succeed", "C": "Access to narratives and memoirs written by participants in a revolution", "D": "The historical perspective provided by the passage of a considerable amount of time", "E": "Knowledge of the socioeconomic backgrounds of a revolution's participants"}, "answer": "E", "explain": {"思路": "通篇作者只关心一件事：你总得给出**参与者的背景信息**——第一段抱怨缺它，第二段解释为什么缺，第三段说缺了就连“参与者的社会来源”这种最基本的问题都答不了。所以作者眼中理解 revolutionary mobilization 的必需品=参与者社会经济背景的知识，E 正确。", "annot": "essential for=对……必不可少；socioeconomic backgrounds 正是第一段 a sketch of participants' backgrounds 和末段 the social origins of the insurgents 的合体重写。", "辨析": "A“能应用于各次起义的完整革命理论”——文章要的是**背景信息**的完整，不是理论的完整。B“知道革命成功所需的事件”——无。C“能读到参与者的叙事和回忆录”——最毒的诱饵：第三段恰恰说 memoirs 和 embellished accounts **不可靠、不具代表性**,C 是作者点名不信的材料。D“时间沉淀出的历史视角”——无。", "点拨": "“作者认为什么重要”=找他反复强调**缺失**的东西；反过来，作者批评过的材料（叙事/回忆录）绝不会是他眼里 essential 的东西——观点态度就是最好的排选项。"}}, {"type": "passage", "title": "实战二 · 汽车尾气与清洁替代燃料（一文四题）", "source": "课程实录", "text": "Although recent years have seen substantial reductions in noxious pollutants from individual motor vehicles, the number of such vehicles has been steadily increasing. Consequently, more than 100 cities in the United States still have levels of carbon monoxide, particulate matter, and ozone that exceed legally established limits. There is a growing realization that the only effective way to achieve further reductions in vehicle emissions is to replace conventional diesel fuel and gasoline with cleaner-burning fuels such as compressed natural gas, liquefied petroleum gas, ethanol, or methanol.\nAll of these alternatives are carbon-based fuels whose molecules are smaller and simpler than those of gasoline. These molecules burn more cleanly than gasoline, in part because they have fewer carbon-carbon bonds, and the hydrocarbons they do emit are less likely to generate ozone. The combustion of larger molecules, which have multiple carbon-carbon bonds, involves a more complex series of reactions. These reactions increase the probability of incomplete combustion and are more likely to release uncombusted and photochemically active hydrocarbon compounds into the atmosphere. On the other hand, alternative fuels do have drawbacks. Compressed natural gas would require that vehicles have a set of heavy fuel tanks, and liquefied petroleum gas faces fundamental limits on supply.\nEthanol and methanol, on the other hand, have important advantages over other carbon-based alternative fuels: they have a higher energy content per volume and would require minimal changes in the existing network for distributing motor fuel. Ethanol is commonly used as a gasoline supplement, but it is currently about twice as expensive as methanol, the low cost of which is one of its attractive features. Methanol's most attractive feature, however, is that it can reduce by about 90 percent the vehicle emissions that form ozone, the most serious urban air pollutant.\nLike any alternative fuel, methanol has its critics. Yet much of the criticism is based on the use of “gasoline clone” vehicles that do not incorporate even the simplest design improvements that are made possible with the use of methanol. It is true, for example, that a given volume of methanol provides only about one-half of the energy that gasoline and diesel fuel do; other things being equal, the fuel tank would have to be somewhat larger and heavier. However, since methanol-fueled vehicles could be designed to be much more efficient than “gasoline clone” vehicles fueled with methanol, they would need comparatively less fuel. Vehicles incorporating only the simplest of the engine improvements that methanol makes feasible would still contribute to an immediate lessening of urban air pollution."}, {"type": "q", "tag": "真题 · 细节因果题", "title": "第5题 · 汽油为何更容易不完全燃烧", "source": "实战二", "pause": "定位原文因果链，答案必须是链上的“因”，别选到链上的“果”。", "stem": [{"t": "According to the passage, incomplete combustion is more likely to occur with gasoline than with an alternative fuel because"}], "options": {"A": "the combustion of gasoline releases photochemically active hydrocarbons", "B": "the combustion of gasoline involves an intricate series of reactions", "C": "gasoline molecules have a simple molecular structure", "D": "gasoline is composed of small molecules", "E": "gasoline is a carbon-based fuel"}, "answer": "B", "explain": {"思路": "定位第二段：大分子、碳碳键多→燃烧涉及**更复杂的一系列反应**→这些反应增加**不完全燃烧**的概率。题目问原因，链条上“复杂反应”这一环就是答案，B 正确。", "annot": "intricate=复杂的（对应原文 complex series of reactions）;incomplete combustion=不完全燃烧；photochemically active hydrocarbons=光化学活性碳氢化合物（臭氧的前体）。", "辨析": "A“汽油燃烧释放光化学活性碳氢化合物”——这是不完全燃烧的**结果/伴随物**,是因果链的下游，不是原因。C“汽油分子结构简单”——说反了，分子更小更简单的是**替代燃料**。D“汽油由小分子构成”——同样说反。E“汽油是碳基燃料”——替代燃料也全是碳基，构不成差异，无法解释“为什么汽油更容易”。", "点拨": "because 型细节题：先把原文因果链画出来（A→B→C)，题目问哪环答哪环；链条下游的“结果项”(A）是最经典的干扰。"}}, {"type": "q", "tag": "真题 · 平行类比题", "title": "第6题 · 哪个情形与文章首句最相似", "source": "实战二", "pause": "parallel 在非数学语境=similar；先提炼首句的结构公式再套选项。", "stem": [{"t": "Which of the following most closely parallels the situation described in the first sentence of the passage?"}], "options": {"A": "Although a town reduces its public services in order to avoid a tax increase, the town's tax rate exceeds that of other towns in the surrounding area.", "B": "Although a state passes strict laws to limit the type of toxic material that can be disposed of in public landfills, illegal dumping continues to increase.", "C": "Although a town's citizens reduce their individual use of water, the town's water supplies continue to dwindle because of a steady increase in the total population of the town.", "D": "Although a country attempts to increase the sale of domestic goods by adding a tax to the price of imported goods, the sale of imported goods within the country continues to increase.", "E": "Although a country reduces the speed limit on its national highways, the number of fatalities caused by automobile accidents continues to increase."}, "answer": "C", "explain": {"思路": "首句结构公式：**个体改善（单车排污↓）+ 总量膨胀（车数↑）⇒ 总体问题没解决（仍超标）**——同一个对象，个体与总量朝相反方向走。C：个人用水↓ + 总人口↑ ⇒ 供水继续紧张——结构完全一致，C 正确。", "annot": "parallel 数学里=平行，这里=相似（和之前微观类讲的 analogous to 是同一考法）;dwindle=逐渐减少；fatality=死亡（人数）。", "辨析": "A“税率超过周边城镇”——拿自己跟**别人**比，文章是自己跟自己（个体vs总量）比。B“严格立法 vs 违法偷排继续”——法规与违法的对立，没有个体-总量结构。D“国货 vs 进口货”——两个对象的此消彼长。E“限速 vs 事故死亡”——限速和事故是两个不同变量，不是同一对象的个体与总量。", "点拨": "平行/类比题=套结构公式。先把原文情形抽象成一行符号（个体↓但总量↑⇒问题依旧），再逐个选项套；凡是比错对象（跟别人比、两个对象比）的一律出局。"}}, {"type": "q", "tag": "真题 · 推断题（条件陷阱）", "title": "第7题 · 专门为甲醇设计的车会怎样", "source": "实战二", "pause": "D 长得像原文？先检查它有没有偷偷丢掉原文的限定条件。", "stem": [{"t": "It can be inferred from the passage that a vehicle specifically designed to use methanol would"}], "options": {"A": "be somewhat lighter in total body weight than a conventional vehicle fueled with gasoline", "B": "be more expensive to operate than a conventional vehicle fueled with gasoline", "C": "have a larger and more powerful engine than a conventional vehicle fueled with gasoline", "D": "have a larger and heavier fuel tank than a “gasoline clone” vehicle fueled with methanol", "E": "average more miles per gallon than a “gasoline clone” vehicle fueled with methanol"}, "answer": "E", "explain": {"思路": "末段：烧甲醇的车可以设计得比“汽油克隆车”(gasoline clone，烧甲醇但沿用汽油车设计）**效率高得多**→需要的燃料更少→每加仑跑的里程更多。E 就是 efficient 的同义改写，E 正确。", "annot": "gasoline clone vehicle=照搬汽油车设计、只换甲醇燃料的车，是批评者拿来黑甲醇的靶子；average more miles per gallon=每加仑跑得更多=效率更高的白话版。", "辨析": "A“车身更轻”——没谈车重对比。B“使用更贵”——甲醇的低价恰是它的卖点，无支撑。C“引擎更大更强”——无。D“油箱比汽油克隆车更大更重”——**最坑的诱饵**：原文确实有 the fuel tank would have to be somewhat larger and heavier，但前面挂着条件 **other things being equal（其他条件相同时）**;D 把条件吃了，而专门设计的车恰恰改变了“其他条件”，结论不再成立。", "点拨": "推断题选项照抄原文细节时，先查它是否**省略了原文的限定条件**(other things being equal、if、when)。条件一丢，真理变谬误——D 就是教科书级示范。"}}, {"type": "q", "tag": "真题 · 推断（suggest）", "title": "第8题 · 关于空气污染，文章暗示了什么", "source": "实战二", "pause": "半对半错的选项最坑——每个名词短语都要回文核对。", "stem": [{"t": "The passage suggests which of the following about air pollution?"}], "options": {"A": "Further attempts to reduce emissions from gasoline-fueled vehicles will not help lower urban air pollution levels.", "B": "Attempts to reduce the pollutants that an individual gasoline-fueled vehicle emits have been largely unsuccessful.", "C": "Few serious attempts have been made to reduce the amount of pollutants emitted by gasoline-fueled vehicles.", "D": "Pollutants emitted by gasoline-fueled vehicles are not the most critical source of urban air pollution.", "E": "Reductions in pollutants emitted by individual vehicles have been offset by increases in pollution from sources other than gasoline-fueled vehicles."}, "answer": "A", "explain": {"思路": "第一段逻辑：单车排污虽减，但车数猛增→100多个城市仍超标→结论是 the only effective way =换清洁燃料。换句话说：**继续在汽油车减排上做文章没用**——A 正是第一段的言下之意，A 正确。", "annot": "suggest 放在问题里=“暗示”（选文章没直说但能推出的）;offset=抵消；be not the most critical source 涉及跟其他污染源的比较，原文无比较。", "辨析": "B“减少单车排污的努力基本不成功”——方向反了：原文说单车排污**确实大幅减少**了。C“没怎么认真尝试过”——同样反了，尝试认真且见效，只是架不住车多。D“汽油车不是城市空气污染最关键的来源”——要跟其他来源比才知道，文章没比。E“单车减排被**其他污染源**的增加抵消”——前半对（减排确实被抵消），后半偷换对象：抵消它的是**车辆数量的增加**，不是汽油车以外的污染源。", "点拨": "E 式“半对选项”是 suggest 题的标配陷阱：前半句从原文抄，后半句偷换一个名词。把选项拆成几段逐段回文核对，它自己就露馅。"}}, {"type": "teach", "title": "② 逻辑推理短题：五种考法，五把钥匙", "ppt": ["加强/使结论成立：补一座桥，让结论必然成立", "削弱：切断“由A推B”的因果链", "假设：补上论证缺的那块拼图，对象必须与论证一致", "解释矛盾：矛盾双方都是事实，引入第三方变量让两事实共存", "完成文章（空格前有 since)：给结论配一个能站住的原因"], "text": ["逻辑推理题的题干极短，考的纯是推理结构。本讲五道各代表一种考法：", "**使结论成立（第9题）**：论据只覆盖了两类电影，结论却是“所有电影都不看”——补上“飞机上只有这两类”这座桥（C)，结论才严密。反向选项（E“还有第三类”）是削弱。", "**削弱（第10题）**:社论由“被起诉者全是政敌任命”推出“因政治归属被盯上”。最狠的削弱不是说情，而是证明这个“特征”根本不构成区分——几乎所有官员都是政敌任命的（C)，归因自动失效。", "**假设（第11题）**:150年干旱 vs 树只活了120年，中间差30年——补上“湖床干涸到树开始长不足30年”(E)，数字才咬合。筛法：对象必须一致（只谈 Jeffrey 松），取反后论证必垮。", "**解释矛盾（第12题）**:矛盾双方（长得快、繁殖快 vs 数量反而少）都是事实，谁都不能动——引入第三方变量（上层有捕食者，B）让两事实共存。只复述或加剧某一方的选项直接排。", "**完成文章（第13题）**：空格前有 since，就是要填一个能撑起结论的原因：分不清是雷劈还是人为用火（E)，自然不能当作“控制用火早于智人”的证据。"]}, {"type": "passage", "title": "实战三 · 飞机上看不看电影（逻辑 · 加强）", "source": "课程实录", "text": "C never watches any of the films shown on commercial airline flights. Widely recommended films are shown on planes, but the poor picture quality would ruin his enjoyment of them, so he does not watch them there; and in any case he would never watch a film that has been widely reviled. Therefore, on an airplane C watches none of the films shown."}, {"type": "q", "tag": "逻辑 · 使结论成立", "title": "第9题 · 哪个选项让结论严密成立", "source": "实战三", "pause": "论据只堵了两类电影，“全都不看”还差一块——找出漏网之鱼并堵死它。", "stem": [{"t": "Which of the following, if true, would most enable the conclusion above to be properly drawn?"}], "options": {"A": "The only place where C watches widely recommended films is in a theater.", "B": "Widely recommended films are never shown on airplanes.", "C": "If a film shown on an airplane is not widely reviled, then it is widely recommended.", "D": "If the picture quality of films shown on airplanes were better, C would enjoy watching them.", "E": "Some films are neither widely recommended nor widely reviled."}, "answer": "C", "explain": {"思路": "论证：被广泛推荐的电影——画质差，不看；被广泛鄙视的电影——不看；结论：飞机上的电影全不看。漏洞：**飞机上只有这两类电影吗？**万一有既没被推荐也没被骂的第三种呢？C:“非被鄙视即被推荐”——飞机上只有这两类，两类都不看=全都不看，桥搭上了，C 正确。", "annot": "revile=辱骂、痛斥；enable the conclusion to be properly drawn=使结论能够被恰当地得出，是 strengthen 家族里“补桥”问法。", "辨析": "A“他只在剧院看被广泛推荐的电影”——若成立，他不在飞机上看电影就跟**画质差**无关了（画质好也不看），反而架空了原文的理由，削弱逻辑链。B“被广泛推荐的电影从不在飞机上放”——与原文“飞机上有、只是画质差”直接冲突。D“画质好他就会看”——顺着原文的推断，不是支撑论证的前提。E“有些电影既没被推荐也没被骂”——恰恰指出了漏洞，方向反了，是削弱项（现实中确有这种电影，所以更诱人）。", "点拨": "“使结论成立”题=搭桥：先问“论据没覆盖到哪个角落”，再选把那个角落堵死的选项；指出角落存在的选项（E）方向恰好相反。"}}, {"type": "passage", "title": "实战四 · 市长的反腐小组（逻辑 · 削弱）", "source": "课程实录", "text": "Newspaper editorial: Last year Mayor Stephens established a special law-enforcement task force with the avowed mission of eradicating corruption in city government. The mayor's handpicked task force has now begun prosecuting a dozen city officials. Since all of these officials were appointed by Mayor Bixby — the current mayor's predecessor and longtime political rival — it is clear that they have been targeted for prosecution because of their political affiliation."}, {"type": "q", "tag": "逻辑 · 削弱", "title": "第10题 · 哪个选项最削弱社论的论证", "source": "实战四", "pause": "结论是“因为政治归属被搞掉”——证明这个特征毫无区分度，归因就塌了。", "stem": [{"t": "Which of the following, if true, most seriously weakens the editorial's argument?"}], "options": {"A": "Complaints of official corruption in city government have decreased since the anti-corruption task force began operating.", "B": "Former Mayor Bixby did not publicly oppose Mayor Stephens' establishment of the task force.", "C": "Nearly all of the officials who have served in the city government for any length of time are appointees of Mayor Bixby.", "D": "All of the members of the anti-corruption task force had other jobs in addition to their work on the task force.", "E": "During the last mayoral election campaign, then-Mayor Bixby hotly disputed the current mayor's claim that there was widespread corruption in city government."}, "answer": "C", "explain": {"思路": "社论结构：被起诉的十几个官员**全是**前任兼政敌 Bixby 任命的→很明显，他们是因为政治归属被盯上的。注意：内容上这是由果推因（结构上是结论，逻辑上是归因）。C：在市政府干过一阵子的官员**几乎全都是** Bixby 任命的——那么“全是 Bixby 的人”就毫无指向性：随便起诉谁，都会“全是 Bixby 任命的”。政治归属这个解释自动失效，C 正确。", "annot": "avowed=公开宣称的；eradicate corruption=根除腐败；handpicked=亲手挑选的；political affiliation=政治归属/派系；prosecute=起诉。", "辨析": "A“反腐投诉减少了”——只说明小组工作有效，碰不到“为何偏偏是这十二个人”的因果链。B“前任没公开反对过”——公开私下无所谓，不构成他因。D“小组成员都有别的兼职”——无关信息。E“上次选举两人激烈争吵过腐败问题”——诱导你脑补“怀恨在心、借机报复”，反而顺着社论的方向加戏，不是削弱。", "点拨": "削弱“因为X所以Y”的最狠一招：证明 **X 根本不构成区分**(X 人人都沾）。归因需要差异，差异没了，结论就塌——比找“其他原因”更致命。"}}, {"type": "passage", "title": "实战五 · 湖床里的松树（逻辑 · 假设）", "source": "课程实录", "text": "In the shallow end of Lake T there are remains of numerous Jeffrey pine trees that grew there during a lengthy drought. Researchers had believed that the drought lasted at least 150 years, but carbon dating has revealed that the pines were growing in the lake bed for only 120 years. Since Jeffrey pines cannot survive in water and must have died at the end of the drought, the dating shows that the drought lasted less than 150 years."}, {"type": "q", "tag": "逻辑 · 假设", "title": "第11题 · 论证依赖的假设是", "source": "实战五", "pause": "150 与 120 之间差着 30 年空档——谁把这个空档填上，谁就是假设。", "stem": [{"t": "The argument above depends on assuming which of the following?"}], "options": {"A": "No other trees started growing in the lake bed during the drought.", "B": "No tree remains of any kind are preserved at the bottom of the lake.", "C": "There was at least one tree in the lake bed that was alive for the entire period of the drought.", "D": "There has not been a more recent drought that caused a drying up of the shallow end of the lake.", "E": "The shallow end of the lake had been dry for less than thirty years by the time the Jeffrey pine trees started growing in the lake bed."}, "answer": "E", "explain": {"思路": "数据咬合：干旱≥150年；碳定年显示松树只在湖床长了120年；松树不能活在水里、干旱一结束它就死→结论：干旱不到150年。链条缺一环：**湖床干涸（干旱开始）之后多久松树才开始长？**若这段间隔超过30年，120+间隔就超过150，结论垮。E：湖床变干到松树开始长不足30年——正好补上空档，E 正确。", "annot": "assumption=论证成立所必需、但作者没明说的前提；carbon dating=碳定年法。验证法：把 E 取反（干了超过30年树才长）→ 干旱可能真有150年→论证立刻崩。", "辨析": "A“干旱期间没有其他树开始生长”——论证只建立在 Jeffrey 松上，别的树无关。B“湖底没有保存任何种类的树木遗迹”——与第一句“有松树遗迹”冲突，且对象太宽。C“至少有一种树活满了整个干旱期”——找别的树去，与松树论证无关。D“近来没有再次干旱”——文中讨论的是古代那次，时间错位。", "点拨": "假设题两筛子：①**对象一致**——论证围绕谁就选谁（这里是 Jeffrey 松），扯“其他树”的全排；②**取反测试**——把选项取反，论证必垮的才是真假设。"}}, {"type": "passage", "title": "实战六 · 浮游动物的悖论（逻辑 · 解释矛盾）", "source": "课程实录", "text": "During the day in Lake C, the zooplankton D. hyalina departs for the depths, where food is scarce and the water cold. D. galeata remains near the warm surface, where food is abundant. Even though D. galeata grows and reproduces much faster than D. hyalina, its population is often exceeded by that of D. hyalina."}, {"type": "q", "tag": "逻辑 · 解释矛盾", "title": "第12题 · 哪个选项能解决这个悖论", "source": "实战六", "pause": "矛盾双方都是事实，谁都不能动——找一个第三方变量让两事实共存。", "stem": [{"t": "Which of the following, if true, would most help to resolve the apparent paradox?"}], "options": {"A": "The number of species of zooplankton living at the bottom of the lake is twice that of species living at the surface.", "B": "Predators of zooplankton such as D. galeata live and feed near the surface of the lake during the day.", "C": "In order to make the most of scarce food resources, D. hyalina matures more slowly than D. galeata.", "D": "D. galeata clusters under vegetation during the hottest part of the day to avoid the sun's rays.", "E": "D. galeata produces twice as many offspring per individual in any given period of time as does D. hyalina."}, "answer": "B", "explain": {"思路": "矛盾：DG 在上层（水暖食多）长得快、繁殖快，数量却被下层（水冷食少）的 DH 超过。双方都视为事实，缺一个“上层条件虽好但**死得多**”的解释。B：白天，DG 的捕食者就在湖表活动和觅食——长得快架不住被吃得多，悖论消解，B 正确。", "annot": "zooplankton=浮游动物；exceed=超过；paradox=悖论。文章里所有信息都是“对的”，你的任务不是否定谁，是解释它们为何能同时成立。", "辨析": "A“湖底的浮游动物物种数是湖面的两倍”——只给现象不给原因，物种数也解释不了这一种的数量。C“DH 成熟得更慢”——成熟慢更该数量少，反而加深矛盾。D“DG 白天最热时躲在植被下遮阳”——与数量增减无关。E“DG 单体繁殖量是 DH 的两倍”——让矛盾更尖锐：生得更多怎么还更少？", "点拨": "解释矛盾题：正确答案必引入**新的第三方变量**（这里是捕食者）。只复述某一方（A)、加剧某一方（E)、与数量无关（C、D）的选项全部出局。"}}, {"type": "passage", "title": "实战七 · 控制用火的起源（逻辑 · 完成文章）", "source": "课程实录", "text": "It is commonly believed that the controlled use of fire originated about 200,000 years ago with the human species Homo sapiens. However, a site containing a deposit estimated to be nearly 500,000 years old — including charred bones, charcoal, and burned rocks — has recently been found. Although Homo sapiens did not exist at that time, this discovery provides no basis for the claim that the controlled use of fire preceded Homo sapiens, since ________."}, {"type": "q", "tag": "逻辑 · 完成文章（since 空格）", "title": "第13题 · since 后面填什么", "source": "实战七", "pause": "since 是逻辑词：填进去的内容必须能成为“这发现不算证据”的原因。", "stem": [{"t": "…this discovery provides no basis for the claim that the controlled use of fire preceded Homo sapiens, since"}, {"t": "(请选择能逻辑地完成文章的选项)", "bold": true}], "options": {"A": "the use of fire might have originated independently in several different parts of the world", "B": "it is possible that fire was used even earlier than 500,000 years ago", "C": "the rocks found in the deposit include several different kinds of stone, all found in the vicinity of the function fullPool(c, les){
  const seen = new Set(c.pool.map(q=>q.w));
  const pool = c.pool.slice();
  for (const card of les.cards){
    const groups = (card.items||[]).concat(card.extra||[]);
    for (const e of groups){
      if (e.src && e.src.length && !seen.has(e.w)){
        seen.add(e.w);
        pool.push({w:e.w, cn:(e.cn||'').split(/（/)[0], src:e.src});
      }
    }
  }
  return pool.slice(0, 18);
}

    if (c.type==='root'){
      rno++;
      return `<div class="card"><div class="chead"><span class="no">词根 ${rno}</span><h3>${c.title}</h3></div>
        <div class="pptbox">${c.ppt.map(x=>`<b>▎</b>${x}<br>`).join('')}</div>
        <div class="rootbox"><div class="vhead">📖 词汇串讲（先混眼熟，再逐个击破）</div>${
          c.items.map(it=>`<div class="ritem"><span class="rw">${it.w}</span><span><span class="rg">${it.cn}</span><div class="rn">${it.note}</div></span></div>`).join('')
        }</div>
        ${c.after?`<div class="afterbox">${md(c.after)}</div>`:''}${extraHtml(c)}${anchorsHtml(c)}</div>`;
    }
    if (c.type==='ext'){
      return `<div class="card"><div class="chead"><span class="no" style="background:#1e8449">拓展</span><h3>${c.title}</h3></div>
        <div class="pptbox">${c.ppt.map(x=>`<b>▎</b>${x}<br>`).join('')}</div>
        <div class="tbody">${c.text.map(t=>`<p>${md(t)}</p>`).join('')}</div></div>`;
    }
    if (c.type==='rootquiz'){
      return `<div class="card"><div class="chead"><span class="no" style="background:#ca6f1e">拆词</span><h3>${c.title}</h3></div>
        <div class="pausebar">✍️ ${c.note}</div>
        <div id="rqbox${ci}"></div></div>`;
    }
    if (c.type==='quiz'){
      return `<div class="card"><div class="chead"><span class="no" style="background:#ca6f1e">小测</span><h3>${c.title}</h3></div>
        <div id="quizbox${ci}"></div></div>`;
    }
    if (c.type==='passage'){
      return `<div class="card"><div class="chead"><span class="no" style="background:#2d6a4f">文章</span><h3>${c.title}</h3>
          <span style="font-size:12px;color:#999;margin-left:auto">${c.source||''}</span></div>
        <div class="pausebar">📄 考场模式：文章无任何批注。先通读全文（第一句读慢些），再做下面的题。</div>
        <div style="background:#fbfcfe;border:1px solid #e3e7f0;border-radius:10px;padding:18px 20px;font-size:15px;line-height:2.1;color:#222;white-space:pre-wrap;font-family:Georgia,'Times New Roman',serif;">${c.text}</div></div>`;
    }
    if (c.type==='q'){
      qno++;
      const st = p.q && p.q[ci];
      return `<div class="card" id="q${ci}"><div class="chead">
          <span class="no" style="background:#4a6cf7">题 ${qno}</span><span class="tag" style="background:#e9f7ef;color:#1e8449;font-size:12px;border-radius:6px;padding:2px 8px">${c.tag}</span><h3>${c.title}</h3>
          <span style="font-size:12px;color:#999;margin-left:auto">${c.source||''}</span></div>
        ${c.pause&&!st?'<div class="pausebar">⏸ 先自己选，再点选项。</div>':''}
        <div class="stem">${c.stem.map(s=>s.t).join('')}</div>
        <div id="optbox${ci}"></div>
        <div class="analysis" id="ana${ci}" style="display:none"></div></div>`;
    }
    return '';
  }).join('');
  MAIN.innerHTML = `
    <div class="lesson-head"><h1>${les.title}</h1><p>${les.intro}</p>
      <div class="lesson-progress" id="lp"></div></div>
    ${cards}
    <details class="raw"><summary>🎙 课堂原声全文（本讲转录稿，查漏兜底）</summary><div class="rawtext">${les.transcript||''}</div></details>
    <div class="card finish">
      ${p.done ? '<span class="done-badge">✅ 本讲已完成</span>' : `<button onclick="finishLesson()">我已完成本讲学习</button>`}
    </div>`;
  les.cards.forEach((c,ci)=>{
    if (c.type==='quiz') renderQuiz(c,ci,les);
    if (c.type==='rootquiz') renderRootQuiz(c,ci);
    if (c.type==='q'){ renderOptions(c,ci); if (p.q && p.q[ci]) reveal(c,ci,p.q[ci],false); }
  });
  updateStats(); renderNav();
}

/* ---- word quiz ---- */
function renderQuiz(c,ci,les){
  const box = document.getElementById('quizbox'+ci);
  const qz = (pOf(cur).qz) || {};
  const pool = fullPool(c, les);
  box.innerHTML = pool.map((q,qi)=>{
    const doneRec = qz['c'+ci+'q'+qi];
    const opts = buildOpts(pool, qi);
    return `<div class="qitem"><div class="qw">${q.w}${badge(q.src)}<span class="res" id="res${ci}_${qi}">${doneRec!==undefined?(doneRec?'✅':'❌ 正确答案：'+q.cn):''}</span></div>
      <div class="qopts" id="qo${ci}_${qi}">${opts.map(o=>`<button class="qopt" data-o="${encodeURIComponent(o)}" ${doneRec!==undefined?'disabled':''}>${o}</button>`).join('')}</div></div>`;
  }).join('');
  pool.forEach((q,qi)=>{
    const wrap = document.getElementById('qo'+ci+'_'+qi);
    if (!wrap || wrap.querySelector('button').disabled) return;
    wrap.querySelectorAll('.qopt').forEach(b=>{
      b.onclick = ()=>{
        const o = decodeURIComponent(b.dataset.o);
        const ok = o === q.cn;
        wrap.querySelectorAll('.qopt').forEach(x=>{
          x.classList.add('lock'); x.disabled=true;
          if (decodeURIComponent(x.dataset.o)===q.cn) x.classList.add('ok');
          else if (x===b) x.classList.add('bad');
        });
        document.getElementById('res'+ci+'_'+qi).textContent = ok?'✅':('❌ 正确答案：'+q.cn);
        recAnswer('c'+ci+'q'+qi, ok);
      };
    });
  });
}
function buildOpts(pool, qi){
  const q = pool[qi];
  const others = shuffle(pool.filter((x,i)=>i!==qi && x.cn!==q.cn && !similar(x.cn,q.cn)));
  const picked=[]; const seen=new Set([q.cn]);
  for (const o of others){ if(!seen.has(o.cn)){ seen.add(o.cn); picked.push(o.cn);} if(picked.length===3) break; }
  if (picked.length<3){
    for (const o of shuffle(pool)){ if(!seen.has(o.cn)){ seen.add(o.cn); picked.push(o.cn);} if(picked.length===3) break; }
  }
  return shuffle([q.cn, ...picked]);
}
/* ---- root quiz ---- */
function renderRootQuiz(c,ci){
  const box = document.getElementById('rqbox'+ci);
  const qz = (pOf(cur).qz) || {};
  box.innerHTML = c.items.map((it,qi)=>{
    const doneRec = qz['c'+ci+'r'+qi];
    const opts = shuffle(it.opts.map((o,i)=>({o, ok: i===it.a})));
    return `<div class="qitem"><div class="qw">${qi+1}. ${it.q}<span class="res" id="rr${ci}_${qi}">${doneRec!==undefined?(doneRec?'✅':'❌'):''}</span></div>
      <div class="qopts" id="qr${ci}_${qi}">${opts.map(x=>`<button class="qopt" data-o="${encodeURIComponent(x.o)}" data-ok="${x.ok?1:0}" ${doneRec!==undefined?'disabled':''}>${x.o}</button>`).join('')}</div>
      <div class="hint" id="rh${ci}_${qi}">💡 ${it.hint}</div></div>`;
  }).join('');
  c.items.forEach((it,qi)=>{
    const wrap = document.getElementById('qr'+ci+'_'+qi);
    if (!wrap || wrap.querySelector('button').disabled) return;
    wrap.querySelectorAll('.qopt').forEach(b=>{
      b.onclick = ()=>{
        const ok = b.dataset.ok === '1';
        wrap.querySelectorAll('.qopt').forEach(x=>{
          x.classList.add('lock'); x.disabled=true;
          if (x.dataset.ok==='1') x.classList.add('ok');
          else if (x===b) x.classList.add('bad');
        });
        document.getElementById('rr'+ci+'_'+qi).textContent = ok?'✅':'❌';
        document.getElementById('rh'+ci+'_'+qi).style.display='block';
        recAnswer('c'+ci+'r'+qi, ok);
      };
    });
  });
}
function recAnswer(key, ok){
  if (!progress[cur]) progress[cur]={};
  if (!progress[cur].qz) progress[cur].qz={};
  progress[cur].qz[key] = ok;
  save(); updateStats(); renderNav();
}
/* ---- big question (填空-style) ---- */
function renderOptions(c,ci){
  const box = document.getElementById('optbox'+ci);
  const isDual = !!c.dual;
  let html = '';
  if (isDual){
    for (const g of ['i','ii']){
      html += `<div class="grp"><div class="glabel">${g==='i'?'Blank (i)':'Blank (ii)'}</div><div class="opts">` +
        Object.entries(c.options[g]).map(([k,v])=>`<button class="opt" data-g="${g}" data-k="${k}" id="o${ci}_${g}${k}"><span class="ol">${k}</span>${v}</button>`).join('') + `</div></div>`;
    }
    html += `<button class="submit" id="sub${ci}" disabled>提交答案</button>`;
  } else {
    html += '<div class="opts">' + Object.keys(c.options).map(k=>`<button class="opt" data-k="${k}" id="o${ci}_${k}"><span class="ol">${k}</span>${c.options[k]}</button>`).join('') + '</div>';
  }
  box.innerHTML = html;
  const btns = [...box.querySelectorAll('.opt')];
  if (isDual){
    const sel = {};
    btns.forEach(b=>b.onclick=()=>{
      const g=b.dataset.g;
      btns.filter(x=>x.dataset.g===g).forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); sel[g]=b.dataset.k;
      document.getElementById('sub'+ci).disabled = !(sel.i&&sel.ii);
    });
    document.getElementById('sub'+ci).onclick = ()=>{ if (sel.i&&sel.ii) submitQ(c,ci,[sel.i,sel.ii]); };
  } else if (c.multi){
    const need = c.pickN || 2;
    const sel = new Set();
    const sub = document.createElement('button');
    sub.className='submit'; sub.id='sub'+ci; sub.textContent='提交答案'; sub.disabled=true;
    box.appendChild(sub);
    btns.forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if (sel.has(k)){ sel.delete(k); b.classList.remove('sel'); }
      else if (sel.size<need){ sel.add(k); b.classList.add('sel'); }
      sub.disabled = sel.size!==need;
    });
    sub.onclick = ()=>{ if (sel.size===need) submitQ(c,ci,[...sel].sort()); };
  } else {
    btns.forEach(b=>b.onclick=()=>submitQ(c,ci,[b.dataset.k]));
  }
}
function isCorrect(c, chosen){
  if (c.dual){
    const norm = c.answer.replace(/[^A-Z]/g, '');
    return chosen.slice().sort().join('') === [...norm].sort().join('');
  }
  return (c.answer.length===1) ? chosen[0]===c.answer : chosen.slice().sort().join('') === [...c.answer].sort().join('');
}
function submitQ(c,ci,chosen){
  const prev = (pOf(cur).q||{})[ci];
  if (prev) return;
  const ok = isCorrect(c,chosen);
  if (!progress[cur]) progress[cur] = { q:{}, qz:{} };
  if (!progress[cur].q) progress[cur].q = {};
  progress[cur].q[ci] = { ok, pick: chosen.slice() };
  save(); reveal(c,ci,progress[cur].q[ci],true); renderNav(); updateStats();
}
function reveal(c,ci,st,animate){
  if (c.dual){
    const pick = st.pick || [];
    ['i','ii'].forEach(g=>{
      Object.keys(c.options[g]).forEach(k=>{
        const b=document.getElementById(`o${ci}_${g}${k}`); if(!b) return;
        b.classList.add('lock');
        if (c.answer.includes(g+k)) b.classList.add('ok');
        else if (pick.includes(k)) b.classList.add('bad');
      });
    });
  } else {
    const ans = [...c.answer];
    Object.keys(c.options).forEach(k=>{
      const b=document.getElementById(`o${ci}_${k}`); if(!b) return;
      b.classList.add('lock');
      if (ans.includes(k)) b.classList.add('ok');
      else if ((st.pick||[]).includes(k)) b.classList.add('bad');
    });
  }
  const sub=document.getElementById('sub'+ci); if(sub) sub.style.display='none';
  const ex=c.explain;
  const ana=document.getElementById('ana'+ci);
  const ansTxt = c.dual ? `Blank(i) 选 ${c.answer.match(/i([A-Z])/)[1]}　Blank(ii) 选 ${c.answer.match(/ii([A-Z])/)[1]}` : [...c.answer].join('、');
  ana.innerHTML = `
    <div class="ans-line">正确答案：<span class="ok">${ansTxt}</span>
      ${st.ok===false?`　你的选择：<span class="bad">${(st.pick||[]).join('、')}</span>`:''}</div>
    <div class="ablock"><div class="atitle">① 解题思路</div><div class="acont">${md(ex['思路'])}</div></div>
    <div class="ablock"><div class="atitle">② 题干批注拆解</div><div class="annotbox">${ex.annot}</div></div>
    <div class="ablock"><div class="atitle">③ 选项辨析</div><div class="acont">${md(ex['辨析'])}</div></div>
    <div class="ablock"><div class="atitle">④ 老师点拨</div><div class="acont">${md(ex['点拨'])}</div></div>`;
  ana.style.display='block';
  if (animate) ana.scrollIntoView({behavior:'smooth', block:'start'});
}

function updateStats(){
  const les=L(cur); const p=pOf(cur);
  let total=0, done=0, right=0;
  les.cards.forEach((c,ci)=>{
    if(c.type==='quiz') total+=fullPool(c,les).length;
    if(c.type==='rootquiz') total+=c.items.length;
    if(c.type==='q') total+=1;
  });
  if(p.qz){ done+=Object.keys(p.qz).length; right+=Object.values(p.qz).filter(Boolean).length; }
  const el=document.getElementById('lp');
  if(el) el.textContent=`本讲进度：题目 ${done}/${total} 已答 · 答对 ${right}`;
}
function finishLesson(){
  if(!progress[cur]) progress[cur]={};
  progress[cur].done=true; save(); renderLesson(); window.scrollTo({top:0});
}
function resetProgress(){
  if(confirm('确定清空所有学习记录？')){ progress={}; save(); renderLesson(); }
}
function loadLesson(id){ cur=id; renderLesson(); window.scrollTo({top:0}); }
renderLesson();
</script>
