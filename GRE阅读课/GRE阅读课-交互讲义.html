 "所以推断题你的任务不是“推断”，是**判断**：哪个选项和文章信息关联最直接，哪个就是答案。推得越远、加戏越多的选项，越可疑。"]}, {"type": "teach", "title": "③ 两个过时的做题直觉，扔掉", "ppt": ["“选项词和原文重复/长得像=答案”——过时了", "出题人恰恰会把干扰项做得像原文，改一两处坑你", "正确姿势：看它重复在哪个位置，按逻辑判断", "细节定位：带论点读细节，从大到小找位置"], "text": ["“选项重复原文就是正确答案”是什么年代的技巧了？GRE 考逻辑：选项对错和像不像原文**没有必然关系**——干扰项常常长得像原文但埋了一两处改动。要看它重复在**哪个位置**、逻辑对不对。", "定位细节的方式：读文章时带着论点读细节，做题时**从大到小**（段落→句群→句）找到细节的位置。", "短文章里细节和宏观常常分不开——别花五分钟判断“这是不是微观题”，看懂问题直接做。张无忌学太极：忘掉形式，内功到了就行。"]}, {"type": "passage", "title": "实战一 · 女性选举权游行（一文两题）", "source": "课程实录 · 细节推断题", "text": "From 1910 to 1913, women suffragists in the United States organized annual parades — an activity traditionally conducted by men to proclaim solidarity in some cause. The parade was not only a public expression of their solidarity but also a conscious transgression of the rules of social order: women's very presence in the streets challenged traditional views of femininity and restrictions on women's conduct. Although scholars have recognized the parade's rhetorical force as a vehicle for social change, recently they have begun to analyze its drawbacks as a form of protest. L. argues that American suffrage parades were a double-edged sword: women's efforts to proclaim their solidarity exposed them publicly to patronizing commentary from press and public, and served to organize opposition from anti-suffragists."}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第1题 · 男人和女人的游行相似在哪", "source": "实战一", "pause": "男人在文中只被提到一处——共性只能出自那一处。", "stem": [{"t": "It can be inferred from the passage that men's and women's parades were similar in that both"}], "options": {"A": "were employed as rhetorical vehicles for social change", "B": "were regarded as violating contemporary standards of public behavior", "C": "made participants vulnerable to organized opposition", "D": "were ineffective as forms of protest", "E": "were intended by their participants as public declarations of solidarity"}, "answer": "E", "explain": {"思路": "男人在文中只有一句：游行传统上是男人搞的，用来 **proclaim solidarity（宣示团结）**。女人游行也是公开表达团结——共性就在这。E 正确。", "annot": "in that=因为。词汇：suffrage=选举权（别看成 suffer 受苦！),suffragist=选举权支持者；transgression=越界/触犯；vehicle 这里是修辞——把游行比喻成推动社会变革的“车”。", "辨析": "A“被用作社会变革的修辞载体”——这是**学者后来对女性游行的评价**，只跟女人有关。B“被视为违反当时行为规范”——只女性游行挑战了社会规则，男人的没有。C“使参与者遭到有组织的反对”——双刃剑那一半也只说女性。D“无效的抗议形式”——无。全是“只适用于女人”的信息，共性题直接排。", "点拨": "共性题（similar in that）的干扰项套路：**把只属于一方的特征写成共性**。回文核对“另一方也有吗”，一句话就能排。"}}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第2题 · 关于 social order 规则的支持者", "source": "实战一", "pause": "文中没有直接写“支持者”——支持者=认为这些规则对的人。", "stem": [{"t": "The passage suggests which of the following about proponents of the rules of social order?"}], "options": {"A": "They frowned upon public displays such as parades.", "B": "They had ulterior motives for opposing women's participation in suffrage parades.", "C": "They formed the core of the organized opposition to woman suffrage.", "D": "They believed that it was unfeminine for women to march in suffrage parades.", "E": "They supported women's right to vote."}, "answer": "D", "explain": {"思路": "规则的内容=“女人出现在大街上=挑战传统的女性观+对女性行为的限制”。支持者=认同这套规则的人→他们认为女人上街游行**不像女人该干的事（unfeminine）**。D 正确。", "annot": "frown upon=皱眉→反感；ulterior motives=不可告人的动机；unfeminine=un（不）+feminine（女性特征的）。", "辨析": "A“反感游行这种公开行为”——错在对象：规则限制的是**女人**上街，男人的游行传统上一直有，他们不反感游行本身。B“有不可告人的动机”——文章没提任何动机，属于加戏。C“构成有组织反对的核心”——organized opposition 是游行**激起的**结果，跟规则支持者是不是核心无涉。E 方向整个反了。", "点拨": "B 是典型“做题做快了会漏”的干扰——大信息像，小信息（ulterior motives）无中生有。选 D 之前把 B 的每个名词短语回文核对，它自己就露馅了。"}}, {"type": "passage", "title": "实战二 · 19 世纪主动单身的女性（一文两题）", "source": "课程实录 · 细节题 · 视角区分", "text": "Women scholars have tended to regard women in the nineteenth-century United States who elected to remain single as champions of women's autonomy and as critics of marriage as an oppressive institution. Indeed, many nineteenth-century American women who participated in reform movements or who became authors or professionals were single. But this view tends to distort the meaning of their choices. The nineteenth century witnessed the elevation of marriage for love as a spiritual ideal; it thus became socially acceptable for a woman not to marry if such an ideal was not realized with an available suitor. Thus, many women's choice to remain single reflected not a negative attitude toward marriage but a highly idealized one."}, {"type": "q", "tag": "真题 · 细节推断题", "title": "第3题 · 作者暗示：这些女性保持单身是因为", "source": "实战二", "pause": "问的是**作者**的视角——学者的看法全是干扰项。", "stem": [{"t": "The author of the passage suggests that many nineteenth-century American women chose to remain single because they"}], "options": {"A": "believed that marriage would require them to give up their autonomy", "B": "had attitudes toward marriage that were reflected in the reform movements of the time", "C": "wanted to take advantage of opportunities to establish themselves as professionals", "D": "doubted that their own marriages would live up to their notion of what marriage ought to be", "E": "had a negative view of marriage as an institution"}, "answer": "D", "explain": {"思路": "作者的看法：19 世纪“为爱结婚”被抬升为精神理想→没找到合适的人（真爱）就不结婚，社会也接受→所以单身不是对婚姻的负面态度，而是**高度理想化**的态度。D=怀疑自己的婚姻达不到“婚姻应该有的样子”——正是理想化的写照。D 正确。", "annot": "champion 在这里不是“冠军”——作名词=**支持者/捍卫者**（它本来就有动词“支持”的用法）。distort=扭曲；suitor=追求者；elevation=抬升。", "辨析": "A“认为婚姻要她们放弃自主权”——这是**学者**的解读。B“对婚姻的态度反映在改革运动中”——学者部分的信息。C“想抓住机会成为专业人士”——还是学者那半篇的内容。E“对婚姻制度持负面看法”——作者明确说 **not a negative attitude**，方向相反。", "点拨": "通篇两大块：学者观点+作者观点。题目问作者，干扰项就全是学者——**先判视角，再看内容**。"}}, {"type": "q", "tag": "真题 · 细节题", "title": "第4题 · 作者暗示学者们“扭曲意义”的方式是", "source": "实战二", "pause": "注意 a particular attitude 这种概括手段。", "stem": [{"t": "The author suggests that the women scholars mentioned in the first sentence distorted the meaning of certain nineteenth-century American women's choices by"}], "options": {"A": "ascribing those choices to a particular attitude toward marriage", "B": "ignoring evidence about single women's motives for becoming writers or professionals", "C": "overestimating the number of nineteenth-century women who chose to remain single"}, "answer": "A", "explain": {"思路": "学者做了什么？把“保持单身”这个选择**归因于**一种特定态度（支持女性自主、反对婚姻制度）——ascribe A to B=把 A 归因于 B。作者认为归错了因。A 正确。", "annot": "a particular attitude=对“支持自主+反对婚姻制度”这一长串内容的**概括**。⚠️ 别因此总结出“见到 a particular 就选”——它只是一种概括手段，不是万能钥匙。", "辨析": "B“忽视了单身女性成为作家/专业人士的动机证据”——学者明明**谈到了**这些信息（Indeed 那句就是他们的事实基础），没忽视。C“高估了单身女性的数量”——全文没谈数量。", "点拨": "事实层一致≠解读层一致：学者用的**事实**作者不否认（确实很多单身女性搞改革），作者否的是他们对事实的**归因**。"}}, {"type": "passage", "title": "实战三 · 《玛丽·巴顿》里的 Job Legh", "source": "课程实录 · 类比题（analogous to）", "text": "（四题长文节选）The chapter brilliantly dramatizes the situation of that early generation of workers brought from the villages and the countryside to the urban industrial centers. The account of Job Legh, the weaver and naturalist who is devoted to the study of biology, vividly embodies one kind of response to an urban industrial environment: an affinity for living things that hardens, by its very contrast with its environment, into a kind of crankiness. The early chapters capture further instances of this characteristic response of a generation to the new and crushing experience of industrialism."}, {"type": "q", "tag": "真题 · 类比题", "title": "第5题 · 谁和 Job Legh 最相似", "source": "实战三", "pause": "先在文中提取 Job Legh 的特征清单，再拿选项逐条对。", "stem": [{"t": "Which of the following is most analogous to Job Legh, as he is presented in the passage?"}], "options": {"A": "an entomologist who collected butterflies as a child", "B": "a small-town lawyer whose hobby is nature photography", "C": "a young man who leaves his family's farm to start his own business", "D": "a city dweller who raises exotic plants on the roof of his apartment building", "E": "a union organizer who works in a textile mill under dangerous conditions"}, "answer": "D", "explain": {"思路": "Job Legh 特征清单：①从乡村被带到城市工业中心；②身份反差：纺织工+博物学家（weaver and naturalist)；③对活物的热爱与环境格格不入——hardens into crankiness（这份亲近在环境的反差下变成怪癖）。D：住在城市里、在公寓楼顶养外来植物——“活物与环境有反差”+“城市居住者”，特征全对上。", "annot": "analogous to≈similar to（名词 analogy=类比）。正确答案很可能**不在文章中出现**——文章信息决定的是答案的“性质”，不是答案的字面。affinity=亲近/爱好；harden into=硬化成/变成；crankiness 不熟没关系，顺着“和环境有反差”推它=与环境别扭的怪脾气。", "辨析": "A 诱饵在 entomologist（昆虫学家）——文中确有 biology、insects，但 **as a child**（从小干这事）是文章没有的成长经历信息，错。B“小镇律师爱好自然摄影”——没有“从乡村到城市”的迁移。C“离开家农场创业”——创什么业、去哪都没说，对不上城市+活物反差。E“在危险环境的纺织厂工作的工会组织者”——工作环境是否危险文章没强调。", "点拨": "类比题=特征匹配：把文中对象拆成 2-3 个**可迁移的特征**，哪个选项全中就是谁。干扰项个个都沾一点（昆虫、小镇、农场、纺织厂），但都缺一两条。"}}, {"type": "passage", "title": "实战四 · 格陵兰冰芯：两英里深的气候档案", "source": "课程实录 · 类比题", "text": "（四题长文节选）Researchers on two teams — GRIP (Greenland Ice-core Project) and GISP2 (Greenland Ice Sheet Project 2) — analyzed two ice cores, each about two miles in depth. Such ice traps gases, bits of dust, and other chemicals that were present in the snow that fell on Greenland over thousands of years and became compressed into ice. By studying these components, scientists have obtained a detailed record of many aspects of climate, including air temperatures and the concentrations of greenhouse gases in the atmosphere."}, {"type": "q", "tag": "真题 · 类比题", "title": "第6题 · 哪个研究和 GRIP 的“测试”最相似", "source": "实战四", "pause": "问自己：GRIP 研究方式的“性质”是什么？", "stem": [{"t": "Which of the following describes research most similar to the testing done by scientists on the GRIP team?"}], "options": {"A": "Scientists studying the formation of the Sahara desert measure the rate of topsoil erosion in the region.", "B": "Scientists seeking to determine the age of a fossil measure the rate of decay of carbon atoms in it.", "C": "Scientists researching vision in fruit flies measure and compare the amounts of vitamin A in the retinas of several fruit fly species.", "D": "Scientists investigating the development of life on Earth measure oxygen levels in various organisms.", "E": "Scientists seeking to determine rainfall fluctuations in early rain forests measure gases trapped in tree rings."}, "answer": "E", "explain": {"思路": "GRIP 研究的性质=**间接性**：想研究几千年前的气候，但没法直接测当时的气温——于是测冰芯里困住的气体、尘埃、化学物质这些**间接参数**，反推出气候记录。E：想研究远古雨林的降雨波动，测不了当时的降雨——测**年轮里困住的气体**反推。间接性完全一致，连“困住的气体”都对仗。E 正确。", "annot": "题目说 testing，文章里没有 testing 这个词——科学手段的词可以互换：testing=study=analyzed。components（构成物）往前指代 gases/dust/chemicals。", "辨析": "A 研究撒哈拉形成，测的是撒哈拉本地表土侵蚀——**直接测对象本身**，缺间接性。B 测化石里的碳衰变来定化石年龄——测的就是研究对象自己。C 研究果蝇视力，测果蝇视网膜的维生素 A——还是自己测自己。D 研究地球生命发展，测生物体的氧——同理。", "点拨": "类比研究题的命门一句话：**研究对象能不能直接测到？**文中“时过境迁测不到→找间接线索”，选项里只有 E 是“测不到、绕道测”。"}}, {"type": "teach", "title": "④ 本讲收束", "ppt": ["细节题：看清问题角度（对象/行为/特征/因果），从大到小定位", "推断题：选与文章信息最直接关联的，加戏越多的越可疑", "共性题排“只属于一方”的特征；视角题先分清问谁", "类比题：提取可迁移特征，答案不必在文中出现", "微观宏观分不清就别分——看懂问题直接做"], "text": ["微观类的所有问法，最后都落到一件事上：**看懂问题问什么，对应上文章信息，做对**。", "分类是授课的脚手架，不是考场的拐杖。下一讲进入最后一大题型：逻辑推理（logical reasoning)。"]}], "transcript": "这里是GRE阅读理解的第17节课，在这节课当中呢，我们将会去讲解一种题型，叫做微观类的题型。我们前面曾经谈到过有宏观类的，有逻辑类的，那么接下来我们就进入到了这种微观类题型的讲解。微观类题型跟前面题型不一样的点在于它更多测试的是文章当中的细节，信息本身的意思。不像宏观的信息，更多问到的是文章的总体，或者是文章中的一些论点的部分。而微观的信息更多问到的都是其中的一些detail的部分。在这首先我们来看一下这种问题的特征是什么？首先呢，是问题的角度，如果是问到文档当中的细节的话。他可能会问到，比如说对象就是谁或什么。以及可能会问到这个对象做了什么，或者有的时候会把两者结合在一起，就是对象做了什么，这件事儿本身当做一个答案。或者有的时候也可以问到这个对象的feature特征。行为和特征往往可能不太一样，比如说如果用形容词或动词来表达的话，行为一般是用动词，而特征可以用比如形容词。除此之外的话呢，还可能会体现出一件事情的原因和结果，我们也可以把它放在微观类的题目里面，就把它当做是一个问题角度。问法形式呢，一般有这么几种情况，比如说可能会问到你下面哪个是对的，或者是文章谈到的。也可能会问你文章中你能够推出什么或文章暗示了什么，还有这两个词indicate跟suggest。这个词可以表示表明的意思，但是放在问题上，很多时候就表示一种暗示性，这个词也是，尤其是在前面，你可以听到我的课里面会经常碰到这个词。你会发现一般在问题上，我会把它翻译成暗示，如果在选项里，一般我会翻译成表明，或者是人认为什么，所以这也就是这个题目本身在问题和选项当中，它的词义会有一点不一样。在问题当中呢，suggest如果是文章suggest或作者suggest 1般都是暗示的意思，而这个would呢，代表的就是一种推断性。比如说文章没有直接这么说，但是题目上问到的是word。那就说明文章可能要推一下才能得出这个选项，同时呢，在题目上也可能会问到你否定的形式。这些问法的形式其实是可以结合的，比如说能够从文章中推出来，下面哪个是对的？或者说，文章暗示了下面所有的信息，除了哪一个，这都可以结合一下好，这就是可能问到的角度以及问法的形式有哪一些。涉及到了做细节题的时候呢，可能大家以前会有一种感觉，就是无关乎就是看懂文章的信息，对一下选项就可以了，其实是这样的。但是你也要稍微关注一下问法，比如说这种类型呢，表示推断类的题，相信以前你在做到推断这种词所问题形式的时候。可能你的想法就是我要自己在文章的信息读懂之后进行加工，来得出答案，但其实你会发现一个问题，就是你自己能推多深。或者是推到正确答案的准确性，你不好说，所以在这个情况下，我们做阅读理解的本质其实还要基于文章，而不是完全靠自己所谓的感悟和理解。从出题人的角度来讲的话，一个推断题，他能把答案推多深也不好说，在这我给你举一个这样的例子，比如说如果大家看过柯南的话，会发现这是一个侦探题材的作品。在其中呢，有两个经典的角色，柯南本尊和毛利小五郎叔叔。毛叔叔每次推断的时候都有一个特点，就是你会感觉他的推断怎么这么搞笑，甚 然后呢？通过测这些构成物构成物指的是啥？这些构成物指的就是这些东西。例子嘛，往前指，然后呢，获得的是关于当时的climate的数据。好获得的是当时climate的数据。为了测当时的气候，测的是冰柱当中的气呀，灰尘呐和chemicals，这就是它研究的特点。而选项里体现的其实也差不多，不过这道题最终的答案特点是什么？我先不给你分析，咱们先看答案，找到一些灵感。a选项科学家，什么科学家研究撒哈拉沙漠形成的科学家测的是速度，什么速度呢？顶层土壤腐蚀的速度在这个区域。在这个区域指的就是撒哈拉沙漠的区域好，这个选项特点是什么？它要测量的东西，或者叫它要研究的对象是撒哈拉沙漠的形成，为了去研究这个对象，它测的是撒哈拉沙漠顶层土壤的腐蚀速度。这里有什么呢？这个选项的信息其实跟文章当中最后一句话的逻辑还是挺像的，你通过研究这个东西。你为了研究到的对象是气候，你是通过研究components。最终研究出当时的气候是什么样子的。这是你的研究的方式或对象，以及你想研究到的结果或目标。所以如果看一下a的话，你用的方式是什么？测的是撒哈拉沙漠顶层土壤的腐蚀速度，目的是为了测量或者是研究撒哈拉沙漠的形成。这里面有什么关系呢？你其实可以通过撒哈拉沙漠本身去研究它，但是文章中如果你看到这个研究特点，就是你想研究当时的气候。但是你能测到当时的气候吗？没办法，因为已经时过境迁了，怎么办？测一些间接的证据，因为当时的气体尘埃，或者是其他的化学物质。可以给你提供一些间接的参数，所以这是这个研究背后的特点，它有一种间接性。没有办法直接测量一个对象，通过一些其他的线索来得出结论，所以a选项其实到此是错的，因为他想研究的对象是撒哈拉沙漠，他测的也是本身。抓住了这个原理之后，再来看其他的选项b，科学家想要研究的是什么呢？化石的年纪，化石的时间长短测的是。它的碳原子衰变的速度。一样的测的是自己，研究的是自己c选项，科学家研究的是果蝇的势力。它测和比较的是维生素A。在视网膜当中。几个果蝇的物种。研究果蝇的视力，测的是它的这个。想要研究的是他的视力，测的是他的视网膜。当中的这些维生素A的数量也是通过自己研究，自己再来看一下d选项。科学家investigating地球上生命的发展，他测的是什么呢氧？不同的生物体还是生物体本身好，接下来看一下e选项科学家。就是。想要去测的东西是降雨量的变化和波动，在早期的雨林当中，他测的是什么呢？他测的是气体。困在树的年轮当中的tree rings注意一下这个选项的特点是，最终要研究的是降雨量的波动，测的不是降雨量测的是什么呢？树当中的气体，年轮的气体。这个就很间接了，因为你没法测到当时的降雨量怎么办呢？测一些跟降雨量有关系的其他参数吧，所以这道题答案选e和文章当中这个研究的性质保持一致。这道题目呢，稍微有点复杂，就在于这个分析测量的性质是什么？题目呢，问到的仍然还是一种相似性，所以你可以看到e选项在文章里是没有的，但是它的信息性质跟题目问到这个对象的信息性质是一样的。所以可以选择它。好到此呢，这就是关于微观类的题目，给大家举了几个例子。但是由于在GRE考试当中，其实有的时候微观和宏观的题你也不太好进行区分，所以说。分题型不是目的，分题型是手段，如果你能看懂问题，并直接把题写出来，那就直接做题就可以了。而分类这种东西，更多是我们课程呈现的一种逻辑。但是真正做题，我们并不是靠它，所以说简单了解一下，有微观类题目的特点就可以了。"}, {"id": 19, "title": "第19讲 · 题型7：逻辑推理类1", "intro": "逻辑推理类（Logical Reasoning）是 GRE 的“复古题型”，源自 2002 年前老机考的 Analytical Reasoning，2011 年 8 月新 GRE 把它塞回阅读里。本讲是第一节：①题型的来历与四种问法形式（黑体字作用/归纳/演绎/补全文章）及背后原理——前提推结论，构建（constructing）与评价（evaluating);②黑体字作用题四道实战（药品广告、海平面、名画归属、石棉禁令）;③由信息推合理结论两道实战（基因分类学、美苏粮食亩产），附 bear out 与 fallow 两个词汇彩蛋。", "cards": [{"type": "teach", "title": "① 什么是逻辑推理类：一个复古题型", "ppt": ["2002 年前的老 GRE 机考考三项：Verbal / Quantitative / Analytical Reasoning（分析推理）", "Analytical Reasoning 里有一种题叫 Logical Reasoning——名字就从这来", "2002–2011 年消失；2011 年 8 月新 GRE 回归，不再单独成 section，而是作为阅读中的一道题", "GRE 很看重这种能力，但量不大——所以是“复古题型”", "和前面讲的“逻辑类”题不同：逻辑类靠文章的逻辑关系解题，逻辑推理考“推理”这种能力本身"], "text": ["这门课把它命名为逻辑推理（Logical Reasoning)，是因为它直接继承自 2002 年之前老 GRE 机考的分析推理（Analytical Reasoning）单项。2002 到 2011 年间这种题消失了，2011 年 8 月改版后的新 GRE General 又把它请了回来——不再作为完整 section，而是嵌在阅读理解里考一道。", "注意区分：之前讲的逻辑类题型，是“通过文章的逻辑信息或逻辑关系来解题”；而逻辑推理类考的是推理这种**能力本身**怎么应用在题目里。", "原理托底：任何 argument（论断）的基本要素就是**前提（premise）和结论（conclusion)**，由前提推出结论就是推理。考查能力分两块：**构建（constructing an argument)**——看清每条信息在结构里的地位和关系；**评价（evaluating an argument)**——逻辑定型之后对它分析、批判（批判不是骂，是分析的状态）。"]}, {"type": "teach", "title": "② 四种问法形式与三个考查角度", "ppt": ["形式1 黑体字作用：文章有两处 boldface/highlighted，问它们起什么作用", "形式2 归纳：文章信息正确，能推出下面哪个结论", "形式3 演绎：选项如果正确，对原文有什么作用（加强/削弱）——归纳的反向操作", "形式4 补全文章：文章结尾留空（空前必有逻辑词），问哪个选项能 logically 完成论断", "三个考查角度：推理逻辑的结构特征 / 由信息推合理结论 / 深度分析推理逻辑链（本讲讲前两个）"], "text": ["形式只有四种，但背后的原理不按形式分，按“构建与评价”分。黑体字作用题考构建——信息在结构里的地位；归纳题也是先看清构建再推结论；演绎题（由选项反作用于原文，比如加强或削弱推理）考评价；补全文章则两者兼有。", "黑体字作用题的解题钥匙：问某个信息的 role（作用），“作用”本身代表两个方面——**它在文章里是干嘛的**（结构身份：结论/前提/证据/观察/假设），以及**它和其他信息是同向还是反向**（支持还是反对）。", "这类题的选项有个统一长相：用分号连接两段，前半描述第一个黑体信息，后半描述第二个。任何一段错，整个选项就错；前半段判不准时，先看后半段的对错，也能锁定答案。"]}, {"type": "passage", "title": "实战一 · 专栏作家批药品广告（黑体字作用题）", "source": "课程实录 · 根据课堂中文转述重建，**为黑体字部分", "text": "Columnist: Until very recently, P and V, two drugs used to block stomach acid, were both available only with a prescription written by a doctor. In an advertisement for P, its manufacturer argued that **P is superior to V**, on the grounds that far more prescriptions were written for P than for V. It can be argued, however, that the number of prescriptions written is never a worthwhile criterion for comparing the merits of drugs, and that **the advertisement's claim is absurd** — a fact quite adequately revealed by the observation that both drugs were available only by prescription."}, {"type": "q", "tag": "真题 · 黑体字作用题", "title": "第1题 · 两个黑体信息各起什么作用", "source": "实战一", "pause": "先给两个黑体信息定“身份”，再定方向：谁支持谁、谁反对谁。", "stem": [{"t": "In the columnist's argument, the two portions in boldface play which of the following roles?"}], "options": {"A": "The first is a claim that the columnist's argument seeks to clarify; the second states a conclusion drawn about one possible interpretation of that claim.", "B": "The first identifies the conclusion of an argument that the columnist's argument is directly against; the second states the main conclusion of the columnist's argument.", "C": "The first is the main conclusion of the columnist's argument; the second provides an observation that supports that conclusion.", "D": "The first identifies an assumption made in the argument that the columnist's argument is directed against; the second states the main conclusion of the columnist's argument.", "E": "The first is a claim offered as evidence in support of a position that the columnist's argument opposes; the second states the main conclusion of the columnist's argument."}, "answer": "B", "explain": {"思路": "BF1=“P 优于 V”：制造商 argue（认为）出来的，是观点，后面有 grounds（理由）做论据，所以它是**制造商论证的结论**。BF2=“广告的说法是荒谬的”：这是专栏作家自己的观点，后面“两种药都凭处方销售”的观察是它的论据，所以它是**专栏作家论证的总论点**。方向：专栏作家反对广告商，两者相反。逐一对号：只有 B 的前半（被专栏作家反对的那个论证的结论）和后半（专栏作家的总论点）全对。答案 B。", "annot": "on the grounds that=基于……的理由，grounds 此处作“论据”讲；prescription=处方；superior to=优于；absurd=荒谬的。语法点：It can be argued that A and/but that B——两个 that 从句并列，B 也是“可以认为”的内容，仍是观点。词汇地图：claim/position/conclusion/judgment 表观点；assumption 表前提假设；evidence/observation/grounds 表论据。", "辨析": "A 前半 clarify（澄清/解释）方向错——专栏作家是反对不是解释；后半“对 claim 的一种解释得出结论”同样跑偏。C 前半 the main conclusion 错——BF1 是广告商的结论，不是文章（专栏作家）的总论点。D 前半 assumption（前提假设）错——BF1 是被 grounds 支持的结论，本身不是假设；后半与 B 相同也救不回来。E 前半把 BF1 说成“被当作证据（evidence）提供的 claim”——错，它是被支持的立场，不是支持别人的证据；后半与 B 相同。", "点拨": "黑体字题=给信息**定身份+定方向**：身份（结论/前提/证据/观察/假设）看它与别人谁支持谁；方向看作者立场。选项分号两段，一段错全错——判得快时，前半段错可以直接划掉整个选项。"}}, {"type": "passage", "title": "实战二 · 海平面与上升的陆地（黑体字作用题）", "source": "课程实录 · 根据课堂中文转述重建，**为黑体字部分", "text": "In most coastal regions, the level of the sea is rising relative to the land by one to two millimeters a year, and this trend would be explained by the hypothesis that at the North and South poles the amount of ice that melts during the summer now exceeds the amount that forms during the winter. The hypothesis is not undermined by observations that **sea levels are falling relative to the Scandinavian coast by four millimeters a year**. Much land in northern latitudes, including Scandinavia, is still rising in response to being freed of the enormous weight of the ice that used to cover it during the last ice age, and **in Scandinavia the land is now rising faster than the sea**."}, {"type": "q", "tag": "真题 · 黑体字作用题", "title": "第2题 · 矛盾的观察为什么没反驳假说", "source": "实战二", "pause": "is not undermined=没被反驳——“看着矛盾，其实能调和”，先抓住这句话。", "stem": [{"t": "In the argument above, the two portions in boldface play which of the following roles?"}], "options": {"A": "The first is an observation whose accuracy is challenged in the argument; the second provides grounds for that challenge.", "B": "The first states observations that, according to the argument, are incompatible with a certain hypothesis; the second describes a phenomenon that forms the factual basis of that hypothesis.", "C": "The first is an observation that, according to the argument, can be reconciled with a certain hypothesis; the second describes a phenomenon that is the factual basis of that reconciliation.", "D": "The first presents a phenomenon, two competing explanations of which are considered in the argument; the second is a fact that supports one of those explanations.", "E": "The first provides evidence against a position; the second is that position."}, "answer": "C", "explain": {"思路": "BF1=斯堪的纳维亚沿岸海平面每年相对下降 4 毫米——文章明说 observations，是事实。它表面上和“极地夏融量超过冬冻量→海平面上升”的假说矛盾，但文章用 is not undermined 告诉你：这个观察**并没有反驳假说**，两者可以调和。BF2=斯堪的纳维亚的陆地现在比海涨得更快——也是事实，而且正是“调和”的事实基础：海在涨，陆地因甩掉末次冰期冰盖的巨重也在反弹上涨，陆地涨得更快，所以海平面相对陆地反而下降。C 的前半（可与某假说调和）与后半（该调和的事实基础）全对。答案 C。", "annot": "hypothesis=假说；undermine=暗中破坏→削弱、反驳；reconcile=调和；observation=观察（事实，不是观点）；in response to=作为对……的回应。语法：the amount of ice that melts during the summer now exceeds the amount that forms during the winter——两个 that 定语从句对比“夏融量”与“冬冻量”。", "辨析": "A 前半“观察的准确性被挑战”错——文章从不怀疑这个观察，它是事实。B 前半 incompatible（不能调和）方向反了——not undermined 就是“能调和”的意思。D 前半“关于这一现象有两个相争的解释被考虑”错——文章给的是两个现象（海涨+陆涨），不是对同一现象的两个对立解释。E 把两句说成“证据 vs 立场”的反对关系——BF2 根本不是 position（立场），是事实，方向也不对。", "点拨": "看见 not undermined / can be reconciled 这类词，立刻翻译成大白话：“看着矛盾，其实不矛盾”。黑体字题里“事实/观察”永远是对的，凡说“准确性被质疑”的选项直接排。"}}, {"type": "passage", "title": "实战三 · 名画归属：动物露出马脚（黑体字作用题）", "source": "课程实录 · 根据课堂中文转述重建，**为黑体字部分", "text": "The stylistic evidence and the laboratory evidence strongly support the view that this magnificent painting is a work of the Flemish master. Nevertheless, **the painting must have been the work of someone else**, as anyone with a little historical and zoological knowledge can tell merely by looking at the painting. **The animals in the painting are all vivid representations of actual animals**, including one animal that is native only to the Americas — and the master died decades before Europeans reached the Americas."}, {"type": "q", "tag": "真题 · 黑体字作用题", "title": "第3题 · must 出来的是论点还是论据", "source": "实战三", "pause": "Nevertheless 一转弯，作者真正要说的话才登场。", "stem": [{"t": "In the argument given, the two boldfaced portions play which of the following roles?"}], "options": {"A": "The first is a position that the argument seeks to reject; the second is evidence for that position.", "B": "The first and the second are each pieces of evidence offered in support of the argument's main conclusion.", "C": "The first presents the argument's main conclusion; the second provides evidence in support of that conclusion.", "D": "The first is a judgment that serves as the basis for the argument's main conclusion; the second states that main conclusion.", "E": "The first is an intermediate conclusion drawn in the argument; the second provides evidence for the main conclusion."}, "answer": "C", "explain": {"思路": "BF1=“这幅画一定是别人的作品”：must 表主观推断，这是作者在 Nevertheless 转折之后摆出的**总论点**（前面“风格和实验室证据支持是大师真迹”是被转折掉的对立观点）。BF2=“画中动物全是真实动物的生动写照”：事实/证据，配合后半句“该动物只产自美洲，而大师在欧洲人到达美洲前几十年就死了”，共同支撑 BF1。所以 BF1=总论点，BF2=支持它的证据，方向为支持。C 全对。答案 C。", "annot": "nevertheless=然而（让步转折：先承认“证据支持是大师作品”，后面才是作者立场）；must 这里不表“必须”，表主观推断“一定”；as anyone...can tell=任何有点历史和动物学知识的人一看便知（as 引导原因）；native to=原产于；vivid representations=生动的描绘。判断词地图：judgment/conclusion/position 都表主观判断——must 说得再确定，也还是主观评判。", "辨析": "A 前半“文章要反驳的立场”方向反——它是文章要建立的立场。B 说两句都是证据——BF1 是论点不是证据。D 前半 judgment 说得通（must 即主观判断），但后半“是总论点的基础（basis）”错——它自己就是总论点，不是总论点的论据。E 前半 intermediate conclusion（分论点/中间结论）错——全文没有更大的结论供它服务，它就是主结论。", "点拨": "转折词后必为作者立场：stylistic/lab evidence 支持“是大师真迹”，被 Nevertheless 一转，作者真正要说的是“必为他人所作”。做黑体字题先找转折，转折后那句十有八九是主结论。"}}, {"type": "passage", "title": "实战四 · 石棉禁令与死亡证明（黑体字作用题）", "source": "课程实录 · 根据课堂中文转述重建，**为黑体字部分", "text": "In Seligia, a country where asbestos is used extensively in construction, that use is about to be banned, because exposure of construction workers to asbestos can cause a certain cancer. We can predict that **the ban will cut the incidence of that cancer by as much as 50 percent**. It is true that **fewer than 30 percent of the death certificates of Seligia's citizens who died of that cancer listed “construction” as the deceased's occupation**. The cancer takes about twenty years after exposure to develop, however, and Seligians in the construction industry generally turn to less strenuous occupations as they age. Death certificates indicate only the deceased's last occupation."}, {"type": "q", "tag": "真题 · 黑体字作用题", "title": "第4题 · 让步段的证据是敌是友", "source": "实战四", "pause": "It is true that... 后面必有 however——让步内容不是作者立场。", "stem": [{"t": "In the argument above, the two boldfaced portions play which of the following roles?"}], "options": {"A": "The first is a prediction that the argument seeks to defend; the second presents evidence that, if not supplemented, would cast doubt on that judgment.", "B": "The first is a prediction that the argument seeks to defend; the second is a finding the accuracy of which is disputed by the argument as a whole.", "C": "The first is evidence offered in support of a prediction; the second is a finding that the argument as a whole seeks to undermine.", "D": "The first is a prediction that the argument seeks to defend; the second is evidence offered in the argument such that the defense can be at best partly successful.", "E": "The first is a prediction used to justify a stated conclusion; the second presents evidence that undermines that conclusion."}, "answer": "A", "explain": {"思路": "BF1=禁令将使该癌症发病率下降多达 50%——由禁令推出的**预测（prediction)**，正是文章要维护的判断。第二段 It is true that... 是典型让步：承认“死于该癌症的人中不到 30% 的死亡证明写着建筑行业”（BF2）这个事实，接着 however 解释——癌症潜伏期约 20 年，建筑工人年纪大了转行，死亡证明只写最后职业。所以 BF2 看似打脸预测，其实被补充解释后与预测相容：它是“**如果不加以补充说明，就会让人怀疑预测**”的证据。A 的前半（prediction+文章维护它）与后半（evidence that, if not supplemented, would cast doubt on that judgment）全对。答案 A。", "annot": "asbestos=石棉；incidence=发病率；death certificate=死亡证明；occupation=职业；deceased=死者；strenuous=费体力的。句型 It is true that... however...=让步转折标配：“……确实没错，但是……”。cast doubt on=对……提出质疑；supplement=补充。", "辨析": "B 前半与 A 一样对，但后半“这一发现的准确性被全文质疑（disputed）”错——文章承认它是事实，只是解释它为什么不矛盾。C 前半就错：BF1 不是 evidence，它是被论证支持的预测本身。D 后半“这个辩护充其量只能部分成功（at best partly successful）”——等于说 BF2 在削弱预测，方向反了：解释完之后预测依然成立。E 前半“用来证明（justify）某个已给结论的预测”错——预测本身就是文章的结论，不存在它去支持的更高结论。", "点拨": "考场实战：A 后半读着别扭没关系——黑体字题用排除法，把“身份错/方向错”的选项逐个划掉，剩下那个哪怕表述拗口也是答案。另外见到 It is true that 要立刻预判 however，让步内容永远不是作者立场。"}}, {"type": "teach", "title": "③ 第二种问法：由信息推理合理结论", "ppt": ["文章有时只有信息、没有结论；有时给出完整推理（含结论）", "问法：哪个选项被文章信息支持/能由文章可靠推出", "做起来像常规阅读推断：读懂文章信息，判断哪个选项能由它得出", "正确答案未必“完美”，但必须是五个里最能被文章支撑的"], "text": ["归纳型问题：文章信息正确，推出下面哪个结论。这种形式跟传统阅读理解的推断题非常像——在文章信息的基础上探出选项谁对谁错。", "但要有心理准备：有时正确答案并不完美，只是五个选项里唯一还算能由文章推出来的那个。“不完美但唯一合适”本身就是一种答案标准，是你必须面对的现象——别因为答案不够漂亮，就转身去选加戏的选项。"]}, {"type": "passage", "title": "实战五 · 基因研究改写分类学（归纳题）", "source": "课程实录 · 根据课堂中文转述重建", "text": "New methods developed in genetic research have led taxonomists to revise their views on the evolutionary relationships between many species. Traditionally, relatedness between species was determined by comparing their anatomy. The new methods infer species relatedness instead from the similarity of their genetic codes."}, {"type": "q", "tag": "真题 · 归纳推断题", "title": "第5题 · 哪个结论被文章信息支持", "source": "实战五", "pause": "文章只给信息没给结论——答案只要“五个里最能被推出来”，不必完美。", "stem": [{"t": "Which of the following conclusions is best supported by the information above?"}], "options": {"A": "The apparent degree of relatedness of some species, as determined by anatomical criteria, is not borne out by their degree of genetic similarity.", "B": "When they know the differences between the genetic codes of two species, taxonomists can infer what the anatomical differences between them are.", "C": "The degree of anatomical similarity between individual members of the same species is determined more by their genetic codes than by any other factor.", "D": "The traditional anatomical methods by which taxonomists analyzed relatedness are not capable of further improvement.", "E": "Without using genetic methods, taxonomists cannot obtain accurate data about species relatedness."}, "answer": "A", "explain": {"思路": "文章信息：新方法（靠基因编码的相似性）让分类学家**修改**了关于物种进化关系的看法；传统方法靠比较解剖结构。“修改观点”=新旧两种方法不一样、结果对不上，这是文章唯一能站住的推断。A：某些物种由解剖学标准确定的表面亲缘程度，不被其基因相似程度所证实（not borne out）——正是“两法不一”的体现，保留。五个选项里只有 A 能由文章支撑。答案 A。", "annot": "taxonomist=分类学家；revise=修改；evolutionary relationships=进化上的亲缘关系；anatomy=解剖结构；genetic code=基因编码。重点词组 **bear out=证实、支持**:bear 作动词是“生、产生”，常见的是过去分词 borne（“出生”的 born 是它的亲戚）,bear out≈“生出证据来”→证实；not borne out by=不被……证实。老师段子：bear 不是熊，bear out 更不是“熊出没”。", "辨析": "B 说知道基因差异就能推出解剖差异——两法若能互通，就不必“修改观点”了，方向矛盾。C“解剖相似性更多由基因编码决定”——文章比较的是确定亲缘关系的**方法**，没说基因决定解剖，无中生有。D“传统解剖方法无法再提升”——文章没评价方法的天花板。E“不用基因方法就得不到精确数据”——精确性话题文章没碰，与 D 同病。", "点拨": "归纳题的正确答案可以“不完美”，只要它是五个里唯一能由文章推出的。比较谁的推断更**小**、更贴原文：推得远、加戏多的先排除。"}}, {"type": "passage", "title": "实战六 · 美苏粮食亩产之谜（归纳题）", "source": "课程实录 · 根据课堂中文转述重建", "text": "A ten-year comparison between the United States and the Soviet Union in terms of crop yields per acre revealed that when only planted acreage is compared, Soviet yields were equal to 68 percent of United States yields. When total agricultural acreage — planted acreage plus fallow acreage — is compared, however, Soviet yields were 114 percent of United States yields."}, {"type": "q", "tag": "真题 · 归纳推断题", "title": "第6题 · 关于美苏农业能可靠推出什么", "source": "实战六", "pause": "比的是一个分数：分子是粮食总产量，分母是面积。别当数学题做，当逻辑题做。", "stem": [{"t": "From the information above, which of the following can be most reliably inferred about United States and Soviet agriculture during the ten-year period?"}], "options": {"A": "A higher percentage of total agricultural acreage was fallow in the United States than in the Soviet Union.", "B": "The United States had more fallow acreage than planted acreage.", "C": "The Soviet Union had more total agricultural acreage than the United States.", "D": "The Soviet Union had more planted acreage than fallow acreage.", "E": "The Soviet Union produced a greater volume of crops than the United States."}, "answer": "A", "explain": {"思路": "文章比的是一个分数：粮食总产量÷面积，比了美国和苏联十年。条件一（分母=种植面积）：苏联=美国的 68%；条件二（分母=种植+休耕）：苏联=美国的 114%。分子没变，只往分母里加了休耕地，大小关系就反转——说明加上休耕后**美国的分母膨胀得更多**，即美国总农地中休耕地占比更高。A 说的正是这个：美国休耕地占总农业用地的比例高于苏联。其余选项全犯同一个错：文章比的是“美苏之间的分数值”,B、D 是各自跟自己比（美国休耕 vs 种植、苏联种植 vs 休耕）,C 比分母绝对值（总农地谁多）,E 比分子（粮食总产量谁多）——单比分母或分子，都推不出分数的大小。答案 A。", "annot": "crop yield per acre=亩产（每亩产量）;planted acreage=种植面积；**fallow=休耕的**（转写里写成 fellow，实为 fallow)——注意不是“荒地”：休耕地是能种但暂时让地休息的地，所以它仍算农业用地，这正是本题的题眼。reveal=揭示；in terms of=就……而言。", "辨析": "B“美国休耕地比种植面积多”——美国自己内部比，文章只给美苏对比，推不出。C“苏联总农地比美国多”——比分母的绝对值，分数比大小不允许这么比。D“苏联种植面积比休耕地多”——还是自我比较，与 B 同病。E“苏联粮食总产量高于美国”——比分子，同样不行。", "点拨": "先锁定两件事：**比的双方是谁、比的对象是什么**。凡是偷换比较对象（分数→分子/分母、双方互比→自我比较）的选项，直接排除。"}}, {"type": "teach", "title": "④ 本讲收束", "ppt": ["逻辑推理四种形式：黑体字作用 / 归纳 / 演绎 / 补全文章，本讲讲完前两种", "黑体字题=定身份（结论/前提/证据/观察/假设）+定方向（支持/反对）", "黑体字题最少问一个、最多问两个黑体信息，不会问三个", "选项分号 结论等好，这是这两种小的类型，它的特点。"}, {"id": 20, "title": "第20讲 · 题型8：逻辑推理类2", "intro": "上一讲讲了逻辑推理的结构特征与推结论，本讲专攻第三种能力：**评价文章的推理逻辑链**。五种问法——加强（strengthen）、削弱（weaken）、假设（assumption）、解释（explain）、评价（evaluate），本质是同一件事：选项被假定为正确，看它使文章“由A推B”的链条更成立还是不成立。注意做题方向与普通阅读题相反：答案不必来自原文。全讲 13 道题：6 道逻辑单题范式、2 道结尾空格题、2 道藏在多题文章里的逻辑题，外带“排他因=加强”“解释≈削弱的镜像”“whether 一正一反”等可迁移手法。", "cards": [{"type": "teach", "title": "① 逻辑链与五种评价问法", "ppt": ["逻辑链=文中由一个信息推出另一个信息的过程（A→B）", "加强 strengthen：选项为真→推理更成立", "削弱 weaken：选项为真→推理成立的可能性下降", "假设 assumption：推理成立所依赖的前提", "解释 explain：文章出现貌似矛盾，欠你一个解释", "评价 evaluate：加强削弱皆可，选项常以 whether 开头"], "text": ["上一讲把逻辑推理分成分析结构特征、由文章推结论、分析推理逻辑链三种；本讲专攻第三种——对逻辑链做**评价**。文章里由一个信息推导出另一个信息，这个推导过程就是逻辑链；链一旦形成结构，对这个结构能做什么动作，就是考点。", "**加强**：文章有 A 推 B，选项一旦为真，使这个推理关系更成立。**削弱**是它的镜像：选项为真，使推理成立的可能性下降。两者方向相反，原理一样。**假设**：原文的推理过程要成立，必须基于这个选项作为前提。", "**解释**的文章有独特长相——往往差一个解释，出现一种看似矛盾的现象。比如“我吃了很多，应该长胖，但是我没胖”，到此你会觉得欠你一个 why。正确答案补上缺口：“我虽然吃得多，但我锻炼了”“我虽然吃得多，但吃的都是草，没什么热量”。", "**评价（evaluate）**可以看作前面问法的综合：选项常以 **whether**（是否）开头，同一个问题，回答“是”可以加强原文逻辑，回答“否”可以削弱——加强削弱均可以，都算评价。"]}, {"type": "teach", "title": "② 削弱与加强的手法库", "ppt": ["削弱三刀：削弱原因、削弱结果、削弱推理过程", "针对过程：给其他的原因（他因）、给其他的结果、因果倒置", "例：地面湿→推测下过雨；“洒水车刚经过”=他因削弱", "例：谷歌氛围好→所以赚钱；倒置：因为有钱才搞得起氛围", "加强=排他因：“考330不是命好”排除他因，努力更可信", "与作文 argument 同源；事实不能削，削的是推理关系"], "text": ["因果链 A→B 摆出来，想削弱它有三刀：削弱原因、削弱结果、削弱推理过程本身。最常用的是针对**过程**。", "手法一，**他因**：发现地面湿了→推测下过雨。你说“其实刚才有洒水车经过”——同一个结果有了别的原因，“下雨导致地湿”的可能性就降低了。手法二，**因果倒置**：谷歌氛围好（事实）、赚钱（事实），原推理是氛围好→效率高→赚钱；你说关系反了——因为有钱，才搞得起氛围。关系一倒置，原推理势必被削弱。", "加强就是削弱的镜像：**把其他原因排掉**。“我靠努力把 GRE 考到 330”——如果存在他因“命好”：肯定它（不是努力是命好），削弱努力；否定它（我不是命好才考到 330 的），就加强了努力的可能性。加强和削弱常常只差一个否定关系。", "这种能力和你写作文时的 argument 分析**同源**：argument 里也有个推理过程，你要么削弱它，要么补上别的因素让它更成立。最后记住：原因和结果都可以是事实，事实一般没法加强削弱（它摆在那里就是存在），刀口永远在**推理关系**上。"]}, {"type": "teach", "title": "③ 做题总方法：方向变了", "ppt": ["不是“文章对→推哪个选项对”，而是“假设选项对→哪个影响文章推理”", "正确答案不必来自原文（与普通阅读题最大的差别）", "建议先读问题：问法预设文章特征（让解释→必有貌似矛盾）", "GMAT 官方对同形式的题也建议先读问题", "读文章标出范围限定：时间、空间、逻辑范围（谁和谁比）", "不过度推断：只看选项表面与逻辑链的关系"], "text": ["这类题的做题方向和普通阅读题**相反**：普通阅读是证明文章信息为真、以它为基础推选项；逻辑评价题是**假定每个选项为真**，看哪个能使文章的推理更成立或不成立。正确答案不必来自原文——它可以有一万种写法，只要性质对。", "做题顺序：这类题推荐**先读问题**。问法和文章特征是匹配的——让你解释，文章就必然出现貌似矛盾。先看问题，读文章就有清晰的期待和方向。GMAT（商学入学考试）里有同形式的题，官方本身就建议先读问题。", "读文章时盯住逻辑链“谁推谁”，同时标出信息的**范围限定**：时间范围、空间范围、逻辑范围（谁和谁比就是一种逻辑范围）。选项一旦跑出这个范围——比如文章谈受压的老鼠、选项谈不受压的——对错就无从谈起。", "练法：把文章的逻辑链列出来，看问题要求的方向，再看正确答案如何在满足问题的情况下与逻辑链产生关系。不做过多推断，只看信息表面与逻辑链的关系，感觉就练出来了。这种题一个 section 出一道左右，初期觉得难可以先放，重点做其他阅读题，有一定练习量后再回来培养手感。"]}, {"type": "passage", "title": "实战一 · 帝王蝶与乳草（加强）", "source": "课程实录 · 加强题", "text": "Adult monarch butterflies travel long distances from their place of origin to lay their eggs on milkweed plants. The caterpillars that emerge feed on the milkweed and absorb the specific glycosides present in the milkweed sap. The specific glycosides in milkweed differ from region to region within the monarch butterfly's range. Since mature monarch butterflies retain the glycosides in their bodies, the glycosides found in an adult monarch can be used to determine its place of origin."}, {"type": "q", "tag": "真题 · 加强题", "title": "第1题 · 哪个选项最能加强上述论断", "source": "实战一", "pause": "方向变了：不是由文章推选项，而是假设选项正确、哪个让“测体内物质推出生地”更靠谱。", "stem": [{"t": "Which of the following, if true, most strengthens the argument?"}], "options": {"A": "Mature monarch butterflies do not feed on parts of milkweed that contain glycosides.", "B": "The glycosides in milkweed sap are toxic to most insects.", "C": "The vast majority of monarch butterflies that lay eggs in a given region will have traveled there from a single region.", "D": "There are substances other than glycosides in milkweed sap that accumulate in a monarch caterpillar and are retained in the body of the mature butterfly.", "E": "There are certain glycosides that are found in the sap of all milkweeds, no matter where they grow within the monarch butterfly's range."}, "answer": "A", "explain": {"思路": "先捋逻辑链：毛毛虫吃乳草、吸收糖苷（glycoside）→糖苷在帝王蝶分布范围内因地区而异，且成年后保留在体内→所以测成年蝴蝶体内的糖苷，就能判定它的出生地。加强=让“测体内糖苷推出生地”更靠谱。A：成年蝴蝶**不吃**含糖苷的乳草部分→体内的糖苷只剩小时候吃的那一份，排除了“成年后在别处新吃进糖苷”的干扰，测量更单纯，推理更成立。A 正确。", "annot": "monarch butterfly=帝王蝶；milkweed=乳草（马利筋）；caterpillar=毛毛虫（蝴蝶幼虫）；glycoside=糖苷（glyc-=糖，-ide=化合物后缀）；sap=汁液；differ from region to region=因地区而异；origin=出生地。", "辨析": "B“糖苷对多数昆虫有毒”——有没有毒和能不能用它判定出生地无关。C“在给定区域产卵的帝王蝶绝大多数来自同一个地方”——看着也相关，但它给了另一条判定 origin 的路（看产卵地就知道来处），用不着测体内糖苷了，反而是**削弱**。D“除糖苷外还有其他物质积累并保留在成年蝴蝶体内”——其他物质是否干扰未知，方向不明。E“某些糖苷在所有地区的乳草里都有”——文章靠的是糖苷**整体**因地区而异，个别糖苷到处都有对整体影响未知；部分对整体，不能加强。", "点拨": "加强题最常见的正解手法是**排他因/堵漏洞**：把可能干扰推理的其他因素排除掉，原推理自然更成立。反向检查：把 A 的 do not 改成 do，立刻变成削弱——加强和削弱常常只差一个否定。"}}, {"type": "passage", "title": "实战二 · 僧海豹之死：病毒还是细菌（加强）", "source": "课程实录 · 加强题（additional evidence）", "text": "An alarming number of Mediterranean monk seals, an endangered species, have recently died. Postmortem analysis showed the presence of an as yet unidentified virus, as well as evidence of a known bacterial toxin. Seawater samples from the area where the seals died did contain unusually high concentrations of the toxic bacterium. Therefore, although both viruses and bacterial toxins can kill seals, it is more likely that these recent deaths were the result of the bacterial toxin."}, {"type": "q", "tag": "真题 · 加强题", "title": "第2题 · 哪个选项提供额外证据支持结论", "source": "实战二", "pause": "结论是二选一（细菌而非病毒）——证明一个无辜=另一个有罪。", "stem": [{"t": "Which of the following, if true, provides additional evidence to support the conclusion above?"}], "options": {"A": "Viruses are much more difficult to identify in postmortem analysis than bacteria are.", "B": "Mediterranean monk seals are the only species of seal in the area where the bacterium was found.", "C": "The bacterium is almost always present in the seawater in at least small concentrations.", "D": "Nearly all of the recent deaths were among adult seals, but young seals are far more susceptible to viruses than are adult seals.", "E": "Several years ago, a large number of monk seals died in the same area as a result of exposure to the bacterium."}, "answer": "D", "explain": {"思路": "逻辑链：尸检发现不明病毒+已知细菌毒素，死海区海水细菌浓度异常高→结论：更可能是**细菌毒素**杀死了这批海豹。要额外支持“是细菌而非病毒”。D：最近死的几乎全是**成年**海豹，而小海豹比成年海豹更容易受**病毒**侵害→死的是成年海豹=病毒作案的可能性被压低→变相抬高细菌的可能性。这就是排他因式加强。D 正确。", "annot": "monk seal=僧海豹；endangered species=濒危物种；postmortem analysis=死后解剖分析；as yet unidentified=迄今未确认的；toxin=毒素；concentration=浓度；susceptible to=易受…侵害。注意“recent deaths”是时间范围限定。", "辨析": "A“病毒比细菌更难在尸检中被识别”——难识别≠没杀人，识别难度与谁是凶手无必然关系。B“僧海豹是发现细菌区域唯一的海豹物种”——only 背后藏着“僧海豹 vs 其他海豹”的比较，但文章比的是“病毒 vs 细菌”；住在这个区域不等于被细菌杀死，可以共存。C“细菌几乎总是以小浓度存在于海水中”——存在量的大小与是否致死无关，文章没谈量。E“几年前同区域大量海豹死于该细菌”——几年前≠这次，**时间范围**不同，多数情况下没有加强力。", "点拨": "二选一结论（病毒 or 细菌）的加强捷径：**证明另一个嫌疑犯无辜**。排除干扰时盯住比较对象——文章比 A 和 B，选项却在比 A 和 C，这个比较对原推理没用。"}}, {"type": "passage", "title": "实战三 · 落基山林木线（假设）", "source": "课程实录 · 假设题", "text": "In mountainous regions, the timberline is the highest altitude at which trees grow. In the Rocky Mountains, the current timberline is at the altitude above which growing season temperatures remain cooler than 10 degrees centigrade. Fossilized remains of trees that grew 10,000 years ago have been found 100 meters above the current timberline. Clearly, therefore, the climate of the Rocky Mountains is cooler now than it was 10,000 years ago."}, {"type": "q", "tag": "真题 · 假设题", "title": "第3题 · 论证依赖哪个假设", "source": "实战三", "pause": "先锁死比较双方：化石树（上方100米） vs 今天的树（林木线处）。", "stem": [{"t": "The argument above relies on which of the following assumptions?"}], "options": {"A": "In the past 10,000 years, the only trees to have grown above today's timberline are the trees whose fossilized remains have been found.", "B": "No trees grew 10,000 years ago at altitudes higher than the ones at which fossilized tree remains have been found.", "C": "The fossilized trees were not of a kind that was able to tolerate cooler weather than the trees growing at today's timberline.", "D": "The Rocky Mountains have not eroded significantly over the past 10,000 years.", "E": "The climate of the Rocky Mountains has never been warmer than it was 10,000 years ago."}, "answer": "C", "explain": {"思路": "逻辑链：一万年前的化石树长在今天林木线上方100米（当年树线更高）→结论：落基山现在比一万年前更冷。事件本身的因果顺序是：温度降→树死→树线降。假设=推理成立缺的那一环。C：化石树**不是**比今天林木线的树更耐寒的树种——堵住了“化石树特别耐寒、一万年前其实不暖也能长那么高”的漏洞。若化石树本来就耐寒，它们长得高不能说明当时更暖，推理就断了；C 否定这个可能，正是前提。C 正确。", "annot": "timberline=林木线（树能生长的最高海拔线）；altitude=海拔；fossilized remains=化石遗迹；tolerate=耐受。画图记忆：山上一条线 T，线上方100米有化石→以前树线更高→以前更暖。因果顺序别搞反：是温度先变凉，树线后降。", "辨析": "A“过去一万年唯一长在今天林木线上方的树就是发现化石的那些”——说的是化石与树长在哪儿的关系，没建立**温度与树线**的关系。B“一万年前没有树长在比化石发现处更高的地方”——**比较对象错位**：文章比的是“化石树 vs 今天的树”，B 比的是“化石树 vs 更高的树”；贝塔和伽马比，对阿尔法比贝塔没用。D“落基山这些年没有被严重侵蚀”——侵蚀理论上可与树线下降有关，但选项只给 erode，没直接连到温度，不如 C 直接。E“气候从未比一万年前更暖”——又在跟其他时期比，同 B 的毛病：文章只需要“现在 vs 一万年前”。", "点拨": "比较型文章的假设题，先锁死**比较双方**（谁和谁比）。选项一旦把其中一方换成第三方去比，直接排——A 比 B 高、B 比 C 高，推不出也支持不了 A 比 B。"}}, {"type": "passage", "title": "实战四 · 棉草与驯鹿（假设）", "source": "课程实录 · 假设题", "text": "Cotton grass, which grows only in arctic regions, has been the only summertime source of protein available to caribou. Caribou that do not get adequate amounts of protein in the summer are unable to reproduce the following year. Rising average temperatures in arctic regions, however, are causing cotton grass to disappear. Therefore, if the warming trend continues, caribou are likely to become extinct."}, {"type": "q", "tag": "真题 · 假设题", "title": "第4题 · 论证基于哪个假设", "source": "实战四", "pause": "链条缺一环：结论默认了“没有别的植物能补位”。", "stem": [{"t": "Which of the following is an assumption on which the argument depends?"}], "options": {"A": "Cotton grass is the only one of the caribou's food sources that has become scarce as temperatures have risen in arctic regions.", "B": "Caribou that do not eat enough protein to reproduce do not live as long as caribou that do.", "C": "The warming trend in arctic regions will not enable other plants capable of supplying protein to caribou to grow there.", "D": "The caribou is the only mammal that depends on cotton grass as a major source of food.", "E": "If the warming trend continues and cotton grass disappears from arctic regions, cotton grass will become extinct."}, "answer": "C", "explain": {"思路": "逻辑链：变暖→棉草消失→驯鹿夏季缺蛋白质→次年不能繁殖→灭绝。假设题找链条缺的那一环：结论默认了“没有别的植物能补位供蛋白质”。C：变暖趋势**不会**使其他能给驯鹿供蛋白质的植物在北极生长——排他因，保住棉草的“唯一来源”地位，链条成立。C 正确。假设题多少有加强的感觉：假设成立，文章逻辑就更成立。", "annot": "cotton grass=棉草（北极植物）；caribou=北美驯鹿；protein=蛋白质；reproduce=繁殖；extinct=灭绝。链条可画成：warming → grass ↓ → protein ↓ → cannot reproduce → extinct，假设让其中一环或整体成立即可。", "辨析": "A“棉草是驯鹿唯一因温度上涨而变稀少的食物来源”——焦点在“唯一变稀少”：若别的食物没变少，驯鹿照样有得吃，链条反而断了，方向反了。B“蛋白质吃不够、不能繁殖的驯鹿寿命不如吃得够的长”——活得长短与种群是否灭绝无必然关系，偷换了“不能繁殖”为“活得短”。D“驯鹿是唯一以棉草为主要食物的哺乳动物”——引入驯鹿与其他动物的比较，文章只关心驯鹿，无关。E“若变暖继续、棉草消失，棉草将灭绝”——只把“消失”换成“灭绝”重写一遍，压根没提驯鹿，与文章落到驯鹿灭绝的推理无关。", "点拨": "假设题的正解常长这样：“**不会发生某个能推翻链条的其他情况**”（排他因）。选项出现“唯一”“其他”这类词时，问一句：这个“唯一”锁的方向，是让链条更稳还是更松？"}}, {"type": "passage", "title": "实战五 · 喷毒捕公主鱼（削弱）", "source": "课程实录 · 削弱题", "text": "The princess fish, a species of coral reef fish, is captured alive by divers who first stun the individual fish by squirting a certain poison at them. Since the divers limit the size of their catch and are careful not to overfish, the divers' continuing activities will clearly not result in serious harm to populations of the princess fish."}, {"type": "q", "tag": "真题 · 削弱题", "title": "第5题 · 哪个选项最能削弱论证", "source": "实战五", "pause": "承认你不过度捕捞都对，但捕鱼的手段有没有副作用？", "stem": [{"t": "Which of the following, if true, most seriously weakens the argument?"}], "options": {"A": "Princess fish cannot be captured alive by traditional methods of fishing.", "B": "The poison used to stun the princess fish has no effect on humans who eat them.", "C": "Demand for princess fish has remained stable over the last decade.", "D": "Traces of the poison that remain in the seawater damage the corals that create and maintain the reef on which the princess fish depends.", "E": "Fish that have been stunned but not selected for capture by the divers soon recover from the temporary effects of the poison."}, "answer": "D", "explain": {"思路": "逻辑链：潜水员喷毒活捉公主鱼，但限制捕捞量、不过度捕捞→结论：不会严重危害公主鱼种群。削弱=做了这些事，仍会危害鱼。D：喷进海水的毒素残留会**破坏珊瑚**，而珊瑚构成并维系公主鱼赖以生存的珊瑚礁→捕捞是不超标，但手段毁了鱼的家→照样带来 serious harm。原文由前提推结论，加上 D 之后得到了结论的反面，推理不成立。D 正确。", "annot": "princess fish=公主鱼（一种珊瑚礁鱼）；stun=使昏迷；squirt=喷射；overfish=过度捕捞；coral reef=珊瑚礁；traces=残留痕迹。注意 D 的依赖链：鱼靠 reef 活，reef 靠 coral——毁珊瑚就是断鱼的活路。", "辨析": "A“传统方法无法活捉公主鱼”——新方法旧方法与“不过度捕捞就无害”的推理无关。B“毒素对吃这种鱼的人无害”——讨论对象从鱼换成了**人**，人没事帮不了鱼的结论。C“过去十年公主鱼需求稳定”——过去的需求稳定，最近呢？且需求与捕捞是否危害种群无直接关系。E“被喷毒但未被抓走的鱼很快从短暂影响中恢复”——方向反了，这是**加强**（支持无害论）。", "点拨": "削弱题的黄金手法：**承认前提全对，指出漏了一个连带后果**，结果照样走向结论的反面。读到“手段类”文章（喷毒、新药、新政策），自动问一句：这手段有没有副作用？"}}, {"type": "passage", "title": "实战六 · 狮身人面像的脸（削弱）", "source": "课程实录 · 削弱题", "text": "The Great Sphinx is a huge statue in Egypt that has a lion's body with a man's head. The face of the Sphinx has long been claimed to be that of the pharaoh Khafre, who lived around 2600 B.C., but it cannot be: erosion patterns recently discovered on the lion's legs can only have been caused by heavy rains, and the Sahara has not had heavy rains in over 10,000 years."}, {"type": "q", "tag": "真题 · 削弱题", "title": "第6题 · 哪个选项最能削弱论证", "source": "实战六", "pause": "事实（腐蚀痕迹）不能削，要削的是“腐蚀→不是法老K”这个推理。", "stem": [{"t": "Which of the following, if true, most seriously weakens the argument?"}], "options": {"A": "The face of the Sphinx bears a resemblance to the faces on certain stylized statues dating from before and after the reign of Khafre.", "B": "Other erosion patterns that appear on the body of the Sphinx are of a sort that could be caused by wind and sand alone.", "C": "Other than the Sphinx, there are no surviving sculptures that have been claimed to portray the face of Khafre.", "D": "In the last 10,000 years the climate of Egypt has been so dry that even rains that are not heavy have been extremely infrequent.", "E": "The face of the Sphinx is small relative to the rest of the head, indicating that the face may have been recarved long after the Sphinx was built."}, "answer": "E", "explain": {"思路": "逻辑链：狮身人面像腿上的腐蚀只能由**大雨**造成，而撒哈拉一万多年没下过大雨→结论：人面不是法老K（约公元前2600年）的。削弱=承认腐蚀信息为真，但让人面**仍可能是**法老K。E：人面相对于头部其余部分偏小，说明脸可能在雕像建成后很久被**重新雕刻**过——雕像是老的（经得起大雨侵蚀），脸是后刻的（刻成 K 完全来得及），结论被反转。E 正确。做题时你会发现：削弱“不是K”变成了解释“是K 会怎么样”——削弱与解释在性质上同源。", "annot": "the Great Sphinx=狮身人面像；pharaoh=法老；Khafre=卡夫拉；erosion pattern=侵蚀痕迹；recarve=重新雕刻。has long been claimed=长期“被声称”——声称≠事实，作者的立场是“不能是K”。", "辨析": "A“人面与 K 在位前后时期的某些程式化雕像相似”——像别人不能推出是 K，与腐蚀推理无交集。B“像身上其他部位的腐蚀可由风沙单独造成”——推理靠的是**腿上**的腐蚀；其他部位可以一样也可以不一样，动不了腿部证据带来的结果。C“除狮身人面像外没有现存雕塑被声称是 K 的脸”——“被声称”不等于“是”，声称与真相无关。D“过去一万年埃及干燥到连小雨都极少”——与文章干旱信息同向，反而是**加强**。", "点拨": "削弱“证据→不是X”的最优雅姿势：**证据我全认，但另给一个理由说明它就是 X**（E 给了 recarved）。削弱和解释互为镜像：解释“A 却推出非 B”≈削弱“A→B”——五种问法本质相同，只是形式不同。"}}, {"type": "teach", "title": "④ 解释类：貌似矛盾才需要解释", "ppt": ["文章出现貌似矛盾（surprisingly / yet）→欠你一个解释", "事实照单全收，不能硬杠（不能说“其实没移走”“你根本没吃”）", "审题解释对象：问对谁的影响，就解释谁", "削弱与解释同源：解释“A→非B”≈削弱“A→B”"], "text": ["解释题的文章有固定长相：按正常逻辑该出现 X，结果出现了非 X。移走吃本地鱼的梭鲈→本地鱼损失该减少，surprisingly，损失反而更大；两种疗法一样有效，yet，一种的致盲率更低。", "解释的纪律：文章给的事实**照单全收**，解释不能推翻事实。“我吃了很多但没胖”，答案说“你根本没吃，你骗人”——这是强词夺理，不是解释。能动的只有事实之间的关系，以及那些非事实的信息是否真对。", "审题时锁死**解释对象**：是解释“梭鲈造成的损失”还是“本地鱼总量”？差一个限定，能选的选项就不一样。", "性质上，解释与削弱同源：文章给出“A 却推出非 B”，你解释它为什么成立，相当于削弱“A→B”。所以别死记“问法对应做法”——背后都是同一件事：一个推理逻辑，你对它的成立与否做动作。"]}, {"type": "passage", "title": "实战七 · 梭鲈与英国本地鱼（解释）", "source": "课程实录 · 解释题", "text": "Sport fishers introduced the zander, a type of perch, into Britain's rivers and canals in the 1970s. Because zander eat large numbers of smaller fish, they have had a devastating effect on native fish populations. To protect the native fish, a government program removed a significant number of zander from Britain's waterways last year. Surprisingly, this year the loss of native fish to zander has been greater than before."}, {"type": "q", "tag": "真题 · 解释题", "title": "第7题 · 解释梭鲈对本地鱼更大的影响", "source": "实战七", "pause": "解释对象是“zander 造成的损失”，不是“本地鱼总量”——审题差一个字，答案就不一样。", "stem": [{"t": "Which of the following, if true, would most help explain the greater effect of the zander on the native fish population?"}], "options": {"A": "The climate in Britain is very similar to the climate in the regions to which zander are native.", "B": "Most of the zander removed were fully grown, and fully grown zander eat large numbers of smaller zander.", "C": "Every year a large number of zander are caught by sport fishers in Britain's waterways.", "D": "Previous government programs to remove zander from Britain's waterways have not been successful.", "E": "Zander are just one of several species of fish that prey on the native fish of Britain's waterways."}, "answer": "B", "explain": {"思路": "貌似矛盾：为保护本地鱼，政府去年移走了大量吃小鱼的梭鲈→按说本地鱼损失该减少；Surprisingly，今年本地鱼**被梭鲈吃掉**的损失反而更大。解释=不违背“确实移走了”，还要让损失变大合理。B：移走的梭鲈大多是**成年的**，而成年梭鲈大量捕食**小梭鲈**→成年的一走，小梭鲈存活率暴涨→梭鲈总量不减反增→本地鱼损失更大，解释成立。B 正确。", "annot": "zander=梭鲈（一种 perch 鲈鱼）；sport fishers=休闲/竞技垂钓者；canal=运河；devastating=毁灭性的。**surprisingly 是解释题的警报词**——它一出现，就知道文章欠你一个解释。事实不能硬杠：不能说“其实没移走”，就像“我吃了很多但没胖”不能解释为“你根本没吃”。", "辨析": "A“英国气候与梭鲈原产地气候非常相似”——梭鲈活得开不开心，解释不了本地鱼损失为何增加。C“每年大量梭鲈被垂钓者捕获”——抓走梭鲈按说损失该减少，加深矛盾而非解释。D“以往的政府移除项目都没成功”——失败乃成功之母，这次成不成功与过去无必然关系，方向不定。E“梭鲈只是捕食本地鱼的几种鱼之一”——它能解释“本地鱼总量下降”，但本题问的是**梭鲈造成的损失**（greater effect of zander），其他鱼与这个问法无关；若题目只问“本地鱼总量为何下降”，E 就可以选。", "点拨": "解释题两步走：①事实照单全收；②在不推翻事实的前提下，找一个让“反常结果”变合理的新机制。答案往往藏在被处理对象**内部的结构变化**里（这里是成年/幼年比例）。"}}, {"type": "passage", "title": "实战八 · 青光眼：滴眼液与激光手术（解释）", "source": "课程实录 · 解释题", "text": "Though initially without symptoms, glaucoma can eventually cause blindness if not properly treated. Tests under laboratory conditions of the traditional treatment, daily administration of eyedrops, show the drops to be as effective in relieving the internal ocular pressure that causes glaucoma as is a new laser surgical procedure. Yet glaucoma-related blindness occurs in a significantly smaller percentage of patients who have had the surgery than of patients for whom only the eyedrop treatment was prescribed."}, {"type": "q", "tag": "真题 · 解释题", "title": "第8题 · 解释手术组致盲率为何更低", "source": "实战八", "pause": "“疗效一样但结果不同”类矛盾，去现实执行环节找差异。", "stem": [{"t": "Which of the following, if true, most helps to explain the low rate of glaucoma-related blindness among patients who had the surgery?"}], "options": {"A": "Glaucoma-related blindness is no more common among patients who have had only the surgery than it is among patients who had the surgery after using the eyedrops.", "B": "Doctors rarely recommend the surgery for glaucoma patients who have already started the traditional course of treatment.", "C": "There is no known physiological cause of glaucoma other than an increase in pressure inside the eye.", "D": "A significant percentage of the people for whom the eyedrop treatment has been prescribed fail to follow the prescribed daily regimen, because the eyedrops have unpleasant side effects.", "E": "The eyedrops traditionally prescribed to treat glaucoma are normally prescribed to treat other diseases of the eye as well."}, "answer": "D", "explain": {"思路": "貌似矛盾：实验室条件下，传统滴眼液与新激光手术在缓解导致青光眼的眼内压上 **as effective as** 一样有效→照理两组致盲率该一样；Yet，做过手术的病人致盲率显著更低。解释=为什么滴眼液“有效却没效”。D：相当比例被开滴眼液的病人**没遵医嘱**每天滴（滴眼液有讨厌的副作用）——药有效，但没人用，疗效自然打折；手术不存在“不遵从”的问题，致盲率自然低。D 正确。题目问手术的 low rate，换成问滴眼液的 high rate，答案相同。", "annot": "glaucoma=青光眼；ocular=眼睛的（ocul-=眼，如 binoculars 双筒望远镜）；administration=施用/给药；regimen=疗程/医嘱；side effect=副作用。语法点：**no more...than ≠ not more...than**——not more than=不多于（前者≤后者）；no 含 not any 之义，“A is no more common than B”=两者都不普遍（“我不比小明帅多少”=我俩在帅这点上都够呛，半斤八两）。", "辨析": "A“仅做手术与先用滴眼液后做手术的病人，致盲率都不普遍”——**比较对象错位**：文章比的是“只滴眼液 vs 只手术”，A 比的是“只手术 vs 手术+滴眼液”，混合后的比较对原矛盾无用。B“医生很少给已开始传统疗程的病人推荐手术”——两疗法效果一样好，不推荐手术解释不了滴眼液组为何致盲更多。C“除眼内压升高外青光眼没有别的已知生理原因”——顺着文章说病因，推不出“所以滴眼液疗效差”。E“治青光眼的滴眼液通常也开给其他眼病”——治不治别的病与治这个病的效果无关。", "点拨": "“理论上一样好、现实中一个差”的矛盾，答案几乎都指向**执行环节**：药有效≠病人用了。推广开：去现实环节（依从性、成本、副作用、执行率）找差异。"}}, {"type": "teach", "title": "⑤ 评价题：whether 的一正一反", "ppt": ["选项以 whether 开头：回答“是”一个方向，回答“否”是反方向", "检查法：把 whether 分别读成 yes/no，一个加强一个削弱→就是答案", "例：地面湿→下过雨；问“是否有洒水车经过”：是=削弱，否=加强", "评价=加强削弱皆可，方向不用管，只管与推理有关"], "text": ["评价题是加强削弱的综合，所以选项常以 **whether** 开头。whether=是否：把是否读成“是”，选项有一个方向；读成“否”，就是它的反面。如果回答“是”加强原文，回答“否”就必然削弱原文。", "回到洒水的例子：地面湿→推测下过雨。问“是否有洒水车经过”——回答“是”，有车过，下雨的解释力下降（削弱）；回答“否”，没车过，下雨导致地湿的可能性上升（加强）。一个问题同时牵动两个方向，这就是评价题的答案。", "做题时不用纠结方向：只要选项的问题与文章的推理事件直接相关，两种回答一正一反，就是它。检查时再分别代入 yes/no 验证。"]}, {"type": "passage", "title": "实战九 · 受压老鼠与肾上腺（评价）", "source": "课程实录 · 评价题（evaluate）", "text": "When rats are placed under conditions of stress, their adrenal glands immediately increase production of the hormone corticosterone, and soon thereafter the rats' white blood cell count drops substantially. Rats that lack adrenal glands, however, experience no such decrease in their white blood cell count when placed under stress. It is therefore likely that the increase in corticosterone production triggered by a rat's adrenal glands causes the drop in the rat's white blood cell count."}, {"type": "q", "tag": "真题 · 评价题", "title": "第9题 · 知道哪条信息最有助于评价论证", "source": "实战九", "pause": "范围限定词 under stress 是隐形护栏——跑出范围的选项直接删。", "stem": [{"t": "Which of the following would be most useful to know in evaluating the argument above?"}], "options": {"A": "whether the drop in the white blood cell count that occurs in rats under stress is sufficient to make the rats more susceptible to disease", "B": "whether normal white blood cell counts vary widely among healthy rats that are not under conditions of stress", "C": "whether the adrenal glands of rats under stress increase production of hormones other than corticosterone", "D": "whether rats that lack adrenal glands produce increased levels of corticosterone when the rats are not under conditions of stress", "E": "whether rats' adrenal glands are affected by hormones produced by any of the rats' other organs"}, "answer": "C", "explain": {"思路": "逻辑链：老鼠受压→肾上腺立即增产激素 corticosterone→随后白细胞数量大幅下降；没有肾上腺的老鼠受压时白细胞不降→结论：肾上腺导致的激素增加造成了白细胞下降。评价题找“一正一反”的问题。C：“受压老鼠的肾上腺是否增产了**除 corticosterone 之外**的其他激素”——回答“是”：另有他因（可能是别的激素压低了白细胞），链条断，削弱；回答“否”：只产这一种，排除他因，加强。一个问题双向作用力，正是评价题答案。C 正确。", "annot": "adrenal glands=肾上腺（不认识就当 AG 处理，词义不影响做题；想知道查一下即可）；corticosterone=皮质酮（记作“激素C”即可）；white blood cell=白细胞；count=数量；substantially=大幅度地。", "辨析": "A“受压老鼠白细胞的下降是否足以使老鼠易患病”——抗病是链条**再往后**的新环节，带不进“激素→白细胞下降”这段推理。B“不受压的健康老鼠白细胞数量是否差异很大”——整段推理的限定是 **under stress**，跑出范围，对错无从谈起。D“缺肾上腺的老鼠在**不受压**时是否产生更高水平的激素C”——又是“不受压”，跑出范围限定。E“老鼠的肾上腺是否受其他器官产生的激素影响”——哪个器官影响肾上腺与链条无关，关键永远是“肾上腺—激素C—白细胞”三者的关系。", "点拨": "评价题只问一句：这个问题的**两种回答是否一个加强、一个削弱**原推理？满足“一正一反”的就是答案。同时记住范围限定（under stress）是隐形护栏，选项跑出范围直接删。"}}, {"type": "teach", "title": "⑥ 空格题：看空格前的逻辑词", "ppt": ["文章结尾留空让你补，先读空格前的逻辑词", "since / because→填原因，本质就是解释题", "若是“由此可推断”类逻辑词→归纳题（文章对→选项对）", "考到填原因（解释）的居多", "填入内容必须零脑补地接得上逻辑词和上文"], "text": ["还有一种形式：文章结尾留一个空格让你完成。之所以归入逻辑推理（对推理过程的评价），是因为空格前最常见的逻辑词是 **since 和 because**——让你填原因，这与解释题的正确答案（一个原因）完全同构。", "操作顺序：先看空格前的逻辑词。since/because→填原因（解释类）；若空格前是“由此可以推断”一类，则变成归纳题（以文章为真推选项）。基本而言考填原因的居多。", "判断标准不变：填入的信息必须满足逻辑词所要求的上下关系，且不需要你自己脑补中间环节——凡是得加戏才能接上的，都不是答案。"]}, {"type": "passage", "title": "实战十 · C 国经济复苏（空格填原因）", "source": "课程实录 · 空格题（since）", "text": "The economy of Country C has been in recession for the past eight years. Most companies that have not been forced into bankruptcy have survived thanks to the high efficiency of the employees they retained, which helped the companies control costs. In recent months, however, Country C's economy has begun to recover, and companies are beginning to expand their workforces. Country C will therefore experience a drop in the average efficiency of its workforce, since ____."}, {"type": "q", "tag": "真题 · 空格题", "title": "第10题 · 填出平均效率下降的原因", "source": "实战十", "pause": "空格前是 since=填原因；正确答案必须几乎零脑补地接得上。", "stem": [{"t": "Which of the following most logically completes the passage?"}], "options": {"A": "people who have been employed throughout the recession will, no doubt, continue to be employed", "B": "Country C is expected to begin importing more goods from other countries", "C": "most companies will find that few of the workers available for hiring are as efficient as those they retained during the recession", "D": "during the recession, workers did not receive any increase in pay", "E": "many companies that were forced into bankruptcy in the past eight years had a fair number of highly efficient workers"}, "answer": "C", "explain": {"思路": "现象：C 国衰退八年，活下来的公司靠的是**留下的高效员工**控制成本；近月经济复苏，公司开始扩招→结论：C 国平均工作效率将下降。矛盾点：活下来靠的就是高效，为何扩招反而效率降？C：大多数公司会发现，可供雇佣的工人里几乎没人像衰退期留下来的人那样高效——新人不如老人，平均效率被拉低，原因直接补上。C 正确。", "annot": "recession=经济衰退；bankruptcy=破产；workforce=劳动力；efficiency=效率；retain=留住（员工）。空格题先读空格前的逻辑词：since/because=填原因（≈解释题）。", "辨析": "A“衰退期一直有工作的人无疑会继续被雇佣”——这批人代表高效，他们留任应该稳住效率，得不出下降。B“C 国预计将增加从其他国家的进口”——进口与工人效率无关。D“衰退期工人没涨过薪”——想选它得脑补“没涨薪→心凉→效率再也回不来”，戏太足，中间环节全是自己加的。E“过去八年许多破产公司也有不少高效员工”——顺着推（高效员工流入市场被聘用）效率该升；想推出下降得再加“破产公司员工与留任者三观不合天天打架”之类的细节，同样是脑补过度。", "点拨": "填原因的题，正确答案必须**几乎零脑补**地接在 since 后面。凡是需要你补两三个中间步骤才能成立的选项，都是编剧上身，删掉。"}}, {"type": "passage", "title": "实战十一 · 古币上的痣（空格填原因）", "source": "课程实录 · 空格题（since）", "text": "A hoard of coins recently unearthed at an ancient Carthaginian site bears an image of a face in profile with what appears to be a large mole on the cheek. Since an artist would be unlikely to include such a specific detail in a generalized portrayal of a face, some archaeologists have concluded that these coins portray an actual individual rather than an idealized type. However, this conclusion is unwarranted, since ____."}, {"type": "q", "tag": "真题 · 空格题", "title": "第11题 · 填出“结论不成立”的原因", "source": "实战十一", "pause": "承认脸上有痣，但否定“因为画了真人”——任务是找痣的他因。", "stem": [{"t": "Which of the following most logically completes the passage?"}], "options": {"A": "archaeologists cannot determine the actual identity of the individual portrayed on the coins", "B": "it cannot be established with certainty that Carthaginian artists were, on the whole, less skillful at portraying human faces than artists of other cultures", "C": "none of the other designs of Carthaginian coins that have been discovered features a face with a mole on it", "D": "in ancient times it was quite common for the money circulated in a city or country to include coins that originated in other jurisdictions", "E": "the relatively soft metal used for Carthaginian coin molds sometimes resulted in the production of a series of coins with unintended bumps"}, "answer": "E", "explain": {"思路": "逻辑链：古币头像脸颊上有颗明显的痣；艺术家不太可能在**理想化**肖像里加这么具体的细节→考古学家结论：币上画的是真人（因为画真人，所以脸上有痣）。However，作者说这个结论 unwarranted（不成立），since____——要填“有痣但**并非**因为画了真人”的他因。E：铸币模具所用金属较软，有时会压出一串带有**非故意凸起**的硬币——那颗“痣”可能只是软模具压出的凸起（bump），与真人无关。E 正确。", "annot": "hoard=（钱币的）窖藏；unearth=发掘；in profile=侧脸；portrayal=肖像描绘；generalized=概括化的；unwarranted=没有根据的；mold=模具；bump=凸起。**mole 一词多义**：①痣（脸上该有的东西）②鼹鼠（从下面打洞上来的，捷克动画《鼹鼠的故事》）③防波堤（诺兰《敦刻尔克》里的海堤）——同形异源，语境锁定义项，这里是痣：脸颊上不可能有鼹鼠，更不可能是防波堤。老师的生活化例子：人民币上毛主席的痣在，因为他是具体的人；画“一般人”不会点颗痣——这正是考古学家推理的起点。", "辨析": "A“考古学家无法确定币上人物的真实身份”——是谁与“为何有痣”无关。B“无法确定该文化艺术家总体画人脸的技艺是否不如其他文化”——第一“不能确定”，第二“比别人差一点”不等于技术差到会多出个包，双保险地没解释力。C“已发现的其他币面图案没有一个带痣”——其他币没痣，与这组币为何有痣无关。D“古代一城一国流通的钱币常包含外地硬币”——流通范围与痣的成因无关。", "点拨": "“承认现象、否定归因”型填空，任务就是给现象找一个**他因**。五个选项里只有一个能产出“脸上有东西”这个结果（软模具→凸起），其余连现象都接不上——先问“这个选项能解释痣的存在吗”，接得上才谈其他。"}}, {"type": "teach", "title": "⑦ 逻辑推理不只有单题", "ppt": ["逻辑单题=一篇短文只考一道逻辑题，位置一般在第16题（句子等价12-15之后）", "一个 section 约一道，初期难可先放", "同样的问法也出现在 2/3/4 题的长文里，而且更简单", "长文里只针对某个局部信息做加强削弱，不用分析全篇逻辑", "“单题”说的是形式，“逻辑推理”说的是能力——能力在哪都可能考"], "text": ["刚才这些题有个共同点：一篇文章只配一道题，这就是俗称的“逻辑单题”——“单题”指形式（一文一题），“逻辑推理”指它考的能力。之所以叫逻辑推理类而不叫逻辑单题，是因为这种能力不一定以单题形式出现。", "单题在卷面上的位置：如果句子等价（sentence equivalence）排在第 12-15 题，那么第 16 题往往就是这道逻辑推理题。一个 section 约出一道，初期觉得难可以先放，主攻其他题型，有练习量后再回来培养感觉。", "加强、削弱、假设这类问法同样会出现在 2/3/4 题的文章里，而且往往**更简单**：长文信息量大，要考逻辑推理时通常只针对一个局部信息，逻辑关系远没有单题那么绕。识别标志是题目点名了某个人群或某个论断（“做研究的考古学家们的推理”“Scott 的 argument”），你只需把那一句话的推理拎出来做动作。下面两道就是例子。"]}, {"type": "passage", "title": "实战十二 · 旅鸽灭绝（多题文章中的削弱题）", "source": "课程实录 · 该文此前讲次出现过，此处仅重建与本题相关的信息", "text": "（参见此前讲次全文）Although the passenger pigeon became extinct in the early twentieth century, it was abundant in North America during the eighteenth and nineteenth centuries. Archaeological studies of twelfth-century settlements in the Cahokia region, however, found no traces of passenger pigeon among the food remains. Since these settlements were near a large passenger pigeon roosting site documented by Audubon in the nineteenth century, and since the inhabitants consumed virtually every available source of animal protein, the archaeologists conducting the studies concluded that the passenger pigeon population had once been very limited and then increased dramatically.（该文曾考过一道宏观题：作者提到 tiny bones from fish 的目的，是驳斥这批考古学家、支持前面做研究的学者。）"}, {"type": "q", "tag": "真题 · 削弱题（该文第2题）", "title": "第12题 · 哪个选项最质疑考古学家的推理", "source": "实战十二", "pause": "前提和结论各自都是事实——刀口在“前提凭什么支持结论”。", "stem": [{"t": "Which of the following, if true, most seriously calls into question the reasoning of the archaeologists conducting the studies?"}], "options": {"A": "Audubon was unable to correctly identify twelfth-century Cahokian sites.", "B": "Audubon made his observations before passenger pigeon populations began to decline.", "C": "Passenger pigeons would have been attracted to household food trash.", "D": "Archaeologists have found passenger pigeon remains among food waste at eighteenth-century human settlements.", "E": "Passenger pigeons tended not to roost at the same sites for very many generations."}, "answer": "E", "explain": {"思路": "这是该文第 2 题——逻辑推理不是单题专利。考古学家的推理链：12 世纪遗址食物垃圾中没发现旅鸽痕迹 + 遗址离 19 世纪 Audubon 记载的大型旅鸽栖居地很近 + 当地居民几乎吃所有可得的动物蛋白→结论：旅鸽数量一度很少，后来暴增。前提（离栖居地近、什么都吃）和结论（先少后多）各自都是事实，能削的是**关系**。E：旅鸽往往不会在同一地点栖息很多代——栖居地会漂移，12 世纪时鸽子未必住在那个“离遗址近”的地方，找不到骨头不能说明当时鸽子少，前提被架空，质疑（call into question）成立。E 正确。", "annot": "passenger pigeon=旅鸽（已灭绝的北美候鸟）；roost=栖息；roosting site=栖息地；for very many generations=连续很多代；call into question=质疑。E 削的不是结论本身，而是前提的有效性：近是近，但鸽子待一下就跑了。", "辨析": "A“Audubon 无法正确辨认 12 世纪遗址”——文章已把遗址辨识当作给定信息，否定它没有意义。B“Audubon 的观察早于旅鸽数量开始下降”——文章要的时段是“稀少→暴增”那一段，观察在下降之前，**时间范围**错位，对原文时段没作用。C“旅鸽会被家庭食物垃圾吸引”——它吃不吃垃圾，与“垃圾里没发现它说明它少不少”无关。D“考古学家在 18 世纪人类定居点的食物垃圾中发现了旅鸽残骸”——顶多说明 18 世纪鸽子多，对 12 世纪的推断反而有点**加强**的意思。", "点拨": "前提与结论都是事实时，削弱的刀口在“前提凭什么支持结论”。多题文章里的逻辑题通常只针对局部信息，比单题简单——盯住题目点名的那个人群（conducting the studies 的考古学家）的那一段推理即可。"}}, {"type": "passage", "title": "实战十三 · 1919 年英国 48 小时工作制（多题文章中的支持题）", "source": "课程实录 · 该文此前讲次出现过，此处仅重建与本题相关的信息", "text": "（参见此前讲次全文）In 1919 Britain experienced its largest ever reduction in weekly working hours, to forty-eight hours. Dowie argued that the forty-eight-hour week played a central role in Britain's subsequent poor economic performance, and that the reduction, because it was accompanied by wage increases, drove up prices. However, others found that World War I constituted a negative macroeconomic shock to British competitiveness. Scott, for his part, argues that Dowie's thesis overlooks considerable evidence that hourly productivity improves when hours are reduced from a high base level: total hours fell to forty-eight, yet hourly productivity rose."}, {"type": "q", "tag": "真题 · 支持题（该文其中一题）", "title": "第13题 · 哪个选项最支持 Scott 的论证", "source": "实战十三", "pause": "只需支持 Scott 那一句话：工时降、单小时效率升——找它的同义改写。", "stem": [{"t": "Which of the following, if true, provides the strongest support for Scott's argument?"}], "options": {"A": "Companies have generally found that part-time employees are more productive than full-time employees.", "B": "When the total number of hours worked at a company increases owing to the addition of more employees, the usual result is improved productivity at the company.", "C": "When the total hours worked by all employees each week in two companies are equivalent, hourly productivity tends to be equivalent as well.", "D": "Companies whose employees usually work a high number of hours tend to have greater total costs than do similar companies whose employees work fewer hours.", "E": "Companies have found that total output per employee is not necessarily changed by reductions in the number of hours worked per employee."}, "answer": "E", "explain": {"思路": "题目点名支持 **Scott 的 argument**。Scott 的核心一句：工时从高基数降到 48 小时后，**单小时生产率**（hourly productivity）反而上升——以此反驳 Dowie“48 小时工作制拖垮英国经济”。只需让这一句话更成立。E：公司发现，减少每个员工的工作小时数，员工的**总产出**（total output per employee）未必变化——时间少了、总量不变，单位时间产出必然上升，这正是“hourly productivity improves”的等值改写，直接支持。E 正确。", "annot": "hourly productivity=小时生产率；base level=基数；output=产出；not necessarily=未必。多题文章里的逻辑题，只需提取被支持/被削弱的那一句话，选项只要让它更/不成立即可，不必照顾全文。", "辨析": "A“公司普遍发现兼职员工比全职员工更高效”——把工人内部分类，文章谈的是工人**整体**，分类对整体没影响。B“公司总工时因增员而增加时，生产率通常提高”——方向相反：Scott 说工时**减少**效率上升，B 说工时增加效率上升，唱反调。C“两家公司每周总工时相当时，小时生产率也倾向于相当”——公司**间**比较；Scott 要的是**同一公司内部**工时变化与效率的关系。D“员工工时长的公司往往比工时短的类似公司总成本更高”——谈**成本**，文章谈效率，对象不符。", "点拨": "支持一个论断，可以找它的**同义改写**。E 没提 hourly productivity 这几个字，但“总产出不变÷工时减少=效率上升”是同一句话的算术版——正确答案常与原文信息性质相同而字面不同。"}}, {"type": "teach", "title": "⑧ 本讲收束", "ppt": ["所有动作归一：捋出逻辑链 A→B，对成立性做加强/削弱/假设/解释/评价", "手法库：他因、因果倒置、排他因（加强）、范围限定、比较对象锁定", "方向纪律：选项假定正确、答案不必来自原文、先读问题、不过度脑补", "事实不能动，动的只有推理关系；解释≈削弱的镜像", "题型是手段不是目的：看懂问什么，把题做对"], "text": ["逻辑推理类到此收官。五种问法、单题与长文两种形式，背后都是同一个动作：**把文章的逻辑链捋出来，看清问题要求的方向，挑出那个既满足方向又与链条发生关系的选项**。", "可带走的手法库：削弱用他因和因果倒置，加强用排他因，假设找链条缺的那一环，解释在事实照单全收的前提下补机制，评价找一正一反的 whether 问题。选项审查三问：范围对不对（时间/空间/受压与否）？比较对象对不对（文章比谁和谁）？要不要我脑补（脑补即出局）？", "至此全部题型讲完。题型不是目的，只是手段——告诉你考试里可能出现哪些问题形式、各自归哪类、思路是什么。通过平常练习熟悉这些形式即可，最终目标只有一个：考场上看懂问什么，把题做出来。"]}], "transcript": "这里是GRE阅读理解的第19节课，在这节课当中，我们将顺势去讲解逻辑推理类题目的第二小节。在之前的课程里面，我们会把逻辑推理的题目分成去分析它的结构特征，去推出结论以及要去分析它的推理逻辑链。在这一节课里，我们将重点强调分析推理逻辑链这么一个特点。那首先说一下，什么叫做逻辑链？在文章当中，本身由一个信息推导出，另一个信息这个过程就是一个逻辑的链条，我们就叫它逻辑链。一旦有这个逻辑链之后呢，就形成了一个结构，对于这个结构来讲，我们能做什么事情，这就是考察。评价性的这么一种能力，评价性基本上可以有的，具体的问法有这么几个，加强削弱假设解释或评价来分别说一下。所谓的加强，就是在文章中出现了一个由a推b的逻辑链条之后。选项正确，能加强这个逻辑，意思就是使文章中这个推理关系会更成立，这个就叫做strengthen。而呢，就是如果选项正确，将使得文章这个推理的过程成立的可能性下降。这两个动作就可以看作是一个相反的过程了，不过原理其实是一样的，只不过说呈现的方向相反。assume指代的就是当原文中这个推理过程要成立的话，需要基于这个选项，把选项作为一个前提假设。解释的特点有一个挺有意思的地方，就是往往在文章中出现的这个逻辑里，他差了一个解释。所以才要求你解释，比如说文章往往会产生一种看似矛盾的现象，假设我吃了很多。我应该长胖，但是我没胖。文章到此说完了，你觉得缺了点什么呢？欠了你一个解释，为什么吃了很多还没有胖呢？这个时候就需要一个explanation，这就是这种问题形式，它的文章往往对应的特点。那答案可能是说我虽然吃了很多，但是我锻炼了，我虽然吃了很多，但是我吃的都是草，对吧？没有什么热量。evaluate其实可以看作是前面这些问法的一种综合，因为本身针对于这种大类型的能力来讲，它就是对于推理的过程进行一个评价。而这种题到后面，我们就会发现它的特点很有意思，比如说它的选项啊，假设a选项开头，它并不是一个确定的词，而是比如给了whether。是否也就是针对于这个是否这个词，你回答出来的答案不同，可以去加强原文的逻辑，也可以去削弱原文的逻辑。所以评价
