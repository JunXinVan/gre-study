所以说还是要关注像quantify这样的词，它所表示的逻辑关系是什么？好，刚才这篇文章里面的话呢，有一个词组还是要给大家去讲一下，就是这个not so much as。但凡是逻辑表达的方式呢？有一些我们以前是背下来的这些固定方式，但是有的时候如果你能理解它的来历就会很好的理解它为什么要表达这个逻辑？简单来说啊，在这里比较一下，双方a和b两个对象在比较的时候在比较，两者在某一个特征上的程度，一般我们能得出两种关系。分别是等于和不等于那，如果想表达a和b相等，你需要用到逻辑词用什么呢？英语当中可以用到这么一个词汇叫做s。所以你可以写出来a as什么asb在这里as表示的是两者的相似性，所以我们把它翻译成。像那么接下来，两者在某一个对象上一定是一样的，所以在前面出现了一个表示一样的词，中间呢，加上一个特征，比如说这里有一个形容词。来表示出两者在这个特征上是一样的，所以前面这个词翻译成一样。由于其语义上的特点，那么as更多相当于是一个连接词，连接前后表逻辑，而这个as相当于一个修饰词。当然，在这里修饰形容词，它就是副词。如果修饰名词，它可以当形容词来用。所以在这儿的话呢，这个整体的逻辑结构就产生了，然后接下来的话呢，就是。呃，可以产生a和b当中的一种不等关系，如果用iss表达，那么这个时候可以在第一个s前加一个not与是形成这样的关系。如果不加not的话，两者相等，加了not就说明a小于b。这么一个逻辑关系好，同时s这个词也可以换成so这个词汇。接下来如果你比较两者特征的时候，比的并不是一个非常具体的特点，而只是比了一下程度。就是a小于b这个程度我也不比a在哪方面，小于b就是a小于b，所以这个时候可以在后面加一个单词叫much来体现出两者比的是程度上的大小。所以当你碰到了一个not so much as的结构，我们把它再重写一遍。就一点一点的推出了这种逻辑性。not so much asb当然，你可以把a放在这个位置，根据语法的特点也可以，此时它体现的逻辑是什么？a的长度是不及b的。a不及b的程度并不代表a1定是错的，只是代表a的程度会低一些。好，这就是这个结构的来历，所以通过它你回头再分析刚才文章这句话就明白了。这封信的重要性，与其说是历史的，不如说是情感上的。明白这个逻辑思路的应用了吗？好，这是关于这篇文章中需要给你讲的这么一个逻辑表达的方式。好，那么本小节课程呢？到此也就结束了，在这一节课当中，我们重点所强调的是让步转轴这种反向的逻辑关系，它和前面讲过的对比对立，一同构成了反向的逻辑。"}, {"id": 8, "title": "第8讲 · 逻辑分析4-结构-相似（并列·重述·顺承）", "intro": "结构维度第一讲：相似性=双方地位平等。三个子类型：**并列**（并排站）、**重述**（换句话说）、**顺承**（接着往下说）。本讲九篇文章、十余道题，是阅读课题量最大的一讲——重点装备：分号的真用法（后面可以接短语！)、牛津逗号、some…some 无词并列、指代词顺承猜词（it/this/的）。", "cards": [{"type": "teach", "title": "① 相似性总论 + 并列的信号", "ppt": ["相似 = 平级；三个子类：并列 / 重述 / 顺承", "and/or · also/too · then/next · first/second/finally", "further/furthermore/moreover 在GRE中=并列（不是递进！）", "分号是并列标点；无词时看形式/句式相似"], "text": ["结构相似=成分地位相同（平级）。**并列**的信号词：and（共存）/or（选一）;also/too/as well/equally（也，方向一般同向）;then/next（往下滚动）;first/second/finally（列举）;further/furthermore/moreover（在GRE里当**并列**用，不是程度递进！);meanwhile/simultaneously（同时）;likewise/similarly（相似）;other/another（可能是对立的另一方，但地位平等）。", "**分号=并列标点**；没有逻辑词时，形式/长短/句式的相似就是并列（如 some…some)。", "纪律提醒：并列只承诺**结构**平等，方向可同可反（第4讲的 and)。"]}, {"type": "passage", "title": "实战一 · 词汇小测（coinage）", "source": "截取段 · 重点：also + some…some 双并列猜词", "text": "Those in the know can draw on a rich stock of abstract terms to express the nuances of their thought; they can also avail themselves of other forms of expression of metaphorical meaning — some original, some derived from the coinages of T."}, {"type": "q", "tag": "真题 · 词汇题", "title": "第1题 · coinage 的意思", "source": "实战一", "pause": true, "stem": [{"t": "In the passage, “coinage” most nearly means..."}], "options": {"A": "enterprise", "B": "creation", "C": "idiosyncrasy", "D": "pronunciation", "E": "currency"}, "answer": "B", "explain": {"思路": "①并列双锚：also（与前句并列）+ some…some（句式并列）。②some original, some derived from T's coinage：一些是原创的，一些是借鉴 T 的——original 与“借鉴来的”相对 → coinage=original 的同义=创造。", "annot": "并列链：<span class='m3'>some original</span> ↔ <span class='m4'>some derived from T's coinage</span> → coinage=<span class='m4'>original=创造</span>。", "辨析": "E currency 是 coin（硬币）的表面干扰——coinage 本义虽是“铸币”，此语境取“创造/新造表达”;C idiosyncrasy 个性、A 事业、D 发音都不沾。", "点拨": "词汇题先找并列对子（some…some)，对子两端一正一反，答案就是已知那端的同义词。词认识≠题做对——语境义优先。"}}, {"type": "passage", "title": "实战二 · 农奴制与经济增长（分号的并列王国）", "source": "先自己做：2 题不定项 · 重点：分号、三个 if 的下位并列、总分结构", "text": "According to the conventional view, serfdom inhibited economic growth in nineteenth-century Russia. In this view, Russian peasants’ status as serfs kept them poor through burdensome taxes in cash, in labor, and in kind; through restrictions on their freedom of movement; and through various forms of coercion. Milton, however, argues that serfdom was perfectly compatible with economic growth, because Russian serfs were able to get around their landlords’ rules and regulations. If serfs could pay for passports, they could leave the estate; if they could pay fines, they could establish independent households; and if they had the resources, they could hire labor to cultivate the communal fields, leaving themselves free to engage in trade or to work in cities as migrant laborers."}, {"type": "teach", "title": "② 本讲语法装备：分号与牛津逗号", "ppt": ["分号逻辑上表并列；并列成分复杂（内部已有 and）时用分号替逗号", "三者并列 A, B, and C：and 前的逗号=牛津逗号（美式有，英式无）", "分号后面可以接短语，不一定是完整分句"], "text": ["**牛津逗号**：三者并列时 and 前的逗号（A, B, and C）有正式名字——它让 B 和 C 掰开，避免歧义（“我们邀请了演员、J 和 JJ”没有逗号会被理解为“演员J+演员JJ”两个人）。GRE（美式）里这个逗号存在；考雅思（英式）则常省略。", "**分号升级**:ABC 的并列成分本身很复杂（A 里面已经有 and）时，用分号代替逗号——农奴文里“in cash, in labor, and in kind; through restrictions…; and through…”就是这么来的。所以“分号后面必须接完整句子”是错的：分号后接短语成分完全合法。", "**总分识别**：三个 if 并列，则它们是“下位”；前面“serfs were able to get around rules”是“上位”（水果 vs 苹果香蕉梨）——这条规则下讲（主次）还会精讲。"]}, {"type": "q", "tag": "真题 · 不定项", "title": "第1题 · 规章制度包括什么", "source": "实战二", "pause": true, "multi": true, "pickN": 3, "stem": [{"t": "It can be inferred from the passage that the rules and regulations governing serfdom involved which of the following?（选所有适用的选项）"}], "options": {"A": "responsibilities to perform certain defined tasks", "B": "restrictions on freedom of movement", "C": "restrictions on the ability to establish independent households"}, "answer": "ABC", "explain": {"思路": "①问题核心：rules and regulations 包括什么。②定位：农奴应对的对象就是地主的规矩；三条应对手段各对应一条规矩：买通行证→限制移动（B)；交罚款建独立家庭→限制建家庭（C)；雇人种公共用地→有规定的耕作任务（A)。③ABC 全选。", "annot": "对应表：<span class='m3'>通行证</span>→B · <span class='m3'>独立家庭</span>→C · <span class='m3'>公共用地耕作</span>→A。三条应对=三条限制的镜像。", "辨析": "不定项不是“选几个都行”——多选、少选、错选都不给分，必须完全选中。", "点拨": "不定项先数线索条数：文中三个 if 正好三个选项，全选的概率就很高——但仍要逐条对上，选项也可能混入第四条假线索。"}}, {"type": "q", "tag": "真题 · 不定项 · 功能题", "title": "第2题 · 三 if 句群的功能", "source": "实战二", "pause": true, "multi": true, "stem": [{"t": "The sentence beginning “If serfs could pay for passports…” serves which of the following functions in the passage?（选所有适用的选项）"}], "options": {"A": "It provides support for a view presented in the preceding sentence", "B": "It provides evidence that helps undermine a view introduced in the first sentence", "C": "It poses a question that the succeeding sentence will resolve"}, "answer": "AB", "explain": {"思路": "①结构：上位论点（农奴能绕过规矩）→ 三个 if（下位论据，并列）。②对前句：支持（A✓)。③对首句：支持 Milton=反驳传统观点（B✓)——一个动作两重功能，不定项可以同时成立。④C：没提问题，后面的句子与它并列不是解答。", "annot": "双重身份：<span class='m4'>支持前句（Milton）</span> ⇔ <span class='m4'>反驳首句（传统观点）</span>——同一份证据，因为两句本就是对立的。", "辨析": "C 的 pose a question 无中生有；注意 succeeding=接下来的（≠successful),preceding=前一句。", "点拨": "不定项的“多重功能”是考点：一个论据对上句是 support、对对立面就是 undermine——两个都选。"}}, {"type": "passage", "title": "实战三 · 杜波依斯的小说为何被忽视", "source": "先自己做 · 重点：并列一方不能概括整体 + would/perhaps 主观语气", "text": "It would be expected that a novel by so prominent a figure as W. E. B. Du Bois would attract considerable critical attention, and, when the issue of race is as central to a novel as it is to The Quest of the Silver Fleece, it would be surprising not to encounter an abundance of scholarly work on the text. But valuable as the scholarship on Du Bois’ political and historical thought has been, his novels have received scant critical attention. Perhaps Du Bois the novelist must wait his turn behind Du Bois the philosopher, historian, and editor. But then perhaps it is not so much that the novels are being overlooked as that they do not speak to the current concerns of literary critics."}, {"type": "q", "tag": "真题 · 主旨题", "title": "第1题 · central issue", "source": "实战三", "pause": true, "stem": [{"t": "The passage is primarily concerned with which of the following issues?"}], "options": {"A": "the perfunctoriness of much of the critical work devoted to Du Bois’ novels", "B": "the nature of Du Bois’ engagement with the issue of race in The Quest of the Silver Fleece", "C": "whether Du Bois’ novels are of high quality and relevant to current concerns", "D": "the relationship between Du Bois the novelist and Du Bois the philosopher, historian, and editor", "E": "the degree of consideration that has been given to Du Bois’ novels, including The Quest of the Silver Fleece"}, "answer": "E", "explain": {"思路": "①主旨题找能概括全文的选项。②B 和 E 都出现了斜体作品《银羊毛的追求》——关键看该作品在文中的地位：它只是 additionally 并列内容里的一本（分），不能概括全文；E 用 novels（复数，包含它）概括“被关注的程度”=全文话题。③E。", "annot": "地位判别：<span class='m3'>单部作品=并列中的一方=分</span> → 不能概括整体；<span class='m4'>novels 全体=整体</span> → 可以。", "辨析": "B 以单部作品为中心=以偏概全（并列一方≠整体，就像“苹果”不能概括“水果”);A perfunctory（敷衍）态度过重；C“质量好坏”文章没谈；D 身份关系只是部分信息。", "点拨": "两个选项都含同一专有名词时，比地位：它在文中是“分”还是“总”。分的那个选项必然是陷阱。"}}, {"type": "passage", "title": "实战四 · 印第安人的比例代表制（first/second/third）", "source": "先自己做：2 题 · 重点：列举式总分 + also 顺承", "text": "Analyzing the levels of proportional representation of American Indians in state and local government jobs is important for several reasons. First, the basic idea underlying the theory of representative bureaucracy is that the demographic composition of a bureaucracy should reflect that of the general public; besides its symbolic importance, increased access to managerial positions may lead to greater responsiveness on the part of policymakers to the political interests of traditionally underserved groups such as American Indians. Second, the relative absence of American Indians from higher-level jobs in bureaucracies, as opposed to nonmanagerial positions, is important because managerial jobs confer economic advantages — good salaries, benefits, status, security, and mobility. Third, if there has been a growth in American Indians’ share of more desirable public-sector positions over the last two decades, then, for instance, Peterson and Duncan argue that the population and power of American Indians have been growing in certain states. Peterson and Duncan also suggest that this growth may reflect a possibility that American Indians are becoming more active in nontraditional areas of politics, assimilating into mainstream culture, and securing with greater frequency leadership positions in nontribal governments."}, {"type": "q", "tag": "真题 · 主旨题", "title": "第1题 · primary purpose", "source": "实战四", "pause": true, "stem": [{"t": "The primary purpose of the passage is to..."}], "options": {"A": "summarize a demographic trend over time", "B": "present findings on a demographic group", "C": "analyze the demographic composition of a particular bureaucracy", "D": "explain the need for a particular kind of social research"}, "answer": "D", "explain": {"思路": "①首句=全盘概括：分析印第安人代表比例“很重要，原因有几点”→ 全文就是解释这些原因。②D=explain the need（重要=需要）for particular social research(research≈analyze 同族词）。", "annot": "首句改写：<span class='m3'>analyzing…is important</span> → <span class='m4'>explain the need for…research</span>。总分结构的文章，首句就是 topic sentence。", "辨析": "A/B 的 trend/findings 都不是文章动作；C 分析构成只是第一点的内容。", "点拨": "总分结构（first/second/third）的文章，主旨题优先找首句的同义改写。"}}, {"type": "q", "tag": "真题 · 功能题", "title": "第2题 · 末句的功能", "source": "实战四", "pause": true, "stem": [{"t": "The highlighted sentence performs which of the following functions in the passage?（高亮句：“Peterson and Duncan also suggest that this growth may reflect a possibility that…”）"}], "options": {"A": "It hypothesizes a phenomenon that explains a point made in the preceding sentence", "B": "It provides evidence to undermine an assertion made in the first sentence", "C": "It offers a projection regarding the development of a trend mentioned earlier in the passage", "D": "It presents an interpretation of a discrepancy noted earlier in the passage", "E": "It describes an implementation of a policy discussed in the preceding sentence"}, "answer": "C", "explain": {"思路": "①末句结构：this growth（回指前句的“二十年增长趋势”）may reflect a possibility（可能反映一种可能性——对未来的推断）。②前句说“有增长”，末句说“这增长可能意味着什么”=对趋势发展的预测。③C 的 projection（预测）正好。", "annot": "指代链：<span class='m3'>this growth</span>=前句趋势 → <span class='m4'>may reflect a possibility</span>=对未来的推测 → projection。", "辨析": "A 方向反（不是解释前句，而是从前句延伸出的推论）;B undermine 首句——全文根本没有转折；D discrepancy（不一致）无中生有；E implementation（政策实施）无对应。", "点拨": "also 在这里是“顺承着说”（先说增长，再说这增长可能意味着什么），不是严格并列——逻辑词也要看内容落地。"}}, {"type": "teach", "title": "③ 重述：换句话说（前后意思一样）", "ppt": ["that is / that is to say / i.e. (= that is) / in other words / namely", "namely=name+ly：A 就叫这个名字=同一个人"], "text": ["**重述**=换句话：前后地位一致、意思相同。信号：that is / that is to say / **i.e.**(拉丁语 id est 的缩写，读作 that is)/ **in other words** / **namely**(name+ly:A 名叫这个名字→A 和这个名字是同一人)。", "作用：解释术语（第5讲约翰逊篇的 not so much as 也是重述精神）。见到重述词=作者给你发了一个“同义翻译”，后面的解释帮你锁定前面的意思。"]}, {"type": "passage", "title": "实战五 · 伏尔泰推广牛顿（in other words）", "source": "先自己做 · 不定项 · 重点：非科学家是优点", "text": "Voltaire’s Elements of the Philosophy of Newton, published in 1738, was an early attempt to popularize the scientific ideas of Isaac Newton. In the book’s frontispiece, Voltaire is shown working at a desk; above his head, the light of truth passes from Newton through Voltaire’s collaborator, Madame du Châtelet, who reflects it onto the inspired Voltaire. The book found a wide audience because Voltaire, neither a mathematician nor a physicist but a literary giant aloof from the academic disputes over Newton’s ideas, was, in other words, an amateur in science — a resource that gave his exposition its contemporary appeal, rendering Newton’s ideas accessible to nonspecialists."}, {"type": "q", "tag": "真题 · 不定项", "title": "第1题 · 关于这本书的推断", "source": "实战五", "pause": true, "multi": true, "pickN": 3, "stem": [{"t": "Which of the following statements about Voltaire’s Elements of the Philosophy of Newton can be inferred from the passage?（选所有适用的选项）"}], "options": {"A": "Voltaire’s literary stature helped ensure a wide audience for his attempt to popularize Newton’s ideas", "B": "Voltaire’s status as a nonscientist was an advantage in his effort to bring Newtonian science to the public", "C": "The frontispiece implies that Newton’s ideas would not have reached Voltaire without assistance"}, "answer": "ABC", "explain": {"思路": "①A:found a wide audience because…a literary giant→文学地位→大众，✓。②B:in other words, an amateur in science — a resource（资源！)=非科学家反而是优点，✓。③C:frontispiece 插画：牛顿的光→du Châtelet 反射→伏尔泰——暗示需要中间人帮助才能接收到，✓。", "annot": "三线索：<span class='m3'>literary giant→audience</span> · <span class='m3'>amateur=a resource</span> · <span class='m3'>反射光=assistance</span>。", "辨析": "注意 resource 一词定褒贬：非专家身份是“资源”不是缺陷。C 的 imply 类选项只要能从文中直接推得（光经过合作者才到伏尔泰）就成立。", "点拨": "不定项三题全选是常态而非例外——当线索条数与选项数吻合时逐条核对，别被“不可能全选”的心理暗示带偏。"}}, {"type": "passage", "title": "实战六 · nation-state 是误称（i.e. 的解释）", "source": "先自己做 · 重点：术语题的“括号/ i.e. 解释”定位", "text": "According to Handler and Segal, the term “nation-state” is a misnomer. The ideal model of a monolingual, culturally homogeneous state can never exist — not even among the Europeans who invented the concept and exported it to the rest of the world. They argue that contemporary European nations emerged after the Renaissance through the rise of nations — i.e., specific ethnic groups — to positions of dominance."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · H 和 S 把 nation 定义成什么", "source": "实战六", "pause": true, "stem": [{"t": "According to Handler and Segal, a “nation” is which of the following?"}], "options": {"A": "a sovereign state", "B": "a specific ethnic group", "C": "a monolingual, culturally homogeneous population", "D": "a political position achieved through dominance", "E": "a concept exported from Europe to the rest of the world"}, "answer": "B", "explain": {"思路": "①定位：rise of nations — **i.e., specific ethnic groups** — i.e. 就是“换句话说”，后面就是 nations 的定义。②B 原词对应。", "annot": "重述锚点：<span class='m2'>i.e.</span> → <span class='m4'>nations = specific ethnic groups</span>。", "辨析": "A/C/D/E 都是文中其他名词（state/理想模型/统治地位/概念）的干扰——它们都“看上去合理”，但 i.e. 锁定了唯一定义。", "点拨": "i.e./namely/that is 后面=出题人给你的标准答案位置。另外记住：state 本义=主权国家（美国 state 是联邦制遗留）,nation=民族。"}}, {"type": "teach", "title": "④ 顺承：接着往下说（指代词的力量）", "ppt": ["it/they/this/that/these/those/的/such = 顺延前面继续讲", "顺承是猜词神器：不认识的名词后面，it 会告诉你它是什么"], "text": ["**顺承**=先说到这、再往下继续。最常用的工具是**指代**:it/they/this/these/的/such 把前面的信息接过来接着写——前后地位相似。", "顺承是猜词神器：遇到不认识的名词，它的指代词后面会暴露它的属性（第5讲先锋派文：不认识 avant-garde,**it** was a look signaling progressive ideas and unconventionality→它就是“先锋”)。", "动词形式也表意：would/perhaps=说话人的主观判断（虚拟未必发生）;have received=实际发生的事实。would be expected…But…received=先虚后实，虚实对比出反差。"]}, {"type": "passage", "title": "实战七 · 先锋派平面设计的逆袭", "source": "先自己做：2 题 · 重点：it 指代猜词 + instead 取代传统", "text": "In the early twentieth century, small magazines and the innovative graphics used on them created an image of the avant-garde: it was a look that signaled progressive ideas and unconventionality. It did so by dispensing with what had been considered the cardinal rule of graphic design — make an idea visually clear, precise, and immediately intelligible — and instead presenting images that were blurred, ambiguous, and obscure. This overturning of convention was an attack on standard graphics in search of intellectual freedom, and it led artists to see, with fresh eyes, untried possibilities for arranging and relating words and images on paper."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · 传统平面设计的目的", "source": "实战七", "pause": true, "stem": [{"t": "According to the passage, the aim of conventional graphic design was to..."}], "options": {"A": "render unpopular ideas palatable to a broad audience", "B": "capture the reader’s attention with boldface type", "C": "convey nonsensical notions", "D": "communicate ideas efficiently and unambiguously", "E": "introduce previously unknown ideas to the general public"}, "answer": "D", "explain": {"思路": "①定位：cardinal rule of graphic design=make an idea visually clear, precise, and immediately intelligible。②传统目的=清晰、精确、立即理解=efficiently and unambiguously。", "annot": "对应：<span class='m3'>clear→efficiently</span> · <span class='m3'>precise/immediately intelligible→unambiguously</span>。", "辨析": "A 让不受欢迎的观点变得可口、B 黑体字、C 无意义的概念（那是先锋派的）——均无对应；不认识 palatable/unambiguously 可以先放，读到 D 两个词都能对上就选。", "点拨": "选项有生词别慌：先放问号，继续读——后面出现“两个词都对得上”的选项就直接选。这个方法第12讲（选项分析）会系统讲。"}}, {"type": "q", "tag": "真题 · 不定项", "title": "第2题 · 先锋派创作的目的", "source": "实战七", "pause": true, "multi": true, "stem": [{"t": "According to the passage, the avant-garde artists who created the works discussed attempted to...（选所有适用的选项）"}], "options": {"A": "expand the range of possibilities for expression through visual art", "B": "compete with advertisers for readers’ attention", "C": "encourage the expansion of small magazines"}, "answer": "A", "explain": {"思路": "①定位末句：led artists to see, with fresh eyes, **untried possibilities** for arranging and relating words and images。②目的=探索未尝试的表达可能性=A。", "annot": "对应：<span class='m3'>untried possibilities</span> → <span class='m4'>expand the range of possibilities</span>。", "辨析": "B 广告竞争、C 推广小杂志——无中生有（小杂志只是载体）。", "点拨": "目的题找“带感情色彩的动词短语”(in search of intellectual freedom / untried possibilities)——目的永远是动机层的词，不是载体层的词。"}}, {"type": "passage", "title": "实战八 · 北方文艺复兴印刷品（orthodox vs pioneer）", "source": "先自己做 · 不定项", "text": "In studies of the northern Renaissance print, an orthodox position can be said to have emerged. This position holds that the print was a passive representation of its time — a documentary record that reliably recorded the events, opinions, and beliefs of the period — and hence an important means of access to public contemporary consciousness. In contrast, pioneer studies, such as those by Anes and Amy, take a different approach: for them, the print was a purposeful, active, and important shaping force."}, {"type": "q", "tag": "真题 · 不定项", "title": "第1题 · 正统立场的支持者会同意什么", "source": "实战八", "pause": true, "multi": true, "stem": [{"t": "The passage implies that an adherent of the orthodox position would agree with which of the following statements about the northern Renaissance print?（选所有适用的选项）"}], "options": {"A": "It should be regarded as a passive representation of its time", "B": "It formed part of a campaign aimed at altering contemporary thinking", "C": "It provides reliable records of the events, opinions, and beliefs of the period"}, "answer": "AC", "explain": {"思路": "①定位 orthodox position:passive representation + 破折号解释（reliably recorded…)。②A 原词、C 破折号里的原词；B 是 pioneer 的观点（active shaping force)。", "annot": "立场对：orthodox=<span class='m3'>passive/reliable records</span> ↔ pioneer=<span class='m4'>active/shaping force</span>。B 属于对面。", "辨析": "本题 passive 取“客观的”（可靠记录）而非“消极”——语境义优先。破折号、i.e.、括号=考点高发区。", "点拨": "对立立场题先把两方标签贴好（o 由类=论点的 ground（地面在下面撑着）。例子类=for example/such as/including（including 表包含=上下级）。", "**黄金法则**:“作者提到 X 的目的是什么”——X 是论据，答案是它服务的论点。论点在**逻辑上一层**（水果 vs 苹果香蕉梨），不一定是挨着的前一句。托福里例子前一句常是论点（空间重合），GRE 必须看逻辑层级——Rosenblum 篇的干扰项全部来自“空间前一句”。", "小词块：**different than** 成立的原理——than 表“不相等”(more than 比较级/rather than 相反/different than 不同）;**course**=有始有终的整个过程（跑道/轨道/行文流程）。"]}, {"type": "passage", "title": "实战一 · 超新星与超高能宇宙射线（结论≠总论点）", "source": "先自己做 · 重点：C vs E 的“结论还是总论点”", "text": "Supernovas in the Milky Way are the likeliest sources of most cosmic rays reaching Earth. Calculations indicate, however, that supernovas cannot produce ultrahigh-energy cosmic rays (UHECRs), which are characterized by energies of 10^18 electron volts. It might seem sensible to look for the source of these rays in the universe’s most conspicuous energy factories, but such UHECRs would collide with photons of the cosmic microwave background — the primordial radiation that pervades the universe — at a rate of once every few million light-years, each collision sapping energy. Consequently, no cosmic ray can travel that far and still possess such energy."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 末句的功能", "source": "实战一", "pause": true, "stem": [{"t": "In the context of the passage, the final sentence serves to..."}], "options": {"A": "explain a criterion that was applied earlier in the argument", "B": "illustrate a position that is actually self-contradictory", "C": "draw a conclusion in the course of refuting a potential explanation", "D": "overturn an assumption on which an opposing position depends", "E": "state the argument’s main conclusion"}, "answer": "C", "explain": {"思路": "①末句 Consequently=结论，总结“冲撞损耗能量”这段论证。②但它是不是总论点？不是——总论点是 however 那句“计算表明超新星不是来源”，末句只是支持链的终点（分论点级的结论）。③C:a conclusion drawn in the course of refuting a potential explanation(course=行文流程；refuting 首句的“最可能来源”=潜在解释）。E 的 main conclusion 正是这个坑。", "annot": "层级图：<span class='m3'>首句潜在解释（超新星=来源）</span> → <span class='m4'>however 总论点（计算表明不是）</span> → 冲撞论证 → <span class='m4'>consequently 分结论</span>。", "辨析": "E 是最大坑：结论在文中≠总论点；D 的 overturn 对象是 however 句（方向一致而非反驳）;A criterion、B self-contradictory 均无对应。", "点拨": "见到 consequently/thus 句先问：它总结的是哪一段？它之上还有没有更大的论点？层级一画，C/E 立判。"}}, {"type": "passage", "title": "实战二 · 氧气去哪了（黑体字题）", "source": "先自己做 · 逻辑推理题型：两个黑体各是什么角色", "text": "During a certain period in Earth’s history, the atmosphere contained almost no oxygen even though plants were producing it in abundance. To reconcile these facts, scientists hypothesized that virtually all of the oxygen produced was taken up by iron on the planet’s surface. Clearly, however, this explanation is inadequate. New studies show that surface iron was not present in sufficient quantity to absorb all of the oxygen produced; other absorbers must therefore have been involved."}, {"type": "q", "tag": "真题 · 黑体字题", "title": "第1题 · 两个黑体的角色", "source": "实战二", "pause": true, "stem": [{"t": "In the argument above, the two boldface portions play which of the following roles?（黑体一：“this explanation is inadequate”；黑体二：“surface iron was not present in sufficient quantity to absorb all of the oxygen produced”）"}], "options": {"A": "The first is a claim made by the argument to support a certain position; the second is that position", "B": "The first is a judgment made by the argument about a certain explanation; the second is that explanation", "C": "The first states the argument’s dismissal of an objection to the position it seeks to establish; the second is that position", "D": "The first summarizes the argument’s position about a hypothesis; the second provides grounds for that position", "E": "The first is a concession made by the argument; the second presents that position in a modified form"}, "answer": "D", "explain": {"思路": "①黑体一（clearly however 后）=作者对“铁吸收假说”的判断（不充分）——这是**论点**。②黑体二（new studies 的结果）=**论据**，用研究数据支撑该判断。③D:first summarizes the position about a hypothesis; second provides grounds（理由根据，地面撑上面）for that position。", "annot": "角色表：<span class='m4'>黑体一=论点（judgment）</span> ← 支撑 — <span class='m3'>黑体二=论据（studies/grounds）</span>。", "辨析": "E 把黑体一当 concession（让步）——但 clearly however 后是作者真正论点，不是“怂的部分”;B 把黑体二当成了那个 explanation（铁假说）本身；A 说第一支持第二——方向反了，第二支持第一。", "点拨": "黑体字题两步：①分别判角色（论点/论据/让步/背景）;②判方向（谁支撑谁）。两个黑体一个论点一个论据时，方向一定是“论据撑论点”。"}}, {"type": "passage", "title": "实战三 · 文学个性的 relevance（三学派）", "source": "先自己做 · 重点：attitudes + a particular 抽象概括", "text": "The relevance of literary personality — an author’s unique attitudes, concerns, and artistic choices — to the analysis of literary works is being scrutinized by various schools of contemporary criticism. Deconstructionists view this personality as irrelevant to the work’s meaning. New historicists also devalue it, though for different reasons. To readers interested in the real lives of authors, however, say biographically oriented scholars, it provides important clues to interpretation. Each school, in its own way, examines how much such personality matters."}, {"type": "q", "tag": "真题 · 主旨题", "title": "第1题 · main focus", "source": "实战三", "pause": true, "stem": [{"t": "The passage is primarily concerned with..."}], "options": {"A": "discussing attitudes toward a particular focus for literary analysis", "B": "describing the limitations of two contemporary approaches to literary criticism", "C": "pointing out similarities among seemingly contrasting approaches to literary criticism", "D": "defending the resurgence of a particular focus for literary analysis", "E": "defining a series of related terms employed in literary criticism"}, "answer": "A", "explain": {"思路": "①结构：首句总论点（各学派对 literary personality 相关性的不同审视）→ 三拨人三种 attitudes(view/devalue/provides clues)。②答案要概括“不同态度+共同对象”:A=attitudes toward a particular focus(literary personality)。", "annot": "结构：<span class='m3'>总：各学派审视 personality 的相关性</span> → <span class='m4'>分：解构/新历史/传记派三种态度</span>。", "辨析": "B“局限”是负评价，作者只呈现没评价；C“相似性”偏了（重点是差异）;D resurgence（复兴）无中生有；E“定义术语”不是文章动作。", "点拨": "**a particular 是答案的抽象概括法**：文章讲苹果→答案说 a fruit。见到 a particular/a certain 别当空话——它是把文章具体内容抽象化的标准操作（高频出现于正确答案，但非绝对）。"}}, {"type": "passage", "title": "实战四 · 数字与手指的脑区（实验的目的）", "source": "先自己做 · 重点：proximity（距离近）vs association（功能联系）", "text": "In the 1920s, G. described a set of problems in people who had suffered damage to the left parietal lobe of the brain, including an inability to understand mathematics and difficulty in identifying their fingers. There is no agreement as to whether these symptoms constitute a syndrome. Parts of the brain used for storing facts about numbers and for representing the fingers are, however, close to each other, and mental representations of number and fingers may therefore be functionally connected. An experiment in 2005 tested this idea, finding that the two regions are activated together when people perform tasks involving both number and finger representations."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 2005 实验的目的", "source": "实战四", "pause": true, "stem": [{"t": "The author mentions the 2005 experiment and its results in order to..."}], "options": {"A": "establish the proximity between the part of the brain used for storing numerical information and that used for representing fingers", "B": "illustrate implications that G.’s work may have for experimental research", "C": "question the idea that damage to the left parietal lobe causes the set of problems G. described", "D": "support a hypothesis about a significant association between parts of the brain related to fingers and to numbers", "E": "show that the problems G. noticed have causes different than those of other problems"}, "answer": "D", "explain": {"思路": "①实验的目的=支持它前面的论点。②论点句：mental representations of number and fingers may therefore be **functionally connected**（功能上相连）。③D=support a hypothesis about a significant **association**（联系）。", "annot": "论点锚点：<span class='m3'>functionally connected</span> → 实验测的是“两脑区共同激活”= <span class='m4'>association（联系）</span>。", "辨析": "A 是强干扰：proximity（空间距离近）是旧信息（脑区近早说了），实验要证的是“功能联系”而非“距离近”——一词之差。C 方向反（实验是支持 G 不是质疑）;E 的 different than 搭的是无关比较。", "点拨": "实验题先回前句找它要证的词：文中是 functionally connected，选项里必须有 association 级别的对应词；只说到 proximity 的是拿旧信息冒充。"}}, {"type": "passage", "title": "实战五 · 西南农业区的环境（for example 挨着的就是论点）", "source": "先自己做 · 最简单的一题：举例关系直连", "text": "Researchers have found it impossible to provide a single generally applicable characterization of the environmental conditions for the region; rather, local areas experienced widely different types of rainfall, wind, and erosion, and they found that such conditions had prevailed in the Southwest for many millennia. Adjacent agricultural fields, for example, could receive markedly different amounts of water."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 这个事实是谁的论据", "source": "实战五", "pause": true, "stem": [{"t": "The fact that “adjacent agricultural fields could receive markedly different amounts of water” is provided as evidence of..."}], "options": {"A": "the unpredictability of the climate and environment of the Southwest", "B": "the difficulty of producing a consistent food supply in the region", "C": "the scarcity of water in the Southwest", "D": "the variability of local environmental conditions in the Southwest", "E": "the high frequency of environmental processes at work in the Southwest"}, "answer": "D", "explain": {"思路": "①信息前有明确的 for example——它连接的例子，直接挨着的前句就是论点。②前句：local areas experienced **widely different** types of conditions（当地环境差异极大）。③D=variability of local environmental conditions。", "annot": "直连：<span class='m2'>for example</span> → 前句 <span class='m4'>widely different conditions</span> → variability。", "辨析": "A unpredictability（不可预测）≠ variability（差异大）——偷换概念；B 食物供给、C 缺水、E 高频过程均无对应。", "点拨": "有 for example 显性连接词时，论点就是紧邻的前句——这是“空间前一句=逻辑上一层”少数成立的情况。识别连接词再决定找法。"}}, {"type": "passage", "title": "实战六 · 女性摄影史的学术怪状（逻辑上一层≠空间前句）", "source": "先自己做 · 本讲黄金法则的范本", "text": "The condition of scholarship devoted to the history of women in photography is confounding. Recently there has been a posthumous inflation of the role of Alice Austen, an amateur, into that of a pioneering documentarian, while dozens of notable senior figures have received scant attention. And Naomi Rosenblum’s book, though covering the subject in a generally useful fashion, gives short shrift to a long list of unfamiliar names."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 提 Rosenblum 的书的目的", "source": "实战六", "pause": true, "stem": [{"t": "The author mentions Rosenblum’s book primarily in order to..."}], "options": {"A": "suggest that the works documented most thoroughly by historians of women in photography often do not warrant that attention", "B": "provide an explanation for the observation that not all aspects of the history of women in photography have received the same amount of attention", "C": "provide an example of the unsatisfactory way in which scholarship on the history of women in photography has proceeded", "D": "demonstrate the application of a strict chronological method", "E": "support the notion that certain personalities in women’s photography have attained undue prominence"}, "answer": "C", "explain": {"思路": "①三句结构：S1 总论点（学术状况令人困惑）→ S2 和 S3 并列，都是 S1 的论据（业余者被捧/资深者被忽视；Rosenblum 的书也是同样毛病）。②and 连接 S2/S3=并列关系，说明两者同级、都服务于 S1。③提 Rosenblum 书的目的=给 S1 再举一个例子=C。", "annot": "层级：<span class='m4'>S1 总论点（confounding）</span> ← <span class='m3'>S2 并列论据 · S3 并列论据（and）</span>。问 S3 的目的→找 S1，不是找 S2！", "辨析": "A/B 都是 S2 层的信息（空间前一句的陷阱！);D 的 chronological 来自例子里的 1920——掉进例子里；E personalities 无对应。unsatisfactory 替换 confounding 可接受。", "点拨": "**不是空间上前一句，而是逻辑上往上一层**。出题人把正确答案设在 S1，干扰项全埋在 S2——这就是 GRE 与托福的本质区别。"}}, {"type": "passage", "title": "实战七 · 东伦敦剧院与杂志的影响力（例子本身不是答案）", "source": "先自己做 · 重点：B 是例子内容本身", "text": "Although British magazines had shaped public opinion before the nineteenth century, it was in the 1800s that mass communication became possible under an explosion in periodical readership, increasing magazines’ opinion-shaping powers. The role of magazines as arbiters of nineteenth-century taste is evident in their depiction of the London theatre. The magazines accorded some legitimacy to East End working-class theaters that mirrored the format of the fashionable West End theatres serving middle- and upper-class audiences."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 东伦敦剧院的目的", "source": "实战七", "pause": true, "stem": [{"t": "The author mentions East End working-class theaters primarily in order to..."}], "options": {"A": "illustrate a point about the ability of magazines to sway public opinion", "B": "contrast the East End theaters with the West End theaters", "C": "make a point about how the tastes of spectators influenced the offerings at different kinds of theaters", "D": "explain how magazines selected entertainment to cover", "E": "give reasons why certain theaters became fashionable"}, "answer": "A", "explain": {"思路": "①结构：论点（杂志能塑造舆论）→ arbiter 角色 → 东伦敦剧院为例（给工人剧院背书=杂志影响力）。②例子的目的=支持论点=A(sway public opinion=shape 同义）。", "annot": "链条：<span class='m4'>论点：杂志 sway public opinion</span> → <span class='m3'>例子：East End 剧院获 legitimacy</span>。", "辨析": "B 对比东西剧院——这是例子**内容本身**，问目的不选内容；C 观众口味、D 选报道内容、E 剧院流行原因全偏离论点。", "点拨": "“提到 X 的目的”题的第一排除法：复述 X 内容的选项一律不选（它是论据不是论点）。"}}, {"type": "passage", "title": "实战八 · 给海洋加铁（假说被田野测试推翻）", "source": "先自己做 · 重点：argue 可以=认为；假说的完整链条", "text": "Certain marine organisms called phytoplankton absorb dissolved carbon dioxide when they photosynthesize, potentially causing a reduction in atmospheric carbon dioxide, the gas that contributes to global warming. But phytoplankton flourish only where iron is abundant. Martin therefore hypothesized that adding iron to iron-poor regions of the ocean would help mitigate global warming. While experiments confirmed increased phytoplankton growth, field tests indicated that such growth did not reduce the overall amount of atmospheric carbon dioxide. When the plankton are eaten by predators, the carbon they absorbed is returned to the atmosphere."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · predators 的目的", "source": "实战八", "pause": true, "stem": [{"t": "The author mentions predators primarily in order to..."}], "options": {"A": "help explain why Martin’s hypothesis is incorrect", "B": "give an effect of adding iron to iron-poor waters", "C": "show how carbon dioxide is converted into solid organic matter", "D": "account for differences in the density of phytoplankton in different regions", "E": "point out a reason that was not anticipated by the scientists who conducted the field tests"}, "answer": "A", "explain": {"思路": "①假说链：加铁→浮游植物繁殖→吸 CO2→缓解变暖。②反转：实验证实增长，田野测试表明 CO2 没降。③predators 句解释原因：被吃掉后碳又呼回大气——直接瓦解假说链条。④目的=解释假说为何不对=A。", "annot": "反转结构：<span class='m3'>Martin 假说链</span> → <span class='m2'>While 转折</span> → <span class='m4'>predators 解释假说错在哪</span>。", "辨析": "B 是例子内容本身；C/E 细节偏移；E 的“没预料到”不是重点——重点是“假说被证明不成立”。", "点拨": "科学类文章的固定剧本：假说→验证→反转→解释原因。功能题的答案永远在“剧本节点”上（这里是“解释反转”），不在细节里。"}}, {"type": "ext", "title": "逻辑系列总复盘 + 预告", "ppt": ["方向（同/反）+ 结构（相似/主次）= 逻辑地图完讲"], "text": ["**逻辑地图收官**:①方向：同向/反向（对比对立+让步转折）;②结构：相似（并列/重述/顺承）/主次（总论分论/论点论据）。第2讲至今的所有文章都能装进这张图。", "**三大位移提醒**:①例子找论点=逻辑上层非空间前句（Rosenblum);②结论≠总论点（超新星）;③距离近≠功能相连（脑区）。", "**下讲预告**:《句意理解1》——离开逻辑，进入表意：词义怎么在语境中确定（suspect vs doubt 那种）、长难句的动词形式表意（would vs received)。"]}], "transcript": "这里是GRE阅读理解当中的第八节课，在这一节课当中，我们将继续去分析逻辑关系。在上一节课当中，我们所讲到的是结构当中的相似性的逻辑。那么，在这一节课当中，我们将会去探讨一下主次性的逻辑关系。对于主次性的逻辑关系来讲的话，就是在文章信息出现了层级性的时候，我们会探讨这个逻辑有上下级。这种感觉呢，非常像是一个成型的组织机构或者是单位，它的特点，比如说一个公司，它有上层的领导，中层领导，下层的员工等。这样就分出了层次，对于这一篇文章来讲的话，它也会有这样的情况，就是一个类似于梯度或等级的感觉。那么，我们要去判断一下，在其中有哪些信息之间能构成这种主次性的关系？那么，在这里，我可以把它分成几个角度，比如说。总论点和分论点，虽然两者都是论点，但其中总的就要比分的要更加的高一点，在等级上。接下来的话呢，是论点作为一个整体来讲，因为甭管是总论点也好，还是分论点也好，它们都是论点。那么，论点相对来讲，就要比支持它的论据地位要高一点。那么，在这里也有一个逻辑性，就是论据其实是用来支持论点的。那么，分论点当然也可以是总论点展开的一些具体的维度，所以它们之间有一种上下级的这样的关系。我们透过对于这样的逻辑性的一个详细的阐述来理解一下文章中信息之间的这种层级性。首先来说一下总论点和分论点的这个关系，当然在这里我们也给出了相应的英文单词，比如在这里论点，我用argument这个单词来表示的话，那么总论点可以用到这个词来修饰叫做main。表示主要的整体的，那么后面这个词呢？intermediate可以相当于分数的。这个词本身的构成inter表示中间，然后med也表中间，那么有人说两个中间相当于是把这个中间的观点。插 attis 文里“立体主义作为传统规范的 inversion 来研究”这句很绕，但只要抓住类比逻辑（毕加索/Braque 与 Mattis 对比=前者好分析），难句的大意就锁定了解题所需的方向。", "类比（analogy)=拿平行的 B 来印证 A——重点是 A，别忘了谁是主角。"]}, {"type": "teach", "title": "② 熟词：一词多义 = 本意 + 语境演化", "ppt": ["free = no：自由=无束缚 / 免费=无收费 / 空闲=无事", "novel = 新的（nov = new；w = double u）", "qualify = 使有资格 / 限制（画圈）", "license = 驾照 / 许可 / 自由"], "text": ["一词多义的本质：一个**本意**经不同语境演化出多个意思（排除同源异形词）。记单词时思考各义项之间的关联，比孤立背有效。", "**free** 的本意=no：自由（无束缚）、免费（无收费）、空闲（无事）;**novel** 形容词=新的（词根 nov=new,w 就是 double u——英法文字母演化的彩蛋）;**qualify** 两义同源（画圈限制→圈里的人有资格）;**license** 驾照的本质=许可→自由。"]}, {"type": "teach", "title": "③ 生词三处理法", "ppt": ["①构词猜：mis-=错（misnomer) / pseudo-=假 / -ist=人 / -less=无", "介词副词的方向性：turn over=overturn；st~ into=成为", "②语境猜：句意整体影响单词意思（Are you free? 约会语境=有空）", "③字母组合化：术语/人名/地名，能对上就行"], "text": ["像读中文生词一样读英文：不认识“饕餮”也能从“饕”猜到和吃有关。英文同理：misnomer 不认识，mis-=错就够（nation-state 是个误称）;pseudo-=假（pseudonym 假名）;-ist=某类人（ist 结尾=专家/学者）;-less=没有。", "**介词副词自带方向**:turnover=overturn（颠覆）;**into=进入/成为**——a st~ into b 不认识 st~ 也知道是“a 成为 b”。", "语境猜的回路：把每个词的**核心大意**拼成整句→整句意思再回头确定多义词取哪个义项（Are you free?的 free 是哪个意思，由语境定）。", "终极方案：**字母组合化**——人名地名术语，知道“这个字母串再次出现=同一个东西”即可，不影响阅读。读中文你也不是每个字都查字典。"]}, {"type": "teach", "title": "④ 语法 = 表意逻辑（词法+句法+动词的语义）", "ppt": ["词法 lexis（词的表意）+ 句法 syntax（syn+tax：词与词的联系）", "句子三分：主干（subject 主 + predicate 谓）/ 修饰 / 逻辑", "动词三维度：时间（tense+aspect)/ 语气（mood)/ 语态", "God bless you = (May) God bless you：祝愿≠事实"], "text": ["语法不是死规则，是表意的逻辑：词法=词自身的表意性质，句法=syntax(syn 一起+tax 接触）=词与词的关系。", "句子三分：**主干**（主语 subject=主要的对象；谓语 predicate,predic=dic=说它）+**修饰**+**逻辑**（两套主干之间的关系、两个形容词的并列……)。", "动词的语法形式=语义：时间（做过/正在/将要做）;**语气**(God bless you 省了 May=主观祝愿；God blesses you=客观事实，差一个 s 差一个世界）;语态（主动/被动）。"]}, {"type": "teach", "title": "⑤ 本讲最值钱：to do ≠ did", "ppt": ["to do = 目的/未做；did = 实际发生", "题目问“实际没有做什么”时，目标句不能当选"], "text": ["英语 to do 表目的/尚未做，did 表实际发生。**目的是 X ≠ 实际（没）做到 X。** 忏悔诗题的关键：诗人的 goal 不是治愈自己，但题目问“实际上没有经历 relief”——goal 与事实之间没有必然关系，B 不能选。", "见到题目里的 actually/did not，立刻回原文核对动词的**形式**（to do 还是 did)——这是 GRE 细节题的暗桩。"]}, {"type": "passage", "title": "实战一 · Mattis 的画为何难分析", "source": "先自己做：2 题 · 重点：类比对象+对象错位陷阱", "text": "The art of Mattis, with its particular immediacy and its mysterious depths, presents a confounding problem for analysis. When H. wrote of the Piano Lesson that the picture could not be confined to any single source or meaning, he was characterizing Mattis’ work as a whole. Picasso’s subject matter is far more susceptible to conventional iconographic analysis than anything in Mattis. Similarly, the cubism of Picasso and Braque, though it rejected traditional viewpoints, can be studied as an inversion of traditional norms, using the very tools devised to study those norms. The solutions Mattis arrives at, by contrast, tend to be idiosyncratic — unrelated to any system of ideas."}, {"type": "q", "tag": "真题 · 推断题", "title": "第1题 · Braque 立体主义", "source": "实战一", "pause": true, "stem": [{"t": "The passage implies which of the following about the cubism of Braque?"}], "options": {"A": "It lends itself more readily to systematic analysis than does Mattis’s work", "B": "It is more radical in form than most of Mattis’s paintings", "C": "It was influenced by the work of Mattis", "D": "It cannot be confined to any single source or meaning", "E": "It is overly dependent on traditional signs and symbols"}, "answer": "A", "explain": {"思路": "①类比结构：毕加索/Braque 与 Mattis 对比——前者好分析（can be studied using the very tools),Mattis 难分析（idiosyncratic,unrelated to any system)。②A=好分析的同义改写。", "annot": "对比轴：<span class='m3'>毕加索/Braque=可研究（工具现成）</span> ↔ <span class='m4'>Mattis=特立独行无体系</span>。", "辨析": "D 是 Mattis 的特点（对象错位陷阱——文中出现过的说法不等于能安在 Braque 头上）;B radical 无比较依据；C 影响关系无中生有。", "点拨": "选项里出现的说法要回文核对“说的是谁”——张冠李 object 是 GRE 最爱。"}}, {"type": "q", "tag": "真题 · 不定项", "title": "第2题 · 难分析的原因", "source": "实战一", "pause": true, "multi": true, "stem": [{"t": "The passage identifies which of the following as a reason why Mattis’s work confounds analysis?（选所有适用的选项）"}], "options": {"A": "Conventional methods of analysis do not suit his art", "B": "His work is free from systematic influence", "C": "The norms rejected by Picasso and Braque were not the ones Mattis rejected"}, "answer": "AB", "explain": {"思路": "①confound 的原因=不好分析。②A:traditional/conventional 工具不适合（unrelated to any system 的同义）。③B:free from systematic influence——free 的本意=no（不受体系影响）,✓。④C:两人反对的标准是否相同，文章没比。", "annot": "原因链：<span class='m3'>idiosyncratic/unrelated to any system</span> → A（工具不合）+ B（不受体系影响）——AB 是同一事实的两个侧面。", "辨析": "C 是拿 Picasso/Braque 的标准凑数——文章只比“好不好分析”，没比“反对了哪些标准”。", "点拨": "free from = 不受/没有（free 的本意 no)——熟词僻义的语境判定。"}}, {"type": "passage", "title": "实战二 · 小行星的热源（porous vs dense）", "source": "先自己做：2 题 · 重点：作者站队+分歧点辨析", "text": "The finding that rock-melting temperatures persisted for sustained periods on asteroids is puzzling: heat sources for asteroids are unknown, and, unlike other bodies this small, they do not quickly dissipate heat. Rubin suggests that an asteroid’s heat could have derived from collisions between asteroids. Skeptics, however, argue that a single impact would raise an asteroid’s overall temperature very little, and that asteroids would cool too quickly between impacts to accumulate much heat. These objections assume that asteroids are dense, solid bodies; recent findings that asteroids are highly porous, however, make Rubin’s hypothesis more plausible. Impacts on porous bodies generate less debris, so energy goes into producing heat, and the resulting craters create an insulating blanket that retains it."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · 什么因素让温度难以解释", "source": "实战二", "pause": true, "stem": [{"t": "The passage implies that one factor that made it difficult to account for the temperatures once reached by asteroids was..."}], "options": {"A": "a miscalculation of the frequency of impacts", "B": "a mistaken view concerning the density of asteroids", "C": "a false assumption about the source of the asteroid’s heat", "D": "an underestimate of the speed with which small bodies lose heat", "E": "an erroneous view of how asteroids were formed"}, "answer": "B", "explain": {"思路": "①作者站队 Rubin：怀疑论者的反驳建立在“小行星是 dense 实心体”的假设上；最近发现 highly porous（多孔的）→Rubin 假说更可信。②所以让温度长期难解释的因素=对 density 的错误观点。", "annot": "作者分析：<span class='m3'>skeptics 错在假设 dense solid</span> → 实际 <span class='m4'>porous（pore 孔，dense 的反义）</span> → 疑点冰释。", "辨析": "C 陷阱：热源是什么是研究的“表象问题”,factor 是背后对密度的看法；A 冲撞频率、D 散热速度都是 skeptics 论据的内容而非深层因素；E 形成方式无中生有。", "点拨": "问 factor/reason 时要找“背后的认知错误”而不是“争论的表面内容”——作者站队句（make X more plausible）就是答案区。"}}, {"type": "q", "tag": "真题 · 不定项", "title": "第2题 · Rubin 与怀疑者的分歧", "source": "实战二", "pause": true, "multi": true, "stem": [{"t": "It can be inferred from the passage that Rubin disagrees with the skeptics mentioned in the passage about which of the following?（选所有适用的选项）"}], "options": {"A": "whether porous bodies produce less debris when struck than do solid bodies", "B": "how high the temperatures reached by asteroids can be", "C": "the possible effects of impacts on an asteroid’s temperature"}, "answer": "C", "explain": {"思路": "①分歧点=Rubin 认为冲撞能供热（热来自冲撞）,skeptics 认为冲撞升温太少+冷却太快——分歧在“冲撞对温度的可能影响”。②A 的碎片多少是**作者的分析**（porous 产生碎片少）,不是 Rubin 与 skeptics 的分歧点；B 达到多高温度无人争论。", "annot": "分歧轴：<span class='m3'>Rubin：冲撞→供热</span> ↔ <span class='m4'>skeptics：冲撞升温少+冷却快</span> → 共同话题=<span class='m4'>冲撞对温度的影响</span>。", "辨析": "A 极易误选：碎片多少是“作者引入 porous 之后的技术细节”，双方并未就此争论——分工不清就会掉坑。", "点拨": "问“两人的分歧点”时，先写双方各自的主张句，再找**共同的讨论对象**；作者引入的第三方证据≠分歧本身。"}}, {"type": "passage", "title": "实战三 · 十八世纪英国贵族女性的政治作用", "source": "先自己做 · 重点：三词同义靠上下文对应", "text": "Eighteenth-century women played a significant role in British political life up and down the social scale: they performed a variety of political acts, from purchasing political artifacts to starring in civic processions, sponsoring candidates, and organizing petitions. Although historians once treated women’s political participation in this era as isolated or aberrant, they now stress the continuity and formality of such activity, especially for aristocratic women. Given the familiar nature of aristocratic politics, noblewomen — women of the patrician class — were expected to act as political advisers and agents for their husbands, canvassing in elections and acting as political hostesses. Patrician women wielded such far-reaching political influence that they stood to lose by an expansion of the electorate to include women. But fruitful as this new historiography has been, it has also been criticized for its focus on high politics and its inattention to ideology."}, {"type": "q", "tag": "真题 · 推断题", "title": "第1题 · 关于选民扩张的说法", "source": "实战三", "pause": true, "stem": [{"t": "The author implies which of the following about the expansion of the electorate to include women?"}], "options": {"A": "It would probably have reduced women’s incentives to participate in political acts", "B": "It would probably have reduced the political power of some people who had exerted great influence", "C": "It was unlikely to overturn aristocratic control of the country", "D": "It would likely have extended the vote only to a small number of women", "E": "It was not an issue addressed by men engaged in politics"}, "answer": "B", "explain": {"思路": "①定位：patrician women 影响深远，**stood to lose** by the expansion（会在选民扩张中吃亏）。②lose 什么？她们的政治影响力。③B=削弱某些施加了巨大影响的人的权力。", "annot": "对应：<span class='m3'>patrician women（=noble/aristocratic 三词同义）</span> 影响深远 → <span class='m4'>stood to lose</span> → 权力被稀释。", "辨析": "A 方向反（扩张提升女性参政激励而非减少）;C“颠覆贵族统治”过度延伸；D 只给少数女性无据；E 与男性无关无中生有。", "点拨": "patrician/noblewomen/aristocratic 三个词靠上下文对应锁定同义——这正是“语境猜词”的实战：后文同位语互相解释。"}}, {"type": "passage", "title": "实战四 · “忏悔诗”名不副实（to do ≠ did）", "source": "先自己做：2 题 · 本讲核心考点：目的≠实际", "text": "Because the subject matter was so personal, the work of several prominent mid-twentieth-century poets has been termed “confessional poetry” — a poor metaphor for what these poets did. The aim of confession, to speak openly about personal guilt and suffering in order to make it easier to bear, is not the motive of these poets, who approached their writing as artists: their goal was to make effective art, not to cure themselves. Writing out of madness and loss, their aim was to make effective art, not to heal themselves — to treat their poems mainly as documents of personal experience is to diminish their achievement and to display a distaste for the very idea of art."}, {"type": "q", "tag": "真题 · 不定项", "title": "第1题 · confessional 这个标签", "source": "实战四", "pause": true, "multi": true, "stem": [{"t": "The author of the passage implies that applying the term “confessional” to the work of the poets discussed would be which of the following?（选所有适用的选项）"}], "options": {"A": "a mistake", "B": "something that might seem superficially appropriate, given the subject matter of the poems", "C": "an error that results from the absence of any other convenient term"}, "answer": "AB", "explain": {"思路": "①作者态度：a poor metaphor（名不副实）→ A mistake✓。②但首句给了理由：subject matter was so personal——主题个人化使标签**表面上**合适→B✓。③C“因为没有别的术语”无中生有。", "annot": "双层判断：<span class='m3'>表面合适（subject matter personal）</span> + <span class='m4'>实质错误（motive 是艺术不是忏悔）</span>。", "辨析": "只选 A 会漏 B——“表面合理+实质错误”是让步式评价，两个都成立。", "点拨": "评价标签/称呼的题常考“表面 vs 实质”双层：给过理由的表面合理性，也算正确答案。"}}, {"type": "q", "tag": "真题 · 不定项", "title": "第2题 · 诗人实际上没有做什么", "source": "实战四", "pause": true, "multi": true, "stem": [{"t": "The passage suggests that the poets did NOT...（选所有适用的选项）"}], "options": {"A": "regard a poet’s motivation for writing as relevant in evaluating that poet’s work", "B": "experience any relief from their personal suffering as a result of writing", "C": "apply to their own work the label by which it has subsequently been known"}, "answer": "C", "explain": {"思路": "①题干 **did NOT**=实际没做（不是“目的不是”)。②原文：goal was to make effective art, **not to cure themselves**——to cure 是目的/未做的事；目的不是治愈≠实际没经历 relief(B 不可选！)。③C：他们没把 confessional 标签用在自己作品上（是后人贴的标签）,✓。", "annot": "核心辨析：<span class='m3'>to do = 目的（不是治愈自己）</span> ≠ <span class='m4'>did = 实际发生</span>。题目问 did not，只能选有实际证据的 C。", "辨析": "B 是本题灵魂陷阱：诗人“目的不是治愈”推不出“实际没有获得 relief”——写完之后客观上是否得到纾解，文章没说。A 动机与评价的关系文章未否认。", "点拨": "见到 actually/did not/not at all，立刻回原文核对动词形式（to do vs did)。这是本讲第五条卡的实战——GRE 细节题的暗桩专埋在这里。"}}, {"type": "ext", "title": "本讲复盘 + 预告", "ppt": ["语境·词汇·语法 = 句意的三个支柱"], "text": ["**三支柱**:①语境（文章整体决定句意，逆向理解）;②词汇（熟词义项关联记忆；生词构词猜/语境猜/字母组合）;③语法=表意逻辑（动词的时间/语气/语态；**to do≠did**)。", "**下讲预告**:《句意理解2》——更多长难句的拆解实战，之后进入题目分析板块（第12-20讲题型课）。", "**自测**:free from 什么意思？God bless you 为什么 bless 不加 es?to cure themselves 为什么不能回答 did NOT experience relief？三个都说得出，本讲就过关了。"]}], "transcript": "这里是GRE阅读理解当中的第九节课。在这节课当中呢，我们将跟各位分享一下怎么样去理解句子的意思。在前面的课程里，我们谈到读懂文章是很重要的一件事情，如果想理解文章的话呢，里面有两个参数，分别是逻辑和句意。逻辑呢，在前面的课程当中，我们已经做过整体的介绍和说明了，那么这一节课我们重点把它放在理解句子意思的部分。理解句子意思的话呢，首先要谈到的就是句子本身，作为一个文章信息的基本单位，它的一个存在。句子的更低级的语义单位应该是词，所以说呢，在这个课程内容当中，我们也会探讨一下在阅读里词汇的理解的方式。想理解句子的意思，主要是从两个角度，一个是句子所在的语境，通过语境或者是上下文来帮助理解句子意思。同时呢，句子本身的结构也很重要，所以我们靠句子的本身或者是上下文或者是两者的结合来理解一句话的意思。首先来看一个这样的例子，这一个小的例子的片段呢，来自于一个电影叫做LA LA land，就是爱乐之城。在其中呢，当两个主人公分别是塞巴斯蒂安就是男主和女主密尔。在经过了一段时间的工作和这个沉浮之后，两个人有一天见面了。其中呢，mia问到where are we？我们在哪？这个问法形式其实如果看到电影当中的情节发展到这之后，我们应该有一种感觉就是女孩，其实问男孩就是我们现在到了什么地步了，这个问法。但是用英文问出来之后，就是我们在哪，所以其实如果你看这句话，它其实可以有不同的理解，你可以字面的理解成我们现在所处的空间位置，也可以理解成我们现在所处的关系的阶段。所以这个时候男主说了一个地方叫griffith park，griffith park就是他们所在的格里菲斯公园，他其实取了这个表面的意思，然后这个时候mia又问了一句where are we？其实这个时候男主就说I know I know我知道你的意思是什么，你想问的是我们两个关系到哪了，对吗？然后这时候男主说了一句话。i don&apos;t know，其实我不知道我们两个的关系在哪，所以可以看到同样的一个问句，由于在不同的语境当中。会产生不一样的意思，当然这个句子表面也很重要，你起码得认识这三个词所表示的含义，所以回到上一页当中就会发现像。想理解一句话，靠其本身结构当中信息的关系以及所处的语境来理解其意思是非常关键的。那我们就再欣赏一下这个小的片段，当然是图片喽，好，如果有兴趣可以自行看一下这部电影。然后在这里，首先我们来看一下关于语境，对于句子所产生的影响。句意一定会受到其语境的影响，所以很多时候我们理解一个信息是要放在一个环境下去考量的。那么，在这里的话呢？我们通过第一篇文章的例子给大家去探讨一下，你可以暂停一下屏幕，读一下文章，然后去做一下后面相关系的题。我们把文章进行一下分析，文章上来之后说到的是marty s的艺术，伴随着他particular immediate和他的mysterious depths。呈现了一个confounding problems for analysis对于分析来讲，有一个令人困惑的问题，我们前面也见过confounding这样的词汇，类似于confusing。让人很困惑。他的艺术分析起来很让人困惑，当然中间给了大家特点什么呢？你看immediacy，immediacy提示的是他的作品呢？很直白。很直白，一看就能看懂，但 and in highland regions, some of which have apparently been exposed by erosion only recently."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · 靠什么观察到的", "source": "实战一", "pause": true, "stem": [{"t": "According to the passage, scientists have been able to detect weathered material on the Martian surface because they have benefited from which of the following?"}], "options": {"A": "a new method for analyzing volcanic craters", "B": "an improved ability to detect hydrated material", "C": "a more sophisticated understanding of chemical weathering", "D": "a determination to look for clays in highland regions", "E": "a better understanding of Martian erosion"}, "answer": "B", "explain": {"思路": "①定位第二段转折后:new high-resolution mapping data and close-up surface studies→revealed hydrated minerals。②问“受益于什么”=新手段=improved ability to detect hydrated material。", "annot": "对应：<span class='m3'>high-resolution mapping + close-up studies</span> → <span class='m4'>improved ability to detect</span>。", "辨析": "A 火山口分析、C 理解、D 决心、E 侵蚀理解——都不是“手段/能力”，只有 B 概括了新技术。", "点拨": "“because they benefited from”问的是工具手段，答案形式必是“能力/方法”而非“理解/决心”。weather 在此=风化（动词），unweathered=未风化的。"}}, {"type": "q", "tag": "真题 · 推断题", "title": "第2题 · 对高亮推理的评价", "source": "实战一", "pause": true, "stem": [{"t": "The author would most likely agree with which of the following statements about the reasoning in the highlighted sentence?（高亮句：虚拟句 If water had flowed… it should have altered…）"}], "options": {"A": "It provides a basis for an explanation of why water was so difficult to detect on Mars until recently", "B": "It correctly identifies a result that would be produced by water flowing on the Martian surface", "C": "It is based on a false assumption about how water and volcanic material interact"}, "answer": "B", "explain": {"思路": "①高亮句=研究人员的推理：若水流动→应产生水合矿物（逻辑本身成立）。②作者第二段证实：确实有这些矿物（只是他们没仔细看）→作者认可这个推理的结论。③B=正确识别了水流会产生的结果。", "annot": "作者立场：<span class='m3'>推理链本身对</span>（水→水合矿物）;错的只是<span class='m4'>“没仔细看”</span>。", "辨析": "A 的 until recently 是作者层面的信息，不是研究人员推理的 basis;C false assumption 过头——作者证实了推理的结果。", "点拨": "问“作者对某推理的看法”，先看推理链是否被后文验证——被验证=认可推理本身，问题只在前提证据不足。"}}, {"type": "passage", "title": "实战二 · 黑人报纸的两难", "source": "先自己做 · 重点：might have resulted 的虚拟解读", "text": "Black newspapers in the 1930s faced a dilemma. Advertisers of consumer products often ignored Black publications; this discrimination, however, freed Black media from advertiser domination — editors could print politically charged material more readily than could large national dailies, which had to secure revenues by courting advertisers. Unfortunately, it also made the selling price of Black papers much higher than that of general-circulation dailies, often as much as two-thirds of whose costs had to come from subscribers or subsidies from community politicians and other interested groups. Despite this freedom, Black publications usually felt compelled to print a disproportionate amount of sensationalism, sports, and society news to boost circulation."}, {"type": "q", "tag": "真题 · 推断题", "title": "第1题 · 如果广告商买了广告", "source": "实战二", "pause": true, "stem": [{"t": "The passage implies that if advertisers had purchased advertising in Black newspapers more frequently, which of the following might have resulted?"}], "options": {"A": "Black newspapers would have given more attention to sports and society news", "B": "Black newspapers would have become available at lower prices than general-circulation dailies", "C": "Black newspapers would have experienced constraints on their content similar to those experienced by large national dailies", "D": "Black newspapers would have become more dependent on subscribers for revenue", "E": "Black newspapers would have been freed from the need to boost circulation"}, "answer": "C", "explain": {"思路": "①原文因果：广告商不买→黑人报纸 free from advertiser domination（内容自由）。②虚拟取反：若买→失去自由=内容受限，且原文明说大报受制于广告商（which had to secure revenues by courting advertisers)→C 直接对应。", "annot": "对应链：<span class='m3'>不买→free</span> → 取反 → <span class='m4'>买→constraints（同大报）</span>。", "辨析": "B 是最大坑：much higher 的反面有很多种（略低/持平/低很多），“might have resulted”问的是这个条件的**必然推论**不是“可能性之一”;A/E 与原文方向相反（自由减少会更依赖政论？不是）;D 依赖订阅者也会减少而非增加。", "点拨": "虚拟条件题=原文因果链取反。选项必须是**直接对应的那个推论**；只沾边的“可能之一”是干扰。你刚才那题如果被坑，就是栽在 might 的误读上——记住这一题。"}}, {"type": "teach", "title": "② 修饰语六种 + 限定 vs 非限定", "ppt": ["六种修饰语：形容词/限定词 · 副词 · 介词短语 · 从句 · 非谓语 · 同位语", "限定 vs 非限定=一个逗号之差", "He has three sons who go to college（≥3个）vs …three sons, who go to college（=3个）"], "text": ["修饰语六种：①形容词/限定词（this red book——this 在此是限定而非指代）;②副词；③介词短语（in the rain 可形可副）;④连接词+从句（定语从句=形容词性，状语从句=副词性）;⑤非谓语（sleeping beauty);⑥同位语（名词解释名词）。", "**限定 vs 非限定（逗号之差）**:“He has three sons who go to college”=他有三个上大学的儿子（总数≥3);“He has three sons**,** who go to college”=他有三个儿子，（补充）他们上大学（总数=3)。有逗号=补充信息，对主干动作没有限定作用。", "地图学 Q2 的命脉：marveling at their beauty 是逗号后的**非限定补充**——取反时只取主干“极大关注 1800 前的地图”，别把补充信息也取反了。"]}, {"type": "passage", "title": "实战三 · 地图学的美与技术之争", "source": "先自己做：2 题 · 重点：until 取反 + 非限定修饰语", "text": "A divide between aesthetic and technical considerations plays an important role in cartographic scholarship. Nineteenth-century cartographers include those who understood themselves as technicians unconcerned with visual effects, and others who saw themselves as landscape painters. That dichotomy has structured the history of the discipline: until the 1980s, scholars focused largely on maps made before 1800, marveling at their beauty and lamenting the decline of a pretechnical age; early mapmaking was treated as art, and contemporary mapmaking as engineering utility. Alpers, however, argues that this boundary would have puzzled seventeenth-century map makers, who understood themselves as visual engineers."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · Alpers 对 paradigm 假设的看法", "source": "实战三", "pause": true, "stem": [{"t": "According to the passage, Alpers would say that the assumptions underlying the paradigm were..."}], "options": {"A": "inconsistent with the way pre-1800 mapmakers understood their own work", "B": "dependent on a seventeenth-century conception of mapmaking as visual engineering", "C": "insensitive to the difference between aesthetic and technical questions", "D": "unduly influenced by contemporary attitudes toward engineering", "E": "supported by the demonstrable technical superiority of mapmaking made after 1800"}, "answer": "A", "explain": {"思路": "①审题：问 Alpers 认为 paradigm（旧范式：老地图=美）的假设怎么样。②Alpers 的立场（however):17 世纪制图者自称 visual engineers=美+技术融合。③旧范式认为他们只是美的→与他们自我理解不一致=A。", "annot": "对立图：<span class='m3'>paradigm：老地图=美</span> ↔ <span class='m4'>Alpers：visual engineer（美+技术融合）</span> → inconsistent。", "辨析": "B 张冠李戴：visual engineering 是 Alpers 的观点不是 paradigm 的基础；C“不关注美技之分”错——全文都在关注，只是偏向不同；E“1800 后技术优越”无据。细节：17 世纪=1600s，当然在 1800 前，不矛盾。", "点拨": "审题先锁定“谁的观点”：题干主语是 Alpers，就把 Alpers 的话与 paradigm 对表——不一致即答案。"}}, {"type": "q", "tag": "真题 · 推断题", "title": "第2题 · 从 1980s 开始", "source": "实战三", "pause": true, "stem": [{"t": "It can be inferred from the passage that beginning in the 1980s, historians of cartography..."}], "options": {"A": "placed great emphasis on the beauty of maps made after 1800", "B": "broadened their studies to include more material from after 1800", "C": "became more sensitive to the way mapmakers before 1800 understood their work", "D": "came to see the visual details of maps as aesthetically significant", "E": "devoted more attention to the technical aspects of mapmaking"}, "answer": "B", "explain": {"思路": "①原文：until the 1980s, scholars focused largely on maps made **before** 1800（直到 80 年代一直如此）。②题目问 beginning in the 1980s（从这开始）=把 until 句**取反**：不再只关注 1800 前的→B（范围扩大到 1800 后）。③逗号后的 marveling at their beauty 是非限定补充，与取反无关。", "annot": "取反公式：<span class='m2'>until 1980s 做 X</span> → <span class='m4'>beginning in 1980s 不做 X</span>（=扩大到 1800 后）。", "辨析": "A/D 的 beauty 来自逗号后的补充信息——非限定修饰语不进主干；C/E 与 until 句无取反关系。", "点拨": "until 与 beginning in 是天然的取反搭档；取反只取主干动作，逗号尾巴（非限定）留在原地。"}}, {"type": "teach", "title": "③ 修饰语的位置与句内逻辑", "ppt": ["后置修饰：中英文顺序相反；主谓之间/动宾之间可插修饰", "位置决定修饰对象：I saw in the room a girl（≠a girl who dances in the room）", "and 并列的精准归属：established vocabulary=既定的词汇（要抛弃的）", "less…than 比较；only if 嵌套"], "text": ["**后置修饰**是 GRE 长难句的主源：核心顺序（核心词+of B+in C+从句）与中文相反，阅读时要形成“核心词→层层回溯”的习惯。主谓之间插入 who 从句（those who stress… cannot understand…）——读到 those 就等谓语。", "**位置决定修饰对象**:I saw in the room a girl 中 in the room 修饰 saw（在房间里看见）；若放句尾就会歧义成“喜欢在房间里跳舞的女孩”。修饰语位置是语义的一部分。", "**and 并列要判归属**(Duncan 题的灵魂）:established vocabulary 与 traditional methods 并列（都是被抛弃的旧东西）——established=既定的=传统的。判错归属就会把 B（恢复既定词汇）当成正确方向。", "句内逻辑嵌套：since（原因）→only if（唯一条件）→if（条件）→whereas（对比），一层套一层；less…than 比较双方地位平等。"]}, {"type": "passage", "title": "实战四 · Duncan 的现代舞（and 归属判断）", "source": "先自己做 · EXCEPT 题：选“他不想做的”", "text": "Isadora Duncan’s masterly writings on dance reveal her determination to create a lyrical art form free of characterization, storytelling, and the established vocabulary of such dance forms — free, that is, of traditional methods — and to explore instead the internal sources of human expressiveness. She shunned bodily ornamentation and strove to use only the natural movements of the body. In the essays collected shortly after her death, she set forth her vision of a dance grounded in emotion rather than technique."}, {"type": "q", "tag": "真题 · EXCEPT 题", "title": "第1题 · 以下哪个不是她想做的", "source": "实战四", "pause": true, "stem": [{"t": "Duncan intended to develop an art form that would do all of the following EXCEPT..."}], "options": {"A": "avoid the use of standard ballet technique", "B": "restore an earlier established vocabulary", "C": "draw on internal sources of human expressiveness", "D": "create intended effects without the use of bodily ornamentation", "E": "derive inspiration from inner feeling"}, "answer": "B", "explain": {"思路": "①free of characterization, storytelling, and the **established vocabulary**…free of **traditional methods**——established vocabulary 与 traditional methods 并列，都是要**抛弃**的旧东西。②EXCEPT=选“不是她想做的”:B“恢复早期既定词汇”方向相反。", "annot": "归属图：free of [characterization, storytelling, <span class='m4'>established vocabulary ≈ traditional methods</span>] → 全是弃子；她想探索 <span class='m3'>internal sources</span>。", "辨析": "A=free of standard technique✓想做的（不选）;C/E=internal sources 的同义改写✓;D=shunned ornamentation 的改写✓。", "点拨": "EXCEPT 题先给每个选项贴“想做/不想做”标签，再四选一。and 并列判错归属，B 就会看起来像对的——本题就是考这个。"}}, {"type": "passage", "title": "实战五 · 已婚女性就业的幕后推手", "source": "精读段 · 重点：less…than + 虚拟取反", "text": "The increase in the twentieth century in the numbers of married women employed outside the home had less to do with the mechanization of housework and increased leisure than it did with economic need and a high marriage rate, which shrank the available pool of single-women workers, previously in many cases the only women employers would hire."}, {"type": "teach", "title": "④ 实战五解析：比较与虚拟取反", "ppt": ["less to do with A than with B=与 A 关系小，与 B 关系大", "less likely to happen if…=把“关系大”的因素取反"], "text": ["主干：已婚女性就业的增长，与**机械化/休闲**关系小，与**经济需求+高结婚率**（单身女工池子缩小）关系大。", "虚拟题问“若以下哪个成立，该增长 less likely 发生”→把“关系大”的因素取反：**低结婚率**→单身女工池子大→雇主无需雇已婚女性→增长不易发生。", "阅读顺序提醒：中文“20 世纪在家外就业的已婚女性数量的增长”=英文完全倒装（the increase…in the numbers of married women employed outside the home in the twentieth century)——核心词在句首，修饰层层后置。"]}, {"type": "passage", "title": "实战六 · 物理学家为何害怕精确观点", "source": "精读段 · 重点：only if 嵌套 + 句内对比", "text": "Physicists rightly dread precise arguments: an argument that is convincing only if it is precise loses all its force if the assumptions on which it is based are slightly changed, whereas an argument that is convincing although imperfect may well remain stable under small perturbations of its underlying assumptions."}, {"type": "teach", "title": "⑤ 实战六解析：句内逻辑嵌套", "ppt": ["only if=唯一条件；since/if/whereas 层层嵌套", "精确观点：假设动一点→全盘皆输；不完美观点：抗小幅扰动"], "text": ["嵌套拆解：物理学家害怕精确论证（论点）→**因为**（since）一个论证若**仅当**(only if）精确才有说服力，那么假设轻微改动→全部力量尽失；**而**(whereas）不完美但有说服力的论证，在假设小扰动（perturbation 与 imperturbable 同根！）下依然稳定。", "推论题“精确观点要维持说服力必  文中人物的目的"], "text": ["雅思托福留下的习惯是找关键词（大写/数字/斜体），但 GRE 审题第一问永远是：**这道题的核心问点是什么？**例：“select the sentence that serves a possible reason”——核心是 a possible reason（可能的原因），后面一大串只是“原因导致的结果”，是辅助你找答案的线索。", "**两个 in order to 的对比**:①“作者谈到 S 和 B 两人的主要目的”→问的是**作者**的目的（两人是辅助定位的例子）;②“从文中可推 RM 谈到 limb C 是为了干嘛”→问的是**RM（文中人物）**的目的——要看 RM 是全文主角（作者替身）还是细节人物。问法形式相似，核心角度不同，别套套路。", "审题之后是**定位**：所有题都出自文章信息，但定位必须精准——大词（数字/大写）只能定大范围，要解决题目得定到最准的那一处。"]}, {"type": "teach", "title": "② 选项的双重功能", "ppt": ["功能一：被判断对象——信息对 + 逻辑合题，双重制约", "正确答案=全部信息都对；错答案=一两个信息错就全错；存疑打问号回头判", "功能二：提示解题思路——选项往文里带（organization 题三段对比）"], "text": ["判断选项=**双重制约**：①信息是否与原文一致（不一致必错）;②逻辑是否符合问题（一致但答非所问也错——例子本身不是“举例的目的”)。", "正确答案必须**全部信息**都对；错误答案只要一个信息错就全错。遇到有生词不好判的选项：打问号放一放，看后面的选项再回头（门德尔松 Q3 的 milieu=环境，不认识的词放后面再判）。", "**选项反向解题**：读 organization（组织结构）题时，自己总结往往困难——把选项的“先怎样、再怎样、然后怎样”逐段与文章对比即可。拿文章套选项、拿选项回文验证，方向都行，目的是把答案选出来。"]}, {"type": "passage", "title": "实战 · 门德尔松是伟大作曲家吗", "source": "先自己做：2 题 · 第3题见讲解卡", "text": "Was Felix Mendelssohn a great composer? On the face of it, the question seems absurd — one of the most gifted prodigies in the history of music, he composed his first masterpiece at sixteen. From then on he was recognized as an artist of preternatural abilities, not only as a composer but also as a pianist and conductor. But Mendelssohn’s enduring popularity has been at odds with his critical standing. Acknowledging his talent, critics have been reluctant to rank him with, say, Schumann and Brahms; as H. put it, Mendelssohn was a “minor master,” working on a small scale of emotion and texture."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · 评价者面临的 dichotomy", "source": "实战", "pause": true, "stem": [{"t": "The passage implies that anyone attempting to evaluate Mendelssohn’s career must contend with which of the following dichotomies?"}], "options": {"A": "the tension between Mendelssohn’s career as a composer and his careers as a pianist and conductor", "B": "the contrast between the popularity of Mendelssohn’s music and the popularity of the music of Schumann and Brahms", "C": "the discrepancy between Mendelssohn’s popularity and his standing among critics", "D": "the difference between Mendelssohn’s reputation during his lifetime and his reputation since his death", "E": "the gap between Mendelssohn’s musical beginnings and the decline of his later years"}, "answer": "C", "explain": {"思路": "①审题：核心是 which dichotomy（什么矛盾）。②定位：文章的矛盾只在 at odds with 一处——popularity vs critical standing。③C=discrepancy 替换 at odds with。", "annot": "矛盾点：<span class='m3'>enduring popularity</span> <span class='m2'>at odds with</span> <span class='m4'>critical standing</span> → C。", "辨析": "A 三种身份不矛盾；B 与舒曼/勃拉姆斯比的是“勉强并列”不是流行度对比；D 生前/死后、E 早年/晚年——全是无中生有的对比。", "点拨": "问 dichotomy/contrast 的题，先在文中找“分歧/不一致”的信号词（at odds with/discrepancy/paradox)，答案就是信号词两端的双方。"}}, {"type": "q", "tag": "真题 · 功能题", "title": "第2题 · 提舒曼和勃拉姆斯的目的", "source": "实战", "pause": true, "stem": [{"t": "The author mentions Schumann and Brahms primarily in order to..."}], "options": {"A": "provide examples of composers who are often compared to Mendelssohn", "B": "identify certain composers who were more popular than Mendelssohn", "C": "identify composers whose work Mendelssohn influenced", "D": "establish the milieu in which Mendelssohn worked", "E": "establish a standard of comparison for Mendelssohn as a composer"}, "answer": "E", "explain": {"思路": "①核心问点：作者的目的（两人是辅助定位的例子）。②文中功能：评论界勉强把门德尔松与这两人并列（rank him with…有点勉强）→两人=衡量门德尔松的标杆。③E=establish a standard of comparison。", "annot": "功能链：两人地位高 → <span class='m4'>并列起来勉强</span> → 门德尔松“minor master”→ 两人=<span class='m4'>比较标准</span>。", "辨析": "A 陷阱：两人确实是“常被比较的例子”，但比较的目的是立标准不是列举；B 比流行度错（比的是天赋地位）;C 影响关系无中生有；D milieu（环境）不认识的词放后面再判——E 已完美对应。", "点拨": "两个判断动作：先排除“复述例子内容”的选项（A/B/C 都在说两人本身），再在剩余里选“功能动词”最准的（establish a standard)。milieu 不认识不碍事——这正是“存疑选项打问号”的实战。"}}, {"type": "teach", "title": "③ 本篇第三题精讲（select-in-passage）", "ppt": ["选择体现门德尔松“天赋范围”的句子"], "text": ["第 3 题是 select-in-passage（点句子）：要求选出能体现门德尔松**音乐天赋范围（range
