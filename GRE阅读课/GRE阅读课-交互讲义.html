<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE 阅读课 · 交互讲义</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; background: #eef0f4; color: #26282c; }
.wrap { display: flex; max-width: 1240px; margin: 0 auto; gap: 20px; padding: 16px; }
.side { width: 250px; flex-shrink: 0; position: sticky; top: 16px; align-self: flex-start; background: #fff; border-radius: 12px; padding: 16px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); max-height: calc(100vh - 32px); overflow: auto; }
.side h2 { font-size: 15px; margin-bottom: 4px; }
.side .sub { font-size: 11px; color: #999; margin-bottom: 10px; }
.lnav { display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; color: #333; line-height: 1.4; }
.lnav:hover { background: #f0f3ff; }
.lnav.on { background: #7a4af7; color: #fff; }
.lnav.off { color: #bbb; cursor: not-allowed; }
.lnav .pgr { font-size: 11px; opacity: .8; }
.side .tools { margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.side .tools button { font-size: 12px; padding: 6px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-family: inherit; }
.side .tools button:hover { border-color: #7a4af7; color: #7a4af7; }
.main { flex: 1; min-width: 0; }
.lesson-head { background: #fff; border-radius: 12px; padding: 22px 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 18px; }
.lesson-head h1 { font-size: 22px; margin-bottom: 8px; }
.lesson-head p { color: #666; font-size: 14px; line-height: 1.8; }
.lesson-progress { margin-top: 10px; font-size: 13px; color: #7a4af7; }
.card { background: #fff; border-radius: 12px; padding: 22px 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 16px; }
.chead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.chead .no { background: #7a4af7; color: #fff; font-size: 12px; border-radius: 6px; padding: 2px 8px; }
.chead h3 { font-size: 17px; }
.pptbox { background: #f7f6fc; border-left: 3px solid #7a4af7; border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0 14px; font-size: 13px; color: #556; line-height: 1.9; }
.tbody p { font-size: 14.5px; line-height: 2; margin-bottom: 10px; color: #333; }
.tbody p:last-child { margin-bottom: 0; }
.rootbox { border: 1px solid #e8e4f8; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.rootbox .vhead { background: #f5f2fe; padding: 8px 14px; font-size: 13px; font-weight: 700; color: #7a4af7; }
.ritem { display: flex; gap: 10px; padding: 9px 14px; border-top: 1px solid #f0eef8; font-size: 14px; line-height: 1.85; }
.ritem .rw { flex-shrink: 0; min-width: 185px; font-weight: 700; color: #3a2d6b; }
.ritem .rg { color: #1e8449; font-weight: 600; }
.ritem .rn { color: #666; font-size: 13px; }
.afterbox { background:#faf9fe; border:1px dashed #d8d0f0; border-radius:8px; padding:10px 14px; font-size:13.5px; line-height:2; color:#444; margin-bottom:10px; }
details.extra { border:1px solid #dfe6d8; border-radius:10px; margin-bottom:6px; background:#fbfcfa; }
details.extra summary { cursor:pointer; padding:10px 14px; font-size:13.5px; font-weight:700; color:#3d7a3d; }
details.extra .exlist { padding:4px 14px 10px; }
details.extra .exi { font-size:13.5px; line-height:2; }
details.extra .exi b { color:#3a2d6b; }
details.extra .exi span { color:#1e8449; }
/* question card (from lecture builder) */
.stem { background: #fbfcfe; border: 1px solid #e3e7f0; border-radius: 10px; padding: 16px 18px; font-size: 16px; line-height: 2.1; margin-bottom: 14px; }
.pausebar { background: #fff8e6; border: 1px solid #f0d78c; color: #8a6d1a; font-size: 13px; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.opt { text-align: left; font-size: 15px; padding: 11px 14px; border: 1.5px solid #dde1ea; border-radius: 9px; background: #fafbfd; cursor: pointer; font-family: inherit; }
.opt:hover { border-color: #7a4af7; }
.opt.sel { border-color: #7a4af7; background: #eef2ff; }
.opt.ok { background: #e7f7ec; border-color: #2ecc71; color: #1e8449; }
.opt.bad { background: #fdecea; border-color: #e74c3c; color: #c0392b; }
.opt.lock { pointer-events: none; }
.opt .ol { display: inline-block; min-width: 22px; font-weight: 700; color: #667; margin-right: 6px; }
.grp { margin-bottom: 8px; }
.grp .glabel { font-size: 12px; color: #888; margin-bottom: 6px; }
.submit { margin-top: 6px; padding: 10px 26px; font-size: 15px; border: none; border-radius: 8px; background: #7a4af7; color: #fff; cursor: pointer; font-family: inherit; }
.submit:disabled { background: #c5cbe0; cursor: not-allowed; }
.analysis { margin-top: 16px; border-top: 2px dashed #e3e7f0; padding-top: 14px; }
.ans-line { font-size: 15px; margin-bottom: 12px; }
.ans-line .ok { color: #1e8449; font-weight: 700; }
.ans-line .bad { color: #c0392b; font-weight: 700; }
.ablock { margin-bottom: 12px; }
.ablock .atitle { font-size: 13px; font-weight: 700; color: #7a4af7; margin-bottom: 5px; }
.ablock .acont { font-size: 14px; line-height: 1.95; color: #333; }
.annotbox { background: #f6f8ff; border: 1px solid #dfe6fb; border-radius: 8px; padding: 12px 14px; font-size: 14.5px; line-height: 2.1; }
.m3 { background: #d9f2e1; padding: 0 3px; border-radius: 3px; }
.m4 { background: #ffd9d9; padding: 0 3px; border-radius: 3px; }
.m2 { background: #ffe0b3; padding: 0 3px; border-radius: 3px; }
/* quiz + rootquiz */
.qitem { border: 1px solid #e6e9f2; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.qitem .qw { font-size: 15px; font-weight: 700; color: #2d3a6b; margin-bottom: 8px; }
.qitem .qw .res { font-size: 13px; font-weight: 400; margin-left: 8px; color:#c0392b; }
.qitem .hint { font-size: 12.5px; color: #999; margin-top: 6px; display: none; }
.qopts { display: flex; flex-wrap: wrap; gap: 8px; }
.qopt { font-size: 13.5px; padding: 7px 12px; border: 1.5px solid #dde1ea; border-radius: 8px; background: #fafbfd; cursor: pointer; font-family: inherit; }
.qopt:hover { border-color: #7a4af7; }
.qopt.ok { background: #e7f7ec; border-color: #2ecc71; color: #1e8449; }
.qopt.bad { background: #fdecea; border-color: #e74c3c; color: #c0392b; }
.qopt.lock { pointer-events: none; }
.quizstats { font-size: 13px; color: #7a4af7; margin-bottom: 12px; }
details.raw { margin-top: 18px; background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
details.raw summary { cursor: pointer; font-weight: 700; color: #667; font-size: 14px; }
details.raw .rawtext { margin-top: 12px; font-size: 13.5px; line-height: 2.1; color: #444; white-space: pre-wrap; max-height: 480px; overflow: auto; }
.finish { text-align: center; padding: 26px 0 8px; }
.finish button { font-size: 15px; padding: 12px 30px; border: none; border-radius: 9px; background: #2ecc71; color: #fff; cursor: pointer; font-family: inherit; }
.done-badge { display: inline-block; background: #e7f7ec; color: #1e8449; border-radius: 8px; padding: 8px 18px; font-size: 15px; font-weight: 700; }
@media (max-width: 860px){ .wrap{flex-direction:column} .side{width:100%; position:static; max-height:none} }
</style>
</head>

<script>
const DATA = {"lessons": [{"id": 1, "title": "第1讲 · GRE阅读导论", "intro": "阅读课开讲。本讲不立具体文章，立全局：考试界面、文章/题目的形式与数量、时间分配、以及官方能力模型（critical reading 到底是什么）。导论课没有随堂文章，我们把老师讲的硬核知识点全部转成随堂检测题——先做题再看解析，做错的正是你后面 22 讲要重点补的地方。", "cards": [{"type": "teach", "title": "① 课程地图与考试界面", "ppt": ["23 讲课程结构：方法 → 文章分析 → 题目分析 → 综合应用 → 备考", "界面：左文右题（托福相反）", "Mark 标记 / Review 回看"], "text": ["**课程结构**：做题方法（流程+文章分析+题目分析）→ 综合应用 → 课后备考。文章分析两大支柱=逻辑分析+句意理解；题目分析=问题选项分析+八大题型解法。", "**考试界面**：左侧文章、右侧题目（托福机考恰好相反）。真实考场有 **Mark**（标记没把握的题）和 **Review**（回看全部答题状态）两个按钮——先标记、最后再回来定夺，是时间管理的标配。模考软件界面与真考略有差异，以考场为准。"]}, {"type": "teach", "title": "② 文章特征：长度与篇数", "ppt": ["短文章：1题≈50词 · 2题≈120词", "长文章：3题≈160词 · 4题≈450词", "Section 篇数：1题×1篇 / 2题×2-4篇 / 3题×2-3篇 / 4题×0-1篇"], "text": ["文章长短由后面的题数决定：**1题≈50词、2题≈120词、3题≈160词、4题≈450词**(4题文章出现滚动条，一屏装不下）。", "一个 section 的篇数分布：1题文章约 1 篇，2题文章 2-4 篇，3题文章 2-3 篇，**4题文章 0 或 1 篇**——长文章不是每 section 必出，别在考场上被它的长度吓住。"]}, {"type": "teach", "title": "③ 题目特征：一个 Section 的构成", "ppt": ["Verbal 20题 = 填空10（1-6填空 + 4六选二）+ 阅读10", "三种答题形式：五选一（椭圆单选）/ 三选n不定项（方框打叉）/ Select in Passage（点句子）"], "text": ["20 题结构：第 1-6 题填空（空格数 1→3 递增），第 7 题起阅读，中间或结尾穿插 4 道六选二，**阅读共 10 题**——阅读与填空各占 verbal 半壁江山。", "**五选一**：选项前是椭圆，点选变黑，改选自动替换。**三选 n**：选项前是方框，点选变 **叉叉——叉=选中，不是放弃**;n 是**不定项**（1/2/3 都可能），不是多选。**Select in Passage**：没有问题选项，点文章中的句子作答——可以把它当作“每句话都是选项”的选择题来研究。平时讲义里的 ABC/E 选项是教学标记，考场不会出现。"]}, {"type": "teach", "title": "④ 时间分配：算进备考参数", "ppt": ["Verbal 30分钟20题 → 填空10分钟（1题/分钟）+ 阅读20分钟（1题/2分钟）", "文章总时间 = 读文章 + 做题", "两题文章：4分钟 = 读1 + 做3；三题文章：6分钟 = 读1.5 + 做4.5"], "text": ["阅读平均每题 **2 分钟**（填空 1 分钟）。算文章总账：**两题文章 4 分钟**（120 词约 1 分钟读完 + 3 分钟做题）;**三题文章 6 分钟**（150 词 1.5 分钟 + 4.5 分钟做题）。", "老师的提醒很多同学吃亏在这里：**备考中后期必须把“时间”算进参数**——只追正确率和方法、不计时，上考场做不完就全白费。"]}, {"type": "teach", "title": "⑤ 官方能力模型（OG)", "ppt": ["理解词/句/段/篇的 meaning（语义层）", "逻辑层：主次/概括/推结论/不完整信息推理/结构/作者视角", "逻辑推理题（Logical Reasoning)：识别假设/评估优劣/alternative explanation"], "text": ["OG 列的能力分两层：**语义层**——从小到大（词汇→句子→段落→篇章）理解意义；**逻辑层**——区分主次观点、概括、从信息推结论、从不完整信息推理（含找出作者隐藏的信息）、理解结构、识别作者视角。", "最后三条（识别假设/分析文本并评估优劣/发展与考量 alternative explanation）对应一个特别题型：**Logical Reasoning 逻辑推理题**——2002 年前考过、2011 年 8 月恢复的老题型，题型课细讲。", "关键结论：GRE 阅读 = **critical reading（批判式阅读）**。批判≠开骂怼人，而是**全面分析**——找论点论据、分析原因、评估优劣。GRE 考的正是研究生阶段读文献要用的能力。"]}, {"type": "teach", "title": "⑥ 主动阅读：不做“被动理解”的受害者", "ppt": ["Passive understanding（被动理解）→ 看懂词句的错觉", "Active engagement：边读边问——作者接下来怎么写？假说怎么来的？信息什么关系？", "官方五点实践：论点论据区分 / 报道观点vs支持观点 / 强烈支持vs假说 / 过渡识别 / 观点关系判断"], "text": ["官方原话：GRE 阅读要求的**不是 passive understanding**（被动理解词和句），而是 **active engagement**（主动参与文本）。边读边问：作者接下来会怎么写？这个假说是怎么来的？我怎么看？信息和信息是什么关系？大脑活跃→理解深→短期记忆好→题做得顺。", "“词都认识、句子都懂、做题还是错”= 你只看懂了表面，**没真正读懂行文逻辑**——这是 GRE 阅读最经典的错觉。", "**官方五点实践建议**:①区分论点与论据（看到 for example 就知道前句是论点）;②区分“作者仅报道的观点”和“作者自己支持的观点”;③区分强烈支持（committed）和假说猜测（hypothetical/speculative);④识别 idea 到 idea 的过渡；⑤判断不同观点的关系——对比还是一致？一方支持另一方？一方帮另一方详细展开（spell out)?一方是另一方的具体应用？（⑤就是后面逻辑课的同反向关系。)"]}, {"type": "teach", "title": "⑦ 课后备考路径", "ppt": ["跟课学方法 → 课堂题目 → 讲义练习 → OG / PowerPrep Online"], "text": ["三步：①把课跟下来，知道 GRE 阅读的特点和解法；②做课堂题目+讲义；③课下用官方 OG 和 PowerPrep Online 模考练。方法+练习双轨，缺一不可。"]}, {"type": "q", "tag": "随堂检测", "title": "时间账：三题文章该花多久？", "source": "第④节 时间分配", "pause": true, "stem": [{"t": "你遇到一篇 3 题的文章（约 160 词），按课程的标准，做这篇文章的总时间应该是？"}], "options": {"A": "4 分钟（读 1 分钟 + 做 3 分钟）", "B": "6 分钟（读 1.5 分钟 + 做 4.5 分钟）", "C": "8 分钟（读 2 分钟 + 做 6 分钟）", "D": "10 分钟（读 3 分钟 + 做 7 分钟）"}, "answer": "B", "explain": {"思路": "阅读每题 2 分钟 → 3 题 = 6 分钟总账；160 词约 1.5 分钟读完，剩余 4.5 分钟做题。", "annot": "公式：<span class='m3'>题数 × 2 分钟</span> = <span class='m4'>读文章 + 做题</span>。3×2=6 → 1.5 读 + 4.5 做。", "辨析": "A 是 2 题文章的账（4 分钟）。备考中后期要把这个公式内化成条件反射。", "点拨": "考场上看到 3 题文章就自动进入“6 分钟模式”，看到 4 题文章就是 8 分钟——时间感是练出来的。"}}, {"type": "q", "tag": "随堂检测", "title": "操作细节：三选 n 的方框打叉是什么意思？", "source": "第③节 题目形式", "pause": true, "stem": [{"t": "关于“三选 n 不定项选择”（选项前是方框），下列说法正确的是？"}], "options": {"A": "方框里出现叉叉 = 放弃这个选项", "B": "方框里出现叉叉 = 选中了这个选项", "C": "必须同时选中三个选项才得分", "D": "和五选一一样，选项前是椭圆"}, "answer": "B", "explain": {"思路": "三选 n 的方框打叉 = 选中；n 是不定项（1/2/3 你一定会有很大的收获。这是我们第一节课整个关于g2阅读的一个介绍的部分，我们就先讲到此。"}, {"id": 2, "title": "第2讲 · 阅读方法（含 4 篇真题实战）", "intro": "方法总纲+实战课。上半讲立方法：做题流程（先文后题）、出题人视角、文章=信息+逻辑、审题定位；下半讲用 4 篇真题（三题/两题/四题/一题各一）把流程完整走一遍。四篇文章全部按你的要求呈现：先给干净文章和题，自己做，提交后才出翻译+逻辑梳理+逐项解析。老师在这讲贡献了全课最金的一句话：带着论点读论据。", "cards": [{"type": "teach", "title": "① 做题流程：先看文章，再做题", "ppt": ["流程：读文章 → 审题 → 定位 → 选项对应", "与托福/四六级相反：GRE 题目不按行文顺序出", "定位 = 问题与文章信息的结合"], "text": ["**流程**：先读文章再做题；做题时不确定就回原文对应。托福/四六级那套“先看题回文找”在 GRE 行不通，两个原因：①GRE 考整体理解与逻辑把控（critical reading），只定位句子做不对题；②**GRE 题目不一定按行文顺序出**，出题角度也不都是一个定位能解决的。", "**审题是被严重低估的一步**：公交车段子（上来38人、下2上10、下3上4……问“车开了几站”）——问题基于文章信息怎么问都行，看错一个角度全盘皆输。GRE 阅读信息量大、干扰角度多，审题必须慢。", "**定位**=把问题和文章信息结合：知道这道题考的对象在文章哪里。有时是回文找，有时是读懂文章后看到题直接想出角度——都叫定位。", "**选项对应**：拿文章信息判断选项对错——所有题都只考文章内的信息。"]}, {"type": "teach", "title": "② 出题人视角：文章是怎么来的", "ppt": ["选材：指定学术期刊 + SourceFinder 工具打分", "删改：删无关信息 + 改为匹配 GRE 难度与能力", "你看到的文章 ≠ 原文"], "text": ["**选材**：ETS 从指定的学术期刊选文（符合 GRE 学术性），用 SourceFinder 工具打分筛选。", "**删改**：原文怎么可能最多 450 词？出题人会**删除无关紧要/超出考察范围的信息**，并**改写为匹配 GRE 难度与测试能力**。所以你看到的文章是改编版——改的目的就是测出 OG 那套能力。反推：文章的每句话都服务于考点，没有废笔。", "**话题四学科**：自然科学、生物科学、社会科学、人文学科。官方不要求背景知识，但如果你某学科明显弱，平时多读该学科的练习文章、熟悉常见词汇（如天文学：star/planet/supernova/pulsar/white dwarf/red giant），考场状态会好很多。"]}, {"type": "teach", "title": "③ 文章 = 信息 + 逻辑", "ppt": ["信息 = 词义 + 句意（表意基本单位）", "逻辑 = 词/句/段之间的关系", "逻辑的两大作用：建框架 + 帮理解信息"], "text": ["把文章拆成两部分：**信息**（词义句意，一句话的表意）+ **逻辑**（词与词、句与句、段与段的关系）。句子+逻辑=段落；段落+逻辑=篇章。", "**逻辑作用一：建框架（framework)**。如同托福 summary 题要求的 mental framework——GRE 作为 critical reading，对整体框架的把控是第一位的。", "**逻辑作用二：帮理解信息**。举例：前句读懂、后句 for example 开头且生词一堆——不用慌：举例关系下前后大意必然一致，后句一定在具体化前句。前句说“中国有很多美食”，后句不管怎么写都是具体的中国地方美食。抓住逻辑，生词多的句子也能猜出大意。", "**读文章的速度分配**：第一句话读慢些——确定 topic（讲什么对象）和方向性（作者什么态度/趋势）。"]}, {"type": "passage", "title": "实战一 · 三题文章（青春期生长突增）", "source": "先自己做：3 道题，约 6 分钟（读 1.5 + 做 4.5）", "text": "Most mammals reach sexual maturity when their rate of growth is in decline, but humans undergo a growth spurt during adolescence. Whether chimpanzees experience an adolescent growth spurt is still undecided. Data on chimpanzees collected in the 1950s appear to lack evidence of such a spurt. In a recent analysis of these data, however, the researcher found that when chimpanzees reach sexual maturity, the growth rate increases in their limbs. Most biologists, however, are skeptical that this is a humanlike adolescent growth spurt: the human growth spurt is physically obvious and affects virtually the entire body, whereas the chimpanzee’s increase in growth rate is detectable only through sophisticated mathematical analysis. Moreover, according to one researcher, the growth rate increase in chimpanzees commences when 86 percent of skeletal growth has been attained, whereas the human adolescent growth spurt typically commences when 77 percent of skeletal growth has occurred."}, {"type": "q", "tag": "真题 · 主旨题", "title": "第1题 · 文章 main idea", "source": "实战一 · 三题文章", "pause": true, "stem": [{"t": "The primary purpose of the passage is to..."}], "options": {"A": "review the evidence that suggests chimpanzees experience an adolescent growth spurt", "B": "question the methodology of the recent analysis of chimpanzee data", "C": "argue that the notion that apes do not experience an adolescent growth spurt has been confirmed", "D": "present the status of an unresolved question about chimpanzee growth", "E": "explain why researchers have long agreed that chimpanzees do not experience an adolescent growth spurt"}, "answer": "D", "explain": {"思路": "①审题：main idea 题，考全文概括。②回文章：核心句是第二句“黑猩猩是否经历青春期生长突增悬而未决”，后面三拨人（数据缺证据/再分析发现增长/多数生物学家怀疑）都是“未决”的具体化。③选项对应：D“呈现一个未解决问题的现状”正好覆盖全篇；A 只覆盖“支持方”；C/E 的 confirmed/agreed 与 undecided 直接矛盾。", "annot": "文章骨架：<span class='m2'>undecided</span>（核心）← 三拨人：缺数据 → <span class='m2'>however</span> 有增长 → <span class='m2'>however</span> 不像人 → <span class='m3'>moreover</span> 两个证据。主旨题答案必须覆盖<span class='m4'>全部段落</span>，只覆盖一方的都是陷阱。", "辨析": "A 只讲支持证据（后半）；B 质疑方法——文中无人质疑方法；C“已证实没有”与原文相反；E“长期一致同意”与三拨人争议相反。", "点拨": "两个 however 把文章拧成“缺证据→有证据→不算数”的三段争议——主旨题的答案必须装得下这个完整的争议结构。"}}, {"type": "q", "tag": "真题 · 细节题", "title": "第2题 · 生物学家怀疑的原因之一", "source": "实战一 · 三题文章", "pause": true, "stem": [{"t": "The passage mentions which of the following as one reason why most biologists remain skeptical that chimpanzees experience a humanlike adolescent growth spurt?"}], "options": {"A": "The increase in growth rate is not demonstrable until chimpanzees are fully mature", "B": "The increase in growth rate is less obvious than the human adolescent growth spurt", "C": "The growth spurt is too sporadic to be regarded as significant", "D": "Not all chimpanzees experience a calculable growth spurt", "E": "The approach used to analyze the data differs from Watson’s approach"}, "answer": "B", "explain": {"思路": "①审题抓“原因之一(one of the reasons)”——说明文中有多个原因，任选一个即可。②定位：biologists skeptical 之后，moreover 前后的两个信息（需精密数学分析才可见 / 86% 才开始）就是 reasons。③对应：B“不如人类的明显”=“需数学分析才可见”的同义转换。", "annot": "定位锚点：<span class='m3'>most biologists…skeptical</span> → 后面 <span class='m2'>moreover</span> 前后两条原因。B 对应第一条（人直接可见 vs 星星要靠数学分析）。", "辨析": "A“完全成熟才可见”加了文章没有的条件；C sporadic（零星的）文章没提（sporadic~spore 孢子：到处都是→零散的）；D“并非所有黑猩猩”——文中黑猩猩是整体对象；E Watson 在 biologists 之前出现，逻辑位置不对，不是原因。", "点拨": "不认识 sporadic 也不影响：B 能直接对上原文，C 存疑——先选 B，做完查 sporadic（名词 spore 孢子）。这是考场上处理生词选项的标准姿势。"}}, {"type": "q", "tag": "真题 · 推断题", "title": "第3题 · 关于人类生长突增的推断", "source": "实战一 · 三题文章", "pause": true, "stem": [{"t": "The passage implies which of the following about the adolescent growth spurt that takes place in humans?"}], "options": {"A": "Its effects are found in parts of the body other than the limbs", "B": "It is usually completed when 77 percent of skeletal growth has occurred", "C": "It is detectable without the aid of sophisticated mathematical analysis", "D": "It is more rapid at the beginning of adolescence than at the end", "E": "Its rate varies with the method used to measure it"}, "answer": "C", "explain": {"思路": "①审题：imply 推断题，对象=人类生长突增。②定位：文中谈人两处——首句（人经历突增）+末两句（人与黑猩猩对比：人明显/全身；77% 开始）。③对应：C“不需要精密数学分析就能察觉”正是“physically obvious”与“黑猩猩才需要数学分析”的对比转换。", "annot": "对比链：<span class='m3'>人=physically obvious</span> ↔ <span class='m3'>黑猩猩=only through mathematical analysis</span> → 人不需要数学分析 → <span class='m4'>C</span>。", "辨析": "B 是最大的坑：文章说 commence（开始）于 77%,B 偷换成 completed（完成）——开始≠结束。别被 commencement“毕业典礼”带偏：毕业是“人生新阶段的开端”，commence 本义就是开始。A 四肢之外的影响、D 青春期开始更快、E 随测量方法变化——全是无中生有。", "点拨": "推断题=原文信息的同义转换，绝不允许出现一个原文没有的细节词（completed 就是）。一个词葬送一个选项——这也是老师让你边读边猜 commence 词义的原因。"}}, {"type": "passage", "title": "实战二 · 两题文章（文化人类学）", "source": "先自己做：2 道题，约 4 分钟（读 1 + 做 3）", "text": "Many cultural anthropologists have come to reject the empiricism that dominated the field until the 1970s and now regard all scientific knowledge as socially constructed. Knowledge produced during the empiricist period, they argue, typically reflects the conscious and unconscious biases of the researchers, and such subjectivity is unavoidable in anthropological inquiry. Anthropologists should therefore acknowledge this fact and stop striving to build ever more comprehensive databases of cultural behavior. They should instead turn to developing more humanistic interpretations of other cultures. Indeed, according to these anthropologists, analyzing the biases that shaped earlier anthropological texts may be more enlightening than continuing to pursue the empiricist project."}, {"type": "q", "tag": "真题 · 推断题", "title": "第1题 · 1970 年代前的人类学家", "source": "实战二 · 两题文章", "pause": true, "stem": [{"t": "The author implies that most cultural anthropologists working prior to the 1970s..."}], "options": {"A": "regarded all scientific knowledge as socially constructed", "B": "were explicit in acknowledging the biases inherent in scientific investigation", "C": "held that scientific knowledge rests on empirical observation", "D": "shared the same conscious and unconscious biases", "E": "acknowledged the need for a new scientific framework"}, "answer": "C", "explain": {"思路": "①审题：对象=1970s 之前的人类学家，考 author implies。②定位：首句“reject the empiricism that dominated the field until the 1970s”——之前被实证主义主导 → 他们的观点是“科学知识建立在经验观察之上”。③对应 C。", "annot": "时间对比锚点：<span class='m2'>until the 1970s</span> → 之前=empiricism（实证主义）→ C 的 empirical observation。<span class='m4'>1970 前实证 vs 1970 后社会构建</span>是全篇的骨架。", "辨析": "A 是 1970 之后的观点（时间对调）；B 是 should≠did——原文说“本应该承认偏见，但实际没承认”，选项说“坦承了”，反了；D shared the same biases 文章没说共同；E 是新框架的需求方——也是 1970 后的人。", "点拨": "时间对比题第一件事：把两拨人的观点列成对照表。B 的坑在动词性质：should do 和 did 是两回事——动词形式不同，表意完全不同（后面句意理解课会细讲）。"}}, {"type": "q", "tag": "真题 · 细节题", "title": "第2题 · 今天的人类学家主张", "source": "实战二 · 两题文章", "pause": true, "stem": [{"t": "According to the passage, many cultural anthropologists today believe that anthropologists should..."}], "options": {"A": "build a better and less subjective database of cultural behavior", "B": "strive to improve empirical research methods", "C": "reject the notion that scientific knowledge is socially constructed", "D": "examine earlier anthropological texts for unacknowledged biases", "E": "combine empirical methods with humanistic interpretation"}, "answer": "D", "explain": {"思路": "①审题：today 的人类学家=主张 social construction 的那拨。②定位：末句“analyzing the biases that shaped earlier anthropological texts may be more enlightening than continuing the empiricist project”。③对应：D=analyze biases→examine for biases 的同义改写，earlier texts=older anthropological texts。", "annot": "末句逻辑：分析旧文本的偏见 <span class='m2'>比</span> 继续实证项目<span class='m4'>更有启发</span> → 应该做前者 → D。", "辨析": "A 是本题最强干扰：better、less subjective 听上去都好，但 database 的本质=empiricism——给实证主义添砖加瓦，方向反了。记住老师的话：判断选项不看表面褒贬，看它的“性质”偏 empirical 还是偏 socially constructed。B 追求实证=正向支持了被否定的对象；C 把观点背反了；E“两者结合”无中生有。", "点拨": "这篇文章每个信息都能贴上性质标签：empiricism ↔ socially constructed。读的时候不停问“这句偏哪边”，选项来了直接对标签——这就是逻辑带着读。"}}, {"type": "passage", "title": "实战三 · 四题文章（休斯与布鲁斯诗）", "source": "先自己做：4 道题，约 8 分钟（读 2 + 做 6）· 注意运用「带着论点读论据」", "text": "“Blues are meant to be sung, not written,” folk musicologist Paul Oliver has written, adding that the blues is a form that does not stand up very well when written down. Poets who want to write blues have tried to avoid these problems by poeticizing the blues, but literary blues tend to read like bad verse rather than a good song. The true spirit of blues, Oliver argues, inevitably eludes the self-conscious imitator. Langston Hughes was the first to solve these difficulties. He successfully created a poetry that captures the essence of blues performed while effectively preserving its qualities as poetry. In doing so, he solved two problems: how to write blues lyrics that would work on the printed page, and how to exploit the blues form without losing its original feeling.\n\nThere are many styles of blues, but for Hughes the most important distinction was between folk blues and classic blues. It has been a commonplace of criticism that Hughes took classic blues as his primary model — that classic blues is the best blues, and that when he imitates folk blues he is least successful, too derivative to be truly creative. In this view, Hughes’ attempts to imitate the folk style are too mannered, too much like bad acting, to succeed.\n\nBut a more practical view suggests that Hughes’ most important contribution lies in his folk artistry. As one observer has noted, all of Hughes’ poetry is deliberately written within the range of address of ordinary folk — a range exemplified by the song lyric Young Gal’s Blues, which avoids traditional poetic language. Its images are drawn from everyday life, its allusions are to common experience, and its diction is that of everyday speech. If one wants to see what Hughes’ poetry would be like had he adopted the classic blues, one can look at Golden Brown Blues: its images, allusions, and diction are conspicuously removed from the common range of address."}, {"type": "teach", "title": "④ 四题文章的方法：带着论点读论据", "ppt": ["长文多出来的是细节/论据", "用论点理解论据：细节读快一点，但不是不读", "细节会考——知道它在哪，考时找回去"], "text": ["四题文章（450 词）比二三题长在哪？**多出来的是细节和论据**。一篇四题文章压缩掉论据后，核心常常只剩二三题文章的长度。", "操作方法：**用论点理解论据**。第一段读懂 Oliver 的论点（布鲁斯能唱不能写）后，后面所有绕着这个论点的细节（“真正的精神避开模仿者”这类难句）只需 get 到性质=“还是唱行写不行”，不用死磕每个词——考场时间不允许，而且那句话最终也没考。", "**但不是不读**：细节可能考，你要做到“知道它大概什么意思、知道它在文章哪个位置”，考了能快速找回。带着论点读，速度上去，critical reading 也练出来了——重点永远在你的观点和框架上。", "复盘结构：第一段 Oliver 观点+Hughes 解决；第二段评论家共识（偏 classic)；第三段作者视角（偏 folk,Young Gal's Blues=fork,Golden Brown Blues=classic)。"]}, {"type": "q", "tag": "真题 · 主旨题", "title": "第1题 · 文章主要目的", "source": "实战三 · 四题文章", "pause": true, "stem": [{"t": "The primary purpose of the passage is to..."}], "options": {"A": "describe the influence of folk and classic blues on blues poetry", "B": "analyze the influence of Black culture on the blues", "C": "demonstrate that the language of Hughes’ blues poetry is colloquial", "D": "defend Hughes’ blues poetry against accusations that it is derivative", "E": "refute an accepted view about the style of Hughes’ blues poetry"}, "answer": "E", "explain": {"思路": "①main idea 题。②抓文章结构：第二段给了“评论家的共识(commonplace of criticism)”——Hughes 偏 classic;第三段 But 引作者视角——其实偏 folk。先立别人的观点再反驳，是 GRE 最经典的结构。③E“反驳一个关于 Hughes 诗歌风格的公认观点”正好是这个结构；C 只说了第三段的一半内容，装不下全文。", "annot": "结构图：<span class='m3'>评论家共识（偏 classic)</span> → <span class='m2'>But</span> <span class='m4'>作者：其实偏 folk</span>。主旨题答案必须能装下这个<span class='m2'>反驳结构</span>本身。", "辨析": "A 的 influence 无中生有（文章没谈谁影响谁）；B Black culture 非文章重点；C 只覆盖第三段细节（colloquial=fork 的特点），是“以偏概全”式陷阱；D defend against derivative——批评家的观点不是“抄袭指控”，指责对象错位。", "点拨": "看到文章出现“some critics / a commonplace of criticism / 传统观点 + 转折”，马上反应过来：主旨=反驳这个 accepted view。这是比主语句更能预判答案的结构信号。"}}, {"type": "q", "tag": "真题 · 功能题", "title": "第2题 · 高亮引文的作用", "source": "实战三 · 四题文章", "pause": true, "stem": [{"t": "The author quotes Oliver’s statement that “blues are meant to be sung, not written” primarily in order to..."}], "options": {"A": "show how blues poetry should be presented", "B": "emphasize the difficulties faced by poets who attempt to write blues", "C": "support the view that blues poetry is a doomed form", "D": "indicate that the obstacles to writing blues are insurmountable", "E": "suggest that written blues is less authentic than sung blues"}, "answer": "B", "explain": {"思路": "①这是“文中某信息的功能”题——看它在上下文里干什么，不看它本身对不对。②定位首句：Oliver 说布鲁斯能唱不能写 → 第二句“想写诗化布鲁斯的人试图避开这些问题——但写成了坏诗”→ 第三句“真正的精神避开模仿者”→ 第四句 Hughes 解决了这些困难。引文的作用=引出“写布鲁斯难”这个话题，为 Hughes 的解决做铺垫。③B“强调试图写布鲁斯的诗人面临的困难”正是它在上下文中的功能。", "annot": "功能链：<span class='m3'>能唱不能写（引文）</span> → 写诗会写坏 → <span class='m4'>困难存在</span> → Hughes 解决了困难。引文是为“困难”和“解决”服务的引子。", "辨析": "E 是内容本身（唱比写正宗）——但这是 Oliver 的观点，题目问的是**作者**引它的目的；功能题必须分清“谁说的内容”与“作者为什么用”。A“展示布鲁斯诗该如何呈现”引文没展示；C/D 的 doomed/insurmountable（注定失败/不可克服）都被第四句“Hughes 解决了”直接推翻。", "点拨": "功能题的终极问题：这句话在上下文里“干什么活”。答案一定描述它在逻辑链中的角色（引出困难/支持论点/反驳观点），而不是复述它说了什么。"}}, {"type": "q", "tag": "真题 · 细节题", "title": "第3题 · Young Gal's Blues 的特点", "source": "实战三 · 四题文章", "pause": true, "stem": [{"t": "It can be inferred that, compared with Golden Brown Blues, Young Gal’s Blues is..."}], "options": {"A": "more colloquial", "B": "more melodious", "C": "richer in allusion", "D": "more conventional", "E": "more derivative"}, "answer": "A", "explain": {"思路": "①审题：比较题，对象 Young Gal's Blues 相对 Golden Brown Blues。②定位最后一段：Young Gal's Blues=folk（用日常形象、共同经验典故、日常话语措词）;Golden Brown Blues=classic（其形象/典故/措词“conspicuously removed from the common range”=远离日常）。③folk 相对 classic=更口语化。", "annot": "标签对照：<span class='m3'>Young Gal's Blues = fork = everyday speech</span> ↔ <span class='m3'>Golden Brown Blues = classic = removed from common range</span> → <span class='m4'>更口语</span>。", "辨析": "C richer in allusion 是 Golden Brown 的属性（张冠李戴+方向做反）;B melodious 旋律优美、D conventional 传统（=classic 的特点）、E derivative 模仿的——全是 classic 端或无中生有的词。", "点拨": "比较题先给两个对象贴标签（folk/classic)，再看选项的词属于哪个标签——归属错了直接排除。不认识 allusion 也能做：记住它在文中的位置是描述 Golden Brown 的。"}}, {"type": "q", "tag": "真题 · 推断题", "title": "第4题 · 两种布鲁斯的共性", "source": "实战三 · 四题文章", "pause": true, "stem": [{"t": "According to the passage, Hughes’ folk blues and classic blues share which of the following characteristics?"}], "options": {"A": "They are directed at the same audience", "B": "They are both written forms", "C": "They make no use of colloquial language", "D": "They were composed for professional performers", "E": "They are performed in the same style"}, "answer": "B", "explain": {"思路": "①审题：问 folk 与 classic 的**共性**——先看文章哪里谈共性。②定位：第二段开头就说两者的 distinction（区别），往下找共同点只有一条线索：往上一个层级——两者都是第一段引出的 **blues poetry**（诗=写下来的文字）。第一段 Oliver 的核心就是“布鲁斯能唱不能写”，而这两者都是“写”的产物。③B“都是写出来的形式”。", "annot": "逻辑定位：第二段=<span class='m5'>区别</span> → 共性只能往<span class='m4'>上一层</span>找：两者都属于 <span class='m3'>blues poetry（写出来的）</span>。", "辨析": "A 同一受众——folk 对普通人，classic 不是；C 不用口语——恰恰相反（folk 就是口语）;D/E 无中生有。", "点拨": "本题最难的一步是“去哪找”：共性不在讲区别的地方，而在两者的上位概念。逻辑层次（上位/下位）是 GRE 阅读的定位利器——这道题做完你才真正掌握“带着论点读论据”。"}}, {"type": "passage", "title": "实战四 · 一题文章（逻辑推理：削弱题）", "source": "先自己做：1 题 · 新题型体验：选项正确，对文章的影响", "text": "There are many structural and topical similarities between Piers Plowman, written by Langland, and the House of Fame, written by Chaucer — two Middle English poems relating dream visions. Some critics argue that, because of the many uncommon similarities between the poems, and because Piers Plowman may have preceded the House of Fame, Chaucer was most likely influenced by Piers Plowman when writing the House of Fame."}, {"type": "teach", "title": "⑤ 逻辑推理题（Logical Reasoning）初体验", "ppt": ["题型：选项如果正确，对文章论证产生什么影响（本题=削弱）", "文章结构：事实（相似）+ 推测（L 影响 C）", "削弱思路：给结果提供另一个原因"], "text": ["这道题代表一个**复古题型：Logical Reasoning**——2002 年前考过、2011 年 8 月恢复。它和传统阅读最大的不同：**文章里的论证未必成立，问题问“哪个选项如果正确，会对论证产生什么影响”**（本题为削弱 weaken)。", "分析论证结构：批评家的推理=两诗有许多罕见的相似（事实）+ Piers Plowman 可能写在前（事实）→ 推测出“Chaucer 受其影响”（**most likely=猜测**)。", "老师的经典类比：**看到地面湿（事实），推测下过雨（推测）**。事实无法反驳，但推测可以——“其实是洒水车经过”给出了地面湿的另一个原因，下雨这个解释就被削弱了。回到本题：两诗相似是事实，但“L 影响 C”是推测 → 给相似提供**另一个来源**（第三方的共同来源）即可削弱。", "后面第 19-20 讲会系统讲解这个题型，今天先建立直觉。"]}, {"type": "q", "tag": "真题 · 逻辑推理 · 削弱", "title": "削弱批评家的论证", "source": "实战四 · 一题文章", "pause": true, "stem": [{"t": "Which of the following, if true, would most seriously weaken the critics’ argument?"}], "options": {"A": "Piers Plowman is Langland’s major work, whereas the House of Fame is one of Chaucer’s minor works", "B": "Fewer than three manuscripts of the House of Fame survive", "C": "Because Piers Plowman is well known, its similarities with the House of Fame have often been noted", "D": "Many of the themes and structures of Piers Plowman are also found in Latin, Italian, and French works with which Chaucer was familiar", "E": "There is no evidence that Chaucer and Langland ever met"}, "answer": "D", "explain": {"思路": "①论证链：两诗罕见相似（事实）+ Piers Plowman 在前（事实）→ Chaucer 受其影响（推测）。②削弱=攻击推测：给“相似”另一个原因。③D:PP 的主题结构也大量出现在乔叟熟悉的拉丁/意/法作品中 → 两诗相似可能来自共同第三方来源，而非直接影响 → 推测被削弱。", "annot": "削弱点：<span class='m3'>相似（事实，不可攻击）</span> → 攻击 <span class='m4'>“L→C 影响”这个推测</span>：引入 <span class='m4'>共同来源（拉丁/意/法作品）</span>。", "辨析": "A 主次作品与相似原因无关；B 手稿数量无关；C“相似常被注意到”——注意到相似不等于造成相似；E“没有证据见过面”——影响可以不经见面（读作品即可），见过不是必要条件。", "点拨": "削弱题三问：①论证由什么事实+什么推测组成？②事实打不得，只打推测；③怎么打？给同一结果换一个原因（他因）。洒水车的故事记牢，这类题都这个骨架。"}}, {"type": "ext", "title": "本讲复盘 · 方法清单", "ppt": ["读文章：第一句慢读定 topic → 信息+逻辑 → 带着论点读论据", "做题：审题（角度！）→ 定位 → 选项对应", "长难句：抓逻辑猜词（commence=begin · spurt≈突增）"], "text": ["**四篇文章的方法沉淀**:①首句慢读，抓 topic 和方向性；②生词多不怕——靠逻辑猜（spurt 靠 whereas 对比猜出=decline 的反义；commence 靠 86%/77% 平行结构猜出=begin);③信息换标签（empiricism ↔ socially constructed;fork ↔ classic)，选项对标签；④细节题先问“去哪找”——共性往上位找、原因往下位找；⑤功能题问“它在上下文干什么活”；⑥削弱题打推测不打事实。", "**自查**:四篇共 10 题，一次通过率低于 70% 的部分，对应去补：主旨/功能题弱→第14-15讲（宏观类）；细节/推断弱→第18讲（微观类）；削弱题懵→第19-20讲（逻辑推理类）。", "**下一讲**:《文章分析-综述》之后进入逻辑分析系列——本讲用到的所有逻辑（对比/让步/并列/主次）将逐条展开。"]}], "transcript": "hello同学你好，这里是GRE阅读理解课程当中的第二节课阅读方法。我们首先会把其中最核心的方法放在这里来讲，告诉各位去解决g2阅读理解需要什么样的方法和做题的技巧。在此基础上，后面的课程当中，我们会把其中涉及到的做题方法的能力给大家细化。首先，第一个问题我们来讲一下关于做题的流程，先干什么再干什么，这个非常的重要。在此给出大家g2阅读的做题流程是先看文章再做题，在做题的过程当中，如果发现有一些信息不确定的话。回到原文和文章做对应。看到此为止，有很多同学会有一些疑惑，以前我所参加的考试，比如说托福啊，或者国内的四六级考试啊，甚至是中考或高考。很多时候，我的老师可能告诉我，是可以先看题，直接拿题去文章找的，而不用先读文章啊。那为什么在GRE里需要先去读文章再去做题呢？好在这里我们涉及到了，对于这个流程。它背后的原则的一个分析。之所以这么做，主要在于第一考察文章整体的理解以及逻辑的能力。在上一节课当中，我们分析到了GRE阅读理解，对于我们考生能力的需求，也就是我们要有一个critical reading的能力，我们有批判性的。阅读理解能力在这里整体的理解，以及对于文章逻辑的把控非常之重要。第二，考试的题目也不一定按文章的行文顺序。很多以前我们参加过的考试，比如说大家可能最近的就是托福。托福考试里面的特点是它的题目是按文章行文顺序走的，大部分都是这样，但是在GRE里不一定。有的时候出题的角度也不是那么简单的，好像一个定位就能解决的题，它还是要和整体和逻辑能力产生关系。由于这样的特点，致使如果我们直接读完题，再去对文章，哪怕很快能找得到，但题不一定做得对。所以就是因为今儿阅读的这种批判性阅读的整体的特点，导致我们需要先看文章，再来做题。在这里我们也谈一下关于文章和题目，需要大家注意的问题在哪？在流程，你明白了，应该是先读文章再来做题的情况下，我们来谈一谈文章和题目，分别需要大家注意什么？首先说文章。文章的第一个问题，我们来谈出题。如果我们是出题人，我们需要做的事情就是先选择出材料，再来进行删改。所谓的选材呢？就是我要选择适合GRE考试的材料才可以。那我在哪儿选择呢？首先选择的对象一定是指定的学术期刊。GRE由于出过很多类型的文章，所以他们对于自己想出题的期刊是有一个把控的，但一定是学术期刊，这样的话很符合GRE考试当中文章的特点。接下来的话呢，他会用工具source finder进行对于文章的打分来看这个文章，它是否符合我们的要求？在选材结束之后，接下来要对于选择的材料进行删改，因为大家可以发现一个问题，一篇学术文章在。怎么可能，最多才450个字啊，还记得上一节课当中，我们曾经谈过GRE的文章，一体的文章，50词左右。四体的文章，450字左右。我们感觉我自己随随便便写一个paper也不止450个词啊，那怎么到最后我们考的文章只有450个词最多呢？那是因为在其中我们要进行删改。从出题的角度来讲的话，首先它要删除例题无关紧要，以及不符合GRE考察范围的信息。同时呢，要改动为g2e考试的难度以及。与测试能力要相匹配，这就是从出题人的角度要进行删改的结果，所以你看到的文章是基于原文的基础上做了改动之后的结果。而改的目的就是为了测出大家在GRE当中应该具备的那些能力。在出题大家大概了解了之后，接下来从我们做题的角度，我们就应该去理解文章，做到comprehension，然后才能够去做题。在理解文章当中，我们要把理解拆成这么几个部分，其中会涉及到。信息和逻辑，也就是说，我们把文章看成是这么两个部分的结合信息，我们可以把它定义为词义和句意，这样的表意的基本单位。尤其是针对于常考到的二题和三题的文章，很多时候它只有一段的情况下，那么句子就可以作为一篇文章中语义的基本单位。那当然呢，句子里的词汇也是非常重要的，我们把它看成了是信息的基本单位之后，接下来要注意的是它们之间的关联。所以逻辑指的是词汇句子和段落之间的关系，词与词之间什么关联，句与句之间什么关联，段与段之间也是什么关联。这些都是需要我们去掌握的，通过对于信息的理解，加上对于逻辑关系的掌控，合在一起，就对于整篇文章有一个理解了。我们之前也说过，从信息理解的层次啊，在上一节课谈到的能力里面，从小到大有理解词义。句意段意larger body那些更大的部分，比如说一个section有几个段落构成，甚至是整篇文章。其实这些信息的理解，我们可以把它量化成眼前看到的这些。词句是基础，我们知道段落其实是由句子加逻辑构成。而文章是由段落和逻辑关系构成的，也就是段和段之间是什么关联组合在一起，句和句之间加上关系就组成了一个段落，所以说我们就要去理解词义和句意这样的基本的单位。这是我们需要去理解的一个方向。在这里，我们还要重点去谈一下关于逻辑性。这是在g2阅读理解当中非常重要的一个能力。逻辑是可以帮我们建立文章的整体框架的，整体的框架我们可以用一个单词叫framework。也就是关于这篇文章的整个的framework是非常关键的。尤其针对于GRE这种critical reading，对于整体的把控非常之关键。有很多同学在自己考托福的时候，应该还记得在托福阅读里最后一道题目，也就是那个summary。summary这个题本身在能力要求上也是需要大家去掌握整篇文章的mental framework，就是你在思想上想法上要有一个关于文章的框架。这个很关键，同时呢，逻辑也可以帮助我们理解信息，比如说举例关系，一旦举例关系存在，那就可以通过其中的一个信息帮忙理解另外一个信息。假设s代表sentence的缩写，这里有两句话，第一句话和第二句话，而第二句话的开头用到了for example这个逻辑词。出现了这个逻辑词组之后，前后是举例关系，那么假设在这里，这句话我读的很懂，但是我发现第二句话信息量有点大。而且里面出现了很多我不认识的词，怎么办？逻辑就能帮助你知道两者关系的情况下，大概知道第二句话在讲什么，因为甭管怎么写，前后两句话的大意是一样的。只不过一个是概括一点，一个具体一点，而且它是用来支持它的，知道这个逻辑性对我们理解信息就够了。假设前面讲到的是中国有很多美食好，接下来举例的话，甭管后面怎么写，写的一定是在中国的一些具体地方的，具体的饮食。这就给我们前面进行了一个支持，但同时你也知道，通过前面讲美食的，通过举例子，后面的答疑也还是讲美食。所以逻辑关系，帮我们抓整体，帮我们理解意思，这是它的非常重要的作用，后面我们会把逻辑的这些能力发挥到极致。同时，在文章里面，我们需要讲一个额外的东西，是关于话题，因为在选材的过程当中，一篇文章还是要有一个讲到的科目和对象。在这里，GRE的文章所考察到的话题的科目来自于如下的四个，分别是自然科学。生物科学，社会科学以及人文学科。这些都是在整个GRE选择topic的时候会去参考的，一些话题的来源角度。所以对于各位来讲，如果我们备考这个考试需要注意什么？有人说我是不是需要把这些都看一看，以官方的角度来说。并不要求我们掌握所谓的科目的背景知识。但是我们学到了现在这个阶段，起码是个本科生的情况下，我们是不是对于这些学科或科学有一些自己的接触和了解？如果你完全不知道的话，可以说在考场上还是会影响到自己的一些答题状态，所以给大家的建议就是。如果发现某些学科可能会稍微弱一点，平时在阅读的过程当中可以去多读一下相关的话题的文章，尤其是我们练习题目里的这些文章。对于其中有一些常见的词汇，大家也是可以熟悉一下，这样的话以后再碰到相关的词汇的时候，你不会觉得很难。比如说有的时候在自然科学当中会考到天文学，在天文学里边会涉及到一些星星啊，这些拼写词我要说到星星，你能想到什么？不是动物园里的那个，而是天上挂着的那些。那你可能会想到所谓的行星啊，恒星啊，还有其他的各种行星，什么超新星啊，脉冲星啊。白矮星啊，红巨星啊，等等，比如说这些概念真会考吗？我们见到的文章里这些词还真的出现过，所以说如果你能够知道一些单词的基本拼写，对于你理解文章还是有帮助的，但是最起码你是不是应该得知道一个词儿叫star？表恒心啊，是吧？小的时候听过一首歌，叫twinkle twinkle little star。还是挺科学的，因为恒星还是可以发光的嘛，在那一闪一闪好开个玩笑，但是在这里其实给各位所贯穿的一个理念就是相应的学科，如果你理解对于你做题还是有很大的帮助。好，接下来在文章分析完之后，我们来看一下关于题目里需要你注意的问题。首先第一个是出题跟文章一样，从出题人的角度怎么选取文章，那么在题目的角度怎么出题呢？首先，一定要根据阅读能力的要求。前面我们谈到阅读理解测试，一个研究生或者叫准研究生，他应该具备的能力，那在这个时候，题目就应该反映出这个学生应该具备的这个能力。同时啊，你还要根据改编后的文章去出题，基于改编之后的那个文章去出。符合阅读能力的这些题目，这就是出题的思路。那我们怎么做题在这里简单来说就是第一个事情审题审题是一个非常关键的步骤。很多人在做以前的阅读理解的时候发现，审题是一个一带而过的事情，很简单，很仓促，很快就过去了。而那个时候，对于我们来讲，可能还没有什么影响，因为那个年代的阅读说实话。很多时候，题目的影响并不大，就一带而过，没有什么太大问题。但是在GRE里，你会发现阅读本身可能信息量很大。而且往往可能是一个角度就干扰了你这道题做题的方向，所以审题非常的关键，我在这里给大家举一个这样的例子，比如说有一辆公交车从始发站上来38个人。下一站下去，两个上来，十个人再下一站上来，三个人下去，五个人再下一站上来，三个人下去，四个人请问车开了几站了？很多开始在那算是吧，算这个上面载了多少人，但其实问几站也是合理的，所以审题是一个非常关键的事情。不过刚才这个公交车载人事件，相信各位可能听过这个段子，但其实这个段子就是为了提醒你问题，只要基于文章信息怎么问都可以。所以看懂问题的角度非常关键。看懂问题之后，接下来要做一个事情叫定位，因为你要把问题和文章去结合在一起，这个过程就叫定位。因为所有的题目均是考来自于文章的信息，那你如何把这个问题和文章做对应？这个过程就叫做把它定回到原文当中这个位置。不过很多时候，对于GRE的阅读是你读懂了文章之后，看到了问题，你直接就思考出来了，这道题的解题角度，这也是一种定位。或者说这道题，你拿它去文章里找，这也是一种定位，所以所谓的定位方式就是问题和文章的一种结合，起码要知道这道题考察到的对象在文章的什么地方。接下来的话，在你有了文章的信息之后，就是我通过问题知道他问到的信息就是文章中的这个地方的信息，我拿这个信息来判断一下选项看。看谁对谁错， 句意和词意，一个是逻辑分析这个部分。这两大块儿将会在接下来的课程当中给大家详细展开，这就是我们本节课的内容。从下节课开始，我们将仔细分析逻辑关系。"}, {"id": 4, "title": "第4讲 · 逻辑分析1-综述（方向与结构两大角度）", "intro": "逻辑系列开篇。老师把“逻辑=词句段之间的关系”切成两个可操作的角度：**方向**（同向/反向）和**结构**（相似/主次）——后面 5 讲全部在这张 2×2 的地图上展开。本讲含金量最高的洞见：and 只保证结构相似，方向根本不保证（“善与美”同向，“善与恶”也成立）——读文章时方向必须看前后信息，不能靠连词想当然。", "cards": [{"type": "teach", "title": "① 逻辑的两大角度", "ppt": ["方向：同向 / 反向", "结构：相似（地位平等）/ 主次（上下级）", "对应 OG 能力：信息一致还是对立 · 谁是 major 谁是 minor"], "text": ["结合官方能力要求，逻辑从两个角度切入：**方向**——信息之间是同向还是反向（对应 OG 的“信息是一致还是对立”);**结构**——相似还是主次（谁是 major 谁是 minor，信息是平级还是上下级）。", "这两大角度基本涵盖了 OG 能力模型里对逻辑的要求，也是后面所有文章分析的工具箱：第5-7讲展开方向（同向、反向、对比对立、让步转折），第8讲结构-相似，第9讲结构-主次。"]}, {"type": "teach", "title": "② and：只保证结构相似，方向根本不保证", "ppt": ["and = 并列/共存（结构相似）", "方向？“善与美”是同向，“善与恶”也成立！", "方向要精准：and also（同向）/ and yet（反向）"], "text": ["例：a ___ b,中间用 and 连接。结构上是**相似**（并列、共存，地位平等）——这个没有争议。但**方向呢**？多数人脱口而出“同向”——错。", "中文例子秒杀：善**与**美（同向）成立；善**与**恶（反向）也成立！and 连接的两个词完全可以一好一坏。所以 and 只表达“共存”，不承诺方向。", "**怎么让方向精准？** 表同向加 also → **and also**（也）；表反向加 yet → **and yet**（然而）。拆开看：and 管结构（并列）,yet 管方向（反向）——共存的双方方向相反。", "考场上 and 后面省掉了 also/yet 时怎么办？**看 and 前后的信息本身**判断方向——好词+好词=偏 and also；好词+坏词=偏 and yet。不做简单判断，就是本讲最重要的纪律。"]}, {"type": "teach", "title": "③ for example：方向同向 + 结构有主次", "ppt": ["方向：论点与例子讲同一件事（同向）", "结构：论点为上、例子为下（例子支持论点）"], "text": ["对比第二个例子:a for example b。a 多为论点、b 是它的例子。", "**方向**：举例关系下，例子和论点说的是同一件事（例子具体化论点）——一般同向（除非举反例）。**结构**：有上下级——论点是“上”，例子是“下”，例子的存在意义就是支持论点。", "所以 for example 一出现，立刻读出两层：大意跟着论点走（方向），例子不用逐词死磕（结构上是服务者）。这正是第2讲“用逻辑帮理解信息”的正式版理论。"]}, {"type": "teach", "title": "④ 总方法：有词看词，无词看关系", "ppt": ["逻辑词是关系的信号；没有词，信息本身的关联就是逻辑", "用逻辑把信息串成一个整体"], "text": ["逻辑词（and/for example/but/however…）是逻辑关系的信号；**没有逻辑词时，信息之间的关联本身就是逻辑关系**——都可以通过逻辑去分析信息的意思。", "逻辑的最终作用：把散落的信息**串联成一个整体**。这就是“带着逻辑读文章”的全部含义——也是第3讲“句+逻辑=段、段+逻辑=篇”的操作化。综述完毕，下面进入逐条精讲。"]}, {"type": "q", "tag": "随堂检测", "title": "第1题 · and 能保证什么？", "source": "第②节 and 的深讲", "pause": true, "stem": [{"t": "由 and 连接的两个信息（a and b），可以确定的逻辑关系是？"}], "options": {"A": "方向同向", "B": "方向反向", "C": "结构相似（并列、共存）", "D": "以上三者都能确定"}, "answer": "C", "explain": {"思路": "and 只承诺结构上的并列共存；方向可同可反——善与美（同向）、善与恶（反向）都成立。唯一能确定的是结构相似。", "annot": "and 的语义 = <span class='m4'>共存</span>（结构相似）;方向 = <span class='m5'>看前后信息</span>。", "辨析": "选 A/B 都是“想当然”式错误——本讲就是来治这个毛病的。", "点拨": "以后每见到 and，先问结构（并列✓），再问方向（前后是好+好还是好+坏）——两步走，缺一不可。"}}, {"type": "q", "tag": "随堂检测", "title": "第2题 · 方向的精准表达", "source": "第②节 and also / and yet", "pause": true, "stem": [{"t": "想表达“共存的两个东西方向相反”（例如：这件事有好处，___ 也有坏处），最精准的形式是？"}], "options": {"A": "and", "B": "and also", "C": "and yet", "D": "also"}, "answer": "C", "explain": {"思路": "结构要并列→and；方向要反向→yet。and yet = 共存的双方方向相反，正好表达“好处和坏处并存”。", "annot": "分工：<span class='m3'>and</span>=结构并列 · <span class='m4'>yet</span>=方向反向 → <span class='m4'>and yet</span>。", "辨析": "A and 方向不明；B and also 方向同向（也）；D also 只有方向没有结构。", "点拨": "and yet 这个表达很多人没见过——拆开理解（and 管结构 yet 管方向）就不再陌生。这也是 GRE 文章里常见的转折变体。"}}, {"type": "q", "tag": "随堂检测", "title": "第3题 · for example 的两层逻辑", "source": "第③节 举例关系", "pause": true, "stem": [{"t": "for example 连接论点（上句）和例子（下句）时，方向与结构的关系分别是？"}], "options": {"A": "方向同向；结构有主次（论点为上，例子支持下位）", "B": "方向反向；结构相似", "C": "方向同向；结构相似", "D": "方向反向；结构有主次"}, "answer": "A", "explain": {"思路": "举例方向同向（例子具体化论点，讲的是同一件事）；结构有主次——论点是上、例子是下，例子的功能就是支持论点。", "annot": "for example：<span class='m3'>方向=同向（具体化）</span> + <span class='m4'>结构=主次（例服论）</span>。", "辨析": "选 C 是只看出“讲得差不多”，漏了层级；B/D 的方向完全错。", "点拨": "一看到 for example：大意跟论点走、例子扫性质——第2讲“用论点理解论据”的理论依据就是它。"}}, {"type": "ext", "title": "本讲复盘 + 预告", "ppt": ["2×2 逻辑地图 · 下讲：方向与反向、对比对立"], "text": ["**带走一张图**：逻辑 = 方向（同向/反向）× 结构（相似/主次）。任何句间关系都能放进这四个格子——and（结构相似/方向不定）、for example（同向/有主次）、however（反向/结构看情况）……", "**回读第2讲四篇实战**：青春期文两个 however=反向；人类学文 1970 前/后=反向+时间对比；休斯文“共识→But”=反向+主次；削弱文“事实vs推测”=结构主次（论据服务于论点）。四篇全是这张地图的应用。", "**下讲预告**:《逻辑分析2-方向·反向·对比对立》——开始逐条展开方向关系，含对比（contrast）与对立（opposition）的细分。"]}], "transcript": "这里是GRE阅读理解的第四节课，从这节课开始，我们将会分析一下文章的逻辑关系。今天是第一小部分关于逻辑部分的综述。之前我们所谈到的是逻辑，指的是文章中词句段之间的关系，在这儿呢，结合官方的能力要求，结合我们分析的角度。我们可以把逻辑从这两个角度切入，分别是信息的方向和它们的结构的关系。方向的话呢，主要还是相同还是相反的问题，我们取同向和反向在第一节课讲能力的时候就谈过信息之间呢，到底是一致的呢，还是有对立的，这就跟我们的同反向有关联。同时呢，在下面我们也会谈到结构上的相似和主次性。很多所谓的结构上的关联，比如说谁是major，谁是minor，两者信息到底是上是下，这些其实就是相似和主次这两个。两种逻辑相似，指的是地位平等，主次是有上下级，所以我们就把逻辑从这两个角度进行展开。分别是方向上的同向，反向以及结构上的相似和主次，这两大角度基本上可以涵盖前面在官方给出来的能力当中要求的那些能力。也对于我们分析文章是有很大的帮助的。在这呢，我具体给大家举一些例子，我们来感受一下什么是方向和结构上的关系，比如说如果a和b信息中间用了and这个词表达了什么样的逻辑呢？如果说结构的相似还是主次的话，相信我们都知道，当and连接前后两种，它的地位是相似的。但如果问你方向的话，是同还是反？很多人会说应该是同向的吧？a and b两者不都是好的，或者都是坏吗？不一定，这里请大家注意，and只能是结构上的相似，或者是更精准一点，这两者共存，但其实共存的双方是。同一个方向吗？不好说，假设a是中文的话，善这个字。后面的and是与如果我给你个空格，你会添什么？你可能瞬间就明白了，你天善于美。是可以的，同向你填善与恶，是不是也可以呀？此时是反向，所以其实方向和结构关键还是看逻辑词，或者有的时候没有逻辑词。就看两个信息的关联就可以了，所以不要做简单判断，就是and因为在英语当中。and这个词结构上确实比较相似，但要是说语义或方向上的关系，有的时候加一些词可能实现的更精准。比如，想实现同向关系，你可能在这里加上一个表语义关系的词叫也also。如果你要想表反向，你可以写一个这样的词在后面叫and yet。可能很多同学没见过这个表达，哎，怎么还有个逻辑表达叫and yet呢？但如果你能够分析清楚这两个词各自的功能，就很容易明白。and表示结构上双方是相似的，切是并列或者是共存的特点，而yet告诉我们是语义或方向的关系，是反向的，也就是说共存的双方。其实是反向的，如果前面是一个好词，那后面是坏词，这如果是个好词，后面也是个好词，所以很多时候这个词可能同时要充当，如果只给一个词叫and的话。它同时要充当and also的功能，或者充当and yes的功能，它把这个词可能省掉，但是你可以根据and的前后来判断。它到底是偏这个呢？还是偏这个呢？所以给了一个这样的小例子，就是由and这个单词判断方向和结构上的关联好，再来举一个例子，比如a和b的信息的关联是for example的话举例。那么，我们可以看到的是，如果是举例的话，当然还有一种情况就是举反例等等，但是一般能出现for example的话。观点和或者论点和例子之间的关联应该是同一个方向，也就是两者讲的事儿差不多，不会出现对比的反向。而它的结构上的关系，由于a在文章中更多偏向，于是一个论点，而b是它的例子的话。在文章中，两者是不是有上下级呀？例子什么作用？就是用来支持论点的，所以说它的存在应该是更下一句它用来支持论点。所以这个时候在结构的关联当中，有上下级有了主次性。在这呢，我们给了and和for example这两个例子是为了告诉各位，其实我可以通过这些逻辑词，有的时候可能没有逻辑词。那背后其实不管有没有逻辑词，都是逻辑关系，我可以通过逻辑关系来分析文章信息的意思，把它们串联在一起，形成一个整体。这是逻辑对于我们的作用是什么？所以在读文章的过程当中，小伙伴们就得去掌握逻辑关系，怎么应用进去？所以在综述之后，接下来就是我们具体把这个逻辑关系给大家呈现出来的部分了。"}, {"id": 5, "title": "第5讲 · 逻辑分析2-方向·反向·对比对立", "intro": "逻辑体系正式展开：方向→反向→对比对立。本讲四大干货：①对比对立 vs 让步转折怎么分（榴莲例题）；②共存与取舍（拳击模型：whereas/while 共存，instead/rather 取舍）；③作者最爱的驳论套路“先后众寡表里”；④but 的三重内嵌逻辑（but also / but rather / but nevertheless）——为什么 but 万能。配 4 篇真题实战（共 5 题）。", "cards": [{"type": "teach", "title": "① 逻辑体系图 + 为什么主攻反向", "ppt": ["逻辑 = 方向（同/反）+ 结构（相似/主次）", "反向 = 对比对立 + 让步转折", "同向较杂：除掉反向，剩下的就是同向"], "text": ["方向分同向和反向，二者**互斥**（是同向则不是反向）。课上主攻**反向**——同向关系比较杂，凡是分析不出反向的地方，默认归同向即可。", "反向的两种：**对比对立**（本讲）和**让步转折**（下两讲）。先学对比对立。", "**对比 vs 让步怎么分**（用“我喜欢吃榴莲”测试）:①对比=同一件事上双方不同——“我喜欢，他不喜欢”或“我喜欢榴莲，不喜欢苹果”（同对象/同话题，态度对立）;②让步=**换话题或换程度**——“我喜欢吃，但吃多了上火”。分不清时归为“大反向”就够，不影响做题。"]}, {"type": "teach", "title": "② 词源与词块：counter / concede / 万能反向词", "ppt": ["counter 柜台→面对面→对立；contra-/ contro- 同源", "concede 承认 ≠ 认为：有点道理但不站队 = 退一步（concession）", "although / while / whilst（虽然）· but / however / yet（但是）=万能反向词"], "text": ["**counter**（柜台）：买卖双方隔着柜台面对面站 → 动词=对立；演化出前缀 **contra-/contro-**（对着），contradiction/contrary/contrast 都是它。", "**concede（承认）≠认为**：汉语里“承认”是“你说得有点道理，但我真正的观点是认为”——所以 concession 表逻辑=**退一步**（让步的入口，下讲展开）。", "表达反向的**万能词**：虽然=although/while/whilst;但是=but/however/yet。它们既可以是对比也可以是让步——**见到词只确定了“反向”，具体哪种要看前后信息**（和第4讲 and 的纪律同款）。", "逻辑词是显性手段；没有逻辑词时，信息本身的隐藏关联也是逻辑（逻辑也有显性和隐性）。"]}, {"type": "teach", "title": "③ 共存与取舍：拳击模型", "ppt": ["共存：whereas / while（双方同时在场对比）", "取舍：instead（取代）/ rather（相反）——一倒一站", "rather than / instead of / on the contrary / by contrast / conversely / alternatively", "on one hand … on the other hand = 镜像对立，不是“第一第二”！"], "text": ["对比像拳击：**共存**是开打前两人面对面（同时存在、互相映衬）,**取舍**是打完一个倒下一个站着（一取一舍）。", "**共存**:whereas/while——“a 喜欢，b 不喜欢”，双方在同一个点上对着干。", "**取舍**:instead（取代）/rather（相反）。句式：把 A 废掉，句号，**Rather**,B 顶上——“I don’t like apples. Rather, I like bananas.”（否定苹果、留下香蕉）。**rather than / instead of** 同理：B rather than A=要 B 不要 A。有人说 rather 在“not apple = banana”里表等价——在这个语境下苹果与香蕉互为补集才成立，rather 本义仍是相反。", "**都可表对比的**：on the contrary（共存取舍皆可）、by contrast、in contrast、conversely、**alternatively**(alter 词源=other!GRE 里当 other 理解——写作 argument 找“其他原因”就是 alternative explanation)。", "⚠️ **on one hand / on the other hand 不是 first/second!** 两只手镜像对称=方向可能相反的对立；用它写“第一第二”是用错了。（严谨说 on one hand 比 on the one hand 更合逻辑：先不定左右，另一只手才是 the other。)"]}, {"type": "teach", "title": "④ 作者的驳论套路：先后 · 众寡 · 表里", "ppt": ["先后：传统过去 vs 现在最近（斜体年份帮你定位 now）", "众寡：大众/专家观点常被作者驳（commonplace!）——但要看完整体走向", "表里：看起来 vs 实际上——in fact / in actuality / in reality / in essence / as a matter of + 表“实际”的名词"], "text": ["学术文章的常见对比架构：**先后**（过去的传统观点 vs 现今的新观点——注意文章开头斜体年份，不然 now 不知道是哪个“现在”，天文学这类学科尤甚）。", "**众寡**：大众观点（common/popular/widespread）往往被作者驳斥——还记得布鲁斯诗文的 critics' commonplace 吗？就是这个套路。作者也可反专家（-ist/-er 结尾的人：anthropologist/astronomer)。**纪律：看到大众观点先别急着说它错——看文章整体有没有反转它**。", "**表里**：看起来 vs 实际上。构词法一把收：**in + 表“实际”的名词**=in fact/in actuality/in reality/in essence;**as a matter of + 同族名词**(as a matter of fact/reality/truth/actuality——原理：作为一种××的存在）；副词 factually/really/truly。别死背，懂构词就能现造。"]}, {"type": "teach", "title": "⑤ 本讲最值钱：but 的三重内嵌逻辑", "ppt": ["but also：同向，后者更重要（not only… but also）", "but rather：反向取舍——前者错，后者对", "but nevertheless：让步——前者对，后者更对（never=不 less=少 → 后者“不少则多”）", "but=连接词管结构；also/rather/nevertheless=副词管方向——同现不重复"], "text": ["but 万能是因为把具体逻辑“内嵌”起来了，展开有三种：①**but also**（内嵌 also)：同向，后者更重要——not only…but also 就是；②**but rather**（内嵌 rather)：反向中的对比取舍——**前面错、后面对**（拳击中前倒后站）;③**but nevertheless**（内嵌 nevertheless)：让步——**前面对、后面更对**(nevertheless 字面：never 不 + less 少 → 后面“不少则多”)。", "词性分工：but 是**连词**，管结构衔接；also/rather/nevertheless 是**副词**，管语义方向。所以 but nevertheless 放在一起不矛盾也不重复——一个管骨架一个管方向（就像 and yet)。", "平行对照第4讲：and 内嵌 also/yet,but 内嵌 also/rather/nevertheless。只给 but 时，靠前后信息判断内嵌了哪个——判断不了就按大反向处理。"]}, {"type": "passage", "title": "实战一 · 19世纪女性游记作家（contradiction）", "source": "先自己做 · 重点：三组对比 + B 选项的限定词陷阱", "text": "In writing about nineteenth-century women’s travel writing, L. Harper notes that the four women she discussed used their own names — in contrast with nineteenth-century women novelists, who either wrote anonymously or used male pseudonyms. Whereas the novelists were conscious of breaking boundaries, three of the four travel writers espoused traditional values: they avoided the radical implications of the women’s movement, did not critique the society they lived in, but let it remain as it was while accomplishing their own liberation. In other words, they lived in a kind of contradiction. Solitary activity in both the private and public spheres conferred on them an authority hitherto a male prerogative, but also precluded any collective action or female solidarity."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · contradiction 指什么？", "source": "实战一", "pause": true, "stem": [{"t": "According to the passage, the “contradiction” refers to the fact that..."}], "options": {"A": "Harper’s subjects enjoyed solitude and yet as travelers they were often among people", "B": "nineteenth-century travel writers used their own names while nineteenth-century novelists used pseudonyms", "C": "women’s movements in the nineteenth century were more radical than those after 1920", "D": "nineteenth-century women novelists saw themselves as breaking boundaries, and so did the travel writers", "E": "although solitary travel was regarded as radical, these female solitary travelers were typically traditional"}, "answer": "E", "explain": {"思路": "①定位 contradiction 所在的总结句，往前找三组对比。②对比双方始终是“女性游记作家 vs 女性小说家”这两类人的差异。③逐项核对：A 错在把对比双方偷换成“同一波人换身份”;B 是最大陷阱——内容本身对，但少了 female 限定，范围被扩大（文章只说女性游记作家/女性小说家）;D 说双方都打破传统，与第二组对比相反；E“独自旅行虽被视为激进，但这些女性独行者其实很传统”=前两组对比的准确概括。", "annot": "三组对比：<span class='m3'>真名 vs 匿名/假名</span> · <span class='m3'>打破边界 vs 尊崇传统</span> · <span class='m3'>批判社会 vs 不批判</span> → 总结：<span class='m4'>行为激进 vs 人很传统 = contradiction</span>。", "辨析": "B 与 E 的差别就是**限定词**：B 把“女性”丢了，说成全体的 19 世纪游记作家——范围扩大即错。这是GRE最常见的陷阱样式。", "点拨": "正确答案可以“不完美”:E 的前半句你不能说它错（别人视为激进，合理推断），后半句正确——在四个选项各有硬伤时，选可以对的那个。语言细节彩蛋：anonymous(a-无+onym 名）/pseudonym(pseudo 假+onym 名）;hitherto=hither（古语 here)+to=迄今。"}}, {"type": "passage", "title": "实战二 · 早期人寿保险的代理人（not…but rather…）", "source": "先自己做 · 重点：not…but rather 的取舍逻辑 + 字面猜词（glass bowl）", "text": "Early life insurers in the United States found themselves facing the problem of obtaining reliable information, as they needed to rely on applicants themselves to provide truthful answers to a standard set of questions. They attempted to personalize the relationship between insurer and individual applicant by choosing highly respected local citizens as agents. These agents were expected to evaluate candidates, unearth evidence of unhealthy family history or questionable habits, and attest to the respectability of the people writing testimonial letters. In short, the initial purpose of the agency system was not to attract customers but rather to recreate the glass bowl mentality associated with small towns and city neighborhoods."}, {"type": "q", "tag": "真题 · 推断题", "title": "第1题 · glass bowl 的言下之意", "source": "实战二", "pause": true, "stem": [{"t": "The author implies which of the following about the small towns and city neighborhoods mentioned in the passage?"}], "options": {"A": "They were places where family histories were difficult to establish", "B": "They were places where unhealthy behavior was successfully concealed", "C": "They were locations that were especially well suited for recruiting insurance agents", "D": "They offered a high degree of transparency about a resident’s personal history and character", "E": "They offered potentially fruitful markets for the life insurance industry"}, "answer": "D", "explain": {"思路": "①定位末句 not…but rather 的取舍：代理机构的目的不是招客户，而是 recreate the glass bowl mentality。②glass bowl 不认识？回到上文：agent 的职责=evaluate candidates、unearth evidence、attest respectability——把你看透。glass bowl=玻璃碗=透明的。③对应 D:transparency（透明度）正是 glass bowl 的同义转换。", "annot": "逻辑链：<span class='m3'>agent 的职责=看透申请者的历史和品行</span> → 要 recreate 的 glass bowl mentality = <span class='m4'>“人人透明可见”的氛围</span> → D 的 transparency。", "辨析": "A“家史难建立”与 agent 能 unearth 相反；B“不良行为被成功掩盖”与原文相反；C“适合招 agent”——agent 是被选来评价的，不是招募目的地；E 市场——原文 not to attract customers 直接排除。", "点拨": "rather 在这题是题眼：not A but rather B 必须读出“废立”。glass bowl 这种难词别慌——上文 agent 三连动词（evaluate/unearth/attest）已经把“透明”铺好了，逻辑给你兜底。"}}, {"type": "passage", "title": "实战三 · 二战投资与南方经济（驳论结构）", "source": "先自己做 · 重点：作者是“站一方打另一方”还是“第三方看双方”？", "text": "Many scholars believe that government investment in manufacturing in the southern United States during World War II spurred a regional economic boom that lasted into the postwar period. But these investments flowed into specialized plants, many of which were ill suited to postwar production. Massive wartime government investment expanded the number and scale of munitions facilities; by the end of the war, many such facilities — by one estimate, as many as 70 percent of those in the South — had been devoted to munitions production. Even in the North, such plants had difficulty converting to peacetime production once the war ended."}, {"type": "q", "tag": "真题 · 主旨题", "title": "第1题 · 为什么选 challenge 不选 contrast", "source": "实战三", "pause": true, "stem": [{"t": "The primary purpose of the passage is to..."}], "options": {"A": "offer an alternative explanation of a phenomenon", "B": "challenge a widely accepted position", "C": "contrast two views of a phenomenon", "D": "explain why a particular view has been influential", "E": "evaluate the evidence offered in support of a particular view"}, "answer": "B", "explain": {"思路": "①结构：many scholars believe（大众立场）→ But（作者出手）→ 数据全是作者一方的弹药。②关键判断：作者是站在对比双方的**一方打另一方**(challenge/refute/criticize)，不是站在第三方呈现双方（contrast)。③B 的 widely accepted position=many scholars' position,challenge=作者站位。", "annot": "站位判断：<span class='m3'>many scholars</span> ←<span class='m4'>But 作者（站一方驳另一方）</span> → 动词选 <span class='m4'>challenge</span>；若作者是洛基式第三方旁观，才选 contrast。", "辨析": "A“给出另一个解释”——前文没有一个待替代的解释，错在 alternative;C contrast 是最大诱惑：内容上有对比，但作者站位一方→不能选；D“解释为何有影响力”结构不符；E“评价论据优劣”不是本文干的活。", "点拨": "主旨题动词即结构：challenge/refute/criticize=站一方打另一方;contrast/compare/present=第三方摆双方。这个判别法第14-15讲（宏观类题型）还会精讲——布鲁斯诗文那篇（critics' commonplace→But）与本篇同构，可对照复习。"}}, {"type": "passage", "title": "实战四 · 女性志愿协会（while 对比 + shadow citizenship）", "source": "先自己做：2 题 · 重点：while 对比推词 + only 限定的逆向推理", "text": "While historian Nickelson regards women’s participation in voluntary associations as activities that tended to relegate women’s lives to a separate, private sphere in nineteenth-century Europe, historian Catherine Lynch sees these activities as enabling women to join with one another and to develop a kind of shadow citizenship within civil society, if not the formal state. These experiences, Lynch suggests, cannot substitute for real political rights, but they deserve more attention because they helped forge enduring bonds of community and an identity beyond domestic life. Only by limiting one’s conception of public life to formal political participation, she says, can one conclude that most women in Western society were literally consigned to a separate and private sphere."}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · Lynch 眼中的 these kinds of experiences", "source": "实战四", "pause": true, "stem": [{"t": "The phrase “these kinds of experiences” refers to experiences that, in Lynch’s view, are..."}], "options": {"A": "an early stage in women’s political participation", "B": "insufficiently appreciated for their role in public life", "C": "appropriately assigned to the private sphere", "D": "an effective means of altering political structures", "E": "historically atypical for women"}, "answer": "B", "explain": {"思路": "①定位第二句：these experiences 不能替代真实政治权利，但 deserve more attention,因为它们 helped forge enduring bonds…beyond domestic life。②Lynch 的标签：join/public(while 对比的另一端）。③B=deserve more attention（值得更多关注）的同义转换 insufficiently appreciated（未被充分重视）,public life 对应其观点方向。", "annot": "转换链：<span class='m3'>deserve more attention</span> → <span class='m4'>insufficiently appreciated</span>；<span class='m3'>beyond domestic life</span> → <span class='m4'>public life</span>。", "辨析": "A“政治参与的早期阶段”——不能替代政治权利≠是早期阶段；C“恰当归于 private”——Lynch 的观点正相反；D“改变政治结构”无中生有；E“历史上不典型”不知道。", "点拨": "deserve more attention（值得更多关注）= 现在关注不够——这个“言下之意”转换是 GRE 高频考点，见到 deserve more / has been overlooked 都要反应过来。"}}, {"type": "q", "tag": "真题 · 推断题", "title": "第2题 · formal political participation 的地位", "source": "实战四", "pause": true, "stem": [{"t": "The passage implies that Lynch would be most likely to agree that formal political participation..."}], "options": {"A": "became increasingly important as the nineteenth century progressed", "B": "is an underreported phenomenon among women in nineteenth-century Europe", "C": "was important chiefly for the community ties it helped to form", "D": "is only one component of public life", "E": "represents a kind of shadow citizenship"}, "answer": "D", "explain": {"思路": "①定位末句：Only by limiting one's conception of public life **to** formal political participation can one conclude…（只有当你把 public life 限定到正式政治参与，才会得出女性属于 private sphere 的结论）。②Lynch 显然反对这个限定 → 她的观点：public life 是更大的概念，formal political participation 只是其中一部分。③D=only one component of public life。", "annot": "末句逻辑：<span class='m2'>Only by limiting</span> public life <span class='m3'>to</span> formal participation → 才会得出 private 结论 → Lynch 反对限定 → formal participation ⊂ <span class='m4'>更大的 public life</span>。", "辨析": "A 重要性随时间增加、B 报道不足、C 主要价值在于形成社群联系——均无对应；E“影子市民的代表”——shadow citizenship 是 public 的一种，与 formal participation 不同层。", "点拨": "only 限定的逆向推理：把概念 A“限制到”B 才能得出 C → 作者反对 C → A 的范围大于 B。公式化记忆，这类题秒解。"}}, {"type": "ext", "title": "本讲复盘 + 预告", "ppt": ["对比对立全装备 · 下两讲：让步转折"], "text": ["**带走的装备**:①对比 vs 让步的分法（换话题/程度=让步）；②拳击模型——共存（whereas/while)/取舍（instead/rather);③作者驳论三套路（先后众寡表里）;④but 三重内嵌（also 同向/rather 前错后对/nevertheless 前对后更对）;⑤主旨题动词判别法（challenge vs contrast 看作者站位）。", "**回读第2讲**：布鲁斯诗文=critics' commonplace（众寡）+ But（驳论）；青春期文=两个 however 的反向链。全部对得上。", "**下讲预告**:《让步转折（上）》——concession 的“退一步”逻辑、although/despite 的精准用法，以及 but nevertheless 家族的展开。"]}], "transcript": "我们来到了GRE阅读理解的第五节课，在这节课当中呢，我们将会对于逻辑进行进一步的分析，这是逻辑分析的第二讲。在其中呢，我们会谈到方向这个部分。在上面的课程当中，我们谈到逻辑，可以把它从方向和结构两个角度来分析，在方向当中，我们也会讲到反向以及具体的。反向当中的对比对立，这么一个部分，这是这一小节课程的内容。首先呢，我们来看一下逻辑当中方向，部分的反向。有一个问题是方向的逻辑当中，除了反向之外，我们应该还记得还有同向关系，那么在这里说一下就是同向和反向，其实是互斥的。也就是两个信息之间，如果是同向，则不为反向，如果是反向，则不为同向，而且反向关系本身更值得去分析。同向关系会有一点杂，所以在这呢，我们的课上就给大家分析反向逻辑，除了反向逻辑的可能之外，剩下的逻辑就是同向关系了。在返校逻辑当中呢，我们把它包括这么两种情况，一个是对比对立，一个是让步转折，所以到此为止要注意一下我们的逻辑的体系，我再给大家画一下，这是我们的逻辑的部分。把它从方向。和结构。两个部分展开，而方向分成同和，反而反当中包括这俩对比对立和让步转折。结构我们也有结构，后面要讲到的点。所以呢，就 inly 配 but 的行文套路）、“但是”精准词族（nevertheless=后面“不少则多”)、三个词块精讲（attribute to 归因 / not so much A as B / qualify=削皮不扔掉），以及本讲最重要的一个词：qualify（削弱、限制）。4 篇真题实战。", "cards": [{"type": "teach", "title": "① 让步的本质：退一步，是为了进上去", "ppt": ["让步 = 退一步（弱化/承认对方）", "目标：转折后强上去", "让步部分作者承认对，转折部分才是作者真正观点"], "text": ["让步转折=搭配使用的逻辑：先让步（把程度弱化、承认对方有点对），再转折（但是我的真正观点在后面）。**作者没怂——退一步是为了进上去。**", "识别公式：**X，但是 Y** 中，X 是作者承认对的信息（不是作者认为错的！),Y 才是作者最终观点。可以用“对号数量”记强弱：让步信息一个√，作者真正观点两个√。", "做题意义：功能题问“高亮句的作用”，答案常是“承认（concede）了对方部分观点，为主旨转折做铺垫”；主旨题答案要落在转折后（作者观点），不是让步部分。"]}, {"type": "teach", "title": "② 「虽然」词族（让步部分信号）", "ppt": ["although (= though+all 强调) / though / albeit (= although it be)", "even if（假设）vs even though（事实常成立）", "despite / in spite of / granted / for all / 疑问词+ever (= no matter…) / regardless"], "text": ["**although** = though + all（全都，表强调）;**albeit** 是 although it be 的缩写——所以它后面接的是 be 动词后面能接的东西（形容词/副词），见到 albeit+形/副不要奇怪。", "**even if / even though**:even 表“甚至”——“甚至好人也能做坏事”自带反向；if 是假设（假定没发生），though 后面往往是已成立的事实。两词组都表“虽然”。", "**despite / in spite of / granted / for all** 都可表让步；**what/where/how+ever = no matter what/where/how**;**regardless** = regard（看管）+less（不）= 不管不顾。", "让步常不靠词：没有“虽然”只有“但是”（but/however）时，but 前面的信息就承担让步功能——看内容，别只盯逻辑词。"]}, {"type": "teach", "title": "③ 承认词与确实词：admittedly/certainly 的行文套路", "ppt": ["承认：admit→admittedly / acknowledge / recognize / concede", "确实：certainly / of course", "套路：Admittedly, A. However, B. = A 我对，B 我更对"], "text": ["**承认词**:admittedly（我承认/确实）、acknowledge、recognize、concede（第5讲讲过：承认≠认为——“你说得有点道理，但我真正的观点是认为”)。", "**确实词**:certainly、of course——“当然了，A 是对的”，接下来一个 but,B 才是我要强调的。", "这套行文的功能：作者不否认 A（反而明确说它是对的），只是和自己真正强调的对象比，A 弱一点。**见到 certainly/admittedly 开头的好话，立刻往后找 but——后面才是作者观点。**"]}, {"type": "teach", "title": "④ 「但是」精准词族：后面更重要的转折", "ppt": ["but / however = 万能（general）", "nevertheless / nonetheless = never/not+less → 后者“不少则多”", "notwithstanding（也可当“虽然”）/ still / even so（即便如此）", "精准词 specific：能换的方向不保证成立，别随便和 but 互换"], "text": ["第5讲的 nevertheless 正式归位：**never+less = 后面“不是更少的”→ 前面 A 对，后面 B 更对**——这就是让步转折（前对后更对）。nonetheless 同理。", "**notwithstanding** = not+withstanding（忍受）→ 不忍了爆发：前面忍（让步），后面爆发（转折）；也可当“虽然”用。", "**still / even so** = 即便如此/尽管这样，也是“后重”的转折。", "辨析 but/however（万能，只定反向）与这些精准词：but 能替它们，它们不一定能替 but——because 它们还附加了“后面更重要/更对”的程度信息。"]}, {"type": "teach", "title": "⑤ 三个词块精讲：attribute to / not so much A as B / qualify", "ppt": ["attribute A to B：把 A 归因于 B（B 是被归出来的原因，未必是真原因）", "not so much A as B：程度上 A 小于 B（A 还在，只是不如 B）", "qualify = 削弱/限制（画圈缩小范围）——让步转折选项高频正确答案词"], "text": ["**attribute A to B / A is attributed to B（归因）**:A 把结果归因于 B——B 是“被归出来的”原因，不一定是真原因（我认为地面湿归因于下雨）。批评别人归因，就是指出真正的原因不是 B。", "**not so much A as B** 的推导链：as…as=一样 → not as…as=不如 → not so much=程度上 A<B。所以“not so much historical as emotional”=历史意义<情感意义——**A 依然存在，只是不如 B**，不是全盘否定。", "**qualify（本讲最重）**：阅读里常考“削弱、限制、使程度变小”——画个圈，把范围缩小；和“使有资格”的关联：圈住之后，圈内的人才有“资格”。**qualify vs refute/challenge：削皮（削完还能吃=部分对）vs 扔掉（全错）。** 让步转折的题里 qualify 是高频正确答案词。"]}, {"type": "passage", "title": "实战一 · 睡眠与记忆巩固（certainly 的套路）", "source": "先自己做：2 题 · 重点：certainly+but 的行文结构", "text": "Some researchers contend that sleep plays no role in the consolidation of declarative memory — memory of factual information. They note that the declarative memory of individuals who have slept normally has never been systematically compared with that of individuals deprived of sleep; even if such studies were done, the researchers argue, they would merely clarify the role of REM sleep rather than the role of sleep as a whole. These researchers also hold that overnight memory loss can be attributed to the passage of time rather than to sleep. Recent studies of memory performance after sleep, however, make this claim unsustainable. Certainly, memory consolidation processes occur during periods of wakefulness, some of which neither depend on nor are enhanced by sleep. But performance is better after sleep, and some benefits of sleep for memory must therefore be acknowledged."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 高亮句（Certainly句）的功能", "source": "实战一", "pause": true, "stem": [{"t": "Which of the following best describes the function of the highlighted sentence in the passage?（高亮句：“Certainly, memory consolidation processes occur during periods of wakefulness, some of which neither depend on nor are enhanced by sleep.”）"}], "options": {"A": "It provides evidence that supports the researchers’ claim about declarative memory", "B": "It summarizes the findings of the recent studies of memory performance", "C": "It questions the methodology of the studies cited by the researchers", "D": "It introduces a distinction between types of memory consolidation", "E": "It concedes that memory consolidation does not depend entirely on sleep"}, "answer": "E", "explain": {"思路": "①功能题：看句子在上下文里干什么。②该句以 Certainly 开头=让步套路：作者承认“醒着也能巩固记忆”（对方部分观点对）,But 后才亮真正观点（睡眠后表现更好）。③五个动词里只有 **concede（承认）** 体现让步逻辑——它是唯一答案。", "annot": "套路还原：<span class='m3'>Certainly, A（醒着也能巩固）</span> → <span class='m2'>But</span> <span class='m4'>B（睡眠后更好——作者真观点）</span>。高亮句=A=让步部分。", "辨析": "A 方向反了（它是让步不是支持）；B 张冠李戴（recent studies 是反对方的）；C/D 与“承认”无关。concede 在此译“承认”而非“让步”——中文说“让步了一个观点”不像人话。", "点拨": "秒杀路径：识别出 certainly+but 的让步结构后，直接扫选项找“承认/concede”类动词。逻辑套路能替你省掉逐字比对。"}}, {"type": "q", "tag": "真题 · 主旨题", "title": "第2题 · 主要目的", "source": "实战一", "pause": true, "stem": [{"t": "The primary purpose of the passage is to..."}], "options": {"A": "present evidence supporting a particular claim about REM sleep and memory", "B": "describe various factors that affect the effect of sleep on memory", "C": "argue against a particular position about the role of sleep in memory", "D": "summarize the most popular theories concerning sleep and memory", "E": "defend the importance of the consolidation of declarative memory"}, "answer": "C", "explain": {"思路": "①结构：研究人员观点（睡眠无用）→ 作者反驳（研究不足/站不住脚）→ certainly 让步 → but 真观点（睡眠有用）。②与布鲁斯诗文、兵工厂文同构：作者站一方打另一方=argue against。③C:argue against a particular position=反对研究人员的特定立场。", "annot": "结构：<span class='m3'>some researchers contend（大众立场）</span> → 反驳 → <span class='m4'>作者：睡眠有用</span> → 动词选 <span class='m4'>argue against</span>。", "辨析": "A 的 REM sleep 只是细节不是主题；B“多种因素”无中生有；D“概括流行理论”——作者是驳不是概括；E defend 的对象偏了（不是捍卫记忆巩固的重要性）。", "点拨": "第5讲的动词判别法再次生效：见到“部分人观点+作者开怼”，主旨题优先找 argue against/challenge/refute。此题与第2讲青春期文、休斯文构成“驳论文”三件套。"}}, {"type": "passage", "title": "实战二 · 恒温还是育幼？（Farmer 的让步）", "source": "先自己做 · 重点：题干 concedes 考的是“承认的那一小块”", "text": "Many researchers have attributed the numerous physiological and behavioral similarities between birds and mammals to endothermy — a thermoregulatory strategy by which body temperature is maintained through internal heat sources. Farmer, however, argues that parental care, rather than endothermy, is key to understanding these similarities. While endothermy provides an explanation for a few of the similarities — the presence of body insulation, for example — it is only one of many features associated with parental care. The purported advantages of endothermy cited by researchers include the ability to remain active in cold conditions; but sustained activity requires metabolic rates to rise quickly, and there is no biological linkage to explain why endothermy would be important in sustaining the vigorous exercise involved in foraging and provisioning young. Farmer argues instead that endothermy developed as a way to control body temperature — a capacity that serves parental care by allowing adults to forage and provision their young."}, {"type": "teach", "title": "⑥ 本讲赠品：Farmer 不是农民！+ other than 精讲", "ppt": ["Farmer 大写=人名（姓氏），不是农民伯伯", "other than = 除了（except 起源：A 包含 B 的关系）", "文中 other than = besides：竞争也算一个因素，但重点是别的"], "text": ["**Farmer 大写=姓**——文中这位是学者（祖上是农民而已；英文姓氏多来自祖先职业/居所：Armstrong 胳膊粗、Bush 住灌木丛）。阅读中人物只记姓， farmer 与 researchers 观点相反。", "**other than 的推导**：字面=“比起 B 来说是其他的 A”——I like A other than B,A 该填 fruit 还是 banana？填 **fruit**(A 包含 B：水果比起苹果之外的其他）。这是它 except 词义的来源，后演变出 besides；甚至有人当 rather than 用（不严谨：rather than 双方对立平级）。", "**本文 other than = besides**：竞争也是解释因素之一，但作者重点在“别的因素”——如果取 except，竞争就被完全排除了，与后文“灰鼠确实有竞争力”矛盾。"]}, {"type": "q", "tag": "真题 · 细节题", "title": "第1题 · Farmer 承认了什么", "source": "实战二", "pause": true, "stem": [{"t": "According to the passage, Farmer concedes that endothermy provides an explanation for which of the following features shared by birds and mammals?"}], "options": {"A": "the presence of body insulation", "B": "an instinct to care for offspring", "C": "the capacity for sustained vigorous exercise", "D": "the ability to remain active in cold conditions", "E": "a high metabolic rate"}, "answer": "A", "explain": {"思路": "①审题关键：题干 **concedes（承认）**——问的是 Farmer 让步的那一小块，不是他的真正观点！②定位第一个让步：While endothermy provides an explanation for a few of the similarities — the presence of body insulation, for example（体 insulation 的存在）——它其实只是 parental care 众多特征之一。③A=让步句里白纸黑字举的那个例子。", "annot": "提问对象：<span class='m3'>concedes = 让步部分</span>（while 承认的那点）≠ <span class='m4'>Farmer 真正观点（parental care）</span>。", "辨析": "B“照顾后代的本能”=parental care=**Farmer 自己的观点**，是最大陷阱——看到它像答案就选，正说明审题没抓住 concedes;C/D/E 是研究人员 purported advantages 的内容（被 Farmer 否定了的）。", "点拨": "题干动词决定答案区域：argue/claim 问→找作者观点；concede/admit/acknowledge 问→找让步部分。一个词换一下（concedes→argues)，答案就从 A 变成 B——这就是行文逻辑对解题的直接帮助。"}}, {"type": "passage", "title": "实战三 · 生态位与入侵物种（让步不靠词）", "source": "本篇无题 · 重点：无“虽然”只有“但是”的隐性让步", "text": "An influential early view held that ecosystems contain niches for only a limited number of species and that competition for resources among species, whether native or invading, determines the species composition of ecosystems. However, factors other than competition can help explain the success of invading species. For example, the North American gray squirrel, often cited as a competitively superior invading species, was introduced into Britain and is now widespread, while the native red squirrel has declined. Yet scientists have noted that even before the gray squirrels arrived, British red squirrel populations had undergone periodic crashes, only to be subsequently reintroduced; moreover, many gray squirrels are silent carriers of a disease fatal to red squirrels."}, {"type": "teach", "title": "⑦ 实战三解析：让步藏在内容里", "ppt": ["early view + However = 驳论开场", "灰鼠例子里的双重让步：确实能竞争，但红松鼠先崩溃过+带病而来", "让步可以没有“虽然”——靠内容识别"], "text": ["结构：influential early view（竞争决定构成）→ However 驳→“other than=besides”的因素解释入侵成功。", "例子的让步性：**灰鼠确实是 competitive superior（承认竞争有用）,Yet 后面两个原因才是重点**——红松鼠在灰鼠到来前就周期性灭绝过（别赖竞争）；灰鼠是疾病的 silent carriers（致命疾病才是杀手）。", "通篇没有一个“虽然”，但“确实能竞争，但重点在别处”就是标准的让步转折——**逻辑可以靠逻辑词，也可以靠信息本身的隐藏关系**。niche 词义：生态位（市场里的“位置”→niche market 细分市场）。"]}, {"type": "passage", "title": "实战四 · 约翰逊致金主的信（qualify 的完美示范）", "source": "先自己做 · 重点：however 句的功能——qualify 不是 refute", "text": "In 1755 the English writer Samuel Johnson published a scathing letter to Lord Chesterfield, rebuking his patron for having neglected him and declining further support. Johnson’s rejection of his patron’s belated assistance has often been identified as a key moment in publishing history, marking the end of the culture of patronage. Yet patronage had been in decline for fifty years and would persist in an attenuated form for fifty more. Indeed, Johnson himself accepted a pension from the Crown in 1762 — itself a form of patronage. Johnson’s letter is not so much historical as emotional: it would become a touchstone for all who repudiated patrons and for all who embraced the laws of the marketplace."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 高亮句（Yet句）的功能", "source": "实战四", "pause": true, "stem": [{"t": "Which of the following best describes the function of the highlighted sentence in the context of the passage?（高亮句：“Yet patronage had been in decline for fifty years and would persist in an attenuated form for fifty more.”）"}], "options": {"A": "It identifies the most striking feature of Johnson’s letter", "B": "It indicates Johnson’s motivation for rejecting Chesterfield’s patronage", "C": "It provides information that qualifies the assertion that Johnson’s letter marked the end of the patronage era", "D": "It offers a defense of Chesterfield’s neglect of Johnson", "E": "It refutes the notion that patrons are found primarily among the nobility"}, "answer": "C", "explain": {"思路": "①前文：此信常被标为“资助文化终结”的关键时刻。②高亮句 Yet：资助早已衰落50年、还将以弱化形式延续50年——把“终结”这个大字眼**削小**了（不是终结，只是延续衰落）。③再加上 Indeed（他1762还领了津贴）与 not so much historical as emotional（历史意义<情感意义，但历史意义**还在**)。④全指向 qualify：限制/削弱，而非全盘推翻。", "annot": "qualify 的工作：<span class='m3'>“终结时代”（范围大）</span> → <span class='m4'>however 削一圈：早衰50年+续50年</span> → 削皮不扔：历史意义小于情感意义，但不是零。", "辨析": "E refute 是最大诱惑但程度过了——作者没否定历史意义（后文明说 not so much…as 只是比较小）；A“最明显特征”暗含内容非功能；B 动机——这是作者的分析结果不是约翰逊的动机；D 为 Chesterfield 辩护无中生有。", "点拨": "qualify vs 反驳家族的区别是程度题：对方观点削一圈还能用=qualify；整块扔掉=refute/challenge/criticize。本讲最重单词，没有之一——逻辑推理题（第19-20讲）里它也是正确答案常客。"}}, {"type": "ext", "title": "本讲复盘 + 预告", "ppt": ["让步转折装备清单 · 下讲：让步转折（下）"], "text": ["**装备清单**:①让步=退一步为了进上去（X 我对，但是 Y 我更对）;②虽然词族（albeit/even if vs even though/granted/for all/regardless);③承认词（admittedly/acknowledge/concede)+确实词（certainly);④但是精准词族（nevertheless/nonetheless/still);⑤attribute to 归因、not so much A as B 程度比较、other than=besides、**qualify=削皮不扔**。", "**两个考场杀招**:①题干动词定区域——concedes 问让步部分，argues 问真正观点；②功能题见 certainly/admittedly/but 找 concede 动词，见 Yet/however 缩范围找 qualify。", "**回读**:实战一=certainly 套路；实战二=concedes 定位；实战四=qualify 程度。第2讲四篇里所有 however 现在都能归类了。", "**下讲预告**:《让步转折（下）》——更多让步逻辑的实战文章与题目变体。"]}], "transcript": "这里是gr阅读理解的第六节课。我们来到了逻辑分析的第三个部分。此处我们仍然谈到的是方向当中，反向在上一节课当中呢，我们谈到的是反向逻辑里的对比对立。在这一小节课当中，我们要谈一下让步转折了。所以，按照课程的记录来讲，首先我们完成了对于对比对立这个逻辑的了解。关于让步转折的话呢，我们要所强调的对象就是让步，其实更多的是退一步。在行文过程当中，所谓的退一步，就是把我自己的程度弱化一下。接下来，我以退是要违禁的。我让步退一步，take a step back我的目标是什么？如果是作者让步，完了之后，他是不是就怂到底了呢？不是它要进上去，所以说弱了这一项的目的更多的是为了转折而强上去。退一步再往上进的过程。这就是让步转折的基本特点。那么接下来，我们就会把让步和转折分别探讨一下它们所代表的逻辑是什么样的。首先，让步和转折其实是一个搭配在一起的逻辑性，但是其各自的部分也有自己的特点，比如说让步的部分，我们可以由这样的一些中文词来代表它的逻辑，比如说虽然。承认或确实用这些词来体现出逻辑当中让步的特点，那具体怎么样，用什么词表达或怎么用，我们来看一下例子。在这里，首先说一下，虽然。在英语当中，当然表示虽然的词特别多，在这里我们列举出来一些，比如说这个词叫做，虽然这个词也叫虽然，而且我们可以看作although这个词是由though+all这 o red squirrels."}, {"type": "q", "tag": "真题 · 功能题", "title": "第1题 · 灰松鼠觅食效率的写法目的", "source": "实战三（续）", "pause": true, "stem": [{"t": "The author mentions the gray squirrel’s efficiency as a forager primarily in order to..."}], "options": {"A": "identify a factor that explains a phenomenon discussed in the passage", "B": "call attention to an inconsistency in a theory discussed in the passage", "C": "show that competition cannot be responsible for a particular outcome", "D": "acknowledge a fact that apparently supports a view that the author intends to qualify", "E": "cite evidence that is inconsistent with an early influential view"}, "answer": "D", "explain": {"思路": "①定位：觅食效率在 Yet 分句——灰鼠确实更会觅食（竞争确实存在）。②判断立场：作者承认竞争是一个因素（other than=besides)，但重点是疾病和周期性灭绝等其他因素。③即“承认一个看似支持竞争论的事实，但我要限制竞争论的范围”=acknowledge+qualify 的经典组合。", "annot": "立场图：<span class='m3'>灰鼠更能觅食（事实，支持竞争）</span> → 作者<span class='m4'>承认它</span>，但把它<span class='m4'>画圈缩小</span>：竞争是因素之一，不是全部。", "辨析": "C 是强干扰：它否定了竞争的作用——但作者承认竞争存在，不能选；A 方向反（作者不是要用它解释现象，而是用它来让步）;B/E 的 inconsistent 与文意相反（这个事实恰恰与竞争论一致）。", "点拨": "把“榴莲削皮”记成动作流程：先承认（acknowledge）对方手中的事实，再限定（qualify）它的范围。选项里这两个词搭档出现，十有八九是让步题的正解。"}}, {"type": "q", "tag": "真题 · 态度题", "title": "第2题 · 作者对早期观点的评价", "source": "实战三（续）", "pause": true, "stem": [{"t": "It can be inferred that the author of the passage would be most likely to agree with which of the following statements about the early view?"}], "options": {"A": "It rests on a mistaken assumption about competition", "B": "Its basic premise has been shown to be valid by the effect of the American gray squirrel on red squirrels", "C": "It presents a simplistic picture of how species composition within ecosystems is determined", "D": "It effectively explains the composition of ecosystems that contain few species, but not of those that contain many", "E": "It understates the importance of competition as a factor in determining species composition"}, "answer": "C", "explain": {"思路": "①作者立场：竞争是对的（不是错），但不完整——还有疾病、周期性灭绝等因素。②评价一个词：对但不全=“过于简化”。③C:simplistic picture of how species composition is determined。", "annot": "态度刻度：<span class='m3'>全错（mistaken)</span> ←—— <span class='m4'>作者：对但太简单（simplistic)</span> ——→ <span class='m5'>全对（valid)</span>。作者站在中间偏右。", "辨析": "A mistaken 过头（作者承认竞争有道理）;B valid 也过头（等于站到了早期观点一方）;E understates the importance 方向反了——早期观点恰恰是夸大竞争、忽略其他因素。", "点拨": "**simplistic ≠ simple!** simple=简单（中性）,simplistic=**过于**简化（带批评：简单到不行了）。这个词自带轻度负评价，正是“对但不全”的语气。GRE 态度题的三档刻度：mistaken（全错）/simplistic（对但太窄）/valid（全对）——先定位作者站哪档。"}}, {"type": "teach", "title": "② not so much A as B：完整推导链", "ppt": ["as…as = 一样 → not as…as = 不如 → not so much…as = 程度上 A<B", "A 不及 B ≠ A 是错的"], "text": ["推导链：①as…as 表“一样”(I am as handsome as Xiao Ming);②第一个 as 前加 not → 不如（not as…as);③as 换成 so、比较对象从具体特征换成程度（much)→ **not so much A as B = 程度上 A 小于 B**。", "Johnson 信一句=perfect 用例：not so much historical as emotional=历史意义 < 情感意义。**A 并没有被否定**——历史意义还在，只是不如情感意义。这和 qualify 的精神完全一致：削皮不扔。"]}, {"type": "teach", "title": "③ 约翰逊篇深度复盘：两个细节", "ppt": ["pension = patronage（国家发的也是资助）", "lord ≠ nobility（爵位≠“赞助者都是贵族”）", "qualify 与 not so much as 的呼应"], "text": ["细节一：**pension（补助金）从逻辑上=patronage**——约翰逊 1762 年领了王室津贴，说明“资助终结”的说法被进一步削弱。末句 not so much historical as emotional 的呼应：历史意义（小）<情感意义（大），但历史意义不是零。", "细节二：E 选项的干扰靠 **lord→nobility 的联想**——Chesterfield 是 lord（勋爵），但文章从没说“赞助者主要是贵族”；不认识 lord 的人反而不会多想。见到具体身份词别自动升级成群体概念。", "一句话总结本讲：让步转折题的词库——acknowledge/concede（承认）、qualify（限制）、simplistic（过于简化）、not so much…as（不如）——四个词就是四种答案信号。"]}, {"type": "ext", "title": "反向逻辑收官 + 预告", "ppt": ["对比对立 + 让步转折 = 反向逻辑完讲"], "text": ["**至此反向逻辑完讲**：对比对立（拳击：共存/取舍/先后众寡表里/洛基站位）+ 让步转折（退一步进上去/承认词+但是词/qualify)。做题时对比与让步分不清也没关系——先判“大反向”，选项会提示你更细的分类。", "**下讲转向结构维度**:《结构-相似》——并列、重述、顺承，以及分号、牛津逗号、指代词的用法。", "**自测**：能否说出 acknowledge/qualify/simplistic/not so much as 四个词各自对应的让步信号？说不出回去重看本讲三张卡。"]}], "transcript": "好在分析完文章之后，我们接下来来看一下与之相关的两道题，首先第一题说it can be inferred能推断出。这篇文章的作者谈到了。谈到了什么呢？效率什么效率？灰松鼠觅食的这个效率主要的目的是什么？在这个题目的问法当中，它更多强调的是作者谈到信息的目的。这种问法形式更多偏向于问你作者行文过程当中的逻辑性。或者说作者用这个信息要
