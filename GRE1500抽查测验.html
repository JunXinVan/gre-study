": ""}, {"w": "unctuous", "cn": "虚情假意的，油滑的", "en": "friendly or giving praise in a way that is not sincere", "root": ""}, {"w": "ascetic", "cn": "禁欲的，节制的", "en": "practicing strict self-denial as a measure of personal and especially spiritual discipline", "root": ""}, {"w": "risible", "cn": "可笑的，滑稽的", "en": "deserving to be laughed at; causing laughter", "root": ""}, {"w": "elegiac", "cn": "哀悼的，挽歌的", "en": "expressing sorrow or lamentation", "root": ""}, {"w": "numinous", "cn": "超自然的，神秘的", "en": "surpassing comprehension or understanding; mysterious", "root": ""}, {"w": "salvational", "cn": "拯救的，救赎的", "en": "relating to saving or protecting from harm", "root": ""}, {"w": "anodyne", "cn": "无害的，不得罪人的", "en": "not likely to offend or arouse tensions: innocuous", "root": ""}, {"w": "fulminate", "cn": "怒斥，强烈谴责", "en": "to utter or send out with denunciation", "root": ""}, {"w": "equanimity", "cn": "平静，镇定", "en": "calmness and composure, especially under stress", "root": ""}, {"w": "sangfroid", "cn": "淡定，沉着", "en": "self-possession or imperturbability especially under strain", "root": ""}, {"w": "fustian", "cn": "浮夸的言辞", "en": "inflated or turgid language in writing or speaking", "root": ""}, {"w": "vernacular", "cn": "日常口语表达", "en": "an expression or mode of expression that occurs in ordinary speech rather than formal writing", "root": ""}];
const root = document.getElementById('root');
let pool = [], total = 0, passed = 0, wrongCount = 0, attempts = 0;
let current = null, answered = false, curList = '', mode = 'quiz', flipped = false, trimMode = false, gauntlet = null;
let wrongMap = {};  // word -> {w, cn, en, count}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function label(k){ if(k==='y1') return '⭐ 我的标黄词 763'; if(k==='y2') return '🟢 我的标绿词 263'; return k.startsWith('v') ? `词汇课 第${k.slice(1)}讲` : `List ${k}`; }
function orderedKeys(){ return Object.keys(DATA).sort((a,b)=>{
  const _ord={y1:0,y2:1}; if((a in _ord)||(b in _ord)) return (_ord[a]===undefined?9:_ord[a])-(_ord[b]===undefined?9:_ord[b]);
  const av=a.startsWith('v'), bv=b.startsWith('v');
  if(av&&bv) return a.slice(1)-b.slice(1);
  if(av) return 1; if(bv) return -1;
  return a-b;
}); }

function home(){
  root.innerHTML = '<div style="text-align:center;padding:8px 0 4px">'
    + '<p style="color:#555;line-height:1.8">选择要抽查的范围（1500 词 List 4-30 · 词汇课第 1-5 讲词卡）</p>'
    + '<div class="list-btns">'
    + orderedKeys().map(k => `<button onclick="pickMode('${k}')">${label(k)}</button>`).join('')
    + '</div></div>';
}

function pickMode(list){
  gauntlet = null;
  const extra = (list === 'y1' || list === 'y2') ? (() => {
    const rest = remaining(list).length, gone = DATA[list].length - rest;
    return `<p style="color:#e67e22;font-size:13.5px;margin-top:14px">—— 掌握剔除模式 · 大词库剩余 ${rest} / ${DATA[list].length} 词 ——</p>
    <div class="mode-btns">
      <button style="border-color:#e67e22;color:#e67e22" onclick="start60(list,'quiz')">🎲 随机 60 词 · 选择题<small>每次随机抽 · 点「剔除」永久移出词库</small></button>
      <button style="border-color:#e67e22;color:#e67e22" onclick="start60(list,'card')">🎲 随机 60 词 · 翻卡<small>翻面自评 · 掌握即剔除</small></button>
    </div>
    <div class="mode-btns">
      <button style="border-color:#e67e22;color:#e67e22;max-width:100%" onclick="startGauntlet(list)">🏆 通关模式 · 随机 60 词<small>先通关四选一 → 再通关翻卡，两阶段都可重来 · 掌握可剔除</small></button>
    </div>`
    + (gone ? `<button class="back" onclick="resetMastered(list)">↩ 误剔除了？点这里恢复（已剔除 ${gone} 词）</button>` : '');
  })() : '';
  root.innerHTML = `<div style="text-align:center;padding:8px 0 4px">
    <h2 style="margin-bottom:4px">${label(list)}</h2>
    <p style="color:#555">选择练习模式（${DATA[list].length} 词）</p>
    <div class="mode-btns">
      <button onclick="start('${list}',null,'quiz')">选择题模式<small>看英文选中文，四选一</small></button>
      <button onclick="start('${list}',null,'card')">翻卡自评模式<small>看英文回忆中文，自评会/不会</small></button>
    </div>${extra}
    <button class="back" onclick="home()">← 返回选择</button></div>`;
}

function start(list, words, m, trim){
  curList = list;
  mode = m || 'quiz';
  trimMode = !!trim;
  pool = shuffle((words || DATA[list]).map(x => ({...x, pass: 0})));
  total = pool.length; passed = 0; wrongCount = 0; attempts = 0;
  wrongMap = {};
  mode === 'card' ? cardNext() : next();
}

// ---------- 掌握剔除（仅标黄词库，DATA 原件不动，剔除的是 localStorage 副本）----------
function getMastered(list){ try{ const v = localStorage.getItem('mastered_' + list); if (v !== null) return JSON.parse(v); if (list === 'y1') return JSON.parse(localStorage.getItem('y1_mastered') || '[]'); return []; }catch(e){ return []; } }
function saveMastered(list, a){ localStorage.setItem('mastered_' + list, JSON.stringify(a)); if (list === 'y1') localStorage.removeItem('y1_mastered'); }
function remaining(list){ const m = new Set(getMastered(list).map(w => w.toLowerCase())); return DATA[list].filter(x => !m.has(x.w.toLowerCase())); }
function resetMastered(list){ saveMastered(list, []); pickMode(list); }
function start60(list, m){
  gauntlet = null;
  const rest = shuffle(remaining(list).slice());
  if (!rest.length){
    root.innerHTML = `<div class="done"><div class="big">🏆</div><h2>${DATA[list].length} 词全部掌握！</h2><p>大词库已清空，太狠了。</p><div class="list-btns"><button onclick="resetMastered()">↩ 全部恢复，再来一轮</button><button onclick="home()">返回首页</button></div></div>`;
    return;
  }
  start(list, rest.slice(0, 60), m, true);
}
function trimBtnHtml(){
  return `<button class="trimbtn" onclick="masterCurrent()">✂️ 已彻底掌握，剔除出大词库（按 0）</button>`;
}
function masterCurrent(){
  if (!current || !trimMode) return;
  const m = getMastered(curList);
  if (!m.some(w => w.toLowerCase() === current.w.toLowerCase())){ m.push(current.w); saveMastered(curList, m); }
  pool = pool.filter(x => x.w.toLowerCase() !== current.w.toLowerCase());
  passed++;
  answered = false; flipped = false;
  mode === 'card' ? cardNext() : next();
}

// ---------- 通关模式：先四选一，再翻卡，两阶段可重来 ----------
function startGauntlet(list){
  gauntlet = null;
  const rest = shuffle(remaining(list).slice());
  if (!rest.length){
    root.innerHTML = `<div class="done"><div class="big">🏆</div><h2>${DATA[list].length} 词全部掌握！</h2><p>大词库已清空，太狠了。</p><div class="list-btns"><button onclick="resetMastered()">↩ 全部恢复，再来一轮</button><button onclick="home()">返回首页</button></div></div>`;
    return;
  }
  const words = rest.slice(0, 60);
  gauntlet = { words, phase: 1 };
  start(list, words, 'quiz', true);
}
function gauntletPhase2(){
  if (!gauntlet) return;
  const m = new Set(getMastered(curList).map(w => w.toLowerCase()));
  const words = gauntlet.words.filter(x => !m.has(x.w.toLowerCase()));  // 第一阶段已剔除的词不再出现
  gauntlet = { words, phase: 2 };
  start(curList, words, 'card', true);
}

// 把中文释义拆成义项集合，用于判断两个词意思是否相近
function glosses(cn){
  return cn.split(/[,，、;；]/).map(s => s.trim()).filter(Boolean);
}
function similar(a, b){
  const ga = glosses(a), gb = glosses(b);
  return ga.some(x => gb.some(y => x.includes(y) || y.includes(x)));
}

const ALL = Object.values(DATA).flat();
function pickOptions(word){
  // 优先同 List 且意思不相近的干扰项，不够再从全部词里补
  const sameList = shuffle(DATA[curList].filter(x => x.w !== word.w && x.cn !== word.cn && !similar(x.cn, word.cn)));
  const picked = [];
  const seen = new Set([word.cn]);
  for (const o of sameList){
    if (!picked.some(p => similar(p, o.cn)) && !seen.has(o.cn)){ seen.add(o.cn); picked.push(o.cn); }
    if (picked.length === 3) break;
  }
  if (picked.length < 3){
    const rest = shuffle(ALL.filter(x => x.w !== word.w && !seen.has(x.cn) && !similar(x.cn, word.cn)));
    for (const o of rest){
      if (!picked.some(p => similar(p, o.cn)) && !seen.has(o.cn)){ seen.add(o.cn); picked.push(o.cn); }
      if (picked.length === 3) break;
    }
  }
  // 兜底：实在凑不够就放宽"相近"限制，但选项文本仍不重复
  if (picked.length < 3){
    const anyRest = shuffle(ALL.filter(x => x.w !== word.w && !seen.has(x.cn)));
    for (const o of anyRest){ seen.add(o.cn); picked.push(o.cn); if (picked.length === 3) break; }
  }
  return shuffle([word.cn, ...picked]);
}

function next(){
  answered = false;
  if (pool.length === 0){ return done(); }
  current = pool[0];
  const opts = pickOptions(current);
  root.innerHTML = `
    <div class="stats">
      <span>已通过 <b>${passed}</b> / ${total}</span>
      <span>待考 <b>${pool.length}</b></span>
      <span>错误 <b style="color:#e74c3c">${wrongCount}</b> 次</span>
    </div>
    <div class="bar"><div style="width:${passed/total*100}%"></div></div>
    <div class="word">${current.w}</div>
    <div class="hint">选择正确的中文意思（按 1-4）</div>
    <div class="opts" id="opts">
      ${opts.map((o,i)=>`<button class="opt" data-cn="${encodeURIComponent(o)}" data-i="${i}"><span class="key">${i+1}</span>${o}</button>`).join('')}
    </div>
    <div id="after"></div>
    ${trimMode ? trimBtnHtml() : ""}
    <button class="back" onclick="home()">← 返回选择 List</button>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
}

function answer(btn){
  if (answered) return;
  answered = true; attempts++;
  const cn = decodeURIComponent(btn.dataset.cn);
  const ok = cn === current.cn;
  const btns = [...document.querySelectorAll('.opt')];
  if (ok){
    btn.classList.add('correct');
    btns.forEach(b => { if (b !== btn) b.classList.add('dim'); });
    pool.shift(); passed++;
    setTimeout(next, 350);
  } else {
    btn.classList.add('wrong');
    btns.forEach(b => {
      if (decodeURIComponent(b.dataset.cn) === current.cn) b.classList.add('correct');
      else if (b !== btn) b.classList.add('dim');
    });
    wrongCount++;
    // 记录错题
    if (!wrongMap[current.w]) wrongMap[current.w] = {...current, count: 0};
    wrongMap[current.w].count++;
    // 放回词池随机位置
    pool.shift();
    const pos = Math.min(pool.length, 2 + Math.floor(Math.random() * 6));
    pool.splice(pos, 0, current);
    document.getElementById('after').innerHTML = `
      <div class="answer">
        <div>正确答案：<span class="aw">${current.w}</span> —— ${current.cn}</div>
        ${current.en ? `<div class="en">${current.en}</div>` : ''}
        ${current.root ? `<div style="margin-top:8px;color:#7a4af7;font-size:13.5px;line-height:1.7">🔑 词根：${current.root}</div>` : ''}
        <div style="margin-top:6px;color:#b8860b;font-size:13px">已放回词池，稍后会再次考到</div>
      </div>
      <button class="cont" onclick="next()">继续（空格）</button>`;
  }
}

// ---------- 翻卡自评模式 ----------
function cardNext(){
  flipped = false;
  if (pool.length === 0){ return done(); }
  current = pool[0];
  root.innerHTML = `
    <div class="stats">
      <span>已过关 <b>${passed}</b> / ${total}</span>
      <span>待考 <b>${pool.length}</b></span>
      <span>不会 <b style="color:#e74c3c">${wrongCount}</b> 次</span>
    </div>
    <div class="bar"><div style="width:${passed/total*100}%"></div></div>
    <div class="flashcard" id="fc" onclick="flip()">
      <div class="fw">${current.w}</div>
      <div class="fhint">点击卡片或按空格显示释义</div>
    </div>
    <div id="after"></div>
    ${trimMode ? trimBtnHtml() : ""}
    <button class="back" onclick="home()">← 返回选择 List</button>`;
}

function flip(){
  if (flipped) return;
  flipped = true;
  document.getElementById('fc').innerHTML = `
    <div class="fw" style="font-size:28px">${current.w}</div>
    <div class="fcn">${current.cn}</div>
    ${current.en ? `<div class="fen">${current.en}</div>` : ''}
    ${current.root ? `<div class="fen" style="color:#7a4af7;background:#f5f2fe;border-radius:6px;padding:6px 10px;max-width:90%">🔑 词根：${current.root}</div>` : ''}`;
  document.getElementById('after').innerHTML = `
    <div class="grade">
      <button class="gno" onclick="grade(false)">不会（按 1）</button>
      <button class="gyes" onclick="grade(true)">会了（按 2）</button>
    </div>
    <div style="text-align:center;color:#999;font-size:12px;margin-top:8px">「会了」还会再出现 1 次巩固；「不会」会反复出现直到过关</div>`;
}

function grade(ok){
  if (!flipped) return;
  attempts++;
  pool.shift();
  if (ok){
    current.pass = (current.pass || 0) + 1;
    if (current.pass >= 2){
      passed++;  // 两次都"会了"才算过关
    } else {
      const pos = Math.min(pool.length, 4 + Math.floor(Math.random() * 6));
      pool.splice(pos, 0, current);
    }
  } else {
    wrongCount++;
    if (!wrongMap[current.w]) wrongMap[current.w] = {...current, count: 0};
    wrongMap[current.w].count++;
    const pos = Math.min(pool.length, 2 + Math.floor(Math.random() * 4));
    pool.splice(pos, 0, current);
  }
  setTimeout(cardNext, 150);
}

function done(){
  const acc = attempts ? Math.round(total / attempts * 100) : 100;
  const wrongs = Object.values(wrongMap).sort((a, b) => b.count - a.count);
  const reviewHtml = wrongs.length
    ? `<div style="text-align:left;margin-top:18px">
        <h3 style="margin-bottom:8px">📋 ${mode === 'card' ? '生词汇总' : '错题汇总'}（${wrongs.length} 词，按次数排序）</h3>
        ${wrongs.map(x => `
          <div style="padding:8px 10px;border-bottom:1px solid #eee;font-size:14px;line-height:1.5">
            <b>${x.w}</b> <span style="color:#e74c3c;font-size:12px">错 ${x.count} 次</span><br>
            <span style="color:#333">${x.cn}</span>
            ${x.en ? `<div style="color:#999;font-size:12px">${x.en}</div>` : ''}
          </div>`).join('')}
      </div>`
    : `<p style="color:#2ecc71;margin-top:14px">满分！没有错词 🎉</p>`;
  const gOn = !!gauntlet && (curList === 'y1' || curList === 'y2');
  const gBig = gOn ? (gauntlet.phase === 1 ? '✅' : '🏆') : '🎉';
  const gTitle = gOn ? (gauntlet.phase === 1 ? '第一阶段 · 四选一完成' : '通关！本组 60 词全部拿下')
                     : `${label(curList)} 全部通过！`;
  const btns = gOn
    ? (gauntlet.phase === 1
      ? `${wrongs.length ? `<button id="retryBtn">先只考错题（${wrongs.length} 词）</button>` : ''}<button id="gNext" style="background:#4a6cf7;color:#fff">进入第二阶段 · 翻卡 →</button><button id="gRedo">🔄 四选一重来一次</button><button onclick="home()">换个范围</button>`
      : `${wrongs.length ? `<button id="retryBtn">只考生词（${wrongs.length} 词）</button>` : ''}<button id="gRedo">🔄 翻卡阶段再来一次</button><button id="gNew" style="background:#4a6cf7;color:#fff">🎲 抽取新的 60 词</button><button onclick="home()">返回首页</button>`)
    : `${wrongs.length ? `<button id="retryBtn">只考${mode === 'card' ? '生词' : '错题'}（${wrongs.length} 词）</button>` : ''}<button id="againBtn">再考一遍 ${label(curList)}</button><button onclick="home()">换个范围</button>`;
  const gExtra = gOn && gauntlet.phase === 2 ? `<p style="color:#e67e22;margin-top:6px;font-size:14px">大词库剩余 ${remaining(curList).length} / ${DATA[curList].length} 词</p>` : '';
  root.innerHTML = `<div class="done">
    <div class="big">${gBig}</div>
    <h2 style="margin-bottom:8px">${gTitle}</h2>
    <p>共作答 ${attempts} 次 · ${mode === 'card' ? '不会' : '错误'} ${wrongCount} 次 · 一次通过率 ${acc}%</p>${gExtra}
    <div class="list-btns">${btns}</div>
    ${reviewHtml}</div>`;
  if (wrongs.length){
    document.getElementById('retryBtn').onclick = () => start(curList, wrongs, mode, trimMode);
  }
  if (gOn){
    if (gauntlet.phase === 1){
      document.getElementById('gNext').onclick = () => gauntletPhase2();
      document.getElementById('gRedo').onclick = () => { gauntlet.phase = 1; start('y1', gauntlet.words, 'quiz', true); };
    } else {
      document.getElementById('gRedo').onclick = () => gauntletPhase2();
      document.getElementById('gNew').onclick = () => startGauntlet(curList);
    }
  } else {
    document.getElementById('againBtn').onclick = () => trimMode ? start60(curList, mode) : start(curList, null, mode);
  }
}

document.addEventListener('keydown', e => {
  if (mode === 'card'){
    if (!current || pool.length === 0) return;
    if (e.key === ' '){ e.preventDefault(); if (!flipped) flip(); }
    else if (e.key === '0' && trimMode) masterCurrent();
    else if (flipped && e.key === '1') grade(false);
    else if (flipped && (e.key === '2' || e.key === 'Enter')) grade(true);
    return;
  }
  if (e.key === '0' && trimMode){ masterCurrent(); return; }
  if (answered){
    if (e.key === ' '){ e.preventDefault(); next(); }
    return;
  }
  const n = parseInt(e.key);
  if (n >= 1 && n <= 4){
    const b = document.querySelector(`.opt[data-i="${n-1}"]`);
    if (b) b.click();
  }
});

home();
</script>
</body>
</html>
