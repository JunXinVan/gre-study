<script>
const DATA = {"lessons": [{"id": 1, "title": "第1讲 · 考试简介与词汇要求", "intro": "词汇老师孙曦（Oliver）。本讲不立具体单词，立方法论的总纲：GRE 需要多大的词汇量、这门课的词是怎么筛出来的、单词为什么这么难记（任意性）、一词多义怎么破（并联/串联）、以及著名的“三七原则”背诵法。词汇是你的弱项，这一讲的三个方法（记法+规划+多元重复）就是整个课程的龙骨。", "cards": [{"type": "teach", "title": "① GRE 词汇的 Range：三层词汇全都要", "ppt": ["Graduate Record Exam（ETS 主办）", "中学词汇 → 托福词汇 → GRE 词汇", "先夯实基础，再攻难词"], "text": ["GRE 的全称是 **Graduate Record Exam**，由 ETS（Educational Testing Service）主办。词汇老师不管题型，只管一件事：这个考试需要什么样的词汇状态。", "关键词是 **range（范围）**：GRE 是跨度极广的考试，不只考 GRE 难词——中学词汇、高中词汇、托福/雅思词汇**全都是地基**。顺序不能反：先把中学词汇和托福词汇扎扎实实过一遍（很可能需要很多遍），再背 GRE 难词。基础词不熟，阅读的关键信息照样抓不到——难词背了一堆，动词不认识还是读不懂句子。", "心态提醒：词汇没有考试界限，托福词汇同样在 GRE 里反复出现。别觉得“我考 GRE 就只背 GRE 词”。真觉得背基础词丢脸，把词汇书封面撕了贴个 GRE 封面（老师原话）。"]}, {"type": "teach", "title": "② 这门课的词是怎么筛出来的", "ppt": ["CORPUS 语料库（填空+阅读题库词频排序）", "词频最高的是 the！真正选的是中低频且难的", "MIDDLE + UPPER LEVEL · 难且高频"], "text": ["GRE 词汇总量加托福要一万多，具体数字没意义，先巩固已有词汇量再攻难词。", "**筛选方法**：基于 GRE 填空+阅读题库整理语料库（corpus），用词频软件计算排序。但你猜词频最高的是哪个词？——是 **the**。所以不是直接取最高频，而是取列表中**中频甚至低频里的难词**——“难且高频”才是筛选标准。", "词频只是参考：考过 2 次的词不代表下次不考，考过 50 次的也不代表必考。老师在词频基础上做了多天的人工逐个筛选，留下的都是**比较难、且考试有考点**的词，即 middle + upper level（中等偏难/难）。", "**筛掉什么**：纯名词（如 gargoyle 怪兽形滴水嘴、carapace 龟甲、lunule 指甲小月牙）。纯名词=没有任何派生形式的孤立名词（education 有 educate/educational，就不是纯名词）。背纯名词只认识一个词，句子里的动词不认识照样读不懂；且改革后 GRE 基本不再考这类词。"]}, {"type": "teach", "title": "③ 样词精讲：三排词看懂 GRE 词的形态", "ppt": ["第一排：纯名词（被筛掉）", "第二排：动词→名词（amelioration/exacerbation）", "第三排：形容词→名词（contentiousness/punctiliousness）"], "text": ["**第二排（重点）**：amelioration（改善）/ exacerbation（恶化），一对反义名词，由动词 ameliorate / exacerbate 变来。这类“动→名”词在填空选项里反复出现、有多种形态，是课程的常客。记法：amelioration 谐音**“爱美丽哦”**（改善容貌→改善）；exacerbation 词根 acer=尖（acerbic 尖酸刻薄的——说出尖酸的话，关系就恶化了）。动词 ameliorate 写作里可以用（改善制度）。", "**第三排**：contentiousness（好争论）/ punctiliousness（一丝不苟），都是“形容词+ness”变来的名词。ness 常与形容词搭配变名词，这类“形→名”词在填空选项里特别多——**养成按后缀归纳整理的习惯**。", "第三排的两个形容词本体（contentious/punctilious）在第2讲填空课 deliberate 的辨析里就出现过——词根词缀课和填空课是互相咬合的。"]}, {"type": "teach", "title": "④ 为什么单词这么难记：任意性 Arbitrariness", "ppt": ["语言符号的形式与意义之间没有天然联系"], "text": ["语言学对英语的定义里有个词 **arbitrariness（任意性）**：语言符号的形式（拼写/字母）和它的意义之间**没有天然联系**（拟声词等少数例外）。", "你从 amelioration 的 a 或 m 里看不出“改善”——记单词=把两个毫不相关的东西硬联系起来，所以难。GRE 难词比托福词更难，难上加难。", "**但“死记硬背要合理”**：再好的记法也需要重复来巩固——人就是会遗忘（背熟的古诗词久了也背不出）。所以解法=好的记法 + 合理的重复安排，两者缺一不可。GRE 不只是语言考试，还考 thinking / critical thinking——背单词也要带着思考背。"]}, {"type": "teach", "title": "⑤ 一词多义的钥匙：并联 vs 串联", "ppt": ["并联：意思间无逻辑联系，核心概念一致", "串联：意思间有因果/时间链", "掌握后，大部分熟词僻义不复存在"], "text": ["**并联型**——spot：景点、车位、污点。三个意思之间没有逻辑联系（不会有“因为有景点才有车位”），但核心概念全是“**点**”。并联词只要抓住核心概念，一词多义自动收拢。", "**串联型**——appreciate：理解（understand）→感谢→欣赏→升值。逻辑链：你**理解**了别人对你的付出→你会**感谢**→感谢到深处就是**欣赏**→这个人在你心中价值升高=**升值**。词根 prec 与 price 同源（价值），app- 是辅音双写表强调（像汉语叠词“认认真真”）——价值一而再再而三升高。四种意思一条因果链串起。", "**plateau（并联）**：高原 / 平稳时期。核心概念=“到达一定高度后趋于平稳”——高原是海拔高而地势平，平稳时期是上升到一定阶段后走平。所以 reach a plateau=到达平稳期。这还算熟词僻义吗？不算。", "**precipitate（串联）**：促使、加速 → 使陷入 → 使沉淀。同源词 precipice=悬崖。想象从悬崖坠落：速度**加快**→**陷入**崖底→最终成为**沉淀物**。一条时间链串起三个看似无关的意思。", "结论：所谓熟词僻义，大多是你没抓住单词的核心概念。从今天开始，背一词多义的词时先问自己：这些意思是并联还是串联？"]}, {"type": "teach", "title": "⑥ 三七原则：背诵安排的具体做法", "ppt": ["7 个一组 · 49 词一小周期 · 7 天一大周期"], "text": ["**第一个 7**：准备 A4/草稿纸，边背边读边思考边抄写每个词 3-5 遍，**后面留空白先不写中文**（省得用手遮词书——那种“遮一点偷看一眼”的自我仁慈没用）。每背满 7 个停下来回顾：记住画勾，没记住画叉。背 GRE 词一定要有轨迹记录。", "**第二个 7**：7 组=49 词=一个小周期。一天背几个小周期看个人状态：GRE 考生至少 3 个，4-8 个都正常（200-400 词/天）。**每个小周期结束，把画叉的词整理到随身携带的小本子**上随时看——建议用纸质而非手机（打开手机背的可能不是单词是微博）。", "**第三个 7**：7 天一个大周期。第 7 天不背新词，把这一周所有词整体回顾一遍，重新画勾叉，叉多的词在小本子上重点标记，然后开始新的一周。", "整个一轮肯定不够，要滚动多轮+结合做题——一词多义的词，背完和在考场见到的考法往往不同。"]}, {"type": "teach", "title": "⑦ 课程结构：为什么按前后缀讲而不是按词根讲", "ppt": ["前缀+词根串讲系列 / 后缀+词根串讲系列"], "text": ["常规词汇课=先前后缀、再词根篇。但 GRE 课做了调整：举例词根 ject（reject/inject/eject/subject/object）——这些全是基础词/托福词，**一个词根里 GRE 难词只剩一两个**，单独讲词根效率太低。", "所以本课把词根**并进前后缀篇**：前缀+词根串讲系列、后缀+词根串讲系列。你看到的前后缀篇里，蕴含了大量词根学习。", "规划：前缀篇（肯定/强调、否定、方向：外内前后循环向中）、后缀篇（名词/形容词/动词后缀；副词=形容词+ly，量小且多由形容词变来，并入形容词篇）。选词以**填空**为主战场——填空对词汇的考察比阅读更直接、更硬核。", "后缀一般决定实词词性（名动形）；前缀用来“限定”词根的意思（词根本义较泛，如 tribut=give，加前缀才具体到贡献/分配/报应）。"]}, {"type" function badge(src){

/* 小测池自动扩充：把本讲词根卡里命中高频词表的词并入小测 */
function fullPool(c, les){
  const seen = new Set(c.pool.map(q=>q.w));
  const pool = c.pool.slice();
  for (const card of les.cards){
    const groups = (card.items||[]).concat(card.extra||[]);
    for (const e of groups){
      if (e.src && e.src.length && !seen.has(e.w)){
        seen.add(e.w);
        pool.push({w:e.w, cn:(e.cn||'').split(/（/)[0], src:e.src});
      }
    }
  }
  return pool.slice(0, 18);
}

      b.onclick = ()=>{
        const o = decodeURIComponent(b.dataset.o);
        const ok = o === q.cn;
        wrap.querySelectorAll('.qopt').forEach(x=>{
          x.classList.add('lock'); x.disabled=true;
          if (decodeURIComponent(x.dataset.o)===q.cn) x.classList.add('ok');
          else if (x===b) x.classList.add('bad');
        });
        document.getElementById('res'+ci+'_'+qi).textContent = ok?'✅':('❌ 正确答案：'+q.cn);
        recAnswer('c'+ci+'q'+qi, ok);
      };
    });
  });
}
function buildOpts(pool, qi){
  const q = pool[qi];
  const others = shuffle(pool.filter((x,i)=>i!==qi && x.cn!==q.cn && !similar(x.cn,q.cn)));
  const picked=[]; const seen=new Set([q.cn]);
  for (const o of others){ if(!seen.has(o.cn)){ seen.add(o.cn); picked.push(o.cn);} if(picked.length===3) break; }
  if (picked.length<3){
    for (const o of shuffle(pool)){ if(!seen.has(o.cn)){ seen.add(o.cn); picked.push(o.cn);} if(picked.length===3) break; }
  }
  return shuffle([q.cn, ...picked]);
}
/* ---- root quiz ---- */
function renderRootQuiz(c,ci){
  const box = document.getElementById('rqbox'+ci);
  const qz = (pOf(cur).qz) || {};
  box.innerHTML = c.items.map((it,qi)=>{
    const doneRec = qz['c'+ci+'r'+qi];
    const opts = shuffle(it.opts.map((o,i)=>({o, ok: i===it.a})));
    return `<div class="qitem"><div class="qw">${qi+1}. ${it.q}<span class="res" id="rr${ci}_${qi}">${doneRec!==undefined?(doneRec?'✅':'❌'):''}</span></div>
      <div class="qopts" id="qr${ci}_${qi}">${opts.map(x=>`<button class="qopt" data-o="${encodeURIComponent(x.o)}" data-ok="${x.ok?1:0}" ${doneRec!==undefined?'disabled':''}>${x.o}</button>`).join('')}</div>
      <div class="hint" id="rh${ci}_${qi}">💡 ${it.hint}</div></div>`;
  }).join('');
  c.items.forEach((it,qi)=>{
    const wrap = document.getElementById('qr'+ci+'_'+qi);
    if (!wrap || wrap.querySelector('button').disabled) return;
    wrap.querySelectorAll('.qopt').forEach(b=>{
      b.onclick = ()=>{
        const ok = b.dataset.ok === '1';
        wrap.querySelectorAll('.qopt').forEach(x=>{
          x.classList.add('lock'); x.disabled=true;
          if (x.dataset.ok==='1') x.classList.add('ok');
          else if (x===b) x.classList.add('bad');
        });
        document.getElementById('rr'+ci+'_'+qi).textContent = ok?'✅':'❌';
        document.getElementById('rh'+ci+'_'+qi).style.display='block';
        recAnswer('c'+ci+'r'+qi, ok);
      };
    });
  });
}
function recAnswer(key, ok){
  if (!progress[cur]) progress[cur]={};
  if (!progress[cur].qz) progress[cur].qz={};
  progress[cur].qz[key] = ok;
  save(); updateStats(); renderNav();
}
/* ---- big question (填空-style) ---- */
function renderOptions(c,ci){
  const box = document.getElementById('optbox'+ci);
  const isDual = !!c.dual;
  let html = '';
  if (isDual){
    for (const g of ['i','ii']){
      html += `<div class="grp"><div class="glabel">${g==='i'?'Blank (i)':'Blank (ii)'}</div><div class="opts">` +
        Object.entries(c.options[g]).map(([k,v])=>`<button class="opt" data-g="${g}" data-k="${k}" id="o${ci}_${g}${k}"><span class="ol">${k}</span>${v}</button>`).join('') + `</div></div>`;
    }
    html += `<button class="submit" id="sub${ci}" disabled>提交答案</button>`;
  } else {
    html += '<div class="opts">' + Object.keys(c.options).map(k=>`<button class="opt" data-k="${k}" id="o${ci}_${k}"><span class="ol">${k}</span>${c.options[k]}</button>`).join('') + '</div>';
  }
  box.innerHTML = html;
  const btns = [...box.querySelectorAll('.opt')];
  if (isDual){
    const sel = {};
    btns.forEach(b=>b.onclick=()=>{
      const g=b.dataset.g;
      btns.filter(x=>x.dataset.g===g).forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); sel[g]=b.dataset.k;
      document.getElementById('sub'+ci).disabled = !(sel.i&&sel.ii);
    });
    document.getElementById('sub'+ci).onclick = ()=>{ if (sel.i&&sel.ii) submitQ(c,ci,[sel.i,sel.ii]); };
  } else if (c.multi){
    const need = c.pickN || 2;
    const sel = new Set();
    const sub = document.createElement('button');
    sub.className='submit'; sub.id='sub'+ci; sub.textContent='提交答案'; sub.disabled=true;
    box.appendChild(sub);
    btns.forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if (sel.has(k)){ sel.delete(k); b.classList.remove('sel'); }
      else if (sel.size<need){ sel.add(k); b.classList.add('sel'); }
      sub.disabled = sel.size!==need;
    });
    sub.onclick = ()=>{ if (sel.size===need) submitQ(c,ci,[...sel].sort()); };
  } else {
    btns.forEach(b=>b.onclick=()=>submitQ(c,ci,[b.dataset.k]));
  }
}
function isCorrect(c, chosen){
  if (c.dual){
    const norm = c.answer.replace(/[^A-Z]/g, '');
    return chosen.slice().sort().join('') === [...norm].sort().join('');
  }
  return (c.answer.length===1) ? chosen[0]===c.answer : chosen.slice().sort().join('') === [...c.answer].sort().join('');
}
function submitQ(c,ci,chosen){
  const prev = (pOf(cur).q||{})[ci];
  if (prev) return;
  const ok = isCorrect(c,chosen);
  if (!progress[cur]) progress[cur] = { q:{}, qz:{} };
  if (!progress[cur].q) progress[cur].q = {};
  progress[cur].q[ci] = { ok, pick: chosen.slice() };
  save(); reveal(c,ci,progress[cur].q[ci],true); renderNav(); updateStats();
}
function reveal(c,ci,st,animate){
  if (c.dual){
    const pick = st.pick || [];
    ['i','ii'].forEach(g=>{
      Object.keys(c.options[g]).forEach(k=>{
        const b=document.getElementById(`o${ci}_${g}${k}`); if(!b) return;
        b.classList.add('lock');
        if (c.answer.includes(g+k)) b.classList.add('ok');
        else if (pick.includes(k)) b.classList.add('bad');
      });
    });
  } else {
    const ans = [...c.answer];
    Object.keys(c.options).forEach(k=>{
      const b=document.getElementById(`o${ci}_${k}`); if(!b) return;
      b.classList.add('lock');
      if (ans.includes(k)) b.classList.add('ok');
      else if ((st.pick||[]).includes(k)) b.classList.add('bad');
    });
  }
  const sub=document.getElementById('sub'+ci); if(sub) sub.style.display='none';
  const ex=c.explain;
  const ana=document.getElementById('ana'+ci);
  const ansTxt = c.dual ? `Blank(i) 选 ${c.answer.match(/i([A-Z])/)[1]}　Blank(ii) 选 ${c.answer.match(/ii([A-Z])/)[1]}` : [...c.answer].join('、');
  ana.innerHTML = `
    <div class="ans-line">正确答案：<span class="ok">${ansTxt}</span>
      ${st.ok===false?`　你的选择：<span class="bad">${(st.pick||[]).join('、')}</span>`:''}</div>
    <div class="ablock"><div class="atitle">① 解题思路</div><div class="acont">${md(ex['思路'])}</div></div>
    <div class="ablock"><div class="atitle">② 题干批注拆解</div><div class="annotbox">${ex.annot}</div></div>
    <div class="ablock"><div class="atitle">③ 选项辨析</div><div class="acont">${md(ex['辨析'])}</div></div>
    <div class="ablock"><div class="atitle">④ 老师点拨</div><div class="acont">${md(ex['点拨'])}</div></div>`;
  ana.style.display='block';
  if (animate) ana.scrollIntoView({behavior:'smooth', block:'start'});
}

function updateStats(){
  const les=L(cur); const p=pOf(cur);
  let total=0, done=0, right=0;
  les.cards.forEach((c,ci)=>{
    if(c.type==='quiz') total+=fullPool(c,les).length;
    if(c.type==='rootquiz') total+=c.items.length;
    if(c.type==='q') total+=1;
  });
  if(p.qz){ done+=Object.keys(p.qz).length; right+=Object.values(p.qz).filter(Boolean).length; }
  const el=document.getElementById('lp');
  if(el) el.textContent=`本讲进度：题目 ${done}/${total} 已答 · 答对 ${right}`;
}
function finishLesson(){
  if(!progress[cur]) progress[cur]={};
  progress[cur].done=true; save(); renderLesson(); window.scrollTo({top:0});
}
function resetProgress(){
  if(confirm('确定清空所有学习记录？')){ progress={}; save(); renderLesson(); }
}
function loadLesson(id){ cur=id; renderLesson(); window.scrollTo({top:0}); }
renderLesson();
</script>
