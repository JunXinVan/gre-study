分应该相反，这一部分我们应该怎么说？就说这个信息，你能看明白，所以你看选项发现哪两个可以表达这个信息能看明白最好了，当然就是b和d这个信息，它非常的易懂。所以他就可以和前面挖一部分构成相反。但是到目前为止，这道题目只说了一半儿，我们只说了为什么正确选项是对的，但是并没有说为什么错误选项是错误的。你像这道题，经常有同学选错，他怎么选？他选的是a和e两个选项，他选的是真诚。选真诚，有没有道理呢？其实绝对是有道理的，有同学就说为什么我选a和e？首先你注意它题目，开头儿x部分x部分那个while它引导的也是一个让步状语，从句因为while也叫虽然。于是的话，我们根据这个y我就知道x和y应该什么关系啊，它也应该是相反的。于是问题又来了。你像我们刚刚说这道题y和z是什么关系？y和z是相反，那x和z是什么关系啊？x和z，它显然就应该是相同了。因为x和y相反，y又和z相反，所以的话x和z它其实就是负负得正，两者应该相同的关系，于是有同学就说。你看x部分，它都已经说了作者的信息，非常的heartfelt非常的真诚，那我z应该跟它相同，不就应该再填两个真诚吗？为什么不能选真诚呢？这道题你为什么不能选两个真诚呢？是因为你如果选a和e，这两个真诚，它句子又变成了自相矛盾。你解题，你需要注意x部分，它具体怎么说呢？它不光说作者很真诚，它还多说了一点儿。他说，作者很真诚，这一点是always clear从始至终，这都看得很清楚。而这部分也是一样，你不能只看空格，你还要多看一点，你看它所在的语境。空格后边它又说什么？它说towards the end到最后。所以你就会发现什么问题啊，它前面儿x部分已经说了，作者从始至终都很真诚，所以你这一部分能不能说这本儿书到最后才变得真诚？这显然就不可以了，这又构成了自相矛盾，所以最后这道题你只能选b和d，这两个选项。所以你会发现这道题里，它确实有转折，但是x和z这两个部分之间，它并不是一个转折关系，但是你在做题的时候，你会发现你同样要遵循，避免自相矛盾这个原则。所以你将来做题也是一样，就是不管这道题，它考的是转折也好，不是转折也好，就只要是选选项，那么你就一定要避免自相矛盾。好，我们这一部分就到这里。"}, {"id": 6, "title": "第6讲 · 转折关系（下）：转折词的变体与隐蔽信号", "intro": "though/but/yet 之外，转折还有很多“变体信号”：nevertheless/nonetheless（=still，语气词陷阱！）、for all（=despite）、even（即使）、if not/any/at all（if 的熟词僻义=即使）。本讲把每个信号词讲透并配真题，最后重申转折的头号纪律——避免自相矛盾。", "cards": [{"type": "teach", "title": "① nevertheless / nonetheless ≠ 然而", "ppt": ["正确记法=仍然、还是、尽管如此", "用法跟 still 一模一样"], "text": ["这两个词你四级背的是“然而”——意思不算错，但**记“然而”会误导用法**。它们真正的用法跟 still 一模一样：①可单独表转折（第三句的位置）；②更常与 but/although 同现——此时**不是转折词，是加强语气的语气词**（=汉语“虽然…但还是…”的“还是”）。", "英语的铁律：**一个转折只能用一个转折词**（不像汉语“虽然…但是”能连用）。题目里 although + nevertheless ≠ 双重转折，真正的转折只有 although 一个，前后**只取一次反**。这就是本题型的核心陷阱。", "应对方法：看到 nevertheless/nonetheless，直接脑内替换成 still——still 你初中就会用。"]}, {"type": "q", "tag": "真题", "title": "习题集 第23页 第10题（六选二）", "source": "although + nevertheless 只取一次反", "pause": true, "multi": true, "stem": [{"t": "Although one can adduce myriad examples of ecosystem disruption by non-indigenous species, nevertheless most introduced species that survive in fact appear to have quite ______ effects on the ecosystems they have invaded."}], "vocab": [{"w": "adduce", "g": "举出（例子）", "story": "adduce an example=举例子。"}, {"w": "myriad", "g": "大量的、无数的", "story": ""}, {"w": "ecosystem disruption", "g": "生态系统破坏、扰乱", "story": "disruption=破坏扰乱。"}, {"w": "indigenous", "g": "本地的、本土的", "story": "托福词；non-indigenous=外来的。"}, {"w": "introduced species", "g": "外来物种", "story": "introduce 除了介绍=引进：从外地引进来的物种。"}, {"w": "invade", "g": "入侵", "story": "入侵物种=invasive species。"}, {"w": "marked", "g": "明显的", "story": "mark=标记→被标记出来的→显而易见。"}, {"w": "conspicuous", "g": "明显的", "story": "词根 spec/spect=look：aspect 样子（看上去什么样）；prospect 前景（往前看）；spectator 观众（看的人、游戏旁观者模式）；species 物种（字面=样子——古代给生物分类全靠看模样，三对足、头胸腹=昆虫）。"}, {"w": "minimal / trifling", "g": "极小的 / 微不足道的", "story": "trifling：数量、重要性、价值上的小。"}, {"w": "intriguing", "g": "迷人的、吸引人的", "story": ""}, {"w": "deleterious", "g": "有害的", "story": "=harmful。"}], "options": {"A": "marked", "B": "conspicuous", "C": "minimal", "D": "intriguing", "E": "trifling", "F": "deleterious"}, "answer": "CE", "explain": {"思路": "①although 已是转折，后面的 nevertheless 只是语气词（=“还是”）→全句只取一次反；②前半：外来物种破坏生态（有害）→后半：幸存的大多数外来物种影响“很小”；③选一对近义“小”：C minimal + E trifling。", "annot": "<span class='m2'>Although</span>（唯一转折）+ <span class='m5'>nevertheless=语气词，忽略</span> ⇒ 前半 <span class='m3'>破坏生态（有害）</span> → 后半 <span class='m4'>影响很小 minimal/trifling</span>。", "辨析": "A+B 明显（有害）与转折后同向；D 迷人是褒义；F 有害与转折前同向。", "点拨": "把 nevertheless 换成 still 再读一遍：“虽然例子无数，但大多数还是影响不大”——豁然开朗。spec/spect=看 这个词根串一串：aspect/prospect/spectator/species。", "词根": ["**minimal**　minim（最小）+al → 最小的", "**trifling**　trifle（琐事）+ing → 微不足道", "**marked**　mark（标记）+ed → 被标记出来 = 明显", "**intriguing**　in+tric（诡计 trick 同源）→ 有小机关 → 引起兴趣；名词=阴谋", "**deleterious**　deleter（破坏者）+ious → 有害（=harmful）"], "逻辑": "although 已是转折，后面的 nevertheless 只是加强语气的“还是”（=still），不是第二个转折 → 全句只取一次反：前半有害 → 后半影响很小。多一个转折词不等于多一次反转。", "翻译": "虽然我们能举出无数外来物种破坏本地生态系统的例子，但大多数存活下来的外来物种，事实上对它们所入侵的生态系统似乎只有极小的影响。"}}, {"type": "teach", "title": "② for all = 尽管（=despite）", "ppt": ["for all + 名词性成分 = 虽然"], "text": ["for all 是介词词组=despite：后面只能接名词性成分，不能接句子。不认识它的人会把前后当成“相同”来做，正好中套——它出现时前后取反。"]}, {"type": "q", "tag": "真题", "title": "习题集 第17页 第9题（六选二）", "source": "for all 转折", "pause": true, "multi": true, "stem": [{"t": "For all ______ the new CEO has received from the press recently, her staff have a decidedly less rosy view of her."}], "vocab": [{"w": "the press", "g": "媒体、新闻界", "story": "press 本义=压→印刷机 printing press（雕版涂墨往纸上一压）→出版社（牛津大学出版社 Oxford University Press）→报社→媒体新闻界。"}, {"w": "decidedly", "g": "明确地、毫无疑问地", "story": ""}, {"w": "rosy", "g": "乐观的、美好的", "story": "来自 rose（玫瑰）：脸色红扑扑→美好乐观。"}, {"w": "encomium / tribute", "g": "赞美 / 颂词", "story": "两者同义，本题的一对答案。"}, {"w": "evaluation", "g": "评价", "story": "中性。"}, {"w": "critique", "g": "批评；中性的评价/评论", "story": "中性词！康德《纯理性批判》critique of pure reason——不是“批评”理性，是针对理性的讨论评论。别默认它带批评色彩。"}, {"w": "publicity", "g": "公众/媒体关注", "story": "=public attention。"}], "options": {"A": "encomium", "B": "tribute", "C": "evaluation", "D": "critique", "E": "fame", "F": "publicity"}, "answer": "AB", "explain": {"思路": "①for all=尽管→前后相反；②后半：员工对她看法不那么美好（贬）→前半：媒体对她态度“美好”；③选一对近义的“赞美”：A encomium + B tribute。", "annot": "<span class='m2'>For all 尽管</span> ⇒ <span class='m4'>媒体（赞美）</span> vs <span class='m3'>员工（不美好）</span> → A+B。", "辨析": "C 评价、D 评论（critique 在这里是中性“评论”不是批评）都太中性；F 关注≠态度好。", "点拨": "这题的难度全在认不认识 for all——它一出现就是转折信号，不存在其他含义。", "词根": ["**encomium**　en（在…中）+com（宴乐）→ 宴会上的赞辞", "**tribute**　tribut（给）→ 贡品；敬辞"], "逻辑": "抓 for all=尽管 → 前后相反；后半“不那么美好” → 前半=赞美。这题的唯一难度就是认不认识 for all——它只可能是转折。", "翻译": "尽管这位新 CEO 最近受到了媒体的交口称赞，她的员工对她的看法却显然没那么乐观。"}}, {"type": "teach", "title": "③ even 自己也能表转折（即使）", "ppt": ["even（though/if 之外）单用=即使、虽然"], "text": ["even 常与 though/if 搭配表转折，但它**自己也能表转折**（即使）。看到 even 引导的内容与主句并存，就是“即使…也…”的让步结构，前后取反，且后半句往往暗含“有限、没那么好”的意味。"]}, {"type": "q", "tag": "真题", "title": "习题集 第13页 第8题（六选二）", "source": "even 转折 + 动作与主语的搭配", "pause": true, "multi": true, "stem": [{"t": "Even overt deficiencies in the author’s work have not ______ its respectful reception by most modern critics."}], "vocab": [{"w": "overt", "g": "明显的", "story": ""}, {"w": "deficiency", "g": "缺点、缺陷、不足", "story": "本义=缺乏；deficient 缺乏的，反义词=你无比熟悉的 sufficient（充足的）。完美对应汉语“不足”：数量不够+能力不够。"}, {"w": "reception", "g": "态度、反应（熟词僻义）", "story": "receive=接受→以某种态度接受：the movie was well received=受到好评；名词 reception=态度反应。respectful reception=恭敬的态度。"}, {"w": "taint", "g": "破坏、玷污（名声）", "story": "玷污好名声。"}, {"w": "supersede", "g": "代替、取代", "story": "super=在上边（superior 上级=上边的人；superstructure 上层建筑）+sed/sid=seat（sediment 沉积物；preside 主持=坐前边；president 坐在最前面的人）；坐到别人头顶上=地位超过→取代。"}, {"w": "inhibit", "g": "妨碍、阻碍", "story": "hibit=限制：exhibit 放到外边去=展览；prohibit 对…做限制=禁止。"}, {"w": "proscribe / forbid", "g": "禁止", "story": "同义词=prohibit。禁止的发出者必须有权威。"}], "options": {"A": "taint", "B": "hinder", "C": "supersede", "D": "inhibit", "E": "proscribe", "F": "forbid"}, "answer": "BD", "explain": {"思路": "①even=即使→让步：作品有明显缺陷，但并没有____评论家的恭敬态度→空格填负面动词“妨碍”；②两组负面候选：B+D（妨碍）vs E+F（禁止）；③看主语：发出动作的是 deficiency（缺陷）——缺陷只能“妨碍”喜欢，不可能“禁止”喜欢（禁止是有权威的人/组织做的事）→B+D。", "annot": "<span class='m2'>Even 即使</span> <span class='m3'>有缺陷</span> → 也没有<span class='m4'>妨碍（hinder/inhibit）</span>大家的喜爱。禁止？缺陷没这个权力。", "辨析": "同反判断剩多组候选时，代入看“动作与主语的搭配合理性”：deficiency 不能 proscribe/forbid。", "点拨": "**动词题多一重检查：谁发出这个动作？** 主语和动词的搭配合理性是六选二的隐藏筛子。", "词根": ["**hinder**　hind（后，hind legs 后腿）→ 拖后腿 = 阻碍", "**inhibit**　in（内）+hibit（持 hold）→ 约束 = 妨碍", "**taint**　本义=染色 → 玷污", "**supersede**　super（上）+sed（坐）→ 坐到你头上 = 取代", "**proscribe**　pro（公开）+scribe（写）→ 写下来公示 = 正式禁止"], "逻辑": "even=让步 → “有缺陷”没能阻止喜爱 → 空格=负面动词。两组候选再按主谓搭配收网：发出动作的是 deficiency（缺陷）——缺陷只能“妨碍”你，没权力“禁止”你。", "翻译": "即便作者作品中那些明显的缺陷，也没有妨碍它受到大多数现代评论家的恭敬对待。"}}, {"type": "q", "tag": "真题", "title": "习题集 第98页 第10题（六选二）", "source": "even 转折 + “有限的好”", "pause": true, "multi": true, "stem": [{"t": "His premiership, seemingly cast iron a year ago, is now so vulnerable that even a good day at the office does no more than buy him a few weeks of ______ from rebels within his own party."}], "vocab": [{"w": "premiership", "g": "总理身份、总理地位", "story": "premier=总理。"}, {"w": "cast iron", "g": "坚如铸铁、非常坚固", "story": "cast=铸造→铸铁（炒菜大铁锅的材质）；铸铁极结实→引申=坚如磐石，字面“坚如铸铁”。"}, {"w": "vulnerable", "g": "脆弱的、易受伤害的", "story": ""}, {"w": "rebel", "g": "反叛者、造反派", "story": ""}, {"w": "do no more than", "g": "至多、充其量", "story": "does no more than buy him…=充其量只能给他换来…"}, {"w": "controversy", "g": "争议", "story": "contr=相反（contrary/contrast）：争议=人们观点上的对立（有人喜欢有人不喜欢）。"}, {"w": "reproach / blame", "g": "批评", "story": ""}, {"w": "respite / relief", "g": "暂时的缓解、暂时的解脱", "story": "背单词累了刷5分钟微博=respite；说好5分钟结果变永久=人性。字典译“喘息之机”也对。"}, {"w": "deference", "g": "尊敬", "story": ""}], "options": {"A": "controversy", "B": "reproach", "C": "respite", "D": "relief", "E": "blame", "F": "deference"}, "answer": "CD", "explain": {"思路": "①even=即使：很好的一天也好的有限（=“即使小明是胖子，也只是个小胖子”）；②空格要体现“有限的好”：respite/relief=暂时的缓解——是好事，但“暂时”=非常有限；③C+D。", "annot": "<span class='m2'>even 即使</span> <span class='m3'>good day 很好的一天</span> → 也<span class='m4'>只是“暂时的”缓解（有限的好）</span> → C+D。", "辨析": "B+E（批评）方向就不对；A 争议中性；F 尊敬是无限的正面，体现不出“有限”。", "点拨": "even 引导的让步常暗含“程度有限”：即使好也好得有限。抓“有限”二字，选项范围立刻收窄。", "词根": ["**respite**　respicere（回头看）→ 喘息之机", "**relief**　re（回）+lief（轻 lev）→ 减轻 → 解脱", "**controversy**　contro（反）+vers（转）→ 意见相左 = 争议", "**reproach**　re（回）+proach（靠近）→ 回头指责", "**deference**　de（下）+fer（带）→ 放低自己 = 尊敬"], "逻辑": "even=让步 → “顺利的一天”也好的有限 → 空格=“有限的好” → 暂时的缓解（好，但“暂时”=非常有限）。even 让步常暗含程度有限，抓这个感觉。", "翻译": "他的总理地位一年前看上去还坚如磐石，如今却脆弱到：即便他在办公室里度过了顺利的一天，也至多能换来党内反对派几周暂时的平息。"}}, {"type": "teach", "title": "④ if 的熟词僻义：if not / if any / if ever = 即使", "ppt": ["if + not/any/at all/ever → if 不再是“如果”，是“即使”"], "text": ["if 后面出现 not、any、at all、ever 这类否定性/准否定词时，if 就不是“如果”，而是**转折词“即使”**：the task would be difficult if not impossible=这任务即使不是不可能，也非常困难（if not≈although not）。hundreds if not thousands=即使没有几千，也有几百；few if any changes=即使有变化也极少；rarely if ever=即使准时也少得可怜。", "逻辑账：if（即使，取反）+ not（否定，再取反）= **负负得正**，空格与后面的大方向一致——再叠加“程度区别”避免自相矛盾（下题就是教科书）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第199页 第10题（六选二）", "source": "if not 负负得正 + 程度区别", "pause": true, "multi": true, "stem": [{"t": "In its few decades of existence, the field of technology assessment has undergone large changes: its original high ambitions to predict the consequences of technology have been ______, if not discarded."}], "vocab": [{"w": "undergo", "g": "经历、经受", "story": "字面=go under。"}, {"w": "discard", "g": "抛弃、放弃", "story": "来自扑克牌 card：手里牌不好，牌一丢认输。"}, {"w": "defer", "g": "推迟", "story": "defer a decision。"}, {"w": "subvert", "g": "颠覆", "story": "vert/vers=转：convert 转变（汉语“转换”也带转）；revert 逆转；reverse 倒挡（汽车档位上的 R）。"}, {"w": "abandon / relinquish", "g": "放弃", "story": "两者同义。"}, {"w": "temper（动词）", "g": "限制、减弱", "story": "名词=脾气；lose one’s temper 大发脾气=**失去约束/失控**；quick-tempered 发火前忍耐时间短→脾气与“限制”本是一家。"}, {"w": "modulate", "g": "调整；减弱", "story": "两个意思都有。"}], "options": {"A": "defer", "B": "subvert", "C": "abandon", "D": "relinquish", "E": "tempered", "F": "modulated"}, "answer": "EF", "explain": {"思路": "①if not discarded=即使没有被抛弃：if（即使，反①）+ not（反②）=负负得正→空格与 discard 同向（负面）；②候选：C+D（放弃）或 E+F（减弱）；③选 E+F：C/D=放弃与 discarded 同义→“即使没被抛弃也被抛弃了”=自相矛盾；temper/modulate（减弱）程度低于抛弃→程度区别化解。", "annot": "<span class='m2'>if not discarded</span> ⇒ 负负得正 → 填 <span class='m3'>抛弃同向</span> 的词；C/D=discard 同义 <span class='m5'>撞车矛盾</span> → E/F 程度更低 → 成立。", "辨析": "这题把本讲两个考点叠在一起：if not 的双重否定 + 程度区别防矛盾。单看方向会落在 C+D，靠“矛盾”二字完成绝杀。", "点拨": "跟第5讲153-4同构：负负得正定方向，程度区别定答案。vert=转 串：convert/revert/reverse/subvert。", "词根": ["**subvert**　sub（下）+vert（转）→ 转到底下 = 颠覆", "**abandon**　a-（去）+ban（禁令）→ 放逐 → 放弃", "**relinquish**　re（回）+linqu（离开）→ 放手"], "逻辑": "if not discarded=即使没被抛弃：if（即使，反一次）+ not（反一次）=同向 → 空格与 discard 同向但更轻 → “减弱”。弃选 C/D（放弃）因为与 discarded 同义撞车——“即使没被抛弃也被抛弃了”是病句。", "翻译": "技术评估这个领域在存在的短短几十年里经历了巨大变化：它最初那个预测技术后果的宏大目标，即使没有被抛弃，也已经减弱了。"}}, {"type": "teach", "title": "⑤ 本讲小结", "ppt": ["转折信号词变体速查"], "text": ["**速查**：nevertheless/nonetheless=still（可与 although 同现，只取一次反）｜for all=despite（接名词）｜even=即使（后半句常暗含“有限”）｜if not/any/ever=即使（if 的熟词僻义，与 not 叠加负负得正）。", "**两条全程纪律**：①一个转折只取一次反（额外的是语气词）；②同向候选用“程度区别/主谓搭配/是否矛盾”收网——这些比认信号词更容易拉开分差。"]}], "transcript": "接下来，这一部分我们来说一些做填空题的时候，值得注意的转折词。首先，第一组单词叫做nevertheless，还有nonetheless这两个词。不出意外，你在四级单词里都已经背过，你背的意思应该是叫做然而。但需要注意的是，从今以后，这个词不要再记然而了，这两个词它正确的记法应该是叫仍然还是或者是叫尽管如此。有同学说我之前一直都记得是，然而这个难道记错了吗？然而这个翻译并没有错，因为nevertheless采用nonetheless它们俩就是个转折词，所以然而汉语也是转折词，所以然而这个翻译并不能说是翻译错了。但为什么不让你记，然而呢，就是你如果把这两个词记成，然而你很容易把这两个词的用法理解错，你如果记然而的话，你就很容易误以为nevertheless和nonetheless这两个词，它的用法跟however是一样的。但实际上，英语里这两个单词的用法跟however可以说是完全不一样。英语里nevertheless和nonetheless这两个词怎么用呢？它跟表示仍然或者叫还是的那个still是一模一样的。style怎么用？那这两个词也怎么用？still，这个词怎么用？我们先来看几个例子。比如像屏幕上这几句话，第一句它说he had finished the required reading list，but still failed the test。翻译过来就叫他该读的书都已经读过了，但还是没有考过。第二句话说，although he had finished the required reading list，he still failed the test翻译过来，还是叫虽然他该读的都读过了，但是考试还是没有考过。第三句话说he had finished the required the reading list still he failed the test翻译过来，就是说他该读的都读过了，但是他还是没有考过。这三个句子你会发现它都有still，那现在问你一个问题，这三句话里边儿其中哪一句或者是哪几句它的still，你可以把它换成however呢？显然就是只有第三句的still，你可以换成however前两个句子都是不可以换的。为什么前两个句子里still你不可以换成however因为英语它转折关系有这样一个规定，就是一个转折就只能用一个转折词。这也是英语和汉语一个很大的区别，你像汉语一个转折可以用两个转折词，我们经常在汉语里虽然，但是它可以一起出现。但英语就不行，英语你用了，虽然就不允许再用，但是你用了，但是就不能再用，虽然。所以像上两个句子，它们共同特点就是它里边儿都已经有了一个转折词了，要么有but要么有，although所以你就不能再用一个转折词，however。只有第三个句子，你可以把那个still换成however。但需要注意的是什么呢？就是这三句话里边儿的still你全都可以把它换成nevertheless，或者是nonetheless。这就是nevertheless和nonetheless这两个词，它在用法上跟however最大的区别。这两个词用法上有什么特点呢？就是它跟steel一样，它可以自己用表转折，你比如像屏幕上的第三句话。同时，它也可以和其他的转折词一起用，共同表示转折，比如像屏幕上的前两句话。你像前两句话still nevertheless和nonetheless它和其他的，比如像although but这种普通的转折词一起出现表转折的时候。那么，这个still nevertheless和nonetheless它严格来讲，它其实不是一个转折词，它严格来讲是一个语气词，它的功能就是在加强原有那个转折的语气。所以翻译成汉语，就叫仍然或者是还是。你像咱们汉语里仍然还是很多时候就可以用来加强转折的语气，比如像汉语，我们很多时候说虽然，但是觉得不过瘾怎么办？我们就再改一下，我们说虽然怎么怎么样，但还是怎么怎么样，或者叫但仍然怎么怎么样，仍然还是它就可以加强转折的语气。而在英语里，可以用来加强转折语气的就是这么三个词，still nevertheless和nonetheless。于是你在做题的时候就要注意什么问题呢？很多填空题，它出题怎么出它？比如说开头写一个，although后半句又写一个，nevertheless。很多同学nevertheless他就继承了，然而他又误以为这道题是两个转折，他觉得although一个转折nevertheless又一个转折，两个转折呢，应该负负得正，前后应该是相同，结果就做错了。你要注意它题目，如果已经有although了，那它再给你写一个 思都有。好，你看这道题应该选哪两个选项？我们一起来看这道题目。题目说in this few decades of existence，the field of technology assessment has undergone large changes。就是说在它存在的几十年之中，技术评估这个领域，它经历了巨大的变化。后半句说it&apos;s original high ambitions to predict the consequences of technology have been空格，if not discarded。它起初宏大的目标就是要去预言技术的影响，这个目标即使没有被抛弃，它也是被空格。解这道题靠什么呢？就靠最后那个if not discovered，你注意if后边儿接了一个否定词not，所以在这里边儿if就像我们刚刚说它是一个转折词，翻译成汉语叫即使。所以它既然是转折了，那么前后就要取反。同时，不要忘了后边儿否定词该取反还是要取反的，所以not它又取了一次反，于是你会发现这道题if取一次反not取一次反负负得正，它又取了两次反，最后相当于是没取反。所以空格怎么填啊？空格你又要填跟那个discard抛弃放弃大方向一致的词，也就是要填负面的词。看到选项发现，它能表示负面，并且意思还得一样的，要么就是CD两个放弃，要么就是ef两个减弱，或者是限制。那最后应该是选CD还是选e和f呢？最后答案显然选的是e和f。为什么不可以选c和DC和d？它的错误的点又在于我们之前说的自相矛盾。你想你如果选c和d的话，句子就变成了什么意思啊？就变成了这个目标，即使没有被抛弃，它也被抛弃了，所以这到底是抛弃还是没抛弃，所以它不能选。而e和f它为什么可以选？因为它在程度上跟抛弃是有区别的，它的程度比抛弃要低得多。所以填进去啥意思啊？就是说这个目标即使没有被抛弃，它现在也不像之前那么强了。所以这两个选项填进去，它就不矛盾。所以总之再一次强调大家做转折的题目的时候，一定要注意自相矛盾，这个考点最后你选选项的时候一定不要选自相矛盾的选项。好转折关系，我们就说到这里。"}, {"id": 7, "title": "第7讲 · 解释关系（上）：冒号与同义推理", "intro": "解释关系=前后相同。冒号是最典型的信号，但真题里的玩法很多：双空题有的必须两个空一起解、三句结构的 xyz 同反推理、否定词叠加负负得正。本讲还包含三空题的完整专题（94页第6题），讲透三空题为什么不能慌。", "cards": [{"type": "teach", "title": "① 双空题的两种形态", "ppt": ["大部分双空=两个单空，可分开做", "少数双空必须一起看选项凑一对同义/反义"], "text": ["之前做的双空题都能“先解一空、再解另一空”——本质是把它拆成两个单空题。但少数双空题**两个空必须一起做**：题干只告诉你“两空应相反/相同”，但具体填什么意思的反义，不看选项你永远不知道。", "做这种题需要耐心：到选项里挨个试搭配，凑出你需要的那一对同义词或反义词。考场上遇到别慌，试完所有组合，答案自然浮出来。下面 9-3 和 16-5 就是两个样本。"]}, {"type": "q", "tag": "真题", "title": "习题集 第9页 第3题（双空题）", "source": "两空一起做：凑一对反义", "pause": true, "dual": true, "stem": [{"t": "The economic recovery was somewhat lopsided: ______ in some of the industries, while ______ in others of them."}], "vocab": [{"w": "lopsided", "g": "不均衡的、一边倒的", "story": "lob=下垂：天平一边垂下来→两边不一样重→不均衡。"}, {"w": "industry", "g": "行业、产业（≠工业）", "story": "考试更爱考“行业”：教育产业=the education industry。"}, {"w": "feeble", "g": "脆弱的、弱的", "story": "=weak。"}, {"w": "swift", "g": "迅速的", "story": ""}, {"w": "robust", "g": "强有力的", "story": "=strong。"}, {"w": "turbulent", "g": "混乱的、动荡的", "story": "名词 turbulence：坐飞机遇到乱流 we have encountered D": "subtlety", "E": "discursion", "F": "exhaustiveness"}}, "answer": "iB,iiE", "explain": {"思路": "①but 转折取反一次；②开头 irked（不喜欢）→结尾 regard as an asset（喜欢）又取反一次；③负负得正→两空填一对同义词；④一起看选项凑：东扯西扯没主题 → B aimlessness + E discursion（都=跑题没主题）。", "annot": "<span class='m2'>but</span>（反①）+ <span class='m3'>irked 不喜欢 → asset 喜欢</span>（反②）= 负负得正 ⇒ 两空=<span class='m4'>同义：跑题/没主题</span>。", "辨析": "整句意思：一开始不喜欢这书老跑题，看进去之后反而喜欢上它的跑题。填反义词就违背句意——这是“负负得正”的经典布局。", "点拨": "数反转：转折词一次、褒贬翻转一次。exhaustive/subtle 这类“别记字典翻译”的提醒值得抄进单词本。", "词根": ["**aimlessness**　aim（目标）+less（无）→ 漫无目的", "**discursion**　dis（离）+curs（跑）→ 跑题", "**flippancy**　flipp（轻佻）+ancy → 轻浮不严肃", "**tendentiousness**　tend（倾向）+entiousness → 带倾向性=不公正", "**subtlety**　sub（下）+tle → 藏在底下=不明显", "**exhaustiveness**　ex（出）+haust（抽干）→ 彻底详尽"], "逻辑": "数反转：but 转一次；“不喜欢”→“视为优点”再转一次 → 负负得正 → 两个空同义。方向数清楚之前别急着看选项。", "翻译": "读者起初可能不喜欢这本书明显的跑题，但一旦沉浸到作者的文字中，他们反而可能把作品的这种跑题视为一个优点。"}}, {"type": "q", "tag": "真题", "title": "习题集 第15页 第3题（双空题）", "source": "xyz 三句结构推理", "pause": true, "dual": true, "stem": [{"t": "While people complain about their hectic lives and demanding schedules, one might be justified in suspecting that they are being somewhat ______: compulsive busyness seems to be for many a source of ______."}], "vocab": [{"w": "hectic", "g": "繁忙的、忙乱的", "story": ""}, {"w": "demanding", "g": "艰难的、要求高的", "story": "不停向你 make demands→要求极高。"}, {"w": "justified", "g": "合理的", "story": "justify=使合理、找借口找理由（just 公正+ify 使动）；justification=理由、合理性；justice 正义。"}, {"w": "compulsive", "g": "忍不住的、强迫症一样的", "story": "≠compulsory（义务的、强制的：义务教育 compulsory education）；都来自 compel（强迫）；compelling=迷人的。OCD 强迫症=obsessive compulsive disorder。"}, {"w": "disingenuous", "g": "虚伪的、不真诚的", "story": "ingenuous=天真没心眼（成天上当受骗）→dis-取反=心眼太多→虚伪。**形近：ingenious=聪明巧妙的**——借 genius 区分：ingenious 和 genius 都含 geni，聪明和天才更近。"}, {"w": "guarded", "g": "小心的、提防的", "story": "guard 守卫→有所防备。"}, {"w": "dilatory", "g": "缓慢的、拖延的", "story": ""}, {"w": "despair", "g": "绝望", "story": "形容词 desperate（绝望主妇 Desperate Housewives）。"},  "story": "嵌在什么之中。"}, {"w": "dense", "g": "晦涩难懂（GRE）；浓密的（本义）", "story": "dense fog 浓雾→看不透→写文章让人看不透=晦涩。"}, {"w": "vapid", "g": "乏味的、无聊的", "story": ""}, {"w": "inaccessible", "g": "晦涩难懂的", "story": "accessible：地方=容易到达；人=平易近人；书=通俗易懂。inaccessible=难懂。"}, {"w": "sagacious", "g": "智慧的、睿智的", "story": "sage=智者。"}, {"w": "opaque", "g": "晦涩难懂的（GRE）；不透明的（本义）", "story": "不透明→看不透→看不懂。与 dense 同构。"}, {"w": "distressing", "g": "令人痛苦的", "story": "dis+stress：特别不好的压力→痛苦。"}], "options": {"A": "vapid", "B": "inaccessible", "C": "sagacious", "D": "banal", "E": "distressing", "F": "opaque"}, "answer": "BF", "explain": {"思路": "①链条：见解被嵌入 dense 的英译、dense 的德文原著→对读者当然是 dense；②选一对“晦涩难懂”：B inaccessible + F opaque。", "annot": "<span class='m3'>dense 英译 ← dense 德语原文</span> ⇒ 使得见解对读者 <span class='m4'>晦涩难懂</span>。", "辨析": "A 乏味、D 陈腐都是“内容差”，而题目说的是“读不懂”；C 睿智褒义；E 痛苦偏离。dense/opaque 的“看不透→看不懂”引申链值得记住。", "点拨": "这是定语从句的送分形态：that 从句顺着前面的形容词链推，答案就是同一对词。", "词根": ["**banal**　ban（陈规/公告）+al → 老掉牙 = 陈腐"], "逻辑": "顺着形容词链推：见解被包在 dense 的英译里，英译来自 dense 的德文 → 对读者必然还是 dense → 空格=dense 的同义词。全句没有逻辑词，靠“链式修饰”传递同义。", "翻译": "《现代性观察》收录的文章里有许多深刻见解，但它们都嵌在晦涩的英译里——而译文又来自同样晦涩的德语原文，这使得大多数读者难以理解其中许多见解。"}}, {"type": "q", "tag": "真题", "title": "习题集 第184页 第10题（六选二）", "source": "定语从句限定工具特点", "pause": true, "multi": true, "stem": [{"t": "In their quest for kinder cutting, physicians increasingly rely on endoscopic surgery, replacing large scalpels and clamps with cameras and ______ tools that snake into the body through tiny holes."}], "vocab": [{"w": "quest", "g": "追求、追寻", "story": "游戏里的“任务”=quest——RPG 任务无非是找宝物或干掉某人，都离不开找。"}, {"w": "physician", "g": "医生（≠物理学家）", "story": "物理学家=physicist。"}, {"w": "scalpel / clamp", "g": "手术刀 / 手术钳", "story": "医学名词，解题不用认识。"}, {"w": "snake（动词）", "g": "蛇形运动、像蛇一样钻行", "story": ""}, {"w": "flexibility", "g": "灵活", "story": "flexible。"}, {"w": "rigid", "g": "刚性的；死板的", "story": "本义=不易形变（材料）；形容人=不知变通（拘泥规定一字不差执行）。"}, {"w": "magnitude / enormity", "g": "巨大", "story": "magn=大：magnify 放大、magnifier 放大镜；enormity 来自 enormous。"}, {"w": "supple", "g": "柔软的、灵活的", "story": "工具柔软灵活→能扭来扭去。"}, {"w": "precision", "g": "精确", "story": ""}], "options": {"A": "flexible", "B": "rigid", "C": "precise", "D": "supple", "E": "enormous", "F": "mammoth"}, "answer": "AD", "explain": {"思路": "①定语从句 that snake into the body through tiny holes 规定了工具的特点：能蛇形钻过小孔→灵活柔软；②选一对：A flexible + D supple。", "annot": "从句 <span class='m3'>snake into the body through tiny holes 蛇形钻小孔</span> ⇒ 工具必须 <span class='m4'>灵活柔软 flexible/supple</span>。", "辨析": "B rigid 死板（钻不了）、C precise 精确（与钻行无关）、E/F 巨大（反而进不去）。定语从句就是空格的“岗位要求说明”。", "点拨": "用“岗位要求”思维读定语从句：从句描述的行为，就是空格词必须支持的行为。", "词根": ["**precise**　精确的（pre 先+cis 切=预先切准）"], "逻辑": "定语从句 that snake into the body 是器械的“岗位要求” → 空格词必须支持这个行为 → 能蛇行钻小孔=柔软灵活。用“岗位要求”思维读定语从句。", "翻译": "为了切得更温和，医生越来越依赖内窥镜手术——用摄像头和柔韧的器械取代大手术刀和钳子，这些器械能从小孔里蛇行进入身体。"}}, {"type": "q", "tag": "真题", "title": "习题集 第21页 第3题（双空题）", "source": "despite + 省略 that 的定语从句", "pause": true, "dual": true, "stem": [{"t": "Despite the scathing precision with which she satirizes the lives of social aspirants and moneyed folk, the writer appears to ______ being part of the world she presents as so ______."}], "vocab": [{"w": "scathing", "g": "激烈、尖刻、毫不留情的", "story": "形容措辞。"}, {"w": "satirize", "g": "讽刺", "story": ""}, {"w": "social aspirants", "g": "想提高社会地位的人", "story": "aspire=有志向；social aspirant=攀高枝的人。"}, {"w": "moneyed folk", "g": "有钱人", "story": "folk=people。"}, {"w": "present as", "g": "描绘成、表现成", "story": "present 接 as=把…描绘成…。"}, {"w": "abhor", "g": "厌恶、反感", "story": "hor=害怕（horror/horrible）：怕蜘蛛→厌恶蜘蛛。"}, {"w": "relish", "g": "享受、喜欢", "story": "=enjoy。"}, {"w": "evoke", "g": "唤起、激起", "story": "激起情绪、唤起记忆。"}, {"w": "insufferable", "g": "让人无法忍受的", "story": "suffer 忍受→in-不+能忍。"}, {"w": "enchanting", "g": "迷人的", "story": "enchant 施魔法：着魔→迷人。讽刺的人嘴上不会说它迷人。"}], "options": {"i": {"A": "abhor", "B": "relish", "C": "evoke"}, "ii": {"D": "unattainable", "E": "insufferable", "F": "enchanting"}}, "answer": "iB,iiE", "explain": {"思路": "空1：despite 转折——表面上讽刺（不喜欢）→实际上 relish 喜欢 B。空2：句尾是省略 that/which 的定语从句：the world (that) she presents as so __——问的是作者**嘴上把世界描绘成什么样**；作者嘴上在讽刺=说世界不好→贬义 E insufferable（不是 F enchanting：讽刺的人不会把世界说得迷人）。", "annot": "空1：<span class='m2'>despite</span> <span class='m3'>讽刺（表面不喜欢）</span> → 实际<span class='m4'>relish 喜欢</span>。空2：定语从句问的是<span class='m3'>嘴上描绘的世界</span> → <span class='m4'>贬义 insufferable</span>。", "辨析": "错选 F 的人以为 despite 之后要填褒义——但空格在“她描绘的”世界里，不是世界真实的样子。**表面态度 vs 实际态度**差一个定语从句。", "点拨": "题干末尾不完整（presents as so __）时，先补全从句再读：the world WHICH she presents as so __。", "词根": ["**insufferable**　in（不）+suffer（忍）+able → 难以忍受", "**abhor**　ab（离）+hor（怕，horror 同源）→ 怕而远之=厌恶", "**evoke**　e（出）+vok（喊）→ 喊出来=唤起", "**unattainable**　un+at（向）+tain（拿）→ 够不着"], "逻辑": "先抓 despite → 表面讽刺（不喜欢）vs 实际喜欢 → 空1=享受；空2 注意句尾是省略 that 的定语从句“她（嘴上）所描绘的世界” → 问的是嘴上态度 → 讽刺=说世界不好 → 贬义。表面 vs 实际，差一个定语从句。", "翻译": "尽管她讽刺上流新贵和有钱人的生活时一针见血、毫不留情，这位作家似乎却很享受成为其中一员——对她所描绘的那个如此令人难以忍受的世界乐在其中。"}}, {"type": "q", "tag": "真题", "title": "习题集 第36页 第1题（单空题）", "source": "并列定语从句的双 think of as 结构", "pause": true, "stem": [{"t": "The idea of a language instinct may seem ______ to those who think of language as the zenith of the human intellect and of instincts as brute impulses."}], "vocab": [{"w": "instinct", "g": "本能、直觉", "story": ""}, {"w": "zenith", "g": "顶峰、顶点、最高点", "story": ""}, {"w": "brute", "g": "野蛮的、蛮干的", "story": "brute force 蛮力。"}, {"w": "impulse", "g": "冲动", "story": "impulse buying 冲动消费（超市大减价买一堆用不上的）。"}, {"w": "jarring", "g": "令人不悦的、刺耳的", "story": "拟声词“兹儿兹儿”刺耳声→刺耳→让人不舒服。"}, {"w": "plausible", "g": "合理的", "story": "**别记“貌似合理”**！=合理的：说法听上去靠谱可能成立。记“貌似”会让你脑补“实际不合理”而做错题。"}, {"w": "gratifying", "g": "令人高兴的、满意的", "story": "grat=pleasing：grateful 感激的，本义=高兴→感激。"}, {"w": "inevitable", "g": "必然的、无法避免的", "story": ""}, {"w": "conciliatory", "g": "安抚的、和解的、妥协的", "story": "council 委员会本义=商量商议：conciliatory=愿意商量的态度=不强硬（哄你吃饭 vs 摔碗）。"}], "options": {"A": "jarring", "B": "plausible", "C": "gratifying", "D": "inevitable", "E": "conciliatory"}, "answer": "A", "explain": {"思路": "①句子结构：两个并列定语从句 think of language AS the zenith AND (think) of instincts AS brute impulses——第二个 think 省略；②在那些人心目中：语言=人类智慧顶峰，本能=野蛮冲动——最厉害+最不厉害；③“语言本能”把两者结合→那些人必然觉得这个思想有问题→贬义 A jarring。", "annot": "定语从句里 <span class='m3'>语言=最厉害</span> + <span class='m3'>本能=最不厉害</span> → “语言本能”结合两者 → 在他们看来<span class='m4'>别扭 jarring</span>。", "辨析": "B plausible 合理是褒义；C 高兴、D 必然、E 安抚都不含“无法接受”。看到 and of…as 要反应过来=think of…as 的并列省略。", "点拨": "plausible 只记“合理”——英汉字典的“貌似合理”是 poison（自带反转暗示），老师特别提醒。", "词根": ["**jarring**　jar（刺耳声）+ing → 刺耳=令人不悦", "**plausible**　plaus（鼓掌）+ible → 值得鼓掌=貌似合理", "**gratifying**　grat（高兴，grateful 同源）+ify+ing → 令人满意", "**inevitable**　in（不）+evit（避免）+able → 躲不开=必然", "**conciliatory**　con（一起）+cili（召集，council 同源）→ 愿意商量=和解"], "逻辑": "句子结构=两个并列定语从句：语言=最高智慧，本能=最低级 → 把最厉害和最不厉害的捏成一个词 → 那些人必觉得别扭 → 选贬义（刺耳）。并列结构对等原则帮你切分长句。", "翻译": "“语言本能”这个观念，在那些认为语言是人类智慧顶峰、而本能只是蛮力冲动的人听来，恐怕是刺耳的。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第45页 第1题（单空题）", "source": "seldom=not；定语从句的逆向推理", "pause": true, "stem": [{"t": "Though humanitarian emergencies are frequent features of television news, such exposure seldom ______ the public, which rather seems resigned to a sense of impotency."}], "vocab": [{"w": "humanitarian", "g": "人道主义的", "story": "humanitarian emergency=人道主义危机。"}, {"w": "feature", "g": "（新闻的）主题、报道", "story": "接 television news：新闻报道的主题。"}, {"w": "exposure", "g": "报道", "story": "跟在新闻后=报道。"}, {"w": "resigned", "g": "逆来顺受的、接受的", "story": "resign 本义=放弃→辞职→放弃抵抗→（对不喜欢又没办法的事）接受：不喜欢背单词但不得不背=resigned。"}, {"w": "impotency", "g": "无能为力", "story": ""}, {"w": "paralyze", "g": "使不知所措（GRE）；使瘫痪（本义）", "story": "吓得呆住跟瘫痪一样。"}, {"w": "demoralize", "g": "使沮丧、使士气低落", "story": "morale 士气。"}, {"w": "assuage", "g": "安抚", "story": ""}, {"w": "galvanize", "g": "激励、鼓舞", "story": "人名 Galvani（加凡尼）：给青蛙腿通电发现肌肉收缩→通电→电镀→激励。"}, {"w": "exasperate", "g": "激怒", "story": "把别人惹毛。"}], "options": {"A": "paralyze", "B": "demoralize", "C": "assuage", "D": "galvanize", "E": "exasperate"}, "answer": "D", "explain": {"思路": "①seldom=not（否定词）；②定语从句：公众 resigned to impotency（自认无能为力）→新闻不能让他们觉得自己“有能力”；③seldom 已是否定→空格填“让他觉得有能力”=激励 D galvanize。", "annot": "<span class='m2'>seldom</span>=not ⇒ 空格=<span class='m4'>“使其有能力”</span>（公众自认 <span class='m3'>impotency 无能</span>，新闻激励不了他们）。", "辨析": "代入闭环：不管怎么报道危机都激励不了公众采取行动——因为公众觉得“我什么都做不了”。A 不知所措、B 泄气、C 安抚、E 激怒都不与“无能感”构成反义。", "点拨": "做填空 seldom 直接当 not 用（只看同反，不用翻“很少”）。定语从句说公众的特性，空格就填它的反面——这是“逆向使用”从句的样本。", "词根": ["**exasperate**　ex+asper（rough 粗糙→惹毛）+ate：英文解释更具体——by CONTINUING to do something that upsets them（持续做惹恼对方的事）。It exasperates me"], "逻辑": "seldom=否定词（直接当 not 用） → 新闻报道“不能”让公众怎样；定语从句说公众 resigned to impotency（自认无能） → 空格=“让其有能力”=激励。否定词+定语从句，一正一反夹出答案。", "翻译": "人道主义危机虽然是电视新闻的常客，但这种报道很少能激励公众——公众反倒像是已经接受了自己的无能为力。"}}, {"type": "teach", "title": "③ 举例子：such as / for instance → 前后相同", "ppt": ["例子是解释的一种 → 例与前文同义"], "text": ["举例子的作用就是解释——说了一个东西别人不懂，举个例子。所以 such as / for instance / for example 后面的内容与前文意思相同。", "**看清空格修饰谁**（44-9 的坑）：空格可能修饰的不是你第一反应的那个词。"]}, {"type": "q", "tag": "真题", "title": "习题集 第44页 第9题（六选二）", "source": "such as 前后相同 + 修饰对象辨析", "pause": true, "multi": true, "stem": [{"t": "In IE culture, elaborate carving has often been used to enhance ______ objects such as harpoon heads and other tools."}], "vocab": [{"w": "elaborate", "g": "精细的、精美的", "story": "e+labor：通过劳动做出来的→下了功夫。"}, {"w": "carving", "g": "雕刻", "story": ""}, {"w": "harpoon", "g": "鱼叉", "story": "解题不用认识。"}, {"w": "utilitarian / functional", "g": "实用的", "story": "utility/function 功能→有功能有用途的=实用。"}, {"w": "domestic", "g": "国内的；家用的", "story": "domestic appliances 家用电器。"}, {"w": "decorative / ornamental", "g": "装饰的", "story": "ornament 装饰品。"}, {"w": "manufactured", "g": "生产出来的", "story": ""}], "options": {"A": "utilitarian", "B": "functional", "C": "domestic", "D": "decorative", "E": "manufactured", "F": "ornamental"}, "answer": "AB", "explain": {"思路": "①such as 举例前后相同：例子=harpoon heads and other tools（工具）→空格修饰的 objects 应=“实用”的东西；②选一对 A utilitarian + B functional。", "annot": "<span class='m2'>such as</span> <span class='m3'>工具</span> ⇒ objects=<span class='m4'>实用的</span> → A+B。", "辨析": "最大坑：看到 elaborate carving 就选 decorative/ornamental——但**空格修饰的是 objects，不是 carving**！题目没问雕刻干嘛，问被装饰的那些物品有什么特点。", "点拨": "动笔前问自己：这个空格到底在修饰谁？对象看错，全盘皆输。", "词根": ["**utilitarian**　util（用，use）+itarian → 讲实用", "**functional**　function（功能）+al → 有功能=实用", "**domestic**　dom（家）+estic → 家庭的/国内的", "**decorative**　decor（装饰）+ative → 装饰的", "**manufactured**　manu（手）+fact（做）→ 手工做出来=制造", "**ornamental**　ornament（装饰品）+al → 装饰的"], "逻辑": "抓 such as → 例子与前面同向 → 例子是“工具” → 空格修饰的 objects 属于实用一类。先问一句：空格到底修饰谁？——是 objects 不是 carving，看偏就完了。", "翻译": "在 IE 文化中，精美的雕刻常被用来提升实用器物——比如鱼叉头和其他工具。"}}, {"type": "q", "tag": "真题", "title": "习题集 第39页 第3题（双空题）", "source": "contrary to + for instance 双线索", "pause": true, "dual": true, "stem": [{"t": "Contrary to those who fear the impact of invasive species on native plants, the biologists contend that the threat posed to biodiversity by nonnative plants is often ______; for instance, a study of one nonnative plant thriving in the forest found that its abundance in forest plots is not ______ the number of other species there."}], "vocab": [{"w": "invasive species", "g": "入侵物种", "story": "invade 入侵。"}, {"w": "contend", "g": "声称、主张", "story": "简单翻译=说。"}, {"w": "pose a threat", "g": "构成威胁", "story": "pose=带来、构成。"}, {"w": "thrive", "g": "（植物）生长茂盛", "story": "本义繁荣发展。"}, {"w": "abundance", "g": "多、大量", "story": ""}, {"w": "plot", "g": "一小块土地", "story": "forest plot=一小块森林。"}, {"w": "exaggerated", "g": "被夸大的", "story": "exaggerate 夸张。"}, {"w": "subtle", "g": "不明显的", "story": "≠obvious。"}, {"w": "related", "g": "相关的", "story": ""}], "options": {"i": {"A": "uniform", "B": "exaggerated", "C": "subtle"}, "ii": {"D": "sustained", "E": "related", "F": "consistent"}}, "answer": "iB,iiE", "explain": {"思路": "空1：contrary to 对比——那些人 fear（觉得威胁大）→生物学家说威胁“小”；选 B exaggerated（被夸大了=实际没那么大）。空2：for instance 前后相同——威胁小→不减少其他物种数量→E related（两者数量不相关=互不影响）。", "annot": "空1：<span class='m2'>contrary to</span> <span class='m3'>fear 害怕威胁大</span> → 威胁<span class='m4'>被夸大 exaggerated</span>。空2：<span class='m2'>for instance</span> 同向 → <span class='m4'>not related 互不相关</span>。", "辨析": "C subtle 是大坑：“威胁不明显”≠威胁小——大威胁也可能不明显（GRE 很难但难得不明显？还是很简单但看不出来？都有可能）。exaggerated=明确说“实际比说的小”。空2没有“减少”这个选项，选 related（数量无关=该多多少还是多少=不受威胁）是变通取反。", "点拨": "GRE 难度对比句是经典辨析素材：说“难度被夸大”=实际没那么难（有方向）；说“难度不明显”=不知道难不难（无方向）。选选项要选**有方向**的那个。", "词根": ["**exaggerated**　ex（出）+agger（堆）+ate+d → 堆过头=夸大", "**related**　re（回）+lat（带）→ 带回到一起=相关", "**uniform**　uni（一）+form（形）→ 一个模子=一致", "**subtle**　sub（下）+tle → 藏在下面=不明显", "**consistent**　con（一起）+sist（站）→ 站在一起=一致"], "逻辑": "空1 抓 contrary to → 前人“担心威胁大” → 生物学家说威胁“被夸大”=实际没那么大；空2 抓 for instance → 与上一句同向 → 威胁小=不减少其他物种=数量不相关。信号词分工明确，逐空做。", "翻译": "与那些担心外来物种影响本地植物的人相反，生物学家声称非本地植物对生物多样性的威胁往往被夸大了；例如一项研究发现，森林中某种茂盛的外来植物，其数量与其他物种的数量并不相关。"}}, {"type": "q", "tag": "真题", "title": "习题集 第42页 第3题（双空题）", "source": "for instance 相同 + purport/design 辨析", "pause": true, "dual": true, "stem": [{"t": "The author of this travel guide ______ to show readers Cairo as it really is, but his information is not reliable: for instance, his geography is ______, with one walking tour covering areas of the city that are 20 miles apart."}], "vocab": [{"w": "purport", "g": "声称、号称", "story": "真假不一定。"}, {"w": "forbear", "g": "克制、忍住不做", "story": "bear 忍受+for-加强。"}, {"w": "design to do", "g": "想要、试图做（熟词僻义）", "story": "design 后接不定式=想要做某事。"}, {"w": "erratic", "g": "不可靠的、反复无常的", "story": "err=漫游：error 乱窜偏离正轨→手表走时 erratic 一会儿快一会儿慢。"}, {"w": "erudite", "g": "博学的", "story": "e-(out)+rud（粗鲁，同根 rude）：从粗鄙中出来→不粗鄙→有学问。"}, {"w": "extensive", "g": "大范围的", "story": ""}], "options": {"i": {"A": "purports", "B": "forbears", "C": "designs"}, "ii": {"D": "erratic", "E": "erudite", "F": "extensive"}}, "answer": "iA,iiD", "explain": {"思路": "空2：for instance 前后相同——信息不可靠→地理 erratic D。空1：A purport（声称）vs C design（想要）——声称可真可假，想要必是真心；后文证据：步行游览竟覆盖相隔 20 英里（≈32 公里≈3/4 马拉松）的两个地方——如此荒唐的低级错误，真心想写好的人不可能发现不了→作者没认真写→不是真心→purport A。", "annot": "空2：<span class='m2'>for instance</span> 同向 → <span class='m4'>erratic 不可靠</span>。空1：步行 32 公里的荒唐错误 → 没认真写 → <span class='m4'>purport 声称（吹牛）</span> ≠design 真心想。", "辨析": "purport vs design 的辨析与第5讲 assert vs concede 同构：**可真可假 vs 必为真心**。判断依据永远藏在后半句的证据里。", "点拨": "把 miles 换算成生活概念（20 英里≈32 公里≈四分之三个马拉松）——长度单位换算能力在做题时用得上。", "词根": ["**purports**　pur（前）+port（拿）→ 拿到前面来说=声称", "**erratic**　err（漫游）+atic → 乱走=飘忽不可靠", "**forbears**　for（前）+bear（忍受）→ 克制忍住", "**designs**　de（下）+sign（记号）→ 定下计划；design to do=想要", "**erudite**　e（出）+rud（粗，rude 同源）→ 脱离粗鄙=博学", "**extensive**　ex（出）+tens（伸）+ive → 伸得开=广泛"], "逻辑": "空2 先抓 for instance → 同向：信息不可靠 → 地理“错漏百出”；空1 号称 vs 想要：证据是 20 英里≈32 公里≈四分之三个马拉松——步行游览走这么远是荒唐的低级错误 → 作者没认真写 → 只是“号称”。把英里换算成生活概念，破绽自现。", "翻译": "这本旅行指南的作者号称向读者展现真实的开罗，但他的信息不可靠：比如他的地理部分错漏百出——一个步行游览竟覆盖了城中相距 20 英里的两个地方。"}}, {"type": "teach", "title": "④ 打比方：like / much as → 前后相同", "ppt": ["“就像”前后两种情况特点一致"], "text": ["“就像”是最好认的同义信号：题目说 A 像 B，A 和 B 的特点必然一致。空格在 A 侧，就去 B 侧找特点；反之亦然。注意：有的题 although 只是烟雾弹，真正的解题线索是 like（86-10）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第137页 第9题（六选二）", "source": "much as 打比方", "pause": true, "multi": true, "stem": [{"t": "An abundance of nutrient-rich pollution in estuaries causes algae to ______, much as house plants grow better when their soil contains added fertilizer."}], "vocab": [{"w": "estuary", "g": "河流入海口", "story": "解题不用认识。"}, {"w": "algae", "g": "藻类", "story": "alga 的复数。"}, {"w": "abound", "g": "变多", "story": "abundance 的动词。"}, {"w": "proliferate", "g": "增多、增殖", "story": ""}, {"w": "stagnate", "g": "停滞", "story": "停滞不前。"}, {"w": "coalesce", "g": "合并、结合", "story": "合到一起。"}, {"w": "collect（不及物）", "g": "聚集", "story": "及物=收集；不及物=聚到一起。"}, {"w": "diversify", "g": "变多样", "story": ""}], "options": {"A": "abound", "B": "proliferate", "C": "stagnate", "D": "coalesce", "E": "collect", "F": "diversify"}, "answer": "AB", "explain": {"思路": "①much as=就像→前后两种情况一致；②B 侧：土壤加化肥→house plants grow better 长得更好；③A 侧：入海口的藻类+营养丰富污染物→也填“长得更好”=变多→A abound + B proliferate。", "annot": "<span class='m2'>much as</span> ⇒ 类比：化肥→<span class='m3'>植物长得更好</span> → 营养污染物→藻类<span class='m4'>变多 abound/proliferate</span>。", "辨析": "C 停滞、D 合并、F 变多样都不是“长更好”；E 聚集≠数量增长。", "点拨": "打比方题=双侧对照读：先把“像”后面的已知侧翻译成人话，再往空格侧套。", "词根": ["**abound**　ab（向）+und（波）→ 浪潮滚滚=大量存在", "**proliferate**　pro（向前）+life（生）→ 激增", "**stagnate**　stag（站）+nate → 站住不动=停滞", "**coalesce**　co（一起）+alesc（长）→ 长到一块=合并", "**diversify**　di（分开）+vers（转）→ 转出花样=多样化"], "逻辑": "抓 much as=“非常像” → 打比方前后一致 → 化肥让植物 grow better → 营养污染物让藻类“变多”。打比方题=双侧对照读，先把“像”后面的已知侧翻译成人话。", "翻译": "河口湾里富含营养的污染物大量增多，使得藻类随之暴增——就像家养植物在土壤里加了肥料之后长得更好一样。"}}, {"type": "q", "tag": "真题", "title": "习题集 第86页 第10题（六选二）", "source": "like 打比方；although 只是烟雾弹", "pause": true, "multi": true, "stem": [{"t": "Although in his new book he tends to repeat himself like a ______ uncle, MH nevertheless makes a persuasive case for the safety of tinkering with genes to create new foods."}], "vocab": [{"w": "make a persuasive case", "g": "给出强有力的理由", "story": "case 熟词僻义=理由：make a case for 支持；make a case against 反驳。"}, {"w": "tinker with", "g": "修改、动手脚", "story": ""}, {"w": "taciturn", "g": "沉默寡言的", "story": ""}, {"w": "reserved", "g": "矜持的、沉默的", "story": "有所保留：十分只说五分→话少。"}, {"w": "prototypical", "g": "典型的", "story": "=typical。"}, {"w": "garrulous / loquacious", "g": "话多的、啰嗦的", "story": "本题一对答案。"}, {"w": "contemptuous", "g": "暴躁的、脾气坏的", "story": ""}], "options": {"A": "taciturn", "B": "reserved", "C": "prototypical", "D": "garrulous", "E": "loquacious", "F": "contemptuous"}, "answer": "DE", "explain": {"思路": "①真正的解题线索是 like 打比方：repeat himself（不断重复自己）=话多啰嗦→D garrulous + E loquacious；②although 只是烟雾弹——转折体现在感情色彩上（前半贬：写书啰嗦；后半褒：理由有说服力），并不帮你选选项。", "annot": "<span class='m2'>like</span> <span class='m3'>repeat himself 重复自己</span> ⇒ 像<span class='m4'>话多的大叔 garrulous/loquacious</span>。", "辨析": "A+B 沉默寡言与“重复自己”相反；C 典型、F 暴躁无关。整句=汉语“写书话糙理不糙”。", "点拨": "信号词也有优先级：like（必然同义）> although（此处只是语气反转）。别见到转折词就硬用。", "词根": ["**garrulous**　garr（唠叨）+ulous → 话多", "**loquacious**　loqu（说）+acious → 话 le": "① 因果关系总览：信号词与取同规则", "ppt": ["因果信号词：because / since / so / therefore / thus / hence", "动词短语：lead to / result in / attribute to / owe to", "原因 ⇌ 结果：意思相同（取同）", "操作三步：认信号词 → 分因果 → 空格从另一边取同义"], "text": ["因果关系是 GRE 填空考得最多的逻辑关系。第一步是识别信号词：**because / since / so / therefore / thus / hence**，以及动词短语 **lead to / result in / attribute to / owe to**（归因于）。看到它们，就知道信号词两边的内容**取同**——原因和结果在意思上必然一致。", "操作分三步：①认出因果信号词；②分清哪边是因、哪边是果；③空格在哪边，就去另一边找同义线索填过来。本讲的 18-3（partly because + and thus）、25-7（since）、39-1（therefore）、54-1（because）都是这条干道的标准样本。", "注意**否定词会翻转方向**：空格旁有 less / not / seldom 时，先按因果取同，再被否定词翻一次（如 10-6 空1：in that 取同之后，less 再取反）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第18页 第3题（双空题）", "source": "partly because + and thus 双因果信号", "pause": true, "dual": true, "stem": [{"t": "The national bank has been uncommonly powerful in comparison to its counterparts in other nations. It retains this potency partly because its control of the nation's banking system is ______ governmental interference, and thus its actions remain largely ______."}], "vocab": [{"w": "counterpart", "g": "地位、身份相当的人或事物", "story": "counter（相对）+part（部分）：一班班长和二班班长聊天，两人地位等同→**注意它不表示「相反的事物」，表示「相同/相当的事物」**。"}, {"w": "retain", "g": "保留、保持", "story": "re（回）+tain（拿）→ 拿住不放=保持。"}, {"w": "potency", "g": "强大、强有力", "story": "来自形容词 potent（强大的）。"}, {"w": "interference", "g": "干预、干涉（贬义）", "story": "管别人的闲事、管自己不该管的事。"}, {"w": "unencumbered", "g": "不受限制的、不受妨碍的", "story": "un（不）+encumber（妨碍、限制）→ 取反=不受妨碍。"}, {"w": "replete with", "g": "充满……的", "story": "plet=fill 充满：complete=全都充满→完整；deplete（de 取反+充满）=耗尽；replete=再一次充满。"}, {"w": "hinder", "g": "妨碍、阻碍", "story": "填空高频词，前面讲次已见过。"}, {"w": "compulsory", "g": "强制性的、义务的", "story": "compulsory education 义务教育。"}, {"w": "discretionary", "g": "独立自主的、自行决定的", "story": "自己说了算，想怎么做怎么做。"}, {"w": "bureaucratic", "g": "效率低下的（别记字典的「官僚主义」）", "story": "官僚主义=机构臃肿、层级森严、逐级申请逐级批准→再简单的事也拖很久→核心特点就是效率低下；可指政府也可指私企。"}], "options": {"i": {"A": "unencumbered by", "B": "replete with", "C": "hindered by"}, "ii": {"D": "compulsory", "E": "discretionary", "F": "bureaucratic"}}, "answer": "iA,iiE", "explain": {"思路": "①两个因果信号：partly because（部分因为）+ and thus（因此）→ 前后全部取同；②第一句定调：这家国有银行 uncommonly powerful（异常强大），两个空格都要服务这个调子；③空1：对银行体系的控制「不受」政府干预→A unencumbered by；空2：因为没人管，行为就能「独立自主」→E discretionary。", "annot": "<span class='m2'>partly because</span> 控制<span class='m4'>不受干预 unencumbered</span>；<span class='m2'>and thus</span> 行为<span class='m4'>独立自主 discretionary</span>——全句服务 <span class='m3'>uncommonly powerful 异常强大</span>。", "辨析": "B replete with（充满干预）、C hindered by（受干预妨碍）都与「强大」唱反调；D compulsory（强制的）与「自主」相反；F bureaucratic 记「效率低下」，与题意无关。", "点拨": "多信号词题先数信号：because 管前半句，thus 管后半句，两个空格各自被锁成同向，逐空做即可。", "词根": ["**counterpart**　counter（相对）+part（部分）→ 对面那个角色=地位相当者（**不是相反的事物**）", "**unencumbered**　un（不）+encumber（妨碍）→ 不受妨碍", "**replete**　re（再）+plet（充满，complete/deplete 同源）→ 充满", "**discretionary**　discret（分辨，discrete 同源）→ 自己拿主意=自主", "**bureaucratic**　bureau（机构）+crat（统治）→ 层级叠床架屋=效率低下"], "逻辑": "because 引出原因（控制不受政府干预）→ thus 引出结果（行为独立自主）→ 两个空格同向，共同支撑第一句的「异常强大」。因果链上所有环节取同。", "翻译": "与其他国家的同类银行相比，这家国有银行异常强大。它能保持这种强大，部分是因为它对该国银行体系的控制不受政府干预的妨碍，因此它的行为在很大程度上可以保持独立自主。"}}, {"type": "q", "tag": "真题", "title": "习题集 第25页 第7题（六选二）", "source": "since 因果取同；「控制」读出「等级」", "pause": true, "multi": true, "stem": [{"t": "The CP archaeological site was initially interpreted as indicative of a ______ society, since it was thought to have been at the center of a cluster of smaller contemporary settlements that it presumably controlled."}], "vocab": [{"w": "indicative of", "g": "表明、说明", "story": "相当于动词 indicate。"}, {"w": "cluster", "g": "一堆、一团", "story": "一堆什么东西=a cluster of。"}, {"w": "contemporary", "g": "同时期的、当时的", "story": "常用义=现代/当代（a contemporary writer）；本题考「同时期」。**≠temporary 临时的**（把 con 去掉）。"}, {"w": "settlement", "g": "定居点、居住地", "story": "settle 定居→settlement 定居点。"}, {"w": "presumably", "g": "有可能是", "story": "presume=假定、认为（同义词 assume）→ 可以这样认为=有可能。"}, {"w": "expansionist", "g": "扩张主义的", "story": "expand 扩张→主张对外领土扩张的。"}, {"w": "hierarchical", "g": "分等级的、分上下级的", "story": "存在上下级关系。"}, {"w": "heterogeneous", "g": "不同的、多样的", "story": "hetero（异）+gen（种类）。"}, {"w": "diverse", "g": "多样的、不同的", "story": "与 heterogeneous 是一对近义干扰项。"}, {"w": "stratified", "g": "分等级的、分层的", "story": "strat（层，stratum 地层）→ 分层=分上下级。"}], "options": {"A": "expansionist", "B": "hierarchical", "C": "urban", "D": "heterogeneous", "E": "diverse", "F": "stratified"}, "answer": "BF", "explain": {"思路": "①since=因为→因果取同：空格填「这是一个什么样的社会」，去 since 后面找；②since 后：CP 位于一堆更小的、同时期定居点的中心，且它们 presumably controlled（被 CP 控制）；③控制关系骨子里=上下级关系→分等级的社会→B hierarchical + F stratified。", "annot": "<span class='m2'>since</span> <span class='m3'>中心位置 + controlled 控制其他定居点</span> ⇒ 上下级关系 ⇒ <span class='m4'>分等级 hierarchical / stratified</span>。", "辨析": "A 扩张主义（对外扩地）无依据；C 城市与「一堆定居点」不对应；D/E 多样是脑补坑——「多而小」≠种类多样。难点在于后半句没直接说「等级」，要从「控制」二字提炼。", "点拨": "「控制」的骨子里就是上下级：他控制别人=他是上级、别人是下级。抽象答案词（hierarchical）要能从具体描述（control）里读出来。", "词根": ["**hierarchical**　hier（神圣）+arch（统治）→ 教阶统治→分层级", "**stratified**　strat（层）+ify → 分层", "**expansionist**　ex（出）+pand（伸）→ 向外伸=扩张", "**heterogeneous**　hetero（异）+gen（种）→ 异种=多样", "**contemporary**　con（共同）+tempor（时间）→ 同时期的", "**presumably**　pre（先）+sum（拿，assume 同源）→ 先拿来假定=有可能"], "逻辑": "since 表因为，前后相同 → 因：CP 是中心且控制周边小定居点（存在上下级）→ 果：它是分等级的社会。抽象答案从具体描述里提炼。", "翻译": "CP 考古遗址最初被认为表明了一个分等级的社会，因为它被认为曾处于一群规模更小、与它同时期的定居点的中心，而且这些定居点据推测都受它控制。"}}, {"type": "q", "tag": "真题 · 易错", "title": "习题集 第26页 第9题（六选二）", "source": "so 因果 + more A than B 结构；近义词陷阱", "pause": true, "multi": true, "stem": [{"t": "In the absence of a surface gradient, the new laws of refraction and reflection are ______ the conventional law, so they represent more of an extension than a complete revolution."}], "vocab": [{"w": "gradient", "g": "（物理量的）变化、差异", "story": "物理名词，解题不影响。"}, {"w": "refraction / reflection", "g": "折射 / 反射", "story": "refract 折射；reflect 反射。"}, {"w": "inferable", "g": "可被推断出来的", "story": "infer 推理、推断（阅读题 it can be inferred from the passage）。"}, {"w": "entail", "g": "包含、包括、涉及", "story": "en+tail（切）→ 切在其中=包含。"}, {"w": "antithetical", "g": "对立的、相反的", "story": "anti（反）+the（放，thesis 同源）→ 反过来放=对立。"}, {"w": "coincident", "g": "巧合的、同时发生的", "story": "四级名词 coincidence 巧合的形容词。"}, {"w": "antecedent", "g": "先于、早于", "story": "ante（前）+ced（走）→ 走在前面。ced/ceed/cess=走：proceed 往前走=前进；process 进程；excessive 走过头=过量；recede 往回走=后退（the flood has receded 洪水退了）。"}, {"w": "oppositional", "g": "对立的、相反的", "story": "op（相对）+posit（放）→ 放在对面=对立。"}], "options": {"A": "inferable from", "B": "entailed in", "C": "antithetical to", "D": "coincident with", "E": "antecedent to", "F": "oppositional to"}, "answer": "AB", "explain": {"思路": "①so=因此→前后取同；②后半句 more A than B=「是 A 而不是 B」（对比结构）：新定律是旧定律的延伸（extension），而不是彻底的革命；③空格必须体现「延伸」：A inferable from（可从旧定律推出）+ B entailed in（包含在旧定律之中）——两个说法都是「新从旧中来」。", "annot": "<span class='m2'>so</span> ⇒ <span class='m3'>是 extension 延伸，而不是 revolution 革命</span> ⇒ 新定律<span class='m4'>可从旧定律推出 inferable / 被包含于旧定律 entailed</span>。", "辨析": "全场大坑：C antithetical + F oppositional 是全场唯一一组近义词（都=对立相反），很多人想都不想直接选——但「不是彻底革命」恰恰排除了「推翻旧定律」。D 巧合同时发生、E 先于，都与「延伸」无关。", "点拨": "六选二不是找同义词游戏（详见本讲 teach 卡②）：A/B 不是字典同义词，但填入后两句意思相同，就是正确答案。先读题猜空格，再看选项。", "词根": ["**inferable**　in（入）+fer（带）→ 往里带=推断", "**entail**　en+tail（切）→ 切在其中=包含", "**antithetical**　anti（反）+the（放）→ 反过来放=对立", "**coincident**　co（共同）+cid（落）→ 落到一起=巧合", "**antecedent**　ante（前）+ced（走）→ 走在前面=先于", "**oppositional**　op（相对）+posit（放）→ 放在对面=对立"], "逻辑": "so 表因此，前后相同 → 后半句 more A than B：是延伸而非革命 → 空格=「新定律从旧定律中来」。A/B 填入后句意相同，虽非字典同义词，仍是答案。", "翻译": "在表面没有梯度变化的情况下，新的折射与反射定律可以从传统定律中推出，因此它们更像是对旧定律的延伸，而非一场彻底的革命。"}}, {"type": "teach", "title": "② 六选二辟谣：官方从没说要选同义词", "ppt": ["官方说明：两词填入后各自成立，且两句意思相同", "不一定互为字典同义词（26-9：inferable / entailed）", "网传「不看题、只找选项近义词」= 坑", "正确流程：读题 → 猜空格 → 看选项"], "text": ["26-9 的正确答案 inferable from 与 entailed in，查任何字典都不会被列为同义词——但填入句子结合上下文，两句话意思相同。GRE 官方考试说明的要求正是如此：选两个选项，**各自填入都成立，且构成的两个句子表达相同的意思**。官方从没说过「选同义词」。", "所以网上流传的技巧不能信：拿到六选二不看题、先看选项，有两组近义词就选一组，只有一组近义词就直接选它——26-9 里唯一一组近义词 antithetical / oppositional 恰恰是错误答案，照这个技巧正好一脚踩进坑。", "正确流程与所有填空题一致：**先读题，猜空格，再看选项**。只有一种情况需要比词义：看完选项发现三四个都合理，这时再挑意思最接近的两个。"]}, {"type": "q", "tag": "真题", "title": "习题集 第39页 第1题（单空题）", "source": "therefore 因果 + 动词主语搭配", "pause": true, "stem": [{"t": "The subjects who are engaged in multitasking often ______ deterioration in their performance over time, and therefore the need to concentrate can apparently enhance long-term efficiency."}], "vocab": [{"w": "subject", "g": "被试、实验对象（熟词僻义）", "story": "科学家做实验招募的志愿者、抓来的小白鼠=被拿来测试的对象。"}, {"w": "multitask", "g": "一心多用", "story": "multi（多）+task（任务）=多任务。"}, {"w": "deterioration", "g": "退化、恶化、变差", "story": "deterior（更坏）→ 越来越坏。"}, {"w": "concentrate", "g": "集中注意力", "story": "con（共同）+centr（中心）→ 聚到中心。"}, {"w": "elicit", "g": "引发、引起", "story": "e（出）+lic（诱）→ 诱出来=引发。"}, {"w": "anticipate", "g": "预料、预言", "story": "anti（前）+cip（拿）→ 提前拿到=预料。"}, {"w": "display", "g": "展现、表现出", "story": "dis（开）+ply（折叠）→ 展开=展现。"}, {"w": "evade", "g": "躲避、逃避", "story": "e（出）+vad（走）→ 走出去=逃避。"}], "options": {"A": "elicit", "B": "anticipate", "C": "detect", "D": "display", "E": "evade"}, "answer": "D", "explain": {"思路": "①therefore 表因此→前后取同：后半句「集中注意力能提高效率」→前半句不集中注意力（一心多用）→表现会下降→空格填正向动词；②但 A/B/C/D 四个都是正向动词，方向筛不掉——看**搭配**：空格动词的主语是 subjects（被试），不是科学家；③被试只能「表现出」下降，不能「引发/预料/察觉」下降→D display。", "annot": "<span class='m2'>therefore</span> <span class='m3'>集中注意力→提高效率</span> ⇒ 一心多用→表现<span class='m3'>下降 deterioration</span>；空格动词主语=<span class='m4'>subjects 被试</span> ⇒ <span class='m4'>display 表现出</span>。", "辨析": "错选最多的是 A elicit（引发）：可以说一心多用引发下降，不能说被试引发自己的下降；B 预料结果、C 察觉现象是做实验的科学家干的事，不是志愿者干的事；E 躲避是负向词，方向就错。实验里志愿者只需做一件事：表现下降。", "点拨": "空格是动词时多问一句：这个动作是谁发出的？主语搭配是方向之外的第二道筛子。", "词根": ["**elicit**　e（出）+lic（诱）→ 诱出来=引发", "**anticipate**　anti（前）+cip（拿）→ 提前拿=预料", "**display**　dis（开）+ply（折）→ 展开=展现", "**evade**　e（出）+vad（走）→ 走出去=逃避", "**deterioration**　deterior（更坏）→ 变差", "**subject**　sub（下）+ject（扔）→ 被扔到下面的=被试"], "逻辑": "therefore 表因此 → 后半句「专注提高效率」→ 前半句同向：一心多用则表现下降 → 空格填正向动词。四个正向动词里只有 display 能与主语 subjects 搭配——方向之外还有主语这道筛子。", "翻译": "一心多用的被试，其表现往往会随时间出现下降，因此集中注意力的需求显然能提升长期效率。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第52页 第5题（双空题）", "source": "partly because + trends=ideas 隐蔽对应 + 褒贬校验", "pause": true, "dual": true, "stem": [{"t": "Partly because of this skill at synthesizing ______ trends drawn from many fields of study, her theories appeared to present with uncanny aptness ideas already ______ in the minds of her contemporaries."}], "vocab": [{"w": "synthesize", "g": "综合、合成", "story": "syn（共同）+the（放）→ 放到一起。the=put：thesis=你放出来的东西=文章大观点（≈put forward 提出观点）；antithetical=反过来放=对立。"}, {"w": "draw", "g": "获得、得出（熟词僻义）", "story": "不是画画：draw a conclusion 得出结论→draw=获得。"}, {"w": "present", "g": "展现、展示、呈现（动词）", "story": "本题是动词，不是「礼物/现在」。"}, {"w": "uncanny", "g": "惊人的、了不起的", "story": "un（不）+can（能）→ 字面「不可能」：别人一天背完 GRE 单词，你说「这不可能」→ 惊人。**canny（精明能干）与 uncanny 不是反义词**，都来自 can。"}, {"w": "aptness", "g": "合适、恰当", "story": "apt 合适的；adapt=变得 apt→适应。"}, {"w": "contemporary", "g": "同时代的人（名词，熟词僻义）", "story": "形容词=现代/同时期的；名词=同时代的人：李白是杜甫的 contemporary。"}, {"w": "supersede", "g": "取代、超越", "story": "super（上）+sed（坐）→ 坐到上头=取代。"}, {"w": "irrelevant", "g": "不重要的、没有意义的（别记「不相关」）", "story": "相关与否用 related/unrelated；relevant 程度深=不仅相关而且重要→记「重要、有意义」，irrelevant=不重要。考试爱考「重要」这层。"}, {"w": "emergent", "g": "新兴的、刚出现的", "story": "来自 emerge 出现、浮现。"}, {"w": "discredited", "g": "被否定的、被证明不可信的", "story": "dis（不）+cred（信）：credit 信用（信用卡=值得相信才借钱给你）、学分（攒小红花）、give someone credit 表扬某人；incredible 难以置信。discredit=让人不信=否定。"}, {"w": "well established", "g": "被完备证明的", "story": "establish 接理论/观点时=证实（≈prove），熟词僻义。"}, {"w": "half-formulated", "g": "初步形成的、尚未完全形成的", "story": "formulate 形成→half=只形成一半。"}], "options": {"i": {"A": "superseded", "B": "irrelevant", "C": "emergent"}, "ii": {"D": "discredited", "E": "well established", "F": "half-formulated"}}, "answer": "iC,iiF", "explain": {"思路": "①partly because of 表因果→前后取同；②先找隐蔽对应：前半句的 trends（学术趋势）=后半句的 ideas（学术思想）——看出这一点题才能做；③「擅长综合 __ 趋势」=「擅长展现 __ 思想」→两空填同义：C emergent（刚出现）+ F half-formulated（刚形成），都是「新」；④褒贬复核：uncanny aptness（惊人地恰当）是极度正面评价→空格不能填贬义，排除 A/B/D。", "annot": "<span class='m2'>partly because</span> 综合<span class='m3'>__趋势 trends</span> ⇒ 展现<span class='m3'>__思想 ideas</span>（trends=ideas）⇒ 两空同义=<span class='m4'>新 emergent / half-formulated</span>；<span class='m3'>uncanny aptness 惊人地恰当</span>=极度褒义。", "辨析": "误选 AD（superseded 被取代 / discredited 被否定）或 BD（irrelevant 无意义 / discredited）：结构上也能凑成同义对，但全是贬义，与「惊人地恰当」的褒扬冲突。E 已被完备证明，与「新」无关。", "点拨": "难题=隐蔽对应（trends=ideas）+ 感情色彩双重校验。同义对不止一组时，用全句褒贬当裁判。", "词根": ["**synthesize**　syn（共同）+the（放）→ 放到一起=综合", "**emergent**　e（出）+merg（沉）→ 浮出来=新兴", "**half-formulated**　form（形）→ 只形成一半=初步形成", "**supersede**　super（上）+sed（坐）→ 坐上位=取代", "**irrelevant**　记「不重要、无意义」（相关=related）", "**discredited**　dis（不）+cred（信，credit/incredible 同源）→ 让人不信=被否定", "**uncanny**　un（不）+can（能）→ 「不可能！」=惊人的"], "逻辑": "partly because 表因果，前后取同 → 隐蔽对应 trends=ideas →「综合新趋势」与「展现新思想」同向 → 两空填一对同义词「新」。再用 uncanny aptness 的褒义排除 AD/BD 两组贬义干扰项。", "翻译": "部分是因为她善于综合从诸多研究领域得来的新兴趋势，她的理论似乎以惊人恰当的方式，展现出了已在同代人头脑中初步形成的思想。"}}, {"type": "q", "tag": "真题", "title": "习题集 第54页 第1题（单空题）", "source": "because 因果 + fresh 审题关键", "pause": true, "stem": [{"t": "Barring the discovery of new letters, hidden diaries, or the like, fresh information about eminent people is hard to find because their lives have been so intensely ______."}], "vocab": [{"w": "barring", "g": "如果没有", "story": "barring the discovery=除非发现、若没有发现。"}, {"w": "or the like", "g": "诸如此类、等等", "story": "列举收尾用语。"}, {"w": "eminent", "g": "杰出的、卓越的", "story": "e（出）+min（凸）→ 凸出来=杰出；eminent people=名人。"}, {"w": "intensely", "g": "强烈地、深入地", "story": "程度很深。"}, {"w": "ridicule", "g": "嘲笑、嘲讽", "story": "ridiculous 的动词；ridiculous 本义=好笑的，「荒唐」是引申义。"}, {"w": "scrutinize", "g": "仔细地讨论、检查、研究", "story": "scrut（检查）→ 一丝不苟地研究。"}, {"w": "embellish", "g": "装饰、美化", "story": "em+bell（美）→ 使变美=装点得更好看、说得更好听。"}, {"w": "underrate", "g": "低估", "story": "rate 评价（APP 评分=rating）→under+rate=评价过低=低估。"}], "options": {"A": "ridiculed", "B": "scrutinized", "C": "admired", "D": "embellished", "E": "underrated"}, "answer": "B", "explain": {"思路": "①because 表因果→前后取同；②审题关键在 fresh（新的）：题目不是说找不到信息，而是找不到「新」信息=能找到的都是老信息=早被别人发现过了；③什么原因导致你能发现的都是老信息？名人的生活已被研究透了→B scrutinized。", "annot": "<span class='m2'>because</span> 生活被<span class='m4'>scrutinize 研究透了</span> ⇒ <span class='m3'>fresh 新的</span>信息难找（老信息早被挖完）。", "辨析": "A 嘲笑、C 钦佩、D 美化都不能解释「没有新信息」；E 低估与「发现信息」无关。漏看 fresh 的人会以为题目在说「完全找不到信息」，从而乱选。", "点拨": "审题审到形容词：fresh 一个词的差别，决定整句在说什么。GRE 的坑常埋在修饰语里。", "词根": ["**scrutinize**　scrut（检查）+ize → 细致研究", "**ridicule**　rid（笑）→ 嘲笑（ridiculous 本义=好笑的）", "**embellish**　em+bell（美）→ 美化", "**underrate**　under（低于）+rate（评价，rating 评分）→ 低估", "**eminent**　e（出）+min（凸）→ 凸出=杰出"], "逻辑": "because 表因果，前后相同 → 果：找不到「新」信息（老信息都被发现过了）→ 因：名人的生活已被彻底研究。题眼是 fresh 一词，漏看就理解成「找不到信息」而误选。", "翻译": "除非发现新的信件、藏匿的日记之类的东西，否则关于名人的新信息很难找到——因为他们的生活已被研究得极为透彻。"}}, {"type": "q", "tag": "真题", "title": "习题集 第79页 第5题（双空题）", "source": "so 因果一管两空；nothing if not 词组", "pause": true, "dual": true, "stem": [{"t": "He was never ______; he was nothing if not ______: so he forbore for the present to declare his passion."}], "vocab": [{"w": "nothing if not", "g": "非常、特别、极其", "story": "词组，同义词就是 very：nothing if not careful=非常谨慎。词组不认识，题就没法做。"}, {"w": "forbear / forbore", "g": "克制、忍住不做", "story": "for（加强）+bear（忍受）→ 忍住不做某事。"}, {"w": "impetuous", "g": "冲动的、鲁莽的", "story": "im（向）+pet（冲）→ 冲上去=做事冲动。"}, {"w": "thoughtful", "g": "考虑仔细的、深思熟虑的", "story": "来自 thought。"}, {"w": "chivalrous", "g": "殷勤的（男人对女人）", "story": "chivalry 中世纪骑士精神：对领主忠诚、对上帝虔诚、尊重对手、对妇女彬彬有礼。骑士制度没了，「男人对女人殷勤有礼貌」这条保留了下来。"}, {"w": "boorish", "g": "粗俗的、粗鄙的", "story": "boor=乡下人：古人觉得城里人洋气、乡下人土→乡里来的=粗俗。"}, {"w": "circumspect", "g": "小心的、谨慎的", "story": "circum（圆圈）+spect（看）→ 环视四周：干坏事前看看有没有警察盯着=谨慎。"}, {"w": "spontaneous", "g": "自发的；举止自然不做作的", "story": "没人让你做、自己主动做=自发；形容表情举止=自然、不矫揉造作（考试爱考后者）。"}], "options": {"i": {"A": "impetuous", "B": "thoughtful", "C": "chivalrous"}, "ii": {"D": "boorish", "E": "circumspect", "F": "spontaneous"}}, "answer": "iA,iiE", "explain": {"思路": "①so 表因此→前后取同：他忍着不表白（forbore to declare his passion）→他非常「谨慎」→空2=E circumspect；②空1 取反：他「从来都不不谨慎」=从不冲动→A impetuous；③词组 nothing if not=非常（≈very），不认识这词组题就没法做。", "annot": "<span class='m2'>so</span> <span class='m3'>forbore 忍着不表白</span> ⇒ 他极其<span class='m4'>谨慎 circumspect</span>（nothing if not=非常）；空1 取反 ⇒ 从不<span class='m4'>冲动 impetuous</span>。", "辨析": "B 深思熟虑与谨慎同向但放错空位；C 殷勤、D 粗俗、F 自发/自然不做作，都不能解释「忍住不表白」。该认识的都认识，这题难度为零——很多人错只因为不认识 nothing if not。", "点拨": "词组是硬通货：nothing if not=very。背单词时连词组一起背，否则「该认识的都认识」这句话就不成立。", "词根": ["**impetuous**　im（向）+pet（冲）→ 冲上去=冲动", "**circumspect**　circum（圈）+spect（看）→ 环视四周=谨慎", "**chivalrous**　chivalry（骑士精神）→ 对妇女殷勤", "**boorish**　boor（乡下人）+ish → 土=粗俗", "**spontaneous**　spont（自愿）→ 自发的；自然不做作", "**forbear**　for（加强）+bear（忍）→ 克制忍住"], "逻辑": "so 表因此 → 果：他忍住不表白 → 因：他极其谨慎（nothing if not=very）；分号前再取反：从不冲动。一个 so 管两个空，一正一反。", "翻译": "他从不冲动，而且极其谨慎——所以此刻他克制着自己，不去表白自己的爱意。"}}, {"type": "q", "tag": "真题", "title": "习题集 第92页 第9题（六选二）", "source": "so 因果；「不是最好」的语义拆解", "pause": true, "multi": true, "stem": [{"t": "JGB found that the pedagogical results of these activities were ______, so the activities may not be the best method of improving teaching."}], "vocab": [{"w": "pedagogical", "g": "教学的", "story": "ped（儿童）+agog（引导）→ 引导儿童=教学的；解题可不认识。"}, {"w": "overstate", "g": "夸张、夸大", "story": "over（超过）+state（说）→ 说过了头=把小事往大说。"}, {"w": "counterintuitive", "g": "不合常理的、违反直觉的", "story": "intuitive=符合直觉：小明很胖果然吃得多=intuitive；小明很胖每顿吃得很少还不偷吃=counterintuitive。"}, {"w": "mixed", "g": "不一致的、自相矛盾的（熟词僻义）", "story": "本义混合→好的坏的混到一起：刷题正确率有时十对九、有时十对一=成绩 mixed。"}, {"w": "discouraging", "g": "令人沮丧的", "story": "dis+courage（勇气）→ 使人泄气。"}, {"w": "inconsistent", "g": "不一致的", "story": "in（不）+con（共同）+sist（站）→ 站不到一起=不一致。"}, {"w": "inexplicable", "g": "无法解释的、无法理解的", "story": "动词 explicate=解释（同义词 explain）→ inexplicable=unexplainable。"}], "options": {"A": "overstated", "B": "counterintuitive", "C": "mixed", "D": "discouraging", "E": "inconsistent", "F": "inexplicable"}, "answer": "CE", "explain": {"思路": "①so 表因果→前后取同；②把后半句「不是最好的方法」翻成人话：首先它得有好的地方，同时还有不够好的地方=好坏参半；③空格填「结果不一致、时好时坏」：C mixed + E inconsistent——有时效果好有时不好，正好对应「不是最好」。", "annot": "<span class='m2'>so</span> <span class='m3'>not the best 不是最好</span>（=有好+有坏）⇒ 结果<span class='m4'>不一致 mixed / inconsistent</span>。", "辨析": "A 夸大、B 违反直觉、F 无法解释都与「有好有坏」无关；D 令人沮丧是全贬——「不是最好」不等于「不好」，它先肯定了有好的一面。", "点拨": "not the best 要拆成两层读：有可取之处 + 还能更好。正确选项要同时盖住「好」和「坏」两头，不一致类词正好做到。", "词根": ["**overstate**　over（过）+state（说）→ 说过头=夸大", "**counterintuitive**　counter（反）+intuitive（直觉）→ 违反直觉", "**mixed**　混合→好坏参半=不一致", "**inconsistent**　in（不）+con（共）+sist（站）→ 站不到一起", "**inexplicable**　in（不）+explicate（解释=explain）→ 无法解释", "**pedagogical**　ped（儿童）+agog（引导）→ 教学的"], "逻辑": "so 表因果，前后相同 → 果：这些活动不是改善教学的最好方法（=有好有坏）→ 因：教学成果不一致、时好时坏。「不是最好」要拆成「有好+有坏」两层去读。", "翻译": "JGB 发现，这些活动的教学成果并不一致，因此这些活动可能并不是改善教学的最佳方法。"}}, {"type": "teach", "title": "③ 隐蔽因果信号：by virtue of / in that", "ppt": ["by virtue of = 因为", "in that = 因为（用法≈because）", "生僻信号词也要触发「取同」反射", "复习：比较级在填空里=相反"], "text": ["因果信号词不止 because 家族。**by virtue of** = 因为（因…而…）；**in that** = 因为，用法相当于 because。它们长得不像因果词，但在题里干的是同样的活：前后取同。下面的 45-2 和 10-6 分别考这两个。", "10-6 同时复用两条旧规则：其一，**比较级在填空里永远表相反**（less...than 就是说两者不一样，对比讲次讲过）；其二，三空题可以**拆空独立做**——空3 只看末句的 but 就够了，不必读全题。", "顺带再强调一个词组硬通货：**nothing if not = 非常**（≈very，见 79-5）。背单词时连词组一起背，词组不认识，题就无从入手。"]}, {"type": "q", "tag": "真题", "title": "习题集 第45页 第2题（单空题）", "source": "by virtue of=因为；好坏判断链", "pause": true, "stem": [{"t": "The science of astronomy was begun by amateurs and today remains dependent on their contributions—contributions which are incisive by virtue of being ______ the a priori assumptions that often vitiate the work of professional research scientists."}], "vocab": [{"w": "astronomy", "g": "天文学", "story": "astro（星）+nomy（学科）。"}, {"w": "amateur", "g": "业余爱好者、业余人士", "story": "amat（爱）→ 出于爱好做事的人。"}, {"w": "incisive", "g": "深刻的、一针见血的", "story": "cid/cis=切：字面「能切进去」→说话精辟。incisors 门牙（切开食物）；insecticide 杀虫剂（切虫）；herbicide 除草剂（herb 草）；suicide 自杀（sui 自己）。"}, {"w": "a priori", "g": "先验的、纯理论的", "story": "没有任何实际观察和实验支撑、纯理论推导的。解题可不认识。"}, {"w": "vitiate", "g": "破坏", "story": "vit（缺陷，vice 同源）→ 使有缺陷=破坏。"}, {"w": "unencumbered", "g": "不受限制、不受阻碍、不受影响的", "story": "un（不）+encumber（妨碍），18-3 刚见过。"}, {"w": "contradict", "g": "反驳", "story": "contra（反）+dict（说）→ 反着说。"}], "options": {"A": "characterized by", "B": "unencumbered by", "C": "supported by", "D": "contradicted by", "E": "inspired by"}, "answer": "B", "explain": {"思路": "①by virtue of=因为（隐蔽因果信号）；②先标褒贬：incisive（深刻精辟）是极度正面评价；a priori assumptions 经常 vitiate（破坏）科学家的工作=坏东西；③因果取同：贡献之所以好，是因为它「不沾」坏东西→B unencumbered by（丝毫不受其影响）。", "annot": "<span class='m2'>by virtue of</span> <span class='m4'>不受坏东西影响 unencumbered</span> ⇒ 贡献 <span class='m3'>incisive 深刻（褒）</span>；坏东西=<span class='m3'>a priori assumptions（vitiate 破坏科学家工作）</span>。", "辨析": "大坑 D contradicted by：反驳坏东西≠自己是好东西——错误观点之间也互相反驳，可能全都错；只有「丝毫不受其影响」才保证是好。A 以它为特点、C 受它支持、E 受它激励都会让贡献沾上坏东西。第一句（天文学由业余者开创）解题基本没用。", "点拨": "好坏判断题：先把每个名词的褒贬标出来（incisive=好，vitiate=坏），再让空格完成「好←因为→不沾坏」的链条。", "词根": ["**incisive**　in+cis（切）→ 能切进去=一针见血（incisors 门牙/insecticide 杀虫剂/herbicide 除草剂/suicide 自杀）", "**vitiate**　vit（缺陷，vice 同源）→ 使有缺陷=破坏", "**unencumbered**　un（不）+encumber（妨碍）→ 不受影响", "**contradict**　contra（反）+dict（说）→ 反着说=反驳", "**amateur**　amat（爱）→ 出于爱好=业余人士"], "逻辑": "by virtue of=因为 → 因：贡献不受「先验假设」（会破坏科学家工作的坏东西）影响 → 果：贡献深刻精辟（好）。因果取同：不沾坏=好。反驳坏≠好，D 是最强干扰项。", "翻译": "天文学这门学问由业余爱好者开创，且至今仍依赖他们的贡献——这些贡献之所以深刻精辟，正是因为它们不受那些先验假设的影响，而这些假设常常破坏职业科研工作者的工作。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第10页 第6题（三空题）", "source": "in that=因为；比较级=相反；but 转折拆空做", "pause": true, "triple": true, "stem": [{"t": "Inuit printmaking is less ______ than carving in that it does not have substantial historical precedent, although there are ______ between the two: carving on bone or antler, facial tattoo marks, and inlay skin work on clothing, mitts, and footwear. Carving materials such as stone, bone, antler, wood, and ivory were ______, but paper and drawing tools were unknown until introduced by early expl 的」= 它不该被否认 = 它是好的，那么前面原因里的空格就全部填褒义。"]}, {"type": "q", "tag": "真题", "title": "习题集 第24页 第3题（双空题）", "source": "given=因为 → 因果取同定褒贬", "pause": true, "dual": true, "stem": [{"t": "Given the ______ of the committees and the ______ nature of the investigation, it would be unreasonable to gainsay the committees' conclusions at first glance."}], "vocab": [{"w": "given", "g": "鉴于、因为、考虑到", "story": "填空不考「给」，考因果。"}, {"w": "nature", "g": "特点（熟词僻义）", "story": "the nature of investigation=调查的特点，不是「自然」。"}, {"w": "gainsay", "g": "否认、否定", "story": "gain=against 的变形 + say 说 → say against something 跟某人唱反调 → 否认。"}, {"w": "at first glance", "g": "乍一看、第一眼看上去", "story": "glance=瞥一眼。"}, {"w": "sterling", "g": "极好的、极有价值的", "story": "sterling silver=纯银（银制品成色好的标志）→ 成色好 → 极好、有价值。买首饰时能看到。"}, {"w": "ad hoc", "g": "专门的、临时的（拉丁语）", "story": "an ad hoc committee=为处理某件事专门成立的临时委员会，事办完立马就地解散，各回各家。"}, {"w": "superficial", "g": "肤浅的、不深入的", "story": "super（上）+fic（面）：浮在表面，不做深入探讨。"}, {"w": "spontaneous", "g": "自发的、自主的", "story": "自发组织、自发行动。"}, {"w": "exhaustive", "g": "全面详尽的、彻底的", "story": "ex（出）+haust（抽）→ 抽干式的 → 彻底。**区分 exhausted 筋疲力尽**。"}], "options": {"i": {"A": "a sterling reputation", "B": "a questionable agenda", "C": "an ad hoc existence"}, "ii": {"D": "superficial", "E": "spontaneous", "F": "exhaustive"}}, "answer": "iA,iiF", "explain": {"思路": "①句首 given=因为 → 前后两部分取同；②后半句说「一上来就否认它的结论是不合理的」→ 委员会不该被否认 → 委员会是好的；③两个空格都找褒义：空1选 A sterling reputation（名声极好），空2选 F exhaustive（调查详尽）。", "annot": "<span class='m2'>Given</span> … <span class='m3'>unreasonable to gainsay 不能否认</span> ⇒ 委员会的名声和调查都是<span class='m4'>褒义 sterling / exhaustive</span>。", "辨析": "空1：B 议程可疑（贬义）、C ad hoc 临时拼凑（暗示不正规）都与「不该被否认」方向相反。空2：D 肤浅（贬义）、E 自发（与调查质量无关）都不是褒义方向。六个选项里只有 A、F 是纯褒义。", "点拨": "given 直接翻译成「因为」，后半句的态度就是前半句所有空格的态度——一题定两空。", "词根": ["**gainsay**　否认（gain=against 变形+say 说→唱反调）", "**ad hoc**　拉丁语「为此」→ 专门的/临时的", "**superficial**　肤浅的（super 上+fic 面→浮在表面）", "**exhaustive**　全面详尽的（ex 出+haust 抽→抽干式=彻底；≠exhausted 筋疲力尽）", "**spontaneous**　自发的（spont 自愿→自己愿意做）"], "逻辑": "given=因为 → 因果取同 → 后半句「不能一上来就否认」说明委员会可信 → 两个空格全填褒义（名声好+调查详尽）。一个 given 串起两个空。", "翻译": "鉴于这些委员会声誉卓著、调查又极为详尽，乍一看就否定它们的结论是不合理的。"}}, {"type": "q", "tag": "真题", "title": "习题集 第42页 第2题（单空题）", "source": "given + stepped in 反推 + 纯贬义辨析", "pause": true, "stem": [{"t": "Investors are grateful that the attorney general has stepped in to pursue inquiries into the misfeasance in the financial markets, given that the regulators officially charged with policing the industry have been ______."}], "vocab": [{"w": "investor", "g": "投资者、投资人", "story": "invest 投资+or 人。"}, {"w": "attorney general", "g": "（美国）司法部长", "story": "解题只需知道是一个人。"}, {"w": "step in", "g": "介入、插手", "story": "「介入」说明他本来不管这事——本题的题眼。"}, {"w": "pursue inquiries", "g": "进行调查", "story": "inquiry 日常=询问/咨询，考试爱考引申义=调查、研究。"}, {"w": "misfeasance", "g": "违法行为", "story": "mis（不好/不对）+feas（做，词根 fact/fect 的变形）→ 做坏事 → 违法行为。"}, {"w": "regulator", "g": "监管者、管理者", "story": "来自 regulate 管理、regulation 规章。"}, {"w": "be charged with", "g": "被赋予…职责（熟词僻义）", "story": "这里不是「批评/指责」=给它一个任务让它去做。中学词组 in charge of（负责）就来自这个 charge：小明 is in charge of this factory。"}, {"w": "police（动词）", "g": "监督、监管", "story": "字面=去当警察 → 监管。"}, {"w": "industry", "g": "行业、产业", "story": "不只有「工业」的意思。"}, {"w": "tenacious", "g": "坚定的、坚韧不拔的", "story": "ten=hold 拿住：死死拿住不放手 → 坚定。"}, {"w": "diffident", "g": "胆小的、不自信的", "story": "反义词是你无比熟悉的 confident（自信）→ 取反=不自信。"}, {"w": "meticulous", "g": "一丝不苟的", "story": "做事极其仔细认真，一点儿都不疏忽大意。"}, {"w": "implacable", "g": "无法平息的、无法和解的", "story": "im（不）+placate（平息、安抚——把别人惹毛了去哄他）→ 哄不好的。implacable anger 无法平息的愤怒；an implacable enemy=死敌（说啥都不好使）。"}, {"w": "straightforward", "g": "直接的、直言不讳的", "story": "straight 直+forward 向前。"}], "options": {"A": "tenacious", "B": "diffident", "C": "meticulous", "D": "implacable", "E": "straightforward"}, "answer": "B", "explain": {"思路": "①先认人：attorney general 和 regulator 是**两个不同的人**——AG 是 stepped in（介入），说明他本不管这事；regulator 才是「正式负责监管这一行业」的人；②投资人感激「不该管的人来管了」→ 说明该管的人管得非常不好；③空格修饰 regulator → 找贬义词 → 唯一纯贬义是 B diffident（胆小不自信——要抓坏人的执法人员胆子小，当然管不好）。", "annot": "<span class='m2'>given that</span> … <span class='m3'>stepped in 介入（本不该管）</span> 投资人还 <span class='m3'>grateful 感激</span> ⇒ 该管的 <span class='m3'>regulators</span> 管得<span class='m4'>不好 → 贬义 diffident</span>。", "辨析": "A 坚定、C 一丝不苟、E 直率全是褒义，直接排。最大坑是 D implacable（无法平息/不能和解）：它看着贬义，其实是**中性词**——an implacable enemy 死敌是好是坏，取决于他是谁的死敌：好人的死敌是坏人，坏人的死敌是好人。本题只有 B 是纯贬义。有同学问「胆子小怎么就等于管得不好」——注意他们管的是 misfeasance 违法行为，是要去抓坏人的：警察巡逻看到抢包的说「太可怕了我不敢去」，这种人当不了警察。", "点拨": "选项只剩一个贬义词时，先验证它是否说得通；警惕「长着贬义脸的中性词」（implacable）——感情色彩要看语境对象。", "词根": ["**diffident**　不自信的（dif=dis 不+fid 信任，confident 同根）", "**tenacious**　坚定的（ten 拿住→抓牢不放）", "**implacable**　无法平息的（im 不+plac 平息，动词 placate 安抚→哄不好）", "**misfeasance**　违法行为（mis 坏+feas 做，fact/fect 变形→做坏事）", "**meticulous**　一丝不苟的（过分小心→一点儿不疏忽）"], "逻辑": "因果词 given → 取同：投资人感激「介入者」→ 反推出正式监管者失职 → 空格=贬义词；且管的是违法行为，「胆小不自信」恰好解释「管得不好」。stepped in（介入）是认出「两类人」的关键。", "翻译": "投资者对司法部长介入调查金融市场的违法行为心怀感激，因为正式负责监管这一行业的监管者一直以来都畏缩不前、缺乏自信。"}}, {"type": "teach", "title": "② out of = 出于 → 还是因为", "ppt": ["out of 字面「从…里出来」→ 汉语「出于」→ 因为", "I helped him out of sympathy = 出于同情我帮助他", "out of + 原因 → 前后取同"], "text": ["out of 有一个意思表示**出于什么原因**，这一点跟汉语非常像：out of 字面叫「从什么里出来」，汉语的「出于」就可以表示「因为什么」。", "比如汉语说「出于同情，我去帮助他」，英文就是 I helped him out of sympathy。所以 out of 出于，简单来说还是**因为**的意思——见到它，照旧找因果双方取同。"]}, {"type": "q", "tag": "真题", "title": "习题集 第24页 第4题（双空题）", "source": "out of=因为 + though 转折，先因后转", "pause": true, "dual": true, "stem": [{"t": "Though many professional book reviewers would agree that criticism should be ______ enterprise, a tendency to write ______ reviews has arisen, partly out of the mistaken belief that sharing personal details will help reviewers stand out from the pack."}], "vocab": [{"w": "reviewer", "g": "评论家、书评人", "story": "给书写书评的人。"}, {"w": "criticism", "g": "评论（本题）；批评", "story": "既可指负面批评，也可指中性评论——本题是「评论」。"}, {"w": "enterprise", "g": "事业、企业", "story": "创立的企业，或具体做的一项工作事业。"}, {"w": "stand out from the pack", "g": "出众、出人头地", "story": "pack 除「背包」外还指（犬类等动物的）群：a wolf pack 狼群。字面=从群里站出来 → 出众。"}, {"w": "anonymous", "g": "匿名的；非个人的（GRE 爱考引申义）", "story": "an（无）+onym（名字）：anonymous letter 匿名信 → 引申=不带任何个人特点（impersonal）。"}, {"w": "evenhanded", "g": "客观公正的", "story": "even=平均、平稳 → 字面=手很平 → 类似汉语「一碗水端平」，一点儿不偏颇。"}, {"w": "spirited", "g": "热烈的、猛烈的", "story": "**≠spiritual 精神的**。热烈的表扬、猛烈的批评都可以叫 spirited=做得非常拼、非常有精气神。"}, {"w": "scathing", "g": "激烈尖刻、毫不留情的", "story": "说话特别难听，一点儿不留情面。"}, {"w": "confessional", "g": "自白的", "story": "来自 confession。**别记字典的「忏悔」**——正确意思是「自白」=向别人交代自己做了哪些事、有哪些想法，不一定出于忏悔。反例：跟人「表白」也叫 confession。字典译成忏悔是受基督教文化影响（在教堂小房间里隔着帘子向神父 confess）。"}, {"w": "superficial", "g": "肤浅的", "story": "super 上+fic 面→浮于表面。"}], "options": {"i": {"A": "an anonymous", "B": "an evenhanded", "C": "a spirited"}, "ii": {"D": "scathing", "E": "confessional", "F": "superficial"}}, "answer": "iA,iiE", "explain": {"思路": "①先做空2（有因果词 out of）：他们错误地相信「分享个人细节能帮我出众」→ 所以就会去写「分享个人细节」的评论 → E confessional（自白式=向别人交代自己=分享个人细节）；②再做空1：句首 though 转折取反 → 评论「应该」不分享个人细节 → A anonymous（非个人的，不带个人特点）。", "annot": "空2：<span class='m2'>out of</span> <span class='m3'>错误看法：分享个人细节→出众</span> ⇒ 写<span class='m4'>confessional 自白式</span>评论。空1：<span class='m2'>Though</span> 取反 ⇒ 评论本应<span class='m4'>anonymous 非个人化</span>。", "辨析": "空1：B evenhanded 公正、C spirited 热烈都与「个人细节」无关。空2：D scathing 尖刻、F superficial 肤浅是书评的常见贬义词，但题目谈的不是「刻薄/肤浅」，是「掺入个人信息」——顺着因果词的方向走，别自己脑补。", "点拨": "先做有因果词（out of）的空，再用转折（though）推另一个空——线索词决定做题顺序。", "词根": ["**anonymous**　匿名的→非个人的（an 无+onym 名字）", "**confessional**　自白的（con 一起+fess 说→全说出来=自白，别记忏悔）", "**spirited**　热烈的（spirit 精神+ed→有精气神；≠spiritual 精神的）", "**evenhanded**　公正的（even 平+hand 手→一碗水端平）", "**scathing**　尖刻的（说话不留情面）"], "逻辑": "out of=因为 → 取同：相信分享细节能出众 → 写自白式评论；句首 though 取反 → 评论本应「非个人化」。一同一反，两空齐出。", "翻译": "尽管许多职业书评人都同意书评应当是一项不带个人色彩的事业，但一种写自白式书评的倾向已经出现——部分原因是他们错误地认为，分享个人细节能让自己脱颖而出。"}}, {"type": "teach", "title": "③ means = 意味着 → 前后画等号", "ppt": ["事情做主语 + mean = 意味着（不考「意思是」）", "「意味着」前后必然相同，骨子里还是因果", "小明是个胖子 → 意味着他胖"], "text": ["mean 常用的意思叫「意思是」（It means that… 这个单词意思是什么），但这种用法考试考得比较少。考试更喜欢考的是：**一个事情做主语，这个事情 means 什么**——这时翻译成「意味着」。", "「意味着」前后显然是相同，骨子里还是个因果：小明是个胖子，那就意味着他胖。所以看到 means 意味着，前后你直接填相同就可以了。"]}, {"type": "q", "tag": "真题", "title": "习题集 第30页 第4题（双空题）", "source": "means=意味着 → 取同；homo/hetero 词根", "pause": true, "dual": true, "stem": [{"t": "Historian B's task in writing a book about women in Russia must have been a ______ one, because the ______ of the Russian Empire's peoples meant that Russian women could never be treated as a homogeneous group."}], "vocab": [{"w": "homogeneous", "g": "相同的、由相同成分组成的", "story": "homo（相同）+gen（种类）：同性恋 homosexual。字面=由同种东西构成。"}, {"w": "heterogeneous", "g": "不同的、多样的（homogeneous 的反义词）", "story": "hetero（不同）+gen（种类）：异性恋 heterosexual。由不同种东西构成。"}, {"w": "gender", "g": "性别", "story": "词根 gen=种类：性别骨子里就是给人分类的一种方式 → 字面意思就叫「分类/种类」。"}, {"w": "motivating", "g": "鼓舞人心的", "story": "来自 motivate 鼓舞。"}, {"w": "daunting", "g": "艰难的、令人望而生畏的", "story": "daunt 动词=吓倒、使气馁 → daunting 字面=吓人的 → 形容任务=一看就害怕不想做。"}, {"w": "unity", "g": "团结", "story": "uni=one：所有人在一起像一个人一样，大家一条心 → 团结。"}, {"w": "disinterest", "g": "客观公正、无私（名词）", "story": "形容词 disinterested=客观公正的（≠uninterested 不感兴趣）。关键：interest 除「兴趣」外还有「利益」义（common interest 共同利益、self interest 个人利益）→ 你在这件事里没有利益关系 → 当然能保持客观公正无私。"}, {"w": "diversity", "g": "多样、不同", "story": "di（分开）+vers（转）→ 转出花样。"}], "options": {"i": {"A": "motivating", "B": "rewarding", "C": "daunting"}, "ii": {"D": "unity", "E": "disinterest", "F": "diversity"}}, "answer": "iC,iiF", "explain": {"思路": "①先做空2：meant that=意味着 → 前后取同。后面说「俄国女人永远不能被看作相同（homogeneous）的群体」→ 前面就填「不同」→ F diversity；②再做空1：俄国人各种各样、俄国女人完全不同，而历史学家想用一本书把她们写明白 → 这工作非常不容易 → C daunting（艰难、令人望而生畏）。", "annot": "空2：<span class='m2'>meant that</span> ⇒ 取同：<span class='m3'>不能被看作 homogeneous 相同群体</span> ⇒ <span class='m4'>diversity 多样</span>。空1：人群各不相同 ⇒ 写书任务<span class='m4'>艰巨 daunting</span>。", "辨析": "空1：A motivating 鼓舞人心与「难度」无关；B rewarding 有回报是褒义，方向不明。空2：D unity 团结（=相同，方向相反）、E disinterest 客观公正（无关）——注意 disinterested≠uninterested，前者是「无利益牵扯所以客观」，后者才是「不感兴趣」。", "点拨": "「意味着」就是等号：means 后面说什么，前面就填什么——先把带等号的空做掉。", "词根": ["**homogeneous**　相同的（homo 同+gen 种类→同种构成；homosexual 同性恋）", "**heterogeneous**　不同的（hetero 不同+gen 种类；heterosexual 异性恋）", "**gender**　性别（gen 种类→性别=一种分类方式）", "**daunting**　艰难的（daunt 吓倒→吓人的=望而生畏）", "**unity**　团结（uni 一→万众一心）", "**disinterest**　客观无私（dis 无+interest 利益→无利益牵扯）"], "逻辑": "因果链：人民多样性 →（means，取同）女人不能被视为同质群体 → 写一本讲俄国女人的书必然艰巨。means 是隐蔽因果词，前后直接画等号。", "翻译": "历史学家 B 撰写一本关于俄国女性的著作，必定是一项艰巨的任务，因为俄罗斯帝国各族人民的多样性意味着，俄国女性永远无法被视为一个同质的群体。"}}, {"type": "q", "tag": "真题", "title": "习题集 第66页 第1题（单空题）", "source": "means + combination 双因素 → 数量取同", "pause": true, "stem": [{"t": "The combination of IB's short life and the ______ of evidence for some parts of her story means that at times her biographer KH is forced to fill out her narrative with background information."}], "vocab": [{"w": "combination", "g": "两个或多个因素的共同作用", "story": "combine 组合 → 这里=两个原因一起导致结果。"}, {"w": "at times", "g": "有时、有时候", "story": "固定词组。"}, {"w": "biographer", "g": "传记作者（给别人写传记的人）", "story": "biography=传记（**不是自传**——自传是 autobiography，auto=self 自己，自己写的传记才叫自传）。"}, {"w": "biography", "g": "传记", "story": "bio（生命，biology 生物学就这么来的）+graph（写）→ 字面=去写别人的生命 → 传记。"}, {"w": "photograph", "g": "照片", "story": "photo（光）+graph（写）→ 用光去描绘某个东西 → 照片。graph 词根的最佳助记。"}, {"w": "be forced to", "g": "不得不", "story": "字面=受到强迫 → 不得不做某事。"}, {"w": "fill out", "g": "补充、填充", "story": "这里=拿背景信息来充实叙述。"}, {"w": "reliability", "g": "可靠", "story": "rely 依靠 → 可靠。"}, {"w": "plethora", "g": "大量、过量", "story": "总之就是多，甚至过分的多。"}, {"w": "relevance", "g": "重要、有意义", "story": "**别记「相关」**——正确意思是重要、有意义。"}, {"w": "paucity", "g": "缺乏、不足", "story": "pauc=少。"}, {"w": "transparency", "g": "通俗易懂的（GRE 考引申义）", "story": "托福里背的是「透明」；透明的特点=一眼看得透 → 引申=一眼看得懂 → 易懂。"}], "options": {"A": "reliability", "B": "plethora", "C": "relevance", "D": "paucity", "E": "transparency"}, "answer": "D", "explain": {"思路": "①means=意味着 → 前后取同；②后半句：写传记的人**不得不**用背景信息来补充她的故事 → 说明她本身的故事材料太少，实在没东西可写，只能拿背景信息凑数；③前面填「证据少」→ D paucity（缺乏不足）。combination=两个因素共同作用：寿命短+证据少。", "annot": "<span class='m2'>means that</span> ⇒ 取同：<span class='m3'>不得不拿背景信息凑数（forced to fill out）</span> ⇒ 证据<span class='m4'>少 paucity</span>。", "辨析": "B plethora（大量）方向相反——证据多的话就不用凑数了；A 可靠、C 重要、E 易懂都涉及「质量」而非「数量」，而被迫补充说明的恰恰是数量不够。", "点拨": "看到「不得不拿别的东西来补充」→ 反推「本来的东西不够」——这是数量维度上的取同套路。", "词根": ["**paucity**　缺乏（pauc 少）", "**plethora**　过量（ple 满→多过头）", "**biographer**　传记作者（bio 生命+graph 写→写别人的生命）", "**photograph**　照片（photo 光+graph 写→用光描绘）", "**autobiography**　自传（auto 自己+biography 传记→自己写自己）", "**transparency**　通俗易懂（trans 穿+par 显现→透明→一眼看懂）"], "逻辑": "means 前后取同 → 「被迫用背景资料补写」说明原材料不够 → 空格=证据「匮乏」。combination of A and B=两个因素（寿命短+证据少）共同导致结果。", "翻译": "由于 IB 寿命短暂，且她生平某些部分的证据匮乏，两者共同意味着她的传记作者 KH 有时不得不用背景资料来充实对她的叙述。"}}, {"type": "teach", "title": "④ when = 当…时 → 前后相同", "ppt": ["when 引导的部分与主句取同", "当小明胖的时候，小明就（胖）", "when/since 之前的铺垫常是烟雾弹"], "text": ["「当什么时」在填空题里也相当于因果关系，因为它前后其实还是相同：当小明胖的时候，小明就怎么样？他当然就是胖。所以做题看到 when，前后还是填相同。", "另外注意：since/when 引出的句子，**前半句的铺垫往往完全没用**（比如「噪音抑制很重要」这种背景介绍），直接盯住信号词之后的「条件 + 主句」做取同即可。"]}, {"type": "q", "tag": "真题", "title": "习题集 第91页 第7题（六选二）", "source": "when=当…时 → 取同；since 前是烟雾弹", "pause": true, "multi": true, "stem": [{"t": "Noise suppression in phones can play an important role in making cell phone networks more efficient, since when sounds that are ______ to the meaningful signal are transmitted, precious network bandwidth is wasted."}], "vocab": [{"w": "noise suppression", "g": "噪音抑制", "story": "suppress 压制。"}, {"w": "transmit", "g": "传播、传输", "story": "trans（穿）+mit（送）：传输信息、传输信号。"}, {"w": "bandwidth", "g": "带宽", "story": "band（带子）+width（宽度）→ 汉语「带宽」就是从英文直译来的。"}, {"w": "meaningful signal", "g": "有意义的信号", "story": "meaning 意义+ful。"}, {"w": "detrimental", "g": "有害的", "story": "detriment 损害+al。"}, {"w": "confined", "g": "有限的", "story": "confine 动词=限制：con+fin（边界，之前讲过的词根）→ 字面=给它划定一个边界 → 限制 → 形容词=有限的。"}, {"w": "extraneous", "g": "不重要的、没有意义的、无关的", "story": "extra（外）→ 外来的 → 与正题无关。"}], "options": {"A": "unsuitable", "B": "detrimental",
