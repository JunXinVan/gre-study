<script>
const DATA = {"lessons": [{"id": 1, "title": "第1讲 · Introduction：考法与方法论", "intro": "本讲建立对 GRE 填空的整体认知：考什么、怎么算分、出题人怎么想、用什么资料、怎么背单词查字典，以及最重要的四步解题法。每一步都是后面 16 讲的地基。建议按顺序读完，例题一定要自己做。", "cards": [{"type": "teach", "title": "① 课前准备：词汇基础自测", "ppt": ["确保四级词汇完全掌握"], "text": ["上课前**不需要先背完 GRE 单词**——课上遇到难词，老师会先讲意思再做题，没背过也能听懂。但**四级词汇必须零问题**（课上不会专门讲四级）。", "自测方法：找 4 个四级里相对较难的单词检查自己——**四个全认识**：四级没问题，只背 GRE 词即可；**认识 2-3 个**：先背 GRE 词，上考场前集中把四级多刷几遍清理漏网之鱼；**只认识 0-1 个**：词汇基础离 GRE 差得远，直接背 GRE 很难坚持，先把四级背熟（推荐新东方四级红宝书，书店和背单词 APP 都有）再背 GRE。", "为什么强调四级：四级词是做题的“地板”——题干和选项里最简单的那层词你都认识，老师讲的解题方法才落得了地。"]}, {"type": "teach", "title": "② 备考资料：只刷习题集", "ppt": ["《GRE 填空习题集》", "《GRE 填空录播课堂例题》", "lengnan_gre@163.com"], "text": ["**《GRE 填空习题集》是市面上唯一值得做的填空资料**，上课每道例题都选自它（300 多页，每个练习 10 题=真实考试一个 section）。", "**不要碰“基金题”**（填空基金 1000/1200/1300 题）：里面有的题内容就是错的（根本没有正确答案），有的参考答案就是错的——你做完对答案，发现不一样，说不清是你错还是它错，这种材料刷多了反而有害。其他非真题资料同理，对真实考试基本没帮助。", "**打印建议**：最好打印习题集，课上把单词意思、解题线索直接写在题目上，复习方便。300 多页全印成本高，可以只印《课堂例题》——它按课堂讲题顺序排版，不用来回翻页。两个至少印一个，只听不记笔记基本留不下印象。", "老师个人准备的额外备考资料：往 lengnan_gre@163.com 发任意一封邮件，收自动回复的下载链接（含习题集文字版解析，课后答疑用得上）。"]}, {"type": "teach", "title": "③ 三种题型完全拆解", "ppt": ["单空题 / 六选二 / 多空题"], "text": ["**单空题**：一个空+五个选项选一个。最基础的考法（例1）。", "**六选二**：一个空+六个选项选**两个**，必须正好选对才得分，多选少选错选一律零分。两个正确项几乎一定是近义词（同一个空填两个都得对→意思必然一样）。出题套路：6 个选项里 4 个构成两组近义词+2 个纯干扰。所以单词背得好，六选二就是最好做的题——从两组近义词里选一组，完全不会瞎蒙也有 1/2 概率；会一点基本就全对（例2，第2讲细讲）。", "**多空题**：两个或三个空，每空三个选项、各选各的，**全对才得分**——三空题选对两个也算全错，难度≈连续做对三道单空题（例3，第2讲细讲）。", "为什么必须全对才得分：ETS 要保证分数区分度，填空不是“沾边就给分”的题。"]}, {"type": "q", "tag": "题型示例", "title": "例1 · 单空题（认认长相）", "source": "PPT 第5页 · 详解在第2讲", "pause": false, "demo": true, "stem": [{"t": "The students’ ______ natures were in sharp contrast to the even-tempered dispositions of their parents."}], "options": {"A": "mercurial", "B": "blithe", "C": "phlegmatic", "D": "apathetic", "E": "cunning"}, "answer": "A", "explain": {"思路": "单空题标准样式：一个空、五个选项选一个。这题本身是真题（习题集第6页第1题），第2讲“对比关系”会用它正式训练。", "annot": "原题里 <span class='m2'>in sharp contrast to</span>（截然相反）是信号词——看到它就知道前后要填<span class='m4'>相反</span>。这是第2讲的主角。", "辨析": "mercurial 善变的 / blithe 无忧无虑的 / phlegmatic 感情迟钝的 / apathetic 冷漠的 / cunning 聪明或狡猾（本身无褒贬，看上下文）。", "点拨": "现在只需记住单空题的样子：一个空、五个选项。注意它和例2（六个选项）、例3（两个空）长相不同。", "词根": ["**mercurial**　Mercury 水星（离太阳最近、公转最快）+ial → 变化快 = 善变的；小写 mercury=水银（液态善变）", "**blithe**　古英语 blithe=温和欢乐 → 无忧无虑的", "**phlegmatic**　phlegm 痰：古体液学说中“黏液质”冷静迟钝 → 感情迟钝", "**apathetic**　a-（无）+path（感情，sympathy 同情同根）+etic → 无感 = 冷漠", "**cunning**　中古英语=技巧 → 聪明/狡猾（本身无褒贬）"], "逻辑": "全句只有一句一个信号词。第一步抓 in sharp contrast to（对比）→ 空格与 even-tempered 相反；第二步 even-tempered=脾气稳定 → 空格填“脾气不稳定”。信号词+已知一端，直接出答案。", "翻译": "学生们的______性情，与他们父母平和的性情形成了鲜明对比。"}}, {"type": "q", "tag": "题型示例", "title": "例2 · 六选二（认认长相）", "source": "PPT 第6页 · 详解在第2讲", "pause": false, "demo": true, "multi": true, "stem": [{"t": "Though Edmund certainly had a dignified bearing and made a great first impression, those who became acquainted with him soon realized he had an essentially ______ nature."}], "options": {"A": "pugnacious", "B": "deliberate", "C": "punctilious", "D": "courteous", "E": "complacent", "F": "truculent"}, "answer": "AF", "explain": {"思路": "六选二：A-F 六个选项选 2 个，必须正好选对才得分。这题是真题（习题集第10页第8题），第2讲“转折关系”细讲。", "annot": "句首 <span class='m2'>Though</span> 提醒你前后<span class='m4'>相反</span>——现在不用会解，先记住“六选二=选一对同义词”。", "辨析": "pugnacious 好斗的 / deliberate 故意的、深思熟虑的（GRE 考“仔细的”）/ punctilious 一丝不苟的 / courteous 有礼貌的 / complacent 自满的 / truculent 好斗的。", "点拨": "看到 A 和 F 意思一样了吗？六选二“找同义词对”的意识从这里开始建立。", "词根": ["**pugnacious**　pugn（打，同根 pugilist 拳手）+acious → 好斗的", "**truculent**　truc（凶猛）+ulent → 好斗的（与 pugnacious 同义对）", "**deliberate**　de（完全）+liber（天平，weigh）+ate → 反复掂量 = 深思熟虑的；刻意（仔细义 GRE 考）", "**punctilious**　punct（点/刺）+ilious：连“点”上都挑剔 → 一丝不苟（punctual 守时同根）", "**courteous**　court（宫廷）+eous → 符合宫廷礼仪 = 彬彬有礼", "**complacent**　com（一起）+plac（取悦，please 同源）+ent → 自我取悦 = 自满"], "逻辑": "先抓句首 Though → 前后两半相反；前半是夸（dignified/great first impression）→ 后半必贬；主语是 nature（本性）→ 空格填贬义本性词。再看题型是六选二 → 必须选一对近义贬义词。", "翻译": "尽管 Edmund 举止高贵、第一印象极佳，但熟悉他的人很快发现他本质上是个______的人。"}}, {"type": "q", "tag": "题型示例", "title": "例3 · 多空题（认认长相）", "source": "PPT 第7页 · 详解在第2讲", "pause": false, "demo": true, "dual": true, "stem": [{"t": "World demand for oil had been intensified, but it slackened because China’s surge in oil consumption had (i)______. Moreover, high oil prices had themselves started to act as a short-term (ii)______ the global economy, thus further dampening demand."}], "options": {"i": {"A": "spread", "B": "commenced", "C": "slowed"}, "ii": {"D": "spur to", "E": "drag on", "F": "panacea for"}}, "answer": "iC,iiE", "explain": {"思路": "多空题：每个空从自己的三个选项里选，互不影响；全对才得分。这题是真题（习题集第3页第4题），第2讲“因果关系”一题拆两考。", "annot": "两个空各挂一个因果信号（<span class='m2'>because</span> / <span class='m2'>thus</span>）——第2讲再回来收拾它。", "辨析": "(i) spread 扩散 / commence 开始 / slow 减慢；(ii) spur to 刺激 / drag on 阻碍（熟词僻义）/ panacea 万灵药。", "点拨": "现在只需看长相：两个空、六选项分组。难度≈连做三道单空题。", "词根": ["**slowed**　slow（慢）+ed → 减慢", "**drag**　drag 拖拉 → 拖后腿=阻碍", "**spur**　spur 马刺（扎马肚催跑）→ 刺激", "**panacea**　pan（全）+acea（治疗）→ 包治百病的万灵药"], "逻辑": "两个空各挂一个因果词，先把 because 和 thus 圈出来：空(i) 因 because 与 slackened（减弱）同向 → 填“放缓”；空(ii) 因 thus 与 dampening（抑制）同向 → 填“拖累”。两个空互不干扰，逐空击破。", "翻译": "世界对石油的需求原本一直在加剧，但后来减弱了——因为中国的石油消费激增已经（i）______。此外，高油价本身也开始成为对全球经济的短期（ii）______，从而进一步抑制了需求。"}}, {"type": "teach", "title": "④ 算分规则与 Section 结构", "ppt": ["每题等分 · 20题=10填空+10阅读", "前6道单选（空格递增）+后4道六选二"], "text": ["一个 section 20 题，**每题分值完全相同**——不是题越难选项越多分越高。语文 20 题=10 填空+10 阅读，填空阅读各贡献一半分数。", "10 道填空的结构：前 6 道是单选题（单空/两空/三空混合），空格数从第 1 题的 1 个空逐渐增加到第 6 题的 3 个空；后 4 道全是六选二，即**六选二占整个填空的 40%**。", "目标推导：单词背好→后 4 道六选二轻松对 3-4 个；前面 6 道基本也能对 3-4 个——整个 section 做对 7 个左右就是很理想的正确率。填空对 70%，即使阅读做得差，语文总分也不会低。", "时间账：一个 section 30 分钟 20 题。阅读耗时远长于填空（光读文章就要半天），所以填空必须速战速决——**10 道填空控制在 12 分钟以内**，给阅读留时间。"]}, {"type": "teach", "title": "⑤ 三大出题特点：不看什么，只看什么", "ppt": ["所有选项保证语法正确", "专业知识不作考点", "解题线索充分"], "text": ["**① 选项语法全对**：GRE 不是英语考试，不考语法。只要选项写得出来，填进空里语法就一定对。常有同学拿到选项说“这个词不能这么用”——错，填空题里能写出来就能用。所以**不要看语法**，只问：填进去意思通顺合理吗？合理就对，不合理就不对，语法永远是对的。", "**② 专业知识不作考点**：题干大量出现专业名词（地质、生物、艺术史……），都是吓唬你、制造心理压力的，做题不需要知道它们指什么。", "**③ 解题线索充分**：每道题只靠题干+选项就足以选出答案，出题人设置了足够充分的线索。关键是你能不能找到。线索只有两种：**同义对应**（两部分意思相同）和**反义对应**（两部分意思相反）。所有解题方法概括成三个字：**找对应**。"]}, {"type": "teach", "title": "⑥ 核心方法论：找对应", "ppt": ["因为…所以… → 相同", "虽然…但是… → 相反"], "text": ["对应=出题人故意让句中很多成分两两之间意思相同或相反。做题先看空格附近：哪个非空内容与空格构成相同/相反？找到对应→猜出空格方向→对选项。", "最常见信号：**因为…所以…**（因果→前后相同）、**虽然…但是…**（转折→前后相反）。下面四道热身题就是这两种对应的最小模型，也是你建立“找对应”直觉的第一块肌肉——请务必先自己做，再点选项。"]}, {"type": "q", "tag": "热身题", "title": "热身1 · 同义对应", "source": "PPT 第11页", "pause": true, "stem": [{"t": "因为地是湿的，所以地是____。"}], "options": {"A": "干的", "B": "湿的"}, "answer": "B", "explain": {"思路": "①找对应：因为…所以…→前后相同；②猜空格：前面“湿的”→后面也必须湿；③选 B。", "annot": "<span class='m2'>因为…所以…</span> ⇒ 前后<span class='m1'>相同</span>：<span class='m3'>地是湿的</span> → 地仍是<span class='m3'>湿的</span>。", "辨析": "同义对应的最小模型：连接词两端必须同方向。", "点拨": "真实考试只是把“地湿的”换成你不认识的英文单词，逻辑一模一样。", "词根": [], "逻辑": "“因为…所以…”=同向信号 → 前后说同一件事 → 填“湿的”。这类题练的是：见到因果信号就判同向，不需要读懂内容。", "翻译": "（中文题）因为地是湿的，所以地是____。"}}, {"type": "q", "tag": "热身题", "title": "热身2 · 反义对应", "source": "PPT 第12页", "pause": true, "stem": [{"t": "虽然地是湿的，但是桌子是____。"}], "options": {"A": "干的", "B": "湿的"}, "answer": "A", "explain": {"思路": "①找对应：虽然…但是…→前后相反；②猜空格：前面“湿”→后面填“干”；③选 A。", "annot": "<span class='m2'>虽然…但是…</span> ⇒ 前后<span class='m1'>相反</span>：<span class='m3'>湿</span> → <span class='m4'>干</span>。", "辨析": "转折连接的两部分必须反方向。", "点拨": "信号词认出来，空格方向就定了。考场上认信号词是第一步。", "词根": [], "逻辑": "“虽然…但是…”=反向信号 → 前后相反 → 填“干的”。练的是：转折信号判反向。", "翻译": "（中文题）虽然地是湿的，但是桌子是____。"}}, {"type": "q", "tag": "热身题", "title": "热身3 · 长难句伪装（后半句是骗子）", "source": "PPT 第13页", "pause": true, "stem": [{"t": "虽然有些人最初认为因为地是湿的所以地是____，但是经过更加广泛而深入的研究后，人们发现问题并不像他们一开始所认为的那样简单。"}], "options": {"A": "干的", "B": "湿的"}, "answer": "B", "explain": {"思路": "句子长不影响：真正解题的只有前半句“因为地湿所以地__”→相同→湿→B。后半句“深入研究发现问题不简单”纯属干扰。", "annot": "整句只有 <span class='m3'>因为地湿所以地__</span> 有用；<span class='m5'>“经过更加广泛而深入的研究……不简单”</span> 完全是在骗你——命题人拿它拖你时间。", "辨析": "长难句的本质：三四行的句子里，核心对应关系只藏在其中一小块。", "点拨": "GRE 填空最常见的死法之一：句子复杂把你绕进去。长难句阅读能力必须过关——填空、阅读、写作审题、数学应用题全都考它。数学应用题翻译成汉语全是小学难度，中国同学错最多就是因为读不懂长难句。", "词根": [], "逻辑": "先拆掉三层壳：整句=[虽然[认为 因为地湿所以地__] 但是[研究后发现不简单]]。真正的对应关系只在“因为…所以”这一小块 → 同向 → 湿。后半句“深入研究”“不简单”全是干扰壳——长句先找最小对应单元。", "翻译": "（中文题）虽然有些人最初认为因为地是湿的所以地是____，但是经过更深入的研究后，人们发现问题并不简单。"}}, {"type": "q", "tag": "热身题", "title": "热身4 · 思维严密性（经典陷阱）", "source": "PPT 第14页", "pause": true, "stem": [{"t": "来自邻邦日本的哆啦A梦是_____。"}], "options": {"A": "一个胖子", "B": "一本书", "C": "一种水果", "D": "一位外国友人", "E": "一种思想"}, "answer": "D", "explain": {"思路": "信号“来自邻邦日本的”→前后相同→空格填“和日本最接近”的特点→外国友人，选 D。", "annot": "题目给的唯一线索是 <span class='m3'>来自邻邦日本</span> → 最接近的选项是 <span class='m4'>外国友人</span>。A“胖子”错在脑补。", "辨析": "A 为什么错？哆啦A梦确实是胖子——但题目没说的特点你不能脑补。它可以是书、可以是角色……身上特点无数，题目只说了一个，就只能填那个。什么时候能选 A？题目得说“胖胖的哆啦A梦是____”才可以。", "点拨": "黄金原则：你选的每个选项在题目里必须有明确依据；靠脑补出来的选项一律不选。这是 GRE 思维严密性的核心。", "词根": [], "逻辑": "唯一的依据是“来自邻邦日本”→ 空格必须填“和日本最接近”的属性 → 外国友人。A“胖子”本身没错，但题目没说——选项必须有题干依据，脑补一律不选。", "翻译": "（中文题）来自邻邦日本的哆啦A梦是____。"}}, {"type": "teach", "title": "⑦ 做不对的三大死法", "ppt": ["单词不认识 / 长难句看不懂 / 思维不严密"], "text": ["**① 单词不认识**（最常见）：一个 section 10 道填空里，超过一半（6 甚至 7 道）是纯单词题——只要单词认识+会基本方法，没有理由做错。剩下的题才需要动脑子或用复杂技巧。所以备考填空最关键的就是背单词：单词好，填空成功一半；单词不行，方法再多也是瞎选。", "**② 长难句看不懂**：个别填空题句子写得全是长难句，阅读不过关就看不出来谁和谁对应。", "**③ 思维不严密**：喜欢脑补、不讲道理（热身4就是典型）。GRE 是思维能力考试，想问题不能“我觉得”。", "对比之下，语法、专业知识、背景常识都不是考点——别把劲使错地方。"]}, {"type": "teach", "title": "⑧ 背单词：词汇书与查字典", "ppt": ["《GRE 核心词汇一本通》", "朗文当代 / 牛津高阶（日常）", "韦氏 Webster / 新牛津美语（熟词僻义）"], "text": ["**词汇书只推荐一本**：《GRE 核心词汇一本通》。其他 GRE 词汇书质量大多不敢恭维。全书约 3000 词，一个月可背完一遍，再复习 1-2 个月背到滚瓜烂熟，上考场前每个单词每个意思必须熟透。纸质版京东/当当有，也有免费 APP。", "**查字典的第一原则**：有道/金山只是字典软件，无好坏之分；真正分高下的是**词库**。千万别看它们默认显示的“简明英汉汉英词典”——质量极其糟糕，很多翻译是错的，单词意思写错了你又发现不了，做题死都不知道怎么死的。日常查**朗文当代 / 牛津高阶**（市面上质量最高的两本英汉字典，正常字典软件都至少收一本）。", "**GRE 要备的第二本**：韦氏（Merriam-Webster’s Collegiate）/ 新牛津美语（New Oxford American Dictionary）——考 GRE 手里至少一个。原因：填空酷爱考**熟词僻义**（你很熟的词，考你从没听过的意思），生僻到朗文牛津都没收；这两本篇幅大、收义全。安卓装 Webster（应用商店搜 Webster Dictionary，免费版有广告内容一样）；iPhone 直接用它系统自带的“查询”功能（选中单词→查询→选 New Oxford American）。", "**用英英词典的纪律**：这两本是纯英英、没有中国字，查起来累，所以**平时别总查它们**——熟词僻义 100 个词考不到 1 个。只有查了朗文牛津后每个意思代入都说不通时才请出它们。且解释里的生词用英汉字典查，别用它查自己，否则“查一个生三个”，指数爆炸，最后整本字典通读一遍，忘了最初要查什么。", "**懒人替代方案**：做题查词可以直接查“一本通”APP——它收录的都是 GRE 实际考的意思，最省事；纸质版书末有字母序索引可查。"]}, {"type": "teach", "title": "⑨ 解题四步法（本讲核心之核心）", "ppt": ["1.找对应 2.猜空格 3.选答案 4.代入验证（考场不必须）"], "text": ["**①找对应**：读题，判断哪两部分构成相同/相反（尤其看空格和谁对应）。**②猜空格**：按对应方向先猜出空格该填什么意思——注意是先猜后选，顺序不能颠倒。**③选答案**：拿预判对选项，符合的选、不符合的排除。**④代入验证**：整句读一遍确认合理。", "**为什么必须先猜后选**：不要一上来把选项挨个带进句里读。5 个选项读 5 遍；两空题 3×3=9 种组合读 9 遍——一道题做成九道题。考试时间一个 section 30 分钟 20 题，阅读又特别耗时，填空必须快：10 道填空目标 12 分钟以内。只有先猜空格，熟练后题目读一遍就知道该填什么；带入选项读是考场做不完的头号原因。", "**第四步考场不必须**：填空能不能做对看前三步；有把握就不必回读，省时间给阅读；心里没底再代入验证一遍。", "**平时就要练**：不强制自己先猜空格，考场一紧张就又开始带入选项读了。平时刷题对自己高要求，考场上才用得出。"]}, {"type": "q", "tag": "四步法演示", "title": "用四步法再走一遍热身1", "source": "PPT 第23页", "pause": true, "stem": [{"t": "因为地是湿的，所以地是____。"}], "options": {"A": "干的", "B": "湿的"}, "answer": "B", "explain": {"思路": "①找对应：因为所以→同义；②猜空格：前面“湿的”→空格填“湿的”；③选答案：B；④代入验证：“因为地湿所以地湿”，合理。", "annot": "四步走：<span class='m1'>①</span> 认出 <span class='m2'>因为…所以…</span> → <span class='m1'>②</span> 猜“湿的” → <span class='m1'>③</span> 选 B → <span class='m1'>④</span> 读一遍确认。", "辨析": "四步里真正值钱的是①②——绝大多数错题死在没找到对应、或没先猜空格。", "点拨": "把流程刻进肌肉记忆，第2讲开始每道真题都这么拆。", "词根": [], "逻辑": "“因为…所以…”=同向信号 → 前后说同一件事 → 填“湿的”。这类题练的是：见到因果信号就判同向，不需要读懂内容。", "翻译": "（中文题）因为地是湿的，所以地是____。"}}], "transcript": "同学们，大家好，欢迎来到我们GRE填空的课程。在这一小节儿，我们会给大家介绍一下GRE填空题的考法以及备考填空的方法。首先我们来说一下，大家在听课之前需要完成的一些准备工作。准备工作的第一条就是你要确保四级词汇，你已经完全掌握了。需要注意的是，大家在听我们的填空课程之前，是不需要先把GRE单词都背完的。经常就有以前的同学就问我们，说我上课想听懂的话，是不是要先把GRE单词都背好呢？答案是否定的。你实际上课之前并不需要把GRE单词都背好。因为按照我们以往的经验，绝大多数来上GRE课程的同学，他在上课之前都是没有背过GRE单词的。所以我们在实际讲课的时候，也会考虑到大家的情况，我们讲题的时候，但凡是题目里出现的比较难的GRE级别的单词。我们在让你做这道题之前，都会先把单词的意思告诉你，这样即使你单词没有背过，做题也可以做，上课也可以听懂。所以你在上课之前不需要把GRE单词背完。但是呢，我们说虽然GRE单词上课之前不需要背完，但是这个四级单词上课之前是要保证没有任何问题的。因为四级，它属于是非常非常基础的词汇，所以我们上课的时候不会专门花时间去讲。但如果你四级词汇掌握的不好，那么上课的时候就可能导致你做题做不明白，或者你听课听不懂。但是有同学又说了，我自己也不知道我四级词汇掌握的是好还是不好，那我应该怎么办呢？如果你自己也不知道的话，那么你可以做一个接下来的小测验。屏幕上这四个单词全都来自于四级词汇，并且它们都是四级里相对而言难度比较高的单词，你可以看一下这四个单词，你是不是都认识？这四个单词你如果都认识的话，那就意味着你的四级词汇基本上没有任何的问题，所以你将来备考GRE的时候，你背单词只需要背GRE单词就够了。如果屏幕上这四个单词你发现你不能做到全认识，但是你起码可以认识两个或者是三个，那就意味着你四级词汇总体上而言可能没有什么问题，但是可能会有个别的漏网之鱼。所以你将来背单词的时候，你仍然可以先背GRE单词，但是你不能只背GRE单词，你把GRE单词全都背熟了之后，上考场之前也要把四级词汇集中多刷几遍，确保那些漏网之鱼也全都被你清理掉。但还有些同学，你可能说屏幕上这四个单词我只认识一个，甚至我一个都不认识。你如果只认识一个甚至一个都不认识的话，那就意味着你的词汇基础对于GRE而言差的还是比较多，所以这个时候就不建议你一上来先背GRE单词。因为以你目前的词汇基础GRE词汇对你来说实在是太难了，你一上来就背GRE单词，你是很难坚持下去的。所以这个时候就建议你先把四级单词全都背熟，这样打下一个好的基础之后，你将来再去背GRE单词，你就会觉得相对而言好接受一些。那有同学说我如果需要背四级单词，应该背什么单词书呢？四级单词就直接建议你去背，市面上最流行的四级单词书就是新东方的这个四级红宝书。这个书的话，各大书店里基本都可以买得到，而且有很多背单词的手机APP，它里边儿也包含了这个单词书，所以你将来就背这个四级词汇就可以了。上课之前第二个准备工作就是需要打印好咱们上课所需要的材料。在我们班级的网盘里，为大家准备了这样两个资料，一个是叫填空习题集，还有一个叫填空录播课堂例题。首先说一下，我们这个填空习题集。咱们的填空习题集是市面上所有填空练习题里最值得你做的一个，甚至我们可以说它是市面上所有资料里唯一值得你做的一个。市面上其他的一些填空题目的资料，对你的帮助都非常非常的有限，比如说有一些资料，它里边儿的题目其实并不是实际考试的真题。于是你去做这种题目，对你考实际的GRE考试而言，基本上就可以说是没什么帮助。除此以外，市面上还有一些所谓的基金题，你像你身边儿，如果也有同学考GRE，你可能见过很多同学，他刷填空题就刷一些所谓的填空基金1000题啊或者1200题啊或者1300题。这些基金题也是不建议你去碰的。这些基金题，它的题目有可能确实是考场上的真题，但问题是什么呢？问题就是它里边儿的错误实在是太多了。比如有些题，它题目的内容是错的，这道题根本就没有正确答案，还有些时候它题目给你的那个参考答案是错的。所以你做题的时候就会出现什么问题呢？比如一道题，你选完了之后发现你的答案和他的答案不一样。其实说不准就是他做错了，你做对了。于是因为像这种材料儿，它里边儿错误实在是太多，你做错也不知道是谁的问题，所以也不建议你去碰这种乱七八糟的资料儿。大家将来备考填空，你去刷填空题，建议你只刷一个资料，就是我们给大家准备的填空习题集。因为这个填空习题集是市面上唯一值得你做的填空题目，所以我们将来上课讲的每一道例题都是选择这个填空习题集。所以大家上课之前你就可以把这个习题集打印出来，这样你在听课的时候记笔记就会非常非常的方便。你比如我们上课的时候讲到了题目里的单词，那这个单词的意思你就可以直接写到你打印出来的题目上。还有我们上课讲到的这个题目的解题线索，那么你就可以直接在这个题目上圈圈画画，你将来复习的时候也方便。但你如果不打印或者是不做笔记，只是在我们讲题的时候走马观花的听一遍，那你这样其实很难留下什么印象，听课最后也就没有什么效果。但是这个习题集，你把它下载下来之后，你就会发现一个问题，就是里边儿的题目特别特别多，整个文档300多页儿。这些题目你如果全都打印出来的话，成本会比较高，所以我们还给大家准备了一个备选方案，相对而言比较经济一些。就是你可以只打印第二个文档，这个填空课堂例题。因为习题集里边儿题目数量非常非常多，在我们有限的课堂时间之内，没法把它全都讲完，所以我们将来上课讲题的时候只会讲其中一些比较有代表性的题目。而课堂例题这个文档，它就包含的是我们将来讲知识点的时候会讲到的题。所以这个文档你就会发现比那个习题集里边儿题目就要少很多，打印起来也就容易的多。而且我们将来上课讲知识点的时候，我们不是按照习题集里题目的顺序来讲，我们是按照知识点分类来讲的。所以你如果是按照习题集来听课，可能就需要不停的把这个习题集翻来翻去。而课堂例题这个文档里边儿题目的顺序就是我们将来上课讲题的顺序，所以你如果用这个文档的话，就不再需要来回儿翻页儿了。所以总之就是屏幕上这两个文档上课之前建议你至少打印好一个，这样你将来就可以愉快的做笔记。而除了我们课程网盘里提供的资料之外，我个人也给大家准备了一些额外的备考 统自带的字典。你每买一个iPhone，它里边儿都自带一个查字典功能，然后查字典就可以查下边儿这个新牛津美语。但这个时候很多同学又说了，我用了这么多年的iPhone，没发现它还可以查字典啊。那你就要好好反省一下啦，你花那么多钱买的一个iPhone在你身上，是不是都白花了？嗯iPhone它是自带了一个查字典功能的。只不过它这个功能藏的比较深iPhone里边儿没有一个专门儿的查字典的APP，它这个查字典功能是直接集成在iOS系统里的。iPhone你想查字典应该怎么查呢？就是首先你需要选中你想查的单词，然后你就会发现弹出了这么几个按钮。其中有一个叫查询。你如果第一次用这个查询功能，它就会进入这个选词典的页面。你就会发现你查英文单词，它一般会跳出来两个字典，然后其中的第二个就是我们刚刚说过的叫new oxford American dictionary，然后你再点进去就可以看到这个字典，完整的解释。所以这个功能非常非常的方便，那么你将来用iPhone的同学也可以多查一查这个字典，不需要任何的下载。屏幕上这两个字典还需要注意一个问题，就是这两个字典你手里有归有，但是平时不要总去查它，平时优先查字典还是查朗文，还有牛津。屏幕上这两个字典，你如果查过一遍，就会发现它们俩有一个极其致命的问题，就是这两个字典里，它是没有中国字儿的，这是两个纯英英的字典。所以查起来特别特别累人，而且效率特别特别低。你像我们刚刚说查这两个字典，就是为了解决熟词僻义的问题，而熟词僻义这种东西考试，它确实会考，但它不可能每一个单词都在考。你熟词僻义。它100个单词能考一个数字PE就已经了不起了。所以你平时大多数情况下，你查朗文和牛津是足以解决你的问题的。只有什么时候才需要查这两个大字典，就是你只有查了朗文和牛津之后，你发现字典里的每一个意思带到题目里都说不通，就觉得这个句子写的有问题。那就意味着这个单词它可能用了一个朗文和牛津的，没有收录的意思，那这个时候你才需要把这两个大字典请出来。你看一下这个单词，具体它都有哪些朗文和牛津里没有写到的意思？除此以外，因为这两个字典都是英英字典嘛，所以查的时候还容易出现一个什么问题呢？就是你查了一个单词之后，你就看它的解释，结果你发现这个解释里边儿又有生词，又看不懂。那这个时候怎么办？你就可以用英汉字典去查这两个字典里的解释。你查这俩字典的时候一定要注意，不要用它们去查，自己解释里的单词，因为这样很容易陷入一个死循环。你就经常会出现什么问题呢？比如说你查一个单词，查一个单词，看它解释之后发现里边儿有三个单词，你不认识，你接着去查那三个单词，结果查完了，现在就变成了九个单词，你不认识。再查一遍就变成了27个单词，你不认识就这样不断的指数级增长，你不断的查，不断的查，最后整本儿字典被你从头到尾通读了一遍。然后你早就已经忘了你第一个想查的单词到底是个啥？所以你会发现，这种查法其实没有任何的意义啊，你查字典的话，就是为了知道这个单词到底是个什么意思，所以你看到解释里边儿有生词，你也只需要查一下英汉字典，知道这个解释到底是个什么意思，其实也就够了。除此以外，做填空题，查字典，还有一个办法就是像我们刚刚说过的核心词汇一本通，它有一个手机APP。那个up除了背单词之外，它也包含了查单词的功能，然后这个查的单词就是核心词汇一本通书里边儿收录的词汇。因为核心词汇一本通，它收录了你做填空题，基本上可以说是大多数你需要知道的单词，所以你将来做题的时候查字典，你直接查这个核心词汇一本通的APP，这个也是可以的。当然，你如果没有这个APP，你买的是核心词汇，一本通的纸质版，这个也没有关系，核心词汇一本通那本书，你背的时候你会发现单词是乱序，但是在书的最后，它给了你一个按字母顺序列的索引。所以那个索引也是帮你查单词用的，你如果手里只有那个纸质版，那么你查这个书里的单词，你就可以根据那个索引来查。好，以上就是背单词，还有查字典相关的问题，接下来我们接着说做填空题，具体应该如何来做？你将来做填空题，任何一道题，任何一个空格儿解题都可以按照这么四个步骤儿来做，第一叫找对应，第二猜空格儿，第三选答案，第四叫代入验证，最后一步我们说考场上不必须。你就比如像我们刚刚举过的这个例子。考场上遇到这道题，应该怎么做呢？一上来第一步找对应你读题，发现它说因为d是湿的，所以d是空格儿，你看到了因为所以那就意味着前后这两个部分应该是一个同义对应。由此你就可以完成第二步裁空格。前面儿它已经说了d是湿的，所以后边儿肯定还得说啥呀，后边儿肯定还得说d是湿的，于是我们就知道空格儿就应该再填一个湿的。接下来第三步就是选答案，你看选项发现b选项意思就较湿的，所以答案就选一个b。你如果不放心的话，最后再带入验证一下，整个句子说因为地是湿的，所以地是湿的，读起来非常的合理，所以没有任何问题就可以做下一道题了。那个最后一步，我们说考场上不必虚，原因其实很简单，就是你做几个填空题，你就会发现填空题能不能做对看的，其实就是前三步。最后一步，其实是多余的。所以你在考场上做题，如果这道题比较容易，你前三步做完了之后比较有把握的话，你就没有必要再浪费时间多读一遍题。你只有前三步做完了之后，你心里没底儿，你不确定自己选的对不对，你再把第四步做一下，整个句子再读一遍。你考场上如果少读几个填空句子，就可以多留一点儿时间给阅读，所以第四步我们说考场上不必须。这个解题顺序真正值得注意的是什么呢？就是它的第二步和第三步，这两个一定不要颠倒过来。做填空题一定是先猜空格后选答案，而不是相反。就是说你在做填空题的时候，应该怎么做？你一上来先不用管它选哪个，还是不选哪个，一上来你就先根据题目里给你的线索，你去判断一下这个空格儿，应该填一个什么样的意思？你先对空格儿有了一个预判之后，你再去看选项哪一个符合你的预判，选它哪一个不符合你的预判，排除它。做填空题，不要怎么做呢？不要一上来就把选项挨个儿带到句子里去读，看哪一个读起来通顺。为什么不让你这么挨个带你去读？原因很简单，你如果这样带你去读的话，你考场上这个题肯定是做不完的。因为咱们考试时间非常非常的紧张，一个section 20道题只有30分钟平均一分半就要一道题，而你做了阅读你就会发现阅读本身特别特别花时间。所以你填空就必须要尽可能少花一点时间，这样才能留足够多的时间给阅读。填空题，你想做的快，怎么样才能做的快？就是像我们说先猜空格。你如果先猜空格儿的话，你就会发现你题目做熟练了之后一道题，你基本读一遍，你就知道空格儿应该怎么填了？但是你如果挨个儿选项，带你去读的话，这问题就来了，这道题如果五个选项，你就要读五遍，这道题如果是一个两空题，第一个空三个选项，第二个空又是三个选项。一共九种可能的选法，你需要读九遍，你才能读出答案，于是一道题就被你做成了九道题。你考场上如果这样做题的话，那么你即使填空能做完阅读，基本上也是肯定没有时间来做的。所以因为咱们这样一考是时间非常短的，所以你在考场上这个题目光做对不行，你还需要尽可能快的把它做对，那填空题怎么做做的快，就是像我们说的先踩空格儿。当然，大家平时做题的时候可能不会先猜空格儿，因为你不习惯这样的做题方法，所以大家平时上课做题，还有你课后自己刷题，也是要养成这个好习惯。你要对自己高要求一点儿，平时做题也是一定要先去猜空格儿，你要遏制住自己，一上来就把选项带到题目里去看的冲动。你只有平时先猜空格儿，这招儿练得足够熟，将来到了考场上，你顺利的把它用出来，那这样考场你才可以做题，做的也比较快。但如果你平时做题的时候没有要求自己，一定要先去猜一下空格儿，或者你平时训练量太少，题刷的不够。那么，这章你练得不熟，将来上了考场之后，你可能一紧张就又开始挨个儿选项带你去读了。最后，你题目也就做不完了。好，以上就是填空题的基本情况，咱们这一小节就到这里。"}, {"id": 2, "title": "第2讲 · 解题线索总论：7 种对应", "intro": "上一讲学会“找对应”，本讲给你 7 种具体线索：前 6 种靠逻辑关系词，第 7 种“动词正反向”专治没有逻辑词的题。每种线索配一道真题，完整复刻课堂“先逐词讲透→暂停自测→逐题拆解”的节奏。信息量是课堂的 1:1，放心学。", "cards": [{"type": "teach", "title": "本讲导览", "ppt": ["对比 / 转折 / 解释 / 因果 / 并列递进 / 指代 / 动词正反向"], "text": ["7 种线索分两类：前 6 种靠**逻辑关系词**告诉你相同/相反——只要该认识的词都认识，基本都能判断方向；第 7 种“动词正反向”适用于**完全没有逻辑词**的题。", "任何一道题、任何一个空，理论上都能靠其中一种或几种线索解出。下面每种线索配一道真题（全部来自习题集），流程严格复刻课堂：先讲透单词→你暂停自测→再逐题拆解。词汇讲解是本课的半壁江山，别跳过。预告：第3-17讲将对每种线索做两讲的专项深入训练，本讲是总纲。"]}, {"type": "teach", "title": "线索① 对比", "ppt": ["两成分构成对比 → 填相反", "信号词：in contrast to / unlike / far from / different from"], "text": ["句中两个成分构成**对比**→两部分意思**相反**。做法：找到对比的双方，已知一方推另一方，方向反过来填。"]}, {"type": "q", "tag": "真题", "title": "习题集 第6页 第1题（单空题）", "source": "即第1讲例1，这次正式做", "pause": true, "stem": [{"t": "The students’ ______ natures were in sharp contrast to the even-tempered dispositions of their parents."}], "vocab": [{"w": "nature", "g": "天性、性格（≠自然）", "story": "一个人骨子里的性格叫 nature；此处指学生的性格。"}, {"w": "even-tempered", "g": "脾气稳定的", "story": "even 形容词=平均平稳、变化不大；temper=脾气。even 在数学里是“偶数”——偶数能平均分成两份，所以叫 even number。"}, {"w": "disposition", "g": "性格、脾气", "story": "近义词就是 temper。"}, {"w": "mercurial", "g": "善变的、反复无常的", "story": "来自 Mercury 水星：太阳系离太阳最近、公转最快、跑得最快的行星→“变得快”；小写 mercury=水银——常温下液态，变来变去没有固定形状。都是“善变”。"}, {"w": "blithe", "g": "高兴的、无忧无虑的", "story": ""}, {"w": "phlegmatic", "g": "感情迟钝的、不易动感情的", "story": "形容人喜怒比别人慢半拍：高兴没别人高兴，难过没别人难过。"}, {"w": "apathetic", "g": "冷漠的、无动于衷的", "story": "词根 path=feeling（感情）：sympathy 同情=syn(same)+path(feeling)——四级背过的熟词；apathy=a-(没有)+feeling→无感。借熟词 sympathy 串记 path 一族，比孤立背快得多。"}, {"w": "cunning", "g": "聪明的；狡猾的", "story": "本身无褒贬，必须看上下文：夸人=聪明，批评=狡猾。"}], "options": {"A": "mercurial", "B": "blithe", "C": "phlegmatic", "D": "apathetic", "E": "cunning"}, "answer": "A", "explain": {"思路": "①找对应：in sharp contrast to（截然相反）→学生性格 vs 家长性格=相反；②猜空格：家长“脾气稳定”→空格填“脾气不稳定”；③选：A mercurial 善变的。", "annot": "<span class='m1'>The students’ ______ natures</span> <span class='m2'>in sharp contrast to</span> <span class='m1'>the even-tempered dispositions of their parents</span><br>信号词 <span class='m2'>in sharp contrast to</span> ⇒ 蓝绿两方应<span class='m4'>相反</span>；绿方已知“脾气稳定”→蓝方填“善变”。", "辨析": "五个选项全在课前讲词里。善变（A）与“脾气稳定”恰成反义；B/C/D 都是“情绪平稳/无情绪”方向，与“脾气稳定”同向，不构成相反。", "点拨": "这就是所有填空题的通用打法：看到信号词→判断方向→把已知一端反过来填。词根 path 值得记：sympathy/apathy 一串。", "词根": ["**mercurial**　Mercury 水星（离太阳最近、公转最快）+ial → 变化快 = 善变的；小写 mercury=水银（液态善变）", "**blithe**　古英语 blithe=温和欢乐 → 无忧无虑的", "**phlegmatic**　phlegm 痰：古体液学说中“黏液质”冷静迟钝 → 感情迟钝", "**apathetic**　a-（无）+path（感情，sympathy 同情同根）+etic → 无感 = 冷漠", "**cunning**　中古英语=技巧 → 聪明/狡猾（本身无褒贬）"], "逻辑": "全句只有一个信号词 in sharp contrast to：抓它 → 空格与 even-tempered（脾气稳定）相反 → 填“善变”。单词不认识没关系，先把逻辑方向定下来，再用词根/词义去对选项。", "翻译": "学生们的善变性情，与他们父母平和的性情截然相反。"}}, {"type": "teach", "title": "线索② 转折", "ppt": ["虽然…但是… → 填相反", "信号词：though / but / yet / however / nevertheless"], "text": ["看到转折词→前后**相反**。转折题常是“前半句夸、后半句骂”（或反之），空格方向随之确定。第8题号说明它是六选二——选两个。"]}, {"type": "q", "tag": "真题", "title": "习题集 第10页 第8题（六选二）", "source": "即第1讲例2，这次正式做", "pause": true, "multi": true, "stem": [{"t": "Though Edmund certainly had a dignified bearing and made a great first impression, those who became acquainted with him soon realized he had an essentially ______ nature."}], "vocab": [{"w": "dignified bearing", "g": "高贵的举止", "story": "dignified 来自四级词 dignity（尊严）→“有尊严的”；bearing 这里=行为举止（≈behavior）——词义和“忍受/熊”差很远，背单词时注意。"}, {"w": "acquainted with", "g": "熟悉、熟识", "story": "四级 acquaintance=熟人，acquainted 是其形容词。"}, {"w": "pugnacious", "g": "好战的、好斗的", "story": "喜欢吵架打架的状态。"}, {"w": "deliberate", "g": "故意的；深思熟虑的；GRE考：仔细的（形容词）/仔细考虑（动词）", "story": "一词多义都有联系：本义是动词“仔细考虑”→形容词“仔细的”；深思熟虑=仔细思考；深思熟虑后才做→不是无心之举→“故意的”。考 GRE 记“仔细”义。"}, {"w": "punctilious", "g": "一丝不苟的", "story": "四级同根 punctual 守时=在时间上极其仔细；punctilious=任何事上都极其仔细。"}, {"w": "courteous", "g": "彬彬有礼的", "story": "court 最早的意思=国王的宫廷；符合宫廷礼仪→有礼貌（宫斗剧里规矩多、人人小心礼貌）。"}, {"w": "complacent", "g": "自满的、沾沾自喜的", "story": "对自己非常满意。"}, {"w": "truculent", "g": "好战的、好斗的", "story": "与 pugnacious 同义，本题的一对答案。"}], "options": {"A": "pugnacious", "B": "deliberate", "C": "punctilious", "D": "courteous", "E": "complacent", "F": "truculent"}, "answer": "AF", "explain": {"思路": "①找对应：句首 Though→前后相反。前半句夸（举止高贵+第一印象好）→后半句必骂→空格填贬义；六选二还要两个意思一样；②选一对贬义近义词：A pugnacious + F truculent（都好斗）。", "annot": "<span class='m2'>Though</span> 把句子切成两半：<span class='m3'>夸（dignified…great first impression）</span> → <span class='m4'>骂（______ nature）</span>。再配六选二铁律：正确两项互为近义词。", "辨析": "B deliberate 是熟词僻义陷阱——“仔细的”不是贬义；C 一丝不苟、D 有礼貌都是褒义；E 自满虽是贬义，但找不到近义搭档。只有 A+F 既是贬义又互为同义。", "点拨": "dignified bearing 不认识也没关系——great first impression 你一定认识，认识它就够猜空格了。不必每个词都认识，考点涉及的词认识就行。deliberate 的“仔细”义是本题最大收获。", "词根": ["**pugnacious**　pugn（打，同根 pugilist 拳手）+acious → 好斗的", "**truculent**　truc（凶猛）+ulent → 好斗的（与 pugnacious 同义对）", "**deliberate**　de（完全）+liber（天平，weigh）+ate → 反复掂量 = 深思熟虑的；刻意（仔细义 GRE 考）", "**punctilious**　punct（点/刺）+ilious：连“点”上都挑剔 → 一丝不苟（punctual 守时同根）", "**courteous**　court（宫廷）+eous → 符合宫廷礼仪 = 彬彬有礼", "**complacent**　com（一起）+plac（取悦，please 同源）+ent → 自我取悦 = 自满"], "逻辑": "先抓 Though → 前半夸后半骂 → 空格填贬义；再看六选二的铁律：正确两项必须互为近义词 → 在贬义词里找一对同义的“好斗”。两步各筛一次，答案自己浮出来。", "翻译": "尽管 Edmund 举止高贵、给人留下极好的第一印象，但熟悉他的人很快发现他本质上好斗。"}}, {"type": "teach", "title": "线索③ 解释", "ppt": ["冒号 → 后半句解释前半句 → 相同", "信号：冒号 / that is / in other words"], "text": ["句中出现**冒号**→后半句在解释前半句→两部分意思**相同**。看到冒号，空格答案就在冒号另一端的文字里。"]}, {"type": "q", "tag": "真题", "title": "习题集 第21页 第1题（单空题）", "source": "讲解前先暂停自测", "pause": true, "stem": [{"t": "Among the M-speaking people of Papua New Guinea, legends are associated with specific caves in the Sepik region; these legends are ______: only cave owners can share their secrets."}], "vocab": [{"w": "proprietary", "g": "私有的、专有的", "story": "只属于你的、不属于其他人。四级同根 property=资产、财产→property 是“个人财产”，proprietary 是“个人的、私有的”。"}, {"w": "impenetrable", "g": "无法理解的（GRE）；无法穿透的（托福）", "story": "来自 penetrate 穿透。im-否定→“穿不透”。汉语也说“这个人看不透”=看不懂——中英同构，无法穿透→无法理解。"}, {"w": "immutable", "g": "固定不变的", "story": "词根 mut=change（改变）：X 战警 mutant 变种人、mutation 变异、数学 permutation 排列（per=全部：排列=所有变化形式；计算器上算排列的 P 键就来自它）。im-不+mut+able→不变。"}, {"w": "didactic", "g": "说教的", "story": "喜欢给别人讲大道理。"}, {"w": "self-perpetuating", "g": "自我持续的、自我维持的", "story": "perpetual 永久的（perpetual motion machine=永动机）→perpetuate 使持续。指给一个原始推动力后能自己推动自己的过程——典型如催化剂反应：丢一小块催化剂开始反应，生成物又含催化剂，直到反应物耗尽才停。"}], "options": {"A": "proprietary", "B": "impenetrable", "C": "immutable", "D": "didactic", "E": "self-perpetuating"}, "answer": "A", "explain": {"思路": "①找对应：空格后冒号→冒号后解释空格→前后相同；②猜空格：冒号后“只有洞穴主人能分享其秘密”→秘密是主人的私有财产；③选：A proprietary 私有的。", "annot": "these legends are ______ <span class='m2'>:</span> <span class='m3'>only cave owners can share their secrets</span><br>冒号 ⇒ 前后相同：秘密“只有主人能分享”→秘密是<span class='m4'>私有财产</span>。", "辨析": "B impenetrable 是经典错选：秘密“不告诉你”≠“难懂”——秘密可能非常简单，只是不分享。别人能不能分享和本身难不难懂没有必然联系。C 不变、D 说教、E 自我持续都与冒号后内容对不上。", "点拨": "mut 词根一串（mutant/mutation/permutation/immutable）打包记。遇到“只有…才能…”就是“私有/专属”的信号。", "词根": ["**proprietary**　proper（自己的）+etary → 私有的（property 财产同根）", "**impenetrable**　im-（不）+penetr（穿透 penetrate）+able → 穿不透 → 无法理解", "**immutable**　im-（不）+mut（变，mutant 变种人）+able → 固定不变", "**didactic**　didact（教）+ic → 说教的"], "逻辑": "第一步抓冒号 → 后句解释前句，前后同向；第二步读冒号后“只有主人能分享秘密” → 往前倒推：秘密=主人的私有财产 → 空格填“私有的”。地名族名等专有名词直接跳过，不挡路。", "翻译": "在巴布亚新几内亚的 M 族人当中，传说总是与塞皮克地区特定的洞穴联系在一起：这些传说是专有的——只有洞穴的主人才能分享其中的秘密。"}}, {"type": "teach", "title": "线索④ 因果", "ppt": ["因为…所以… / thus → 前后相同", "信号词：because / since / thus / therefore"], "text": ["因果连接的两部分**相同**（“因为地湿所以地湿”）。下面这道双空题，两个空各被一个因果信号词夹住——一题两考，是最典型的因果训练。"]}, {"type": "q", "tag": "真题", "title": "习题集 第3页 第4题（两空题）", "source": "即第1讲例3，这次正式做", "pause": true, "dual": true, "stem": [{"t": "World demand for oil had been intensified, but it slackened because China’s surge in oil consumption had (i)______. Moreover, high oil prices had themselves started to act as a short-term (ii)______ the global economy, thus further dampening demand."}], "vocab": [{"w": "intensify", "g": "加强、加剧", "story": "来自 intense（剧烈的、激烈的）。"}, {"w": "slacken", "g": "减弱", "story": "与 intensify 反义。"}, {"w": "surge", "g": "激增", "story": "剧烈、猛烈、快速的增长。"}, {"w": "dampen", "g": "抑制、阻碍（GRE 考动词）；潮湿的（四级 damp）", "story": "中英同构“泼冷水”：damp one’s enthusiasm=给某人的热情泼冷水→抑制。四级 damp 是形容词“潮湿”，GRE 考动词“抑制”。"}, {"w": "commence", "g": "开始", "story": "=begin/start。"}, {"w": "spur", "g": "刺激", "story": "NBA 马刺队 Spurs；马刺是牛仔靴跟的刺，扎马肚子→马疼得飞奔→刺激。"}, {"w": "drag（名词）", "g": "阻碍、拖累（熟词僻义）；阻力（托福）", "story": "动词义“拖拉拽”你熟；名词=拖后腿的东西→阻碍。托福常见 reduce drag 减小阻力（讲鱼类流线型身体）。"}, {"w": "panacea", "g": "万灵药", "story": "包治百病的药、能解决一切问题的办法。纯 GRE 词，其他考试词书背不到。"}], "options": {"i": {"A": "spread", "B": "commenced", "C": "slowed"}, "ii": {"D": "spur to", "E": "drag on", "F": "panacea for"}}, "answer": "iC,iiE", "explain": {"思路": "空(i)：because 前后相同→需求 slackened（减弱）→中国的增长也填“减慢”→C slowed。空(ii)：句尾 thus 前后相同→dampening demand（抑制）→高油价对全球经济也是“抑制”→E drag on（拖累）。一题两考，全是因果。", "annot": "空(i)：because 把 <span class='m3'>slackened</span> 传给空格 → 填 <span class='m4'>slowed</span>。<br>空(ii)：thus 把 <span class='m3'>dampening demand</span> 传给空格 → 填 <span class='m4'>drag on（拖累）</span>。两个空互不干扰，逐空突破。", "辨析": "(i) spread 扩散、commence 开始，都与“减弱”无关；(ii) spur to 刺激（方向反了）、panacea 万灵药（语义不通）。drag on 作“阻碍”是本题最大的词义收获。", "点拨": "moreover=此外，表并列，顺带提示两个分句同向。多空题别怕，一空一信号，逐一击破。", "词根": ["**slowed**　slow（慢）+ed → 减慢", "**drag**　drag 拖拉 → 拖后腿=阻碍", "**spur**　spur 马刺（扎马肚催跑）→ 刺激", "**panacea**　pan（全）+acea（治疗）→ 包治百病的万灵药"], "逻辑": "把两个因果信号词先圈出来：空(i) 后面紧跟 because → 与 slackened 同向 → “放缓”；空(ii) 前面有 thus → 与 dampening demand 同向 → “拖累”。多空题别怕——一空一信号，各自独立。", "翻译": "世界对石油的需求原本一直在加剧，但后来减弱了——因为中国的石油消费激增已经放缓了。此外，高油价本身也开始成为对全球经济的短期拖累，从而进一步抑制了需求。"}}, {"type": "teach", "title": "线索⑤ 并列递进", "ppt": ["既…又… / not only…but also → 相同", "注意：可以是“句子对句子”的对应"], "text": ["and / not only…but also / moreover / furthermore→并列部分大方向**相同**（前褒后褒、前贬后贬）。对应可以是词对词，也可以是**句子对句子**——下面这道题就是句子对句子。"]}, {"type": "q", "tag": "真题", "title": "习题集 第3页 第1题（单空题）", "source": "讲解前先暂停自测", "pause": true, "stem": [{"t": "Scientists have argued not only that the chains of atoms called ladder compounds have ______ theoretical interest, but also that studies of such systems can lead to important practical applications."}], "vocab": [{"w": "argue（动词）", "g": "提出主张（=claim）", "story": "不是“吵架”。考试更爱考这个意思。"}, {"w": "interest（名词）", "g": "魅力、吸引力（≠兴趣）", "story": "让你对某物产生兴趣的特质→魅力。"}, {"w": "limited", "g": "有限的", "story": "填进去=“没有魅力”，方向相反。"}, {"w": "dubious", "g": "可疑的、靠不住的", "story": "来自无比熟悉的 doubt（怀疑）。"}, {"w": "superfluous", "g": "多余的", "story": "super-超过+flu（流）→流得漫出来→多余。同根：fluent 流利、affluent 富裕（钱流入）。"}, {"w": "unidimensional", "g": "肤浅的、没有深度的（GRE）；一维的（数学义）", "story": "uni-=one（unit 单元=一个东西）；dimension 维度（3D 的 D）。只有一个维度→能表达的内容极其有限→肤浅。"}, {"w": "intrinsic", "g": "天生的、内在的、与生俱来的", "story": "一生下来就有的特点。"}], "options": {"A": "limited", "B": "dubious", "C": "superfluous", "D": "unidimensional", "E": "intrinsic"}, "answer": "E", "explain": {"思路": "①找对应：not only…but also→前后半句同向。后半句“有重要的实际应用”是褒义→前半句也得说“有”理论魅力；②猜空格：填“有”；③选：A-D 填进去全是“没有”，只有 E intrinsic（天生的、内在的）能表达“有”。", "annot": "<span class='m2'>not only</span> <span class='m3'>有理论魅力</span> <span class='m2'>but also</span> <span class='m3'>有重要实际应用</span><br>两半句同向 ⇒ 前半句必须是“有”，五个选项只有 intrinsic 是“有”。", "辨析": "这题不考词义辨析，考方向判断：limited（有限=没有）、dubious（可疑=没有）、superfluous（多余=没有）、unidimensional（肤浅=没有）全是“无魅力”方向；只有 intrinsic“天生具有”=“有”。", "点拨": "E 填进去后全文找不到它的同义词——这题考的是**句子对句子**的对应。找不到词对词对应时，就看看是不是两个半句整体同向。", "词根": ["**intrinsic**　intrin-（内部）+sic → 内在的、天生的", "**superfluous**　super（上）+flu（流）+ous（形容词）：流得漫出来=多余。a modern building with no superfluous decoration 没有过度装饰的现代建筑（简约风）。"], "逻辑": "抓 not only…but also → 两个半句同向；后半句“重要的实际应用”是褒义 → 前半也必须说“有”魅力；五个选项里只有 intrinsic（天生具有）能表达“有”，其余四个全是“没有”。", "翻译": "科学家们不但主张这种被称为“梯形化合物”的原子链天生具有理论上的魅力，而且主张对这类系统的研究能带来重要的实际应用。"}}, {"type": "teach", "title": "线索⑥ 指代", "ppt": ["后半句出现 this / that / such / those → 前后相同", "被指代的内容前半句一定出现过"], "text": ["后半句出现**指代词**（this/that/such/those/“这种…”）→被指代的名词前半句一定出现过，前后意思**相同**。让空格与前文那个被指代的内容保持一致即可。这是技巧性最强的一种线索：空格答案根本不用读懂全句，找到“那个东西”就行。"]}, {"type": "q", "tag": "真题", "title": "习题集 第124页 第8题（六选二）", "source": "讲解前先暂停自测", "pause": true, "multi": true, "stem": [{"t": "The storylines of silent dramas may often have been ______, yet within those basic narrative outlines, the various emotional shadings could differ."}], "vocab": [{"w": "narrative / storylines", "g": "叙事的 / 故事线", "story": "narrative 来自四级 narration（记叙、叙述）。"}, {"w": "shading", "g": "细微差别、细微区别", "story": "shade 基本义=树荫、阴凉处→引申为同一颜色的不同色调（都是灰但深浅不同）→再引申=细微差别。"}, {"w": "analog", "g": "类似物、类似的东西", "story": ""}, {"w": "implausible", "g": "不合理的、不令人信服的", "story": "形容一个说法听上去没道理、不像是真的。"}, {"w": "incredible", "g": "难以置信的", "story": "四级词。"}, {"w": "conventional", "g": "传统的", "story": "与 basic 不同义。"}, {"w": "elemental", "g": "基本的", "story": "来自 element（基本元素）。"}, {"w": "rudimentary", "g": "基本的、粗糙的、不发达的", "story": "与 rude（粗鲁的）同根：rud=粗糙。一个东西或思想很粗糙→rudimentary。"}, {"w": "confusing", "g": "令人困惑的", "story": "与 basic 不同义。"}], "options": {"A": "implausible", "B": "incredible", "C": "conventional", "D": "elemental", "E": "rudimentary", "F": "confusing"}, "answer": "DE", "explain": {"思路": "①找对应：those basic narrative outlines 出现指代词 those→outlines 在前半句=句首 storylines；空格修饰 storylines，basic 修饰 outlines→空格填 basic 的近义词；②选两个：D elemental + E rudimentary。", "annot": "<span class='m1'>storylines（空格修饰它）</span> ↔ <span class='m1'>those narrative outlines（basic 修饰它）</span><br><span class='m2'>those</span> 把前后锁定：空格 = <span class='m3'>basic</span> 的同义词 → elemental / rudimentary。", "辨析": "A 不合理、B 难以置信、C 传统、F 困惑都不是“基本”的意思。六选二永远是“意思一样的两个”。", "点拨": "这题还藏着 yet（转折）这个备胎线索，但指代关系更直接——多线索题，考场上哪个顺手用哪个。rud 词根：rude/rudimentary 一起记。", "词根": ["**elemental**　element（元素/基本要素）+al → 基本的", "**rudimentary**　rud（粗糙，rude 同根）+imentary → 基本/粗糙", "**implausible**　im-（不）+plaus（鼓掌，plausible 可信的）→ 不令人信服"], "逻辑": "抓指代词 those：those basic narrative outlines 指回前文的 storylines → 被指代者和空格同义（空格修饰 storylines，basic 修饰 outlines）→ 空格= basic 的同义词。指代词=最强的同向信号之一。", "翻译": "默剧的故事线往往非常基本——然而正是在那些基本的叙事框架之内，各种情感的细腻差异却可以千差万别。"}}, {"type": "teach", "title": "线索⑦ 动词正反向", "ppt": ["正方向动词（prove/attest to）连接同义", "负方向动词（fail to/prevent）连接反义", "专治“没有逻辑词的题”"], "text": ["前 6 种都靠逻辑词；但有些题**没有任何逻辑词**，就是主谓宾挖个空。这时看**谓语动词的方向**：正方向动词连接**同义**，负方向动词连接**反义**。口诀：“好人做好事，好人不做坏事”。", "推理示例：好人____好事→前后同向→填“做”；好人____坏事→前后反向→填“不做”；好人不做____→反向→填“坏事”。谓语动词的正负，由它连接的主语和宾语的关系决定。证明（attest to）、表明（show）都是正方向动词。"]}, {"type": "q", "tag": "真题", "title": "习题集 第11页 第9题（六选二）", "source": "讲解前先暂停自测", "pause": true, "multi": true, "stem": [{"t": "Circulatory systems in organisms originated in widely separated epochs and under a broad range of circumstances; the myriad forms they take attest to that ______ of origin."}], "vocab": [{"w": "organism", "g": "生物、生命体", "story": "≠有机物。"}, {"w": "epoch", "g": "时代", "story": "地质/历史上很长的时代。"}, {"w": "myriad", "g": "大量的、无数的", "story": "特别多。"}, {"w": "attest to", "g": "证明、证实", "story": "=prove，正方向动词。"}, {"w": "mysteriousness", "g": "神秘", "story": "与“形式多”对不上。"}, {"w": "randomness", "g": "随机", "story": "注意区分：题目说的是“多种多样”，不是“随机”。"}, {"w": "ambiguity", "g": "模糊、模棱两可", "story": "来自四级 ambiguous（说话不明白、怎么理解都行）。"}, {"w": "heterogeneity", "g": "不同、多样", "story": "hetero-=不同。"}, {"w": "indeterminacy", "g": "不确定", "story": "in-不+determine 决定→没被决定。"}, {"w": "diversity", "g": "多样", "story": "与 heterogeneity 同义，本题的一对答案。"}], "options": {"A": "mysteriousness", "B": "randomness", "C": "ambiguity", "D": "heterogeneity", "E": "indeterminacy", "F": "diversity"}, "answer": "DF", "explain": {"思路": "①找对应：分号后 the myriad forms they take attest to that ___ of origin。attest to（证明）=正方向动词→前后同义；前面“无数种形式”→证明起源“多样”；②选两个表多样的：D heterogeneity + F diversity。", "annot": "<span class='m3'>myriad forms 无数种形式</span> → <span class='m2'>attest to（证明，正方向）</span> → 起源的 <span class='m4'>______ 也必须是“多样”</span>。", "辨析": "B randomness 是最大干扰：题目说“不同时代、不同情况、无数种形式”→强调的是“多而杂”，不是“随机”。C 模糊、E 不确定、A 神秘都偏离“多样”。", "点拨": "第二条线索：that ___ of origin 的 that 是指代——空格在前半句要有体现，而前半句说起源在“完全不同的时代”“完全不同的情况”→起源特点就是“不同”。指代+动词正反向，殊途同归 D+F。", "词根": ["**heterogeneity**　hetero-（不同）+gene（产生）+ity → 多种多样", "**diversity**　di-（分开）+vers（转）→ 转得五花八门 = 多样", "**ambiguity**　ambi（两边）+ig（驱动）→ 两边扯 = 模糊"], "逻辑": "分号后找主谓：主语“无数形态”+谓语 attest to（证明）。prove 类动词是正方向 → 前后同向：“无数形态”证明起源“多样”。不认识 attest to 时，用“X 证明了 Y”的常识框架去读。", "翻译": "生物的循环系统起源于彼此相隔极远的时代、又是在极广的条件下起源的；它们所呈现出的无数形态，证明了其起源的多样性。"}}, {"type": "teach", "title": "本讲小结", "ppt": ["7 种线索速查表"], "text": ["**速查表**：对比→相反（in contrast to）｜转折→相反（though, but, yet）｜解释→相同（冒号）｜因果→相同（because, thus）｜并列递进→相同（and, not only…but also）｜指代→相同（this, those, 这种）｜动词正反向→无逻辑词时看谓语方向（正连同义、负连反义）。", "**训练要求**：把本讲 6 道真题合上讲解独立重做一遍，每题 30 秒内说出信号词和对应方向，本讲才算吃透。下一讲起逐条深入+难题训练。", "**本讲词根词缀收获**：path（感情：sympathy/apathy）、mut（改变：mutant/mutation/permutation/immutable）、flu（流：superfluous/fluent/affluent）、rud（粗糙：rude/rudimentary）、uni（一：unit/unidimensional）、hetero（不同：heterogeneity）、perpetu（持续 相反的情况）；②**表示变化或差异的实意动词**（从A变成B、平衡A与B）；③**比较级**（more A than B）。这三种是课后复习的重中之重：考场上无论对比线索写得多隐晦，都要一眼认出来。"]}, {"type": "teach", "title": "② 隐晦线索一：正常对奇怪", "ppt": ["“让我感到奇怪的是…” = 填与正常情况相反"], "text": ["汉语原型：让我感到非常奇怪的是，我的胖同学小明吃饭吃得____（多/少）？正常应填“多”，但“奇怪”二字要求填**与正常相反**的情况→填“少”。即：胖子的正常特点全都不选，选胖子一般不具有的特点。", "“惊讶/奇怪”的本质=事实与预期不符。题目里出现 expect（预料）vs surprised（惊讶）、paradox（矛盾）、weird（奇怪）这类词时，就要意识到存在一组对比。"]}, {"type": "q", "tag": "真题", "title": "习题集 第6页 第2题（单空题）", "source": "隐晦线索：expect vs surprised", "pause": true, "stem": [{"t": "Because people expect theatre directors to be authoritarian, many were surprised that Clark was so ______."}], "vocab": [{"w": "authoritarian", "g": "专制分子、集权分子", "story": "来自无比熟悉的 authority（权威）：所有权威全掌握在我一人手里、一切都我说了算→专制。"}, {"w": "histrionic", "g": "夸张的、夸大的", "story": "基本义=戏剧的（像演戏一样）→引申=表情/动作/情绪夸张。**长得像 history 但和历史无关**，别被长相骗。"}, {"w": "megalomaniacal", "g": "自大的", "story": "mega=大（mega city 巨型城市北京上海）；mega+lo+mania（疯狂）→“觉得自己特别大”的疯病→自大。"}, {"w": "egalitarian", "g": "平等主义的、主张人人平等的", "story": "egal 就是 equal 的变形写法→主张人人 equal。"}, {"w": "indulgent", "g": "放纵的；懒惰的、没活力的", "story": ""}, {"w": "charismatic", "g": "有魅力的", "story": "来自 charisma（人格魅力、号召力）：一呼百应、一说话大家都支持你。"}], "options": {"A": "histrionic", "B": "megalomaniacal", "C": "egalitarian", "D": "indulgent", "E": "charismatic"}, "answer": "C", "explain": {"思路": "①找对应：expect（人们预料）vs surprised（惊讶）→事实与预料相反→空格填 expect 的反面；②猜空格：人们以为导演都“专制”→填“不专制”；③选：C egalitarian 人人平等=谁也不用听谁的，正好与专制相反。", "annot": "<span class='m2'>expect</span> 与 <span class='m2'>surprised</span> 构成一对隐晦对比 ⇒ <span class='m3'>人们预料（专制）</span> vs <span class='m4'>实际（不专制）=egalitarian</span>", "辨析": "A 夸张、B 自大都是“坏”但不与“专制”相反；D 懒惰没关系；E 魅力是褒义但方向不对。只有 C 与 authoritarian 构成准确反义。", "点拨": "expect/surprised 这对词就是隐晦对比的信号灯。认词，authoritarian 来自 authority，一秒拆穿。", "词根": ["**egalitarian**　egal（=equal 的变形）+itarian → 人人平等主义", "**histrionic**　histrio（演员）+nic → 像演戏一样 = 夸张的", "**megalomaniacal**　mega（大）+mania（疯）+cal → 觉得自己特别大的疯病 = 自大狂", "**indulgent**　in-（向）+dul（甜）+gent → 由着甜的来 = 纵容", "**charismatic**　charis（魅力/恩典）+matic → 有号召力的"], "逻辑": "抓一对隐性转折信号：expect（预料）vs surprised（惊讶）——惊讶=事实与预料不符 → 空格= expect 内容的反面=“不专制”。没有明显逻辑词时，动词本身的语义就藏着方向。", "翻译": "因为人们认为戏剧导演都是专制的，所以许多人对 Clark 如此主张人人平等感到惊讶。"}}, {"type": "q", "tag": "真题", "title": "习题集 第5页 第10题（六选二）", "source": "双线索：paradox + struck", "pause": true, "multi": true, "stem": [{"t": "An apparent paradox led the scientists to pursue their present line of research: they were struck by the fact that a single mathematical formula can be used to describe physical phenomena that appear to be so ______."}], "vocab": [{"w": "paradox", "g": "矛盾、自相矛盾的事物（GRE 考引申义）", "story": "四级义“悖论”是哲学术语（“我这句话是错的”——永远没法成立）；科学借用后指芝诺悖论那种“看上去自相矛盾难以解释的现象”。GRE 不用记悖论，只记“自相矛盾的情况”：小明很胖但吃得很少=paradox。**中性词，无褒贬**。"}, {"w": "be struck by", "g": "对…感到惊奇、震惊", "story": "strike 的熟词僻义=使惊奇（≠stuck 卡住）。它是否定拼写：struck 不是 stuck。"}, {"w": "appear to be", "g": "看上去（=seem to be）", "story": "appear 除了“出现”还常考“看上去”。"}, {"w": "rudimentary", "g": "基本的、粗糙的、不发达的", "story": "同根 rude（粗鲁的）：rud=粗糙。"}, {"w": "interdependent", "g": "互相依赖的", "story": "inter-=between（international=国家之间→国际）；dependent=依赖。"}, {"w": "interrelated", "g": "互相关联的", "story": "inter+related，字面即互相关联。"}, {"w": "heterogeneous", "g": "不同的、多样的", "story": "hetero-=不同。"}, {"w": "dissimilar", "g": "不同的、不相似的", "story": "字面=不 similar。"}], "options": {"A": "rudimentary", "B": "interdependent", "C": "interrelated", "D": "complex", "E": "heterogeneous", "F": "dissimilar"}, "answer": "EF", "explain": {"思路": "①找对应：paradox（矛盾）+ struck（惊奇）双线索都指向句尾必须存在“相反/不合常理”；②猜空格：“单一的数学公式”能描述什么现象最矛盾？→描述“不单一”的现象；③选：E heterogeneous + F dissimilar（都不同=不单一）。", "annot": "<span class='m2'>paradox</span> + <span class='m2'>struck by</span> ⇒ 必须有矛盾 ⇒ <span class='m3'>a single formula 单一公式</span> 描述 <span class='m4'>“不单一”的现象</span> → E+F。", "辨析": "B+C 是大坑：“互相依赖/互相关联”确实≠单一，单看同反好像也成立。但代入读句意：单一公式能描述“相关”现象，不值得惊讶；能描述**完全不相干**的现象才值得惊讶。**只看同反不够时，必须读句子意思**——这是本题最大教训。", "点拨": "将来做题必然遇到“同反判断剩下多个候选”的情况：别纠结，把候选代入读，选读起来最通顺合理的。paradox 记住 GRE 考“矛盾”即可。", "词根": ["**dissimilar**　dis-（不）+similar → 不相似", "**rudimentary**　rud（粗糙，rude 同根）+imentary → 基本/粗糙", "**interdependent**　inter（互相）+depend → 互相依赖", "**interrelated**　inter+related → 互相关联"], "逻辑": "两个信号都指向“必须有反差”：paradox（矛盾）+ struck（震惊）。再读句尾“单一的公式” → 最矛盾的事=它能描述“不单一”的现象 → 空格=不单一。同反判断出多解时，代入读句意定胜负（B/C 的“相关”不值得震惊）。", "翻译": "一个明显的悖论促使科学家沿着现在的研究方向追寻下去：使他们震惊的是，一个单一的数学公式竟然能描述那些看上去如此各不相同的物理现象。"}}, {"type": "q", "tag": "真题", "title": "习题集 第19页 第7题（六选二）", "source": "as…as 结构 + weird blessing", "pause": true, "multi": true, "stem": [{"t": "The uniquely human ability to rethink and revise our social arrangements is a weird blessing, allowing us to create systems that are as likely to ______ us as to liberate us."}], "vocab": [{"w": "unique", "g": "独特的、独一无二的", "story": "uni=one：世界上就你一个→独特。"}, {"w": "weird", "g": "奇怪的、古怪的", "story": ""}, {"w": "blessing", "g": "有益的东西、好事（熟词僻义）", "story": "本义=祝福、保佑（God bless you）：上帝保佑你→你走运→引申“对你有益的好事”。例：上考场一个词没背、全靠蒙还全蒙对=得到了大量 blessing。"}, {"w": "liberate", "g": "解放", "story": "来自 liberty（自由）：使你变自由。"}, {"w": "cheer", "g": "使高兴、使有活力", "story": "cheers 才是“干杯”。"}, {"w": "shackle", "g": "束缚", "story": "名词=拴犯人的脚镣；给犯人套脚镣→束缚。"}, {"w": "admonish", "g": "警告", "story": "词根 mon=warn（警告）；同根 monster 词源：最早 monster=警告本身（酒馆老板劝你“山上有老虎”），后来转指警告的具体对象（老虎）→怪物。"}, {"w": "edify", "g": "教育、启迪", "story": ""}, {"w": "stifle", "g": "束缚、抑制", "story": ""}, {"w": "enliven", "g": "使有活力、使活泼", "story": "live→让你活起来。"}], "options": {"A": "cheer", "B": "shackle", "C": "admonish", "D": "edify", "E": "stifle", "F": "enliven"}, "answer": "BE", "explain": {"思路": "①结构：as likely to X as to Y = 既 X 又 Y（Tom is as tall as he is fat=汤姆又高又胖）；②weird blessing 奇怪的好东西→“奇怪”必须有矛盾；③既束缚又解放才奇怪→填 liberate 的反义词→B shackle + E stifle。", "annot": "<span class='m3'>weird 奇怪</span> ⇒ 必须有矛盾 ⇒ <span class='m2'>as ___ as to liberate</span> 填 <span class='m4'>解放的反义（束缚）</span> → B+E。", "辨析": "错选 A+F：既“让我们高兴”又“解放我们”一点不奇怪，全是好事。weird 这个词就是逼你找反义。", "点拨": "as…as 别文艺翻译，直接译“既…又…”。blessing 这个“有益的东西”释义在 GRE 里常用。", "词根": ["**shackle**　名词本义=脚镣 → 束缚（动作与实物同源）", "**stifle**　本义=使窒息 → 抑制、束缚", "**admonish**　ad+mon（警告，monster 曾指“警告”）+ish → 警告", "**edify**　aedes（建筑）→ 建设心灵 → 教化", "**enliven**　en-（使）+live → 使活起来"], "逻辑": "先处理 as…as 结构=“既…又…”；再抓 weird（奇怪） → 奇怪必须有反差 → 既“束缚”又“解放”才奇怪 → 空格=解放的反义。漏看 weird 就会错选“高兴/有活力”。", "翻译": "人类独有的、重新思考和修改社会安排的能力是一种奇特的福祉——它让我们既能创造出束缚我们的制度，也能创造出解放我们的制度。"}}, {"type": "teach", "title": "③ 隐晦线索二：表示变化或差异的实意动词", "ppt": ["从A变成B / 平衡A与B → 前后相反", "实意动词=有实际意义的动词（非助动/情态/系动词）"], "text": ["汉语原型：小明经过努力从一个胖子变成____→瘦。题目里出现“变”“平衡”这类**表示变化或差异的实意动词**时，前后填相反。", "原理：填空题只有相同/相反两种考法（第1讲）。句子里既然已经“变化/不同”了，前后就**不可能是相同**→只剩相反一种可能。所以看到 become / balance / differ from / turn into…直接让两端取反。", "注意：找反义要**变通**——“相反”不一定是你第一反应的那个词，而是语义上能对立的概念（看下面的 12-3 题，“反对意见”的反面不是“同意”，而是“不允许反对”）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第15页 第1题（单空题）", "source": "变化动词 become", "pause": true, "stem": [{"t": "In the production process that is complex and often unpredictable, rules that start out discretely defined may become quite ______."}], "vocab": [{"w": "discrete", "g": "各自独立的、互不相连的", "story": "大学数学的离散数学=discrete mathematics。语文考“各自独立、互不相连”。"}, {"w": "confused", "g": "混乱的（熟词僻义！）", "story": "**本义=混乱，困惑才是引申义**——困惑就是脑子里的混乱。混乱=大家混在一起分不清谁是谁。"}, {"w": "perfunctory", "g": "敷衍的", "story": "做事非常不认真、敷衍了事。"}, {"w": "independent", "g": "独立的", "story": ""}, {"w": "overt", "g": "明显的", "story": ""}, {"w": "exacting", "g": "艰难的、要求高的（≠exact）", "story": "exact=确切的；exacting=要求别人一点都不差→对人要求极高；任务要求极高→做起来艰难。"}], "options": {"A": "confused", "B": "perfunctory", "C": "independent", "D": "overt", "E": "exacting"}, "answer": "A", "explain": {"思路": "①找对应：become（变得）=变化动词→前后相反；②猜空格：一开始 discretely defined（各自独立、分得清）→变到后来应填其反面“分不清”；③选：A confused 混乱=大家混在一起分不清。", "annot": "start out <span class='m3'>discretely defined 各自独立</span> → <span class='m2'>become</span>（变化=取反）→ <span class='m4'>confused 混到一起分不清</span>。", "辨析": "C independent 与 discrete 同义，方向反了。B 敷衍、D 明显、E 艰难都与“独立/不分”对不上。", "点拨": "confused 的“混乱”是本义、“困惑”是引申——熟词僻义的经典样本。句意补充：rules=分工，过程太复杂多变→开始各司其职，后来互相帮做、全混一起。", "词根": ["**perfunctory**　per（完全）+funct（履行）+ory → 仅履行完事 = 敷衍", "**overt**　over（上）+t → 摊在面上 = 明显的", "**exacting**　exact（苛求）+ing → 要求极高的"], "逻辑": "抓 become（变得） → 变化类动词=反向 → 空格= discretely defined 的反义。变化/差异类动词（become/turn/balance）都是隐晦的取反信号。", "翻译": "在一个复杂且常常不可预测的生产过程中，起初界限分明、各自独立的规则，后来可能变得相当混乱。"}}, {"type": "q", "tag": "真题", "title": "习题集 第12页 第3题（单空题）", "source": "差异动词 balance · 找反义要变通", "pause": true, "stem": [{"t": "The era’s examples of ______ that are cited by the author can be balanced in part by certain examples of dissent during the same period."}], "vocab": [{"w": "cite", "g": "引用（观点、事实支持自己的说法）", "story": ""}, {"w": "dissent", "g": "不同意见、反对意见", "story": "词根 sent/sens=feeling：consent（con-一起+感觉）=大家感觉一样→同意；sense=感觉；dis-=不同→感觉不同→异议。"}, {"w": "authoritarianism", "g": "专制、专制主义", "story": "authoritarian（专制分子）的主义形式。"}, {"w": "forbearance", "g": "克制", "story": "bear=忍受+for-加强→努力忍住不做某事。"}, {"w": "volatility", "g": "不稳定、容易恶化", "story": "vol=fly：volleyball 排球=始终在天上的球；化学 volatile=易挥发（容易飞起来）→不稳定。"}, {"w": "lucidity", "g": "清楚、易懂", "story": "说话写文章让人一听就懂。"}], "options": {"A": "diversity", "B": "authoritarianism", "C": "forbearance", "D": "volatility", "E": "lucidity"}, "answer": "B", "explain": {"思路": "①找对应：balance（平衡）=差异动词→前后相反→空格填 dissent（异议）的反义；②难点：选项里没有“同意”→找反义要变通：不允许任何反对意见存在=专制；③选：B authoritarianism。", "annot": "<span class='m3'>dissent 反对意见</span> ←<span class='m2'>balance 平衡</span>→ 空格=反对的反面 → <span class='m4'>不允许反对=专制</span> → B。", "辨析": "小明爸爸的例子：爸爸说今晚吃面条，小明不能说吃米饭——不允许任何反对意见存在→这就是专制。这就是 dissent 的反面。", "点拨": "找反义不一定在词典义上对立，而是**情境上对立**：“没有异议”的反面不是“同意”而是“不允许有异议”。balance 与 become 同属差异类动词。", "词根": ["**diversity**　di-（分开）+vers（转）→ 转得五花八门 = 多样", "**forbearance**　for（加强）+bear（忍受）→ 克制", "**volatility**　vol（飞，volleyball 排球=天上飞的球）+atility → 易挥发 = 不稳定", "**lucidity**　luc（光，elucidate 阐明同根）+idity → 清晰"], "逻辑": "抓 balance（平衡） → 天平两端必相反 → 空格= dissent（异议）的反义；选项里没有“同意” → 找反义要变通：不允许异议存在=专制。抽象词的反义常常不是词典反义词，而是情境反义。", "翻译": "作者所引用的那个时代的专制主义例子，可以在一定程度上被同一时期持不同意见的例子所平衡。"}}, {"type": "q", "tag": "真题", "title": "习题集 第48页 第2题（单空题）", "source": "词组 keep at bay", "pause": true, "stem": [{"t": "There is ______ in the director’s most recent films that keeps the melodramatic possibilities latent in a script safely at bay."}], "vocab": [{"w": "melodramatic", "g": "夸张的（情绪/举止）", "story": "来自 melodrama 情节剧：几百年前欧洲流行的舞台剧，特点=善恶分明+表演夸张（好人特好坏人特坏）；广义包含今天的抗日神剧——八路军上天入地、鬼子手一撕就碎。形容词=夸张。"}, {"w": "latent", "g": "隐藏的、潜伏的", "story": ""}, {"w": "keep at bay", "g": "抵抗、对抗、防止…产生影响", "story": "bay=海湾：打仗时把敌人拦在海上不让上岸→引申=抵御、压制。"}, {"w": "mawkishness", "g": "过度伤感、无病呻吟（贬义！）", "story": "英汉字典常只译“伤感”，但它是贬义：伤感得过分。典型=小时候的非主流 QQ 签名（“我们是糖，甜到忧伤”）。"}, {"w": "predictability", "g": "可预测性", "story": ""}, {"w": "austerity", "g": "严肃、严厉", "story": ""}, {"w": "ostentatiousness", "g": "炫耀、浮夸", "story": "举止很高调。"}, {"w": "emotiveness", "g": "激发感情", "story": "来自 emotion。"}], "options": {"A": "mawkishness", "B": "predictability", "C": "austerity", "D": "ostentatiousness", "E": "emotiveness"}, "answer": "C", "explain": {"思路": "①找对应：keeps…at bay（压制/抵抗）→前后相反；②猜空格：被压制的是 melodramatic（夸张）→空格填“不夸张”；③选：C austerity 严肃=情绪不夸张。", "annot": "<span class='m2'>keeps at bay 压制</span> ⇒ 空格与 <span class='m3'>melodramatic 夸张</span> 相反 → <span class='m4'>austerity 严肃</span>。", "辨析": "A 伤感（与夸张不构成反义）、D 炫耀（≈夸张的同向）、E 激发感情（同向）。B 可预测无关。", "点拨": "**词组和单词要一视同仁地背**——这题不会做的人全是没背过 keep at bay。考试不告诉你考哪个。", "词根": ["**austerity**　auster（严厉）+ity → 严肃/紧缩", "**mawkishness**　mawk（蛆，变质食物味）+ishness → 让人反胃的多愁善感", "**ostentatiousness**　ostent（展示）+atiousness → 炫耀浮夸"], "逻辑": "抓词组 keep…at bay（压制） → 前后相反 → 空格= melodramatic（夸张）的反义=严肃克制。词组不背，这道题就无从下手——单词和词组要一视同仁地背。", "翻译": "这位导演最近的电影里有一种严肃克制的东西，它把剧本中潜在的情节剧式夸张可能稳稳地压住了。"}}, {"type": "teach", "title": "④ 隐晦线索三：比较级 more A than B", "ppt": ["填空里的比较级=对比=相反（≠日常的递进）", "more A than B = 是A而不是B"], "text": ["日常比较级=递进：小明胖，小红**更**胖——俩人都胖。但填空题里比较级**永远是对比、永远引导相反**：胖子比____跑得慢→瘦子；胖子比____吃得少→还是瘦子。“一个比另一个更X”强调的是两者**不一样**→不一样就不能相同→只剩相反。", "翻译纪律：more A than B 不要文艺地译“相比于B而言更A”（考场上可能反应不过来方向），**简单译成“是A而不是B”**— 填空里不是这么考的，咱们GRE填空里，你要注意比较级，在填空里永远是对比关系，填空题里说比较级，它永远是想强调两个东西相反。有同学就说比较级，为啥可以强调两个东西，相反我给你举个汉语的例子，你感受一下，比如我说胖子比空格儿跑得慢。那空格你应该怎么填空格？当然你就应该填瘦子。再比如我说胖子比空格儿跳的矮，那空格儿你应该怎么填？还是填瘦子？再比如胖子比空格吃的多，那空格怎么填？还是填瘦子？总之什么意思啊？就是你做题的时候，但凡是看到一个比另一个更怎么样？这种表达，那它前面儿那个一个和另外一个，这俩必须得相反。为什么它们俩要相反呢？你想啊，它题目说一个比另外一个更怎么样？它想强调的是什么？它想强调的就是这个一个和那个另外一个，它们俩是不一样的。于是，项目一开始说填空题要么就相同，要么就相反的，它俩都已经不一样了，它就不可能相同，所以它们俩就只剩一种可能性，就是相反。所以在填空题里比较级，它永远是对比关系，它引导的永远是相反的考法。而具体到我们题目里边，我们考比较级，特别喜欢考这样一个结构，叫做more a than b。more a than b这个结构按照字面意思来翻译，怎么翻译呢？叫做相比于b而言，它更加的a，但实际考试的时候不建议你这样翻译，实际考试的时候建议你把它翻译的尽可能简单一点儿，怎么翻译叫做是a而不是b？你平时背单词也好，背词组也好，你目的是什么？就是为了让自己在考场上能一下就反应过来。它具体表示的是个什么意思？所以你在翻译的时候没有必要去追求翻译的文艺，追求翻译层词藻的华丽，你翻译应该尽可能简单。于是你像这个more a than b，你如果翻译的时候刻意追求翻译的准确，非要把它翻译成相比于b而言，它更加的a。到了考场上，你一紧张，说不准你就看不出来它到底是相同还是相反的。所以这个词你就简单一点儿，翻译就把它记成是a而不是b，那这样在考场上无论如何你都可以一眼都看得出来a和b，它们俩就是对比关系a和b，你要填就填相反。我们来看一个相关的例题。126页的第四题。第四题第二行最后有一个难单词叫做orthodox orthodox，意思叫做正统的。你如果说不清楚正统是什么意思，你也可以把它记成传统的。所谓正统，指的就是传统，并且正宗就是它自古以来就有自古以来一直传下来的，并且大家都认为这个东西是对的，这个东西是最正确的，所以这个就可以叫正统。所以简单来说，其实就是传统并且正宗。接下来我们说选项。首先a选项，这个obscure，这是一个托福高频词，背过托福单词的同学对这个词应该比较熟悉，托福里边儿obscure这个词的意思叫模糊，黯淡或者是不清楚的。咱们GRE考这个词考的意思不太一样，我们考试考的意思叫晦涩或者是难懂的。晦涩难懂，叫obscure。这个意思也不难想象，因为你想它本身叫模糊暗淡不清楚嘛，于是你如果写文章写的非常的模糊，非常的不清楚，就没有人能看懂，所以后来它的引申义就叫做灰色，或者是难懂。b选项detail的就叫详细或者是有细节。c选项familiar熟悉d选项restrictive叫做限制的。然后e选项这个词需要注意一下revisionist这个词，你如果查字典的话，那么字典上的翻译一般是告诉你叫修正主义的。但是很多同学你可能说不出来什么叫修正主义，你如果说不出来的话，那么你记单词意思你就记得简单一点儿，记得自己能理解一点儿。所谓修正主义，指的是主张修改普遍接受的东西。主张修改普遍接受的东西。revisionist这个词，它来自于动词revise意思叫做修改或者是修正你后边儿，如果再加上一个ism，把它上升到主义的水平，就表示你过分的强调修改和修正。一个东西大家都认可，大家都觉得没问题，但是你就非要去修改它，那这个就可以叫修正主义，所以修正主义简单一点儿来说就叫主张修改，普遍被接受的东西。最后f选项那个animatic意思叫神秘难懂的，或者叫迷一样的都可以。像谜一样非常的难懂，叫做enigmatic。这个词的名词形式enigma，它的意思就叫做迷或者叫迷一样的事物。你就比如像有些同学，你可能看过一个电影，叫做模仿游戏，模仿游戏讲的就是计算机的一个创始人叫阿兰图灵。阿兰图灵，他本身是一个数学家，他在二战时期就帮英国政府去破译德国海军的通讯密码，你如果看过那个电影，你可能就会有印象。二战时候，德国海军有一个特别厉害的密码机。经过那个密码机加密的信息很难破译。而那个密码集，当时德国人给它起什么名字呢？就叫the enigma machine，因为enigma自面意思就叫谜，所以密码集的目的就是给别人制造谜团，所以的话英文就管它叫enigma machine字面，意思就叫谜集器。大家看这道题应该选哪两个选项？我们一起来看这道题目。这道题目先说相对好做一点的，第二个空。我们直接看冒号之后，第二行后边它说in identifying causes，在指出原因的过程中，it is more orthodox than空格。后边儿出现的more a than b这个结构叫是a而不是BA和b，两者显然是相反，所以空格怎么填空格你只需要找一个orthodox的反义词就可以了。所以第二空儿你看了三个选项，发现哪一个可以跟正统传统构成相反，当然就是那个e选项修正主义或者叫主张修改普遍接受的东西。因为你会发现orthodox，其实说白了就是传统而revisionist，其实说白了就是反传统，主张修改传统，所以它们两者就是相反。所以第二个空格就选一个一。接下来再说第一个框。这道题第一个空两种解法，你可以看前半句那个despite despite这是一个转折，它前后是相反，这可以帮你做题。你靠despite来做的话，它开头说，despite the fact that the book promises a complete rethinking of the factors contributing to the conflict。就是说，虽然这本书它承诺对于这个冲突背后的这些因素，它要做一个重新思考。但是呢，the picture that the book paints is空格，这本书它所描绘的图景是怎么样的？于是，根据虽然，但是前后相反，我们就知道它前面儿说了是要重新思考，那转折之后应该说它有没有重新思考，显然是没有重新思考。所以转折之后，我们就说这本书写的东西是新东西还是老东西还是老东西就可以了？所以空格一我们就找一个老东西，那哪一个是老东西最好的，当然就是c选项，因为你非常非常熟悉，之前早就听过一万遍的说法，这显然就不是新的说法。所以第一个空选的就是c。当然，除此以外，这道题还有一种解法，就是我们注意到第二行中间，它有一个冒号，冒号前后是相同。冒号儿后边儿，我们刚刚已经看过了，它后边儿说这本儿书在指出原因的时候有什么特点，就是它非常非常的传统，所以空格儿一你也可以说这本儿书它描绘的内容怎么样也是非常的传统就可以了。所以说白了，这本儿书里写的还是旧的东西，还是没有新发现，所以最后答案选的还是c选项。"}, {"id": 4, "title": "第4讲 · 对比关系（下）：时间对比", "intro": "对比关系的最后一种：时间对比——题目给出两个明确不同的时间点，两个时间的情况填相反。听起来简单，但真题里它会和各种结构叠在一起：双重否定（负负得正）、until、双空中的 despite 干扰、破折号插入语。本讲四道题把这些花样演全。", "cards": [{"type": "teach", "title": "① 时间对比基本原理", "ppt": ["时间不同，情况相反", "after / once / in the past / until / no longer…"], "text": ["题目里出现两个明确的时间点（过去 vs 现在、之前 vs 之后）→两个时间的情况**相反**。原型：小明过去是胖子，现在是____→瘦子。", "**特别注意双重否定=负负得正**：“once（曾经，取反一次）+ no longer（不再，再取反一次）”=前后同向。看到时间词+否定词的组合，先数一数取了几次反。"]}, {"type": "q", "tag": "真题", "title": "习题集 第74页 第10题（六选二）", "source": "after 时间对比", "pause": true, "multi": true, "stem": [{"t": "After many years of feeling ______ by his senior managers, Clark was becoming hopeful of advancement."}], "vocab": [{"w": "advancement", "g": "晋升、升官", "story": ""}, {"w": "vilify", "g": "辱骂、激烈批评", "story": ""}, {"w": "stymie", "g": "妨碍、阻挠", "story": ""}, {"w": "hinder", "g": "妨碍、阻碍、阻挠", "story": "hind≠hide：hind=后边（托福 hind legs 后腿）→behind 也这么来；hinder 字面=拖你后腿、往后拽。"}, {"w": "aggrieve", "g": "使不满、使愤愤不平", "story": "来自四级 grief（悲伤、难过）：aggrieve=让别人不高兴。"}, {"w": "circumvent", "g": "回避、躲避、避免", "story": "circ=圆圈+ven/vent=走（advent 到来=走过来；prevent 提前走=先发制人→预防；avenue 马路=走路的地方）→绕着走→回避。"}, {"w": "overlook", "g": "忽视、忽略", "story": ""}], "options": {"A": "vilify", "B": "stymie", "C": "hinder", "D": "aggrieve", "E": "circumvent", "F": "overlook"}, "answer": "BC", "explain": {"思路": "①找对应：after（…之后）=时间词：现在 hopeful of advancement（有望晋升）→之前那些年相反=没希望晋升；②选两个“让晋升没戏”的：B stymie + C hinder（都=阻碍）。", "annot": "<span class='m2'>After 时间对比</span>：<span class='m4'>现在有望晋升</span> → <span class='m3'>多年被上级“使坏”</span> → B+C。", "辨析": "E+F 是坑：circumvent/overlook 代入=“上级一直躲着他/忽视他”。代入常识读句意：员工上级关系不好，该是员工躲上级，哪有上级躲员工的？——不合常理，排除。同反判断有多个候选时，**代入读句意**定胜负。", "点拨": "ven/vent=走 这个词根一串：advent/prevent/avenue/circumvent，打包记。", "词根": ["**stymie**　源自高尔夫术语：球被障碍挡住 → 阻碍", "**hinder**　hind（后，hind legs 后腿）→ 拖后腿 = 阻碍", "**vilify**　vilis（卑贱）+ify → 骂到卑贱 = 辱骂", "**aggrieve**　ag-（使）+grief（悲伤）→ 使愤愤不平", "**circumvent**　circum（绕圈）+vent（走）→ 绕着走 = 回避", "**overlook**　over（从上）+look → 俯瞰 → 忽视"], "逻辑": "抓 after（在…之后） → 时间对比 → 现在 hopeful（有望晋升） → 过去多年相反=没希望 → 空格=阻挠晋升的词。时间词一出现，前后必相反。", "翻译": "在多年感到被上级经理阻挠之后，Clark 开始有希望晋升了。"}}, {"type": "q", "tag": "真题", "title": "习题集 第72页 第1题（单空题）", "source": "once + no longer 负负得正", "pause": true, "stem": [{"t": "What once seemed a quixotic vision — no matter how impractical the original scheme, critics concede — no longer seems quite so ______."}], "vocab": [{"w": "quixotic", "g": "不切实际的", "story": "来自西班牙语人名 Don Quixote=堂吉诃德——他最大的特点就是不切实际，名字变成形容词。"}, {"w": "impracticable", "g": "不切实际的", "story": "practical（可行的）→im- 否定=不可行。"}, {"w": "prescient", "g": "有先见之明的、预言的", "story": "sci=know（science 字面=knowledge 知道；conscious 有意识=知道自己在干嘛）；pre-提前知道→先见之明。"}, {"w": "banal", "g": "老套的、陈腐的、毫无新意的", "story": "说话写作用词老掉牙。"}, {"w": "viable", "g": "可行的", "story": "生物学术语：种子能正常生长发育=viable；煮熟的种子再浇水不发芽=non-viable→引申：计划项目可正常发展=可行。"}, {"w": "beneficial", "g": "有益的", "story": ""}], "options": {"A": "impracticable", "B": "prescient", "C": "banal", "D": "viable", "E": "beneficial"}, "answer": "A", "explain": {"思路": "①once（曾经）=时间对比取反一次；②后半句 no longer（不再）=再取反一次；③负负得正→空格填 quixotic 的同义；④选 A impracticable（两破折号之间的插入语“不管原方案多不实用”是白给的同义提示）。", "annot": "<span class='m2'>once 取反①</span> + <span class='m2'>no longer 取反②</span> = 负负得正 ⇒ 空格 = <span class='m3'>quixotic 不切实际</span> 的同义 → A。", "辨析": "B 有先见之明、C 老套、D 可行、E 有益，都与 quixotic 不同义。破折号间 impractical 直接剧透。", "点拨": "时间词和否定词同时出现时，先数取反次数：奇数次反→填反义；偶数次反→填同义。", "词根": ["**prescient**　pre（前）+sci（知道，science 同根）+ent → 有先见之明", "**banal**　ban（陈规/公告）+al → 老掉牙 = 陈腐", "**viable**　vita（生命）+able → 能活 = 可行"], "逻辑": "数取反次数：once（曾经）反一次，no longer（不再）再反一次 → 负负得正 → 空格= quixotic 的同义词。时间词+否定词叠加时，先数清反转次数再填。", "翻译": "那个一度看似不切实际的愿景——不管原方案多么不实用，批评者也都承认——如今似乎不再那么不切实际了。"}}, {"type": "q", "tag": "真题", "title": "习题集 第127页 第7题（六选二）", "source": "until = before 时间对比", "pause": true, "multi": true, "stem": [{"t": "Some kinds of deadly bacteria — including those that cause tetanus, tuberculosis, and botulism — remain ______ until something triggers their insidious activity."}], "vocab": [{"w": "trigger", "g": "引发、触发", "story": "名词=枪的扳机（pull the trigger 扣扳机）→一扣就响→引发。"}, {"w": "insidious", "g": "有害的", "story": ""}, {"w": "innocuous", "g": "无害的", "story": "词根 noc=harm：innocent 无辜的=没有伤害过别人（innocuous 与 innocent 字面都是 harmless，只是 innocent 后来转指无辜/天真）。"}, {"w": "anomalous", "g": "异常的、反常的", "story": ""}, {"w": "aberrant", "g": "异常的、反常的", "story": "err=漫游：error 字面=到处乱窜→偏离正轨=错误；ab- away+errant 乱窜没影→偏离常规=反常。"}, {"w": "efficacious", "g": "有效的", "story": "=effective 的变形写法（通假字）。词根 fic/fect=do/make：fact=做出来的事=事实；manufacture=用手做；effect=做出来的东西=效果。"}, {"w": "undetectable", "g": "无法探测的、无法发现的", "story": "detect=发现、觉察。"}], "options": {"A": "harmless", "B": "innocuous", "C": "anomalous", "D": "aberrant", "E": "efficacious", "F": "undetectable"}, "answer": "AB", "explain": {"思路": "①找对应：until（直到…才）=before：被触发有害活动**之前**如何→与 insidious 相反=无害；②选两个无害：A harmless + B innocuous。", "annot": "<span class='m2'>until 触发有害</span> ⇒ 之前 = <span class='m4'>无害</span> → A+B（until=bofore，也是时间对比词）。", "辨析": "C+D 异常、E 有效、F 无法发现都不与 insidious 对立。破折号里一堆疾病名是吓唬你的专业知识，不用认识。", "点拨": "until 不是逻辑关系词里的显眼包，但“直到”本质上就是 before。专业名词（破伤风/肺结核/肉毒中毒）一律跳过。", "词根": ["**harmless**　harm（伤害）+less → 无害", "**innocuous**　in-（不）+noc（伤害，innocent 无辜同根）+uous → 无害", "**anomalous**　a-（不）+nomal（规范 norm）→ 反常", "**aberrant**　ab-（离）+err（漫游，error 同源）→ 偏离正轨", "**efficacious**　ef-（出）+fic（做，fact 同源）+acious → 做得出效果 = 有效", "**undetectable**　un+detect（察觉）+able → 无法发现"], "逻辑": "抓 until（直到…才） → 时间分界线：被触发“有害”之前=“无害”。破折号里一串疾病名是纯干扰，全部跳过。专业名词永远不可能是考点。", "翻译": "某些致命的细菌——包括导致破伤风、肺结核和肉毒中毒的细菌——在某种东西触发其有害活动之前，一直保持无害。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第42页 第4题（双空题）", "source": "despite 帮不上忙，时间对比救场", "pause": true, "dual": true, "stem": [{"t": "The museum’s compelling new architectural exhibition looks at 11 projects that have had major ______ impacts — despite modest budgets — as part of ______ in the museum’s architecture and design department, which in the past has championed architecture’s artistic value over its real-world consequences."}], "vocab": [{"w": "compelling", "g": "迷人的、极有说服力的", "story": "来自 compel（强迫）：一本 compelling book=“强迫”你读的书——汉语说“拿起来就放不下”；a compelling example=由不得你不信的例子。写作里形容理由/论证=极有说服力。"}, {"w": "modest budget", "g": "有限的预算（熟词僻义）", "story": "modest 本义=有限、适度→引申=谦虚（举止上的不张扬）。形容预算=有限。"}, {"w": "champion（动词）", "g": "支持、捍卫", "story": "名词=冠军。"}, {"w": "consequence", "g": "意义、重要性、重大影响（熟词僻义）", "story": "常用义=结果后果；但 consequence 比 result 语义重——专指重大、严重、通常负面的结果（转笔掉楼下没事=result；插到校长头上=there will be consequences）→引申=重大意义/影响。"}, {"w": "aesthetic", "g": "美学的、审美的", "story": ""}, {"w": "pragmatic", "g": "务实的、讲究实际的", "story": "设定目标时考虑现实：一天背1000词=不务实；一天背100词=务实。**只能形容“目标/做法”，世上不存在“务实的结果”**。"}, {"w": "pragmatism", "g": "务实（pragmatic 的名词）", "story": ""}, {"w": "philosophy", "g": "思想、指导思想（熟词僻义）", "story": "除了哲学，还=指导思想（人生哲学=life philosophy）。"}, {"w": "social / emphasis", "g": "社会的 / 强调", "story": ""}], "options": {"i": {"A": "aesthetic", "B": "pragmatic", "C": "social"}, "ii": {"D": "emphasis", "E": "pragmatism", "F": "philosophy"}}, "answer": "① 本讲导览", "ppt": ["转折本身简单，难在句子复杂 + 选项辨析"], "text": ["转折方向好判断（though/but/yet/despite → 相反），做错的同学往往不是方向错，而是：①句子结构复杂，没看出“谁跟谁构成相反”；②六选二里有三个甚至四个选项单看都对，不知道选哪两个；③近义词之间微小区别（声称 vs 承认）。本讲逐个解决。"]}, {"type": "q", "tag": "真题", "title": "习题集 第9页 第2题（单空题）", "source": "转折 + 指代（writer=novelists）", "pause": true, "stem": [{"t": "Some novelists immodestly idealize and exaggerate the significance of their work, but others ______ to exalt the role of the writer, questioning a transcendent view of art."}], "vocab": [{"w": "immodest", "g": "不谦虚的", "story": "modest（谦虚的）+im-否定。"}, {"w": "idealize", "g": "理想化、美化", "story": "来自 ideal（理想）：本身没那么好，说/想得比实际更美好。"}, {"w": "exaggerate", "g": "夸张、夸大", "story": ""}, {"w": "exalt", "g": "赞美、抬高某人的地位", "story": "词根 alt=high：altitude 海拔高度；exalt=使它变高→抬高地位。"}, {"w": "transcendent", "g": "超越现实的、超越实际的", "story": "transcend=超越、超过。"}, {"w": "aver", "g": "断言（=claim）", "story": ""}, {"w": "decline", "g": "减少下降；衰退衰亡；拒绝谢绝（熟词僻义）", "story": "两考法：①健康每况愈下 his health is declining；《罗马帝国衰亡史》the decline and fall of the Roman Empire。②拒绝=婉拒：decline an offer 婉拒录取通知。"}, {"w": "seek to do", "g": "试图做某事（=try to do）", "story": "**seek 后接不定式=试图**，不是“寻找”！寻找是 seek+名词。"}, {"w": "feign", "g": "假装", "story": "假装做某事、假装具有某特点。"}, {"w": "avow", "g": "坚称", "story": "vow=发誓：avow=我发誓说的是真话→坚称。"}], "options": {"A": "aver", "B": "decline", "C": "seek", "D": "feign", "E": "avow"}, "answer": "B", "explain": {"思路": "①找对应：some novelists… but others…=一些 vs 另一些→相反；②关键一步：the writer 指的就是 novelist 自己（作者）；③谦虚的人怎么“抬高自己”？→不愿意抬高→decline to exalt 拒绝抬高。", "annot": "<span class='m3'>Some novelists 不谦虚（美化夸大自己）</span> → <span class='m2'>but</span> → <span class='m4'>others 谦虚 → 拒绝抬高自己</span>（<span class='m3'>the writer=novelists 本人</span>）。", "辨析": "decline to do=拒绝做；seek to do 如果当“寻找”就掉坑了——seek to do=试图，但句子语义是“不愿意”。", "点拨": "**看出 writer=novelist 这步指代，题就活了**。长句里代词指谁，永远先搞清楚。", "词根": ["**aver**　a-（向）+ver（真，very 同源）→ 断言", "**seek**　seek 寻求；seek to do=试图做（≠寻找）", "**feign**　本义=捏造、假装", "**avow**　a（加强）+vow（发誓）→ 拍着胸脯坚称"], "逻辑": "先抓 some…but others → 两类人相反 → 前类不谦虚，后类谦虚；再看出 the writer 指的是小说家本人（指代！） → 谦虚的人不愿抬高自己 → 空格=拒绝。指代关系是这道题的灵魂。", "翻译": "一些小说家毫不谦虚地美化和夸大自己作品的意义，另一些小说家却拒绝抬高作家的地位，质疑艺术高于现实的观点。"}}, {"type": "teach", "title": "② 六选二进阶铁律", "ppt": ["单看有 3-4 个都对时 → 选“意思最接近”的两个"], "text": ["六选二不是“选两个对的”就完事——正确两项必须**互为近义词**。出题人经常设 3 个甚至 4 个单看都成立的选项，此时再用“哪两个意思最接近”收网。", "另外记住：**转折前后只需一处相反，转折即成立**。转折后写了一堆形容词（又冷又暗又未知），空格只要与其中任何一个构成相反即可，其他的都是干扰。"]}, {"type": "q", "tag": "真题", "title": "习题集 第14页 第10题（六选二）", "source": "转折只须一处相反 + 六选二铁律", "pause": true, "multi": true, "stem": [{"t": "Titan, Saturn’s largest moon, looks strikingly ______, even though it is a cold, dimly lit world made of unknown materials."}], "vocab": [{"w": "dimly lit", "g": "昏暗的（灯光不明亮）", "story": "dim=昏暗；lit=light 的过去分词（点亮）。"}, {"w": "habitable", "g": "宜居的、适宜居住的", "story": "habit 词根=住：habitat=栖息地、居住地；habitable=可以住的。"}, {"w": "forbidding（形容词）", "g": "艰难的、令人望而生畏的", "story": "动词 forbid=禁止→任务难到“禁止你去做”=一看就不想干→令人望而生畏。"}, {"w": "placid", "g": "平静的", "story": "近义词=peaceful。"}, {"w": "daunting", "g": "艰难的、令人望而生畏的", "story": "来自 daunt=使害怕、吓倒：一看就被吓倒。"}, {"w": "recognizable", "g": "可辨认的、认得出的", "story": ""}], "options": {"A": "habitable", "B": "familiar", "C": "forbidding", "D": "placid", "E": "daunting", "F": "recognizable"}, "answer": "BF", "explain": {"思路": "①even though 转折→空格与“cold/dimly/unknown”相反；②这仨词任何一个的反义都成立（温暖/明亮/已知都可以）——转折只需一处相反；③六选二铁律：B familiar 和 F recognizable 都=known，意思最接近且都与 unknown 相反。", "annot": "even though <span class='m3'>cold 冷 / dimly 暗 / unknown 未知</span> ⇒ 空格与任何一个相反即可成立。要“known”：<span class='m4'>familiar=recognizable</span> → B+F。", "辨析": "A habitable 单看也对（不冷=宜居），但选项里没有第二个“宜居”——六选二必须意思相近的一对。C+E 互为同义但都是“艰难”，与转折后同向。", "点拨": "这就是六选二铁律的实战样本：先靠转折圈出方向，再靠“意思最接近的一对”定案。", "词根": ["**habitable**　habit（居住）+able → 可住的", "**forbidding**　forbid（禁止）+ing → 让人望而却步 = 艰难", "**placid**　plac（平静 please 同源）+id → 平静", "**daunting**　daunt（恐吓）+ing → 令人畏惧"], "逻辑": "even though → 前后相反；转折后给了三个贬义特征（冷/暗/未知），空格只要与其中任何之一相反，转折就成立 → 选与 unknown 相反的“可辨认”。注意：转折只需一处相反，别被三个特征唬住。", "翻译": "土星的卫星泰坦看上去惊人地眼熟——尽管它是一个由未知物质构成的、寒冷而昏暗的世界。"}}, {"type": "q", "tag": "真题", "title": "习题集 第16页 第7题（六选二）", "source": "近义词辨析：声称 vs 承认", "pause": true, "multi": true, "stem": [{"t": "Although its director ______ that the movie uses a documentary approach in portraying the famous sit-down strike, in practice its characters are heavily fictionalized and fall into familiar Hollywood types."}], "vocab": [{"w": "documentary", "g": "纪录片；纪实的", "story": ""}, {"w": "approach", "g": "方法（熟词僻义）", "story": "GRE 填空阅读都爱考“方法”：处理某问题的方法。"}, {"w": "portray", "g": "描绘、描述、表现", "story": ""}, {"w": "sit-down strike", "g": "静坐示威", "story": "strike 名词=罢工罢课示威。不认识不影响解题。"}, {"w": "in practice", "g": "实际上", "story": "practice 常考“实践、实际上”。"}, {"w": "fictionalize", "g": "虚构", "story": "fiction≠小说！fiction=虚构作品（词根 fic=do/make：fiction=made up 编出来的）；novel 才是小说； nonfiction=纪实文学。大书店分类 nonfiction=非虚构。"}, {"w": "assert", "g": "断言、声称", "story": "坚持说某事。"}, {"w": "concede", "g": "承认（=admit）", "story": ""}, {"w": "dispute", "g": "质疑", "story": "词根 put=think：compute 计算=动脑筋；computer 计算机；reputation 名声=别人如何想你；dispute=想法不一样→争端。"}, {"w": "grant", "g": "给予；承认（熟词僻义）", "story": "grant a loan 放贷（给予）；GRE 常考“承认”。"}, {"w": "maintain", "g": "保留维持；声称、主张（熟词僻义）", "story": "本义=保持→引申=持有某观点→声称。"}], "options": {"A": "assert", "B": "concede", "C": "guarantee", "D": "dispute", "E": "grant", "F": "maintain"}, "answer": "AF", "explain": {"思路": "①in practice 实际上=转折信号：实际严重虚构→导演“嘴上”说是纪录片→空格填“声称”；②选一对近义的“声称”：A assert + F maintain。", "annot": "<span class='m3'>in practice 实际虚构</span> → 导演嘴上<span class='m4'>“声称”是纪录片</span> → assert / maintain。", "辨析": "B concede / E grant（承认）为什么不行？辨析：**声称说的内容可真可假；承认后面必须接事实**。“我承认小明是胖子”→小明必是胖子。题目明确导演说的是假话→只能说 assert，不能“承认”。", "点拨": "这是典型的近义词辨析考点。判断标准：后面接的内容是可真可假（assert/maintain），还是必须是事实（concede/grant/admit）。", "词根": ["**assert**　as（加强）+sert（断定）→ 断言（可真可假）", "**maintain**　main（手）+tain（持）→ 持有观点 = 声称", "**concede**　con（一起）+ced（走）→ 一起走=让步 → 承认"], "逻辑": "抓 in practice（实际上） → 嘴上说的 vs 实际做的相反 → 实际虚构 → 嘴上=“声称”。辨析点：声称（assert）可真可假，承认（concede）必须属实——题目说他说了假话，只能选声称。", "翻译": "尽管导演声称这部电影在描绘那场著名的静坐示威时采用了纪实手法，但实际上它的角色被严重虚构化，落入了典型的好莱坞套路。"}}, {"type": "q", "tag": "真题", "title": "习题集 第16页 第8题（六选二）", "source": "despite 转折 + argument=论证", "pause": true, "multi": true, "stem": [{"t": "Studying the ancient Greek astronomers, Copernicus realized that, despite the intrinsic beauty of many of their arguments, the ancients often made claims that ______ logic."}], "vocab": [{"w": "astronomer", "g": "天文学家（≠宇航员）", "story": "astronomy 天文学；宇航员=astronaut。"}, {"w": "argument", "g": "论证（GRE 常考）", "story": "不是“吵架”：举一堆理由推出结论=论证。写作 ARGUMENT 题全名 analyze an argument=分析一个论证。"}, {"w": "the ancients", "g": "古人", "story": "ancient=古代的。"}, {"w": "refute", "g": "反驳", "story": "来自 refuse 的变形：拒绝/反驳，意思相近。"}, {"w": "sway", "g": "影响（熟词僻义）", "story": "本义=摇摆摇晃→引申=动摇：sway public opinion 动摇大众看法→影响。"}, {"w": "defy", "g": "不予理会、不予考虑", "story": "对…不屑一顾。"}, {"w": "disregard", "g": "不予理会、不予考虑", "story": "与 defy 近义，本题一对答案。"}], "options": {"A": "refute", "B": "question", "C": "influence", "D": "sway", "E": "defy", "F": "disregard"}, "answer": "EF", "explain": {"思路": "①despite 转折：论证虽美→但 claims 对 logic 如何=没逻辑方向；②选一对“完全不讲逻辑”：E defy + F disregard（都不予理会逻辑）。", "annot": "<span class='m2'>despite</span> <span class='m3'>intrinsic beauty 论证很美</span> → <span class='m4'>claims 对 logic 不予理会</span>（=没逻辑）→ E+F。", "辨析": "A+B 是经典错选：“反驳逻辑/质疑逻辑”≠“没有逻辑”。反例：你写 ARGUMENT 文就是在反驳质疑原作者的逻辑——但想拿高分你必须写得比他**更有逻辑**。", "点拨": "反驳/质疑一个东西，不等于那个东西本身没有。动作方向≠属性，这类辨析在六选二里很常见。", "词根": ["**defy**　de（反）+fy（信）→ 反向对着干 = 公然违抗", "**disregard**　dis-（不）+regard（看）→ 不予理会", "**refute**　re（回）+fut（倒）→ 驳倒", "**sway**　摇摆 → 动摇 → 影响"], "逻辑": "despite → 前后相反；前半“美”（褒） → 后半对 logic 而言必贬 → 没逻辑。小坑：A/B“反驳/质疑逻辑”不等于“没逻辑”——你写 ARGUMENT 文就是在反驳别人逻辑，但你写得比他更有逻辑。", "翻译": "哥白尼在研究古希腊天文学家时意识到：尽管他们的许多论证本身具有内在的美感，但古人常常提出完全不讲逻辑的主张。"}}, {"type": "q", "tag": "真题", "title": "习题集 第30页 第3题（双空六选二）", "source": "although + whereas 双转折", "pause": true, "dual": true, "stem": [{"t": "Although trains may use energy more ______ than do automobiles, the latter move only when they contain at least one occupant, whereas railway carriages spend a considerable amount of time running up and down tracks, ______ or nearly so."}], "vocab": [{"w": "the latter", "g": "后者", "story": "the former 前者 / the latter 后者。"}, {"w": "occupant", "g": "乘坐者、乘客", "story": "来自 occupy（占用）：占用了车的人→乘客；说房屋时是居住者。occupation 职业=占用你时间精力的事。"}, {"w": "whereas", "g": "虽然、但是（=while）", "story": "转折词。"}, {"w": "considerable", "g": "大量的、可观的", "story": "consider=考虑→值得考虑的量→大量。"}, {"w": "lavishly", "g": "浪费地、奢侈地", "story": "花钱大手大脚。"}, {"w": "routinely（副词）", "g": "普通地、平常地、司空见惯地", "story": "routine 名词=惯例（每天做的事）；形容词 GRE 更爱考：每天都做→司空见惯。"}, {"w": "vacant", "g": "空的、空闲的、空缺的", "story": "词根 vac=空：vacuum 真空；vacation 假期=没被占用的时间。"}, {"w": "unimpeded", "g": "不受阻碍的、不受限制的", "story": "词根 ped=foot：biped 两足动物；centipede 蜈蚣（100 只脚）；impede=插一只脚进去→妨碍；unimpeded 取反。"}, {"w": "overloaded", "g": "超载的", "story": ""}], "options": {"i": {"A": "lavishly", "B": "efficiently", "C": "routinely"}, "ii": {"D": "vacant", "E": "unimpeded", "F": "overloaded"}}, "answer": "iB,iiD", "explain": {"思路": "空(ii)先行：whereas 转折——汽车至少坐 1 人才动→火车相反=一个人都没有→D vacant（空着跑）。空(i)：although 转折——后文火车没人坐也跑=浪费→前文应说火车“不浪费”→B efficiently 高效。", "annot": "空(ii)：<span class='m3'>汽车≥1人才动</span> → <span class='m2'>whereas</span> → <span class='m4'>火车空跑 vacant</span>。空(i)：<span class='m3'>空跑=浪费</span> → <span class='m2'>although</span> → <span class='m4'>火车高效 efficiently</span>。", "辨析": "句意闭环：火车内燃机效率高+铁轨阻力小（常识）→效率高；但按时刻表跑，没人坐也跑→浪费。双重转折各自成对。", "点拨": "别拿常识抬杠：“火车我坐时满满当当，怎么可能空跑？”——这是美国人出的题（美国火车常全程空跑）。**填空考同反，不考常识**；想题外的事就是给自己加戏。", "词根": ["**efficiently**　ef（出）+fic（做）→ 做得出活 = 高效", "**vacant**　vac（空）+ant → 空的", "**lavishly**　lav（洗/倾注，lavatory 盥洗室同源）+ishly → 哗哗花钱 = 浪费", "**routinely**　routine（例行）+ly → 常规地", "**unimpeded**　un+im（入）+ped（脚）→ 插不进脚 = 无阻碍"], "逻辑": "两个空各配一个转折：空(ii) 抓 whereas → 汽车“有人才动” → 火车相反=“没人也动”=空跑；空(i) 抓 although → 后文“空跑=浪费” → 前文相反=高效。注意别拿常识抬杠（美国火车常空跑）——填空考逻辑，不考常识。", "翻译": "虽然火车比汽车更节能，但后者只有至少载一名乘客才开动；而火车车厢却花费大量时间在铁轨上空跑——或者几乎是空跑。"}}, {"type": "q", "tag": "真题", "title": "习题集 第33页 第3题（双空题）", "source": "主系表“好人做好事”+ paradox 是中性词", "pause": true, "dual": true, "stem": [{"t": "The great ______ of most books that examine the American presidency is their ideological bias; but for the most part, this volume on the presidency maintains an impressive degree of ______."}], "vocab": [{"w": "presidency", "g": "总统制", "story": "来自 president。"}, {"w": "ideological", "g": "意识形态的（记成“政治信仰”）", "story": "说不清楚“意识形态”就记：政治上你信谁不信谁。中国：信资还是信社；美国：民主党还是共和党。"}, {"w": "bias", "g": "偏见；偏差", "story": "数学统计上也=偏差。"}, {"w": "volume", "g": "一本书（熟词僻义！）", "story": "本义=大部头书的一卷（vol.1）；引申出各种“量”（体积/容量/音量/车流量）；又因为=书籍的卷→可直接指“一本书”。this volume=这本书。"}, {"w": "limitation", "g": "缺陷、不足、局限性（≠limit）", "story": "limit 限制=中性（可大可小，reach your limit）；limitation=贬义：这东西还有哪些缺陷、可提高之处。"}, {"w": "paradox", "g": "矛盾（中性词！）", "story": "小明很胖但吃得很少=矛盾——这是客观评价，不夸不骂。**矛盾不带感情色彩**。"}, {"w": "objectivity", "g": "公正、客观", "story": "bias 的反义方向。"}], "options": {"i": {"A": "contribution", "B": "limitations", "C": "paradox"}, "ii": {"D": "certainty", "E": "fluency", "F": "objectivity"}}, "answer": "iB,iiF", "explain": {"思路": "空(i)：前半句主干是主系表——“空格 is their ideological bias”→好人做好事：空格=bias 的同义，且 bias 是贬义→空格也得贬义→B limitations（唯一贬义；C paradox 是中性词，不行）。空(ii)：but 转折→不偏见→F objectivity。", "annot": "空(i)：<span class='m2'>主系表</span> <span class='m3'>空格 is bias</span> → 空格=bias 同义且须<span class='m4'>贬义 → limitations</span>。空(ii)：<span class='m2'>but</span> → <span class='m4'>objectivity 不偏见</span>。", "辨析": "C paradox 是高频错选：“矛盾”看着像批评，其实是中性词——“小明胖但吃得少”只是客观陈述。判断褒贬：把词放进“我夸/我骂”的句子里读。", "点拨": "“空格 is 表语”这种主系表结构=天然的同义对应考点。褒贬色彩是六选二/单空的高频筛选器。", "词根": ["**objectivity**　ob（反）+ject（投）→ 抛除主观 = 客观", "**contribution**　con（一起）+tribut（给）+ion（名词后缀）→大家把东西给需要的人=贡献。tribut 词根的最简单形态：补 e=tribute 供品（进贡=给皇上东西）。注意 con-clus-ion 里 s 属词根，con", "**paradox**　para（旁/反）+dox（观点）→ 自相矛盾的观点（中性词！）", "**certainty**　cert（确定）+ainty → 确定", "**fluency**　flu（流）→ 流利"], "逻辑": "前半句是主系表结构“空格 is bias” → 好人做好事：空格=bias 的同义且贬义（limitation 是，paradox 中性不行）；空(ii) 抓 but → 不偏见=客观。句子主干先抓出来，空格和表语的关系一目了然。", "翻译": "大多数研究美国总统制的书最大的局限在于其意识形态上的偏见；但总体上，这本书却保持着一种令人印象深刻的不偏不倚。"}}, {"type": "q", "tag": "真题 · 难句", "title": "习题集 第51页 第2题（单空题）", "source": "破折号插入语跳过法", "pause": true, "stem": [{"t": "Even if he wants to serve again — and, given his obvious love for the job, the assumption among insiders is that he is more likely to stay than go — there is at least one ______ to his serving another term."}], "vocab": [{"w": "even if", "g": "即使、虽然（转折词）", "story": ""}, {"w": "given", "g": "因为、鉴于、考虑到（介词）", "story": "given X=考虑到 X。"}, {"w": "insider", "g": "内部人士", "story": "在里边的人。"}, {"w": "serve another term", "g": "连任", "story": "term=任期（short term/long term；官员的任期）；再干一任=连任。"}, {"w": "impediment", "g": "妨碍、阻碍", "story": "impede 的名词。"}, {"w": "incentive", "g": "动机、激励", "story": "考好了父母给零花钱= incentive。"}, {"w": "precedent", "g": "先例", "story": "之前发生过的事=有先例。"}, {"w": "rationale", "g": "理由、原因", "story": "≠rational（理性的）——多了个 e，两词不同。"}], "options": {"A": "impediment", "B": "incentive", "C": "precedent", "D": "benefit", "E": "rationale"}, "answer": "A", "explain": {"思路": "①两个破折号之间是插入结构，先跳过；②even if 即使他想连任→但的部分=有人不让→连任存在障碍→A impediment。", "annot": "<span class='m5'>—— 破折号之间的插入语（内部人士都觉得他会留任）——</span> 全部跳过 ⇒ <span class='m2'>even if</span> 想连任 → <span class='m4'>至少有一个障碍 impediment</span>。", "辨析": "插入语为什么不用看：它的功能只是补充说明，and 并列说明它和 even if 同属“虽然”阵营。整句=“即使他想连任（而且大家都觉得他会留任），但至少有障碍”。", "点拨": "**读长难句第一招：两个破折号/逗号之间的插入结构，读不懂就跳过**，剩下的主干往往直接可解。", "词根": ["**impediment**　im（入）+ped（脚）+iment → 妨碍（名词）", "**incentive**　in（内）+cent（唱）→ 心里唱响 = 激励", "**precedent**　pre（前）+ced（走）→ 走在前面的事 = 先例", "**rationale**　ration（理）+ale → 理由依据"], "逻辑": "先跳过两个破折号之间的插入语（读不懂就先跳，插入语必非主干） → 只剩 even if 想连任 vs 至少有一个空格 → 转折 → 有人使坏 → 障碍。破折号插入语是长难句第一障碍，跳过法是基本功。", "翻译": "即使他想连任——考虑到他对这份工作明显的喜爱，圈内人士认为他更可能留下而不是离开——他的连任至少也面临一个障碍。"}}, {"type": "teach", "title": "③ 转折头号专题：自相矛盾", "ppt": ["转折前后必须同时成立 → 不能完全相反", "化解矛盾两法：程度区别 / 主体不同"], "text": ["经典例子：小明虽然胖，但不____。A.胖 B.特别胖——只能选 B。选 A 就是“虽然胖但不胖”=自相矛盾，句子没法理解。", "**为什么对比不用管矛盾、转折要管？** 对比（不是…而是…）前后只需成立一个：“小明不是胖而是瘦”成立。转折（虽然…但是）前后必须**同时成立**：“虽然胖但不胖”两个都成立就打架。所以转折题天然有自相矛盾的风险，选选项时必须避开。", "**化解矛盾的办法一：程度上有区别**。“胖”和“特别胖”程度不同（特别胖＞胖），可以同时成立：虽然胖，但不是特别胖。", "**化解矛盾的办法二：主体不同**。“虽然小明胖，但是小红不胖”——主体不是同一个人，不矛盾。", "注意：自相矛盾不只出现在转折题里——**只要选选项，任何题都要避免选出自相矛盾的填法**（本讲最后的 38-10 题就是非转折语境的反矛盾考法）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第153页 第4题（单空题）", "source": "负负得正 + 程度区别化解矛盾", "pause": true, "stem": [{"t": "Although not enough to ______ the conventional view of the manuscript’s provenance, the new study was thought to have weakened prevailing theory considerably."}], "vocab": [{"w": "conventional", "g": "传统的、惯例的", "story": ""}, {"w": "manuscript", "g": "手稿、书稿", "story": "作家写的书稿。"}, {"w": "provenance", "g": "出处、来源、起源", "story": "词根 ven=come（从哪来）→来源。同义=origin。"}, {"w": "prevailing", "g": "普遍的、流行的", "story": "词根 VAL=strong：value 字面=强大→有价值；equivalent 等价=同样强大；prevail=比别人强大→胜利→（理论）流行开来。托福 prevalent 同义。"}, {"w": "undermine", "g": "削弱、质疑", "story": "mine 不只是“我的”：名词=矿（coal mine 煤矿）、动词=采矿（miner 矿工、data mining 数据挖掘）；under+mine=在下边挖=挖墙角→削弱。"}, {"w": "resurrect", "g": "复苏、复兴", "story": "如复兴一个传统。"}, {"w": "topple", "g": "推翻、颠覆", "story": "彻底推翻一个理论/颠覆一个政权。程度远超“削弱”。"}, {"w": "considerably", "g": "大量地、在很大程度上", "story": "来自 considerable（大量的）。"}], "options": {"A": "undermine", "B": "affect", "C": "resurrect", "D": "disturb", "E": "topple"}, "answer": "E", "explain": {"思路": "①although 取反一次；②句中 not 再取反一次；③负负得正→空格与 weaken 大方向一致（负面动作）；④候选 A undermine 和 E topple——选 E：undermine 与 weaken 同义，填入即成“虽然没能削弱，但削弱了”的自相矛盾；topple（推翻）程度远大于 weaken，程度区别化解矛盾。", "annot": "<span class='m2'>Although</span>（反①）+ <span class='m2'>not</span>（反②）= 负负得正 ⇒ 填 <span class='m3'>weaken 同向</span> 的负面词。A undermine=weaken 同义 → <span class='m5'>矛盾</span>；E topple 程度更深 → 成立。", "辨析": "A 是最大陷阱：意思完全对，但和句中的 weakened 撞车。判断方法：把选项代入读——“虽然没能削弱但削弱了”=病句。", "点拨": "双重否定先数取反次数（虽然+否定=同向）；同向候选里再用“程度区别”排除同义撞车。mine=矿/挖掘 这个词根值得记。", "词根": ["**topple**　top（顶）+ple → 从顶上倒 = 推翻", "**undermine**　under（下）+mine（挖矿）→ 底下挖墙脚 = 削弱", "**affect**　伪装；表现出（熟词僻义！af 向+fect 做）", "**resurrect**　re（再）+surrect（升）→ 再起 = 复兴", "**disturb**　dis（分开）+turb（搅）→ 搅乱"], "逻辑": "although 取反一次 + not 再取反一次 → 负负得正 → 空格与 weaken 同向。候选 undermine 与 weaken 同义（撞车=自相矛盾），选程度更深的 topple（推翻>削弱）——程度区别化解矛盾。", "翻译": "虽然不足以推翻关于手稿来源的传统观点，但这项新研究被认为在很大程度上削弱了那个流行理论。"}}, {"type": "q", "tag": "真题", "title": "习题集 第95页 第10题（六选二）", "source": "转折不能与后文矛盾", "pause": true, "multi": true, "stem": [{"t": "Though it may seem as if more than a century of ______ has made the electrical grid an all-encompassing web connecting the whole of the continent, many vast and beautiful areas remain without power."}], "vocab": [{"w": "as if", "g": "仿佛、就像", "story": ""}, {"w": "electrical grid", "g": "电网", "story": "国家电网=State Grid，grid=网络/电网。"}, {"w": "encompass", "g": "包含、包括", "story": ""}, {"w": "refinement", "g": "改善、改良", "story": "re-再+fine 精细→反复提纯（原油炼成成品油）→改善。"}, {"w": "expansion", "g": "扩大、扩张", "story": ""}, {"w": "ubiquity", "g": "无处不在", "story": ""}, {"w": "augmentation", "g": "增多、增大、增强", "story": "来自 augment：AR 增强现实=augmented reality。"}, {"w": "omnipresence", "g": "无处不在", "story": "《核心词汇一本通》的第二个单词。"}, {"w": "isolation", "g": "孤立、隔离", "story": ""}], "options": {"A": "refinement", "B": "expansion", "C": "ubiquity", "D": "augmentation", "E": "omnipresence", "F": "isolation"}, "answer": "BD", "explain": {"思路": "①though 转折→空格与“很多地方仍没电”方向相反；②关键排除：C ubiquity 和 E omnipresence（无处不在）填入后，与后半句“many vast and beautiful areas remain without power（很多地区仍无电）”直接打架——电网无处不在 vs 很多地区没电=自相矛盾；③选一对“扩张”：B expansion + D augmentation。", "annot": "<span class='m2'>Though</span> ⇒ 与后半句相反；但 <span class='m5'>ubiquity/omnipresence 无处不在</span> 与 <span class='m3'>many areas remain without power</span> 矛盾 → 排除 → <span class='m4'>expansion/augmentation 扩张</span>。", "辨析": "句意闭环：电网一个多世纪不断扩张，看起来像是连通了整个大陆——但其实很多地方仍没电。“扩张”与“仍没电”兼容，“无处不在”与“仍没电”不兼容。", "点拨": "选选项前先问一句：填入后整句自洽吗？与后半句矛盾是六选二最常见的排除理由。", "词根": ["**expansion**　ex（出）+pan（扩展）+sion → 扩张", "**augmentation**　aug（增）+mentation → 增大", "**refinement**　re（再）+fin（细）→ 反复提纯 = 改善", "**ubiquity**　ubi（到处）+quity → 无处不在", "**omnipresence**　omni（全）+presence（在场）→ 无所不在", "**isolation**　insul（岛，insulate 绝缘）+ation → 像孤岛一样 = 隔离"], "逻辑": "though → 前后相反；后半句“很多地方没电” → 前半不能夸“无处不在”（否则自相矛盾） → 空格=中性的“扩张”。选选项前先问：填入后整句自洽吗？", "翻译": "虽然一个多世纪以来电网的扩张使它看上去像一张覆盖整个大陆的巨网，但仍有许多广袤而美丽的地方没有通电。"}}, {"type": "q", "tag": "真题", "title": "习题集 第38页 第10题（六选二）", "source": "三个分句两个转折的 xyz 结构", "pause": true, "multi": true, "stem": [{"t": "While it is always clear that the author’s message is heartfelt, it is mostly buried by the shortcomings of style, organization and production, although the book does become more ______ towards the end."}], "vocab": [{"w": "heartfelt", "g": "真诚的", "story": "发自内心、心里能感受到。"}, {"w": "shortcoming", "g": "缺陷、不足", "story": "缺点。"}, {"w": "sincere", "g": "真诚的", "story": ""}, {"w": "intelligible", "g": "易懂的", "story": "≠intelligent（聪明的）！词根 leg=understand：intelligence 字面=理解力→引申智力；intelligible=understandable 可理解的。"}, {"w": "readable", "g": "易读的、易懂的", "story": "与 intelligible 近义，本题一对答案。"}, {"w": "Frank", "g": "真诚的、坦率的", "story": ""}, {"w": "voluble", "g": "（表达）流利的", "story": "说话写文章滔滔不绝。"}], "options": {"A": "sincere", "B": "intelligible", "C": "orthodox", "D": "readable", "E": "Frank", "F": "voluble"}, "answer": "BD", "explain": {"思路": "给三个分句起名 xyz：While x（真诚看得很清楚）/ y 主句（信息被缺陷掩埋=看不出）/ although z（书最后变得更…）。让步状语从句与主句相反：x↔y 相反，z↔y 也相反 → **x 与 z 同向（负负得正）**。z 要与 y 相反：y=看不出→z 填“易懂”→B+D。", "annot": "x（<span class='m2'>While</span> 让步）↔ y（主句）相反；z（<span class='m2'>although</span> 让步）↔ y 相反 ⇒ <span class='m4'>x ≡ z 同向</span>。z 与 <span class='m3'>buried 掩埋（看不出）</span> 相反 → <span class='m4'>易懂 B+D</span>。", "辨析": "A+E（真诚）貌似有道理：x 说真诚，z 与 x 同向也填真诚？——注意 x 的原话是 **always** clear 从始至终真诚，而 z 说 **towards the end** 到最后才变真诚：又变、又始终，矛盾。这就是非转折语境的反矛盾考法。", "点拨": "多让步从句的句子，先分清“谁是从句、谁是主句”——让步从句永远和主句相反。同向推导靠负负得正。always 与 towards the end 的时间打架要敏感。", "词根": ["**intelligible**　inter
