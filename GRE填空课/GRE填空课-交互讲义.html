an important role in making cell phone networks more efficient。就是说电话中对噪音进行抑制，它可以起到重要的作用，对于让手机网络变得更加高效。后半句说sings when sounds that our空格to the meaningful signal are transmitted precious network bandwidth is wasted。就是说当空格对于有意义信号的声音被传输的时候，宝贵的网络带宽就被浪费。解这道题，since之前完全没有用，只需要看since之后，since之后你像我们说when它引导的部分应该和主句应该相同。那你就可以想什么样的声音被传递的时候，这就是在浪费网络贷款，肯定是没有用的，信息被传递的时候，这是这才是在浪费网络。所以空格儿我们就体现出这个声音，它没有用，所以最后你只需要选两个，没有意义就可以了，答案选的就是c和f。"}, {"id": 11, "title": "第11讲 · 因果关系（三）：so…that / such…that——“如此…以至于”前后取同", "intro": "本讲讲因果关系里最隐蔽的一对信号：**so…that / such…that**（如此…以至于）。它们中学就学过的“结果状语从句”，骨子里是**因为…所以**，所以前后**取同**。全讲 7 道真题：从送分的“气味微弱到闻不出来”，到柏拉图谈音乐与政治的三空题，再到 hacking 是中性词、scientific 变成夸人、富兰克林“名声与实际相反”的 startling 陷阱，以及童话为何能“活到今天”、警队名声为何“挥之不去”。中间穿插两个词汇专题：**of 的熟词僻义**与**正常对奇怪的隐晦对比线索**。", "cards": [{"type": "teach", "title": "① so…that / such…that：结果状语从句 = 因果 → 前后相同", "ppt": ["so + 形/副 + that…／such + 名词 + that…：中学翻译「如此…以至于」", "语法本质：that 引导**结果状语从句** = 因为太怎么样，所以才怎么样", "因果双方**取同**：前半句什么方向，后半句就填什么方向"], "text": ["so…that 和 such…that 你上中学就学过，意思是「如此…以至于」。但解填空题，你要把它理解成**「因为太怎么样，所以才怎么样」**——that 引导的是一个结果状语从句，整个词组表示的就是一个因为所以的意思。既然是因果关系，按因果系列的总规则：**前后填相同**。", "做题流程：找到 so/such 后面的那个特点（因），把它原样推到 that 从句里（果），空格直接填同方向的词。很多题只看第一行就能出答案——第二行往往是背景信息，完全不用看。"]}, {"type": "q", "tag": "真题", "title": "课上例题：微弱的气味（六选二）", "source": "so faint that 前后取同", "pause": true, "multi": true, "stem": [{"t": "Scientists are investigating odors so faint that people cannot ______ them, in order to see whether such odors can nevertheless change the way people interact."}], "vocab": [{"w": "odor", "g": "气味", "story": "和 odour 是英美拼写差异；odorless=无味的。"}, {"w": "faint", "g": "微弱的", "story": "faint light 微弱的灯光→快看不见了。"}, {"w": "tolerate / endure", "g": "忍受", "story": "tolerate：tol=承受；endure：en+dur（持续，during 同源）→ 持续扛着=忍受。"}, {"w": "avoid", "g": "避免", "story": "a+void（空）→ 躲开使落空。"}, {"w": "dispel", "g": "驱散、驱除", "story": "dis（分开）+pel（推，compel/expel 同源）→ 推开=驱散。"}, {"w": "discern", "g": "发现、察觉、辨别", "story": "dis（分开）+cern（筛分，concern/discriminate 同源）→ 从一堆里分出来=辨别察觉。"}, {"w": "detect", "g": "察觉、探测到", "story": "de（去掉）+tect（盖，protect 保护=在前面盖着）→ 揭开盖子=发现；detective 侦探。"}, {"w": "interact", "g": "相互交流、互动", "story": "inter（之间）+act（行动）。"}, {"w": "nevertheless", "g": "然而、仍然", "story": "=however，转折词。"}], "options": {"A": "tolerate", "B": "endure", "C": "avoid", "D": "dispel", "E": "discern", "F": "detect"}, "answer": "EF", "explain": {"思路": "①抓 so…that：因=气味如此 faint（微弱），果=人们不能______它，前后取同；②气味太微弱→人们当然**闻不出来、察觉不到**；③选一对「发现/察觉」：E discern + F detect。", "annot": "<span class='m2'>so</span> <span class='m3'>faint 微弱</span> <span class='m2'>that</span> 前后取同 ⇒ 人们不能<span class='m4'>察觉它 discern/detect</span>。", "辨析": "A 忍受、B 忍受是一对同义干扰项——微弱的气味谈不上「忍不忍」；C 避免、D 驱散都不与「微弱」构成因果。第二行「是否仍能改变人们交流方式」是背景信息，解题完全不用看。", "点拨": "so…that 题先看第一行：「如此 X，以至于 Y」里 X 和 Y 永远同方向。", "词根": ["**discern**　dis（分）+cern（筛）→ 筛分出来=辨别察觉", "**detect**　de（去掉）+tect（盖）→ 揭开盖子=探测到", "**dispel**　dis（开）+pel（推）→ 推开=驱散", "**endure**　en+dur（持续）→ 持续扛着=忍受"], "逻辑": "so…that = 因果取同：气味太微弱（因）→ 人们察觉不到（果）。第二行是研究目的的背景，不影响选词。", "翻译": "科学家正在研究一些极其微弱、以至于人们根本察觉不到的气味，想看看这样的气味是否仍能改变人们相互交流的方式。"}}, {"type": "q", "tag": "真题", "title": "习题集 第13页 第6题（三空题）", "source": "so…that 取同 + when 今昔对比 + to be sure 让步", "pause": true, "triple": true, "stem": [{"t": "For Plato, the art of music was so ______ moral and political reality that any alteration to music systems would necessarily require a corresponding political shift. But two and a half millennia later, when classical music is generally seen merely as a lifestyle accessory, Plato's conception seems ______. To be sure, there are still people who consider classical music to be of ______ cultural importance, but few of them are able to articulate this convincingly."}], "vocab": [{"w": "alteration", "g": "改变", "story": "来自动词 alter；alteration=改动。"}, {"w": "necessarily", "g": "必然、一定", "story": "注意≠「必要的」（那是形容词 necessary）；副词=必然地。"}, {"w": "corresponding", "g": "相应的、相符的", "story": "cor（一起）+re+spond（回应，respond 同源）→ 互相呼应=相应。"}, {"w": "millennia", "g": "（复数）一千年/数千年", "story": "millennium 的复数；two and a half millennia=2500 年。解题不用认识。"}, {"w": "lifestyle accessory", "g": "生活附属品、次要的东西", "story": "accessory 日常=配件：买手机配的充电器、手机壳都叫 accessory→附属次要之物。"}, {"w": "conception", "g": "观点、看法", "story": "≠concept（概念）；加 -ion 之后=一个人形成的看法。"}, {"w": "to be sure", "g": "诚然、虽然", "story": "让步信号，=admittedly。"}, {"w": "articulate", "g": "（把…）说清楚", "story": "articulate sth convincingly=说得令人信服。"}, {"w": "identify A with B", "g": "把 A 和 B 联系在一起", "story": "identify 马丁·路德·金 with 民权运动=把二者联系到一起。另：identify with=认同（阅读高频）。"}, {"w": "tenuous", "g": "脆弱的、站不住脚的", "story": "tenu=细薄→细得快断=weak。"}, {"w": "anchor", "g": "（动词）联系、拴住", "story": "名词=船锚：船下了锚就把自己和海底捆在一起→动词=牢牢联系。"}, {"w": "apt", "g": "恰当的、说到位的", "story": "说话特别对、特别在理=apt。"}, {"w": "absurd", "g": "荒唐的", "story": "同义词就是你无比熟悉的 ridiculous。"}, {"w": "disingenuous", "g": "虚伪的、不真诚的", "story": "dis（不）+ingenuous（真诚坦率的）。"}, {"w": "marginal", "g": "不重要的", "story": "margin=页边距（page margin）→「边缘人物」=不是主要人物→不重要的。"}, {"w": "profound", "g": "巨大的、深刻的", "story": "pro（向前）+found（底）→ 深不见底→深刻。"}], "options": {"i": {"A": "identified with", "B": "tenuously connected to", "C": "anchored in"}, "ii": {"D": "apt", "E": "absurd", "F": "disingenuous"}, "iii": {"G": "marginal", "H": "profound", "I": "uncertain"}}, "answer": "iC,iiE,iiiH", "explain": {"思路": "空1：so…that 前后取同——只要改音乐就必然要求相应的政治改变→音乐和政治**关系紧密**→C anchored in（牢牢扎根于）。空2：when 引导今昔同向叙述——今天古典音乐只是 lifestyle accessory（不重要），而柏拉图认为音乐极其重要→在今天看来柏拉图的观点**没有道理、荒唐**→E absurd。空3：to be sure=让步（诚然/虽然），与上一句取反——上一句说今天音乐不重要，让步后这帮人觉得音乐**很重要**→H profound（巨大的文化重要性）。", "annot": "空1：<span class='m2'>so…that</span> 取同：<span class='m3'>改音乐→必须改政治</span> ⇒ 音乐<span class='m4'>牢牢扎根于 anchored in</span> 政治现实。空2：<span class='m2'>when</span> 今昔对照：<span class='m3'>今天音乐=生活配件（不重要）</span> ⇒ 柏拉图观点显得<span class='m4'>荒唐 absurd</span>。空3：<span class='m2'>to be sure</span> 让步取反 ⇒ 有人仍认为音乐有<span class='m4'>巨大 profound</span> 重要性。", "辨析": "空1：A identify A with B 只是「联系在一起」，力度不如 anchor（拴死）；B tenuously connected（脆弱地联系）正好相反。空2 大坑是 F disingenuous（虚伪）：题目从头到尾没说柏拉图在**骗你**——他可能真心这么觉得，只是今天看来荒诞，「虚伪」需要欺骗的证据。空3：G marginal（不重要）方向反了；I uncertain（不确定）不含「重要」。", "点拨": "三空题逐空找信号：空1 靠 so…that，空2 靠 when 今昔对照，空3 靠 to be sure 让步。每个空格只对自己的信号负责。", "词根": ["**tenuous**　tenu（细薄）→ 脆弱的=weak", "**anchor**　船锚 → 下锚=把自己拴住=牢牢联系", "**absurd**　ab+surd（聋/钝）→ 听不进道理的=荒唐", "**disingenuous**　dis（不）+in+gen（生）→ 不天生率真=虚伪", "**marginal**　margin（页边距）+al → 边缘的=不重要的", "**profound**　pro（前）+found（底部）→ 深到底=深刻"], "逻辑": "空1：so…that 因果取同——改音乐必改政治 ⇒ 音乐与政治紧密相连；空2：when 今天音乐只是配件 ⇒ 柏拉图的「音乐很重要」在今天显得荒唐；空3：to be sure 让步取反——虽有人仍认为音乐有巨大重要性，但说不出个所以然。三空三个信号，各管各的。", "翻译": "对柏拉图来说，音乐这门艺术是如此深植于道德与政治现实，以至于对音乐体系的任何改动都必然要求相应的政治变革。但两千五百年后的今天，当古典音乐普遍被看作不过是一种生活点缀时，柏拉图的看法显得颇为荒唐。诚然，仍有一些人认为古典音乐具有巨大的文化重要性，但他们当中很少有人能把这一点说得令人信服。"}}, {"type": "teach", "title": "② 词汇专题：of 的熟词僻义——别小看最简单的词", "ppt": ["of + 名词 修饰名词：a man of courage = 一个有勇气的人", "be of + 名词 = 动词「有」：learning is of great importance = 学习很重要", "of 表「具体说明」：后者是前者的具体一种——the city of Beijing = 北京市；the art of music = 音乐这门艺术", "实例：Washington DC（华盛顿特区）vs the state of Washington（华盛顿州）"], "text": ["**用法一（最常见）**：of 后面接名词构成介词短语，修饰前面的名词，of=「有」。a man of courage=一个勇敢的人/一个有勇气的人。", "**用法二（本题考）**：be of + 名词，连在一起相当于动词的「有」。Learning is of great importance，字面=学习有着巨大的重要性，简单说=学习非常重要。上面柏拉图题的空3「of ______ cultural importance」考的就是这个：有着______的文化重要性。", "**用法三（具体说明）**：后者是前者的具体一种。the city of Beijing 不是「北京的城市」——北京本身就是一个 city，of 在这里具体说明是哪个 city，翻译就是「北京市」。同理 the art of music=音乐这门艺术。美国人起地名有个坏毛病：不相干的地方起同样的名字——首都是华盛顿特区，西海岸还有个华盛顿州，两地坐飞机要六个小时。为了分清，说特区时讲 Washington DC，说州时讲 **the state of Washington**——加的 of 短语就是具体说明「这是作为州的那个华盛顿」。", "结论：哪怕 of 这种最简单的词，考试也可能考熟词僻义，复习时别放过小词。"]}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第26页 第10题（六选二）", "source": "such…that 取同；「不是坏词」≠「是好词」", "pause": true, "multi": true, "stem": [{"t": "While recognizing that recent reports of cyber warfare, phone hacking scandals, and identity thefts have tended to accent the destructive connotation of the word, S.H. maintains that hacking is such a ______ term that its meaning nearly always derives from its context."}], "vocab": [{"w": "recognize", "g": "承认", "story": "本义「认出」；考试更爱考「承认」。"}, {"w": "cyber warfare", "g": "网络战、信息战", "story": "cyber=计算机网络+warfare=战争。解题不用深究。"}, {"w": "scandal", "g": "丑闻", "story": "phone hacking scandal=窃听电话丑闻。"}, {"w": "theft", "g": "盗窃", "story": "identity theft=身份盗用。"}, {"w": "accent（动词）", "g": "突出、强调", "story": "熟词僻义：名词 accent 读「口音」，动词 accent=强调。"}, {"w": "destructive", "g": "破坏性的", "story": "来自 destroy 毁坏。"}, {"w": "connotation", "g": "隐含义", "story": "单词背后藏的感情色彩：「小明为人憨厚」和「小明就是个傻子」字面差不多，隐含义天差地别。"}, {"w": "maintain", "g": "声称、主张、认为", "story": "除「保持」外的考试高频义。"}, {"w": "term", "g": "词语、叫法", "story": "不一定是「术语」——日常给某物起的名称也叫 term。"}, {"w": "derive from", "g": "源自、产生自", "story": "de+riv（河流，river 同源）→ 从源头流下=源自。"}, {"w": "context", "g": "语境、上下文", "story": "con（一起）+text（编织）→ 织在一起的文字=上下文。"}, {"w": "generic", "g": "通用的、普遍适用的", "story": "gen（种类）+eric→ 属于整个类别的=通用。和「general 普通的」长得像、意思近。"}, {"w": "inclusive", "g": "全部包含在内的", "story": "来自动词 include 包含。"}, {"w": "subjective", "g": "主观的", "story": "反义词 objective 客观的。"}, {"w": "affirmative", "g": "肯定的", "story": "an affirmative answer=肯定的答复（问你是非题，你答「是」）。"}, {"w": "technical", "g": "技术的", "story": "techn（技艺）+ical。"}], "options": {"A": "generic", "B": "inclusive", "C": "positive", "D": "subjective", "E": "affirmative", "F": "technical"}, "answer": "AB", "explain": {"思路": "①while 让步：前半句承认「这个词有破坏性的隐含义」（是坏词）→后半句取反：它不是个坏词；②关键校验：such…that 要求空格与后半句「词义几乎总是取决于上下文」**取同**——如果填 C positive / E affirmative（褒义词），那词义已定死，**根本不需要看上下文**，与后半句矛盾；③所以只能填「中性词」：好坏场合都能用→A generic（普遍适用）+B inclusive（什么含义都包得住）。", "annot": "<span class='m2'>while</span> <span class='m3'>承认=坏词</span> → 不是坏词；但 <span class='m2'>such…that</span> 取同：<span class='m3'>词义要看上下文</span> ⇒ 空格=<span class='m4'>中性词 generic/inclusive</span>（不能是褒义词）。", "辨析": "最多人错选 C+E（正面的/肯定的）：它们满足 while 的取反，却破坏了 such…that 的取同——褒义词词义固定，与「意义来自语境」打架。D 主观的、F 技术的都不沾边。本题 A、B 并非严格同义词，但**填进句子后表达相同的意思**——这是六选二里「句内同义」的又一例。", "点拨": "while 取反只是第一步；「不是坏词」有三种可能——好词、中性词、时好时坏。用 such…that 的同向要求做二次校验，只有中性词能活下来。", "词根": ["**generic**　gen（类，genus）+eric → 整个类都能用=通用", "**inclusive**　in（里）+clus（关）→ 全关在里面=全包含", "**affirmative**　af（加强）+firm（牢固）→ 立场坚定=肯定", "**subjective**　sub（下）+ject（扔）→ 扔到自己底下=主观", "**context**　con（一起）+text（织）→ 上下文"], "逻辑": "while 让步取反：承认 hacking 是「坏词」→ 主张它不是坏词；such…that 取同：词义取决于上下文 ⇒ 它是中性词（好坏场合都能用）。两个信号词各管一段，最终答案要同时满足两者——只满足 while 的 C/E 被 such…that 淘汰。", "翻译": "尽管承认近来关于网络战、电话窃听丑闻和身份盗用的报道往往突出了这个词的破坏性含义，S.H. 仍坚持认为 hacking 是一个含义极广的词——它的意思几乎总是取决于具体语境。"}}, {"type": "q", "tag": "真题", "title": "习题集 第43页 第6题（三空题）", "source": "so successful that 链式取同 ×3", "pause": true, "triple": true, "stem": [{"t": "Within the culture as a whole, natural science has been so successful that the word 「scientific」 is used in ______ manner; it is often assumed that to call something scientific is to imply that its reliability has been ______ by research whose results cannot reasonably be ______."}], "vocab": [{"w": "manner", "g": "方式、方法", "story": "≠礼仪！「礼仪」是复数 manners（table manners 餐桌礼仪）；单个 manner=方式。"}, {"w": "ironic", "g": "出人意料的（GRE 高频）；讽刺的（本义）", "story": "讽刺的引申义=出人意料：「讽刺的是，每天劝别人减肥的小明，最后自己长成了大胖子」——英汉语都一样。"}, {"w": "honorific", "g": "尊敬的、表敬意的", "story": "honor 名词=荣誉；动词=尊敬、致敬→形容词 honorific=致以敬意的。"}, {"w": "literal", "g": "字面的", "story": "形近词三连必须分清：literal 字面的／literary 文学的（literature）／literate 识字的（不是文盲）。"}, {"w": "malign", "g": "污蔑、诽谤", "story": "mal=坏（malware 恶意软件=bad software）→ 说别人坏话。"}, {"w": "challenge", "g": "质疑、挑战", "story": "考试里常=质疑，不只是「挑战」。"}, {"w": "establish", "g": "证明、证实（熟词僻义）", "story": "除「建立」外，考试更爱考「证实」：establish the reliability=证实可靠性。"}, {"w": "dispute", "g": "质疑", "story": "动词=质疑、对…提出异议。"}, {"w": "anticipate", "g": "预言、预料", "story": "anti（前）+cip（拿）→ 提前拿到=预料。"}, {"w": "exaggerate", "g": "夸张、夸大", "story": "ex（出）+agger（堆）→ 堆过头=夸大。"}], "options": {"i": {"A": "ironic", "B": "honorific", "C": "literal"}, "ii": {"D": "maligned", "E": "challenged", "F": "established"}, "iii": {"G": "disputed", "H": "anticipated", "I": "exaggerated"}}, "answer": "iB,iiF,iiiG", "explain": {"思路": "空1：so…that 取同——因=自然科学很**成功**→「科学」这个词得以**体现成功、体现褒奖**的方式使用→选项里唯一的褒义词 B honorific（用这个词就是向别人致敬=夸人）。空2：顺承同向——说某物「科学」=夸它→暗示其可靠性已被研究**证实**→F established。空3：继续同向——用什么研究来证实效果最好？结果**不容置疑**的研究→G disputed（cannot reasonably be disputed=不容合理质疑）。", "annot": "<span class='m2'>so</span> <span class='m3'>successful 成功</span> <span class='m2'>that</span> ⇒ 空1 <span class='m4'>honorific 表敬意</span>；顺承 ⇒ 空2 可靠性被<span class='m4'>证实 established</span>；顺承 ⇒ 空3 结果不能合理<span class='m4'>质疑 disputed</span>。", "辨析": "空1：A ironic（出人意料的）和 C literal（字面的）都不含褒义——so…that 要求空格体现「成功」，只有 B 是褒义词。空2：D maligned（被污蔑）、E challenged（被质疑）都是贬义方向，与「夸人」相反。空3：H 被预料、I 被夸大都不能让证明更有力；只有「不容置疑」的研究最能证明别人成功。", "点拨": "so…that 的取同可以**链式传导**：成功→夸人→证实→不容置疑，每一环都顺着上一环的方向走。", "词根": ["**honorific**　honor（敬意）+ific → 表敬意的", "**ironic**　讽刺的→引申「出人意料的」（讽刺的是…=意外的是…）", "**malign**　mal（坏，malware 恶意软件）+ign → 说坏话=污蔑", "**establish**　e+stabl（稳定）→ 确立；僻义=证实", "**dispute**　dis（分开）+put（想）→ 想法不合=质疑", "**anticipate**　anti（前）+cip（拿）→ 提前拿到=预料"], "逻辑": "so successful that 取同链：科学成功 ⇒ scientific 成了敬语（夸人）⇒ 说某物科学=暗示可靠性被证实 ⇒ 用结果不容置疑的研究来证实最有力。汉语同理：「你学习方法很科学」=学得对；「不科学」=学得不对——科学已经变成褒义词。", "翻译": "在整个文化中，自然科学已经如此成功，以至于「科学」一词被以一种表达敬意的方式来使用；人们通常认为，说某个东西「科学」，就是在暗示它的可靠性已被研究所证实——而这类研究的结果不容合理置疑。"}}, {"type": "teach", "title": "③ 隐晦对比线索：startling = 正常对奇怪 → 取反", "ppt": ["「令人惊讶 startling/surprising」= 实际情况与名声/预期**不一致** → 前后取反", "对比关系的隐蔽考法：**正常对奇怪**", "复习时把所有隐晦线索整理出来，做题看不出来=白学"], "text": ["问自己一个常识问题：什么情况会让你**惊讶**？发现实际和某人的名声**一致**，你会惊讶吗？不会。只有实际与名声**不一致**时，你才会惊讶。所以题干里出现 startling/surprising/amazing，就等于告诉你：前后**相反**。", "这就是我们讲对比关系时强调过的「**正常对奇怪**」：名声是正常预期，事实是奇怪现实。这类对比线索没有 however/unlike 那样的明面信号词，全靠语义推理——复习时务必把这类隐晦线索逐个搞清楚，否则做题时根本看不出前后相反，整道题就做错了。"]}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第44页 第10题（六选二）", "source": "startling 提示相反：名声 vs 实际", "pause": true, "multi": true, "stem": [{"t": "Benjamin Franklin's reputation is so much one of approaching scientific investigation with common-sense empiricism that it is somewhat startling to realize how ______ the great experimenter's mentality truly was."}], "vocab": [{"w": "approach（名词）", "g": "方式、方法（熟词僻义）", "story": "除「接近」外，GRE 更爱考名词「方法」：处理/研究某问题的方式。"}, {"w": "approach A with B", "g": "以 B 的方式来处理 A", "story": "approaching scientific investigation with common-sense empiricism=以常识性实证的方式做科研。"}, {"w": "scientific investigation", "g": "科学研究、调查", "story": "investigation=调查研究。"}, {"w": "common sense", "g": "常识；常识性的", "story": "形容词=大家都懂的、常识性的。"}, {"w": "empiricism", "g": "观察实验；实证（≠字典的「经验主义」）", "story": "通过实际观察或实验得出结论。考试从不考「经验主义」本义。"}, {"w": "empirical", "g": "实证的、基于观察实验的", "story": "empirical data=实验/观察数据；empirical research=实证研究；反义 theoretical（纯理论推导）。"}, {"w": "startling", "g": "惊人的", "story": "让人非常惊讶→提示前后相反（正常对奇怪）。"}, {"w": "mentality", "g": "思想、心态", "story": "来自 mental 心智的。"}, {"w": "speculative", "g": "猜想的、凭推测的", "story": "spec=看：speculation 字面=「看看」→「我看看」=「我想想」→猜想。同学问题怎么做，你说「我看看」=我琢磨琢磨。"}, {"w": "pragmatic", "g": "务实的、实事求是的", "story": "讲究实际、不好高骛远。"}, {"w": "conjectural", "g": "猜想的、凭猜测的", "story": "名词 conjecture=猜想猜测。"}, {"w": "judicious", "g": "明智的、明断的", "story": "来自 judge 判断：善于做判断、判断很准。"}], "options": {"A": "reasonable", "B": "speculative", "C": "pragmatic", "D": "conjectural", "E": "careless", "F": "judicious"}, "answer": "BD", "explain": {"思路": "①so much one of…=「很大程度上是这样一个名声」（one 指代 reputation）：富兰克林的名声=以**常识性观察实验（empiricism）**的方式做科研；②抓隐晦线索 startling：惊讶=实际与名声**相反**→空格填「不做观察实验」；③选项里「凭猜想猜测」的一对：B speculative + D conjectural。", "annot": "名声=<span class='m3'>empiricism 观察实验</span>；<span class='m2'>startling 令人惊讶</span> ⇒ 实际相反 ⇒ 思想其实是<span class='m4'>凭猜想 speculative/conjectural</span>。", "辨析": "A 合理、C 务实、F 明智都是褒义且与「实证」同向——填入后实际与名声一致，就谈不上 startling 了；E careless（不仔细）虽是贬义但不构成「不观察实验」的同义对。本题 so…that 负责把名声说满，startling 负责反转。", "点拨": "so…that 也可以和转折线索同题共存：先看 so…that 确定「名声是什么」，再用 startling 取反得「实际是什么」。隐晦线索（正常对奇怪）复习时务必逐个过关。", "词根": ["**empiricism**　em+pir（试验，experience/experiment 同源）→ 观察实验、实证", "**speculative**　spec（看）→「我看看」=「我想想」→ 猜想", "**conjectural**　con（一起）+ject（扔）→ 把想法扔到一起=猜测", "**pragmatic**　prag（做，practice 同源）→ 务实", "**judicious**　jud（判断，judge）+icious → 善于判断=明智"], "逻辑": "so…that 先把名声铺满：富兰克林=实证主义实验家；startling（正常对奇怪）取反：实际上他的思想全凭猜想、不做观察实验。惊讶只在「实际≠名声」时成立——这就是空格的方向。", "翻译": "本杰明·富兰克林的名声，很大程度上是一个「以常识性的实证方式从事科学研究」的名声；因此，当我们意识到这位伟大的实验家的思想实际上是多么依赖臆测时，不免感到有些吃惊。"}}, {"type": "q", "tag": "真题", "title": "习题集 第56页 第10题（六选二）", "source": "so…that 取同：对今天没意义 → 活到今天没道理", "pause": true, "multi": true, "stem": [{"t": "At first, most of the famous fairy tales seem so implausible and so irrelevant to contemporary life that their ______ is hard to understand."}], "vocab": [{"w": "fairy tale", "g": "童话故事", "story": "fairy=仙女/精灵。"}, {"w": "implausible", "g": "不合理的、难以置信的", "story": "im（不）+plausible（合理的）——plausible 只记「合理」，别记「貌似合理」。"}, {"w": "irrelevant", "g": "不相关的、没有意义的", "story": "ir（不）+relevant（相关的）。"}, {"w": "contemporary", "g": "现代的、当代的", "story": "con（共同）+tempor（时间）→ 同一时代的。"}, {"w": "universality", "g": "普遍性", "story": "来自 universal 普遍普适。"}, {"w": "persistence", "g": "坚持；持续存在、继续生存", "story": "两个意思：形容人=坚持；形容事物=继续存在（病一直治不好=the disease persists）。"}, {"w": "appeal", "g": "魅力、吸引力", "story": ""}, {"w": "ephemerality", "g": "短暂、转瞬即逝", "story": "来自 ephemera（蜉蝣）：朝生暮死的小虫，早上出生疯狂交配晚上就死→生命周期极短→短暂。"}, {"w": "survival", "g": "生存、存活", "story": "sur（超）+viv（活，vivid 同源）→ 活得超过别人=幸存。"}, {"w": "transience", "g": "短暂、转瞬即逝", "story": "trans（穿过）→ 一穿而过=转瞬即逝。"}], "options": {"A": "universality", "B": "persistence", "C": "appeal", "D": "ephemerality", "E": "survival", "F": "transience"}, "answer": "BE", "explain": {"思路": "①so…that 取同：因=童话如此没道理、且**对今天的生活没有意义**；②顺着「对今天没意义」推：一个对今天没意义的东西，**居然活到了今天**，这才没道理、才让人难以理解；③空格填「持续存在/存活」：B persistence + E survival。", "annot": "<span class='m2'>so</span> <span class='m3'>implausible + irrelevant to contemporary life 对今天没意义</span> <span class='m2'>that</span> ⇒ <span class='m4'>它们的存活 persistence/survival 难以理解</span>。", "辨析": "大坑是 D ephemerality + F transience（短暂）这一对同义词——它们与「irrelevant 却仍流传至今」恰好相反：短暂的东西根本不会活到今天。A 普遍性、C 魅力都不呼应「对今天没意义」。", "点拨": "so…that 取同要找准「因」里最具体的那一环：本题关键不是「没道理」，而是「对今天没意义」——能活到今天才奇怪。", "词根": ["**persistence**　per（彻底）+sist（站）→ 一直站着=坚持/持续存在", "**survival**　sur（超过）+viv（活）→ 存活", "**ephemerality**　ephemera（蜉蝣，朝生暮死）→ 转瞬即逝", "**transience**　trans（穿过）+ience → 一穿而过=短暂", "**implausible**　im（不）+plaus（鼓掌）→ 不值得鼓掌=不合理", "**contemporary**　con（同）+tempor（时）→ 同时代=当代"], "逻辑": "so…that 因果取同：童话对今天的生活毫无意义（因）→ 它们居然能存活至今，让人难以理解（果）。「没意义的东西还活着」才是矛盾点——所以填「存活」而非「短暂」。", "翻译": "乍看之下，大多数著名童话显得如此荒诞不经、又与当代生活如此毫不相干，以至于它们竟然能流传至今，实在令人难以理解。"}}, {"type": "q", "tag": "真题", "title": "习题集 第84页 第4题（双空题）", "source": "so…that 取同 + clean up 的道德属性 + routinely 的对应", "pause": true, "dual": true, "stem": [{"t": "So ______ is the reputation of the city's police force for ______ that whenever a new police chief takes office, he or she routinely promises to clean up the force."}], "vocab": [{"w": "police force", "g": "警察队伍", "story": "force=队伍；句尾的 the force 还是指这支警队。"}, {"w": "police chief", "g": "警长", "story": "chief=长官。"}, {"w": "routinely", "g": "总是、例行地", "story": "routine 名词=惯例（每天都这样）→副词=总是如此=always。"}, {"w": "clean up", "g": "整顿（尤指道德问题）", "story": "觉得某机构道德有问题、去清理整顿=clean up。"}, {"w": "reputation for", "g": "有…的名声", "story": "a reputation for something=有某种具体的名声——空2 的 for 是跟 reputation 的。"}, {"w": "persistent", "g": "持续的、挥之不去的", "story": "per（彻底）+sist（站）：疾病治不好、一直存在=persistent；名声怎么整顿都甩不掉也是它。"}, {"w": "discouraging", "g": "令人沮丧的、令人泄气的", "story": "dis+courage（勇气）→ 打击勇气=令人泄气。"}, {"w": "corruption", "g": "贪污腐败", "story": "cor（一起，来自 con）+rupt（break 打碎）→ 全都碎掉：食物放久腐烂=corrupt；形容人=道德堕落（节操尽碎）→corrupt officials 腐败官员。"}, {"w": "inefficiency", "g": "效率低下", "story": "in（不）+efficiency（效率）。"}, {"w": "inexperience", "g": "缺乏经验", "story": "in（不）+experience（经验）。"}], "options": {"i": {"A": "persistent", "B": "deserved", "C": "discouraging"}, "ii": {"D": "corruption", "E": "inefficiency", "F": "inexperience"}}, "answer": "iA,iiD", "explain": {"思路": "先看清结构：空2 的 for 跟 reputation 搭配（a reputation for…），前半句=「警队有一个空2 的名声，这个名声又是空1 的」。①so…that 取同：新警长上任总要承诺**整顿**警队→警队**需要整顿**→名声是贬义。空2：D corruption 与 F inexperience 都是贬义，但 clean up（整顿）的对象得是**道德问题**——缺乏经验是能力问题，贪污腐败才是道德问题→D。空1：A persistent 与 C discouraging 似乎都通，但后文 **routinely（总是）**承诺整顿→说明名声**始终挥之不去、怎么整都不好用**，才需要反复承诺→A 与 routinely 精确对应，C 体现不出。", "annot": "<span class='m2'>so…that</span> 取同：<span class='m3'>routinely promises to clean up 总要整顿</span> ⇒ 空2=<span class='m4'>道德问题 corruption</span>（clean up 专整道德）；空1=<span class='m4'>挥之不去 persistent</span>（对应「总是」承诺）。", "辨析": "空2 大坑 F inexperience：贬义≠答案——clean up 整顿的是道德问题，没经验是能力问题，挨不上。空1 大坑 C discouraging：「名声令人泄气」与「总是承诺整顿」没有对应关系；A persistent（挥之不去）才能解释为什么要 routinely（一次次）承诺。B deserved（应得的）与整顿语义冲突。", "点拨": "两个空格都选了「更精确对应后文细节」的那个：贬义候选里用 clean up 的道德属性区分；特点候选里用 routinely 的频率对应区分。选项比不出高下时，回原文找它呼应的细节。", "词根": ["**corruption**　cor（一起）+rupt（碎）→ 全碎了=腐烂→道德堕落；同根：interrupt（inter 之间+break 从中间打断=插嘴）、erupt（e=out+break out=爆发）", "**persistent**　per（彻底）+sist（站）→ 一直站着=挥之不去", "**routinely**　routine（惯例）→ 总是如此", "**inefficiency**　in（不）+ef（出）+fic（做）→ 做不出效果=低效"], "逻辑": "so…that 因果取同：警队名声臭到挥之不去（因）→ 每任新警长都得承诺整顿（果）。空2 由 clean up 的道德属性锁定 corruption（腐败=道德问题，没经验=能力问题）；空1 由 routinely（总是）锁定 persistent（挥之不去才要反复整顿）。", "翻译": "这座城市的警察队伍以腐败著称，且这一名声始终挥之不去，以至于每当新警长上任，总会承诺要整顿警队。"}}, {"type": "teach", "title": "④ 本讲小结", "ppt": ["so…that / such…that = 因为…所以 → 前后取同", "取同可链式传导（43-6：成功→夸人→证实→不容置疑）", "while 取反后还要过 such…that 的校验（26-10 中性词陷阱）", "startling = 正常对奇怪 = 取反（44-10）", "选项并列时回原文找细节对应（84-4：clean up→道德；routinely→挥之不去）"], "text": ["**核心规则**：看到「如此…以至于」（so/such…that），就当「因为太…所以…」做——前后**填相同**。很多题第一行就能出答案。", "**本讲金句**：①such…that 是校验器——26-10 里「不是坏词」不能选褒义词，因为褒义词词义固定、不需要看上下文；②startling/surprising=实际与名声相反（正常对奇怪），隐晦对比线索要逐个复习过关；③六选二的答案不一定是严格同义词，**填进句子后意思相同**即可；④选项僵持时回原文找呼应细节：clean up 整顿道德问题、routinely 对应挥之不去。", "**词汇备忘**：of 的僻义（a man of courage／be of importance／the city of Beijing）；necessarily=必然≠必要的；manner=方式，manners 才是礼仪；establish=证实；empiricism=观察实验（别记经验主义）；literal／literary／literate 三连分清；rupt=break 家族：interrupt 打断、erupt 爆发、corrupt 腐败。", "**下讲预告**：因果关系（四）——更多因果信号词与因果推理链的进阶考法。"]}], "transcript": "接下来，我们看这样一种 碎掉了，那这个就叫corrupt。所以你比如像食物放久了之后，腐烂了，彻底碎掉了，那这个就叫corrupt。你再比如形容人道德堕落，像我们汉语说节操尽碎，那这种感觉这个也是叫corrupt。最后剩下两个选项，一个效率，一个没经验，都是简单词好，你看这道题你怎么选？我们一起来看。题目开头，它说so空格is the reputation of the silly police force for空格二。解题你需要注意，它前半句比较复杂，你要看清楚这两个空格，它分别是在说什么东西？你注意它空格二，前面说了一个for它，这个for是跟的谁呢？它跟的是开头的那个reputation。reputation这个词怎么用呢？你可以说a reputation for something就表示有一个具体什么样的名声，所以这道题那个空格二它说的是具体有什么样的名声？所以前半句你怎么翻译呢？翻译过来就是说这个城市的警察队伍，它有一个空格儿的名声，然后这个名声，它特点又是空格儿一。这个名称它有着空格一的特点。然后后半句说，以至于whenever a new police chief takes office，he or she routinely promises to clean up the force。以至于每当有一个新警长上任的时候，他就总是要承诺我要去整顿这个警队。这道题两个空格都比较容易出错，它都有比较容易误选的干扰选项。首先，这道题考的还是soda的前后相同，这样一个因果关系。它题目后半句说，警长总是要承诺去整顿警队，那前半句你就要说什么，肯定这个警队它就需要整顿。我们先来说第二个空格儿，这个警队它有一个什么样的名声，那就意味着它需要警，它就需要整顿了。显然就是这个警队，它有一个不好的名声。所以到选项空格儿，我们肯定要找贬义词，但你看了选项问题又来了，你就会发现d和f它都是不好，那问题来了，你怎么选？这道题最后答案选的是d选项，而不要选那个f选项。为什么不选那个f呢？因为你注意不像我们刚刚说clean up这个整顿它，尤其在道德上去整顿它，整顿的对象得是道德问题。于是你就会发现，缺乏经验，这是不是道德问题啊？这显然不是缺乏经验，这是能力问题，而贪污腐败，这才是典型的道德问题。所以第二空答案选的是d。然后我们再来说第一个空格儿警队，它贪污腐败这个名声，它有什么特点，那就意味着警长总是要承诺去整顿的。你看到选项就会发现a和c好像都挺有道理的。这道题最后答案选的是a选项。为什么不选c选项？因为你注意它题目第三行中间，它说了一个routine里总是要承诺去整顿。你a选项填进去，这个名声始终挥之不去，不管怎么整顿都不好用，所以这个时候你才需要不断的去承诺，我又要整顿。于是你会发现a选项，它就可以对应后边儿那个routine里这个总是，但是c选项它就体现不出这个对应。所以从这一点上来说a它就比c要更好一些，所以最后这道题答案选的是a和d这两个选项。以上这种考法，这个就是soda，它如此怎么样？以至于所以你将来做题也是一样，看到如此怎么样？以至于那么它前后怎么填？就还是照着相同来填就可以了。"}, {"id": 12, "title": "第12讲 · 因果关系（四）：状语——分词状语与主干同义", "intro": "状语是英语里出现最多、用途最广的成分之一（时间/地点/原因/结果/伴随），在填空题里同样是解题线索。本讲先用一道 with 伴随状语入门，然后主攻最典型、考得最多的考法——**分词（ing/ed）引导的状语与句子主干同义**（相当于因果取同）。7 道真题由易到难：代词指代、and 并列、otherwise 取反、双破折号插入语、排除法逐空拆解，外加一条解题纪律——先看相同相反，再看句意。", "cards": [{"type": "teach", "title": "① 状语：被低估的因果线索", "ppt": ["状语可表时间/地点/原因/结果/伴随", "填空里状语常与主干构成同义（相当于因果）", "with 引导伴随状语 → 描述主干的状态 → 与主干相同"], "text": ["状语在英语里出现得非常非常多，用途也广：可以表时间、地点，也可以表原因、结果或者伴随。所以很多时候在填空题里，状语同样可以作为解题线索出现。", "最常见的入门形态是 **with 引导的伴随状语**：它在句子里描述主干的状态，因此和主干意思相同——这实际上就是一种因果取同。下面 47-10 就是教科书。"]}, {"type": "q", "tag": "真题", "title": "习题集 第47页 第10题（六选二）", "source": "with 伴随状语与主干相同", "pause": true, "multi": true, "stem": [{"t": "The concept of the Hellenistic period in ancient history has proved useful, but also ______, with scholars disagreeing on the dates when the period began and ended."}], "vocab": [{"w": "Hellenistic", "g": "希腊化的", "story": "亚历山大东征后希腊文化向外扩散的时期=希腊化时期。解题不用认识。"}, {"w": "slippery", "g": "难以定义、难以理解的（GRE）；滑的（本义）", "story": "slip 滑：地面下雨后很滑；物体太滑→手一抓就跑、抓不住→脑子里抓不住一个概念=难以定义。GRE 爱考引申义。"}, {"w": "elusive", "g": "难以定义、难以理解的；难以捕捉的", "story": "来自动词 elude=e（出）+lud（玩/骗）→逃跑躲避≈escape；引申=使无法获得、使无法理解：This book eludes me=这本书我看不懂；诺贝尔奖始终 elude 村上春树=一直躲着他。"}, {"w": "fruitless", "g": "徒劳的、没有结果的", "story": "fruit+less：不结果→徒劳无功。"}, {"w": "deceptive", "g": "欺骗的、欺骗性的", "story": "来自名词 deception 欺骗。"}, {"w": "futile", "g": "徒劳的、无效果的", "story": "fut=倒/流：倒出去收不回→白费劲。"}, {"w": "compelling", "g": "迷人的、令人欲罢不能的", "story": "com（一起）+pel（推）→推着你往下看=欲罢不能。"}], "options": {"A": "slippery", "B": "elusive", "C": "fruitless", "D": "deceptive", "E": "futile", "F": "compelling"}, "answer": "AB", "explain": {"思路": "①with 引导伴随状语=描述主干的状态→与主干相同；②状语说：学者们对该时期何时开始、何时结束有分歧——而定义一个历史时期的方式，就是说它何时开始、何时结束→说不清起止=这个时期「难以定义」；③选一对 A slippery + B elusive。", "annot": "<span class='m2'>with</span> 伴随状语 <span class='m3'>学者对起止时间 disagreeing 有分歧</span> ⇒ 这个概念<span class='m4'>难以定义 slippery/elusive</span>（与主干相同）。", "辨析": "C fruitless 与 E futile 也是一对同义词（徒劳），是本题最大的坑——但前半句已经说了 useful（有用），再选「没用」就自相矛盾。D deceptive 欺骗性、F compelling 迷人无关。", "点拨": "六选二里同义词对可能不止一对——先过「是否与题干已知信息矛盾」这一关，再动手选。", "词根": ["**slippery**　slip（滑）+ery → 抓不住=难以定义", "**elusive**　e（出）+lus（玩/骗）+ive → 骗你跑掉=难以捕捉/理解（动词 elude）", "**fruitless**　fruit（果实）+less（无）→ 不结果=徒劳", "**futile**　fut（倒/流）+ile → 倒出去收不回=徒劳", "**compelling**　com（一起）+pel（推）+ing → 推着你走=欲罢不能", "**deceptive**　de（下）+cept（拿）+ive → 拿到暗地里=欺骗"], "逻辑": "with 伴随状语描述主干状态 → 与主干相同 → 学者说不清时期的起止时间=时期难以定义 → 空格=难以定义。注意 C/E 这对同义词与 useful 自相矛盾——同义对也要先过矛盾检查。", "翻译": "古代史中「希腊化时期」这个概念已被证明很有用，但也很模糊——学者们对这个时期究竟何时开始、何时结束意见不一。"}}, {"type": "teach", "title": "② 最典型考法：分词引导的状语与主干同义", "ppt": ["分词=现在分词 ing + 过去分词 ed 的统称", "主干前/后出现逗号隔出的分词状语 → 状语与主干意思相同", "相当于因果关系，是填空考得最多的考法之一"], "text": ["所谓分词，就是现在分词（ing）和过去分词（ed）的统称。", "做题时如果发现句子主干的前边或后边（前后都可以），有一个由分词引导、被逗号隔出来的状语，那么它表达的意思与句子主干**相同**——两者相当于一个因果关系。这是填空题里考得最多的几种考法之一，将来做题会反复遇到。"]}, {"type": "q", "tag": "真题", "title": "习题集 第34页 第8题（六选二）", "source": "mixing 现在分词状语与主干同义", "pause": true, "multi": true, "stem": [{"t": "Harper Lee's narration in To Kill a Mockingbird is ______, mixing an adult's and a child's perspective according to no logic other than the immediate exigencies of the plot."}], "vocab": [{"w": "narration", "g": "叙述、记叙", "story": "动词 narrate+ion。"}, {"w": "perspective", "g": "观点、视角", "story": "你看问题看事物的角度。"}, {"w": "plot", "g": "剧情、故事情节", "story": ""}, {"w": "exigency", "g": "需要、要求（紧迫的）", "story": "immediate exigencies=迫在眉睫的需求。"}, {"w": "immediate", "g": "紧迫的（本题）；立即；直接的；紧挨的", "story": "med=middle（medium 媒介=中间的东西，复数 media）：immediate 字面=没有间隔——时间上没间隔=立即；关系上没间隔=直接（immediate cause 直接原因）；空间上没间隔=紧挨着（sit immediately next to Jerry）；需求摆在你面前没人替你挡=紧迫。"}, {"w": "immediacy", "g": "身临其境（名词）", "story": "感官上没有间隔：电视对战争的报道给人 immediacy=仿佛亲身置身战场，没任何人挡在你和战场之间。"}, {"w": "paradigm", "g": "模范、典范", "story": ""}, {"w": "hodgepodge", "g": "混合物、大杂烩", "story": "乱七八糟的东西混到一起，乱炖。"}, {"w": "patchwork", "g": "混合物、拼接物", "story": "patch=打补丁：衣服破了补块新布→把一种布贴到另一种布上→拼接→混合。"}, {"w": "embarrassment", "g": "尴尬", "story": ""}], "options": {"A": "a paradigm", "B": "a hodgepodge", "C": "a model", "D": "an innovation", "E": "a patchwork", "F": "an embarrassment"}, "answer": "BE", "explain": {"思路": "①空格后的 mixing 是现在分词引导的状语→与主干相同；②状语说：把成年人和小孩子的视角混合到一起，且毫无逻辑、只看剧情的紧迫需求→主干空格=「混合」；③选一对 B hodgepodge + E patchwork。", "annot": "<span class='m2'>mixing</span>…分词状语 <span class='m3'>成人视角+小孩视角混在一起、毫无逻辑</span> ⇒ 叙述是<span class='m4'>混合物 hodgepodge/patchwork</span>。", "辨析": "A paradigm 与 C model 都是「模范」——褒义，与状语里「毫无逻辑」矛盾；D innovation 创新、F embarrassment 尴尬无关。", "点拨": "immediate 的一串意思全是「没有间隔」一个词根推出来的——词根法一记记一串。", "词根": ["**immediate**　im（不）+med（中间）→ 没有间隔=立即/直接/紧挨/紧迫", "**immediacy**　immediate 的名词 → 感官无间隔=身临其境", "**hodgepodge**　hodge（杂拌）+podge → 大杂烩", "**patchwork**　patch（补丁）+work → 拼布=混合物", "**exigency**　ex（出）+ig（驱动，act 同源）→ 逼出来的需求=紧迫需要", "**paradigm**　para（旁）+deig（展示）→ 摆在旁边做示范=典范"], "逻辑": "空格后 mixing 分词状语 → 与主干相同 → 状语说两种视角混在一起 → 主干空格=混合。状语在哪，答案就抄哪。", "翻译": "哈珀·李在《杀死一只知更鸟》中的叙述是个大杂烩——把成年人和小孩的视角混合在一起，除了剧情的紧迫需要之外毫无逻辑可言。"}}, {"type": "q", "tag": "真题", "title": "习题集 第4页 第5题（双空题）", "source": "although 转折 + pointing out 分词状语；从句代词指主句", "pause": true, "dual": true, "stem": [{"t": "Although she admitted that her airport expansion plan had recently collapsed, the governor ______ the significance of the failure, pointing out that competing economic development proposals are now more ______."}], "vocab": [{"w": "collapse", "g": "（计划等）失败、崩溃", "story": "本义倒塌；plan collapsed=计划失败。"}, {"w": "governor", "g": "州长", "story": "美国的州长=governor。"}, {"w": "significance", "g": "意义、影响", "story": "接 failure 时不译「重要性」：这个失败所产生的影响。"}, {"w": "competing", "g": "竞争对手的", "story": "来自 compete：字面=构成竞争关系的→competing proposals=对手的提案。≠competitive 有竞争力的。"}, {"w": "minimize", "g": "淡化、轻描淡写（GRE）；最小化（本义）", "story": "mini=小：把大事往小了说——事本身很大很严重，故意说得不严重。GRE 更爱考引申义。"}, {"w": "tout", "g": "宣扬、宣传", "story": ""}, {"w": "acknowledge", "g": "承认", "story": ""}, {"w": "tenuous", "g": "不合理的、站不住脚的", "story": "tenu=细薄：a tenuous argument=论证单薄、让人听了不信服。"}], "options": {"i": {"A": "minimized", "B": "touted", "C": "acknowledged"}, "ii": {"D": "tenuous", "E": "complicated", "F": "important"}}, "answer": "iA,iiD", "explain": {"思路": "①先确定 she 指谁：让步状语从句里的代词一般指主句内容→she=governor（这是位女州长）；②although 转折：从句「承认计划失败」→主句「不想承认失败」→空1=淡化影响 A minimized；③pointing out 分词状语与主干一致：主干=不想承认自己失败→状语=贬低对手抬高自己→空2=说对手方案更差→贬义 D tenuous（更不合理）。", "annot": "空1：<span class='m2'>although</span> <span class='m3'>承认失败</span> → 其实<span class='m4'>不想承认=minimized 淡化影响</span>。空2：<span class='m2'>pointing out</span> 分词状语与主干一致 → 贬对手抬自己：<span class='m4'>对手方案更 tenuous 不合理</span>。", "辨析": "B touted 宣扬、C acknowledged 承认都顺着从句方向走，与 although 转折矛盾；E complicated 复杂、F important 重要都不是贬对手的词。", "点拨": "「我虽然失败了，但对手的方案更烂」=不想认输的标准动作；从句里的代词一律去主句找指代对象。", "词根": ["**minimize**　mini（小）+ize → 往小了说=淡化", "**tenuous**　tenu（细薄）+ous → 单薄无力=站不住脚", "**collapse**　col（一起）+laps（滑/落）→ 一起塌落=崩溃", "**significance**　sign（记号）+ific → 值得标记=意义/影响", "**competing**　com（一起）+pet（追求）→ 争同一个目标=竞争"], "逻辑": "although 转折 → 嘴上说承认、实际不想承认 → 空1=淡化影响；pointing out 分词状语与主干同向 → 贬对手抬自己 → 空2=对手方案更不合理。开头 she 按「从句代词指主句」原则锁定 governor。", "翻译": "尽管这位女州长承认自己的机场扩建计划最近失败了，她却淡化了这次失败的影响，并指出竞争对手的经济发展提案现在看来更加站不住脚。"}}, {"type": "q", "tag": "真题", "title": "习题集 第6页 第3题（双空题）", "source": "suggesting 分词状语统一两空方向 + on the contrary 取反", "pause": true, "dual": true, "stem": [{"t": "Although the political science professor's paper is quite ______ about the government's problems, suggesting that they are part of a ______ process, the prognosis for the government is on the contrary actually quite auspicious."}], "vocab": [{"w": "political science", "g": "政治学", "story": "作为学科的政治学。"}, {"w": "suggest", "g": "暗示；表明、说明", "story": "GRE 不爱考「建议」：说话写文章暗示别人=暗示；数据表明=表明。"}, {"w": "prognosis", "g": "预言、预测", "story": "pro（向前）+gnos（知道）→往前去知道=预言；对比 diagnose：dia（看穿）+gnos→看穿你=诊断（X 光把身体射穿看有没有问题）。"}, {"w": "auspicious", "g": "顺利的、吉利的", "story": "au（鸟）+spic（看）→观鸟占卜吉凶=吉利。"}, {"w": "straightforward", "g": "直接的、直言不讳的", "story": "字面=一直往前→不绕弯。"}, {"w": "circuitous", "g": "迂回的、不直接的", "story": "circ=circle：去掉 -ous 就是 circuit 回路——电路 electric circuit 骨子里就是一个圆圈。"}, {"w": "pessimistic", "g": "悲观的", "story": "不乐观。"}, {"w": "degenerative", "g": "退化的、恶化的", "story": "de（不好）+gen（种类）→属于不好的种类→朝着越来越坏的方向发展。"}, {"w": "comprehensive", "g": "全面详尽的", "story": "comprehend 本义=抓住（≈grasp：用手抓=抓住，用脑抓=理解）；comprehensive 来自本义=全都抓住→该有的全都有。与「理解」差很远。"}, {"w": "spontaneous", "g": "自发的、自主的", "story": "已多次见过。"}], "options": {"i": {"A": "straightforward", "B": "circuitous", "C": "pessimistic"}, "ii": {"D": "degenerative", "E": "comprehensive", "F": "spontaneous"}}, "answer": "iC,iiD", "explain": {"思路": "①suggesting 分词状语对应 although 引导的从句主干→空1与空2大方向相同；②主句有 although 转折+on the contrary：对政府未来的预测 auspicious（非常好）→前面两个空倒过来填=不好；③空1 C pessimistic 悲观、空2 D degenerative 越来越差的过程。", "annot": "<span class='m2'>suggesting</span> 分词状语 ⇒ 空1空2同向；<span class='m2'>although / on the contrary</span> 双重转折：<span class='m3'>未来 auspicious 吉利</span> → 前文=<span class='m4'>悲观 pessimistic + 恶化 degenerative</span>。", "辨析": "A straightforward 直接、B circuitous 迂回都是「说话方式」而非褒贬，与 auspicious 构不成反义；E comprehensive 全面、F spontaneous 自发不贬。两空必须同向且都与 auspicious 相反。", "点拨": "although 与 on the contrary 双重转折互相印证，方向绝不会判错；suggest 在 GRE 里=暗示/表明，不是建议。", "词根": ["**prognosis**　pro（前）+gnos（知道）→ 预言", "**diagnose**　dia（看穿）+gnos（知道）→ 诊断", "**circuitous**　circ（圆圈）+uit+ous → 绕圈=迂回", "**degenerative**　de（不好）+gen（种类）→ 朝着坏种类发展=恶化", "**comprehensive**　com（全）+prehend（抓住）→ 全抓住=全面详尽", "**auspicious**　au（鸟）+spic（看）→ 观鸟兆=吉利", "**spontaneous**　spon（承诺）→ 自己答应自己=自发"], "逻辑": "suggesting 分词状语 → 空1空2同向；although+on the contrary 双重转折 → 未来吉利 ⇒ 前文不吉利 → 空1悲观、空2恶化。", "翻译": "尽管这位政治学教授的论文对政府的问题相当悲观——暗示这些问题是一个不断恶化过程的一部分——但对政府未来的预测却恰恰相反，非常吉利。"}}, {"type": "teach", "title": "③ 解题优先级：先看相同相反，再看句意", "ppt": ["优先考虑相同和相反，而不是句子意思", "只有同反无法唯一确定时，才用句意合理性做裁决"], "text": ["很多同学判断对了空格方向，却因为「填进去句子好像没道理」而排除了正确选项。纪律是：解填空题**优先考虑的永远是相同和相反**，而不是句子意思。", "什么时候才看句意？只有看完相同相反之后发现不足以解题——有不止一个选项都满足方向——这时再仔细看哪个填进去更合理。如果只看同反就已经唯一确定，管它句意合不合理，直接选。下面 27-4 就是这条纪律的实战。"]}, {"type": "q", "tag": "真题", "title": "习题集 第27页 第4题（双空题）", "source": "suggesting 分词状语 + and 并列取同；优先级实战", "pause": true, "dual": true, "stem": [{"t": "Scholarly works on detective stories often begin with ______, suggesting that there is something vaguely wrong with adults who spend their time reading such fiction and certainly something ______ those who devote energy to its analysis."}], "vocab": [{"w": "detective stories", "g": "侦探小说", "story": "detective=侦探。"}, {"w": "vaguely", "g": "有一点、某种程度上", "story": "=somewhat；vague 模糊→「我模模糊糊觉得该选 A」=我有点觉得该选 A。"}, {"w": "devote energy to", "g": "投入精力做", "story": "=spend；devote time/energy to sth。"}, {"w": "chronologies", "g": "发展史、大事年表", "story": "chron=时间：按时间顺序把重大事件挨个罗列（如 GRE 考试哪年诞生、哪年大改）。字典译「编年史」——不知道什么是编年史就别那么记。"}, {"w": "apologies", "g": "道歉（复数）", "story": "来自你无比熟悉的 apologize。"}, {"w": "synopses", "g": "剧情简介、剧情梗概（复数）", "story": "单数 synopsis（-es→-is）：简单概括一个作品的故事情节。"}, {"w": "awry", "g": "错误的、有问题的", "story": ""}, {"w": "astute", "g": "机敏的、精明的", "story": "脑子很机灵很灵光的状态。"}, {"w": "courageous", "g": "勇敢的", "story": "cour/cor=heart：core 字面=心→核心；courage 字面=心→勇气（汉语也说「大心脏」=勇敢、「小心脏吓坏」=胆小）。"}], "options": {"i": {"A": "chronologies", "B": "apologies", "C": "synopses"}, "ii": {"D": "awry", "E": "astute", "F": "courageous"}}, "answer": "iB,iiD", "explain": {"思路": "①空2靠 and 并列：前面「读这种小说的成年人 something vaguely wrong」→并列前后相同→空2=wrong→D awry；②空1靠 suggesting 分词状语与主干相同：状语说「这样做有问题」→以什么开始能体现 wrong→唯一与错有关的是 B apologies（只有做错了事才需要道歉，道歉=承认自己错了）。", "annot": "空2：<span class='m2'>and</span> 并列 <span class='m3'>something vaguely wrong</span> ⇒ <span class='m4'>awry 有问题</span>。空1：<span class='m2'>suggesting</span> 状语与主干相同：<span class='m3'>暗示这样做有错</span> ⇒ 以<span class='m4'>道歉 apologies</span>（=承认有错）开头。", "辨析": "错题重灾区：不少人判断出空1要填「与错有关」，却觉得「一上来先给读者道歉没道理」而排除 B，转而在 A/C 里胡选——A 发展史、C 剧情简介都与「错」无关。句意其实是通的：侦探小说在文坛地位很低、登不了大雅之堂，本是写给小孩子看的；你作为心智健全的成年人不光读，还给它写学术研究——文学研究本该研究有文学价值的作品——自知研究「比较 low」，出于自卑心虚，只好一上来先道歉「大家多担待」。", "点拨": "相同相反唯一确定时，句意合不合理都不用管——优先级纪律救了这道题。", "词根": ["**chronology**　chron（时间）+logy → 按时间排列的记录=发展史", "**synopsis**　syn（一起）+ops（看）→ 放在一起看=梗概", "**astute**　astu（机敏）→ 精明", "**courageous**　cour（心，core 同源）+age+ous → 有颗大心脏=勇敢", "**awry**　a+wry（歪）→ 歪了=出错"], "逻辑": "空2：and 并列取同 → wrong → awry；空1：suggesting 分词状语与主干同义 → 要体现「错」 → 只有「道歉」与错有关（做错才道歉）。只看同反即可唯一确定，无需句意。", "翻译": "研究侦探小说的学术著作常常一上来先道歉——这暗示着成年人花时间读这类小说多少有些不对，而那些花精力去分析它的人则肯定更有问题。"}}, {"type": "q", "tag": "真题", "title": "习题集 第28页 第5题（双空题）", "source": "forced to 过去分词状语 + 空格修饰对象（工会≠老板）", "pause": true, "dual": true, "stem": [{"t": "Due to the extraordinary circumstances, British business owners found themselves in a ______ position during the Second World War, forced to accept interference from the government and to acquiesce to a ______ role for labor unions in negotiating the terms and conditions of employment."}], "vocab": [{"w": "extraordinary", "g": "异常的、反常的；非凡的", "story": "extra（超出）+ordinary→超过平常的限度=不正常（本是中性词）；褒义「非凡」是引申出来的。"}, {"w": "interference", "g": "干预、干涉", "story": "管自己不该管的闲事。"}, {"w": "acquiesce", "g": "默许", "story": "qui=quiet：字面=沉默不说话→以沉默的方式表示许可=默许（监考老师听你问能否打小抄，转身就走再也不来=默许）。"}, {"w": "labor union", "g": "工会", "story": "企业里的工会。"}, {"w": "defensive", "g": "被动防守的、处于守势的", "story": "来自 defense 防御→处于守势、四面楚歌的境地。"}, {"w": "dominant", "g": "占主导地位的", "story": ""}, {"w": "customary", "g": "约定俗成的", "story": "custom 习俗→沿袭习俗的。"}, {"w": "traditional", "g": "传统的", "story": ""}, {"w": "enhanced", "g": "提高的、增强的", "story": ""}, {"w": "diminished", "g": "减小的、降低的", "story": "diminish 动词=减小下降→+d 变形容词。"}], "options": {"i": {"A": "defensive", "B": "dominant", "C": "customary"}, "ii": {"D": "traditional", "E": "enhanced", "F": "diminished"}}, "answer": "iA,iiE", "explain": {"思路": "①forced to 是过去分词引导的状语→与主干一致：状语说「不得不接受政府干预」——看到「不得不」就知道是在接受自己不喜欢的东西=混得不好→空1 A defensive（被动挨打、四面楚歌）；②空2 前面有 and 与前文同向，但注意它修饰的是工会的 role，不是企业主的：工会与老板是死对头→老板混得不好⇒工会混得好→E enhanced。", "annot": "空1：<span class='m2'>forced to</span> 分词状语 <span class='m3'>不得不接受干预=混得不好</span> ⇒ <span class='m4'>defensive 被动防守</span>。空2：空格修饰<span class='m3'>工会的 role</span>（老板的死对头）→ 老板惨 ⇒ 工会<span class='m4'>enhanced 地位提高</span>。", "辨析": "空2 易错选 F diminished——觉得「混得不好=地位下降」？下降的是老板，空格修饰的是工会：方向要对，对象更要对。B dominant 与「不得不」矛盾；C customary、D traditional 没有方向。", "点拨": "常识也是线索：西方工会=工人抱团跟老板讨价还价（单枪匹马谈加薪，老板随时换人；全厂一起罢工，大家都没钱赚，老板才怕）→老板最讨厌工会。死对头一方惨，另一方必爽。", "词根": ["**extraordinary**　extra（超出）+ordinary → 超出寻常=异常/非凡", "**interference**　inter（之间）+fer（打/带）→ 插手进来=干预", "**acquiesce**　ac+qui（安静，quiet 同源）+esce → 沉默=默许", "**defensive**　de（离开）+fens（打）→ 挡住打击=防守", "**diminished**　di+min（小）→ 变小=降低", "**customary**　custom（习俗）+ary → 约定俗成"], "逻辑": "forced to 过去分词状语与主干同义 → 不得不接受干预=混得不好 → 空1=被动防守；空2 修饰工会的 role，工会与老板是死对头 → 老板惨⇒工会好 → enhanced。方向+修饰对象，缺一不可。", "翻译": "由于情况特殊，英国的企业主们在二战期间发现自己处于被动防守的境地——不得不接受政府的干预，并在雇佣条款谈判中默许工会扮演更重要的角色。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第60页 第4题（三空题）", "source": "排除法 + otherwise 取反 + attacking 分词状语（双破折号插入语）", "pause": true, "triple": true, "stem": [{"t": "The notion of film producers as the ogres of the movie business has proved an ______ one, but according to The Producers by Tim Adler, it is not always grounded in reality. Attacking what he calls the auteur myth — the idea of the director as the only purveyor of art in the industry, otherwise peopled with ______ — he places at the heart of his book an image of the producer, not the director, as the primary ______ force in the development and production of a movie."}], "vocab": [{"w": "notion", "g": "思想、观念、想法", "story": "同义词=idea。"}, {"w": "producer", "g": "制片人、监制", "story": "电影片头「监制谁谁谁」就是他：项目发起人，最重要的工作是拉投资。"}, {"w": "ogre", "g": "坏人、可怕的人", "story": "本义童话/神话里的食人魔→引申为坏人。"}, {"w": "grounded in reality", "g": "符合现实", "story": "ground 地面→基础；建立在现实的基础之上=与现实相符。"}, {"w": "auteur", "g": "（法语）电影导演", "story": "解题不用认识。"}, {"w": "myth", "g": "谣言、大众普遍持有的错误观念（GRE）；神话（本义）", "story": "大家都以为对、其实不对的说法：如「板蓝根预防感冒」。关键词=大众普遍持有。"}, {"w": "purveyor", "g": "提供者", "story": "=provider 的变形写法。"}, {"w": "otherwise", "g": "除此之外（熟词僻义）", "story": "≠否则：an otherwise totally black cat with four white feet=除了四只白脚之外全身都是黑的猫。"}, {"w": "peopled with", "g": "充满…的人", "story": "people 作动词。"}, {"w": "accurate", "g": "准确的", "story": ""}, {"w": "idiosyncratic", "g": "独特的、个人特有的", "story": "idio=与众不同；同根词 idiot 字面=跟正常人不一样的人→笨蛋。"}, {"w": "enduring", "g": "长久的、长期以来的", "story": "存在了很长时间的。"}, {"w": "visionaries", "g": "梦想家", "story": "vision 视野/对未来的宏大愿景：乔布斯推出 iPhone 前手机只比抗摔，他对行业未来的愿景=vision→visionary=高瞻远瞩的人。"}, {"w": "profit mongers", "g": "逐利者", "story": "monger=小贩：fishmonger 鱼贩、warmonger 战争贩子→profit monger 贩卖利益的人=追逐利益的人。"}, {"w": "innocents", "g": "无辜的人", "story": "形容词 innocent 无辜的→名词无辜者。"}, {"w": "financial", "g": "财务的、金钱的", "story": ""}, {"w": "inertial", "g": "没有活力的", "story": "inertia 惯性/惰性 在攻击前面儿那个说法。于是我们就知道，空格三就应该再填一个搞艺术，那哪一个搞艺术最后I选项就是搞艺术。所以最后这道题答案选的是c1和I，这三个选项。这道题最后想说的是个什么意思呢？就是首先像题目说的一样，我们平时基本都会有这样一种看法，就是我们觉得电影拍的好坏取决于谁，最关键的就是取决于那个导演。制片人重不重要？制片人不重要。电影制片人或者说监制他是干什么工作的？首先，监制他是整个拍电影这个项目的最终发起人。而拍电影最离不开的就是钱，所以监制它最重要的一个工作就是拉投资。你就比如有一些制片人，他自己就很有钱，他就可以自己投资，他如果自己没有钱怎么办？他就可以找一些有钱人，比如到处叫爸爸，就说爸爸们，我要拍电影儿了，给我投点儿钱呗。他到处去拉投资。所以你就会发现，他作为一个投资人或者拉投资的人，那么他做这个事情最追求什么追求的，当然就是利益追求的就是金钱的回报，追求的就是profit。所以平时克拉玛可能就会觉得制片人他就在乎钱，管你电影儿拍的好坏，能赚钱就行，导演才是真正搞艺术的人。但是这道题就告诉你，其实实际上并不是如此。为什么这么说呢？就是为什么导演他不一定最终可以决定片子艺术上的质量。首先，你想导演和制片人什么关系啊？制片人相当于是老板，导演是制片人雇的，导演是制片人雇来打工的。制片人，他的工作除了拉投资之外，还有很关键的一项，就是选导演。于是你比如说现在电影儿拍了一半儿，现在导演和制片人艺术上产生了分歧，导演觉得这片子我要这么拍。制片人他说应该那么拍。那这个时候你觉得最后谁说了算，肯定应该是制片人说了算，为啥因为制片人是老板？所以你想如果这个导演不听话，我不同意，我非要这么拍，那你作为制片人可以怎么办？你就可以把导演炒了鱿鱼，你重新再换一个听话的导演来。于是你就会发现，制片人和导演产生分歧的时候，最后永远是制片人说了算，所以制片人他在艺术上懂还是不懂？那对电影最终的影响也很大。如果这个制片人他艺术上完全不懂成天在那胡乱瞎指挥，导演那导演再好也没有用，因为他只能去听制片人的。反过来你像还很多时候有什么样的例子，比如一个电影导演，他是一个新锐导演，没什么经验，但是他那个制片人可能自己之前也是大导演出身，后来有了钱了，开始做制片人。那这个时候制片人他就可以给这个新锐导演很多的指导，所以即便这个导演本身没什么经验，他在制片人的帮助之下，最后这个电影也可以拍的非常非常的好。所以最后题目想告诉你，就是电影拍的好坏，不是说只看导演就够了，制片人很多时候也很重要，甚至有些时候他有可能更重要。所以像以上这种考法，这个就叫分词引导的状语，你将来做题的时候还会反复遇到这种考法，这是填空题考的最多的几种考法之一，所以你将来做题也是一样，你看到这种句子主干前后它有逗号，隔出来了一个，现在分词或者过去分词引导的状语。这样的结构，那么这个状语部分，它和句子主干部分表达的意思就应该是相同。好，我们这一部分就到这里。"}, {"id": 13, "title": "第13讲 · 因果关系（五）：目的手段与「不因为」的取同——因果系列收官", "intro": "因果关系系列最后一讲，处理三种最容易想反的考法：**目的与手段**（by / to / in order to，骨子里是「因为有目的，所以采取手段」）、**does not mean that**（不意味着，前后居然相同）、**not because**（不是因为，前后还是相同）。8 道真题：从「设目标然后盲目遵守」的自我束缚、同行评议如何保证公正客观、Clark 表面服从背后捅刀的三空题、检察官的「问不到点子上≠不强硬」经典辨析、古生物学家与 specious distinctions 的 disprove/belie 之争、州长「理想主义」包装的自私动机，到摄影师专拍丑地方的 does not mean that，以及焚烧炉公投的 not because。结尾收束整个因果系列。", "cards": [{"type": "teach", "title": "① 目的与手段：by / to / in order to → 前后相同", "ppt": ["by / to / in order to 表目的或手段 → 前后相同", "骨子里是因果：因为有什么目的，所以采取什么手段"], "text": ["做题时看到明显表目的和手段的词——**by**（通过/凭借）、**to**、**in order to**（为了）——它前后也是**相同**的。", "为什么相同？目的和手段骨子里是什么关系？其实就是**因为你有什么目的，所以你才采取什么手段**——骨子里就是因果关系，前后自然相同。所以看到 by 之后的手段是好事，by 之前也得是好事；手段是坏事，前面也得是坏事。"]}, {"type": "q", "tag": "真题", "title": "习题集 第121页 第7题（六选二）", "source": "by 表手段：手段是坏事→前面也是坏事", "pause": true, "multi": true, "stem": [{"t": "Individuals, governments, and companies show ample ability to ______ themselves by setting goals based on current conditions and then blindly following them, even when those conditions change drastically."}], "vocab": [{"w": "ample", "g": "大量的、多的", "story": "数量很大都可以叫 ample。"}, {"w": "drastically", "g": "巨大地、剧烈地", "story": "change drastically=发生巨大/剧烈的变化。"}, {"w": "hamstring", "g": "妨碍、束缚", "story": "ham（火腿）+string（线/绳）：字面=腿上的筋。名词本义=腿筋，做动词=挑断某人的腿筋→腿筋断了再也走不了路→妨碍、束缚。"}, {"w": "reinvent", "g": "重新发明、再次发明", "story": "re（再）+invent（发明）。"}, {"w": "promote", "g": "推动、促进", "story": ""}, {"w": "revitalize", "g": "使复苏、使复兴", "story": "来自 vital。vit=life 生命（vitamin 维生素：vit 生命+-in 微量元素/药物=生命活动所需的微量元素）。vital 字面=与生命相关的→引申义①有活力的②至关重要（生命很重要）；vital signs=生命体征（医生抢救时看的呼吸、脉搏、瞳孔反应）。revitalize=让它重新充满活力→人病愈恢复活力、消失的传统重新流行，都叫 revitalize。"}, {"w": "impair", "g": "破坏、削弱、妨碍", "story": "im+pair：使变「次」（pair 一对→配不上对=变差）。"}, {"w": "invigorate", "g": "使充满活力", "story": "中间 vigor 本身就是单词=活力：让人充满活力。"}], "options": {"A": "hamstring", "B": "reinvent", "C": "promote", "D": "revitalize", "E": "impair", "F": "invigorate"}, "answer": "AE", "explain": {"思路": "①第一行最后的 by 表手段：他们如何展现能力？通过「基于目前情况设定目标，然后盲目遵守，即使情况早已剧变」；②手段显然是**坏事**（情况变了还盲目执行旧目标）→目的手段前后相同→by 之前的能力也得是**坏能力**，空格对自己做的事必须是坏事；③选项里找两个贬义动词：A hamstring（束缚自己）+ E impair（损害自己）。", "annot": "<span class='m2'>by</span> <span class='m3'>盲目遵守过时目标（坏事）</span> ⇒ 空格=<span class='m4'>对自己做坏事 hamstring/impair</span>。", "辨析": "C promote 促进、D revitalize 复兴、F invigorate 使有活力全是好事，方向相反；B reinvent 重新发明与「束缚/损害自己」无关。", "点拨": "目的手段题=先读 by 之后的手段，判断好事坏事，再让前面同向。句子再长，定性（好/坏）一句话就够。", "词根": ["**hamstring**　ham（火腿）+string（绳）→ 腿筋 → 挑断腿筋=妨碍束缚", "**revitalize**　re（再）+vit（生命，vitamin 同源）+al+ize → 重获活力=复苏", "**invigorate**　in+vigor（活力）+ate → 注入活力", "**impair**　im（使）+pair → 使变差=削弱", "**reinvent**　re（再）+invent（发明）→ 重新发明"], "逻辑": "抓 by → 手段「情况剧变仍盲目执行旧目标」是坏事 → 目的手段前后相同 → 空格=对自己做坏事 → hamstring/impair。", "翻译": "个人、政府和公司都展现出大量束缚自己的能力：他们根据当前情况设定目标，然后盲目地遵守这些目标——即使情况早已发生了巨大的变化。"}}, {"type": "q", "tag": "真题", "title": "习题集 第37页 第8题（六选二）", "source": "to ensure 表目的：手段→目的相同", "pause": true, "multi": true, "stem": [{"t": "In mathematics, judgments about the validity of proofs are mediated by peer-reviewed journals. To ensure ______, reviewers are carefully chosen by journal editors, and the identities of scholars whose papers are under consideration are kept secret."}], "vocab": [{"w": "validity", "g": "正确性、有效性", "story": "来自 valid（正确的/有效的）：有效期=valid date；ETS 官网说你的成绩 is valid for 5 years（GRE 成绩有效期五年）。"}, {"w": "be mediated by", "g": "通过…来实现", "story": "词根 med=中间：medium 媒介。做别人的媒介→帮助别人实现某事。"}, {"w": "peer-reviewed journal", "g": "同行评议期刊（=学术期刊）", "story": "判断期刊是不是学术期刊的标准=是否采用同行评议：非学术期刊（如《读者》）由编辑决定发不发；学术期刊的编辑只能决定「不发谁」（看稿件是否符合定位），无权决定「发谁」——他要从全世界找两个同领域大牛审稿，两个大牛都说好才发。物理学文章由其他物理学家（同行）定生死，所以叫同行评议。"}, {"w": "ensure", "g": "保证", "story": "字面=make sure，来自 sure。"}, {"w": "reviewer", "g": "审稿人", "story": "给学术期刊审稿的人。"}, {"w": "timelessness", "g": "永恒", "story": "**不是没有时间去死**——timeless art=永恒的艺术。"}, {"w": "originality", "g": "创新、新颖", "story": "original 你背过的是「原始/原创」，但考试爱考引申义「创新的/新颖的」：你是第一个做出某种发明的人→之前没人做过→当然新颖。名词 originality=创新。"}, {"w": "comprehensiveness", "g": "全面、详尽", "story": "该有的全都有、该包含的全包含在内。"}, {"w": "objectivity", "g": "客观", "story": "object 物体→客观的。"}, {"w": "novelty", "g": "新颖、新奇", "story": "词根 nov=new（innovate 让东西变新=创新）。novel 字面=新的；novelty=新。novel 为什么后来=小说？小说这个文体出现得晚（中国明朝才流行，西方中世纪末期才出现），形式上新颖；而且西方古代讲故事靠长篇叙事诗，内容无非史诗（荷马《伊利亚特》写特洛伊战争）和宗教神话（但丁《神曲》）——全是耳熟能详的老故事；而小说的人物情节全是现编的、全新的。形式新+内容新，欧洲人索性叫它「新文体」=novel。"}], "options": {"A": "timelessness", "B": "originality", "C": "fairness", "D": "comprehensiveness", "E": "objectivity", "F": "novelty"}, "answer": "CE", "explain": {"思路": "①第二行开头 to ensure ______ 是典型的表目的的说法→目的与后半句的手段相同；②手段=审稿人由编辑仔细挑选+被审稿人身份保密；③身份保密导致什么结果？审稿时不知道稿子是谁写的→避免裙带关系→保证的是**公正和客观**：C fairness + E objectivity。", "annot": "<span class='m2'>to ensure</span> 表目的 ⇒ 与手段相同：<span class='m3'>审稿人精挑+作者身份保密（避免裙带关系）</span> ⇒ <span class='m4'>公正+客观 fairness/objectivity</span>。", "辨析": "A timelessness 永恒（不是没有时间去死）；B originality/F novelty 都是「创新」——保密与创新无关，是一对凑数的同义词；D comprehensiveness 全面，身份保密管不到「全面」。", "点拨": "目的手段题的关键：手段能「导致」什么结果，目的就是什么。身份保密→不知作者是谁→没法偏心→公正客观，链条一步接一步。", "词根": ["**validity**　val（强/值，value 同源）+id → 有效=正确", "**mediate**　med（中间，medium 同源）+ate → 做媒介=促成实现", "**originality**　origin（起源）+al+ity → 原创的→创新的", "**comprehensiveness**　com（一起）+prehend（抓）→ 全抓住=全面", "**novelty**　nov（新，innovate 同源）+el+ty → 新颖", "**objectivity**　ob（对）+ject（扔）→ 扔到对面的东西=客体→客观"], "逻辑": "to ensure 表目的 → 与手段相同：审稿人精心挑选、作者身份保密 → 不知道谁写的就没法徇私 → 保证公正与客观。", "翻译": "在数学领域，对一个证明是否正确的判断是通过同行评议期刊来实现的。为了保证公正客观，审稿人由期刊编辑精心挑选，且稿件在审的学者的身份会被保密。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第16页 第6题（三空题）", "source": "同位语定空3 + veil 表面/实际相反定空2 + 空1 倒推", "pause": true, "triple": true, "stem": [{"t": "Those who took Clark's old-mannered compliance for obsequiousness ______ him: his apparent ______ veiled a fervent ______ of the authority that others exercised over him, one that he occasionally expressed by discreetly sabotaging their most important projects."}], "vocab": [{"w": "old-mannered", "g": "古板的、守旧的", "story": "old+mannered：老派做派。"}, {"w": "compliance", "g": "服从、遵守", "story": "动词 comply。"}, {"w": "obsequiousness", "g": "奉承、拍马屁、谄媚", "story": "词根 sec/sequ=跟随 follow（sequence 序列=一个跟着一个；second 第二个=跟在第一个后面的）。字面=跟随别人→跟屁虫→谄媚拍马屁。"}, {"w": "take A for B", "g": "把 A 当做 B", "story": "整句第一行就是这个大词组。"}, {"w": "apparent", "g": "明显的；表面上的（熟词僻义）", "story": "本题考第二个意思=表面上的。"}, {"w": "veil", "g": "隐藏、掩盖、掩饰", "story": "名词=面纱（脸上蒙的纱）；蒙层面纱当然就藏起来→动词=掩盖。"}, {"w": "fervent", "g": "狂热的、热情的、热烈的", "story": ""}, {"w": "exercise", "g": "使用、行使（熟词僻义）", "story": "不是锻炼/练习：exercise authority=行使权威。"}, {"w": "discreetly", "g": "偷偷地、不明显地", "story": "occasionally 偶尔 + discreetly 偷偷=偶尔偷偷干。"}, {"w": "sabotage", "g": "蓄意破坏", "story": "故意破坏别人的东西。"}, {"w": "misconstrue", "g": "误解", "story": "construe=理解（同义词 understand）→mis+construe=misunderstand。"}, {"w": "cynicism / cynical", "g": "怀疑人性（≠愤世嫉俗）", "story": "**所有英汉字典都翻译成「愤世嫉俗」，这是完全理解错了**。cynical=不相信世界上有好人，觉得所有人骨子里都只为自己考虑：看到有钱人做慈善（比如比尔盖茨捐财产），正常人觉得无私博爱，cynical 的人嗤之以鼻「切，就是为了出名」——这种态度既没有「愤」也没有「嫉」，所以正确翻译=怀疑人性。"}, {"w": "acquiescence", "g": "同意、默许", "story": "来自 quiet（平静安静）→安安静静地接受=默许。"}, {"w": "intractability", "g": "不听话、不服管", "story": "tract=拖拉拽 draw：attract 拽过来=吸引；distract（dis 分开）把注意力拽开=使分心；tractor 拖拉机。tractable 本形容牲口温顺——放牛时绳子一拽就跟你走=能拽得住=听话；形容人也行。in+tractable=不听话。"}, {"w": "veneration", "g": "尊敬（尤指高度尊敬）", "story": "特别特别尊敬别人。"}, {"w": "justification", "g": "理由、合理性", "story": "一件事做起来是否正当、是否有道理。"}, {"w": "detestation", "g": "厌恶、反感", "story": "动词 detest。"}], "options": {"i": {"A": "misconstrued", "B": "condemned", "C": "respected"}, "ii": {"D": "cynicism", "E": "acquiescence", "F": "intractability"}, "iii": {"G": "veneration", "H": "justification", "I": "detestation"}}, "answer": "iA,iiE,iiiI", "explain": {"思路": "倒着做，先空3。第三行 one that he occasionally expressed… 中的 one 指谁？定语从句说这东西「Clark 偶尔能表现出来」→必须是 Clark 身上的特点→只能是空3。整个第三行是名词性成分=同位语，解释空3：它如何表现？by discreetly sabotaging（偷偷破坏他们最重要的计划）→背后捅刀子→对在他头顶上行使权威的人是**不喜欢**→I detestation。空2：veil（掩盖）前后必须相反——表面和实际不一样才谈得上掩盖（veil 是表变化差异的实义动词）→空3是不喜欢权威→表面上就得**喜欢/同意**权威→E acquiescence（默许）。空1：看完全题，Clark 表面服从、背后捅刀，显然**不是**拍马屁的人→把他当马屁精的人就是**看错/误解**了他→A misconstrued。", "annot": "空3：同位语 <span class='m3'>one that… discreetly sabotaging 偷偷破坏</span> ⇒ 对权威<span class='m4'>狂热地厌恶 detestation</span>。空2：<span class='m2'>veil 掩盖</span> 前后相反 ⇒ 表面<span class='m4'>默许 acquiescence</span>。空1：Clark 不是马屁精 ⇒ 这帮人<span class='m4'>误解 misconstrued</span> 了他。", "辨析": "空1：B condemned（谴责）和 C respected（尊敬）都预设这帮人「看对了」Clark——但题目后半句证明他们看错了，只能选误解。空2：F intractability（不服管）与 veil 的方向相反（不服管才是真性情，谈不上「表面」）。空3：G veneration（尊敬）方向反了——偷偷破坏别人计划的人不可能尊敬对方。", "点拨": "三空题不必从空1做起：谁有同位语/从句解释就先做谁。本题突破口是认出第三行 one that…=同位语，直接锁死空3。", "词根": ["**obsequiousness**　ob+sequ（跟随，sequence/second 同源）→ 跟屁虫=谄媚", "**misconstrue**　mis（错）+construe（理解）→ 误解", "**acquiescence**　ac+qui（安静，quiet 同源）+escence → 安静接受=默许", "**intractability**　in（不）+tract（拉，tractor/attract 同源）→ 拽不动=不服管", "**veneration**　vener（敬，Venus 同源）→ 崇敬", "**detestation**　de+test（见证）→ 不愿为之作证=厌恶"], "逻辑": "突破口=第三行 one that… 是同位语，解释空3：偷偷破坏=厌恶权威；veil 掩盖 ⇒ 表面与实际相反 ⇒ 空2=表面默许；读完全句知 Clark 并非马屁精 ⇒ 空1=误解。同位语定空3、相反定空2、全文定空1，倒着做最快。", "翻译": "那些把 Clark 古板的服从当成谄媚的人误解了他：他表面上的默许，掩盖着对他人强加于他的权威的一种强烈的厌恶——这种厌恶偶尔会通过偷偷破坏他们最重要的计划表现出来。"}}, {"type": "q", "tag": "真题 · 易错", "title": "习题集 第58页 第5题（双空题）", "source": "belie+by 手段：「问不到点子上」≠不强硬", "pause": true, "dual": true, "stem": [{"t": "The prosecutor belied his hard-boiled reputation by submitting ______ queries to the witness and accepting in turn ______ responses."}], "vocab": [{"w": "prosecutor", "g": "检察官、公诉人", "story": "代表政府起诉违反刑法的人的人。解题只需知道是个人。"}, {"w": "belie", "g": "①掩盖、掩饰 ②违背、与…不一致/不相符", "story": "原型 belie，过去式/过去分词直接+d=belied。来自 lie（躺）：躺在别的东西上面→把它盖住了→掩盖。两个意思骨子里一致：「常年背单词的小明今年只有20岁，但他光秃秃的头顶 belied 他的实际年龄」——既可译成秃头**掩盖了**实际年龄，也可译成秃头**与**实际年龄**不相符**（20岁不该秃）。"}, {"w": "hard-boiled", "g": "强硬的、强悍的", "story": "本形容煮鸡蛋：煮得特别熟、里面全煮硬了=hard-boiled→心很硬→形容人态度强硬。"}, {"w": "submit", "g": "提交", "story": "网站上填完表单点的「提交」=submit。"}, {"w": "query", "g": "问题、询问", "story": ""}, {"w": "witness", "g": "证人、目击者", "story": "法庭上的证人。"}, {"w": "in turn", "g": "接下来、随后（熟词僻义）", "story": "中学学过「轮流」，本题考「接下来/随后」。"}, {"w": "innocuous", "g": "无害的（生理+心理）", "story": "生理无害：innocuous gas 无害气体；心理无害=不得罪人、不引人反感=「人畜无害」——一部电影老少皆宜、谁看了都不会不舒服。"}, {"w": "quizzical", "g": "感到又奇怪又好笑的、诧异的", "story": "来自 quiz 小测验：小测验就是为了把你考蒙→考蒙之后又惊讶又奇怪。期末考试考完正准备放假，老师把全班召集回来「闲着也是闲着，再来做个小测验」——你又觉得奇怪又觉得好笑的状态=quizzical。"}, {"w": "impertinent", "g": "不重要的、没有意义的", "story": "=irrelevant：与手头讨论的话题完全无关。"}, {"w": "evasive", "g": "含糊其辞的、推诿搪塞的（引申义）；逃跑的（本义）", "story": "词根 vad/vas=go 走：invade 走进来=入侵（invasive species 入侵物种）；evade=走出去→打不过就跑=逃跑。引申形容言论=逃避别人的问题、不正面回答、顾左右而言他：考完试回家吃饭，你妈问「考得怎么样」，你说「吃饭吃饭」=an evasive answer。"}, {"w": "elaborate", "g": "详细的、详尽的；精美的（艺术品）", "story": "e+labor：下了功夫。形容艺术品=精细；形容文章/描写=内容多=详尽。"}, {"w": "informative", "g": "信息丰富的、富含有用信息的", "story": "充满有用的 information。"}], "options": {"i": {"A": "innocuous", "B": "quizzical", "C": "impertinent"}, "ii": {"D": "evasive", "E": "elaborate", "F": "informative"}}, "answer": "iA,iiD", "explain": {"思路": "belie（违背）强硬的名声→by 之后的手段必须是「不强硬」的事。空2 先做：证人 evasive（含糊其辞）他居然直接接受→不强硬→D。命案现场版：小明是嫌犯、小红是证人，你问小红「人是不是小明杀的」，小红顾左右而言他「小明是好人，学习好品德好，每天扶老奶奶过马路」——强硬的人必然追问到底「我没问他是不是好人，到底人是不是他杀的？」；而证人含糊其辞你居然接受=一点都不强硬。空1 极难，A 和 C 似乎都对：A innocuous=专挑不得罪人的问题问→骨子里怕得罪人、不敢得罪人→确实不强硬，没问题；C impertinent=问不到点子上→**不一定**不强硬，也可能是智商不够。麦当劳版：小红说「昨晚八点我俩在吃麦当劳，我一顿吃了五个巨无霸撑死我了」，你追问「正常人三个就撑死了，你必须说清楚怎么吃的五个」——态度极其强硬，但问题完全没问到点子上。**问不问得到点子上与强硬与否没有必然联系**→选 A。", "annot": "<span class='m2'>belied</span> <span class='m3'>hard-boiled reputation 强硬名声</span> + <span class='m2'>by</span> 手段 ⇒ 手段=不强硬：专问<span class='m4'>不得罪人的 innocuous</span> 问题 + 接受<span class='m4'>含糊其辞的 evasive</span> 答复。", "辨析": "空1 大坑 C impertinent（问不到点子上）：问不到点子上有两种可能——不敢问（不强硬）或想不到（智商不够），与强硬无必然联系；A innocuous（不得罪人）只能指向「不敢得罪人」=必然不强硬。空2：E elaborate 详尽、F informative 信息丰富，接受这样的答复恰恰显得专业，不构成「不强硬」。", "点拨": "「X 不强硬」要选**必然**推出不强硬的选项：怕得罪人→必然不强硬；问不到点子上→可能不强硬也可能笨。GRE 永远在考「必然 vs 可能」。", "词根": ["**belie**　be+lie（躺）→ 躺在上面=掩盖→与…不符", "**innocuous**　in（不）+noc（害，noxious 同源）→ 无害", "**evasive**　e（出）+vas（走，invade 同源）→ 逃走→（言论）含糊其辞", "**impertinent**　im（不）+pertinent（相关的）→ 不相关=不重要", "**quizzical**　quiz（小测验）+ical → 被考蒙的=诧异好笑"], "逻辑": "belie 违背强硬名声 + by 表手段 → 手段必须不强硬：空2 接受含糊其辞的答复=不追问=不强硬；空1 在 innocuous 与 impertinent 之间，只有「怕得罪人」必然推出不强硬，「问不到点子上」还可能只是笨 → innocuous。", "翻译": "这位检察官向证人提出无关痛痒的问题，并随之接受含糊其辞的答复——这与他强硬的名声完全不符。"}}, {"type": "q", "tag": "真题", "title": "习题集 第96页 第2题（单空题）", "source": "specious 锁死 disprove/belie 辨析", "pause": true, "stem": [{"t": "The paleontologist examined the problem afresh, believing that the accepted classification ______ the essential continuity of the specimens by making specious distinctions among them."}], "vocab": [{"w": "paleontologist", "g": "古生物学家", "story": "研究恐龙之类古代生物的人；看过《老友记》的都熟——Ross 就是个 paleontologist，成天研究恐龙。解题只需知道是个人。"}, {"w": "afresh", "g": "重新地、全新地", "story": "来自 fresh（全新的）。"}, {"w": "continuity", "g": "连续性", "story": "来自 continue。"}, {"w": "specious", "g": "虚假的、不成立的、欺骗性的", "story": "**别记字典的「似是而非」**——记「表面看上去是、实际是假的不成立」（第8讲已强调）。"}, {"w": "distinction", "g": "区别、不同", "story": "make distinctions among them=在它们之间指出区别。"}, {"w": "disprove", "g": "证明…是错的", "story": "dis+prove：证明不成立。"}, {"w": "belie", "g": "掩盖；违背、与…不一致", "story": "见 58-5：表面与实际不相符。"}, {"w": "conflate", "g": "混合、合并", "story": "con（一起）+flate（吹）→ 吹到一起=混为一谈。"}, {"w": "divulge", "g": "揭露、透露", "story": "=disclose：之前大家不知道的事，现在让大家知道。"}], "options": {"A": "disproved", "B": "belied", "C": "conflated", "D": "divulged", "E": "relaxed"}, "answer": "B", "explain": {"思路": "①continuity（连续性）与 distinction（区别）相反：有区别=不连续→分类方式在**反对**连续性→空格填负面动词；②但 A disprove 和 B belie 都是负面动词，选谁？③看手段的定语 specious：它指出的是**根本不成立的区别**。反驳别人时你给出的理由本身就是错的、不成立的，你就**不可能**证明别人错了——想证明别人错，你自己得先对。所以只能说分类与连续性**不一致**→B belied。", "annot": "<span class='m3'>continuity 连续</span> vs <span class='m3'>distinction 区别</span> 相反 ⇒ 空格=负面动词；但手段是 <span class='m4'>specious 不成立的</span> 区别 ⇒ 只能 <span class='m4'>belied 不一致</span>，不能 disproved 证伪。", "辨析": "A disprove（证明是错的）要求反驳理由成立——specious 直接堵死这条路；C conflate 混合合并、D divulge 揭露透露方向无关；E relaxed 放松放宽同样搭不上。", "点拨": "两个选项同方向时，回头读修饰语：specious 这个词就是出题人埋的裁判——理由不成立的人没资格宣布别人错了。", "词根": ["**disprove**　dis（不）+prove（证明）→ 证明为错", "**belie**　be+lie（躺）→ 盖住=掩盖→与…不符", "**conflate**　con（一起）+flat（吹）→ 吹到一起=混淆合并", "**divulge**　di（分开）+vulg（民众，vulgar 同源）→ 向大众公开=透露", "**specious**　spec（看）→ 只好看不中用=虚假"], "逻辑": "区别与连续相反 → 分类方式在反对连续性 → 填负面动词；但区别是 specious（不成立的）→ 不成立的理由证不了别人的错 → 只能选 belied（不一致），不能选 disproved（证伪）。", "翻译": "这位古生物学家重新审视了这个问题，认为普遍接受的分类方式通过在标本之间制造不成立的区别，掩盖了标本之间本质上的连续性。"}}, {"type": "q", "tag": "真题", "title": "习题集 第102页 第1题（单空题）", "source": "self-serving 与 idealistic 相反→说一套做一套", "pause": true, "stem": [{"t": "By pointing out the self-serving nature of the governor's motives for supporting the new health care policy, the columnist implied that the governor's idealistic-sounding explanation of her position on the issue was almost certainly ______."}], "vocab": [{"w": "self-serving", "g": "自私的、自私自利的", "story": "字面=为自己服务。"}, {"w": "nature", "g": "特点（熟词僻义）", "story": "不是自然：self-serving nature=自私的特点。"}, {"w": "motive", "g": "动机", "story": "做某事的动机。"}, {"w": "columnist", "g": "专栏作家", "story": "column 本义=柱子（长条形）→表格里的「列」是长条→报纸专栏也是竖着的长方形→column=专栏→写专栏的人=columnist。"}, {"w": "idealistic", "g": "理想化的、理想主义的", "story": "理想主义者追求最美好、最崇高、最无私的东西、全人类共同的福利→绝不只为自己谋私利。"}, {"w": "impractical", "g": "不切实际的", "story": "im+practical。"}, {"w": "derivative", "g": "①非原创的（字典译「衍生/派生」）②没新意的、不新颖的、老套的", "story": "说不清「衍生派生」就记「非原创的」：你的发明是根据别人的发明改出来的→不是第一个→没新意。考试更爱考引申义「没新意」。与 original（原创的；引申义=创新的）是一对**完美的反义词**：字面「非原创 vs 原创」，引申「不创新 vs 创新」，怎么看都是反义。"}, {"w": "simplistic", "g": "过于简单的、过于简单化的（贬义）", "story": "与 simple 区别巨大：simple=比较简单，中性词可好可坏；simplistic=too young, too simple, sometimes naive——把问题想得太天真、过分简单化。"}, {"w": "disingenuous", "g": "虚伪的、不真诚的", "story": "dis（不）+ingenuous（真诚坦率的）。"}, {"w": "ineffectual", "g": "无效的、没有效果的", "story": "in+effectual（effect 效果）。"}], "options": {"A": "impractical", "B": "derivative", "C": "simplistic", "D": "disingenuous", "E": "ineffectual"}, "answer": "D", "explain": {"思路": "①抓住一对反义：self-serving（自私自利）与 idealistic（理想主义）相反——理想主义者追求全人类共同福利，绝不为己谋私利；②州长对自己立场的解释=「因为我是理想主义者」，而专栏作家指出她背后的动机其实是自私的→专栏作家相当于在说州长**撒谎骗人**；③空格=虚伪不真诚→D disingenuous。", "annot": "<span class='m3'>self-serving 自私</span> 与 <span class='m3'>idealistic 理想主义</span> 相反 ⇒ 州长的解释是骗人的 ⇒ <span class='m4'>disingenuous 虚伪</span>。", "辨析": "B derivative（没新意）与 C simplistic（过于简单）都在批评「解释的质量」，而专栏作家攻击的是「解释的真假」；A impractical 不切实际、E ineffectual 无效都不含「说假话」。", "点拨": "先找题干里藏着的那对反义词（自私 vs 理想主义），嘴上说一套、实际做一套=虚伪，答案一步到位。", "词根": ["**derivative**　de（下）+riv（河流）→ 从别人的河里引水=非原创→没新意", "**simplistic**　simpl（简单）+istic → 过分简单化（贬义）", "**disingenuous**　dis（不）+in+gen（生）→ 不天生率真=虚伪", "**ineffectual**　in（不）+ef（出）+fect（做）→ 做不出效果", "**idealistic**　ideal（理想）+istic → 理想主义的"], "逻辑": "州长的解释自称理想主义（无私），专栏作家揭穿动机是自私自利 → 说一套做一套 → 解释几乎必然是虚伪的。找到 self-serving 与 idealistic 这对反义，题就解完了。", "翻译": "通过指出州长支持新医疗政策背后的自私动机，这位专栏作家暗示：州长对自己立场那番听起来理想主义的解释，几乎必然是虚伪的。"}}, {"type": "teach", "title": "② does not mean that：「不意味着」前后也是相同", "ppt": ["mean that=意味着 → 前后相同", "does not mean that=不意味着 → 前后**还是相同**", "技巧：看到 mean that，不管有没有 does not，直接取同"], "text": ["means that=意味着，前后相同，不难理解。但 **does not mean that**（不意味着）前后**也是相同**——很多同学听到这就懵了。", "举例：「我批评小明，不意味着我不喜欢他」。我为什么会在这种时候说这句话？一定是：我确实批评了小明，有人看到后开始胡思乱想「你批评他是不是因为你不喜欢他」，我才出来澄清「其实不是的」。所以这句话写全了是：**虽然表面上来看，我批评小明意味着我不喜欢他，但其实不是这样**——简化之后只剩后半句。于是「不意味着」指的是「表面上还是意味着」，前后大方向一致：批评（负面）与不喜欢（负面）相同。", "**实战技巧**：刚才那一大堆你完全不理解也没关系——只要看到 mean that，管它有没有 does not，前后不用动脑子，直接按相同来填。"]}, {"type": "q", "tag": "真题", "title": "习题集 第37页 第5题（三空题）", "source": "does not mean that 取同 + cannot…but 不是而是", "pause": true, "triple": true, "stem": [{"t": "Just because as a photographer Friedlander ______ places that most people consider ugly does not mean that he is out to prove they are beautiful. Instead, his work suggests that the photographer simply cannot ignore so much of the built American landscape, but is obligated to ______ what he passes through day in and day out, regardless of ______."}], "vocab": [{"w": "be out to", "g": "想要做某事", "story": "词组：be out to prove=想要证明。"}, {"w": "landscape", "g": "地形、地貌", "story": "the built American landscape=美国的人造景观/建成环境。"}, {"w": "obligated", "g": "有义务的", "story": "动词 obligate=使有义务；四六级背过名词 obligation（责任义务）。be obligated to do=必须去做。"}, {"w": "day in and day out", "g": "日复一日地", "story": "一天又一天。"}, {"w": "harshly critical", "g": "激烈批评的、严厉批评的", "story": "harshly=激烈地、严厉地。"}, {"w": "document", "g": "（动词）记录（熟词僻义）", "story": "文件是干嘛的？就是为了留下记录→动词=记录。"}, {"w": "emulate", "g": "模仿、效仿", "story": "觉得别人做得好，于是去学它——褒义的学习。"}, {"w": "discredit", "g": "否定、证明…不可信", "story": "credit=相信：让别人不要去相信它。"}, {"w": "authenticity", "g": "真实、真实性", "story": "来自形容词 authentic（真的）。"}, {"w": "truthfulness", "g": "诚实", "story": "跟别人讲的全是 truth=讲真话=诚实。"}, {"w": "aesthetics", "g": "美学、审美", "story": ""}], "options": {"i": {"A": "is repelled by", "B": "is harshly critical of", "C": "is interested in"}, "ii": {"D": "document", "E": "emulate", "F": "discredit"}, "iii": {"G": "authenticity", "H": "truthfulness", "I": "aesthetics"}}, "answer": "iC,iiD,iiiI", "explain": {"思路": "空1：does not mean that 前后相同——后句说「他想证明这些地方很美」=喜欢/支持这些地方→空1也得是喜欢→选项里唯一正面态度 C is interested in（A 排斥、B 严厉批评都是负面）。空2：第三行 but 不是转折词！前面有 cannot（否定），**not…but=不是…而是…**（小明 is not a fool, but a genius=不是傻瓜而是天才）：摄影师不能忽视这些地方，**而是**有义务去______它们→填「不忽视」的反义→摄影师不忽视=拿相机拍=记录→D document。空3：「记录时不必考虑______」——全篇都在讨论美和丑→填与美丑相关的 I aesthetics。整句意思：摄影师天天拍丑地方，不是想证明丑地方不丑，而是想说丑的东西也值得关注——美和丑都该拍，只要是真实的就拍，不用考虑美丑。", "annot": "空1：<span class='m2'>does not mean that</span> 前后相同 ⇒ <span class='m3'>想证明它们美=喜欢</span> ⇒ <span class='m4'>正面态度 interested in</span>。空2：<span class='m2'>cannot…but</span> 不是而是 ⇒ <span class='m3'>不能忽视</span> → 而是有义务<span class='m4'>记录 document</span>。空3：全篇谈美丑 ⇒ <span class='m4'>regardless of aesthetics</span>。", "辨析": "空1 的 A/B 都是负面，方向相反。空2：E emulate 模仿（摄影师没法「模仿」地貌）、F discredit 否定（与「不忽视」相反）。空3：G authenticity 真实性、H truthfulness 诚实——全篇的话题词是美丑，不是真假，只有 aesthetics 落在话题内。", "点拨": "两个技巧同时用：does not mean that 无脑取同；not…but 翻译成「不是…而是…」按对比取反。先认出 but 前面有没有 not——有 not 的 but 不是转折。", "词根": ["**document**　doc（教/记录）+ment → 文件→动词=记录", "**emulate**　emul（竞争）+ate → 与榜样竞争=效仿", "**discredit**　dis（不）+credit（相信）→ 使不可信", "**authenticity**　authent（真实）+icity → 真实性", "**aesthetics**　aesthet（感觉）+ics → 研究美感的学问=美学"], "逻辑": "does not mean that 前后相同：后句「想证明丑地方美」=喜欢 → 空1=正面态度；cannot ignore…but obligated to 是 not…but「不是而是」对比 → 空2=不忽视=记录；全篇话题是美丑 → 空3=aesthetics。", "翻译": "仅仅因为摄影师 Friedlander 对那些大多数人都认为丑陋的地方感兴趣，并不意味着他想证明这些地方的美丽。恰恰相反，他的作品表明：摄影师根本无法忽视如此之多的美国建成景观，而是有义务去记录自己日复一日途经的一切——不论美丑。"}}, {"type": "teach", "title": "③ not because：「不是因为」前后照样相同", "ppt": ["because 前后相同 → not because 前后**也相同**", "「不是因为Y，而是因为Z」：Y 和 Z 都与 X 相同", "技巧：看到 not because，直接当 because 用"], "text": ["because 前后相同，那为什么 not because 前后还相同？道理与 does not mean that 一样。例：「我批评小明，**不是因为**我不喜欢他」——选「不喜欢」，与批评同为负面。", "结构原理：「小明没能入选篮球队，**不是因为**他跑得慢，**而是因为**他跳不高」——两个空都填负面（与「没入选」相同）。「不是因为Y，而是因为Z」=Y 和 Z 都**有可能**成为 X 的原因，我只告诉你其中一个才是真正原因；既然两者表面上都得是候选原因，Y、Z 就都与 X **相同**。", "**实战技巧**：考场上不需要想篮球队这么复杂——看到 not because 直接记住前后相同；not because 之间取同，but because 本身就是 because 也取同，照着填即可。"]}, {"type": "q", "tag": "真题 · 易错", "title": "习题集 第39页 第4题（六选二）", "source": "not because… but because… 双双取同", "pause": true, "multi": true, "stem": [{"t": "Many of the towns that have voted to keep incinerators in the county's solid waste plan have done so not because they necessarily ______ incinerators, but because they are ______ to narrow their waste disposal options."}], "vocab": [{"w": "incinerator", "g": "垃圾焚烧炉", "story": "解题完全不用管，知道是处理垃圾的东西就行。"}, {"w": "solid waste", "g": "固体垃圾", "story": "waste=垃圾/废料；county's solid waste plan=国家的垃圾处理计划。"}, {"w": "question", "g": "质疑", "story": "熟词僻义，动词=质疑。"}, {"w": "favor", "g": "喜欢、支持", "story": ""}, {"w": "oppose", "g": "反对", "story": ""}, {"w": "willing", "g": "乐意的", "story": "be willing to=乐意做。"}, {"w": "eager", "g": "热切的、急切的", "story": "be eager to=热切想做。"}, {"w": "loath", "g": "不喜欢的、不情愿的", "story": "be loath to=不情愿做、反感做。"}], "options": {"A": "question", "B": "favor", "C": "oppose", "D": "willing", "E": "eager", "F": "loath"}, "answer": "BF", "explain": {"思路": "给句子起名字：X=这些城镇投票要求保留焚烧炉（支持焚烧炉）；Y=not because 部分；Z=but because 部分。X 与 Y 之间是 not because→相同；X 与 Z 之间是 because→相同。所以两空都体现「支持保留焚烧炉」。空1：直接对焚烧炉表态→支持→B favor。空2：注意宾语不是焚烧炉，而是「减少自己处理垃圾的选项」：保留焚烧炉=多一个选项→他们**不想**少一个选项→F loath（不情愿减少）。整句意思：这些城镇投票保留焚烧炉，不是真的想用焚烧炉，只是希望多一个选择——不想将来真要用的时候没有东西可用。", "annot": "X=<span class='m3'>投票保留焚烧炉（支持）</span>。<span class='m2'>not because</span> 相同 ⇒ 空1=<span class='m4'>favor 喜欢支持</span>；<span class='m2'>but because</span> 相同 ⇒ 保留=多一个选项 ⇒ <span class='m4'>loath 不情愿减少选项</span>。", "辨析": "空1：A question 质疑、C oppose 反对方向相反；空2：D willing 乐意、E eager 热切——「乐意减少选项」与支持保留焚烧炉正好相反。空2 的坑在宾语：不是对焚烧炉表态，而是对「减少选项」表态，要先想清楚保留焚烧炉=选项变多。", "点拨": "考场速解：not because 当 because 用，前后无脑取同；空2 遇到「选项变多/变少」这类转弯，先把动作的宾语   const cards = les.cards.map((c,ci)=>{
    if (c.type==='teach'){
      tno++;
      return `<div class="card"><div class="chead"><span class="no">讲解 ${tno}</span><h3>${c.title}</h3></div>
        <div class="pptbox">${c.ppt.map(x=>`<b>▎</b>${x}<br>`).join('')}</div>
        <div class="tbody">${c.text.map(t=>`<p>${md(t)}</p>`).join('')}</div></div>`;
    }
    qno++;
    const st = p.q && p.q[ci];
    const vocab = c.vocab ? `<div class="vocabbox"><div class="vhead">📖 课前讲词（老师逐词讲解，先过一遍再做题）</div>${
      c.vocab.map(v=>`<div class="vitem"><span class="vw">${v.w}</span><span><span class="vg">${v.g}</span>${v.story?`<div class="vs">${v.story}</div>`:''}</span></div>`).join('')
    }</div>` : '';
    return `<div class="card" id="q${ci}"><div class="chead">
        <span class="no">题 ${qno}</span>
        <span class="tag ${c.demo?'demo':''}">${c.tag}</span><h3>${c.title}</h3>
        <span class="src">${c.source||''}</span></div>
      ${c.pause&&!st?'<div class="pausebar"><span class="dot"></span>⏸ 课堂节奏点：题干没有批注，像考场一样读题。先在心里选出答案，再点下面的选项。</div>':''}
      ${c.demo?'<div class="pausebar" style="background:#fdf2e9;border-color:#f5cba7;color:#a05a1c">👀 题型演示：认认长相即可，答案和详解在后面。</div>':''}
      ${vocab}
      <div class="stem">${plainStem(c.stem)}</div>
      <div id="optbox${ci}"></div>
      <div class="analysis" id="ana${ci}" style="display:none"></div>
    </div>`;
  }).join('');
  const qTotal = les.cards.filter(c=>c.type==='q'&&!c.demo).length;
  const qDone = p.q ? Object.keys(p.q).length : 0;
  MAIN.innerHTML = `
    <div class="lesson-head"><h1>${les.title}</h1><p>${les.intro}</p>
      <div class="lesson-progress">本讲进度：非演示题已完成 ${qDone}/${qTotal}</div></div>
    ${cards}
    <details class="raw"><summary>🎙 课堂原声全文（本讲转录稿，查漏兜底）</summary><div class="rawtext">${les.transcript||''}</div></details>
    <div class="card finish" id="finishbox">
      ${p.done ? '<span class="done-badge">✅ 本讲已完成</span>'
               : `<button onclick="finishLesson()">我已完成本讲学习</button>`}
      <div style="margin-top:10px;color:#999;font-size:12px">完成全部题目后点击标记完成；进度保存在本机浏览器</div>
    </div>`;
  les.cards.forEach((c,ci)=>{ if (c.type==='q'){ renderOptions(c,ci); if (p.q && p.q[ci]) reveal(c,ci,p.q[ci],false); } });
  renderNav();
}

function renderOptions(c,ci){
  const box = document.getElementById('optbox'+ci);
  const GROUPS = c.triple ? ['i','ii','iii'] : ['i','ii'];
  const isDual = !!c.dual || !!c.triple;
  let html = '';
  if (isDual){
    for (const g of GROUPS){
      html += `<div class="grp"><div class="glabel">Blank (${g})</div><div class="opts">` +
        Object.entries(c.options[g]).map(([k,v])=>`<button class="opt" data-g="${g}" data-k="${k}" id="o${ci}_${g}${k}"><span class="ol">${k}</span>${v}</button>`).join('') + `</div></div>`;
    }
    html += `<button class="submit" id="sub${ci}" disabled>提交答案</button>`;
  } else {
    html += '<div class="opts">' + Object.keys(c.options).map(k=>`<button class="opt" data-k="${k}" id="o${ci}_${k}"><span class="ol">${k}</span>${c.options[k]}</button>`).join('') + '</div>';
  }
  box.innerHTML = html;
  const btns = [...box.querySelectorAll('.opt')];
  if (isDual){
    const sel = {};
    btns.forEach(b=>b.onclick=()=>{
      const g=b.dataset.g;
      btns.filter(x=>x.dataset.g===g).forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); sel[g]=b.dataset.k;
      document.getElementById('sub'+ci).disabled = !GROUPS.every(g=>sel[g]);
    });
    document.getElementById('sub'+ci).onclick = ()=>{ if (GROUPS.every(g=>sel[g])) submit(c,ci,GROUPS.map(g=>sel[g])); };
  } else if (c.multi){
    const need = c.pickN || 2;
    const sel = new Set();
    const sub = document.createElement('button');
    sub.className='submit'; sub.id='sub'+ci; sub.textContent='提交答案'; sub.disabled=true;
    box.appendChild(sub);
    btns.forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if (sel.has(k)){ sel.delete(k); b.classList.remove('sel'); }
      else if (sel.size<need){ sel.add(k); b.classList.add('sel'); }
      sub.disabled = sel.size!==need;
    });
    sub.onclick = ()=>{ if (sel.size===need) submit(c,ci,[...sel].sort()); };
  } else {
    btns.forEach(b=>b.onclick=()=>submit(c,ci,[b.dataset.k]));
  }
}

function isCorrect(c, chosen){
  if (c.dual || c.triple){
    const norm = c.answer.replace(/[^A-Z]/g, '');
    return chosen.slice().sort().join('') === [...norm].sort().join('');
  }
  return (c.answer.length===1) ? chosen[0]===c.answer : chosen.slice().sort().join('') === [...c.answer].sort().join('');
}

function submit(c,ci,chosen){
  const prev = (pOf(cur).q||{})[ci];
  if (prev) return;
  const ok = isCorrect(c,chosen);
  if (!progress[cur]) progress[cur] = { q:{} };
  progress[cur].q[ci] = { ok, pick: chosen.slice() };
  save(); reveal(c,ci,progress[cur].q[ci],true);
  renderNav(); updateHead();
}

function reveal(c,ci,st,animate){
  const GROUPS = c.triple ? ['i','ii','iii'] : ['i','ii'];
  if (c.dual || c.triple){
    const pick = st.pick || [];
    GROUPS.forEach((g,gi)=>{
      Object.keys(c.options[g]).forEach(k=>{
        const b=document.getElementById(`o${ci}_${g}${k}`); if(!b) return;
        b.classList.add('lock');
        if (c.answer.includes(g+k)) b.classList.add('ok');
        else if (pick[gi]===k) b.classList.add('bad');
      });
    });
  } else {
    const ans = [...c.answer];
    Object.keys(c.options).forEach(k=>{
      const b=document.getElementById(`o${ci}_${k}`); if(!b) return;
      b.classList.add('lock');
      if (ans.includes(k)) b.classList.add('ok');
      else if ((st.pick||[]).includes(k)) b.classList.add('bad');
    });
  }
  const sub=document.getElementById('sub'+ci); if(sub) sub.style.display='none';
  const ex=c.explain;
  const ana=document.getElementById('ana'+ci);
  const ansTxt = (c.dual || c.triple) ? GROUPS.map(g=>{ const m=c.answer.match(new RegExp(g+'([A-Z])')); return `Blank(${g}) 选 ${m?m[1]:'?'}`; }).join('　') : [...c.answer].join('、');
  const yourTxt = (st.pick||[]).join('、');
  ana.innerHTML = `
    <div class="ans-line">正确答案：<span class="ok">${ansTxt}</span>
      ${st.ok===false?`　你的选择：<span class="bad">${yourTxt}</span>　<span style="color:#e67e22;font-size:13px">已记入错题，建议重做一次</span>`:''}</div>
    <div class="ablock"><div class="atitle">① 句子逻辑梳理（先抓信号词，理清逻辑链）</div><div class="acont">${md(ex['逻辑'])}</div></div>
    <div class="ablock"><div class="atitle">② 全题翻译</div><div class="acont" style="background:#f8fafd;border:1px solid #e3e9f5;border-radius:8px;padding:10px 14px;">${md(ex['翻译'])}</div></div>
    <div class="ablock"><div class="atitle">③ 解题思路（四步法）</div><div class="acont">${md(ex['思路'])}</div></div>
    <div class="ablock"><div class="atitle">④ 题干批注拆解</div>
      <div class="annotbox">${ex.annot}</div>
      <div class="legend">图例：<i style="background:#dbe7ff"></i>对应双方 <i style="background:#ffe0b3"></i>信号词 <i style="background:#d9f2e1"></i>已知线索 <i style="background:#ffd9d9"></i>推导结果 <s>灰色划线=干扰</s></div></div>
    <div class="ablock"><div class="atitle">⑤ 选项辨析</div><div class="acont">${md(ex['辨析'])}</div></div>
    <div class="ablock"><div class="atitle">⑥ 老师点拨</div><div class="acont">${md(ex['点拨'])}</div></div>
    ${ex['词根'] && ex['词根'].length ? `<div class="ablock"><div class="atitle">⑦ 词根解析（用词根法重新记住这些词）</div><div class="acont" style="background:#f5f2fe;border:1px solid #e0d8f5;border-radius:8px;padding:10px 14px;">${ex['词根'].map(x=>`<div style="margin-bottom:6px;line-height:1.9">${md(x)}</div>`).join('')}</div></div>` : ''}`;
  ana.style.display='block';
  if (animate) ana.scrollIntoView({behavior:'smooth', block:'start'});
}

function updateHead(){
  const les=L(cur); const p=pOf(cur);
  const qTotal=les.cards.filter(c=>c.type==='q'&&!c.demo).length;
  const qDone=p.q?Object.keys(p.q).length:0;
  const el=document.querySelector('.lesson-progress');
  if(el) el.textContent=`本讲进度：非演示题已完成 ${qDone}/${qTotal}`;
}
function finishLesson(){
  if(!progress[cur]) progress[cur]={q:{}};
  progress[cur].done=true; save(); renderLesson(); window.scrollTo({top:0});
}
function resetProgress(){
  if(confirm('确定清空所有学习记录？')){ progress={}; save(); renderLesson(); }
}
function loadLesson(id){ cur=id; renderLesson(); window.scrollTo({top:0}); }

renderLesson();
</script>
</body>
</html>
