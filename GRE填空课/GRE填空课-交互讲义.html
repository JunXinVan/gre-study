分应该相反，这一部分我们应该怎么说？就说这个信息，你能看明白，所以你看选项发现哪两个可以表达这个信息能看明白最好了，当然就是b和d这个信息，它非常的易懂。所以他就可以和前面挖一部分构成相反。但是到目前为止，这道题目只说了一半儿，我们只说了为什么正确选项是对的，但是并没有说为什么错误选项是错误的。你像这道题，经常有同学选错，他怎么选？他选的是a和e两个选项，他选的是真诚。选真诚，有没有道理呢？其实绝对是有道理的，有同学就说为什么我选a和e？首先你注意它题目，开头儿x部分x部分那个while它引导的也是一个让步状语，从句因为while也叫虽然。于是的话，我们根据这个y我就知道x和y应该什么关系啊，它也应该是相反的。于是问题又来了。你像我们刚刚说这道题y和z是什么关系？y和z是相反，那x和z是什么关系啊？x和z，它显然就应该是相同了。因为x和y相反，y又和z相反，所以的话x和z它其实就是负负得正，两者应该相同的关系，于是有同学就说。你看x部分，它都已经说了作者的信息，非常的heartfelt非常的真诚，那我z应该跟它相同，不就应该再填两个真诚吗？为什么不能选真诚呢？这道题你为什么不能选两个真诚呢？是因为你如果选a和e，这两个真诚，它句子又变成了自相矛盾。你解题，你需要注意x部分，它具体怎么说呢？它不光说作者很真诚，它还多说了一点儿。他说，作者很真诚，这一点是always clear从始至终，这都看得很清楚。而这部分也是一样，你不能只看空格，你还要多看一点，你看它所在的语境。空格后边它又说什么？它说towards the end到最后。所以你就会发现什么问题啊，它前面儿x部分已经说了，作者从始至终都很真诚，所以你这一部分能不能说这本儿书到最后才变得真诚？这显然就不可以了，这又构成了自相矛盾，所以最后这道题你只能选b和d，这两个选项。所以你会发现这道题里，它确实有转折，但是x和z这两个部分之间，它并不是一个转折关系，但是你在做题的时候，你会发现你同样要遵循，避免自相矛盾这个原则。所以你将来做题也是一样，就是不管这道题，它考的是转折也好，不是转折也好，就只要是选选项，那么你就一定要避免自相矛盾。好，我们这一部分就到这里。"}, {"id": 6, "title": "第6讲 · 转折关系（下）：转折词的变体与隐蔽信号", "intro": "though/but/yet 之外，转折还有很多“变体信号”：nevertheless/nonetheless（=still，语气词陷阱！）、for all（=despite）、even（即使）、if not/any/at all（if 的熟词僻义=即使）。本讲把每个信号词讲透并配真题，最后重申转折的头号纪律——避免自相矛盾。", "cards": [{"type": "teach", "title": "① nevertheless / nonetheless ≠ 然而", "ppt": ["正确记法=仍然、还是、尽管如此", "用法跟 still 一模一样"], "text": ["这两个词你四级背的是“然而”——意思不算错，但**记“然而”会误导用法**。它们真正的用法跟 still 一模一样：①可单独表转折（第三句的位置）；②更常与 but/although 同现——此时**不是转折词，是加强语气的语气词**（=汉语“虽然…但还是…”的“还是”）。", "英语的铁律：**一个转折只能用一个转折词**（不像汉语“虽然…但是”能连用）。题目里 although + nevertheless ≠ 双重转折，真正的转折只有 although 一个，前后**只取一次反**。这就是本题型的核心陷阱。", "应对方法：看到 nevertheless/nonetheless，直接脑内替换成 still——still 你初中就会用。"]}, {"type": "q", "tag": "真题", "title": "习题集 第23页 第10题（六选二）", "source": "although + nevertheless 只取一次反", "pause": true, "multi": true, "stem": [{"t": "Although one can adduce myriad examples of ecosystem disruption by non-indigenous species, nevertheless most introduced species that survive in fact appear to have quite ______ effects on the ecosystems they have invaded."}], "vocab": [{"w": "adduce", "g": "举出（例子）", "story": "adduce an example=举例子。"}, {"w": "myriad", "g": "大量的、无数的", "story": ""}, {"w": "ecosystem disruption", "g": "生态系统破坏、扰乱", "story": "disruption=破坏扰乱。"}, {"w": "indigenous", "g": "本地的、本土的", "story": "托福词；non-indigenous=外来的。"}, {"w": "introduced species", "g": "外来物种", "story": "introduce 除了介绍=引进：从外地引进来的物种。"}, {"w": "invade", "g": "入侵", "story": "入侵物种=invasive species。"}, {"w": "marked", "g": "明显的", "story": "mark=标记→被标记出来的→显而易见。"}, {"w": "conspicuous", "g": "明显的", "story": "词根 spec/spect=look：aspect 样子（看上去什么样）；prospect 前景（往前看）；spectator 观众（看的人、游戏旁观者模式）；species 物种（字面=样子——古代给生物分类全靠看模样，三对足、头胸腹=昆虫）。"}, {"w": "minimal / trifling", "g": "极小的 / 微不足道的", "story": "trifling：数量、重要性、价值上的小。"}, {"w": "intriguing", "g": "迷人的、吸引人的", "story": ""}, {"w": "deleterious", "g": "有害的", "story": "=harmful。"}], "options": {"A": "marked", "B": "conspicuous", "C": "minimal", "D": "intriguing", "E": "trifling", "F": "deleterious"}, "answer": "CE", "explain": {"思路": "①although 已是转折，后面的 nevertheless 只是语气词（=“还是”）→全句只取一次反；②前半：外来物种破坏生态（有害）→后半：幸存的大多数外来物种影响“很小”；③选一对近义“小”：C minimal + E trifling。", "annot": "<span class='m2'>Although</span>（唯一转折）+ <span class='m5'>nevertheless=语气词，忽略</span> ⇒ 前半 <span class='m3'>破坏生态（有害）</span> → 后半 <span class='m4'>影响很小 minimal/trifling</span>。", "辨析": "A+B 明显（有害）与转折后同向；D 迷人是褒义；F 有害与转折前同向。", "点拨": "把 nevertheless 换成 still 再读一遍：“虽然例子无数，但大多数还是影响不大”——豁然开朗。spec/spect=看 这个词根串一串：aspect/prospect/spectator/species。", "词根": ["**minimal**　minim（最小）+al → 最小的", "**trifling**　trifle（琐事）+ing → 微不足道", "**marked**　mark（标记）+ed → 被标记出来 = 明显", "**intriguing**　in+tric（诡计 trick 同源）→ 有小机关 → 引起兴趣；名词=阴谋", "**deleterious**　deleter（破坏者）+ious → 有害（=harmful）"], "逻辑": "although 已是转折，后面的 nevertheless 只是加强语气的“还是”（=still），不是第二个转折 → 全句只取一次反：前半有害 → 后半影响很小。多一个转折词不等于多一次反转。", "翻译": "虽然我们能举出无数外来物种破坏本地生态系统的例子，但大多数存活下来的外来物种，事实上对它们所入侵的生态系统似乎只有极小的影响。"}}, {"type": "teach", "title": "② for all = 尽管（=despite）", "ppt": ["for all + 名词性成分 = 虽然"], "text": ["for all 是介词词组=despite：后面只能接名词性成分，不能接句子。不认识它的人会把前后当成“相同”来做，正好中套——它出现时前后取反。"]}, {"type": "q", "tag": "真题", "title": "习题集 第17页 第9题（六选二）", "source": "for all 转折", "pause": true, "multi": true, "stem": [{"t": "For all ______ the new CEO has received from the press recently, her staff have a decidedly less rosy view of her."}], "vocab": [{"w": "the press", "g": "媒体、新闻界", "story": "press 本义=压→印刷机 printing press（雕版涂墨往纸上一压）→出版社（牛津大学出版社 Oxford University Press）→报社→媒体新闻界。"}, {"w": "decidedly", "g": "明确地、毫无疑问地", "story": ""}, {"w": "rosy", "g": "乐观的、美好的", "story": "来自 rose（玫瑰）：脸色红扑扑→美好乐观。"}, {"w": "encomium / tribute", "g": "赞美 / 颂词", "story": "两者同义，本题的一对答案。"}, {"w": "evaluation", "g": "评价", "story": "中性。"}, {"w": "critique", "g": "批评；中性的评价/评论", "story": "中性词！康德《纯理性批判》critique of pure reason——不是“批评”理性，是针对理性的讨论评论。别默认它带批评色彩。"}, {"w": "publicity", "g": "公众/媒体关注", "story": "=public attention。"}], "options": {"A": "encomium", "B": "tribute", "C": "evaluation", "D": "critique", "E": "fame", "F": "publicity"}, "answer": "AB", "explain": {"思路": "①for all=尽管→前后相反；②后半：员工对她看法不那么美好（贬）→前半：媒体对她态度“美好”；③选一对近义的“赞美”：A encomium + B tribute。", "annot": "<span class='m2'>For all 尽管</span> ⇒ <span class='m4'>媒体（赞美）</span> vs <span class='m3'>员工（不美好）</span> → A+B。", "辨析": "C 评价、D 评论（critique 在这里是中性“评论”不是批评）都太中性；F 关注≠态度好。", "点拨": "这题的难度全在认不认识 for all——它一出现就是转折信号，不存在其他含义。", "词根": ["**encomium**　en（在…中）+com（宴乐）→ 宴会上的赞辞", "**tribute**　tribut（给）→ 贡品；敬辞"], "逻辑": "抓 for all=尽管 → 前后相反；后半“不那么美好” → 前半=赞美。这题的唯一难度就是认不认识 for all——它只可能是转折。", "翻译": "尽管这位新 CEO 最近受到了媒体的交口称赞，她的员工对她的看法却显然没那么乐观。"}}, {"type": "teach", "title": "③ even 自己也能表转折（即使）", "ppt": ["even（though/if 之外）单用=即使、虽然"], "text": ["even 常与 though/if 搭配表转折，但它**自己也能表转折**（即使）。看到 even 引导的内容与主句并存，就是“即使…也…”的让步结构，前后取反，且后半句往往暗含“有限、没那么好”的意味。"]}, {"type": "q", "tag": "真题", "title": "习题集 第13页 第8题（六选二）", "source": "even 转折 + 动作与主语的搭配", "pause": true, "multi": true, "stem": [{"t": "Even overt deficiencies in the author’s work have not ______ its respectful reception by most modern critics."}], "vocab": [{"w": "overt", "g": "明显的", "story": ""}, {"w": "deficiency", "g": "缺点、缺陷、不足", "story": "本义=缺乏；deficient 缺乏的，反义词=你无比熟悉的 sufficient（充足的）。完美对应汉语“不足”：数量不够+能力不够。"}, {"w": "reception", "g": "态度、反应（熟词僻义）", "story": "receive=接受→以某种态度接受：the movie was well received=受到好评；名词 reception=态度反应。respectful reception=恭敬的态度。"}, {"w": "taint", "g": "破坏、玷污（名声）", "story": "玷污好名声。"}, {"w": "supersede", "g": "代替、取代", "story": "super=在上边（superior 上级=上边的人；superstructure 上层建筑）+sed/sid=seat（sediment 沉积物；preside 主持=坐前边；president 坐在最前面的人）；坐到别人头顶上=地位超过→取代。"}, {"w": "inhibit", "g": "妨碍、阻碍", "story": "hibit=限制：exhibit 放到外边去=展览；prohibit 对…做限制=禁止。"}, {"w": "proscribe / forbid", "g": "禁止", "story": "同义词=prohibit。禁止的发出者必须有权威。"}], "options": {"A": "taint", "B": "hinder", "C": "supersede", "D": "inhibit", "E": "proscribe", "F": "forbid"}, "answer": "BD", "explain": {"思路": "①even=即使→让步：作品有明显缺陷，但并没有____评论家的恭敬态度→空格填负面动词“妨碍”；②两组负面候选：B+D（妨碍）vs E+F（禁止）；③看主语：发出动作的是 deficiency（缺陷）——缺陷只能“妨碍”喜欢，不可能“禁止”喜欢（禁止是有权威的人/组织做的事）→B+D。", "annot": "<span class='m2'>Even 即使</span> <span class='m3'>有缺陷</span> → 也没有<span class='m4'>妨碍（hinder/inhibit）</span>大家的喜爱。禁止？缺陷没这个权力。", "辨析": "同反判断剩多组候选时，代入看“动作与主语的搭配合理性”：deficiency 不能 proscribe/forbid。", "点拨": "**动词题多一重检查：谁发出这个动作？** 主语和动词的搭配合理性是六选二的隐藏筛子。", "词根": ["**hinder**　hind（后，hind legs 后腿）→ 拖后腿 = 阻碍", "**inhibit**　in（内）+hibit（持 hold）→ 约束 = 妨碍", "**taint**　本义=染色 → 玷污", "**supersede**　super（上）+sed（坐）→ 坐到你头上 = 取代", "**proscribe**　pro（公开）+scribe（写）→ 写下来公示 = 正式禁止"], "逻辑": "even=让步 → “有缺陷”没能阻止喜爱 → 空格=负面动词。两组候选再按主谓搭配收网：发出动作的是 deficiency（缺陷）——缺陷只能“妨碍”你，没权力“禁止”你。", "翻译": "即便作者作品中那些明显的缺陷，也没有妨碍它受到大多数现代评论家的恭敬对待。"}}, {"type": "q", "tag": "真题", "title": "习题集 第98页 第10题（六选二）", "source": "even 转折 + “有限的好”", "pause": true, "multi": true, "stem": [{"t": "His premiership, seemingly cast iron a year ago, is now so vulnerable that even a good day at the office does no more than buy him a few weeks of ______ from rebels within his own party."}], "vocab": [{"w": "premiership", "g": "总理身份、总理地位", "story": "premier=总理。"}, {"w": "cast iron", "g": "坚如铸铁、非常坚固", "story": "cast=铸造→铸铁（炒菜大铁锅的材质）；铸铁极结实→引申=坚如磐石，字面“坚如铸铁”。"}, {"w": "vulnerable", "g": "脆弱的、易受伤害的", "story": ""}, {"w": "rebel", "g": "反叛者、造反派", "story": ""}, {"w": "do no more than", "g": "至多、充其量", "story": "does no more than buy him…=充其量只能给他换来…"}, {"w": "controversy", "g": "争议", "story": "contr=相反（contrary/contrast）：争议=人们观点上的对立（有人喜欢有人不喜欢）。"}, {"w": "reproach / blame", "g": "批评", "story": ""}, {"w": "respite / relief", "g": "暂时的缓解、暂时的解脱", "story": "背单词累了刷5分钟微博=respite；说好5分钟结果变永久=人性。字典译“喘息之机”也对。"}, {"w": "deference", "g": "尊敬", "story": ""}], "options": {"A": "controversy", "B": "reproach", "C": "respite", "D": "relief", "E": "blame", "F": "deference"}, "answer": "CD", "explain": {"思路": "①even=即使：很好的一天也好的有限（=“即使小明是胖子，也只是个小胖子”）；②空格要体现“有限的好”：respite/relief=暂时的缓解——是好事，但“暂时”=非常有限；③C+D。", "annot": "<span class='m2'>even 即使</span> <span class='m3'>good day 很好的一天</span> → 也<span class='m4'>只是“暂时的”缓解（有限的好）</span> → C+D。", "辨析": "B+E（批评）方向就不对；A 争议中性；F 尊敬是无限的正面，体现不出“有限”。", "点拨": "even 引导的让步常暗含“程度有限”：即使好也好得有限。抓“有限”二字，选项范围立刻收窄。", "词根": ["**respite**　respicere（回头看）→ 喘息之机", "**relief**　re（回）+lief（轻 lev）→ 减轻 → 解脱", "**controversy**　contro（反）+vers（转）→ 意见相左 = 争议", "**reproach**　re（回）+proach（靠近）→ 回头指责", "**deference**　de（下）+fer（带）→ 放低自己 = 尊敬"], "逻辑": "even=让步 → “顺利的一天”也好的有限 → 空格=“有限的好” → 暂时的缓解（好，但“暂时”=非常有限）。even 让步常暗含程度有限，抓这个感觉。", "翻译": "他的总理地位一年前看上去还坚如磐石，如今却脆弱到：即便他在办公室里度过了顺利的一天，也至多能换来党内反对派几周暂时的平息。"}}, {"type": "teach", "title": "④ if 的熟词僻义：if not / if any / if ever = 即使", "ppt": ["if + not/any/at all/ever → if 不再是“如果”，是“即使”"], "text": ["if 后面出现 not、any、at all、ever 这类否定性/准否定词时，if 就不是“如果”，而是**转折词“即使”**：the task would be difficult if not impossible=这任务即使不是不可能，也非常困难（if not≈although not）。hundreds if not thousands=即使没有几千，也有几百；few if any changes=即使有变化也极少；rarely if ever=即使准时也少得可怜。", "逻辑账：if（即使，取反）+ not（否定，再取反）= **负负得正**，空格与后面的大方向一致——再叠加“程度区别”避免自相矛盾（下题就是教科书）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第199页 第10题（六选二）", "source": "if not 负负得正 + 程度区别", "pause": true, "multi": true, "stem": [{"t": "In its few decades of existence, the field of technology assessment has undergone large changes: its original high ambitions to predict the consequences of technology have been ______, if not discarded."}], "vocab": [{"w": "undergo", "g": "经历、经受", "story": "字面=go under。"}, {"w": "discard", "g": "抛弃、放弃", "story": "来自扑克牌 card：手里牌不好，牌一丢认输。"}, {"w": "defer", "g": "推迟", "story": "defer a decision。"}, {"w": "subvert", "g": "颠覆", "story": "vert/vers=转：convert 转变（汉语“转换”也带转）；revert 逆转；reverse 倒挡（汽车档位上的 R）。"}, {"w": "abandon / relinquish", "g": "放弃", "story": "两者同义。"}, {"w": "temper（动词）", "g": "限制、减弱", "story": "名词=脾气；lose one’s temper 大发脾气=**失去约束/失控**；quick-tempered 发火前忍耐时间短→脾气与“限制”本是一家。"}, {"w": "modulate", "g": "调整；减弱", "story": "两个意思都有。"}], "options": {"A": "defer", "B": "subvert", "C": "abandon", "D": "relinquish", "E": "tempered", "F": "modulated"}, "answer": "EF", "explain": {"思路": "①if not discarded=即使没有被抛弃：if（即使，反①）+ not（反②）=负负得正→空格与 discard 同向（负面）；②候选：C+D（放弃）或 E+F（减弱）；③选 E+F：C/D=放弃与 discarded 同义→“即使没被抛弃也被抛弃了”=自相矛盾；temper/modulate（减弱）程度低于抛弃→程度区别化解。", "annot": "<span class='m2'>if not discarded</span> ⇒ 负负得正 → 填 <span class='m3'>抛弃同向</span> 的词；C/D=discard 同义 <span class='m5'>撞车矛盾</span> → E/F 程度更低 → 成立。", "辨析": "这题把本讲两个考点叠在一起：if not 的双重否定 + 程度区别防矛盾。单看方向会落在 C+D，靠“矛盾”二字完成绝杀。", "点拨": "跟第5讲153-4同构：负负得正定方向，程度区别定答案。vert=转 串：convert/revert/reverse/subvert。", "词根": ["**subvert**　sub（下）+vert（转）→ 转到底下 = 颠覆", "**abandon**　a-（去）+ban（禁令）→ 放逐 → 放弃", "**relinquish**　re（回）+linqu（离开）→ 放手"], "逻辑": "if not discarded=即使没被抛弃：if（即使，反一次）+ not（反一次）=同向 → 空格与 discard 同向但更轻 → “减弱”。弃选 C/D（放弃）因为与 discarded 同义撞车——“即使没被抛弃也被抛弃了”是病句。", "翻译": "技术评估这个领域在存在的短短几十年里经历了巨大变化：它最初那个预测技术后果的宏大目标，即使没有被抛弃，也已经减弱了。"}}, {"type": "teach", "title": "⑤ 本讲小结", "ppt": ["转折信号词变体速查"], "text": ["**速查**：nevertheless/nonetheless=still（可与 although 同现，只取一次反）｜for all=despite（接名词）｜even=即使（后半句常暗含“有限”）｜if not/any/ever=即使（if 的熟词僻义，与 not 叠加负负得正）。", "**两条全程纪律**：①一个转折只取一次反（额外的是语气词）；②同向候选用“程度区别/主谓搭配/是否矛盾”收网——这些比认信号词更容易拉开分差。"]}], "transcript": "接下来，这一部分我们来说一些做填空题的时候，值得注意的转折词。首先，第一组单词叫做nevertheless，还有nonetheless这两个词。不出意外，你在四级单词里都已经背过，你背的意思应该是叫做然而。但需要注意的是，从今以后，这个词不要再记然而了，这两个词它正确的记法应该是叫仍然还是或者是叫尽管如此。有同学说我之前一直都记得是，然而这个难道记错了吗？然而这个翻译并没有错，因为nevertheless采用nonetheless它们俩就是个转折词，所以然而汉语也是转折词，所以然而这个翻译并不能说是翻译错了。但为什么不让你记，然而呢，就是你如果把这两个词记成，然而你很容易把这两个词的用法理解错，你如果记然而的话，你就很容易误以为nevertheless和nonetheless这两个词，它的用法跟however是一样的。但实际上，英语里这两个单词的用法跟however可以说是完全不一样。英语里nevertheless和nonetheless这两个词怎么用呢？它跟表示仍然或者叫还是的那个still是一模一样的。style怎么用？那这两个词也怎么用？still，这个词怎么用？我们先来看几个例子。比如像屏幕上这几句话，第一句它说he had finished the required reading list，but still failed the test。翻译过来就叫他该读的书都已经读过了，但还是没有考过。第二句话说，although he had finished the required reading list，he still failed the test翻译过来，还是叫虽然他该读的都读过了，但是考试还是没有考过。第三句话说he had finished the required the reading list still he failed the test翻译过来，就是说他该读的都读过了，但是他还是没有考过。这三个句子你会发现它都有still，那现在问你一个问题，这三句话里边儿其中哪一句或者是哪几句它的still，你可以把它换成however呢？显然就是只有第三句的still，你可以换成however前两个句子都是不可以换的。为什么前两个句子里still你不可以换成however因为英语它转折关系有这样一个规定，就是一个转折就只能用一个转折词。这也是英语和汉语一个很大的区别，你像汉语一个转折可以用两个转折词，我们经常在汉语里虽然，但是它可以一起出现。但英语就不行，英语你用了，虽然就不允许再用，但是你用了，但是就不能再用，虽然。所以像上两个句子，它们共同特点就是它里边儿都已经有了一个转折词了，要么有but要么有，although所以你就不能再用一个转折词，however。只有第三个句子，你可以把那个still换成however。但需要注意的是什么呢？就是这三句话里边儿的still你全都可以把它换成nevertheless，或者是nonetheless。这就是nevertheless和nonetheless这两个词，它在用法上跟however最大的区别。这两个词用法上有什么特点呢？就是它跟steel一样，它可以自己用表转折，你比如像屏幕上的第三句话。同时，它也可以和其他的转折词一起用，共同表示转折，比如像屏幕上的前两句话。你像前两句话still nevertheless和nonetheless它和其他的，比如像although but这种普通的转折词一起出现表转折的时候。那么，这个still nevertheless和nonetheless它严格来讲，它其实不是一个转折词，它严格来讲是一个语气词，它的功能就是在加强原有那个转折的语气。所以翻译成汉语，就叫仍然或者是还是。你像咱们汉语里仍然还是很多时候就可以用来加强转折的语气，比如像汉语，我们很多时候说虽然，但是觉得不过瘾怎么办？我们就再改一下，我们说虽然怎么怎么样，但还是怎么怎么样，或者叫但仍然怎么怎么样，仍然还是它就可以加强转折的语气。而在英语里，可以用来加强转折语气的就是这么三个词，still nevertheless和nonetheless。于是你在做题的时候就要注意什么问题呢？很多填空题，它出题怎么出它？比如说开头写一个，although后半句又写一个，nevertheless。很多同学nevertheless他就继承了，然而他又误以为这道题是两个转折，他觉得although一个转折nevertheless又一个转折，两个转折呢，应该负负得正，前后应该是相同，结果就做错了。你要注意它题目，如果已经有although了，那它再给你写一个 思都有。好，你看这道题应该选哪两个选项？我们一起来看这道题目。题目说in this few decades of existence，the field of technology assessment has undergone large changes。就是说在它存在的几十年之中，技术评估这个领域，它经历了巨大的变化。后半句说it&apos;s original high ambitions to predict the consequences of technology have been空格，if not discarded。它起初宏大的目标就是要去预言技术的影响，这个目标即使没有被抛弃，它也是被空格。解这道题靠什么呢？就靠最后那个if not discovered，你注意if后边儿接了一个否定词not，所以在这里边儿if就像我们刚刚说它是一个转折词，翻译成汉语叫即使。所以它既然是转折了，那么前后就要取反。同时，不要忘了后边儿否定词该取反还是要取反的，所以not它又取了一次反，于是你会发现这道题if取一次反not取一次反负负得正，它又取了两次反，最后相当于是没取反。所以空格怎么填啊？空格你又要填跟那个discard抛弃放弃大方向一致的词，也就是要填负面的词。看到选项发现，它能表示负面，并且意思还得一样的，要么就是CD两个放弃，要么就是ef两个减弱，或者是限制。那最后应该是选CD还是选e和f呢？最后答案显然选的是e和f。为什么不可以选c和DC和d？它的错误的点又在于我们之前说的自相矛盾。你想你如果选c和d的话，句子就变成了什么意思啊？就变成了这个目标，即使没有被抛弃，它也被抛弃了，所以这到底是抛弃还是没抛弃，所以它不能选。而e和f它为什么可以选？因为它在程度上跟抛弃是有区别的，它的程度比抛弃要低得多。所以填进去啥意思啊？就是说这个目标即使没有被抛弃，它现在也不像之前那么强了。所以这两个选项填进去，它就不矛盾。所以总之再一次强调大家做转折的题目的时候，一定要注意自相矛盾，这个考点最后你选选项的时候一定不要选自相矛盾的选项。好转折关系，我们就说到这里。"}, {"id": 7, "title": "第7讲 · 解释关系（上）：冒号与同义推理", "intro": "解释关系=前后相同。冒号是最典型的信号，但真题里的玩法很多：双空题有的必须两个空一起解、三句结构的 xyz 同反推理、否定词叠加负负得正。本讲还包含三空题的完整专题（94页第6题），讲透三空题为什么不能慌。", "cards": [{"type": "teach", "title": "① 双空题的两种形态", "ppt": ["大部分双空=两个单空，可分开做", "少数双空必须一起看选项凑一对同义/反义"], "text": ["之前做的双空题都能“先解一空、再解另一空”——本质是把它拆成两个单空题。但少数双空题**两个空必须一起做**：题干只告诉你“两空应相反/相同”，但具体填什么意思的反义，不看选项你永远不知道。", "做这种题需要耐心：到选项里挨个试搭配，凑出你需要的那一对同义词或反义词。考场上遇到别慌，试完所有组合，答案自然浮出来。下面 9-3 和 16-5 就是两个样本。"]}, {"type": "q", "tag": "真题", "title": "习题集 第9页 第3题（双空题）", "source": "两空一起做：凑一对反义", "pause": true, "dual": true, "stem": [{"t": "The economic recovery was somewhat lopsided: ______ in some of the industries, while ______ in others of them."}], "vocab": [{"w": "lopsided", "g": "不均衡的、一边倒的", "story": "lob=下垂：天平一边垂下来→两边不一样重→不均衡。"}, {"w": "industry", "g": "行业、产业（≠工业）", "story": "考试更爱考“行业”：教育产业=the education industry。"}, {"w": "feeble", "g": "脆弱的、弱的", "story": "=weak。"}, {"w": "swift", "g": "迅速的", "story": ""}, {"w": "robust", "g": "强有力的", "story": "=strong。"}, {"w": "turbulent", "g": "混乱的、动荡的", "story": "名词 turbulence：坐飞机遇到乱流 we have encountered D": "subtlety", "E": "discursion", "F": "exhaustiveness"}}, "answer": "iB,iiE", "explain": {"思路": "①but 转折取反一次；②开头 irked（不喜欢）→结尾 regard as an asset（喜欢）又取反一次；③负负得正→两空填一对同义词；④一起看选项凑：东扯西扯没主题 → B aimlessness + E discursion（都=跑题没主题）。", "annot": "<span class='m2'>but</span>（反①）+ <span class='m3'>irked 不喜欢 → asset 喜欢</span>（反②）= 负负得正 ⇒ 两空=<span class='m4'>同义：跑题/没主题</span>。", "辨析": "整句意思：一开始不喜欢这书老跑题，看进去之后反而喜欢上它的跑题。填反义词就违背句意——这是“负负得正”的经典布局。", "点拨": "数反转：转折词一次、褒贬翻转一次。exhaustive/subtle 这类“别记字典翻译”的提醒值得抄进单词本。", "词根": ["**aimlessness**　aim（目标）+less（无）→ 漫无目的", "**discursion**　dis（离）+curs（跑）→ 跑题", "**flippancy**　flipp（轻佻）+ancy → 轻浮不严肃", "**tendentiousness**　tend（倾向）+entiousness → 带倾向性=不公正", "**subtlety**　sub（下）+tle → 藏在底下=不明显", "**exhaustiveness**　ex（出）+haust（抽干）→ 彻底详尽"], "逻辑": "数反转：but 转一次；“不喜欢”→“视为优点”再转一次 → 负负得正 → 两个空同义。方向数清楚之前别急着看选项。", "翻译": "读者起初可能不喜欢这本书明显的跑题，但一旦沉浸到作者的文字中，他们反而可能把作品的这种跑题视为一个优点。"}}, {"type": "q", "tag": "真题", "title": "习题集 第15页 第3题（双空题）", "source": "xyz 三句结构推理", "pause": true, "dual": true, "stem": [{"t": "While people complain about their hectic lives and demanding schedules, one might be justified in suspecting that they are being somewhat ______: compulsive busyness seems to be for many a source of ______."}], "vocab": [{"w": "hectic", "g": "繁忙的、忙乱的", "story": ""}, {"w": "demanding", "g": "艰难的、要求高的", "story": "不停向你 make demands→要求极高。"}, {"w": "justified", "g": "合理的", "story": "justify=使合理、找借口找理由（just 公正+ify 使动）；justification=理由、合理性；justice 正义。"}, {"w": "compulsive", "g": "忍不住的、强迫症一样的", "story": "≠compulsory（义务的、强制的：义务教育 compulsory education）；都来自 compel（强迫）；compelling=迷人的。OCD 强迫症=obsessive compulsive disorder。"}, {"w": "disingenuous", "g": "虚伪的、不真诚的", "story": "ingenuous=天真没心眼（成天上当受骗）→dis-取反=心眼太多→虚伪。**形近：ingenious=聪明巧妙的**——借 genius 区分：ingenious 和 genius 都含 geni，聪明和天才更近。"}, {"w": "guarded", "g": "小心的、提防的", "story": "guard 守卫→有所防备。"}, {"w": "dilatory", "g": "缓慢的、拖延的", "story": ""}, {"w": "despair", "g": "绝望", "story": "形容词 desperate（绝望主妇 Desperate Housewives）。"},  "story": "嵌在什么之中。"}, {"w": "dense", "g": "晦涩难懂（GRE）；浓密的（本义）", "story": "dense fog 浓雾→看不透→写文章让人看不透=晦涩。"}, {"w": "vapid", "g": "乏味的、无聊的", "story": ""}, {"w": "inaccessible", "g": "晦涩难懂的", "story": "accessible：地方=容易到达；人=平易近人；书=通俗易懂。inaccessible=难懂。"}, {"w": "sagacious", "g": "智慧的、睿智的", "story": "sage=智者。"}, {"w": "opaque", "g": "晦涩难懂的（GRE）；不透明的（本义）", "story": "不透明→看不透→看不懂。与 dense 同构。"}, {"w": "distressing", "g": "令人痛苦的", "story": "dis+stress：特别不好的压力→痛苦。"}], "options": {"A": "vapid", "B": "inaccessible", "C": "sagacious", "D": "banal", "E": "distressing", "F": "opaque"}, "answer": "BF", "explain": {"思路": "①链条：见解被嵌入 dense 的英译、dense 的德文原著→对读者当然是 dense；②选一对“晦涩难懂”：B inaccessible + F opaque。", "annot": "<span class='m3'>dense 英译 ← dense 德语原文</span> ⇒ 使得见解对读者 <span class='m4'>晦涩难懂</span>。", "辨析": "A 乏味、D 陈腐都是“内容差”，而题目说的是“读不懂”；C 睿智褒义；E 痛苦偏离。dense/opaque 的“看不透→看不懂”引申链值得记住。", "点拨": "这是定语从句的送分形态：that 从句顺着前面的形容词链推，答案就是同一对词。", "词根": ["**banal**　ban（陈规/公告）+al → 老掉牙 = 陈腐"], "逻辑": "顺着形容词链推：见解被包在 dense 的英译里，英译来自 dense 的德文 → 对读者必然还是 dense → 空格=dense 的同义词。全句没有逻辑词，靠“链式修饰”传递同义。", "翻译": "《现代性观察》收录的文章里有许多深刻见解，但它们都嵌在晦涩的英译里——而译文又来自同样晦涩的德语原文，这使得大多数读者难以理解其中许多见解。"}}, {"type": "q", "tag": "真题", "title": "习题集 第184页 第10题（六选二）", "source": "定语从句限定工具特点", "pause": true, "multi": true, "stem": [{"t": "In their quest for kinder cutting, physicians increasingly rely on endoscopic surgery, replacing large scalpels and clamps with cameras and ______ tools that snake into the body through tiny holes."}], "vocab": [{"w": "quest", "g": "追求、追寻", "story": "游戏里的“任务”=quest——RPG 任务无非是找宝物或干掉某人，都离不开找。"}, {"w": "physician", "g": "医生（≠物理学家）", "story": "物理学家=physicist。"}, {"w": "scalpel / clamp", "g": "手术刀 / 手术钳", "story": "医学名词，解题不用认识。"}, {"w": "snake（动词）", "g": "蛇形运动、像蛇一样钻行", "story": ""}, {"w": "flexibility", "g": "灵活", "story": "flexible。"}, {"w": "rigid", "g": "刚性的；死板的", "story": "本义=不易形变（材料）；形容人=不知变通（拘泥规定一字不差执行）。"}, {"w": "magnitude / enormity", "g": "巨大", "story": "magn=大：magnify 放大、magnifier 放大镜；enormity 来自 enormous。"}, {"w": "supple", "g": "柔软的、灵活的", "story": "工具柔软灵活→能扭来扭去。"}, {"w": "precision", "g": "精确", "story": ""}], "options": {"A": "flexible", "B": "rigid", "C": "precise", "D": "supple", "E": "enormous", "F": "mammoth"}, "answer": "AD", "explain": {"思路": "①定语从句 that snake into the body through tiny holes 规定了工具的特点：能蛇形钻过小孔→灵活柔软；②选一对：A flexible + D supple。", "annot": "从句 <span class='m3'>snake into the body through tiny holes 蛇形钻小孔</span> ⇒ 工具必须 <span class='m4'>灵活柔软 flexible/supple</span>。", "辨析": "B rigid 死板（钻不了）、C precise 精确（与钻行无关）、E/F 巨大（反而进不去）。定语从句就是空格的“岗位要求说明”。", "点拨": "用“岗位要求”思维读定语从句：从句描述的行为，就是空格词必须支持的行为。", "词根": ["**precise**　精确的（pre 先+cis 切=预先切准）"], "逻辑": "定语从句 that snake into the body 是器械的“岗位要求” → 空格词必须支持这个行为 → 能蛇行钻小孔=柔软灵活。用“岗位要求”思维读定语从句。", "翻译": "为了切得更温和，医生越来越依赖内窥镜手术——用摄像头和柔韧的器械取代大手术刀和钳子，这些器械能从小孔里蛇行进入身体。"}}, {"type": "q", "tag": "真题", "title": "习题集 第21页 第3题（双空题）", "source": "despite + 省略 that 的定语从句", "pause": true, "dual": true, "stem": [{"t": "Despite the scathing precision with which she satirizes the lives of social aspirants and moneyed folk, the writer appears to ______ being part of the world she presents as so ______."}], "vocab": [{"w": "scathing", "g": "激烈、尖刻、毫不留情的", "story": "形容措辞。"}, {"w": "satirize", "g": "讽刺", "story": ""}, {"w": "social aspirants", "g": "想提高社会地位的人", "story": "aspire=有志向；social aspirant=攀高枝的人。"}, {"w": "moneyed folk", "g": "有钱人", "story": "folk=people。"}, {"w": "present as", "g": "描绘成、表现成", "story": "present 接 as=把…描绘成…。"}, {"w": "abhor", "g": "厌恶、反感", "story": "hor=害怕（horror/horrible）：怕蜘蛛→厌恶蜘蛛。"}, {"w": "relish", "g": "享受、喜欢", "story": "=enjoy。"}, {"w": "evoke", "g": "唤起、激起", "story": "激起情绪、唤起记忆。"}, {"w": "insufferable", "g": "让人无法忍受的", "story": "suffer 忍受→in-不+能忍。"}, {"w": "enchanting", "g": "迷人的", "story": "enchant 施魔法：着魔→迷人。讽刺的人嘴上不会说它迷人。"}], "options": {"i": {"A": "abhor", "B": "relish", "C": "evoke"}, "ii": {"D": "unattainable", "E": "insufferable", "F": "enchanting"}}, "answer": "iB,iiE", "explain": {"思路": "空1：despite 转折——表面上讽刺（不喜欢）→实际上 relish 喜欢 B。空2：句尾是省略 that/which 的定语从句：the world (that) she presents as so __——问的是作者**嘴上把世界描绘成什么样**；作者嘴上在讽刺=说世界不好→贬义 E insufferable（不是 F enchanting：讽刺的人不会把世界说得迷人）。", "annot": "空1：<span class='m2'>despite</span> <span class='m3'>讽刺（表面不喜欢）</span> → 实际<span class='m4'>relish 喜欢</span>。空2：定语从句问的是<span class='m3'>嘴上描绘的世界</span> → <span class='m4'>贬义 insufferable</span>。", "辨析": "错选 F 的人以为 despite 之后要填褒义——但空格在“她描绘的”世界里，不是世界真实的样子。**表面态度 vs 实际态度**差一个定语从句。", "点拨": "题干末尾不完整（presents as so __）时，先补全从句再读：the world WHICH she presents as so __。", "词根": ["**insufferable**　in（不）+suffer（忍）+able → 难以忍受", "**abhor**　ab（离）+hor（怕，horror 同源）→ 怕而远之=厌恶", "**evoke**　e（出）+vok（喊）→ 喊出来=唤起", "**unattainable**　un+at（向）+tain（拿）→ 够不着"], "逻辑": "先抓 despite → 表面讽刺（不喜欢）vs 实际喜欢 → 空1=享受；空2 注意句尾是省略 that 的定语从句“她（嘴上）所描绘的世界” → 问的是嘴上态度 → 讽刺=说世界不好 → 贬义。表面 vs 实际，差一个定语从句。", "翻译": "尽管她讽刺上流新贵和有钱人的生活时一针见血、毫不留情，这位作家似乎却很享受成为其中一员——对她所描绘的那个如此令人难以忍受的世界乐在其中。"}}, {"type": "q", "tag": "真题", "title": "习题集 第36页 第1题（单空题）", "source": "并列定语从句的双 think of as 结构", "pause": true, "stem": [{"t": "The idea of a language instinct may seem ______ to those who think of language as the zenith of the human intellect and of instincts as brute impulses."}], "vocab": [{"w": "instinct", "g": "本能、直觉", "story": ""}, {"w": "zenith", "g": "顶峰、顶点、最高点", "story": ""}, {"w": "brute", "g": "野蛮的、蛮干的", "story": "brute force 蛮力。"}, {"w": "impulse", "g": "冲动", "story": "impulse buying 冲动消费（超市大减价买一堆用不上的）。"}, {"w": "jarring", "g": "令人不悦的、刺耳的", "story": "拟声词“兹儿兹儿”刺耳声→刺耳→让人不舒服。"}, {"w": "plausible", "g": "合理的", "story": "**别记“貌似合理”**！=合理的：说法听上去靠谱可能成立。记“貌似”会让你脑补“实际不合理”而做错题。"}, {"w": "gratifying", "g": "令人高兴的、满意的", "story": "grat=pleasing：grateful 感激的，本义=高兴→感激。"}, {"w": "inevitable", "g": "必然的、无法避免的", "story": ""}, {"w": "conciliatory", "g": "安抚的、和解的、妥协的", "story": "council 委员会本义=商量商议：conciliatory=愿意商量的态度=不强硬（哄你吃饭 vs 摔碗）。"}], "options": {"A": "jarring", "B": "plausible", "C": "gratifying", "D": "inevitable", "E": "conciliatory"}, "answer": "A", "explain": {"思路": "①句子结构：两个并列定语从句 think of language AS the zenith AND (think) of instincts AS brute impulses——第二个 think 省略；②在那些人心目中：语言=人类智慧顶峰，本能=野蛮冲动——最厉害+最不厉害；③“语言本能”把两者结合→那些人必然觉得这个思想有问题→贬义 A jarring。", "annot": "定语从句里 <span class='m3'>语言=最厉害</span> + <span class='m3'>本能=最不厉害</span> → “语言本能”结合两者 → 在他们看来<span class='m4'>别扭 jarring</span>。", "辨析": "B plausible 合理是褒义；C 高兴、D 必然、E 安抚都不含“无法接受”。看到 and of…as 要反应过来=think of…as 的并列省略。", "点拨": "plausible 只记“合理”——英汉字典的“貌似合理”是 poison（自带反转暗示），老师特别提醒。", "词根": ["**jarring**　jar（刺耳声）+ing → 刺耳=令人不悦", "**plausible**　plaus（鼓掌）+ible → 值得鼓掌=貌似合理", "**gratifying**　grat（高兴，grateful 同源）+ify+ing → 令人满意", "**inevitable**　in（不）+evit（避免）+able → 躲不开=必然", "**conciliatory**　con（一起）+cili（召集，council 同源）→ 愿意商量=和解"], "逻辑": "句子结构=两个并列定语从句：语言=最高智慧，本能=最低级 → 把最厉害和最不厉害的捏成一个词 → 那些人必觉得别扭 → 选贬义（刺耳）。并列结构对等原则帮你切分长句。", "翻译": "“语言本能”这个观念，在那些认为语言是人类智慧顶峰、而本能只是蛮力冲动的人听来，恐怕是刺耳的。"}}, {"type": "q", "tag": "真题 · 难题", "title": "习题集 第45页 第1题（单空题）", "source": "seldom=not；定语从句的逆向推理", "pause": true, "stem": [{"t": "Though humanitarian emergencies are frequent features of television news, such exposure seldom ______ the public, which rather seems resigned to a sense of impotency."}], "vocab": [{"w": "humanitarian", "g": "人道主义的", "story": "humanitarian emergency=人道主义危机。"}, {"w": "feature", "g": "（新闻的）主题、报道", "story": "接 television news：新闻报道的主题。"}, {"w": "exposure", "g": "报道", "story": "跟在新闻后=报道。"}, {"w": "resigned", "g": "逆来顺受的、接受的", "story": "resign 本义=放弃→辞职→放弃抵抗→（对不喜欢又没办法的事）接受：不喜欢背单词但不得不背=resigned。"}, {"w": "impotency", "g": "无能为力", "story": ""}, {"w": "paralyze", "g": "使不知所措（GRE）；使瘫痪（本义）", "story": "吓得呆住跟瘫痪一样。"}, {"w": "demoralize", "g": "使沮丧、使士气低落", "story": "morale 士气。"}, {"w": "assuage", "g": "安抚", "story": ""}, {"w": "galvanize", "g": "激励、鼓舞", "story": "人名 Galvani（加凡尼）：给青蛙腿通电发现肌肉收缩→通电→电镀→激励。"}, {"w": "exasperate", "g": "激怒", "story": "把别人惹毛。"}], "options": {"A": "paralyze", "B": "demoralize", "C": "assuage", "D": "galvanize", "E": "exasperate"}, "answer": "D", "explain": {"思路": "①seldom=not（否定词）；②定语从句：公众 resigned to impotency（自认无能为力）→新闻不能让他们觉得自己“有能力”；③seldom 已是否定→空格填“让他觉得有能力”=激励 D galvanize。", "annot": "<span class='m2'>seldom</span>=not ⇒ 空格=<span class='m4'>“使其有能力”</span>（公众自认 <span class='m3'>impotency 无能</span>，新闻激励不了他们）。", "辨析": "代入闭环：不管怎么报道危机都激励不了公众采取行动——因为公众觉得“我什么都做不了”。A 不知所措、B 泄气、C 安抚、E 激怒都不与“无能感”构成反义。", "点拨": "做填空 seldom 直接当 not 用（只看同反，不用翻“很少”）。定语从句说公众的特性，空格就填它的反面——这是“逆向使用”从句的样本。", "词根": ["**exasperate**　ex+asper（rough 粗糙→惹毛）+ate：英文解释更具体——by CONTINUING to do something that upsets them（持续做惹恼对方的事）。It exasperates me"], "逻辑": "seldom=否定词（直接当 not 用） → 新闻报道“不能”让公众怎样；定语从句说公众 resigned to impotency（自认无能） → 空格=“让其有能力”=激励。否定词+定语从句，一正一反夹出答案。", "翻译": "人道主义危机虽然是电视新闻的常客，但这种报道很少能激励公众——公众反倒像是已经接受了自己的无能为力。"}}, {"type": "teach", "title": "③ 举例子：such as / for instance → 前后相同", "ppt": ["例子是解释的一种 → 例与前文同义"], "text": ["举例子的作用就是解释——说了一个东西别人不懂，举个例子。所以 such as / for instance / for example 后面的内容与前文意思相同。", "**看清空格修饰谁**（44-9 的坑）：空格可能修饰的不是你第一反应的那个词。"]}, {"type": "q", "tag": "真题", "title": "习题集 第44页 第9题（六选二）", "source": "such as 前后相同 + 修饰对象辨析", "pause": true, "multi": true, "stem": [{"t": "In IE culture, elaborate carving has often been used to enhance ______ objects such as harpoon heads and other tools."}], "vocab": [{"w": "elaborate", "g": "精细的、精美的", "story": "e+labor：通过劳动做出来的→下了功夫。"}, {"w": "carving", "g": "雕刻", "story": ""}, {"w": "harpoon", "g": "鱼叉", "story": "解题不用认识。"}, {"w": "utilitarian / functional", "g": "实用的", "story": "utility/function 功能→有功能有用途的=实用。"}, {"w": "domestic", "g": "国内的；家用的", "story": "domestic appliances 家用电器。"}, {"w": "decorative / ornamental", "g": "装饰的", "story": "ornament 装饰品。"}, {"w": "manufactured", "g": "生产出来的", "story": ""}], "options": {"A": "utilitarian", "B": "functional", "C": "domestic", "D": "decorative", "E": "manufactured", "F": "ornamental"}, "answer": "AB", "explain": {"思路": "①such as 举例前后相同：例子=harpoon heads and other tools（工具）→空格修饰的 objects 应=“实用”的东西；②选一对 A utilitarian + B functional。", "annot": "<span class='m2'>such as</span> <span class='m3'>工具</span> ⇒ objects=<span class='m4'>实用的</span> → A+B。", "辨析": "最大坑：看到 elaborate carving 就选 decorative/ornamental——但**空格修饰的是 objects，不是 carving**！题目没问雕刻干嘛，问被装饰的那些物品有什么特点。", "点拨": "动笔前问自己：这个空格到底在修饰谁？对象看错，全盘皆输。", "词根": ["**utilitarian**　util（用，use）+itarian → 讲实用", "**functional**　function（功能）+al → 有功能=实用", "**domestic**　dom（家）+estic → 家庭的/国内的", "**decorative**　decor（装饰）+ative → 装饰的", "**manufactured**　manu（手）+fact（做）→ 手工做出来=制造", "**ornamental**　ornament（装饰品）+al → 装饰的"], "逻辑": "抓 such as → 例子与前面同向 → 例子是“工具” → 空格修饰的 objects 属于实用一类。先问一句：空格到底修饰谁？——是 objects 不是 carving，看偏就完了。", "翻译": "在 IE 文化中，精美的雕刻常被用来提升实用器物——比如鱼叉头和其他工具。"}}, {"type": "q", "tag": "真题", "title": "习题集 第39页 第3题（双空题）", "source": "contrary to + for instance 双线索", "pause": true, "dual": true, "stem": [{"t": "Contrary to those who fear the impact of invasive species on native plants, the biologists contend that the threat posed to biodiversity by nonnative plants is often ______; for instance, a study of one nonnative plant thriving in the forest found that its abundance in forest plots is not ______ the number of other species there."}], "vocab": [{"w": "invasive species", "g": "入侵物种", "story": "invade 入侵。"}, {"w": "contend", "g": "声称、主张", "story": "简单翻译=说。"}, {"w": "pose a threat", "g": "构成威胁", "story": "pose=带来、构成。"}, {"w": "thrive", "g": "（植物）生长茂盛", "story": "本义繁荣发展。"}, {"w": "abundance", "g": "多、大量", "story": ""}, {"w": "plot", "g": "一小块土地", "story": "forest plot=一小块森林。"}, {"w": "exaggerated", "g": "被夸大的", "story": "exaggerate 夸张。"}, {"w": "subtle", "g": "不明显的", "story": "≠obvious。"}, {"w": "related", "g": "相关的", "story": ""}], "options": {"i": {"A": "uniform", "B": "exaggerated", "C": "subtle"}, "ii": {"D": "sustained", "E": "related", "F": "consistent"}}, "answer": "iB,iiE", "explain": {"思路": "空1：contrary to 对比——那些人 fear（觉得威胁大）→生物学家说威胁“小”；选 B exaggerated（被夸大了=实际没那么大）。空2：for instance 前后相同——威胁小→不减少其他物种数量→E related（两者数量不相关=互不影响）。", "annot": "空1：<span class='m2'>contrary to</span> <span class='m3'>fear 害怕威胁大</span> → 威胁<span class='m4'>被夸大 exaggerated</span>。空2：<span class='m2'>for instance</span> 同向 → <span class='m4'>not related 互不相关</span>。", "辨析": "C subtle 是大坑：“威胁不明显”≠威胁小——大威胁也可能不明显（GRE 很难但难得不明显？还是很简单但看不出来？都有可能）。exaggerated=明确说“实际比说的小”。空2没有“减少”这个选项，选 related（数量无关=该多多少还是多少=不受威胁）是变通取反。", "点拨": "GRE 难度对比句是经典辨析素材：说“难度被夸大”=实际没那么难（有方向）；说“难度不明显”=不知道难不难（无方向）。选选项要选**有方向**的那个。", "词根": ["**exaggerated**　ex（出）+agger（堆）+ate+d → 堆过头=夸大", "**related**　re（回）+lat（带）→ 带回到一起=相关", "**uniform**　uni（一）+form（形）→ 一个模子=一致", "**subtle**　sub（下）+tle → 藏在下面=不明显", "**consistent**　con（一起）+sist（站）→ 站在一起=一致"], "逻辑": "空1 抓 contrary to → 前人“担心威胁大” → 生物学家说威胁“被夸大”=实际没那么大；空2 抓 for instance → 与上一句同向 → 威胁小=不减少其他物种=数量不相关。信号词分工明确，逐空做。", "翻译": "与那些担心外来物种影响本地植物的人相反，生物学家声称非本地植物对生物多样性的威胁往往被夸大了；例如一项研究发现，森林中某种茂盛的外来植物，其数量与其他物种的数量并不相关。"}}, {"type": "q", "tag": "真题", "title": "习题集 第42页 第3题（双空题）", "source": "for instance 相同 + purport/design 辨析", "pause": true, "dual": true, "stem": [{"t": "The author of this travel guide ______ to show readers Cairo as it really is, but his information is not reliable: for instance, his geography is ______, with one walking tour covering areas of the city that are 20 miles apart."}], "vocab": [{"w": "purport", "g": "声称、号称", "story": "真假不一定。"}, {"w": "forbear", "g": "克制、忍住不做", "story": "bear 忍受+for-加强。"}, {"w": "design to do", "g": "想要、试图做（熟词僻义）", "story": "design 后接不定式=想要做某事。"}, {"w": "erratic", "g": "不可靠的、反复无常的", "story": "err=漫游：error 乱窜偏离正轨→手表走时 erratic 一会儿快一会儿慢。"}, {"w": "erudite", "g": "博学的", "story": "e-(out)+rud（粗鲁，同根 rude）：从粗鄙中出来→不粗鄙→有学问。"}, {"w": "extensive", "g": "大范围的", "story": ""}], "options": {"i": {"A": "purports", "B": "forbears", "C": "designs"}, "ii": {"D": "erratic", "E": "erudite", "F": "extensive"}}, "answer": "iA,iiD", "explain": {"思路": "空2：for instance 前后相同——信息不可靠→地理 erratic D。空1：A purport（声称）vs C design（想要）——声称可真可假，想要必是真心；后文证据：步行游览竟覆盖相隔 20 英里（≈32 公里≈3/4 马拉松）的两个地方——如此荒唐的低级错误，真心想写好的人不可能发现不了→作者没认真写→不是真心→purport A。", "annot": "空2：<span class='m2'>for instance</span> 同向 → <span class='m4'>erratic 不可靠</span>。空1：步行 32 公里的荒唐错误 → 没认真写 → <span class='m4'>purport 声称（吹牛）</span> ≠design 真心想。", "辨析": "purport vs design 的辨析与第5讲 assert vs concede 同构：**可真可假 vs 必为真心**。判断依据永远藏在后半句的证据里。", "点拨": "把 miles 换算成生活概念（20 英里≈32 公里≈四分之三个马拉松）——长度单位换算能力在做题时用得上。", "词根": ["**purports**　pur（前）+port（拿）→ 拿到前面来说=声称", "**erratic**　err（漫游）+atic → 乱走=飘忽不可靠", "**forbears**　for（前）+bear（忍受）→ 克制忍住", "**designs**　de（下）+sign（记号）→ 定下计划；design to do=想要", "**erudite**　e（出）+rud（粗，rude 同源）→ 脱离粗鄙=博学", "**extensive**　ex（出）+tens（伸）+ive → 伸得开=广泛"], "逻辑": "空2 先抓 for instance → 同向：信息不可靠 → 地理“错漏百出”；空1 号称 vs 想要：证据是 20 英里≈32 公里≈四分之三个马拉松——步行游览走这么远是荒唐的低级错误 → 作者没认真写 → 只是“号称”。把英里换算成生活概念，破绽自现。", "翻译": "这本旅行指南的作者号称向读者展现真实的开罗，但他的信息不可靠：比如他的地理部分错漏百出——一个步行游览竟覆盖了城中相距 20 英里的两个地方。"}}, {"type": "teach", "title": "④ 打比方：like / much as → 前后相同", "ppt": ["“就像”前后两种情况特点一致"], "text": ["“就像”是最好认的同义信号：题目说 A 像 B，A 和 B 的特点必然一致。空格在 A 侧，就去 B 侧找特点；反之亦然。注意：有的题 although 只是烟雾弹，真正的解题线索是 like（86-10）。"]}, {"type": "q", "tag": "真题", "title": "习题集 第137页 第9题（六选二）", "source": "much as 打比方", "pause": true, "multi": true, "stem": [{"t": "An abundance of nutrient-rich pollution in estuaries causes algae to ______, much as house plants grow better when their soil contains added fertilizer."}], "vocab": [{"w": "estuary", "g": "河流入海口", "story": "解题不用认识。"}, {"w": "algae", "g": "藻类", "story": "alga 的复数。"}, {"w": "abound", "g": "变多", "story": "abundance 的动词。"}, {"w": "proliferate", "g": "增多、增殖", "story": ""}, {"w": "stagnate", "g": "停滞", "story": "停滞不前。"}, {"w": "coalesce", "g": "合并、结合", "story": "合到一起。"}, {"w": "collect（不及物）", "g": "聚集", "story": "及物=收集；不及物=聚到一起。"}, {"w": "diversify", "g": "变多样", "story": ""}], "options": {"A": "abound", "B": "proliferate", "C": "stagnate", "D": "coalesce", "E": "collect", "F": "diversify"}, "answer": "AB", "explain": {"思路": "①much as=就像→前后两种情况一致；②B 侧：土壤加化肥→house plants grow better 长得更好；③A 侧：入海口的藻类+营养丰富污染物→也填“长得更好”=变多→A abound + B proliferate。", "annot": "<span class='m2'>much as</span> ⇒ 类比：化肥→<span class='m3'>植物长得更好</span> → 营养污染物→藻类<span class='m4'>变多 abound/proliferate</span>。", "辨析": "C 停滞、D 合并、F 变多样都不是“长更好”；E 聚集≠数量增长。", "点拨": "打比方题=双侧对照读：先把“像”后面的已知侧翻译成人话，再往空格侧套。", "词根": ["**abound**　ab（向）+und（波）→ 浪潮滚滚=大量存在", "**proliferate**　pro（向前）+life（生）→ 激增", "**stagnate**　stag（站）+nate → 站住不动=停滞", "**coalesce**　co（一起）+alesc（长）→ 长到一块=合并", "**diversify**　di（分开）+vers（转）→ 转出花样=多样化"], "逻辑": "抓 much as=“非常像” → 打比方前后一致 → 化肥让植物 grow better → 营养污染物让藻类“变多”。打比方题=双侧对照读，先把“像”后面的已知侧翻译成人话。", "翻译": "河口湾里富含营养的污染物大量增多，使得藻类随之暴增——就像家养植物在土壤里加了肥料之后长得更好一样。"}}, {"type": "q", "tag": "真题", "title": "习题集 第86页 第10题（六选二）", "source": "like 打比方；although 只是烟雾弹", "pause": true, "multi": true, "stem": [{"t": "Although in his new book he tends to repeat himself like a ______ uncle, MH nevertheless makes a persuasive case for the safety of tinkering with genes to create new foods."}], "vocab": [{"w": "make a persuasive case", "g": "给出强有力的理由", "story": "case 熟词僻义=理由：make a case for 支持；make a case against 反驳。"}, {"w": "tinker with", "g": "修改、动手脚", "story": ""}, {"w": "taciturn", "g": "沉默寡言的", "story": ""}, {"w": "reserved", "g": "矜持的、沉默的", "story": "有所保留：十分只说五分→话少。"}, {"w": "prototypical", "g": "典型的", "story": "=typical。"}, {"w": "garrulous / loquacious", "g": "话多的、啰嗦的", "story": "本题一对答案。"}, {"w": "contemptuous", "g": "暴躁的、脾气坏的", "story": ""}], "options": {"A": "taciturn", "B": "reserved", "C": "prototypical", "D": "garrulous", "E": "loquacious", "F": "contemptuous"}, "answer": "DE", "explain": {"思路": "①真正的解题线索是 like 打比方：repeat himself（不断重复自己）=话多啰嗦→D garrulous + E loquacious；②although 只是烟雾弹——转折体现在感情色彩上（前半贬：写书啰嗦；后半褒：理由有说服力），并不帮你选选项。", "annot": "<span class='m2'>like</span> <span class='m3'>repeat himself 重复自己</span> ⇒ 像<span class='m4'>话多的大叔 garrulous/loquacious</span>。", "辨析": "A+B 沉默寡言与“重复自己”相反；C 典型、F 暴躁无关。整句=汉语“写书话糙理不糙”。", "点拨": "信号词也有优先级：like（必然同义）> although（此处只是语气反转）。别见到转折词就硬用。", "词根": ["**garrulous**　garr（唠叨）+ulous → 话多", "**loquacious**　loqu（说）+acious → 话       tno++;
      return `<div class="card"><div class="chead"><span class="no">讲解 ${tno}</span><h3>${c.title}</h3></div>
        <div class="pptbox">${c.ppt.map(x=>`<b>▎</b>${x}<br>`).join('')}</div>
        <div class="tbody">${c.text.map(t=>`<p>${md(t)}</p>`).join('')}</div></div>`;
    }
    qno++;
    const st = p.q && p.q[ci];
    const vocab = c.vocab ? `<div class="vocabbox"><div class="vhead">📖 课前讲词（老师逐词讲解，先过一遍再做题）</div>${
      c.vocab.map(v=>`<div class="vitem"><span class="vw">${v.w}</span><span><span class="vg">${v.g}</span>${v.story?`<div class="vs">${v.story}</div>`:''}</span></div>`).join('')
    }</div>` : '';
    return `<div class="card" id="q${ci}"><div class="chead">
        <span class="no">题 ${qno}</span>
        <span class="tag ${c.demo?'demo':''}">${c.tag}</span><h3>${c.title}</h3>
        <span class="src">${c.source||''}</span></div>
      ${c.pause&&!st?'<div class="pausebar"><span class="dot"></span>⏸ 课堂节奏点：题干没有批注，像考场一样读题。先在心里选出答案，再点下面的选项。</div>':''}
      ${c.demo?'<div class="pausebar" style="background:#fdf2e9;border-color:#f5cba7;color:#a05a1c">👀 题型演示：认认长相即可，答案和详解在后面。</div>':''}
      ${vocab}
      <div class="stem">${plainStem(c.stem)}</div>
      <div id="optbox${ci}"></div>
      <div class="analysis" id="ana${ci}" style="display:none"></div>
    </div>`;
  }).join('');
  const qTotal = les.cards.filter(c=>c.type==='q'&&!c.demo).length;
  const qDone = p.q ? Object.keys(p.q).length : 0;
  MAIN.innerHTML = `
    <div class="lesson-head"><h1>${les.title}</h1><p>${les.intro}</p>
      <div class="lesson-progress">本讲进度：非演示题已完成 ${qDone}/${qTotal}</div></div>
    ${cards}
    <details class="raw"><summary>🎙 课堂原声全文（本讲转录稿，查漏兜底）</summary><div class="rawtext">${les.transcript||''}</div></details>
    <div class="card finish" id="finishbox">
      ${p.done ? '<span class="done-badge">✅ 本讲已完成</span>'
               : `<button onclick="finishLesson()">我已完成本讲学习</button>`}
      <div style="margin-top:10px;color:#999;font-size:12px">完成全部题目后点击标记完成；进度保存在本机浏览器</div>
    </div>`;
  les.cards.forEach((c,ci)=>{ if (c.type==='q'){ renderOptions(c,ci); if (p.q && p.q[ci]) reveal(c,ci,p.q[ci],false); } });
  renderNav();
}

function renderOptions(c,ci){
  const box = document.getElementById('optbox'+ci);
  const isDual = !!c.dual;
  let html = '';
  if (isDual){
    for (const g of ['i','ii']){
      html += `<div class="grp"><div class="glabel">${g==='i'?'Blank (i)':'Blank (ii)'}</div><div class="opts">` +
        Object.entries(c.options[g]).map(([k,v])=>`<button class="opt" data-g="${g}" data-k="${k}" id="o${ci}_${g}${k}"><span class="ol">${k}</span>${v}</button>`).join('') + `</div></div>`;
    }
    html += `<button class="submit" id="sub${ci}" disabled>提交答案</button>`;
  } else {
    html += '<div class="opts">' + Object.keys(c.options).map(k=>`<button class="opt" data-k="${k}" id="o${ci}_${k}"><span class="ol">${k}</span>${c.options[k]}</button>`).join('') + '</div>';
  }
  box.innerHTML = html;
  const btns = [...box.querySelectorAll('.opt')];
  if (isDual){
    const sel = {};
    btns.forEach(b=>b.onclick=()=>{
      const g=b.dataset.g;
      btns.filter(x=>x.dataset.g===g).forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); sel[g]=b.dataset.k;
      document.getElementById('sub'+ci).disabled = !(sel.i&&sel.ii);
    });
    document.getElementById('sub'+ci).onclick = ()=>{ if (sel.i&&sel.ii) submit(c,ci,[sel.i,sel.ii]); };
  } else if (c.multi){
    const need = c.pickN || 2;
    const sel = new Set();
    const sub = document.createElement('button');
    sub.className='submit'; sub.id='sub'+ci; sub.textContent='提交答案'; sub.disabled=true;
    box.appendChild(sub);
    btns.forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if (sel.has(k)){ sel.delete(k); b.classList.remove('sel'); }
      else if (sel.size<need){ sel.add(k); b.classList.add('sel'); }
      sub.disabled = sel.size!==need;
    });
    sub.onclick = ()=>{ if (sel.size===need) submit(c,ci,[...sel].sort()); };
  } else {
    btns.forEach(b=>b.onclick=()=>submit(c,ci,[b.dataset.k]));
  }
}

function isCorrect(c, chosen){
  if (c.dual){
    const norm = c.answer.replace(/[^A-Z]/g, '');
    return chosen.slice().sort().join('') === [...norm].sort().join('');
  }
  return (c.answer.length===1) ? chosen[0]===c.answer : chosen.slice().sort().join('') === [...c.answer].sort().join('');
}

function submit(c,ci,chosen){
  const prev = (pOf(cur).q||{})[ci];
  if (prev) return;
  const ok = isCorrect(c,chosen);
  if (!progress[cur]) progress[cur] = { q:{} };
  progress[cur].q[ci] = { ok, pick: chosen.slice() };
  save(); reveal(c,ci,progress[cur].q[ci],true);
  renderNav(); updateHead();
}

function reveal(c,ci,st,animate){
  if (c.dual){
    const pick = st.pick || [];
    ['i','ii'].forEach(g=>{
      Object.keys(c.options[g]).forEach(k=>{
        const b=document.getElementById(`o${ci}_${g}${k}`); if(!b) return;
        b.classList.add('lock');
        if (c.answer.includes(g+k)) b.classList.add('ok');
        else if (pick.includes(k)) b.classList.add('bad');
      });
    });
  } else {
    const ans = [...c.answer];
    Object.keys(c.options).forEach(k=>{
      const b=document.getElementById(`o${ci}_${k}`); if(!b) return;
      b.classList.add('lock');
      if (ans.includes(k)) b.classList.add('ok');
      else if ((st.pick||[]).includes(k)) b.classList.add('bad');
    });
  }
  const sub=document.getElementById('sub'+ci); if(sub) sub.style.display='none';
  const ex=c.explain;
  const ana=document.getElementById('ana'+ci);
  const ansTxt = c.dual ? `Blank(i) 选 ${c.answer.match(/i([A-Z])/)[1]}　Blank(ii) 选 ${c.answer.match(/ii([A-Z])/)[1]}` : [...c.answer].join('、');
  const yourTxt = (st.pick||[]).join('、');
  ana.innerHTML = `
    <div class="ans-line">正确答案：<span class="ok">${ansTxt}</span>
      ${st.ok===false?`　你的选择：<span class="bad">${yourTxt}</span>　<span style="color:#e67e22;font-size:13px">已记入错题，建议重做一次</span>`:''}</div>
    <div class="ablock"><div class="atitle">① 句子逻辑梳理（先抓信号词，理清逻辑链）</div><div class="acont">${md(ex['逻辑'])}</div></div>
    <div class="ablock"><div class="atitle">② 全题翻译</div><div class="acont" style="background:#f8fafd;border:1px solid #e3e9f5;border-radius:8px;padding:10px 14px;">${md(ex['翻译'])}</div></div>
    <div class="ablock"><div class="atitle">③ 解题思路（四步法）</div><div class="acont">${md(ex['思路'])}</div></div>
    <div class="ablock"><div class="atitle">④ 题干批注拆解</div>
      <div class="annotbox">${ex.annot}</div>
      <div class="legend">图例：<i style="background:#dbe7ff"></i>对应双方 <i style="background:#ffe0b3"></i>信号词 <i style="background:#d9f2e1"></i>已知线索 <i style="background:#ffd9d9"></i>推导结果 <s>灰色划线=干扰</s></div></div>
    <div class="ablock"><div class="atitle">⑤ 选项辨析</div><div class="acont">${md(ex['辨析'])}</div></div>
    <div class="ablock"><div class="atitle">⑥ 老师点拨</div><div class="acont">${md(ex['点拨'])}</div></div>
    ${ex['词根'] && ex['词根'].length ? `<div class="ablock"><div class="atitle">⑦ 词根解析（用词根法重新记住这些词）</div><div class="acont" style="background:#f5f2fe;border:1px solid #e0d8f5;border-radius:8px;padding:10px 14px;">${ex['词根'].map(x=>`<div style="margin-bottom:6px;line-height:1.9">${md(x)}</div>`).join('')}</div></div>` : ''}`;
  ana.style.display='block';
  if (animate) ana.scrollIntoView({behavior:'smooth', block:'start'});
}

function updateHead(){
  const les=L(cur); const p=pOf(cur);
  const qTotal=les.cards.filter(c=>c.type==='q'&&!c.demo).length;
  const qDone=p.q?Object.keys(p.q).length:0;
  const el=document.querySelector('.lesson-progress');
  if(el) el.textContent=`本讲进度：非演示题已完成 ${qDone}/${qTotal}`;
}
function finishLesson(){
  if(!progress[cur]) progress[cur]={q:{}};
  progress[cur].done=true; save(); renderLesson(); window.scrollTo({top:0});
}
function resetProgress(){
  if(confirm('确定清空所有学习记录？')){ progress={}; save(); renderLesson(); }
}
function loadLesson(id){ cur=id; renderLesson(); window.scrollTo({top:0}); }

renderLesson();
</script>
</body>
